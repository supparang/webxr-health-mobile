<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>JumpDuck Classroom v25</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07111f;color:#fff}button{font:inherit}.screen{position:fixed;inset:0;display:grid;place-items:center;padding:18px}.hidden{display:none!important}.card{width:min(520px,94vw);background:rgba(255,255,255,.96);color:#12352f;border:4px solid #facc15;border-radius:28px;padding:26px;text-align:center;box-shadow:0 20px 50px #0005}.duck{font-size:64px}.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#d1fae5;color:#047857;font-size:12px;font-weight:900}h1{margin:12px 0 6px;font-size:42px;line-height:1;color:#059669}.muted{color:#64748b;font-weight:700}.primary{width:100%;min-height:62px;border:0;border-radius:20px;background:linear-gradient(90deg,#10b981,#06b6d4);color:#fff;font-size:20px;font-weight:900;box-shadow:0 9px 0 #047857;cursor:pointer}.primary:active{transform:translateY(5px);box-shadow:0 4px 0 #047857}.arena{position:fixed;inset:0;background:linear-gradient(180deg,#bae6fd,#d9f99d 60%,#86efac);overflow:hidden}.hud{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}.pill{background:#fff;color:#0f172a;border-radius:16px;padding:10px 14px;font-weight:900;box-shadow:0 8px 20px #0002}.lane{position:absolute;left:50%;top:15%;bottom:28%;width:5px;transform:translateX(-50%);border-left:5px dashed #ffffffaa}.hero{position:absolute;left:50%;bottom:29%;transform:translateX(-50%);font-size:72px;transition:.12s}.hero.jump{bottom:48%}.hero.duck{transform:translateX(-50%) scaleY(.55)}.hero.left{left:28%}.hero.right{left:72%}.mission{position:absolute;left:50%;top:24%;transform:translateX(-50%);width:min(560px,92vw);background:#fff;color:#0f172a;border:4px solid #34d399;border-radius:26px;padding:20px;text-align:center;box-shadow:0 16px 40px #0003}.mission .emoji{font-size:58px}.mission h2{margin:3px 0;font-size:42px}.progress{height:14px;border-radius:999px;background:#e2e8f0;overflow:hidden}.progress i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#10b981,#06b6d4)}.pad{position:absolute;z-index:6;left:10px;right:10px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pad button{min-height:68px;border:0;border-radius:18px;background:#fff;color:#0f172a;font-weight:900;font-size:17px;box-shadow:0 7px 0 #94a3b8}.pad button:active{transform:translateY(4px);box-shadow:0 3px 0 #94a3b8}.count{font-size:110px;font-weight:1000;color:#047857}.resultGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{padding:16px;border-radius:18px;background:#f0fdf4}.stat b{display:block;font-size:34px;color:#047857}@media(max-width:640px){h1{font-size:34px}.mission{top:18%;padding:14px}.mission h2{font-size:34px}.mission .emoji{font-size:46px}.hero{font-size:58px}.pad button{min-height:62px;font-size:14px}}
</style>
</head>
<body>
<section id="intro" class="screen"><div class="card"><div class="duck">🦆</div><span class="badge">CLASSROOM ONE-CLICK • STABLE MODE</span><h1>JumpDuck Dash</h1><p class="muted">Jump / Duck / Left / Right • Easy • 60 วินาที</p><p class="muted">ไม่ต้องตั้งค่าและไม่รอโหลด AI</p><button id="start" class="primary">▶ เริ่มเกม</button></div></section>
<section id="countdown" class="screen hidden"><div class="card"><div class="count" id="count">3</div><p class="muted">เตรียมพร้อมและเว้นพื้นที่รอบตัว</p></div></section>
<main id="arena" class="arena hidden">
<div class="hud"><div class="pill">คะแนน <span id="score">0</span></div><div class="pill">เวลา <span id="time">60</span>s</div></div>
<div class="lane"></div><div id="hero" class="hero">🧍</div>
<section class="mission"><div id="emoji" class="emoji">⬆️</div><h2 id="word">JUMP</h2><div id="thai">กระโดด</div><div class="progress"><i id="bar"></i></div></section>
<nav class="pad"><button data-act="jump">⬆️ Jump</button><button data-act="duck">⬇️ Duck</button><button data-act="left">⬅️ Left</button><button data-act="right">➡️ Right</button></nav>
</main>
<section id="result" class="screen hidden"><div class="card"><div class="duck">🏆</div><h1>จบภารกิจแล้ว</h1><div class="resultGrid"><div class="stat">คะแนน<b id="finalScore">0</b></div><div class="stat">Accuracy<b id="finalAcc">0%</b></div></div><p id="resultText" class="muted"></p><button id="done" class="primary">บันทึกผลและกลับ HeroHealth</button></div></section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),intro=$('intro'),countdown=$('countdown'),arena=$('arena'),result=$('result'),hero=$('hero');
const q=new URLSearchParams(location.search);let score=0,time=60,total=0,hits=0,active=false,target=null,deadline=0,timer=null,missionTimer=null;
const actions={jump:{e:'⬆️',w:'JUMP',t:'กระโดด'},duck:{e:'⬇️',w:'DUCK',t:'หมอบ'},left:{e:'⬅️',w:'LEFT',t:'หลบซ้าย'},right:{e:'➡️',w:'RIGHT',t:'หลบขวา'}};
function choose(){const keys=Object.keys(actions);target=keys[Math.floor(Math.random()*keys.length)];const a=actions[target];$('emoji').textContent=a.e;$('word').textContent=a.w;$('thai').textContent=a.t;deadline=Date.now()+2600;total++;clearInterval(missionTimer);missionTimer=setInterval(()=>{const remain=Math.max(0,deadline-Date.now());$('bar').style.width=(remain/2600*100)+'%';if(remain<=0){clearInterval(missionTimer);score=Math.max(0,score-2);$('score').textContent=score;setTimeout(choose,250)}},50)}
function act(name){if(!active)return;hero.className='hero '+name;setTimeout(()=>hero.className='hero',380);if(name===target&&Date.now()<=deadline){hits++;score+=10;clearInterval(missionTimer);$('score').textContent=score;target=null;setTimeout(choose,280)}}
function begin(){countdown.classList.add('hidden');arena.classList.remove('hidden');active=true;choose();timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)finish()},1000);try{parent.postMessage({type:'HEROHEALTH_GAME_STARTED'},location.origin)}catch(_){}}
function finish(){if(!active)return;active=false;clearInterval(timer);clearInterval(missionTimer);arena.classList.add('hidden');result.classList.remove('hidden');const accuracy=total?Math.round(hits*100/total):0;$('finalScore').textContent=score;$('finalAcc').textContent=accuracy+'%';$('resultText').textContent=`สำเร็จ ${hits} จาก ${total} ภารกิจ`;const payload={completed:true,passed:true,score,accuracy,eventId:`HH-game-fitness-jumpduck-${q.get('studentId')||''}-${Date.now()}`};window.__JUMPDUCK_LAST_RESULT__=payload;try{localStorage.setItem('HHA_JUMPDUCK_LAST_RESULT',JSON.stringify(payload))}catch(_){}try{parent.postMessage({type:'HEROHEALTH_GAME_COMPLETE',payload},location.origin)}catch(_){}}
$('start').onclick=()=>{intro.classList.add('hidden');countdown.classList.remove('hidden');let n=3;$('count').textContent=n;const c=setInterval(()=>{n--;if(n<=0){clearInterval(c);begin()}else $('count').textContent=n},850)};
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('pointerdown',()=>act(b.dataset.act)));
addEventListener('keydown',e=>{const map={ArrowUp:'jump',ArrowDown:'duck',ArrowLeft:'left',ArrowRight:'right',w:'jump',s:'duck',a:'left',d:'right'};if(map[e.key]){e.preventDefault();act(map[e.key])}});
$('done').onclick=()=>{try{parent.postMessage({type:'HEROHEALTH_GAME_COMPLETE',payload:window.__JUMPDUCK_LAST_RESULT__},location.origin)}catch(_){}};
})();
</script>
</body></html>
