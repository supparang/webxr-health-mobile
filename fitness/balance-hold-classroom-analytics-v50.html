<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#dff7ff"><title>Balance Hold</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:#dff7ff}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head><body><iframe id="proxy" title="เกม Balance Hold" allow="camera;microphone;fullscreen;autoplay"></iframe>
<script>
(()=>{'use strict';
const RELEASE='20260808-BALANCE-ANALYTICS-V50-19-NATIVE-RESET-V70';
const q=new URLSearchParams(location.search);
const smoke=/^(1|true|yes)$/i.test(String(q.get('smoke')||q.get('smokeTest')||''))||q.get('gameTestMode')==='1';
const proxy=document.getElementById('proxy');
const target=new URL(smoke?'./balance-hold-ar2.html':'./balance-hold-classroom-analytics-v49.html',location.href);
q.forEach((value,key)=>target.searchParams.set(key,value));
target.searchParams.set('time','90');target.searchParams.set('duration','90');target.searchParams.set('timePolicy','v62');target.searchParams.set('_',Date.now());
if(smoke){target.searchParams.set('balanceRoute','direct-smoke-v70');target.searchParams.set('finishGate','native-v70');target.searchParams.set('bossGate','v63');target.searchParams.set('warmupGate','v61');target.searchParams.set('runtimeStack','native-reset-v70');target.searchParams.set('summaryDomGuard','v65')}
proxy.src=target.href;
let injectTimer=0,completionForwarded=false,booting=false,booted=false;
function gameWindow(){try{if(smoke)return proxy.contentWindow||null;const nested=proxy.contentWindow?.document?.getElementById('game');return nested?.contentWindow||null}catch(_){return null}}
function strictEvidence(){try{const s=gameWindow()?.BH?.state;if(!s)return{valid:false,total:0,results:0,index:0};const total=Array.isArray(s.sequence)?s.sequence.length:0,results=Array.isArray(s.results)?s.results.length:0,index=Number(s.index||0);return{valid:total===6&&results===6&&index===6,total,results,index,phase:String(s.phase||'')}}catch(_){return{valid:false,total:0,results:0,index:0}}}
function addScript(w,src,key){return new Promise((resolve,reject)=>{if(w.document.querySelector(`script[data-${key}]`)){resolve();return}const s=w.document.createElement('script');s.src=new URL(src,w.location.href).href;s.async=false;s.dataset[key]='1';s.onload=()=>resolve();s.onerror=reject;(w.document.head||w.document.documentElement).appendChild(s)})}
async function bootSmoke(w){if(booted||booting)return;booting=true;try{
  await addScript(w,'./bh-smoke-native-runtime-reset-v70.js?v=20260808-v70','bhNativeResetV70');
  for(let i=0;i<80&&!w.BH_SMOKE_NATIVE_RUNTIME_RESET_V70?.ready;i++)await new Promise(r=>setTimeout(r,50));
  if(!w.BH_SMOKE_NATIVE_RUNTIME_RESET_V70?.ready)throw new Error('V70 native reset timeout');
  await addScript(w,'./bh-classroom-time-policy-v62.js?v=20260808-v70','bhTimeV62');
  await addScript(w,'./bh-warmup-gate-v61.js?v=20260808-v70','bhWarmupV61');
  await addScript(w,'./bh-boss-gate-v60.js?v=20260808-v70','bhBossGateV63');
  await addScript(w,'./bh-classroom-mobile-boss-ui-v57.js?v=20260808-v70','bhBossUiV57');
  await addScript(w,'./bh-summary-dom-guard-v65.js?v=20260808-v70','bhSummaryDomV65');
  await addScript(w,'./bh-classroom-summary-passport-v56.js?v=20260808-v70','bhSummaryV56');
  await addScript(w,'./bh-smoke-performance-v59.js?v=20260808-v70','bhSmokePerformanceV63');
  await addScript(w,'./bh-smoke-return-router-v58.js?v=20260808-v70','bhSmokeReturnV58');
  booted=true;w.document.documentElement.dataset.bhRuntimeStack='native-reset-v70';
  console.info('[Balance V70] smoke bootstrap ready: one native completion authority');
}catch(error){console.error('[Balance V70] smoke bootstrap failed',error)}finally{booting=false}}
function bootProduction(){booted=true}
proxy.addEventListener('load',()=>{clearInterval(injectTimer);completionForwarded=false;booted=false;booting=false;let tries=0;injectTimer=setInterval(()=>{tries++;const w=gameWindow();if(!w?.document||!w.BH?.state||typeof w.BH?.completePose!=='function')return;if(smoke)bootSmoke(w);else bootProduction();if(booted||tries>120)clearInterval(injectTimer)},120)});
addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==proxy.contentWindow)return;const m=event.data||{};if(m.type==='HEROHEALTH_GAME_STARTED'){try{parent.postMessage(m,location.origin)}catch(_){}return}if(m.type==='HEROHEALTH_GAME_COMPLETE'&&m.payload&&!completionForwarded){if(smoke){const ev=strictEvidence();if(!ev.valid){console.warn('[Balance V70] blocked incomplete completion',ev);return}completionForwarded=true;clearInterval(injectTimer);try{parent.postMessage({type:'HEROHEALTH_GAME_COMPLETE',payload:{...m.payload,strictCompletionEvidence:ev,balanceRoute:'direct-smoke-v70',runtimeStack:'native-reset-v70',nativeRuntimeResetVersion:'v70',summaryDomGuardVersion:'v65',warmupGateVersion:'v61',bossGateVersion:'v63',timePolicyVersion:'v62'}},location.origin)}catch(_){};return}completionForwarded=true;try{parent.postMessage(m,location.origin)}catch(_){}}});
addEventListener('pagehide',()=>clearInterval(injectTimer),{once:true});
window.HH_BALANCE_ANALYTICS_V50={release:RELEASE,smoke,directSmoke:smoke,runtimeStack:'native-reset-v70',nativeRuntimeReset:'v70',summaryDomGuard:'v65',warmupGate:'v61',bossGate:'v63-mobile-crop',timePolicy:'v62-90s-boss10s',strictCompletion:'v56'};
console.info('[Balance Hold] Analytics wrapper ready',window.HH_BALANCE_ANALYTICS_V50);
})();
</script></body></html>
