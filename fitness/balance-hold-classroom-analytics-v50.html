<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#dff7ff">
<title>Balance Hold</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff7ff}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="proxy" title="เกม Balance Hold" allow="camera;microphone;fullscreen;autoplay"></iframe>
<script>
(()=>{'use strict';
const RELEASE='20260731-BALANCE-ANALYTICS-V50-1-STABILITY';
const q=new URLSearchParams(location.search);
const proxy=document.getElementById('proxy');
const target=new URL('./balance-hold-classroom-analytics-v49.html',location.href);
q.forEach((value,key)=>target.searchParams.set(key,value));
target.searchParams.set('finishGate','v50-direct');
target.searchParams.set('_',Date.now());
proxy.src=target.href;

let injectTimer=0;
let injected=false;
let scriptRequested=false;
let completionForwarded=false;
function deepestGameWindow(){
 try{
  const proxyWindow=proxy.contentWindow;
  const gameFrame=proxyWindow?.document?.getElementById('game');
  return gameFrame?.contentWindow||null;
 }catch(_){return null}
}
function injectFinishGate(){
 const gameWindow=deepestGameWindow();
 if(!gameWindow||!gameWindow.document)return false;
 if(gameWindow.BH_FINAL_POSE_DIRECT_FINISH){injected=true;return true}
 const existing=gameWindow.document.querySelector('script[data-bh-finish-v50]');
 if(existing){scriptRequested=true;return false}
 if(scriptRequested)return false;
 scriptRequested=true;
 const script=gameWindow.document.createElement('script');
 script.src=new URL('./bh-final-pose-finish-v50.js?v=20260731-v50-1-stability',gameWindow.location.href).href;
 script.async=false;
 script.dataset.bhFinishV50='1';
 script.onload=()=>{injected=true;console.info('[Balance V50.1] direct finish gate injected')};
 script.onerror=()=>{scriptRequested=false;console.error('[Balance V50.1] direct finish gate load failed')};
 (gameWindow.document.head||gameWindow.document.documentElement).appendChild(script);
 return true;
}
proxy.addEventListener('load',()=>{
 clearInterval(injectTimer);
 injected=false;
 scriptRequested=false;
 completionForwarded=false;
 let attempts=0;
 injectTimer=setInterval(()=>{
  attempts++;
  if(injectFinishGate()&&injected){clearInterval(injectTimer);return}
  if(attempts>200)clearInterval(injectTimer);
 },100);
});
addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==proxy.contentWindow)return;
 const message=event.data||{};
 if(message.type==='HEROHEALTH_GAME_STARTED'){
  try{parent.postMessage(message,location.origin)}catch(_){}
  return;
 }
 if(message.type==='HEROHEALTH_GAME_COMPLETE'&&message.payload&&!completionForwarded){
  completionForwarded=true;
  clearInterval(injectTimer);
  try{parent.postMessage(message,location.origin)}catch(_){}
 }
});
addEventListener('pagehide',()=>clearInterval(injectTimer),{once:true});
window.HH_BALANCE_ANALYTICS_V50={release:RELEASE,injectFinishGate,deepestGameWindow};
console.info('[Balance Hold] Analytics V50.1 wrapper ready',RELEASE);
})();
</script>
</body>
</html>
