<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ecfdf5">
  <title>JumpDuck Classroom</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#cffafe,#ecfccb);color:#12352f}
    body{display:grid;place-items:center;padding:20px}
    .card{width:min(430px,94vw);background:#fff;border:4px solid #facc15;border-radius:28px;padding:28px;text-align:center;box-shadow:0 18px 45px rgba(15,118,110,.18)}
    .icon{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:#fde047;border:4px solid #eab308;font-size:44px}
    .badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#d1fae5;color:#047857;font-size:12px;font-weight:900}
    h1{margin:14px 0 8px;font-size:42px;line-height:1;color:#059669}
    p{margin:0;color:#475569;font-weight:700;line-height:1.5}
    .defaults{margin:20px 0 12px;padding:13px;border-radius:16px;background:#f0fdf4;color:#047857;font-weight:900}
    button{width:100%;min-height:62px;border:0;border-radius:20px;background:linear-gradient(90deg,#10b981,#06b6d4);color:#fff;font:900 20px system-ui;box-shadow:0 10px 22px rgba(5,150,105,.24);cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    #status{min-height:24px;margin-top:12px;font-size:13px;color:#475569}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🦆</div>
    <span class="badge">CLASSROOM • BODY TRACKING</span>
    <h1>JumpDuck Dash</h1>
    <p>หลบสิ่งกีดขวางด้วย Jump / Duck / Left / Right</p>
    <div class="defaults">Easy • 60 วินาที • ตรวจจับอัตโนมัติ</div>
    <button id="start" type="button">▶ เตรียมกล้องและเริ่มเกม</button>
    <div id="status">กดครั้งเดียว แล้วระบบจะเข้าสู่เกมโดยตรง</div>
  </main>
<script>
(()=>{
  'use strict';
  const btn=document.getElementById('start');
  const status=document.getElementById('status');
  btn.addEventListener('click',()=>{
    if(btn.disabled)return;
    btn.disabled=true;
    btn.textContent='กำลังเปิด JumpDuck…';
    status.textContent='โปรดอนุญาตกล้องเมื่อเบราว์เซอร์ถาม';
    const incoming=new URLSearchParams(location.search);
    const target=new URL('./jumpduck-ar.html',location.href);
    incoming.forEach((value,key)=>{
      if(!['v','jumpduck'].includes(key))target.searchParams.set(key,value);
    });
    target.searchParams.set('diff','easy');
    target.searchParams.set('time','60');
    target.searchParams.set('classroom','1');
    target.searchParams.set('warmupDone','1');
    target.searchParams.set('autostart','1');
    target.searchParams.set('_',Date.now());
    location.replace(target.href);
  });
})();
</script>
</body>
</html>
