<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#082f49">
<title>HeroHealth Classroom Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03131d;font-family:system-ui,sans-serif}.bar{position:fixed;z-index:20;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#03131df5;color:#fff}.bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar button,.btn{border:0;border-radius:12px;min-height:44px;padding:9px 12px;font:inherit;font-weight:900}.back{background:#173b4b;color:#fff}.status{font-size:13px;opacity:.9}iframe{position:fixed;top:60px;left:0;width:100%;height:calc(100% - 60px);border:0;background:#000}.overlay{position:fixed;z-index:50;inset:60px 0 0;display:none;place-items:center;padding:18px;background:#010a12e8}.overlay.show{display:grid}.card{width:min(520px,96vw);padding:24px;border-radius:24px;background:#fff;color:#12302c;text-align:center}.score{font-size:42px;font-weight:1000;color:#0f766e}.btn{width:100%;background:#0f766e;color:#fff}.btn:disabled{opacity:.55;cursor:wait}.hint{font-size:12px;opacity:.75}.sync{min-height:48px;font-weight:800;color:#0f766e}.loading{position:fixed;z-index:45;inset:60px 0 0;display:grid;place-items:center;background:#03131d;color:#fff;text-align:center}.loading.hide{display:none}.spinner{width:46px;height:46px;border:5px solid #ffffff35;border-top-color:#67eda9;border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="bar"><button id="back" class="back">← ออกชั่วคราว</button><b id="title">HeroHealth</b><small id="status" class="status">กำลังเตรียมเกม</small></header>
<iframe id="game" allow="camera;microphone;fullscreen;autoplay"></iframe>
<section id="loading" class="loading"><div><div class="spinner"></div><b>กำลังเตรียมภารกิจ</b><p>ระบบจะบันทึกเวลาเริ่มและผลการเล่นอัตโนมัติ</p></div></section>
<section id="overlay" class="overlay"><div class="card"><div style="font-size:56px">🏆</div><h1>จบภารกิจแล้ว</h1><div id="score" class="score">0 คะแนน</div><p id="detail">ผลการเล่นพร้อมบันทึก</p><p id="sync" class="sync"></p><button id="returnBtn" class="btn">เก็บผลและกลับ HeroHealth</button><p class="hint">ไม่ต้องเล่นซ้ำ ระบบจะส่งผลต่อจากหน้า HeroHealth</p></div></section>
<script src="./data/backend-config.js?v=20260725-game-authority7"></script>
<script>
(()=>{'use strict';
const STATE_KEY='herohealth_learning_platform_rc2',QUEUE_KEY='herohealth_backend_queue_v4';
const q=new URLSearchParams(location.search),target=q.get('target'),back=q.get('return')||'./index.html',sid=q.get('studentId')||'',zone=q.get('zone')||'',gameId=q.get('gameId')||'',section=q.get('section')||'',group=q.get('group')||'';
const f=document.getElementById('game'),ov=document.getElementById('overlay'),loading=document.getElementById('loading'),statusEl=document.getElementById('status'),returnBtn=document.getElementById('returnBtn'),syncEl=document.getElementById('sync');
const endpoint=String(window.HH_CONFIG?.backend?.webAppUrl||'').trim();
const sessionId=`GS-${sid}-${zone}-${gameId}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
const openedAt=new Date().toISOString();let startedAt='',ended=false,syncing=false,result={completed:false,passed:false,score:0,accuracy:0,eventId:''};
document.getElementById('title').textContent=q.get('title')||gameId;if(!target){statusEl.textContent='ไม่พบเกม';return}
const num=v=>{const n=Number(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0};const eid=()=>`HH-game-${zone}-${gameId}-${sid}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
function readJson(k,fallback){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(fallback))}catch(_){return fallback}}function writeJson(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}}function state(){return readJson(STATE_KEY,{})}
function enqueue(payload){const list=readJson(QUEUE_KEY,[]);if(!list.some(x=>x.eventId===payload.eventId)){list.push(payload);writeJson(QUEUE_KEY,list.slice(-40))}}
function onStart(){if(startedAt)return;startedAt=new Date().toISOString();statusEl.textContent='กำลังเล่น'}
function read(){try{const w=f.contentWindow,d=f.contentDocument,raw=JSON.parse(w.localStorage.getItem('HHA_GROUPS_AR_LAST_RESULT')||w.localStorage.getItem('HHA_GOODJUNK_AR_LAST_RESULT')||w.localStorage.getItem('HHA_HANDWASH_LAST_RESULT')||w.localStorage.getItem('toothbrush_pending_result')||w.localStorage.getItem('HHA_TOOTHBRUSH_LAST_RESULT')||'null')||w.__TOOTHBRUSH_LAST_RESULT__||w.__HANDWASH_LAST_RESULT__||{};let score=num(raw.score);for(const id of ['score','scoreText','summaryScore','sumScore','finalScore'])score=Math.max(score,num(d.getElementById(id)?.textContent));let accuracy=num(raw.accuracy??raw.direction_accuracy);for(const id of ['accuracy','accuracyText','summaryAccuracy','sumAccuracy'])accuracy=Math.max(accuracy,num(d.getElementById(id)?.textContent));result={...result,...raw,completed:true,passed:raw.passed!==false,score,accuracy,eventId:raw.eventId||raw.record_id||result.eventId||eid()}}catch(_){result={...result,completed:true,passed:true,eventId:result.eventId||eid()}}return result}
function show(payload={}){if(ended)return;result={...result,...payload,completed:true};read();ended=true;document.getElementById('score').textContent=`${result.score} คะแนน`;ov.classList.add('show');statusEl.textContent='จบเกมแล้ว';syncEl.textContent='ผลพร้อมเก็บและส่งต่อ'}
function makePayload(){const p=state().profile||{},eventId=result.eventId||eid();result.eventId=eventId;return{eventType:'game',eventId,studentId:sid,profile:{fullName:p.fullName||'',section:section||p.section||'',group:group||p.group||''},clientTs:new Date().toISOString(),currentStep:`${zone}:${gameId}`,status:'จบ '+gameId,game:{zone,gameId,score:num(result.score),accuracy:num(result.accuracy),passed:result.passed!==false,completed:true,finishedAt:new Date().toISOString(),sessionId,openedAt,startedAt:startedAt||openedAt,durationSec:Math.max(0,Math.round((Date.now()-Date.parse(startedAt||openedAt))/1000)),inputMode:result.inputMode||'classroom-ar',gameVersion:result.gameVersion||''}}}
function makeReturnUrl(){const u=new URL(back,location.href);u.searchParams.set('hhReturn','game');u.searchParams.set('zone',zone);u.searchParams.set('gameId',gameId);u.searchParams.set('completed','true');u.searchParams.set('passed',result.passed!==false?'true':'false');u.searchParams.set('score',String(num(result.score)));u.searchParams.set('accuracy',String(num(result.accuracy)));u.searchParams.set('eventId',result.eventId);u.searchParams.set('studentId',sid);u.searchParams.set('sessionId',sessionId);u.searchParams.set('startedAt',startedAt||openedAt);u.searchParams.set('gameSync','1');return u.href}
function finishAndGo(){if(syncing)return;read();syncing=true;returnBtn.disabled=true;const p=makePayload();enqueue(p);syncEl.textContent='เก็บผลแล้ว • กำลังกลับ HeroHealth เพื่อส่งต่อ…';setTimeout(()=>location.replace(makeReturnUrl()),450)}
returnBtn.onclick=finishAndGo;document.getElementById('back').onclick=()=>location.href=new URL(back,location.href).href;
f.src=target;f.addEventListener('load',()=>{loading.classList.add('hide');statusEl.textContent='พร้อมเริ่มเกม';try{const d=f.contentDocument;d.addEventListener('click',e=>{if(/เริ่ม|start|เปิดกล้อง|calibration/i.test(String(e.target?.textContent||'')))onStart()},{capture:true})}catch(_){}});
addEventListener('message',e=>{if(e.origin!==location.origin)return;const m=e.data||{};if(m.type==='HEROHEALTH_GAME_STARTED')onStart();if(m.type==='HEROHEALTH_GAME_COMPLETE'&&m.payload){show(m.payload);setTimeout(finishAndGo,500)}});
})();
</script>
</body>
</html>
