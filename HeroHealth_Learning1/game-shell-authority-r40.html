<script>

 const cb='HHG40_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');let done=false;

})}
function formPost(payload){return new Promise((resolve,reject)=>{try{

 }catch(error){reject(error)}})}
async function fetchPost(payload){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{await fetch(endpoint,{method:'POST',mode:'no-cors',cache:'no-store',redirect:'follow',credentials:'omit',keepalive:true,headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload),signal:controller.signal});return true}finally{clearTimeout(timer)}}

function gameConfirmedIn(obj){if(!obj||typeof obj!=='object')return false;const c=obj.gameCompleted;if(c?.[zone]?.[gameId]===true)return true;if(c===true&&clean(obj.gameId||obj.game_id||gameId)===gameId)return true;const games=obj.completedGames||obj.progress?.completedGames;return Array.isArray(games)&&games.some(v=>clean(v)===`${zone}:${gameId}`||clean(v)===gameId)}

async function waitForReceipt(eventId){for(let attempt=1;attempt<=12;attempt++){await sleep(550+attempt*180+Math.floor(Math.random()*250));const authority=await studentAuthority();if(authority)return{ok:true,source:'student-authority',authority};if(await eventFound(eventId)){const reconciled=await reconcileAuthority();if(reconciled)return{ok:true,source:'event-and-reconcile',authority:reconciled};if(attempt>=7)return{ok:true,source:'event-saved-authority-pending',authority:null}}}return{ok:false,source:'receipt-timeout',authority:null}}

function onStart(source='game'){if(startedAtMs)return;startedAtMs=Date.now();startedAt=new Date(startedAtMs).toISOString();statusEl.textContent='กำลังเล่น';console.info('[R40 start]',source,startedAt)}
function clearStaleResults(){try{const w=f.contentWindow;RESULT_KEYS.forEach(key=>{try{w.localStorage.removeItem(key)}catch(_){}});for(const key of ['__TOOTHBRUSH_LAST_RESULT__','__HANDWASH_LAST_RESULT__','__GROUPS_LAST_RESULT__','__GOODJUNK_LAST_RESULT__','__JUMPDUCK_LAST_RESULT__','__BALANCE_HOLD_LAST_RESULT__'])try{delete w[key]}catch(_){}}catch(_){}}
function timestampOf(raw){for(const key of ['finishedAt','submittedAt','timestamp','ts','endedAt','createdAt']){const value=raw?.[key];if(!value)continue;const n=typeof value==='number'?value:Date.parse(value);if(Number.isFinite(n))return n}return 0}
function isFresh(raw){if(!raw||typeof raw!=='object'||!Object.keys(raw).length)return false;const rawSid=clean(raw.studentId||raw.participantId||raw.pid);if(rawSid&&rawSid!=='anon'&&rawSid!==sid)return false;const ts=timestampOf(raw);if(ts&&ts<openedAtMs-2000)return false;return startedAtMs>0||ts>=openedAtMs-2000}
function readRawResult(){try{const w=f.contentWindow;for(const key of RESULT_KEYS){try{const value=JSON.parse(w.localStorage.getItem(key)||'null');if(isFresh(value))return value}catch(_){}}for(const value of [w.__TOOTHBRUSH_LAST_RESULT__,w.__HANDWASH_LAST_RESULT__,w.__GROUPS_LAST_RESULT__,w.__GOODJUNK_LAST_RESULT__,w.__JUMPDUCK_LAST_RESULT__,w.__BALANCE_HOLD_LAST_RESULT__])if(isFresh(value))return value}catch(_){}return{}}
function compact(value,depth=0){if(depth>7||value==null)return value==null?value:undefined;if(['number','boolean'].includes(typeof value))return value;if(typeof value==='string')return value.slice(0,5000);if(Array.isArray(value))return value.slice(0,500).map(v=>compact(v,depth+1)).filter(v=>v!==undefined);if(typeof value==='object'){const out={};Object.keys(value).slice(0,350).forEach(key=>{if(/base64|imageData|videoData|rawFrame|blob|tensor/i.test(key))return;const child=compact(value[key],depth+1);if(child!==undefined)out[key]=child});return out}return undefined}
function present(value){if(value==null||value==='')return false;if(Array.isArray(value))return value.length>0;if(typeof value==='object')return Object.keys(value).length>0;return true}
function first(raw,keys){for(const key of keys){if(present(raw?.[key]))return raw[key]}return undefined}
function normalizeCollection(name,arr){if(!Array.isArray(arr))return arr;return arr.slice(0,500).map((item,index)=>{const row=item&&typeof item==='object'?{...item}:{value:item};const fallback=name==='steps'||name==='stepResults'?`step_${row.stepId??row.id??index+1}`:`${name}_${index+1}`;row.eventName=clean(row.eventName||row.eventType||row.event||row.type||row.stepId||row.questionId||row.name||fallback);row.eventTs=row.eventTs||row.ts||row.timestamp||row.clientTs||row.time||'';return row})}
function addSyntheticCollections(raw){const x={...raw};if(!Array.isArray(x.stepResults)&&Array.isArray(x.poseResults))x.stepResults=x.poseResults.map((row,index)=>({...row,eventName:clean(row.eventName||row.poseKey||row.title||`pose_${index+1}`),eventType:'pose_result'}));if(!Array.isArray(x.items)&&x.zoneMetrics&&typeof x.zoneMetrics==='object')x.items=Object.entries(x.zoneMetrics).map(([id,row])=>({zoneId:id,eventName:`zone_${id}`,eventType:'zone_result',...(row||{})}));if(!Array.isArray(x.events))x.events=[];if(gameId==='jumpduck'&&x.events.length===0){x.events=[{eventType:'round_completed',eventName:'round_completed',score:x.score,accuracy:x.accuracy,missionReached:x.missionReached,avgReactionMs:x.avgReactionMs,ts:x.finishedAt||new Date().toISOString()}];const gs=x.gestureStats||{};Object.entries(gs).forEach(([gesture,count])=>x.events.push({eventType:'gesture_summary',eventName:`gesture_${gesture}`,gesture,count,ts:x.finishedAt||new Date().toISOString()}))}COLLECTIONS.forEach(name=>{if(Array.isArray(x[name]))x[name]=normalizeCollection(name,x[name])});return x}
function durationInfo(raw){const direct=first(raw,['durationSec','usedTimeSec','elapsedSec','playTimeSec','timeOnTaskSec','sessionDurationSec','totalTimeSec']);const n=finite(direct);if(n!==undefined&&n>0)return{value:Math.round(n*100)/100,source:'game'};const startMs=Date.parse(raw.startedAt||raw.startTs||startedAt||'');const endMs=Date.parse(raw.finishedAt||raw.endedAt||raw.clientTs||new Date().toISOString());if(Number.isFinite(startMs)&&Number.isFinite(endMs)&&endMs>startMs)return{value:Math.round((endMs-startMs)/10)/100,source:'timestamps'};if(startedAtMs)return{value:Math.max(1,Math.round((Date.now()-startedAtMs)/1000)),source:'shell-start'};return{value:Math.max(1,Math.round((Date.now()-openedAtMs)/1000)),source:'shell-open'} }
function handwashAudit(raw){const rows=Array.isArray(raw.steps)?raw.steps:Array.isArray(raw.stepResults)?raw.stepResults:[],done=row=>yes(row?.completed)||['strict','grace','assist','pass','passed'].includes(clean(row?.passMode).toLowerCase()),rubRows=rows.filter(r=>clean(r.group||r.kind).toLowerCase().includes('rub')),processRows=rows.filter(r=>clean(r.group||r.kind).toLowerCase()==='process');const rubDone=finite(raw.completedRubSteps??raw.whoStepsCompleted)??rubRows.filter(done).length,rubTotal=finite(raw.totalWhoRubSteps??raw.totalRubSteps??raw.whoStepsTotal)??rubRows.length,processDone=finite(raw.completedProcessSteps)??processRows.filter(done).length,processTotal=finite(raw.totalProcessSteps)??processRows.length,wrist=rows.find(r=>clean(r.id).toLowerCase()==='wrists'||finite(r.stepId??r.whoStep)===8||/ข้อมือ/.test(clean(r.label))),wristsPassed=yes(raw.wristsPassed)||done(wrist),analyticsReady=clean(raw.analyticsSchemaVersion).includes('V2')&&(finite(raw.metricCompletenessPct)??0)>=90&&rows.length>=12&&Array.isArray(raw.events);return{valid:yes(raw.completed)&&rubDone>=7&&rubTotal>=7&&processDone>=5&&processTotal>=5&&wristsPassed&&analyticsReady,rubDone,rubTotal,processDone,processTotal,wristsPassed,analyticsReady,skillPassed:yes(raw.skillCriteriaMet??raw.passed)}}
function skillFor(raw){if(gameId==='handwash')return handwashAudit(raw).skillPassed;if(present(raw.skillCriteriaMet))return yes(raw.skillCriteriaMet);if(present(raw.skillMet))return yes(raw.skillMet);if(present(raw.mastered))return yes(raw.mastered);if(present(raw.challenge_passed))return yes(raw.challenge_passed);if(present(raw.learning_complete))return yes(raw.learning_complete);if(present(raw.passed))return yes(raw.passed);const accuracy=finite(raw.accuracy)??0;if(gameId==='goodjunk')return (finite(raw.score)??0)>=70;if(gameId==='jumpduck')return accuracy>=70&&(finite(raw.missionReached)??0)>=2;if(gameId==='balance-hold')return (finite(raw.assessmentScore)??0)>=60&&(finite(raw.completionRate)??100)>=80;return accuracy>=70}
function completionFor(raw){if(gameId==='handwash')return handwashAudit(raw).valid;return yes(raw.completed)||yes(raw.roundCompleted)||yes(raw.challengeCompleted)||yes(raw.procedureCompleted)||Boolean(raw.attemptId||raw.roundId||raw.completionReason||raw.finishReason||raw.finishedAt)}
function completeness(raw){const req={handwash:[['steps'],['events'],['completedRubSteps','whoStepsCompleted'],['completedProcessSteps'],['wristsPassed'],['durationSec'],['accuracy']],toothbrush:[['coverageZones'],['totalZones'],['plaqueTargetsCleared'],['directionAccuracy'],['trackingVisiblePct'],['zoneMetrics'],['durationSec']],groups:[['accuracy'],['groupAccuracy'],['reasonAccuracy'],['retryAccuracy'],['bossResults'],['events'],['durationSec']],goodjunk:[['score'],['accuracy'],['reasonAccuracy'],['retryAccuracy'],['maxCombo','combo'],['bossWin'],['durationSec']],jumpduck:[['score'],['accuracy'],['gestureStats'],['laneUsage'],['missionReached'],['avgReactionMs'],['durationSec']], 'balance-hold':[['assessmentScore'],['poseAccuracy'],['stabilityScore'],['transitionScore'],['trackingCoverage'],['poseResults','stepResults'],['durationSec']]}[gameId]||[['score'],['accuracy'],['durationSec']];const met=req.filter(keys=>keys.some(key=>present(raw[key]))).length;return Math.round(met*100/Math.max(1,req.length))}
function buildPayload(input={}){let raw={...readRawResult(),...input};raw=addSyntheticCollections(compact(raw)||{});const duration=durationInfo(raw);raw.durationSec=duration.value;raw.durationAvailable=true;raw.durationSource=duration.source;const attemptId=safeToken(raw.attemptId||raw.roundId||raw.record_id||raw.sessionId||raw.eventId||shellSessionId);const submissionKey=`${sid}:${zone}:${gameId}:${attemptId}`;const eventId=safeToken(raw.eventId)||`HH-game-${zone}-${gameId}-${sid}-${attemptId}`;const completed=completionFor(raw),skill=skillFor(raw);const scoreValue=first(raw,['score','totalScore','assessmentScore']),accuracyValue=first(raw,['accuracy','directionAccuracy','poseAccuracy','correctRate']);const score=finite(scoreValue),accuracy=finite(accuracyValue);const profile=state().profile||{};
 const game={...raw,studentId:sid,profile:{fullName:profile.fullName||raw.fullName||raw.studentName||'',section:section||profile.section||raw.section||'',group:group||profile.group||raw.group||raw.classId||''},zone,gameId,game_id:gameId,game_key:gameId,attemptId,submissionKey,eventId,score:score??0,scoreAvailable:score!==undefined,accuracy:accuracy??0,accuracyAvailable:accuracy!==undefined,passed:skill,skillCriteriaMet:skill,completed,procedureCompleted:completed,progressionEligible:completed,finishedAt:raw.finishedAt||new Date().toISOString(),openedAt,startedAt:raw.startedAt||startedAt||openedAt,sessionId:raw.sessionId||shellSessionId,inputMode:raw.inputMode||raw.play_mode||raw.mode||'classroom-ar',gameVersion:raw.gameVersion||raw.version||'',singleAttemptPolicy:true,retryRequired:false,completionPolicy:raw.completionPolicy||(gameId==='handwash'?'7-rub-5-process-analytics-sheet-authority':'one-classroom-round-completes-skill-separate'),analyticsSchemaVersion:'HH-UNIFIED-GAME-ANALYTICS-V3',metricCompletenessPct:0,coreResultOnly:false,fullAnalyticsQueued:false,fullAnalyticsSubmitted:true,fullAnalyticsSavedPending:false,analyticsTransport:'full-payload-single-submit',transportVersion:RELEASE};
 if(gameId==='groups'){game.confusion=game.confusion||game.confusionMatrix}
 if(gameId==='toothbrush'){game.coveragePct=finite(game.coveragePct)??Math.round((finite(game.coverageZones)??0)*100/Math.max(1,finite(game.totalZones)??6));game.zonesCompleted=game.coverageZones;game.zonesTotal=game.totalZones}
 if(gameId==='jumpduck'){const gs=game.gestureStats||{};game.jumps=finite(game.jumps)??finite(gs.jump)??0;game.ducks=finite(game.ducks)??finite(gs.duck)??0;game.collisions=finite(game.collisions)??finite(game.missCount)??0;game.reactionMs=finite(game.reactionMs)??finite(game.avgReactionMs)??0}
 if(gameId==='balance-hold'){game.stabilityPct=finite(game.stabilityPct)??finite(game.stabilityScore)??0;game.holdSec=finite(game.holdSec)??game.durationSec}

 return{eventType:'game',type:'game',eventId,studentId:sid,zone,gameId,attemptId,submissionKey,completed,procedureCompleted:completed,progressionEligible:completed,passed:skill,profile:game.profile,clientTs:new Date().toISOString(),currentStep:`${zone}:${gameId}`,status:`Full analytics ${zone}:${gameId}; R40`,game};}

async function submitPayload(payload){if(alreadySent(payload.submissionKey)&&await eventFound(payload.eventId))return{ok:true,source:'already-sent'};const transports=[{name:'hidden-form-full',send:()=>formPost(payload)},{name:'fetch-full',send:()=>fetchPost(payload)},{name:'beacon-full',send:async()=>{if(!beaconPost(payload))throw new Error('beacon_unavailable')}}];let lastError=null;for(const t of transports){try{await t.send();const receipt=await waitForReceipt(payload.eventId);if(receipt.ok)return{...receipt,transport:t.name}}catch(error){lastError=error;console.warn('[R40 transport]',t.name,error)}}return{ok:false,source:clean(lastError?.message)||'full_payload_not_confirmed'}}
async function waitAuthorityAfterSaved(seed){if(seed&&authorityHasGame(seed)){applyAuthority(seed);return seed}for(let attempt=1;attempt<=10;attempt++){syncEl.textContent=`บันทึก Full Analytics แล้ว • กำลังตรวจ Passport (${attempt}/10)…`;const a=await studentAuthority();if(a)return a;if([3,6,9].includes(attempt)){const r=await reconcileAuthority();if(r)return r}await sleep(600+attempt*180)}return null}
function returnUrl(authority,pending=false){const url=new URL(back,location.href);url.searchParams.set('sid',sid);url.searchParams.set('authorityRefresh',Date.now());url.searchParams.set('gameSync','1');url.searchParams.set('autoNext','1');url.searchParams.set('shellVersion',RELEASE);url.searchParams.set('analyticsMode','full-once');if(pending)url.searchParams.set('pendingGameSync',`${zone}:${gameId}`);const next=authority?.authoritativeState?.progress?.nextStep||authority?.progress?.nextStep;if(next)url.searchParams.set('confirmedNext',next);return url.href}
async function finishAndGo(automatic=false){if(syncing)return;const payload=lastPayload||buildPayload();lastPayload=payload;if(gameId==='handwash'&&!payload.completed){syncEl.textContent='Handwash ยังทำไม่ครบ 7 ท่าถู 5 ขั้นกระบวนการ และ Analytics 90%';return}syncing=true;returnBtn.disabled=true;leaveBtn.disabled=true;queuePayload(payload);try{syncEl.classList.remove('error');syncEl.textContent=`กำลังส่ง Full Analytics • ความครบถ้วน ${payload.game.metricCompletenessPct}%`;const receipt=await submitPayload(payload);if(!receipt.ok)throw new Error(receipt.source);markSent(payload.submissionKey,payload.eventId);dequeuePayload(payload.eventId);const authority=await waitAuthorityAfterSaved(receipt.authority);syncEl.textContent=authority?'Google Sheet ยืนยัน Full Analytics และ Passport แล้ว':'Google Sheet บันทึก Full Analytics แล้ว • Passport จะตรวจต่ออัตโนมัติ';statusEl.textContent='บันทึกผลครบแล้ว';setTimeout(()=>location.replace(returnUrl(authority,!authority)),650)}catch(error){const message=clean(error?.message||error);console.error('[R40 full analytics]',error);syncing=false;automaticRounds++;if(automatic&&automaticRounds<3){syncEl.classList.remove('error');syncEl.textContent=`ยังไม่ยืนยัน Full Analytics (${message})\nระบบกำลังลองใหม่อัตโนมัติ…`;setTimeout(()=>finishAndGo(true),2200+Math.floor(Math.random()*900));return}syncEl.classList.add('error');syncEl.textContent=`Google Sheet ยังไม่ยืนยัน Full Analytics\nรหัส: ${message}\nผลฉบับเต็มเก็บในคิวบนเครื่องแล้ว`;returnBtn.textContent='ตรวจและส่ง Full Analytics อีกครั้ง';returnBtn.disabled=false;leaveBtn.disabled=false}}
function leavePending(){location.href=returnUrl(null,true)}
function show(payload={}){if(ended)return;const key=clean(payload.eventId||payload.attemptId||payload.roundId||JSON.stringify([payload.score,payload.accuracy,payload.finishedAt]));if(key&&receivedKeys.has(key))return;if(key)receivedKeys.add(key);if(!startedAtMs)onStart('completion-fallback');const full=buildPayload(payload);if(gameId==='handwash'&&!full.completed){const audit=handwashAudit(full.game);statusEl.textContent=`ยังไม่จบ • ท่าถู ${audit.rubDone}/7 • Analytics ${full.game.metricCompletenessPct}%`;return}ended=true;lastPayload=full;document.getElementById('score').textContent=full.game.scoreAvailable?`${full.game.score} คะแนน`:'ทำภารกิจครบแล้ว';document.getElementById('overlayTitle').textContent=full.passed?'ทำภารกิจครบและผ่านเกณฑ์':'เล่นครบหนึ่งรอบแล้ว';auditEl.textContent=`Full Analytics ${full.game.metricCompletenessPct}% • ${full.game.durationSec} วินาที • ${full.game.inputMode} • ${full.passed?'ผ่านทักษะ':'ควรพัฒนา'}`;ov.classList.add('show');statusEl.textContent='กำลังบันทึกข้อมูลฉบับเต็ม';syncEl.textContent='กำลังเตรียม Full Analytics…';setTimeout(()=>finishAndGo(true),450)}
function visible(el,win){if(!el)return false;const cs=win.getComputedStyle(el),rect=el.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&Number(cs.opacity||1)>0&&rect.width>0&&rect.height>0}
function finishCheck(){if(ended)return;try{const win=f.contentWindow,doc=f.contentDocument;if(!doc)return;const candidates=['resultOverlay','resultScreen','summaryScreen','result','summary','endOverlay','finalModal','summaryOverlay'].map(id=>doc.getElementById(id));const resultVisible=candidates.some(el=>visible(el,win));if(!resultVisible)return;const raw=readRawResult();if(Object.keys(raw).length)show(raw)}catch(_){}}
async function flushQueue(){const list=readJson(QUEUE_KEY,[]).slice(0,3);for(const payload of list){try{if(await eventFound(payload.eventId)){dequeuePayload(payload.eventId);markSent(payload.submissionKey,payload.eventId);continue}const receipt=await submitPayload(payload);if(receipt.ok){dequeuePayload(payload.eventId);markSent(payload.submissionKey,payload.eventId)}}catch(error){console.warn('[R40 queue flush]',error)}}}

returnBtn.onclick=()=>{automaticRounds=0;finishAndGo(false)};leaveBtn.onclick=leavePending;document.getElementById('back').onclick=leavePending;
f.src=target;
f.addEventListener('load',()=>{loading.classList.add('hide');statusEl.textContent='พร้อมเริ่มเกม';clearStaleResults();try{const doc=f.contentDocument;doc.addEventListener('click',event=>{if(/เริ่ม|start|เปิดกล้อง|calibration|coach|เล่น/i.test(clean(event.target?.textContent)))onStart('click')},{capture:true});new MutationObserver(finishCheck).observe(doc.documentElement,{subtree:true,childList:true,characterData:true,attributes:true})}catch(_){}});
addEventListener('message',event=>{if(event.origin!==location.origin)return;const m=event.data||{};if(m.type==='HEROHEALTH_GAME_STARTED'){onStart('message');return}if(m.type==='HEROHEALTH_GAME_COMPLETE'&&m.payload){show(m.payload);return}if(m.type==='HEROHEALTH_HANDWASH_ANALYTICS'&&m.payload){if(!startedAtMs)onStart('handwash-analytics');finishCheck()}});
setInterval(finishCheck,700);setTimeout(flushQueue,1400);
})();
