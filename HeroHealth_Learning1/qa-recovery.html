<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeroHealth QA Recovery</title><style>body{font-family:system-ui,sans-serif;background:#eefcf9;color:#12302c;margin:0;display:grid;place-items:center;min-height:100vh}.card{width:min(560px,92vw);background:#fff;padding:24px;border-radius:22px;box-shadow:0 18px 50px #0002}button{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:900;background:#0f8b7c;color:#fff}.ok{color:#087f5b}.err{color:#c92a2a}code{font-size:12px}</style></head><body><main class="card"><h1>กู้ผลทดสอบ QA</h1><p id="info"></p><p id="status">พร้อมกู้ข้อมูล</p><button id="go">กู้ Pre-test และ JumpDuck</button></main><script src="./data/backend-config.js?v=20260725-qa-recovery1"></script><script>(()=>{'use strict';const q=new URLSearchParams(location.search),sid=q.get('studentId')||'',preScore=Number(q.get('preScore')||0),preTotal=Number(q.get('preTotal')||15),jumpScore=Number(q.get('jumpScore')||0),section=q.get('section')||'',group=q.get('group')||'',name=q.get('name')||'',endpoint=String(window.HH_CONFIG?.backend?.webAppUrl||'').trim(),status=document.getElementById('status'),btn=document.getElementById('go');document.getElementById('info').textContent=`รหัส ${sid} • Pre-test ${preScore}/${preTotal} • JumpDuck ${jumpScore} คะแนน`;function jsonp(payload){return new Promise((resolve,reject)=>{const cb='HHREC_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const finish=(e,d)=>{if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch(_){}s.remove();e?reject(e):resolve(d)};const t=setTimeout(()=>finish(new Error('timeout')),30000);window[cb]=d=>finish(null,d);s.onerror=()=>finish(new Error('load_failed'));s.src=endpoint+'?'+new URLSearchParams({action:'submit',payload:JSON.stringify(payload),callback:cb,_:Date.now()});document.head.appendChild(s)})}function ev(type,suffix,data){return{eventType:type,eventId:`HH-QA-RECOVERY-${type}-${sid}-${suffix}`,studentId:sid,profile:{fullName:name,section,group},clientTs:new Date().toISOString(),...data}}async function run(){if(!sid||!endpoint){status.className='err';status.textContent='ข้อมูลไม่ครบ';return}btn.disabled=true;try{status.textContent='กำลังกู้ Pre-test…';let r=await jsonp(ev('assessment','PRE',{status:'QA recovery pretest',assessment:{type:'pretest',form:'PRE-12',score:preScore,total:preTotal,responses:[],submittedAt:new Date().toISOString()}}));if(!r?.ok)throw new Error(r?.error||'pretest_failed');status.textContent='กำลังกู้ JumpDuck…';r=await jsonp(ev('game','JUMPDUCK',{status:'QA recovery jumpduck',game:{zone:'fitness',gameId:'jumpduck',score:jumpScore,accuracy:0,passed:true,completed:true,finishedAt:new Date().toISOString(),inputMode:'classroom-ar',gameVersion:'recovered'}}));if(!r?.ok)throw new Error(r?.error||'game_failed');status.className='ok';status.textContent='กู้สำเร็จ กำลังกลับ HeroHealth…';setTimeout(()=>location.replace('./index.html?authorityRefresh='+Date.now()),900)}catch(e){status.className='err';status.textContent='กู้ไม่สำเร็จ: '+String(e.message||e);btn.disabled=false}}btn.onclick=run;})();</script></body></html>
