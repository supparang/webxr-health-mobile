<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071827">
<title>Handwash Smoke Strict Wrapper</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:#071827}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.status{display:none;position:fixed;z-index:30;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:94vw;padding:7px 11px;border-radius:999px;background:#0f172ddd;color:#fff;font:800 11px/1.25 system-ui;text-align:center;pointer-events:none}.status.ok,.status.err{display:block}.status.ok{background:#065f46ee}.status.err{background:#991b1bee}</style>
</head>
<body>
<iframe id="game" allow="camera;microphone;fullscreen;autoplay"></iframe>
<div id="status" class="status">Handwash Smoke • รอเริ่มรอบใหม่</div>
<script>
(()=>{'use strict';
const RELEASE='20260808-HANDWASH-SMOKE-STRICT-WRAPPER-R3-LIVE-ONLY-HAND-DETECT';
const q=new URLSearchParams(location.search);
const frame=document.getElementById('game'),status=document.getElementById('status');
const sid=String(q.get('studentId')||q.get('sid')||q.get('pid')||'').trim();
const startedAt=Date.now();
let started=false,sent=false;
const yes=v=>v===true||v===1||String(v||'').toLowerCase()==='true'||String(v||'')==='1';
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
function rows(raw){return Array.isArray(raw?.steps)?raw.steps:Array.isArray(raw?.stepResults)?raw.stepResults:[]}
function liveTimestamp(raw){const value=raw?.finishedAt||raw?.endedAt||raw?.timestamp||raw?.clientTs||raw?.completedAtClient||'';const ms=Date.parse(value);return Number.isFinite(ms)?ms:Date.now()}
function audit(raw){
 const rs=rows(raw);const rubRows=rs.filter(r=>String(r?.group||r?.kind||'').toLowerCase().includes('rub'));const processRows=rs.filter(r=>String(r?.group||r?.kind||'').toLowerCase()==='process');
 const rowDone=r=>yes(r?.completed)||['strict','grace','assist','pass','passed'].includes(String(r?.passMode||'').toLowerCase());
 const rub=num(raw?.completedRubSteps??raw?.whoStepsCompleted)||rubRows.filter(rowDone).length;
 const process=num(raw?.completedProcessSteps)||processRows.filter(rowDone).length;
 const wrist=rs.find(r=>String(r?.id||'').toLowerCase()==='wrists'||num(r?.stepId??r?.whoStep)===8||/ข้อมือ/.test(String(r?.label||'')));
 const wrists=yes(raw?.wristsPassed)||rowDone(wrist);
 const events=Array.isArray(raw?.events)||Array.isArray(raw?.eventLog);
 const analytics=num(raw?.metricCompletenessPct)>=90&&rs.length>=12&&events;
 const procedure=yes(raw?.procedureCompleted)||yes(raw?.completed)||yes(raw?.missionPassed);
 const currentAttempt=liveTimestamp(raw)>=startedAt-1500;
 return{valid:currentAttempt&&procedure&&rub>=7&&process>=5&&wrists&&analytics,currentAttempt,procedure,rub,process,wrists,analytics,rows:rs.length,metric:num(raw?.metricCompletenessPct)};
}
function start(){if(started)return;started=true;status.textContent='Handwash Smoke • กำลังเล่นรอบปัจจุบัน';status.className='status';try{parent.postMessage({type:'HEROHEALTH_GAME_STARTED'},location.origin)}catch(_){}}
function forward(raw){
 if(sent||!raw||typeof raw!=='object')return false;
 const a=audit(raw);
 if(!a.valid){status.textContent=`กำลังเล่น • rub ${a.rub}/7 • process ${a.process}/5`;status.className='status';return false}
 sent=true;status.textContent='ครบภารกิจจริง • ส่งผลรอบปัจจุบัน';status.className='status ok';
 const payload={...raw,studentId:sid,participantId:sid,gameId:'handwash',zone:'hygiene',completed:true,procedureCompleted:true,missionPassed:true,progressionEligible:true,handwashSmokeStrictAudit:a,wrapperRelease:RELEASE};
 try{parent.postMessage({type:'HEROHEALTH_GAME_COMPLETE',payload},location.origin)}catch(_){}
 return true;
}
function installHandDetectionQuality(win){
 if(!win||win.__HH_HAND_SMOKE_QUALITY_R3__)return true;
 const patch=()=>{
  try{
   const Hands=win.Hands;if(!Hands||!Hands.prototype)return false;
   const proto=Hands.prototype;if(proto.__hhSmokeQualityR3){win.__HH_HAND_SMOKE_QUALITY_R3__=true;return true}
   const original=proto.setOptions;if(typeof original!=='function')return false;
   proto.setOptions=function(options){
    return original.call(this,{...(options||{}),modelComplexity:0,maxNumHands:2,minDetectionConfidence:.42,minTrackingConfidence:.38});
   };
   proto.__hhSmokeQualityR3=true;win.__HH_HAND_SMOKE_QUALITY_R3__=true;
   console.info('[Handwash Smoke R3] Hands quality patch active');
   return true;
  }catch(_){return false}
 };
 if(patch())return true;
 let tries=0;const timer=win.setInterval(()=>{tries++;if(patch()||tries>160)win.clearInterval(timer)},50);
 return false;
}
function installMobilePolish(){
 try{
  const d=frame.contentDocument;if(!d?.head)return;
  if(d.getElementById('hh-handwash-smoke-polish-r3'))return;
  const s=d.createElement('style');s.id='hh-handwash-smoke-polish-r3';
  s.textContent=`@media(max-width:760px){
    .who-strip{overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:none!important;-webkit-overflow-scrolling:touch!important;justify-content:flex-start!important}
    .who-strip::-webkit-scrollbar{display:none!important}
    .phase-chip{flex:0 0 auto!important;min-width:72px!important}
    .bottom{bottom:calc(6px + env(safe-area-inset-bottom,0px))!important;z-index:25!important}
    .controls{gap:6px!important}
    #faucetBtn,#stopBtn{min-height:52px!important;font-size:13px!important}
    .coach{bottom:82px!important}
  }`;
  d.head.appendChild(s);
 }catch(_){ }
}
const gameUrl=new URL('./handwash-classroom-7step.html',location.href);
q.forEach((v,k)=>{if(!['wrappedGame','target'].includes(k))gameUrl.searchParams.set(k,v)});
gameUrl.searchParams.set('strict7','1');gameUrl.searchParams.set('classroom','1');gameUrl.searchParams.set('studentId',sid);gameUrl.searchParams.set('pid',sid);gameUrl.searchParams.set('gameId','handwash');gameUrl.searchParams.set('zone','hygiene');gameUrl.searchParams.set('smoke','1');gameUrl.searchParams.set('gameTestMode','1');gameUrl.searchParams.set('isTestAttempt','true');gameUrl.searchParams.set('handwashSmokeWrapper',RELEASE);gameUrl.searchParams.set('_',Date.now());
frame.src=gameUrl.href;
frame.addEventListener('load',()=>{try{installMobilePolish();setTimeout(installMobilePolish,120);const win=frame.contentWindow;installHandDetectionQuality(win);setTimeout(()=>installHandDetectionQuality(win),250);setTimeout(()=>installHandDetectionQuality(win),900);const d=frame.contentDocument;d?.addEventListener('click',e=>{if(/เริ่ม|start|เปิดกล้อง|เปิดน้ำ|faucet/i.test(String(e.target?.textContent||'')))start()},{capture:true})}catch(_){}});
addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow)return;const m=event.data||{};if(m.type==='HEROHEALTH_GAME_STARTED'){start();return}if(m.type==='HEROHEALTH_GAME_COMPLETE'&&m.payload){if(!started)start();forward(m.payload);return}if(m.type==='HEROHEALTH_HANDWASH_ANALYTICS'&&m.payload)forward(m.payload)},true);
window.addEventListener('herohealth:game-result',e=>forward(e.detail||{}),true);
window.HH_HANDWASH_SMOKE_STRICT_WRAPPER_R3={release:RELEASE,audit,startedAt};
console.info('[Handwash Smoke Strict Wrapper R3] live-only hand-detect installed',{sid,startedAt});
})();
</script>
</body>
</html>
