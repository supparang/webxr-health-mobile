<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f766e">
<title>HeroHealth Mobile Game Test Hub</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17332f;background:#effaf7;--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#effaf7}button{font:inherit}
.wrap{width:min(980px,100%);margin:auto;padding:calc(12px + var(--sat)) max(12px,var(--sar)) calc(24px + var(--sab)) max(12px,var(--sal))}.hero,.card{background:#fff;border:1px solid #d6ebe5;border-radius:22px;box-shadow:0 12px 30px rgba(15,118,110,.09)}.hero{padding:20px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}.hero h1{margin:4px 0 8px;font-size:clamp(25px,7vw,38px);line-height:1.12}.hero p{margin:0;color:#e6fffa;line-height:1.55}.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;font-weight:850}.card{padding:16px;margin-top:12px}.notice{padding:12px 14px;border-radius:14px;background:#fff5d9;color:#825800;font-weight:800;line-height:1.45}.zone{margin-top:16px}.zone-title{display:flex;align-items:center;gap:9px;margin:0 0 9px}.zone-title span{font-size:24px}.zone-title h2{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.game{padding:15px;border:1px solid #d9ece7;border-radius:18px;background:#fff;box-shadow:0 8px 20px rgba(16,93,80,.06)}.game-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.game h3{margin:0;font-size:18px}.game small{display:block;margin-top:3px;color:#6b807c}.state{white-space:nowrap;padding:5px 9px;border-radius:999px;background:#e5e7eb;color:#475569;font-size:11px;font-weight:900}.state.pass{background:#dcfce7;color:#166534}.state.fail{background:#fee2e2;color:#991b1b}.actions{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-top:13px}.btn{border:0;border-radius:13px;min-height:46px;padding:10px 12px;font-weight:900;cursor:pointer}.play{background:#0f766e;color:#fff}.pass{background:#dcfce7;color:#166534}.fail{background:#fee2e2;color:#991b1b}.reset{background:#f1f5f9;color:#475569;width:100%;margin-top:8px}.run{position:fixed;inset:0;background:#071827;overflow:hidden}.run iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#071827}.qa-tools{position:fixed;z-index:50;left:max(8px,var(--sal));right:max(8px,var(--sar));top:calc(8px + var(--sat));display:flex;align-items:center;gap:7px;padding:7px;border-radius:16px;background:rgba(7,24,39,.88);backdrop-filter:blur(10px);color:#fff;transition:.2s}.qa-tools.hidden{opacity:0;pointer-events:none;transform:translateY(-12px)}.qa-tools button{border:0;border-radius:11px;min-height:38px;padding:8px 11px;font-weight:900}.qa-back{background:#fff;color:#0f172a}.qa-mark-pass{background:#22c55e;color:#052e16}.qa-mark-fail{background:#ef4444;color:#fff}.qa-label{min-width:0;flex:1;font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qa-hide{background:#334155;color:#fff}.qa-reveal{position:fixed;z-index:49;right:max(8px,var(--sar));bottom:calc(8px + var(--sab));width:42px;height:42px;border:0;border-radius:50%;background:rgba(7,24,39,.88);color:#fff;font-weight:900;box-shadow:0 6px 20px #0005}.qa-toast{position:fixed;z-index:51;left:50%;bottom:calc(62px + var(--sab));transform:translateX(-50%);max-width:92vw;padding:10px 14px;border-radius:999px;background:#0f172ae8;color:#fff;font-size:12px;font-weight:900;text-align:center;opacity:0;pointer-events:none;transition:.2s}.qa-toast.show{opacity:1}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding-left:max(9px,var(--sal));padding-right:max(9px,var(--sar))}.actions{grid-template-columns:1fr auto auto}}
</style>
</head>
<body>
<div id="app"></div>
<script src="./data/platform-config.js?v=20260730-toothbrush-thai-start-r5"></script>
<script>
(()=>{'use strict';
const q=new URLSearchParams(location.search),cfg=window.HH_CONFIG||{},RUN=q.get('run')||'',STORE='hh_mobile_game_qa_v1',app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const read=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(_){return{}}};const write=v=>localStorage.setItem(STORE,JSON.stringify(v));
const active=cfg.missionProfiles?.[cfg.activeMissionProfile||'CLASS_60']||cfg.missionProfiles?.CLASS_60||{games:{}};
const zones=(cfg.zones||[]).map(zone=>({...zone,required:(active.games?.[zone.id]||[]).map(id=>(zone.games||[]).find(g=>g.id===id)).filter(Boolean)})).filter(z=>z.required.length);
const all=zones.flatMap(z=>z.required.map(g=>({...g,zoneId:z.id,zoneThai:z.thai,zoneEmoji:z.emoji}))),game=all.find(g=>g.id===RUN);
function mark(id,state){const data=read();data[id]={state,at:new Date().toISOString(),screen:`${innerWidth}x${innerHeight}`};write(data);if(RUN)toast(state==='pass'?'บันทึกว่า หน้าจอผ่าน':'บันทึกว่า ต้องแก้ไข');else renderHub()}
function launch(id){const u=new URL(location.href);u.search='';u.searchParams.set('run',id);u.searchParams.set('build','20260730-toothbrush-thai-start-r5');u.searchParams.set('cv',String(Date.now()));location.href=u.href}
function renderHub(){const data=read();app.innerHTML=`<main class="wrap"><section class="hero"><small>HEROHEALTH • MOBILE QA</small><h1>ทดสอบเกมทีละเกมบนมือถือ</h1><p>Handwash ถูกย้อนกลับไปยัง Runtime R28 + หน้าจอ R39 ซึ่งเป็นรุ่นล่าสุดที่เปิดเกมและเล่นถึงหน้าสรุปได้จริง</p><div class="badges"><span class="badge">ผล QA ไม่ปลดล็อก Flow</span><span class="badge">Handwash Stable R39</span></div></section><section class="card"><div class="notice">รอบนี้ตรวจเฉพาะว่าโหลดสำเร็จ เปิดกล้อง และเข้า Gameplay ได้ก่อน ยังไม่เพิ่ม Adaptive Easy กลับเข้า Runtime</div></section>${zones.map(z=>`<section class="zone"><div class="zone-title"><span>${esc(z.emoji||'🎯')}</span><h2>${esc(z.thai||z.id)}</h2></div><div class="grid">${z.required.map(g=>{const st=data[g.id]?.state||'';return `<article class="game"><div class="game-head"><div><h3>${esc(g.thai||g.title||g.id)}</h3><small>${g.id==='handwash'?'Stable R39 Rollback':esc(g.status||'')}</small></div><span class="state ${st}">${st==='pass'?'ผ่าน':st==='fail'?'ต้องแก้':'ยังไม่ตรวจ'}</span></div><div class="actions"><button class="btn play" data-play="${esc(g.id)}">เปิดเกมเต็มจอ</button><button class="btn pass" data-pass="${esc(g.id)}">ผ่าน</button><button class="btn fail" data-fail="${esc(g.id)}">ต้องแก้</button></div></article>`}).join('')}</div></section>`).join('')}</main>`;app.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>launch(b.dataset.play));app.querySelectorAll('[data-pass]').forEach(b=>b.onclick=()=>mark(b.dataset.pass,'pass'));app.querySelectorAll('[data-fail]').forEach(b=>b.onclick=()=>mark(b.dataset.fail,'fail'))}
function toast(text){const e=document.getElementById('qaToast');if(!e)return;e.textContent=text;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}
function renderRun(){if(!game){location.replace(location.pathname);return}const hub=new URL(location.href);hub.search='';const target=game.id==='handwash'?new URL('./classroom-contract-wrapper.html?wrappedGame=handwash&v=20260729-handwash-r39-rollback',location.href):new URL(game.url,location.href);const qaId=q.get('studentId')||'QA-MOBILE-001';const params={studentId:qaId,pid:qaId,fullName:'Mobile QA',name:'Mobile QA',section:'QA',group:'QA',classroom:'1',mode:'classroom',view:'mobile',source:'mobile-game-test-hub',qa:'1',qaStandalone:'1',dryRun:'1',noSubmit:'1',testOnly:'1',qaRun:String(Date.now()),return:hub.href,hub:hub.href,cv:String(Date.now())};Object.entries(params).forEach(([k,v])=>target.searchParams.set(k,v));app.innerHTML=`<main class="run"><iframe id="gameFrame" allow="camera;microphone;fullscreen;autoplay" allowfullscreen></iframe><div id="qaTools" class="qa-tools"><button class="qa-back" id="qaBack">← รายการเกม</button><div class="qa-label">${esc(game.thai||game.title)} • QA</div><button class="qa-mark-pass" id="qaPass">ผ่าน</button><button class="qa-mark-fail" id="qaFail">ต้องแก้</button><button class="qa-hide" id="qaHide">ซ่อน</button></div><button class="qa-reveal" id="qaReveal">QA</button><div id="qaToast" class="qa-toast"></div></main>`;document.getElementById('gameFrame').src=target.href;const tools=document.getElementById('qaTools');document.getElementById('qaBack').onclick=()=>location.href=hub.href;document.getElementById('qaPass').onclick=()=>mark(game.id,'pass');document.getElementById('qaFail').onclick=()=>mark(game.id,'fail');document.getElementById('qaHide').onclick=()=>tools.classList.add('hidden');document.getElementById('qaReveal').onclick=()=>tools.classList.remove('hidden');setTimeout(()=>tools.classList.add('hidden'),2500)}
RUN?renderRun():renderHub();
})();
</script>
</body>
</html>
