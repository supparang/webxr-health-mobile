<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0f766e">
  <title>สรุปการเล่น HeroHealth</title>
  <style>
    :root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#12302c;background:#f3fbf9}*{box-sizing:border-box}body{margin:0}.wrap{width:min(920px,100%);margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid #d6e9e4;border-radius:22px;box-shadow:0 12px 30px rgba(15,118,110,.1)}.hero{padding:22px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}.hero p{color:#dcfffa}.card{padding:17px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.zone{border-top:6px solid var(--accent)}.games{display:grid;gap:8px;margin-top:12px}.game{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:14px;background:#f4faf8}.ok{color:#087b62;font-weight:900}.missing{color:#b91c1c;font-weight:900}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.kpi{padding:13px;border-radius:16px;background:rgba(255,255,255,.16);text-align:center}.kpi b{display:block;font-size:24px}.btn{width:100%;min-height:52px;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#0f766e;color:#fff}.btn:disabled{opacity:.45}.btn-soft{background:#e8f8f4;color:#087b62;margin-top:10px}.notice{padding:13px;border-radius:14px;background:#fff5db;color:#875d00;font-weight:800}.ready{background:#e8f8f4;color:#087b62}.muted{color:#5f7470}.hidden{display:none}@media(max-width:760px){.grid,.kpis{grid-template-columns:1fr}.hero{padding:18px}.wrap{padding:10px}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <small>HEROHEALTH • OVERALL GAME SUMMARY</small>
    <h1>สรุปการเล่นทั้งหมด</h1>
    <p id="who">กำลังตรวจผลการเล่นจาก Hero Passport</p>
    <div class="kpis">
      <div class="kpi"><span>เกมที่กำหนด</span><b id="total">0</b></div>
      <div class="kpi"><span>เล่นครบ</span><b id="done">0</b></div>
      <div class="kpi"><span>คะแนนเฉลี่ย</span><b id="avg">–</b></div>
      <div class="kpi"><span>ความพร้อม</span><b id="ready">–</b></div>
    </div>
  </section>
  <section id="status" class="card"></section>
  <section id="zones" class="grid"></section>
  <section class="card">
    <h2>ก่อนทำ Post-test</h2>
    <p class="muted">ตรวจว่าภารกิจทุกเกมถูกบันทึกครบแล้ว จากนั้นจึงเข้าสู่ Post-test เพื่อวัดผลการเรียนรู้หลังจบกิจกรรม</p>
    <button id="continue" class="btn" disabled>เริ่ม Post-test</button>
    <button id="back" class="btn btn-soft">กลับ Hero Passport</button>
  </section>
</main>
<script src="./data/platform-config.js?v=20260729-overall-summary-v1"></script>
<script>
(() => {
  'use strict';
  const KEY='herohealth_learning_platform_rc2';
  const q=new URLSearchParams(location.search);
  let state={};
  try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}
  const cfg=window.HH_CONFIG||{};
  const profile=state.profile||{};
  const mission=cfg.missionProfiles?.[state.activeMissionProfile||cfg.activeMissionProfile]||cfg.missionProfiles?.CLASS_60||{games:{}};
  const zoneIds=['hygiene','nutrition','fitness'];
  const zones=zoneIds.map(id=>{
    const z=(cfg.zones||[]).find(x=>x.id===id)||{id,thai:id,emoji:'🎯',accent:'#0f766e',games:[]};
    const ids=mission.games?.[id]||[];
    const games=ids.map(gameId=>{
      const g=(z.games||[]).find(x=>x.id===gameId)||{id:gameId,thai:gameId};
      const complete=state.gameCompleted?.[id]?.[gameId]===true;
      const score=Number(state.gameScores?.[`${id}:${gameId}`]);
      return {...g,complete,score:Number.isFinite(score)?score:null};
    });
    return {...z,requiredGames:games};
  });
  const allGames=zones.flatMap(z=>z.requiredGames);
  const completed=allGames.filter(g=>g.complete);
  const scores=completed.map(g=>g.score).filter(Number.isFinite);
  const allZonesDone=zoneIds.every(id=>state.completed?.[id]===true);
  const allGamesDone=allGames.length>0&&completed.length===allGames.length;
  const eligible=allZonesDone&&allGamesDone;
  const fullName=q.get('fullName')||profile.fullName||'';
  const studentId=q.get('studentId')||profile.studentId||'';
  const section=q.get('section')||profile.section||'';
  const group=q.get('group')||state.group||profile.group||'';
  document.getElementById('who').textContent=`${fullName||'นักเรียน'} • รหัส ${studentId||'-'} • ห้อง ${section||'-'} • กลุ่ม ${group||'-'}`;
  document.getElementById('total').textContent=String(allGames.length);
  document.getElementById('done').textContent=String(completed.length);
  document.getElementById('avg').textContent=scores.length?`${Math.round(scores.reduce((a,b)=>a+b,0)/scores.length)}%`:'–';
  document.getElementById('ready').textContent=eligible?'พร้อม':'ยังไม่ครบ';
  document.getElementById('status').innerHTML=eligible
    ?'<div class="notice ready">✅ เล่นเกมครบทุกฐานแล้ว พร้อมเข้าสู่ Post-test</div>'
    :`<div class="notice">⚠️ ยังขาด ${Math.max(0,allGames.length-completed.length)} เกม กรุณากลับไปทำภารกิจที่ยังไม่ครบก่อน</div>`;
  document.getElementById('zones').innerHTML=zones.map(z=>{
    const done=z.requiredGames.filter(g=>g.complete).length;
    const zoneScores=z.requiredGames.filter(g=>g.complete&&Number.isFinite(g.score)).map(g=>g.score);
    const avg=zoneScores.length?Math.round(zoneScores.reduce((a,b)=>a+b,0)/zoneScores.length):null;
    return `<article class="card zone" style="--accent:${z.accent||'#0f766e'}"><h2>${z.emoji||'🎯'} ${z.thai||z.id}</h2><p class="muted">ครบ ${done}/${z.requiredGames.length}${avg!==null?` • เฉลี่ย ${avg}%`:''}</p><div class="games">${z.requiredGames.map(g=>`<div class="game"><span>${g.complete?'✅':'⬜'} ${g.thai||g.id}</span><span class="${g.complete?'ok':'missing'}">${g.complete?(Number.isFinite(g.score)?`${g.score}%`:'บันทึกแล้ว'):'ยังไม่ครบ'}</span></div>`).join('')}</div></article>`;
  }).join('');
  const continueBtn=document.getElementById('continue');
  continueBtn.disabled=!eligible;
  continueBtn.onclick=()=>{
    if(!eligible)return;
    state.completed=state.completed||{};
    state.completed.gameSummary=true;
    state.gameSummaryViewedAt=new Date().toISOString();
    localStorage.setItem(KEY,JSON.stringify(state));
    const u=new URL('./assessment/posttest.html',location.href);
    [['studentId',studentId],['fullName',fullName],['section',section],['group',group],['return','../index.html']].forEach(([k,v])=>{if(v)u.searchParams.set(k,v)});
    location.replace(u.href);
  };
  document.getElementById('back').onclick=()=>location.href=q.get('return')||'./index.html';
})();
</script>
</body>
</html>
