<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f766e">
<title>สรุปการเล่น HeroHealth</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#12302c;background:#f3fbf9}
*{box-sizing:border-box}body{margin:0}.wrap{width:min(920px,100%);margin:auto;padding:14px}
.hero,.card{background:#fff;border:1px solid #d6e9e4;border-radius:22px;box-shadow:0 12px 30px rgba(15,118,110,.1)}
.hero{padding:22px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}.hero p{color:#dcfffa}
.card{padding:17px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.zone{border-top:6px solid var(--accent)}.games{display:grid;gap:8px;margin-top:12px}
.game{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 12px;border-radius:14px;background:#f4faf8}
.game small{grid-column:1/-1}.ok{color:#087b62;font-weight:900}.missing{color:#b91c1c;font-weight:900}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.kpi{padding:13px;border-radius:16px;background:rgba(255,255,255,.16);text-align:center}.kpi b{display:block;font-size:24px}
.btn{width:100%;min-height:52px;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#0f766e;color:#fff}.btn:disabled{opacity:.45}
.btn-soft{background:#e8f8f4;color:#087b62;margin-top:10px}.notice{padding:13px;border-radius:14px;background:#fff5db;color:#875d00;font-weight:800}
.ready{background:#e8f8f4;color:#087b62}.error{background:#fee2e2;color:#991b1b}.muted{color:#5f7470}.authority{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:#d1fae5;color:#065f46;font-size:12px}
.spinner{display:inline-block;width:16px;height:16px;border:3px solid #cbd5e1;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){.grid,.kpis{grid-template-columns:1fr}.hero{padding:18px}.wrap{padding:10px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
  <small>HEROHEALTH • SHEET-AUTHORITATIVE SUMMARY</small>
  <h1>สรุปการเล่นทั้งหมด</h1>
  <p id="who">กำลังตรวจผลจาก Google Sheet</p>
  <div class="kpis">
    <div class="kpi"><span>เกมที่กำหนด</span><b id="total">0</b></div>
    <div class="kpi"><span>เล่นครบ</span><b id="done">0</b></div>
    <div class="kpi"><span>ความแม่นยำเฉลี่ย</span><b id="avg">–</b></div>
    <div class="kpi"><span>ความพร้อม</span><b id="ready">–</b></div>
  </div>
</section>
<section id="status" class="card"></section>
<section id="zones" class="grid"></section>
<section class="card">
  <h2>ก่อนทำ Post-test</h2>
  <p class="muted">ระบบใช้ Google Sheet เป็นแหล่งข้อมูลทางการเพียงแห่งเดียว และจะไม่ใช้ข้อมูลในเครื่องปลดล็อก Post-test</p>
  <button id="continue" class="btn" disabled>กำลังตรวจ Google Sheet…</button>
  <button id="retry" class="btn btn-soft">ตรวจ Google Sheet อีกครั้ง</button>
  <button id="back" class="btn btn-soft">กลับ Hero Passport</button>
</section>
</main>
<script src="./data/platform-config.js?v=20260729-legacy-certificate-fix-v1"></script>
<script src="./data/backend-config.js?v=20260729-legacy-certificate-fix-v1"></script>
<script src="./assets/student-resume-v7-mobile.js?v=20260729-legacy-certificate-fix-v1"></script>
<script src="./assets/legacy-certificate-authority-fix-v1.js?v=20260729-legacy-certificate-fix-v1"></script>
<script>
(()=>{
'use strict';
const RELEASE='20260731-GAME-SUMMARY-NORMALIZED-METRICS-R51';
const KEY='herohealth_learning_platform_rc2';
const q=new URLSearchParams(location.search);
const cfg=window.HH_CONFIG||{};
const zoneIds=['hygiene','nutrition','fitness'];
const $=id=>document.getElementById(id);
const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}};
const write=s=>localStorage.setItem(KEY,JSON.stringify(s));
const norm=v=>String(v||'').trim().replace(/\s+/g,'');
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
const pct=v=>{const n=num(v);return n===null?null:Math.max(0,Math.min(100,n))};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));
const formatNumber=v=>Number.isInteger(v)?String(v):Number(v).toFixed(1).replace(/\.0$/,'');

function missionFor(s){
  return cfg.missionProfiles?.[s.activeMissionProfile||cfg.activeMissionProfile]||
    cfg.missionProfiles?.CLASS_60||{games:{}};
}

function firstFinite(values){
  for(const value of values){
    const n=num(value);
    if(n!==null)return n;
  }
  return null;
}

function resultMeta(s,z,g){
  const k=z+':'+g;
  const r=s.gameResults?.[k]||s.gameResults?.[g]||{};
  const score=firstFinite([
    s.gameScores?.[k],s.gameScores?.[g],r.bestScore,r.score,r.totalScore
  ]);
  const accuracy=pct(firstFinite([
    r.accuracy,r.bestAccuracy,r.accuracyPct,r.accuracyPercent,
    r.masteryPct,r.performancePct,r.percentCorrect,
    s.gameAccuracy?.[k],s.gameAccuracy?.[g]
  ]));
  return{
    score,
    accuracy,
    attempts:firstFinite([r.attempts,r.attemptCount,r.totalAttempts]),
    duration:firstFinite([r.durationSec,r.duration,r.timeSeconds])
  };
}

function build(s){
  const mission=missionFor(s);
  return zoneIds.map(id=>{
    const zone=(cfg.zones||[]).find(x=>x.id===id)||{id,thai:id,emoji:'🎯',accent:'#0f766e',games:[]};
    return{
      ...zone,
      requiredGames:(mission.games?.[id]||[]).map(gameId=>{
        const game=(zone.games||[]).find(x=>x.id===gameId)||{id:gameId,thai:gameId};
        return{
          ...game,
          ...resultMeta(s,id,gameId),
          complete:s.gameCompleted?.[id]?.[gameId]===true
        };
      })
    };
  });
}

function displayMetric(game){
  if(Number.isFinite(game.accuracy))return `ความแม่นยำ ${Math.round(game.accuracy)}%`;
  if(Number.isFinite(game.score))return `คะแนน ${formatNumber(game.score)}`;
  return 'บันทึกแล้ว';
}

function render(s,opt={}){
  const p=s.profile||{};
  const sid=norm(q.get('studentId')||p.studentId);
  const name=q.get('fullName')||p.fullName||'';
  const section=q.get('section')||p.section||'';
  const group=q.get('group')||s.group||p.group||'';
  const zones=build(s);
  const all=zones.flatMap(z=>z.requiredGames);
  const done=all.filter(g=>g.complete);
  const accuracies=done.map(g=>g.accuracy).filter(Number.isFinite);
  const fresh=s.sheetAuthority===true&&!s.offlineAuthority&&!!s.lastAuthoritySyncAt;
  const allZones=zoneIds.every(id=>s.completed?.[id]===true);
  const eligible=fresh&&all.length===6&&done.length===6&&allZones;

  $('who').textContent=`${name||'นักเรียน'} • รหัส ${sid||'-'} • ห้อง ${section||'-'} • กลุ่ม ${group||'-'}`;
  $('total').textContent=String(all.length);
  $('done').textContent=String(done.length);
  $('avg').textContent=accuracies.length?`${Math.round(accuracies.reduce((a,b)=>a+b,0)/accuracies.length)}%`:'–';
  $('ready').textContent=eligible?'พร้อม':fresh?'ยังไม่ครบ':'รอ Sheet';

  if(opt.error){
    $('status').innerHTML=`<div class="notice error">❌ ยังเชื่อม Google Sheet ไม่สำเร็จ: ${esc(opt.error)}<br><span class="muted">Post-test ยังคงล็อก</span></div>`;
  }else if(s.legacyCertificateRestored){
    $('status').innerHTML='<div class="notice ready">✅ พบ Certificate เดิมใน Google Sheet ระบบยืนยันว่าจบภารกิจแล้ว <span class="authority">Legacy Certificate Restored</span></div>';
  }else if(eligible){
    $('status').innerHTML='<div class="notice ready">✅ Google Sheet ยืนยันครบทั้ง 6 เกมแล้ว <span class="authority">Sheet Authority</span></div>';
  }else if(fresh){
    $('status').innerHTML=`<div class="notice">⚠️ Google Sheet ยืนยันแล้วว่ายังขาด ${Math.max(0,all.length-done.length)} เกม</div>`;
  }else{
    $('status').innerHTML='<div class="notice"><span class="spinner"></span> กำลังตรวจข้อมูลทางการจาก Google Sheet</div>';
  }

  $('zones').innerHTML=zones.map(zone=>{
    const completedCount=zone.requiredGames.filter(game=>game.complete).length;
    const zoneAccuracies=zone.requiredGames.map(game=>game.accuracy).filter(Number.isFinite);
    const zoneAverage=zoneAccuracies.length
      ?Math.round(zoneAccuracies.reduce((a,b)=>a+b,0)/zoneAccuracies.length)
      :null;
    return `<article class="card zone" style="--accent:${esc(zone.accent||'#0f766e')}">
      <h2>${zone.emoji||'🎯'} ${esc(zone.thai||zone.id)}</h2>
      <p class="muted">ครบ ${completedCount}/${zone.requiredGames.length}${zoneAverage!==null?` • ความแม่นยำเฉลี่ย ${zoneAverage}%`:''}</p>
      <div class="games">${zone.requiredGames.map(game=>{
        const extra=[];
        if(Number.isFinite(game.score))extra.push(`คะแนนดิบ ${formatNumber(game.score)}`);
        if(Number.isFinite(game.attempts))extra.push(`ลอง ${game.attempts} ครั้ง`);
        if(Number.isFinite(game.duration))extra.push(`เวลา ${Math.round(game.duration)} วินาที`);
        return `<div class="game">
          <span>${game.complete?'✅':'⬜'} ${esc(game.thai||game.id)}</span>
          <span class="${game.complete?'ok':'missing'}">${game.complete?displayMetric(game):'ยังไม่ครบ'}</span>
          ${extra.length?`<small class="muted">${extra.join(' • ')}</small>`:''}
        </div>`;
      }).join('')}</div>
    </article>`;
  }).join('');

  const btn=$('continue');
  btn.disabled=!eligible;
  btn.textContent=eligible?'ยืนยันสรุปและเริ่ม Post-test':'Post-test ยังล็อก';
  btn.onclick=()=>{
    if(!eligible)return;
    const at=new Date().toISOString();
    s.completed={...(s.completed||{}),gameSummary:true};
    s.gameSummaryViewedAt=at;
    s.gameSummaryAuthority={
      studentId:sid,
      sheetVersion:s.sheetVersion||'',
      lastAuthoritySyncAt:s.lastAuthoritySyncAt,
      requiredGames:all.map(g=>g.id),
      completedGames:done.map(g=>g.id),
      acknowledgedAt:at,
      summaryRelease:RELEASE
    };
    write(s);
    sessionStorage.setItem('hh_summary_authority:'+sid,JSON.stringify(s.gameSummaryAuthority));
    const url=new URL('./assessment/posttest.html',location.href);
    [['studentId',sid],['fullName',name],['section',section],['group',group],['summaryAuthority','1'],['return','../index.html']]
      .forEach(([key,value])=>{if(value)url.searchParams.set(key,value)});
    location.replace(url.href);
  };
}

async function refresh(){
  const local=read();
  const sid=norm(q.get('studentId')||local.profile?.studentId);
  if(!sid){render(local,{error:'ไม่พบรหัสนักเรียน'});return}
  $('continue').disabled=true;
  $('continue').textContent='กำลังตรวจ Google Sheet…';
  try{
    if(!window.HHStudentResume?.getStudent||!window.HHStudentResume?.officialState){
      throw new Error('โหลดระบบ Sheet Authority ไม่สำเร็จ');
    }
    const api=await window.HHStudentResume.getStudent(sid);
    const base={
      ...(local.profile||{}),
      studentId:sid,
      fullName:q.get('fullName')||local.profile?.fullName||'',
      section:q.get('section')||local.profile?.section||'',
      group:q.get('group')||local.profile?.group||local.group||''
    };
    const official=window.HHStudentResume.officialState(base,api);
    official.offlineAuthority=false;
    write(official);
    render(official);
  }catch(error){
    render(local,{error:String(error?.message||error)});
  }
}

$('retry').onclick=refresh;
$('back').onclick=()=>location.href=q.get('return')||'./index.html';
render(read());
setTimeout(refresh,100);
})();
</script>
</body>
</html>
