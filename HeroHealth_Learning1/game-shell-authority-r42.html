<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#082f49">
<title>HeroHealth Classroom Game</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#03131d;color:#fff;font-family:system-ui,sans-serif}.loading{max-width:88vw;padding:22px;border-radius:22px;background:#0b2d3d;text-align:center;box-shadow:0 20px 60px #0007}.center{width:100%;height:100%;display:grid;place-items:center}.loading b{display:block;font-size:20px}.loading small{display:block;margin-top:8px;color:#b9dbe7}.loading button{margin-top:14px;padding:12px 18px;border:0;border-radius:12px;font:inherit;font-weight:900}.firebase-shell{display:grid;grid-template-rows:auto 1fr;width:100%;height:100%;overflow:hidden}.firebase-bar{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;background:#0f766e;font-weight:900}.firebase-bar.test{background:#92400e}.firebase-bar button{padding:9px 13px;border:1px solid #ffffff55;border-radius:11px;background:#ffffff18;color:#fff;font:inherit;font-weight:900}.firebase-bar button:disabled{opacity:.65}.firebase-bar #receiptStatus{margin-left:auto;text-align:right;font-size:13px}.firebase-shell iframe{width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<div class="center"><div class="loading"><b>กำลังเตรียมภารกิจ</b><small>กำลังเชื่อมต่อ Firebase Learning Analytics กรุณารอสักครู่</small></div></div>
<script>
(()=>{'use strict';
const RELEASE='20260805-GAME-SHELL-R46-FORCE-FIREBASE-REHYDRATE';
const shellQuery=new URLSearchParams(location.search);
const firebaseMode=String(shellQuery.get('authority')||'').toLowerCase()==='firebase';
const gameTestMode=String(shellQuery.get('gameTestMode')||'')==='1'||String(shellQuery.get('mode')||'').toLowerCase()==='game-test';

if(!firebaseMode){
  const legacy=new URL('./game-shell-authority-r40.html',location.href);
  shellQuery.forEach((value,key)=>legacy.searchParams.set(key,value));
  legacy.searchParams.set('shellVersion',RELEASE);
  location.replace(legacy.href);
  return;
}

const target=String(shellQuery.get('target')||'').trim();
const rawBack=String(shellQuery.get('return')||shellQuery.get('back')||(gameTestMode?'./game-test-mode.html':'./index.html')).trim();
function sanitizeFirebaseReturn(raw){
  const u=new URL(raw,location.href);
  for(const key of [
    'logout','logoutAt','logoutNonce','firebaseHydratedR71','firebaseHydrated',
    'firebaseProgressApplied','pendingGameSync','gameSync','firebaseAssessmentReceipt'
  ])u.searchParams.delete(key);
  const sid=String(shellQuery.get('studentId')||shellQuery.get('sid')||shellQuery.get('pid')||'').trim();
  if(sid){u.searchParams.set('studentId',sid);u.searchParams.set('sid',sid)}
  for(const key of ['fullName','studentName','name','section','group','firebaseUid']){
    const value=shellQuery.get(key);if(value)u.searchParams.set(key,value);
  }
  u.searchParams.set('authority','firebase');
  u.searchParams.set('firebaseReady','1');
  u.searchParams.set('authorityRefresh',String(Date.now()));
  u.searchParams.set('returnSessionPolicy','force-firebase-rehydrate-r46');
  return u.href;
}
const back=sanitizeFirebaseReturn(rawBack);
shellQuery.set('return',back);
shellQuery.set('back',back);
shellQuery.set('shellVersion',RELEASE);
try{
  const shellUrl=new URL(location.href);
  shellUrl.search=shellQuery.toString();
  history.replaceState(history.state,'',shellUrl.href);
}catch(_){}

if(!target){
  document.body.innerHTML='<div class="center"><div class="loading"><b>ไม่พบเส้นทางเกม</b><small>กรุณากลับแล้วเปิดภารกิจใหม่</small></div></div>';
  return;
}

const targetUrl=new URL(target,location.href);
for(const key of ['authority','studentId','sid','pid','fullName','studentName','name','section','group','firebaseUid','gameId','zone','studyId','conditionGroup','phase','difficulty','mode','gameTestMode','isTestAttempt','affectsProgression','testRunId']){
  const value=shellQuery.get(key);
  if(value)targetUrl.searchParams.set(key,value);
}
targetUrl.searchParams.set('authority','firebase');
targetUrl.searchParams.set('return',back);
targetUrl.searchParams.set('back',back);
targetUrl.searchParams.set('firebaseShellVersion',RELEASE);
targetUrl.searchParams.set('_',Date.now());

document.body.innerHTML='<main class="firebase-shell"><header class="firebase-bar'+(gameTestMode?' test':'')+'"><button id="back">← '+(gameTestMode?'กลับหน้าเลือกเกม':'กลับ Passport')+'</button><span id="gameTitle"></span><span id="receiptStatus">กำลังเตรียม Learning Analytics</span></header><iframe id="game" allow="camera; microphone; accelerometer; gyroscope; autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></main>';
document.getElementById('gameTitle').textContent=(shellQuery.get('title')||'HeroHealth')+(gameTestMode?' • TEST MODE':'');
const backButton=document.getElementById('back');
backButton.onclick=()=>location.replace(back);

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src=src;script.async=false;script.onload=resolve;script.onerror=()=>reject(new Error('load_failed_'+src));
    document.head.appendChild(script);
  });
}

(async()=>{
  try{
    if(gameTestMode){
      await loadScript('./assets/firebase-game-test-analytics-r1.js?v=20260805-r1');
    }else{
      await loadScript('./assets/firebase-game-receipt-bridge-r1.js?v=20260805-r4-learning-analytics');
    }
    if(String(shellQuery.get('gameId')||'').toLowerCase().includes('goodjunk')||targetUrl.href.toLowerCase().includes('goodjunk')){
      await loadScript('./assets/goodjunk-firebase-completion-patch-r3.js?v=20260805-r3');
    }
    document.getElementById('receiptStatus').textContent=gameTestMode?'พร้อมทดสอบ • ไม่กระทบ Progress':'พร้อมเล่นเกม • Analytics เปิดแล้ว';
    document.getElementById('game').src=targetUrl.href;
  }catch(error){
    console.error('[Game Shell R46]',error);
    document.getElementById('receiptStatus').textContent='โหลด Firebase Learning Analytics ไม่สำเร็จ';
    backButton.textContent=gameTestMode?'กลับหน้าเลือกเกม':'กลับ Passport';
  }
})();

window.HH_GAME_SHELL_R46={release:RELEASE,authority:'firebase',firebaseExclusive:true,gameTestMode,affectsProgression:!gameTestMode,learningAnalyticsSchema:gameTestMode?'HH-GAME-TEST-ANALYTICS-V1':'HH-LEARNING-ANALYTICS-V1',returnSessionPolicy:'force-firebase-rehydrate'};
console.info('[Game Shell R46] installed',{gameTestMode,gameId:shellQuery.get('gameId'),target:targetUrl.href,back});
})();
</script>
</body>
</html>
