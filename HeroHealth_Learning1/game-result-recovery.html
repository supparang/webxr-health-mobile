<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>HeroHealth Game Result Recovery</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#12302c;background:#f3fbf9}*{box-sizing:border-box}body{margin:0}.wrap{width:min(760px,100%);margin:auto;padding:18px}.card{background:#fff;border:1px solid #d6e9e4;border-radius:24px;box-shadow:0 12px 30px rgba(15,118,110,.12);padding:28px;text-align:center;margin-top:6vh}.icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:#e8f8f4;font-size:38px}.badge{display:inline-block;border-radius:999px;padding:8px 13px;background:#e8f8f4;color:#087b62;font-weight:900}.badge.wait{background:#fff5db;color:#9a6700}.badge.error{background:#fee2e2;color:#991b1b}.btn{width:100%;min-height:52px;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#0f766e;color:#fff;margin-top:14px}.btn.secondary{background:#e8f8f4;color:#087b62}.muted{color:#5f7470;line-height:1.6}.details{font-size:13px;overflow-wrap:anywhere;background:#f5faf9;border-radius:14px;padding:12px;margin-top:14px;text-align:left}.errorText{color:#b91c1c;font-weight:800}@media(max-width:600px){.wrap{padding:12px}.card{padding:24px 18px;margin-top:3vh}}
</style>
</head>
<body>
<main class="wrap"><section class="card"><div class="icon" id="icon">↻</div><h1 id="title">กำลังกู้ผลเกม</h1><p class="muted" id="message">กำลังอ่านผลเกมที่บันทึกไว้ในเครื่องและส่งเข้า Google Sheet</p><div class="badge wait" id="badge">กำลังตรวจสอบ</div><div class="details" id="details"></div><button class="btn" id="retry" hidden>ลองส่งอีกครั้ง</button><button class="btn secondary" id="passport" hidden>กลับ Hero Passport</button></section></main>
<script>
(()=>{'use strict';
const VERSION='20260730-GAME-RESULT-RECOVERY-R35';
const ENDPOINT='https://script.google.com/macros/s/AKfycbwa-OSdqWS7uPne01wNr5a42PgKfAoxmUUm7yMcUx2D0C0OnbjrbppNUHkfjUxm79Fz/exec';
const QUEUE_KEY='herohealth_backend_queue_v7',STATE_KEY='herohealth_learning_platform_rc2',RESUME_PREFIX='herohealth_student_resume_v6:';
const q=new URLSearchParams(location.search),sid=String(q.get('studentId')||q.get('sid')||'').trim(),zone=String(q.get('zone')||'').trim(),gameId=String(q.get('gameId')||'').trim();
const el=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function readJson(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch(_){return fallback}}
function writeJson(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(_){return false}}
function set(title,message,badge,kind,icon){el('title').textContent=title;el('message').textContent=message;el('badge').textContent=badge;el('badge').className='badge '+(kind||'');el('icon').textContent=icon||'↻'}
function findPayload(){const queue=readJson(QUEUE_KEY,[]);return queue.slice().reverse().find(p=>String(p?.studentId||'').trim()===sid&&(!zone||String(p?.zone||p?.game?.zone||'')===zone)&&(!gameId||String(p?.gameId||p?.game?.gameId||'')===gameId))||null}
function showDetails(payload,result){el('details').textContent=`รหัส ${sid||'-'} • ${payload?.zone||payload?.game?.zone||zone||'-'}:${payload?.gameId||payload?.game?.gameId||gameId||'-'} • Event ${payload?.eventId||'-'} • คะแนน ${payload?.game?.score??payload?.score??'-'}${result?.version?' • '+result.version:''}`}
function jsonp(params,timeout=18000){return new Promise((resolve,reject)=>{const cb='HHGR_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),s=document.createElement('script');let done=false;const finish=(err,data)=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(_){};try{s.remove()}catch(_){};err?reject(err):resolve(data)};const timer=setTimeout(()=>finish(new Error('sheet_timeout')),timeout);window[cb]=data=>finish(null,data);s.onerror=()=>finish(new Error('sheet_load_failed'));s.src=ENDPOINT+'?'+new URLSearchParams({...params,callback:cb,_:String(Date.now()),clientVersion:VERSION}).toString();document.head.appendChild(s)})}
function formPost(payload){return new Promise((resolve,reject)=>{try{const name='HHGRPOST_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),iframe=document.createElement('iframe'),form=document.createElement('form');iframe.name=name;iframe.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px';form.method='POST';form.action=ENDPOINT;form.target=name;form.acceptCharset='UTF-8';form.enctype='application/x-www-form-urlencoded';form.style.display='none';const fields={action:'submit',payload:JSON.stringify(payload),transport:'hidden-form-post-recovery-r35',clientVersion:VERSION,_:String(Date.now())};Object.entries(fields).forEach(([k,v])=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=v;form.appendChild(input)});document.body.appendChild(iframe);document.body.appendChild(form);form.submit();setTimeout(()=>resolve(true),250);setTimeout(()=>{try{form.remove()}catch(_){}try{iframe.remove()}catch(_){}},60000)}catch(err){reject(err)}})}
function gameConfirmed(api,payload){const z=String(payload?.zone||payload?.game?.zone||zone),g=String(payload?.gameId||payload?.game?.gameId||gameId),gc=api?.authoritativeState?.gameCompleted||api?.gameCompleted||{};return gc?.[z]?.[g]===true}
function applyAuthority(api,payload){const a=api?.authoritativeState||{},old=readJson(STATE_KEY,{}),profile={...(old.profile||{}),...(a.profile||api?.profile||{}),studentId:sid},next={...old,...a,profile,sheetAuthority:true,lastAuthoritySyncAt:new Date().toISOString(),sheetVersion:api?.version||''};writeJson(STATE_KEY,next);writeJson(RESUME_PREFIX+sid,next);const queue=readJson(QUEUE_KEY,[]).filter(x=>String(x?.eventId||'')!==String(payload.eventId||''));writeJson(QUEUE_KEY,queue)}
async function run(){el('retry').hidden=true;el('passport').hidden=true;if(!sid){set('ไม่พบรหัสนักเรียน','เปิดหน้านี้พร้อม studentId','ไม่สามารถกู้ผล','error','!');return}const payload=findPayload();if(!payload){set('ไม่พบผลเกมที่รอส่ง','ต้องเปิดด้วยเบราว์เซอร์และอุปกรณ์เครื่องเดิมที่เล่นเกม','ไม่พบข้อมูล','error','!');el('passport').hidden=false;return}showDetails(payload);set('กำลังส่งผลเกมเดิมเข้า Google Sheet','ไม่ต้องเล่นเกมใหม่ กรุณารอการยืนยัน','กำลังส่งและตรวจสอบ','wait','↻');try{const existing=await jsonp({action:'event',eventId:payload.eventId}).catch(()=>null);if(!(existing?.ok&&existing?.found)){await formPost(payload)}let found=false;for(const delay of [700,900,1100,1400,1700,2100,2500,3000]){await sleep(delay+Math.floor(Math.random()*300));const eventApi=await jsonp({action:'event',eventId:payload.eventId}).catch(()=>null);if(eventApi?.ok&&eventApi?.found){found=true;break}}if(!found)throw new Error('event_not_found_after_form_post');let api=null;for(const delay of [300,700,1000,1400,1800]){if(delay)await sleep(delay);api=await jsonp({action:'student',studentId:sid,reconcile:'1'}).catch(()=>null);if(api?.ok&&gameConfirmed(api,payload))break}if(!(api?.ok&&gameConfirmed(api,payload)))throw new Error('game_not_confirmed_in_student_authority');applyAuthority(api,payload);showDetails(payload,api);set('Google Sheet ยืนยันเกมแล้ว','บันทึกผลเกมเดิมสำเร็จ และ Passport ปลดล็อกภารกิจถัดไปแล้ว','✓ ยืนยันจาก Google Sheet','','✓');el('passport').hidden=false}catch(err){console.error(err);set('ยังไม่ได้รับการยืนยัน','ผลเกมเดิมยังอยู่ในเครื่อง กดลองส่งอีกครั้งได้โดยไม่ต้องเล่นใหม่','ยังไม่เข้า Google Sheet','error','!');el('message').innerHTML+=' <span class="errorText">'+String(err?.message||err)+'</span>';el('retry').hidden=false;el('passport').hidden=false}}
el('retry').onclick=run;el('passport').onclick=()=>location.href='./index.html?studentId='+encodeURIComponent(sid)+'&authorityRefresh='+Date.now()+'&v=20260730-game-recovery-r35';run();
})();
</script>
</body>
</html>
