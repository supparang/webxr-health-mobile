<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>HeroHealth Game Result Recovery</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#12302c;background:#f3fbf9}*{box-sizing:border-box}body{margin:0}.wrap{width:min(760px,100%);margin:auto;padding:18px}.card{background:#fff;border:1px solid #d6e9e4;border-radius:24px;box-shadow:0 12px 30px rgba(15,118,110,.12);padding:28px;text-align:center;margin-top:5vh}.icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:#e8f8f4;font-size:38px}.badge{display:inline-block;border-radius:999px;padding:8px 13px;background:#e8f8f4;color:#087b62;font-weight:900}.badge.wait{background:#fff5db;color:#9a6700}.badge.error{background:#fee2e2;color:#991b1b}.btn{width:100%;min-height:52px;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#0f766e;color:#fff;margin-top:14px}.btn.secondary{background:#e8f8f4;color:#087b62}.muted{color:#5f7470;line-height:1.6}.details{font-size:13px;overflow-wrap:anywhere;background:#f5faf9;border-radius:14px;padding:12px;margin-top:14px;text-align:left;white-space:pre-line}.errorText{color:#b91c1c;font-weight:800}@media(max-width:600px){.wrap{padding:12px}.card{padding:24px 18px;margin-top:3vh}}
</style>
</head>
<body>
<main class="wrap"><section class="card"><div class="icon" id="icon">↻</div><h1 id="title">กำลังกู้ผลเกม</h1><p class="muted" id="message">กำลังค้นหาผลเกมจากข้อมูลที่ยังอยู่ในเครื่อง</p><div class="badge wait" id="badge">กำลังตรวจสอบ</div><div class="details" id="details"></div><button class="btn" id="retry" hidden>ลองส่งอีกครั้ง</button><button class="btn secondary" id="passport" hidden>กลับ Hero Passport</button></section></main>
<script>
(()=>{'use strict';
const VERSION='20260730-GAME-RESULT-RECOVERY-R36-MULTISOURCE';
const ENDPOINT='https://script.google.com/macros/s/AKfycbwa-OSdqWS7uPne01wNr5a42PgKfAoxmUUm7yMcUx2D0C0OnbjrbppNUHkfjUxm79Fz/exec';
const QUEUE_KEYS=['herohealth_backend_queue_v7','herohealth_backend_queue_v8','HH_GAME_SYNC_QUEUE'];
const STATE_KEY='herohealth_learning_platform_rc2',RESUME_PREFIX='herohealth_student_resume_v6:';
const q=new URLSearchParams(location.search),sid=String(q.get('studentId')||q.get('sid')||'').trim(),zone=String(q.get('zone')||'').trim(),gameId=String(q.get('gameId')||'').trim(),explicitScore=Number(q.get('score'));
const el=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const num=v=>{const n=Number(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0};
const yes=v=>v===true||v===1||String(v||'').toLowerCase()==='true'||String(v||'')==='1'||String(v||'').toLowerCase()==='yes';
function readJson(store,key,fallback){try{return JSON.parse(store.getItem(key)||JSON.stringify(fallback))}catch(_){return fallback}}
function writeJson(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(_){return false}}
function state(){return readJson(localStorage,STATE_KEY,{})}
function set(title,message,badge,kind,icon){el('title').textContent=title;el('message').textContent=message;el('badge').textContent=badge;el('badge').className='badge '+(kind||'');el('icon').textContent=icon||'↻'}
function compact(value,depth=0){if(depth>5||value==null)return value==null?value:undefined;if(['number','boolean'].includes(typeof value))return value;if(typeof value==='string')return value.slice(0,4000);if(Array.isArray(value))return value.slice(0,500).map(v=>compact(v,depth+1)).filter(v=>v!==undefined);if(typeof value==='object'){const out={};Object.keys(value).slice(0,300).forEach(k=>{if(/base64|imageData|videoData|rawFrame|blob/i.test(k))return;const v=compact(value[k],depth+1);if(v!==undefined)out[k]=v});return out}}
function matchesPayload(p){return p&&String(p.studentId||p.game?.studentId||'').trim()===sid&&(!zone||String(p.zone||p.game?.zone||'')===zone)&&(!gameId||String(p.gameId||p.game?.gameId||p.game?.game_id||'')===gameId)}
function queuedPayload(){for(const key of QUEUE_KEYS){const list=readJson(localStorage,key,[]);const found=Array.isArray(list)?list.slice().reverse().find(matchesPayload):null;if(found)return{payload:found,source:'queue:'+key}}return null}
function resultKeys(){const base={groups:['HHA_GROUPS_AR_LAST_RESULT','groups_ar_last_result','HHA_GROUPS_LAST_RESULT'],goodjunk:['HHA_GOODJUNK_AR_LAST_RESULT','HHA_GOODJUNK_AR_LAST','GOODJUNK_AR_LAST_RESULT','goodjunk_pending_result'],handwash:['HHA_HANDWASH_LAST_RESULT'],toothbrush:['HHA_TOOTHBRUSH_LAST_RESULT','toothbrush_pending_result'],jumpduck:['HHA_JUMPDUCK_LAST_RESULT'], 'balance-hold':['HHA_BALANCE_HOLD_LAST_RESULT']};return base[gameId]||[]}
function storedRaw(){for(const store of [localStorage,sessionStorage]){for(const key of resultKeys()){const raw=readJson(store,key,null);if(raw&&typeof raw==='object')return{raw,source:(store===localStorage?'local:':'session:')+key}}for(let i=0;i<store.length;i++){const key=store.key(i)||'';if(!new RegExp(gameId.replace('-','.?'),'i').test(key))continue;const raw=readJson(store,key,null);if(raw&&typeof raw==='object'&&(raw.score!=null||raw.totalScore!=null||raw.completed!=null||raw.finishedAt))return{raw,source:(store===localStorage?'scan-local:':'scan-session:')+key}}}return null}
function makePayload(raw,source){const s=state(),profile=s.profile||{},z=zone||String(raw.zone||'').trim(),g=gameId||String(raw.gameId||raw.game_id||'').trim(),score=Number.isFinite(explicitScore)?explicitScore:num(raw.score??raw.totalScore),accuracy=num(raw.accuracy??raw.direction_accuracy??raw.correctRate),summaryFallback=source==='explicit-summary';const completed=summaryFallback?true:(yes(raw.completed)||yes(raw.procedureCompleted)||['groups','goodjunk'].includes(g));const eventId=String(raw.eventId||raw.record_id||raw.attemptId||`HH-game-recovery-${z}-${g}-${sid}-${Date.now()}`);const game={...(compact(raw)||{}),studentId:sid,profile:{fullName:profile.fullName||'',section:profile.section||'',group:profile.group||''},zone:z,gameId:g,game_id:g,game_key:g,score,accuracy,scoreAvailable:true,completed,procedureCompleted:completed,progressionEligible:completed,passed:raw.passed!==false,skillCriteriaMet:yes(raw.skillCriteriaMet??raw.passed),finishedAt:raw.finishedAt||new Date().toISOString(),inputMode:raw.inputMode||raw.mode||'classroom-ar',gameVersion:raw.gameVersion||raw.version||'',singleAttemptPolicy:true,retryRequired:false,completionPolicy:'one-classroom-round-completes',analyticsSchemaVersion:raw.analyticsSchemaVersion||'HH-UNIFIED-GAME-ANALYTICS-V2',metricCompletenessPct:summaryFallback?0:num(raw.metricCompletenessPct),recoverySource:source,analyticsUnavailable:summaryFallback,recoveryNote:summaryFallback?'Recovered from observed end-screen score; detailed telemetry unavailable because legacy submit queue was absent.':''};return{eventType:'game',type:'game',eventId,studentId:sid,zone:z,gameId:g,completed,procedureCompleted:completed,progressionEligible:completed,passed:game.passed,profile:game.profile,clientTs:new Date().toISOString(),currentStep:`${z}:${g}`,status:`Recovered completed ${z}:${g} from ${source}`,recovery:true,game}}
function findPayload(){const queued=queuedPayload();if(queued)return queued;const stored=storedRaw();if(stored)return{payload:makePayload(stored.raw,stored.source),source:stored.source};if(Number.isFinite(explicitScore)&&explicitScore>=0&&sid&&zone&&gameId)return{payload:makePayload({score:explicitScore,completed:true,passed:true},'explicit-summary'),source:'explicit-summary'};return null}
function showDetails(payload,source,result){el('details').textContent=`รหัส ${sid||'-'} • ${payload?.zone||payload?.game?.zone||zone||'-'}:${payload?.gameId||payload?.game?.gameId||gameId||'-'}\nEvent ${payload?.eventId||'-'} • คะแนน ${payload?.game?.score??payload?.score??'-'}\nแหล่งกู้คืน: ${source||'-'}${payload?.game?.analyticsUnavailable?'\nหมายเหตุ: ปลดล็อกจากผลหน้าสรุป แต่ Analytics รายละเอียดยังไม่ครบ':''}${result?.version?'\nReceiver: '+result.version:''}`}
function jsonp(params,timeout=18000){return new Promise((resolve,reject)=>{const cb='HHGR_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),s=document.createElement('script');let done=false;const finish=(err,data)=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(_){};try{s.remove()}catch(_){};err?reject(err):resolve(data)};const timer=setTimeout(()=>finish(new Error('sheet_timeout')),timeout);window[cb]=data=>finish(null,data);s.onerror=()=>finish(new Error('sheet_load_failed'));s.src=ENDPOINT+'?'+new URLSearchParams({...params,callback:cb,_:String(Date.now()),clientVersion:VERSION}).toString();document.head.appendChild(s)})}
function formPost(payload){return new Promise((resolve,reject)=>{try{const name='HHGRPOST_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),iframe=document.createElement('iframe'),form=document.createElement('form');iframe.name=name;iframe.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px';form.method='POST';form.action=ENDPOINT;form.target=name;form.acceptCharset='UTF-8';form.enctype='application/x-www-form-urlencoded';form.style.display='none';const fields={action:'submit',payload:JSON.stringify(payload),transport:'hidden-form-post-recovery-r36',clientVersion:VERSION,_:String(Date.now())};Object.entries(fields).forEach(([k,v])=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=v;form.appendChild(input)});document.body.appendChild(iframe);document.body.appendChild(form);form.submit();setTimeout(()=>resolve(true),250);setTimeout(()=>{try{form.remove()}catch(_){}try{iframe.remove()}catch(_){}},60000)}catch(err){reject(err)}})}
function gameConfirmed(api,payload){const z=String(payload?.zone||payload?.game?.zone||zone),g=String(payload?.gameId||payload?.game?.gameId||gameId),gc=api?.authoritativeState?.gameCompleted||api?.gameCompleted||{};return gc?.[z]?.[g]===true}
function applyAuthority(api,payload){const a=api?.authoritativeState||{},old=state(),profile={...(old.profile||{}),...(a.profile||api?.profile||{}),studentId:sid},next={...old,...a,profile,sheetAuthority:true,lastAuthoritySyncAt:new Date().toISOString(),sheetVersion:api?.version||''};writeJson(STATE_KEY,next);writeJson(RESUME_PREFIX+sid,next);QUEUE_KEYS.forEach(key=>{const list=readJson(localStorage,key,[]);if(Array.isArray(list))writeJson(key,list.filter(x=>String(x?.eventId||'')!==String(payload.eventId||'')))})}
async function run(){el('retry').hidden=true;el('passport').hidden=true;if(!sid){set('ไม่พบรหัสนักเรียน','เปิดหน้านี้พร้อม studentId','ไม่สามารถกู้ผล','error','!');return}let existingStudent=await jsonp({action:'student',studentId:sid,reconcile:'1'}).catch(()=>null);if(existingStudent?.ok&&existingStudent?.gameCompleted?.[zone]?.[gameId]===true){applyAuthority(existingStudent,{eventId:''});set('Google Sheet มีผลเกมนี้แล้ว','Passport สามารถใช้สถานะจาก Sheet ได้ทันที','✓ ยืนยันจาก Google Sheet','','✓');el('passport').hidden=false;return}const found=findPayload();if(!found){set('ไม่พบผลเกมที่รอส่ง','ระบบตรวจทั้ง Queue, Local Storage และ Session Storage แล้ว แต่ผลละเอียดจากเกมเดิมไม่เหลืออยู่','ไม่พบข้อมูล','error','!');el('details').textContent='ใช้ลิงก์ Recovery ที่มี score จากหน้าสรุป เพื่อบันทึกผลแบบมีธง Analytics ไม่ครบ';el('passport').hidden=false;return}const {payload,source}=found;showDetails(payload,source);set('กำลังส่งผลเกมเดิมเข้า Google Sheet','ไม่ต้องเล่นเกมใหม่ กรุณารอการยืนยัน','กำลังส่งและตรวจสอบ','wait','↻');try{const existing=await jsonp({action:'event',eventId:payload.eventId}).catch(()=>null);if(!(existing?.ok&&existing?.found))await formPost(payload);let foundEvent=false;for(const delay of [700,900,1100,1400,1700,2100,2500,3000]){await sleep(delay+Math.floor(Math.random()*300));const eventApi=await jsonp({action:'event',eventId:payload.eventId}).catch(()=>null);if(eventApi?.ok&&eventApi?.found){foundEvent=true;break}}if(!foundEvent)throw new Error('event_not_found_after_form_post');let api=null;for(const delay of [300,700,1000,1400,1800]){if(delay)await sleep(delay);api=await jsonp({action:'student',studentId:sid,reconcile:'1'}).catch(()=>null);if(api?.ok&&gameConfirmed(api,payload))break}if(!(api?.ok&&gameConfirmed(api,payload)))throw new Error('game_not_confirmed_in_student_authority');applyAuthority(api,payload);showDetails(payload,source,api);set('Google Sheet ยืนยันเกมแล้ว','บันทึกผลเกมสำเร็จ และ Passport ปลดล็อกภารกิจถัดไปแล้ว','✓ ยืนยันจาก Google Sheet','','✓');el('passport').hidden=false}catch(err){console.error(err);set('ยังไม่ได้รับการยืนยัน','ผลเกมยังอยู่ในเครื่อง กดลองส่งอีกครั้งได้โดยไม่ต้องเล่นใหม่','ยังไม่เข้า Google Sheet','error','!');el('message').innerHTML+=' <span class="errorText">'+String(err?.message||err)+'</span>';el('retry').hidden=false;el('passport').hidden=false}}
el('retry').onclick=run;el('passport').onclick=()=>location.href='./index.html?studentId='+encodeURIComponent(sid)+'&authorityRefresh='+Date.now()+'&v=20260730-game-recovery-r36';run();
})();
</script>
</body>
</html>
