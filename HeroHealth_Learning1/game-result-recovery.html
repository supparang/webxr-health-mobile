<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>HeroHealth Game Result Recovery</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#12302c;background:#f3fbf9}*{box-sizing:border-box}body{margin:0}.wrap{width:min(760px,100%);margin:auto;padding:18px}.card{background:#fff;border:1px solid #d6e9e4;border-radius:24px;box-shadow:0 12px 30px rgba(15,118,110,.12);padding:28px;text-align:center;margin-top:5vh}.icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:#e8f8f4;font-size:38px}.badge{display:inline-block;border-radius:999px;padding:8px 13px;background:#e8f8f4;color:#087b62;font-weight:900}.badge.wait{background:#fff5db;color:#9a6700}.badge.error{background:#fee2e2;color:#991b1b}.btn{width:100%;min-height:52px;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#0f766e;color:#fff;margin-top:14px}.btn.secondary{background:#e8f8f4;color:#087b62}.muted{color:#5f7470;line-height:1.6}.details{font-size:13px;overflow-wrap:anywhere;white-space:pre-line;background:#f5faf9;border-radius:14px;padding:12px;margin-top:14px;text-align:left}.errorText{color:#b91c1c;font-weight:800}@media(max-width:600px){.wrap{padding:12px}.card{padding:24px 18px;margin-top:3vh}}
</style>
</head>
<body>
<main class="wrap"><section class="card"><div class="icon" id="icon">↻</div><h1 id="title">กำลังกู้ผลเกม</h1><p class="muted" id="message">กำลังส่งผลหลักเข้า Google Sheet ก่อน เพื่อปลดล็อก Passport</p><div class="badge wait" id="badge">กำลังตรวจสอบ</div><div class="details" id="details"></div><button class="btn" id="retry" hidden>ลองส่งอีกครั้ง</button><button class="btn secondary" id="passport" hidden>กลับ Hero Passport</button></section></main>
<script>
(()=>{'use strict';
const VERSION='20260730-GAME-CORE-RECOVERY-R37';
const ENDPOINT='https://script.google.com/macros/s/AKfycbwa-OSdqWS7uPne01wNr5a42PgKfAoxmUUm7yMcUx2D0C0OnbjrbppNUHkfjUxm79Fz/exec';
const STATE_KEY='herohealth_learning_platform_rc2',RESUME_PREFIX='herohealth_student_resume_v6:';
const q=new URLSearchParams(location.search),sid=String(q.get('studentId')||q.get('sid')||'').trim(),zone=String(q.get('zone')||'').trim(),gameId=String(q.get('gameId')||'').trim(),explicitScore=Number(q.get('score'));
const EVENT_KEY=`HH_GAME_RECOVERY_EVENT:${sid}:${zone}:${gameId}`;
const el=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const num=v=>{const n=Number(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0};
const yes=v=>v===true||v===1||String(v||'').toLowerCase()==='true'||String(v||'')==='1'||String(v||'').toLowerCase()==='yes';
function readJson(store,key,fallback){try{return JSON.parse(store.getItem(key)||JSON.stringify(fallback))}catch(_){return fallback}}
function writeJson(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(_){return false}}
function state(){return readJson(localStorage,STATE_KEY,{})}
function set(title,message,badge,kind,icon){el('title').textContent=title;el('message').textContent=message;el('badge').textContent=badge;el('badge').className='badge '+(kind||'');el('icon').textContent=icon||'↻'}
function resultKeys(){const map={groups:['HHA_GROUPS_AR_LAST_RESULT','groups_ar_last_result','HHA_GROUPS_LAST_RESULT'],goodjunk:['HHA_GOODJUNK_AR_LAST_RESULT','HHA_GOODJUNK_AR_LAST','GOODJUNK_AR_LAST_RESULT','goodjunk_pending_result'],handwash:['HHA_HANDWASH_LAST_RESULT'],toothbrush:['HHA_TOOTHBRUSH_LAST_RESULT','toothbrush_pending_result'],jumpduck:['HHA_JUMPDUCK_LAST_RESULT'],'balance-hold':['HHA_BALANCE_HOLD_LAST_RESULT']};return map[gameId]||[]}
function storedRaw(){for(const store of [localStorage,sessionStorage]){for(const key of resultKeys()){const raw=readJson(store,key,null);if(raw&&typeof raw==='object')return{raw,source:(store===localStorage?'local:':'session:')+key}}}return null}
function recoveryEventId(){let existing=String(localStorage.getItem(EVENT_KEY)||'').trim();if(existing)return existing;existing=`HH-game-recovery-core-${zone}-${gameId}-${sid}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;localStorage.setItem(EVENT_KEY,existing);return existing}
function buildCore(){const stored=storedRaw(),raw=stored?.raw||{},s=state(),profile=s.profile||{},score=Number.isFinite(explicitScore)?explicitScore:num(raw.score??raw.totalScore),accuracy=num(raw.accuracy??raw.direction_accuracy??raw.correctRate),passed=raw.passed===false?false:true,eventId=recoveryEventId();return{payload:{eventType:'game',type:'game',eventId,studentId:sid,zone,gameId,completed:true,procedureCompleted:true,progressionEligible:true,passed,profile:{fullName:profile.fullName||'',section:profile.section||'',group:profile.group||''},clientTs:new Date().toISOString(),currentStep:`${zone}:${gameId}`,status:`Core recovery confirmed ${zone}:${gameId}`,recovery:true,game:{studentId:sid,zone,gameId,game_id:gameId,game_key:gameId,score,accuracy,scoreAvailable:true,passed,completed:true,procedureCompleted:true,progressionEligible:true,finishedAt:raw.finishedAt||new Date().toISOString(),durationSec:num(raw.durationSec??raw.elapsedSec),inputMode:raw.inputMode||raw.mode||'classroom-ar',gameVersion:raw.gameVersion||raw.version||'',singleAttemptPolicy:true,retryRequired:false,completionPolicy:'one-classroom-round-completes',skillCriteriaMet:yes(raw.skillCriteriaMet??raw.passed),analyticsSchemaVersion:'HH-UNIFIED-GAME-ANALYTICS-V2',metricCompletenessPct:0,analyticsUnavailable:true,recoverySource:stored?.source||'explicit-summary',recoveryNote:'Core result recovered to unlock Passport; detailed telemetry remains unavailable from the failed legacy submission.'}},source:stored?.source||'explicit-summary'} }
function showDetails(core,extra=''){el('details').textContent=`รหัส ${sid||'-'} • ${zone||'-'}:${gameId||'-'}\nEvent ${core.payload.eventId}\nคะแนน ${core.payload.game.score} • แหล่งข้อมูล ${core.source}\nส่งเฉพาะ Core Result เพื่อปลดล็อก Passport${extra?`\n${extra}`:''}`}
function jsonp(params,timeout=16000){return new Promise((resolve,reject)=>{const cb='HHGCR_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),s=document.createElement('script');let done=false;const finish=(err,data)=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(_){}try{s.remove()}catch(_){}err?reject(err):resolve(data)};const timer=setTimeout(()=>finish(new Error('sheet_timeout')),timeout);window[cb]=data=>finish(null,data);s.onerror=()=>finish(new Error('sheet_load_failed'));s.src=ENDPOINT+'?'+new URLSearchParams({...params,callback:cb,_:String(Date.now()),clientVersion:VERSION}).toString();document.head.appendChild(s)})}
async function verifyEvent(eventId){const api=await jsonp({action:'event',eventId}).catch(()=>null);return api?.ok===true&&api?.found===true}
async function waitEvent(eventId){for(const delay of [700,900,1100,1400,1800,2300,3000]){await sleep(delay+Math.floor(Math.random()*250));if(await verifyEvent(eventId))return true}return false}
function sendBeaconJson(payload){try{if(!navigator.sendBeacon)return false;return navigator.sendBeacon(ENDPOINT,new Blob([JSON.stringify(payload)],{type:'text/plain;charset=UTF-8'}))}catch(_){return false}}
function hiddenFormPost(payload){return new Promise((resolve,reject)=>{try{const name='HHGCRPOST_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),iframe=document.createElement('iframe'),form=document.createElement('form');iframe.name=name;iframe.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px';form.method='POST';form.action=ENDPOINT;form.target=name;form.acceptCharset='UTF-8';form.enctype='application/x-www-form-urlencoded';form.style.display='none';const fields={action:'submit',payload:JSON.stringify(payload),transport:'hidden-form-core-r37',clientVersion:VERSION,_:String(Date.now())};Object.entries(fields).forEach(([k,v])=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=v;form.appendChild(input)});document.body.appendChild(iframe);document.body.appendChild(form);form.submit();setTimeout(()=>resolve(true),300);setTimeout(()=>{try{form.remove()}catch(_){}try{iframe.remove()}catch(_){}},45000)}catch(err){reject(err)}})}
async function fetchNoCors(payload){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',cache:'no-store',redirect:'follow',credentials:'omit',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload),signal:controller.signal});return true}finally{clearTimeout(timer)}}
function confirmed(api){return api?.ok===true&&api?.gameCompleted?.[zone]?.[gameId]===true}
function applyAuthority(api){const a=api?.authoritativeState||{},old=state(),profile={...(old.profile||{}),...(a.profile||api?.profile||{}),studentId:sid},next={...old,...a,profile,sheetAuthority:true,lastAuthoritySyncAt:new Date().toISOString(),sheetVersion:api?.version||''};writeJson(STATE_KEY,next);writeJson(RESUME_PREFIX+sid,next);localStorage.removeItem(EVENT_KEY)}
async function submitCore(core){const eventId=core.payload.eventId;if(await verifyEvent(eventId))return true;sendBeaconJson(core.payload);if(await waitEvent(eventId))return true;await hiddenFormPost(core.payload);if(await waitEvent(eventId))return true;await fetchNoCors(core.payload).catch(()=>false);return await waitEvent(eventId)}
async function run(){el('retry').hidden=true;el('passport').hidden=true;if(!sid||!zone||!gameId){set('ข้อมูลกู้ผลไม่ครบ','ต้องมี studentId, zone และ gameId','ไม่สามารถกู้ผล','error','!');el('passport').hidden=false;return}let api=await jsonp({action:'student',studentId:sid,reconcile:'1'}).catch(()=>null);if(confirmed(api)){applyAuthority(api);set('Google Sheet มีผลเกมนี้แล้ว','Passport สามารถใช้สถานะจาก Sheet ได้ทันที','✓ ยืนยันจาก Google Sheet','','✓');el('passport').hidden=false;return}const core=buildCore();showDetails(core);set('กำลังส่ง Core Result เข้า Google Sheet','ระบบจะลองหลายช่องทางโดยใช้ Event เดิม ไม่สร้างข้อมูลซ้ำ','กำลังส่งและตรวจสอบ','wait','↻');try{const found=await submitCore(core);if(!found)throw new Error('core_event_not_found_after_all_transports');for(const delay of [300,700,1100,1600,2200]){if(delay)await sleep(delay);api=await jsonp({action:'student',studentId:sid,reconcile:'1'}).catch(()=>null);if(confirmed(api))break}if(!confirmed(api))throw new Error('game_not_confirmed_in_student_authority');applyAuthority(api);showDetails(core,'Google Sheet และ Passport ยืนยันแล้ว');set('Google Sheet ยืนยันเกมแล้ว','Core Result ถูกบันทึก และ Passport ปลดล็อกภารกิจถัดไปแล้ว','✓ ยืนยันจาก Google Sheet','','✓');el('passport').hidden=false}catch(err){console.error(err);showDetails(core,'ข้อผิดพลาด: '+String(err?.message||err));set('ยังไม่ได้รับการยืนยัน','กดส่งอีกครั้งได้โดยไม่ต้องเล่นเกมใหม่','ยังไม่เข้า Google Sheet','error','!');el('retry').hidden=false;el('passport').hidden=false}}
el('retry').onclick=run;el('passport').onclick=()=>location.href='./index.html?studentId='+encodeURIComponent(sid)+'&authorityRefresh='+Date.now()+'&v=20260730-game-core-r37';run();
})();
</script>
</body>
</html>
