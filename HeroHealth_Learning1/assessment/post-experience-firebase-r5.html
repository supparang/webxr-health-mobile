const RELEASE='20260818-POSTEXPERIENCE-R5-ATOMIC-STRICT-GATE',KEY='herohealth_learning_platform_rc2',q=new URLSearchParams(location.search),SANDBOX=new Set(Array.from({length:29},(_,i)=>String(990001+i))),CORE=[['hygiene',['handwash','hand-wash']],['hygiene',['toothbrush','brush']],['nutrition',['groups','foodgroups','food-groups']],['nutrition',['goodjunk','good-junk']],['fitness',['jumpduck','jump-duck']],['fitness',['balance','balancehold','balance-hold']]];
