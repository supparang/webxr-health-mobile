<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeroHealth Follow-up</title><style>:root{font-family:Inter,"Noto Sans Thai",system-ui;color:#17352f;background:#f3fbf9}*{box-sizing:border-box}body{margin:0}.w{max-width:800px;margin:auto;padding:14px}.h,.c{background:#fff;border:1px solid #d6e9e4;border-radius:18px;padding:18px;margin:12px 0}.h{background:#0f766e;color:#fff}.r{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.r label{border:1px solid #cfe3df;border-radius:10px;padding:8px 3px;text-align:center;font-size:12px}.r label:has(input:checked){background:#e8f8f4}.r input{display:block;margin:auto}.b{width:100%;padding:14px;border:0;border-radius:12px;background:#0f766e;color:#fff;font-weight:900}</style></head><body><main class="w"><section class="h"><small>HH-FU01 • FOLLOW-UP • FIREBASE R2</small><h1>พฤติกรรมสุขภาพหลังใช้ HeroHealth</h1><p id="who"></p></section><form id="f"></form></main><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,getDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{HEROHEALTH_FIREBASE_CONFIG,HEROHEALTH_FIREBASE_BUILD}from'../firebase/firebase-config.js';const RELEASE='20260814-HH-FU01-R2-RECEIPT',q=new URLSearchParams(location.search),KEY='herohealth_learning_platform_rc2';let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}const sid=String(q.get('studentId')||q.get('sid')||s.profile?.studentId||'').trim();document.getElementById('who').textContent=q.get('fullName')||s.profile?.fullName||sid;const I=['ฉันล้างมือด้วยสบู่ในเวลาที่ควรทำ','ฉันแปรงฟันอย่างน้อยวันละ 2 ครั้งและทำอย่างทั่วถึง','ฉันใช้วิธีปิดไอหรือจามที่เหมาะสม','ฉันดื่มน้ำเปล่าเป็นตัวเลือกหลักเมื่อกระหาย','ฉันกินผักหรือผลไม้ในแต่ละวัน','ฉันคิดถึงน้ำตาล เค็ม หรือมันก่อนเลือกขนมหรือเครื่องดื่ม','ฉันมีกิจกรรมที่ทำให้หัวใจเต้นเร็วและหายใจแรงขึ้น','ฉันลุกขยับหรือพักจากการนั่งหน้าจอเป็นระยะ','ฉันเลือกวิธีและพื้นที่ออกกำลังกายที่ปลอดภัย','ฉันยังจำคำแนะนำสำคัญจาก HeroHealth ได้อย่างน้อย 1 เรื่อง','ฉันเคยใช้สิ่งที่เรียนจาก HeroHealth ช่วยตัดสินใจเรื่องสุขภาพจริง','ฉันเคยเล่าหรือชวนคนในบ้านทำพฤติกรรมสุขภาพที่เรียนมา'];const f=document.getElementById('f');f.innerHTML=I.map((x,i)=>`<section class="c"><b>FU${String(i+1).padStart(2,'0')}. ${x}</b><div class="r">${[1,2,3,4,5].map(v=>`<label><input required type="radio" name="q${i}" value="${v}">${v}</label>`).join('')}</div></section>`).join('')+'<section class="c"><p>1 = ไม่เคย/ไม่จริงเลย &nbsp; 5 = ทำเป็นประจำ/จริงมาก</p><button class="b" id="btn">ส่ง Follow-up</button><p id="st"></p></section>';if(!sid){document.getElementById('btn').disabled=true;document.getElementById('st').textContent='ไม่พบรหัสนักเรียน'}const app=getApps().length?getApps()[0]:initializeApp(HEROHEALTH_FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);f.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('btn'),st=document.getElementById('st');btn.disabled=true;st.textContent='กำลังบันทึกและตรวจ Firebase Receipt…';try{const fd=new FormData(f),responses={};I.forEach((_,i)=>responses['FU'+String(i+1).padStart(2,'0')]=Number(fd.get('q'+i)));const u=auth.currentUser||(await signInAnonymously(auth)).user,sandbox=/^9900(0[1-9]|1\d|2[0-9])$/.test(sid),acol=sandbox?'studentAssessmentsSandbox':'studentAssessments',pcol=sandbox?'studentProgressSandbox':'studentProgress',receipt=`${sid}:followup:${crypto.randomUUID?.()||Date.now()}`,aref=doc(db,acol,`${sid}_FOLLOWUP`),pref=doc(db,pcol,sid);await setDoc(aref,{studentId:sid,assessmentType:'followup',instrument:'HH-FU01',instrumentVersion:'HH-FU01-v1',responses,completed:true,firebaseReceiptToken:receipt,firebaseSavedByUid:u.uid,firebaseSavedAt:serverTimestamp(),firebaseBuild:HEROHEALTH_FIREBASE_BUILD,release:RELEASE},{merge:true});await setDoc(pref,{studentId:sid,followupCompleted:true,completed:{followup:true},followup:{completed:true,firebaseReceiptToken:receipt,instrumentVersion:'HH-FU01-v1',confirmedAtClient:new Date().toISOString()},followupReceiptToken:receipt,updatedByUid:u.uid,updatedAt:serverTimestamp(),build:HEROHEALTH_FIREBASE_BUILD},{merge:true});const [as,ps]=await Promise.all([getDoc(aref),getDoc(pref)]);if(as.data()?.firebaseReceiptToken!==receipt||ps.data()?.followupReceiptToken!==receipt||ps.data()?.followupCompleted!==true)throw Error('firebase-followup-receipt-mismatch');st.textContent='✓ Firebase ยืนยัน HH-FU01 Follow-up เรียบร้อยแล้ว'}catch(err){st.textContent='บันทึกไม่สำเร็จ: '+String(err?.message||err);btn.disabled=false}};</script></body></html>
