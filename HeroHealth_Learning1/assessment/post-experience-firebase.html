<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HeroHealth Post-experience</title><style>:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#17352f;background:#f3fbf9}*{box-sizing:border-box}body{margin:0}.wrap{width:min(820px,100%);margin:auto;padding:14px}.head,.card{background:#fff;border:1px solid #d6e9e4;border-radius:20px;padding:18px;margin-bottom:12px}.head{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}.item{padding:13px 0;border-bottom:1px solid #edf3f1}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px}.scale label{border:1px solid #cfe3df;border-radius:12px;padding:9px 4px;text-align:center;font-size:13px}.scale label:has(input:checked){background:#e8f8f4;border-color:#0f766e}.scale input{display:block;margin:0 auto 5px}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:#0f766e;color:white;font:inherit;font-weight:900}.status{padding:12px;text-align:center;font-weight:800}.muted{color:#607570;font-size:13px}@media(max-width:520px){.scale{gap:3px}.scale label{font-size:11px;padding:8px 2px}.wrap{padding:9px}}</style></head><body><main class="wrap"><section class="head"><small>HEROHEALTH • POST-EXPERIENCE • FIREBASE R2</small><h1>ช่วยบอกเราหน่อยว่า การเล่นวันนี้เป็นอย่างไร</h1><p id="who"></p></section><form id="form"></form></main><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,getDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{HEROHEALTH_FIREBASE_CONFIG,HEROHEALTH_FIREBASE_BUILD}from'../firebase/firebase-config.js';const RELEASE='20260814-POSTEXPERIENCE-R2-RECEIPT';const KEY='herohealth_learning_platform_rc2';const q=new URLSearchParams(location.search);let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}const sid=String(q.get('studentId')||q.get('sid')||state.profile?.studentId||'').trim();const name=q.get('fullName')||state.profile?.fullName||'';document.getElementById('who').textContent=name||('รหัส '+sid);const items=[['UX01','ฉันรู้ว่าต้องกดหรือทำอะไรต่อเมื่อใช้ HeroHealth'],['UX02','ข้อความ ปุ่ม และสัญลักษณ์ใน HeroHealth เข้าใจง่าย'],['UX03','ฉันสามารถทำภารกิจได้โดยไม่สับสน'],['UX04','การตอบสนองของเกมช่วยให้ฉันรู้ว่าทำถูกหรือควรแก้อะไร'],['UX05','โดยรวม HeroHealth ใช้งานง่าย'],['ENG01','ฉันตั้งใจทำภารกิจจนจบ'],['ENG02','ฉันอยากรู้ว่าจะเกิดอะไรขึ้นในภารกิจถัดไป'],['ENG03','ฉันพยายามอีกครั้งเมื่อภารกิจยาก'],['ENG04','ฉันรู้สึกมีส่วนร่วมกับสิ่งที่กำลังทำ'],['ENG05','กิจกรรมทำให้ฉันอยากเรียนรู้เรื่องสุขภาพต่อ'],['ENG06','ฉันมีสมาธิกับภารกิจส่วนใหญ่'],['SAT01','ฉันพอใจกับการเรียนรู้ผ่าน HeroHealth'],['SAT02','เนื้อหาและกิจกรรมเหมาะกับฉัน'],['SAT03','ภาพ เสียง และการโต้ตอบช่วยให้การเรียนรู้น่าสนใจ'],['SAT04','ฉันอยากใช้ HeroHealth อีกถ้ามีโอกาส'],['SAT05','โดยรวมฉันพอใจกับประสบการณ์ HeroHealth']];const form=document.getElementById('form');const labels=['ไม่เห็นด้วยเลย','ไม่ค่อยเห็นด้วย','ไม่แน่ใจ','เห็นด้วย','เห็นด้วยมาก'];form.innerHTML=items.map(([id,text])=>`<section class="card item"><b>${id}. ${text}</b><div class="scale">${labels.map((x,i)=>`<label><input required type="radio" name="${id}" value="${i+1}">${i+1}<br>${x}</label>`).join('')}</div></section>`).join('')+`<section class="card"><p class="muted">1 = ไม่เห็นด้วยเลย … 5 = เห็นด้วยมาก</p><button class="btn" id="submitBtn">ส่งคำตอบและไป Reflection</button><div id="status" class="status"></div></section>`;if(!sid){document.getElementById('status').textContent='ไม่พบรหัสนักเรียน';document.getElementById('submitBtn').disabled=true}const app=getApps().length?getApps()[0]:initializeApp(HEROHEALTH_FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);async function user(){return auth.currentUser||(await signInAnonymously(auth)).user}form.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('submitBtn'),st=document.getElementById('status');btn.disabled=true;st.textContent='กำลังบันทึกและตรวจ Firebase Receipt…';try{const u=await user(),fd=new FormData(form),responses={};items.forEach(([id])=>responses[id]=Number(fd.get(id)));const avg=ids=>ids.reduce((a,id)=>a+responses[id],0)/ids.length;const scores={ux:avg(items.slice(0,5).map(x=>x[0])),engagement:avg(items.slice(5,11).map(x=>x[0])),satisfaction:avg(items.slice(11).map(x=>x[0]))};const sandbox=/^9900(0[1-9]|1\d|2[0-9])$/.test(sid),acol=sandbox?'studentAssessmentsSandbox':'studentAssessments',pcol=sandbox?'studentProgressSandbox':'studentProgress',receipt=`${sid}:postexperience:${crypto.randomUUID?.()||Date.now()}`,aref=doc(db,acol,`${sid}_POSTEXPERIENCE`),pref=doc(db,pcol,sid);const record={studentId:sid,assessmentType:'post_experience',instrumentVersion:'HH-UX01-SF5_HH-ENG01-SF6_HH-SAT01-SF5_v1',responses,scores,completed:true,firebaseReceiptToken:receipt,firebaseSavedByUid:u.uid,firebaseClientSavedAt:new Date().toISOString(),firebaseSavedAt:serverTimestamp(),firebaseBuild:HEROHEALTH_FIREBASE_BUILD,release:RELEASE};await setDoc(aref,record,{merge:true});await setDoc(pref,{studentId:sid,postExperienceCompleted:true,completed:{postExperience:true},postExperience:{completed:true,scores,firebaseReceiptToken:receipt,instrumentVersion:record.instrumentVersion,confirmedAtClient:new Date().toISOString()},postExperienceReceiptToken:receipt,updatedByUid:u.uid,updatedAt:serverTimestamp(),build:HEROHEALTH_FIREBASE_BUILD},{merge:true});const [as,ps]=await Promise.all([getDoc(aref),getDoc(pref)]);if(!as.exists()||as.data()?.firebaseReceiptToken!==receipt||ps.data()?.postExperienceReceiptToken!==receipt||ps.data()?.postExperienceCompleted!==true)throw Error('firebase-postexperience-receipt-mismatch');state=JSON.parse(localStorage.getItem(KEY)||'{}');state.postExperienceCompleted=true;state.completed={...(state.completed||{}),postExperience:true};state.postExperience={responses,scores,receipt,release:RELEASE};localStorage.setItem(KEY,JSON.stringify(state));st.textContent='✓ Firebase ยืนยัน Post-experience แล้ว กำลังไป Reflection';const next=new URL('./reflection-firebase.html',location.href);['studentId','sid','fullName','section','group','studyId','testSessionId'].forEach(k=>{const v=q.get(k)||(k==='studentId'||k==='sid'?sid:'');if(v)next.searchParams.set(k,v)});next.searchParams.set('authority','firebase');next.searchParams.set('postExperienceReceipt',receipt);next.searchParams.set('v',RELEASE);setTimeout(()=>location.replace(next.href),650)}catch(err){st.textContent='บันทึกไม่สำเร็จ: '+String(err?.message||err);btn.disabled=false}};</script></body></html>
