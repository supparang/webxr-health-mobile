<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>HeroHealth แบบประเมินประสบการณ์หลังเล่น</title><style>:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#17352f;background:#f3fbf9;--brand:#0f766e;--brand2:#14b8a6;--line:#d6e9e4;--soft:#e8f8f4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eafaf7,#f8fbfb 42%)}.wrap{width:min(820px,100%);margin:auto;padding:14px}.head,.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}.head{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 12px 28px rgba(15,118,110,.14)}.head small{font-weight:800}.head h1{margin:10px 0 6px;font-size:clamp(28px,5vw,42px);line-height:1.2}.head p{margin:0}.progress-wrap{margin-top:14px}.progress{height:10px;border-radius:999px;background:rgba(255,255,255,.35);overflow:hidden}.progress>span{display:block;height:100%;width:0;background:#fff;border-radius:inherit;transition:width .2s ease}.progress-text{margin-top:6px;font-size:13px;font-weight:800}.section-title{display:flex;align-items:center;gap:10px;margin:20px 0 10px;padding:0 4px}.section-title .icon{font-size:28px}.section-title h2{margin:0;font-size:22px}.section-title p{margin:2px 0 0;color:#607570;font-size:14px}.item{padding:16px}.item b{display:block;font-size:18px;line-height:1.45}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.scale label{border:1px solid #cfe3df;border-radius:16px;padding:10px 5px;text-align:center;font-size:12px;min-height:104px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;cursor:pointer;background:#fff;transition:.15s}.scale label:hover{transform:translateY(-1px);border-color:#7bc8bd}.scale label:has(input:checked){background:var(--soft);border:2px solid var(--brand);box-shadow:0 5px 14px rgba(15,118,110,.12)}.scale input{accent-color:var(--brand);margin:0}.face{font-size:30px;line-height:1}.score{font-weight:900;color:var(--brand)}.word{font-weight:800;line-height:1.2}.btn{width:100%;border:0;border-radius:16px;padding:15px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:white;font:inherit;font-weight:900;font-size:17px}.btn:disabled{opacity:.55}.status{padding:12px;text-align:center;font-weight:800}.muted{color:#607570;font-size:13px}.legend{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.legend span{background:#eff9f7;border:1px solid #d5ebe6;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}@media(max-width:620px){.scale{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.scale label{min-height:92px;padding:7px 2px;font-size:10px;border-radius:12px}.face{font-size:24px}.item{padding:13px}.item b{font-size:16px}.wrap{padding:9px}.section-title h2{font-size:20px}}@media(max-width:390px){.scale label{font-size:9px}.face{font-size:22px}}</style></head><body><main class="wrap"><section class="head"><small>แบบประเมินประสบการณ์หลังเล่น • สำหรับนักเรียน ป.5</small><h1>วันนี้เล่น HeroHealth แล้วรู้สึกอย่างไรบ้าง?</h1><p id="who"></p><div class="progress-wrap"><div class="progress"><span id="bar"></span></div><div id="progressText" class="progress-text">ตอบแล้ว 0 / 16 ข้อ</div></div></section><div class="legend"><span>😟 1 ไม่จริงเลย</span><span>🙁 2 ไม่ค่อยจริง</span><span>😐 3 ไม่แน่ใจ</span><span>🙂 4 ค่อนข้างจริง</span><span>😄 5 จริงมาก</span></div><form id="form"></form></main><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,getDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{HEROHEALTH_FIREBASE_CONFIG,HEROHEALTH_FIREBASE_BUILD}from'../firebase/firebase-config.js';const RELEASE='20260815-POSTEXPERIENCE-R4-P5-VISUAL-THAI';const KEY='herohealth_learning_platform_rc2';const q=new URLSearchParams(location.search);let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}const sid=String(q.get('studentId')||q.get('sid')||state.profile?.studentId||'').trim();const name=q.get('fullName')||state.profile?.fullName||'';document.getElementById('who').textContent=name||('รหัสนักเรียน '+sid);const groups=[{title:'ใช้งานง่ายไหม?',subtitle:'คิดถึงตอนที่กดปุ่ม อ่านข้อความ และทำภารกิจ',icon:'📱',items:[['UX01','ฉันรู้ว่าต้องกดหรือทำอะไรต่อเมื่อใช้ HeroHealth'],['UX02','ข้อความ ปุ่ม และสัญลักษณ์ใน HeroHealth เข้าใจง่าย'],['UX03','ฉันสามารถทำภารกิจได้โดยไม่สับสน'],['UX04','การตอบสนองของเกมช่วยให้ฉันรู้ว่าทำถูกหรือควรแก้อะไร'],['UX05','โดยรวม HeroHealth ใช้งานง่าย']]},{title:'เล่นแล้วรู้สึกอย่างไร?',subtitle:'คิดถึงความตั้งใจ ความสนุก และความอยากเรียนรู้ต่อ',icon:'🎮',items:[['ENG01','ฉันตั้งใจทำภารกิจจนจบ'],['ENG02','ฉันอยากรู้ว่าจะเกิดอะไรขึ้นในภารกิจถัดไป'],['ENG03','ฉันพยายามอีกครั้งเมื่อภารกิจยาก'],['ENG04','ฉันรู้สึกมีส่วนร่วมกับสิ่งที่กำลังทำ'],['ENG05','กิจกรรมทำให้ฉันอยากเรียนรู้เรื่องสุขภาพต่อ'],['ENG06','ฉันมีสมาธิกับภารกิจส่วนใหญ่']]},{title:'โดยรวมชอบไหม?',subtitle:'คิดถึงประสบการณ์ทั้งหมดที่ได้เล่น HeroHealth วันนี้',icon:'⭐',items:[['SAT01','ฉันพอใจกับการเรียนรู้ผ่าน HeroHealth'],['SAT02','เนื้อหาและกิจกรรมเหมาะกับฉัน'],['SAT03','ภาพ เสียง และการโต้ตอบช่วยให้การเรียนรู้น่าสนใจ'],['SAT04','ฉันอยากใช้ HeroHealth อีกถ้ามีโอกาส'],['SAT05','โดยรวมฉันพอใจกับประสบการณ์ HeroHealth']]}];const items=groups.flatMap(g=>g.items),form=document.getElementById('form'),faces=['😟','🙁','😐','🙂','😄'],words=['ไม่จริงเลย','ไม่ค่อยจริง','ไม่แน่ใจ','ค่อนข้างจริง','จริงมาก'];form.innerHTML=groups.map(g=>`<section class="section-title"><div class="icon">${g.icon}</div><div><h2>${g.title}</h2><p>${g.subtitle}</p></div></section>${g.items.map(([id,text])=>`<section class="card item"><b>${id}. ${text}</b><div class="scale">${words.map((w,i)=>`<label><input required type="radio" name="${id}" value="${i+1}"><span class="face">${faces[i]}</span><span class="score">${i+1}</span><span class="word">${w}</span></label>`).join('')}</div></section>`).join('')}`).join('')+`<section class="card"><p class="muted">เลือกคำตอบที่ตรงกับความรู้สึกของฉันมากที่สุด ไม่มีคำตอบถูกหรือผิด</p><button class="btn" id="submitBtn">ส่งคำตอบและกลับ Hero Passport</button><div id="status" class="status"></div></section>`;const bar=document.getElementById('bar'),progressText=document.getElementById('progressText');function progress(){const fd=new FormData(form),n=items.filter(([id])=>fd.get(id)!=null).length;bar.style.width=(n/items.length*100)+'%';progressText.textContent=`ตอบแล้ว ${n} / ${items.length} ข้อ`}form.addEventListener('change',progress);if(!sid){document.getElementById('status').textContent='ไม่พบรหัสนักเรียน';document.getElementById('submitBtn').disabled=true}const app=getApps().length?getApps()[0]:initializeApp(HEROHEALTH_FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);async function user(){return auth.currentUser||(await signInAnonymously(auth)).user}form.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('submitBtn'),st=document.getElementById('status');btn.disabled=true;st.textContent='กำลังบันทึกคำตอบ…';try{const u=await user(),fd=new FormData(form),responses={};items.forEach(([id])=>responses[id]=Number(fd.get(id)));const avg=ids=>ids.reduce((a,id)=>a+responses[id],0)/ids.length;const scores={ux:avg(items.slice(0,5).map(x=>x[0])),engagement:avg(items.slice(5,11).map(x=>x[0])),satisfaction:avg(items.slice(11).map(x=>x[0]))};const sandbox=/^9900(0[1-9]|1\d|2[0-9])$/.test(sid),acol=sandbox?'studentAssessmentsSandbox':'studentAssessments',pcol=sandbox?'studentProgressSandbox':'studentProgress',receipt=`${sid}:postexperience:${crypto.randomUUID?.()||Date.now()}`,aref=doc(db,acol,`${sid}_POSTEXPERIENCE`),pref=doc(db,pcol,sid);const record={studentId:sid,assessmentType:'post_experience',instrumentVersion:'HH-UX01-SF5_HH-ENG01-SF6_HH-SAT01-SF5_v1',presentationVersion:'P5_VISUAL_THAI_R4',responses,scores,completed:true,firebaseReceiptToken:receipt,firebaseSavedByUid:u.uid,firebaseClientSavedAt:new Date().toISOString(),firebaseSavedAt:serverTimestamp(),firebaseBuild:HEROHEALTH_FIREBASE_BUILD,release:RELEASE};await setDoc(aref,record,{merge:true});await setDoc(pref,{studentId:sid,postExperienceCompleted:true,completed:{postExperience:true},postExperience:{completed:true,scores,firebaseReceiptToken:receipt,instrumentVersion:record.instrumentVersion,presentationVersion:record.presentationVersion,confirmedAtClient:new Date().toISOString()},postExperienceReceiptToken:receipt,updatedByUid:u.uid,updatedAt:serverTimestamp(),build:HEROHEALTH_FIREBASE_BUILD},{merge:true});const [as,ps]=await Promise.all([getDoc(aref),getDoc(pref)]);if(!as.exists()||as.data()?.firebaseReceiptToken!==receipt||ps.data()?.postExperienceReceiptToken!==receipt||ps.data()?.postExperienceCompleted!==true)throw Error('firebase-postexperience-receipt-mismatch');state=JSON.parse(localStorage.getItem(KEY)||'{}');state.postExperienceCompleted=true;state.completed={...(state.completed||{}),postExperience:true};state.postExperience={responses,scores,receipt,release:RELEASE,presentationVersion:record.presentationVersion};localStorage.setItem(KEY,JSON.stringify(state));st.textContent='✓ บันทึกเรียบร้อย กำลังกลับ Hero Passport';const back=new URL('../index.html',location.href);['fullName','section','group','studyId','testSessionId'].forEach(k=>{const v=q.get(k);if(v)back.searchParams.set(k,v)});back.searchParams.set('studentId',sid);back.searchParams.set('sid',sid);back.searchParams.set('authority','firebase');back.searchParams.set('firebaseReady','1');back.searchParams.set('postExperienceReceipt','1');back.searchParams.set('postExperienceReceiptToken',receipt);back.searchParams.set('appv','20260815-PASSPORT-R20-P5-VISUAL');back.searchParams.set('v',RELEASE);setTimeout(()=>location.replace(back.href),650)}catch(err){st.textContent='บันทึกไม่สำเร็จ: '+String(err?.message||err);btn.disabled=false}};</script></body></html>
