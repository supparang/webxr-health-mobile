<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0f766e"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>HeroHealth Mission Summary</title><style>:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#12332f;background:#effbf9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e9fbf8,#fff8ee)}.wrap{width:min(860px,100%);margin:auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}.hero,.card,.game{background:#fff;border:1px solid #cfe9e4;border-radius:24px;box-shadow:0 12px 30px rgba(15,118,110,.08)}.hero{padding:22px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}.hero h1{margin:8px 0;font-size:clamp(30px,8vw,48px);line-height:1.08}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.pill{padding:12px;border-radius:18px;background:rgba(255,255,255,.16);text-align:center}.pill b{display:block;font-size:22px}.card{padding:18px;margin-top:14px}.gates{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.gate{padding:10px 5px;border-radius:14px;text-align:center;background:#f1f5f4;color:#64748b;font-size:12px;font-weight:900}.gate.ok{background:#dcfce7;color:#166534}.games{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.game{padding:14px}.game h3{margin:5px 0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#fee2e2;color:#991b1b}.badge.ok{background:#dcfce7;color:#166534}.status{margin:10px 0;padding:11px 12px;border-radius:14px;background:#ecfdf5;color:#166534;font-size:13px;font-weight:800}.status.bad{background:#fee2e2;color:#991b1b}.btn{width:100%;min-height:54px;border:0;border-radius:17px;padding:14px;font:inherit;font-weight:1000;background:#0f766e;color:#fff;margin-top:10px}.btn.secondary{background:#e2f5f1;color:#0f766e}.btn:disabled{opacity:.42}.muted{color:#64748b}@media(max-width:680px){.summary,.games{grid-template-columns:1fr}.gates{grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.gate{font-size:9px;padding:7px 2px}.wrap{padding:9px}.hero,.card,.game{border-radius:20px}}</style></head><body><main class="wrap"><section class="hero"><small>HEROHEALTH • FIREBASE VERIFIED SUMMARY</small><h1>สรุปภารกิจของฉัน</h1><p id="who">กำลังตรวจ Firebase…</p><div class="summary"><div class="pill"><b id="doneCount">—</b><span>เกมที่ทำครบ</span></div><div class="pill"><b id="gain">—</b><span>พัฒนาการความรู้</span></div><div class="pill"><b id="flow">—</b><span>Research Flow</span></div></div></section><div id="status" class="status">กำลังอ่านข้อมูลล่าสุดจาก Firebase…</div><section class="card"><h2>ขั้นตอนที่ Firebase ยืนยัน</h2><div class="gates"><div id="gPre" class="gate">Pre-test</div><div id="gGames" class="gate">6 เกม</div><div id="gPost" class="gate">Post-test</div><div id="gExp" class="gate">หลังเล่น</div><div id="gRef" class="gate">Reflection</div></div></section><section class="card"><h2>ผลรายเกม</h2><div id="games" class="games"></div></section><section class="card"><h2>เป้าหมายสุขภาพของฉัน</h2><p id="action" class="muted">กำลังอ่าน Reflection…</p><button class="btn" id="certificateBtn" disabled>รับใบประกาศฮีโร่สุขภาพ</button><button class="btn secondary" id="backBtn">กลับ Hero Passport</button></section></main><script type="module">
import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{HEROHEALTH_FIREBASE_CONFIG}from'../firebase/firebase-config.js';
const RELEASE='20260818-MISSION-SUMMARY-R10-STRICT-FIREBASE',q=new URLSearchParams(location.search),ids=[...new Set(['studentId','sid','pid'].map(k=>String(q.get(k)||'').trim()).filter(Boolean))],sid=ids.length===1?ids[0]:'',TEST=new Set(Array.from({length:29},(_,i)=>String(990001+i))),sandbox=TEST.has(sid),cols={roster:sandbox?'studentsSandbox':'students',progress:sandbox?'studentProgressSandbox':'studentProgress',assessment:sandbox?'studentAssessmentsSandbox':'studentAssessments'},$=id=>document.getElementById(id),games=[{id:'handwash',a:['handwash','hand-wash'],z:'hygiene',n:'Handwash AR',i:'🧼'},{id:'toothbrush',a:['toothbrush','brush'],z:'hygiene',n:'Toothbrush AR',i:'🪥'},{id:'groups',a:['groups','foodgroups','food-groups'],z:'nutrition',n:'Groups AR',i:'🥗'},{id:'goodjunk',a:['goodjunk','good-junk'],z:'nutrition',n:'GoodJunk AR',i:'🍎'},{id:'jumpduck',a:['jumpduck','jump-duck'],z:'fitness',n:'JumpDuck Dash',i:'🏃'},{id:'balance',a:['balance','balancehold','balance-hold'],z:'fitness',n:'Balance Hold AR',i:'🧘'}];
function rdone(r){return!!(r&&r.completed===true&&r.passed!==false&&r.progressionEligible!==false&&r.firebaseReceiptToken)}function done(p,g){return g.a.some(id=>p?.gameCompleted?.[g.z]?.[id]===true)||g.a.some(id=>rdone(p?.gameResults?.[id]))}function result(p,g){for(const id of g.a)if(p?.gameResults?.[id])return p.gameResults[id];return null}function pre(p){return p?.pretestCompleted===true&&p?.assessments?.pretest?.completed===true&&!!p?.assessments?.pretest?.firebaseReceiptToken}function post(p){return p?.posttestCompleted===true&&p?.assessments?.posttest?.completed===true&&!!p?.assessments?.posttest?.firebaseReceiptToken}function exp(p){return p?.postExperienceCompleted===true&&p?.postExperience?.completed===true&&!!p?.postExperienceReceiptToken}function ref(p){return p?.reflectionCompleted===true&&p?.reflection?.completed===true&&!!p?.reflectionReceiptToken&&p?.researchImmediateCompleted===true}function score(v){const n=Number(v);return Number.isFinite(n)?n:null}function mark(id,ok){$(id).classList.toggle('ok',ok);$(id).textContent=$(id).textContent.replace(/^✓\s*/,'');if(ok)$(id).textContent='✓ '+$(id).textContent}function passport(){const u=new URL('../index.html',location.href);u.searchParams.set('authority','firebase');if(sid){u.searchParams.set('studentId',sid);u.searchParams.set('sid',sid)}u.searchParams.set('authorityRefresh',String(Date.now()));u.searchParams.set('v',RELEASE);return u.href}$('backBtn').onclick=()=>location.assign(passport());
if(!sid||ids.length!==1){$('status').textContent='รหัสนักเรียนไม่ถูกต้อง กรุณากลับเข้าสู่ Hero Passport ใหม่';$('status').classList.add('bad');throw Error('identity_invalid')}
try{const app=getApps().length?getApps()[0]:initializeApp(HEROHEALTH_FIREBASE_CONFIG),auth=getAuth(app);if(!auth.currentUser)await signInAnonymously(auth);const db=getFirestore(app),[rs,ps,refls]=await Promise.all([getDoc(doc(db,cols.roster,sid)),getDoc(doc(db,cols.progress,sid)),getDoc(doc(db,cols.assessment,`${sid}_REFLECTION`))]);if(!rs.exists())throw Error('roster_missing');if(!ps.exists())throw Error('progress_missing');const roster=rs.data(),p=ps.data(),refl=refls.exists()?refls.data():null,doneGames=games.filter(g=>done(p,g)),preOk=pre(p),gamesOk=doneGames.length===6,postOk=post(p),expOk=exp(p),refOk=ref(p)&&refl?.completed===true&&String(refl?.firebaseReceiptToken||'')===String(p?.reflectionReceiptToken||''),complete=preOk&&gamesOk&&postOk&&expOk&&refOk;$('who').textContent=`${roster.fullName||roster.studentName||roster.name||`นักเรียน ${sid}`} • รหัส ${sid}`;$('doneCount').textContent=`${doneGames.length}/6`;const preScore=score(p?.assessments?.pretest?.score),postScore=score(p?.assessments?.posttest?.score);$('gain').textContent=preScore!==null&&postScore!==null?`${postScore-preScore>=0?'+':''}${postScore-preScore} คะแนน`:'—';$('flow').textContent=complete?'ครบ':'ยังไม่ครบ';mark('gPre',preOk);mark('gGames',gamesOk);mark('gPost',postOk);mark('gExp',expOk);mark('gRef',refOk);$('action').textContent=refl?.reflection?.action||p?.reflection?.action||'ยังไม่พบ Reflection ที่ยืนยันแล้ว';$('games').innerHTML=games.map(g=>{const d=done(p,g),r=result(p,g),s=score(r?.score);return`<article class="game"><span style="font-size:28px">${g.i}</span> <span class="badge ${d?'ok':''}">${d?'✓ Firebase ยืนยัน':'ยังไม่ครบ'}</span><h3>${g.n}</h3><div class="muted">${d?(s!==null?`คะแนนเกม ${s}`:'มี Completion Receipt'):'ยังไม่พบ Completion Receipt'}</div></article>`}).join('');$('certificateBtn').disabled=!complete;if(complete){$('status').textContent='✓ Firebase ยืนยัน Research Flow ครบแล้ว พร้อมขอออกใบประกาศ';$('status').classList.remove('bad')}else{$('status').textContent=`ยังไม่ครบ • Pre-test ${preOk?'✓':'—'} • เกม ${doneGames.length}/6 • Post-test ${postOk?'✓':'—'} • หลังเล่น ${expOk?'✓':'—'} • Reflection ${refOk?'✓':'—'}`;$('status').classList.add('bad')}$('certificateBtn').onclick=()=>{if(!complete)return;const u=new URL('./certificate-final-firebase-r8.html',location.href);u.searchParams.set('studentId',sid);u.searchParams.set('sid',sid);u.searchParams.set('authority','firebase');u.searchParams.set('v',RELEASE);location.assign(u.href)}}catch(e){console.error('[Mission Summary R10]',e);$('status').textContent='ตรวจสอบ Firebase ไม่สำเร็จ: '+String(e?.message||e);$('status').classList.add('bad');$('certificateBtn').disabled=true}
</script></body></html>
