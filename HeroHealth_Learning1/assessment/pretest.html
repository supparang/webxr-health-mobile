<script>
(()=>{
  const current=new URL(location.href);
  const target=new URL('./pretest-firebase.html',location.href);
  current.searchParams.forEach((value,key)=>target.searchParams.set(key,value));
  target.searchParams.set('authority','firebase');
  target.searchParams.set('legacyRedirect','pretest-v6-to-v7');
  target.searchParams.set('v','20260814-hsas-p5-v7-validated');
  target.searchParams.set('_',String(Date.now()));
  location.replace(target.href);
})();
</script>
