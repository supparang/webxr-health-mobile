<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>HeroHealth Pre-test V5</title><style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#12302c;background:#f3fbf9}*{box-sizing:border-box}body{margin:0}.wrap{width:min(860px,100%);margin:auto;padding:18px}.head,.card{background:#fff;border:1px solid #d6e9e4;border-radius:22px;box-shadow:0 12px 30px rgba(15,118,110,.1)}.head{padding:22px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}.head p{margin:6px 0 0;color:#d9fffa}.card{padding:18px;margin-top:14px}.q{font-size:18px;font-weight:900;margin-bottom:12px}.meta{font-size:12px;color:#68807b;margin:-5px 0 10px}.opts{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid #cfe3df;border-radius:14px;cursor:pointer}.opt:has(input:checked){border-color:#0f766e;background:#e8f8f4}.btn{width:100%;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#0f766e;color:#fff;cursor:pointer}.btn:disabled{opacity:.65}.btn.secondary{background:#e8f8f4;color:#087b62;margin-top:10px}.muted{color:#5f7470}.progress{height:10px;background:#dcebe8;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#14b8a6}.hidden{display:none}.done{padding:30px 24px;text-align:center}.done-icon{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#dff8ef;color:#087b62;font-size:36px;font-weight:900}.done h2{margin:0 0 8px;font-size:26px}.score{font-size:20px;font-weight:900;margin:14px 0}.sync{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:#e8f8f4;color:#087b62;font-weight:800}.sync.queue{background:#fff5db;color:#9a6700}.countdown{font-size:14px;color:#5f7470;margin:16px 0 0}.done .btn{margin-top:16px}.error{color:#b91c1c;font-weight:900}@media(max-width:600px){.wrap{padding:12px}.head{padding:18px}.done{padding:26px 18px}}
</style></head><body><main class="wrap"><section class="head"><small id="formLabel">HSAS-P5 • RESEARCH ASSESSMENT V5</small><h1>Pre-test ก่อนเริ่มภารกิจ</h1><p id="who">กำลังจัดชุดข้อสอบสมดุลรายบุคคล</p><div class="progress"><i id="bar" style="width:0%"></i></div></section><form id="form"></form><section id="result" class="card hidden"></section></main>
<script src="../data/config.js?v=20260729-assessment-confirm-v82"></script><script src="assessment-sheet-sync.js?v=20260729-assessment-confirm-v82"></script><script src="assessment-bank-v3.js?v=20260729-assessment-confirm-v82"></script><script src="assessment-engine-v5.js?v=20260729-assessment-confirm-v82"></script><script>
(()=>{'use strict';
const MODE='pre',KEY='herohealth_learning_platform_rc2',q=new URLSearchParams(location.search),ENGINE=window.HHAssessmentEngineV5;let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}
const sid=String(q.get('studentId')||q.get('sid')||state.profile?.studentId||'').trim(),fullName=q.get('fullName')||state.profile?.fullName||'',section=q.get('section')||state.profile?.section||'',group=q.get('group')||state.profile?.group||'',back=q.get('return')||'../index.html',BANK=window.HH_ASSESSMENT_BANK_V3||[],studyId=q.get('studyId')||'HEROHEALTH-P5-2026';
function makeAttempt(){const a=globalThis.crypto?.getRandomValues?Array.from(globalThis.crypto.getRandomValues(new Uint32Array(2))).map(v=>v.toString(36)).join(''):Math.random().toString(36).slice(2);return`PRE-${sid}-${Date.now()}-${a}`}
let attemptId=q.get('attemptId')||'';if(!attemptId)attemptId=makeAttempt();
if(!sid){$('who').innerHTML='<span class="error">ไม่พบรหัสนักเรียน กรุณาเปิด Pre-test จาก Hero Passport</span>';return}if(BANK.length!==45||!ENGINE){$('who').textContent='ไม่สามารถโหลดระบบข้อสอบ 90 ข้อได้';return}
const assignment=ENGINE.assignPairs(BANK,{studentId:sid,attemptId,studyId}),built=ENGINE.buildItems(assignment.pairs,{mode:MODE,studentId:sid,attemptId,studyId}),items=built.items,formCode='PRE-V5-'+String(assignment.selectionSeed%200+1).padStart(3,'0');
$('formLabel').textContent=`HSAS-P5 • ${formCode} • RESEARCH 5-5-5`;$('who').textContent=`${fullName||'รหัส '+sid} • 15 ข้อ • Easy 6 / Medium 6 / Hard 3`;
const pairState={assessmentVersion:'5.0',engineVersion:ENGINE.VERSION,studentId:sid,attemptId,form:formCode,studyId,selectionSeed:assignment.selectionSeed,orderSeed:built.orderSeed,pairIds:assignment.pairs.map(x=>x.pairId),questionOrder:built.questionOrder,optionOrders:built.optionOrders,correctPositionDistribution:built.correctPositionDistribution,assignmentMethod:assignment.assignmentMethod,createdAt:new Date().toISOString()};
try{localStorage.setItem(`HH_ASSESSMENT_PAIRS_${sid}`,JSON.stringify(pairState));localStorage.setItem(`HH_ASSESSMENT_PRE_ATTEMPT_${sid}`,attemptId);sessionStorage.setItem(`HH_ASSESSMENT_PAIRS_${sid}`,JSON.stringify(pairState))}catch(_){}
const openedAt=performance.now(),firstSeen=items.map(()=>openedAt),lastChange=items.map(()=>0),changeCount=items.map(()=>0),form=$('form');
form.innerHTML=items.map((it,i)=>`<section class="card" data-qid="${it.id}" data-index="${i}"><div class="q">${i+1}. ${it.text}</div><div class="meta">${it.domain} • ${it.indicator} • ${it.difficulty} • ${it.bloom}</div><div class="opts">${it.displayOptions.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" required><span>${String.fromCharCode(65+j)}. ${o.text}</span></label>`).join('')}</div></section>`).join('')+`<section class="card"><button class="btn" id="submitBtn">ส่งคำตอบ Pre-test</button><p class="muted">จัดชุดรายบุคคลแบบ Exposure-balanced และกระจายตำแหน่งคำตอบถูก A–D อย่างสมดุล</p></section>`;
form.onchange=e=>{const m=String(e.target?.name||'').match(/^q(\d+)$/);if(m){const i=Number(m[1]);lastChange[i]=performance.now();changeCount[i]++}$('bar').style.width=`${form.querySelectorAll('input:checked').length/items.length*100}%`};
form.onsubmit=async e=>{e.preventDefault();const btn=$('submitBtn');btn.disabled=true;btn.textContent='กำลังส่งและรอ Google Sheet ยืนยัน...';const submittedPerf=performance.now(),fd=new FormData(form);let score=0;const responses=items.map((it,i)=>{const displayIndex=Number(fd.get(`q${i}`)),selectedOriginalIndex=it.displayOptions[displayIndex]?.index??null,correct=displayIndex===it.correctDisplayIndex;if(correct)score++;return{questionId:it.id,pairId:it.pairId,domain:it.domain,indicator:it.indicator,difficulty:it.difficulty,bloom:it.bloom,selectedDisplayIndex:displayIndex,selectedOptionIndex:selectedOriginalIndex,optionOrder:it.displayOptions.map(o=>o.index),correctPosition:it.correctPosition,correct,responseTimeMs:Math.round((lastChange[i]||submittedPerf)-firstSeen[i]),answerChangeCount:changeCount[i]}});
const payload={assessmentVersion:'5.0',engineVersion:ENGINE.VERSION,bankVersion:'HSAS-P5-PARALLEL-90',studyId,studentId:sid,studentName:fullName,section,groupCode:group,attemptId,mode:MODE,score,total:items.length,responses,submittedAt:new Date().toISOString(),form:formCode,selectionSeed:assignment.selectionSeed,orderSeed:built.orderSeed,questionOrder:built.questionOrder,optionOrders:built.optionOrders,correctPositionDistribution:built.correctPositionDistribution,assignmentMethod:assignment.assignmentMethod,blueprint:{domains:{hygiene:5,nutrition:5,fitness:5},difficulty:{easy:6,medium:6,hard:3}},bankSize:90,pairIds:assignment.pairs.map(x=>x.pairId),totalTimeMs:Math.round(submittedPerf-openedAt),researchMetadata:{individualAssignment:true,groupExcludedFromSeed:true,parallelPairRegistry:true,answerPositionBalanced:true,itemExposureBalanced:true}};
try{sessionStorage.setItem('HH_PRETEST_LAST',JSON.stringify(payload));localStorage.setItem(`HH_PRETEST_LAST_${sid}`,JSON.stringify(payload))}catch(_){}
form.classList.add('hidden');document.querySelector('.head h1').textContent='Pre-test สำเร็จ';$('bar').style.width='100%';const r=$('result');r.classList.remove('hidden');r.classList.add('done');
const u=new URL(back,location.href);[['hhReturn','assessment'],['task','pretest'],['score',score],['studentId',sid],['form',formCode],['attemptId',attemptId],['assessmentVersion','5.0'],['authorityRefresh','1']].forEach(([k,v])=>u.searchParams.set(k,v));
async function send(){r.innerHTML=`<div class="done-icon">✓</div><h2>ทำ Pre-test เรียบร้อยแล้ว</h2><div class="score">คะแนน ${score}/15</div><div class="sync queue">↻ กำลังส่งและรอ Google Sheet ยืนยัน</div><p class="countdown">กรุณารอ ไม่ต้องทำข้อสอบใหม่</p>`;let syncResult={ok:false};try{syncResult=await window.HHAssessmentSync.submit(payload)}catch(_){};if(syncResult.ok){u.searchParams.set('sheetSync','confirmed');r.innerHTML=`<div class="done-icon">✓</div><h2>ทำ Pre-test เรียบร้อยแล้ว</h2><div class="score">คะแนน ${score}/15</div><div class="sync">✓ Google Sheet ยืนยันแล้ว</div><p class="countdown">กำลังกลับ HeroHealth ใน <strong id="countdown">3</strong> วินาที</p><button id="back" class="btn">กลับ HeroHealth ตอนนี้</button>`;const go=()=>location.replace(u.href);$('back').onclick=go;let n=3;const timer=setInterval(()=>{n--;$('countdown').textContent=String(Math.max(n,0));if(n<=0){clearInterval(timer);go()}},1000)}else{u.searchParams.set('sheetSync','pending');r.innerHTML=`<div class="done-icon">✓</div><h2>คำตอบถูกเก็บไว้แล้ว</h2><div class="score">คะแนน ${score}/15</div><div class="sync queue">ยังไม่ได้รับการยืนยันจาก Google Sheet</div><p class="countdown">ตรวจอินเทอร์เน็ตแล้วกดส่งอีกครั้ง โดยไม่ต้องตอบข้อสอบใหม่</p><button id="retry" class="btn">ลองส่งและตรวจสอบอีกครั้ง</button><button id="stay" class="btn secondary">รออยู่หน้านี้</button>`;$('retry').onclick=send}}
await send();scrollTo({top:0,behavior:'smooth'})};
function $(id){return document.getElementById(id)}
})();
</script></body></html>
