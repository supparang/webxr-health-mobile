<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#7c3aed"><title>HeroHealth Firebase Reflection</title><style>:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#241442;background:#f7f3ff}*{box-sizing:border-box}body{margin:0}.wrap{width:min(760px,100%);margin:auto;padding:16px}.head,.card{background:#fff;border:1px solid #e5d9fa;border-radius:22px}.head{padding:22px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff}.card{padding:18px;margin-top:14px}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice label{padding:14px 8px;border:1px solid #ddd0f4;border-radius:15px;text-align:center;font-weight:800}.choice label:has(input:checked){border-color:#7c3aed;background:#f0e9ff}.choice input{display:block;margin:0 auto 8px}textarea{width:100%;min-height:110px;border:1px solid #d8c8ee;border-radius:14px;padding:12px;font:inherit}.btn{width:100%;min-height:50px;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#7c3aed;color:#fff}.btn:disabled{opacity:.58}.muted{color:#695c7a}.status{margin-top:12px;padding:12px;border-radius:14px;background:#f4efff;color:#5b21b6;font-weight:800;text-align:center;white-space:pre-line}.status.ok{background:#dcfce7;color:#166534}.status.error{background:#fee2e2;color:#991b1b}@media(max-width:560px){.choice{grid-template-columns:1fr}.head,.card{border-radius:18px}.wrap{padding:10px}}</style></head><body><main class="wrap"><section class="head"><small>HH-REF01 • FIREBASE RECEIPT R5</small><h1>ฉันได้เรียนรู้อะไรวันนี้</h1><p id="who"></p></section><form id="form"><section class="card"><h2>1. วันนี้ฉันเข้าใจเรื่องสุขภาพมากขึ้นแค่ไหน</h2><div class="choice"><label><input type="radio" name="understand" value="1" required>🙂 เล็กน้อย</label><label><input type="radio" name="understand" value="2">😊 มากขึ้น</label><label><input type="radio" name="understand" value="3">🌟 มากที่สุด</label></div></section><section class="card"><h2>2. ภารกิจใดช่วยให้ฉันเรียนรู้มากที่สุด</h2><div class="choice"><label><input type="radio" name="best" value="hygiene" required>🧼 สุขอนามัย</label><label><input type="radio" name="best" value="nutrition">🥗 โภชนาการ</label><label><input type="radio" name="best" value="fitness">🏃 การเคลื่อนไหว</label></div></section><section class="card"><h2>3. พรุ่งนี้ฉันจะทำพฤติกรรมสุขภาพอะไร</h2><textarea name="action" required maxlength="240" placeholder="ตัวอย่าง: ฉันจะล้างมือก่อนกินอาหารทุกครั้ง"></textarea><p class="muted">เขียนสั้น ๆ อย่างน้อย 1 ประโยค</p></section><section class="card"><button id="submitBtn" class="btn">ส่ง Reflection ไป Firebase</button><div id="status" class="status" hidden></div></section></form></main><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{HEROHEALTH_FIREBASE_CONFIG,HEROHEALTH_FIREBASE_BUILD}from'../firebase/firebase-config.js';const RELEASE='20260814-FIREBASE-REFLECTION-R5-RESEARCH-GATE';const KEY='herohealth_learning_platform_rc2';const q=new URLSearchParams(location.search);const SANDBOX=new Set(Array.from({length:29},(_,i)=>String(990001+i)));const clean=v=>String(v==null?'':v).trim();const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}};const write=v=>localStorage.setItem(KEY,JSON.stringify(v));let state=read();const sid=clean(q.get('studentId')||q.get('sid')||state.profile?.studentId),form=document.getElementById('form'),button=document.getElementById('submitBtn'),status=document.getElementById('status'),back=q.get('return')||'../index.html?authority=firebase';document.getElementById('who').textContent=q.get('fullName')||state.profile?.fullName||'ผู้เล่น';function show(t,c=''){status.hidden=false;status.className='status'+(c?' '+c:'');status.textContent=t}if(!sid){show('ไม่พบรหัสนักเรียน กรุณากลับเข้าสู่ Hero Passport ใหม่','error');button.disabled=true;throw Error('student_id_required')}const app=getApps().length?getApps()[0]:initializeApp(HEROHEALTH_FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);async function user(){return auth.currentUser||(await signInAnonymously(auth)).user}const sandbox=SANDBOX.has(sid),pcol=sandbox?'studentProgressSandbox':'studentProgress',acol=sandbox?'studentAssessmentsSandbox':'studentAssessments',pref=doc(db,pcol,sid);async function requirePostExperience(){try{const ps=await getDoc(pref),p=ps.exists()?ps.data():null;if(p?.postExperienceCompleted===true&&p?.postExperienceReceiptToken){return true}show('ยังไม่พบ Firebase Receipt ของแบบประเมินหลังเล่น กรุณากลับไปทำ Post-experience ก่อน','error');button.disabled=true;return false}catch(e){show('ตรวจ Post-experience ไม่สำเร็จ: '+String(e?.message||e),'error');button.disabled=true;return false}}await requirePostExperience();const old=state.reflection||{};if(old.understand)form.elements.understand.value=String(old.understand);if(old.best)form.elements.best.value=String(old.best);if(old.action)form.elements.action.value=old.action;form.onsubmit=async event=>{event.preventDefault();const fd=new FormData(form),action=clean(fd.get('action'));if(!action){show('กรุณาเขียนสิ่งที่จะนำไปทำอย่างน้อย 1 ประโยค','error');return}button.disabled=true;button.textContent='กำลังบันทึกและตรวจ Firebase Receipt…';try{const currentUser=await user(),receipt=`${sid}:reflection:${crypto.randomUUID?.()||Date.now()}`,reflection={understand:Number(fd.get('understand'))||0,best:clean(fd.get('best')),action,submittedAt:new Date().toISOString()},aref=doc(db,acol,`${sid}_REFLECTION`),record={...reflection,completed:true,instrument:'HH-REF01',instrumentVersion:'HH-REF01-v1',firebaseReceiptToken:receipt,firebaseSavedByUid:currentUser.uid,firebaseClientSavedAt:new Date().toISOString(),release:RELEASE};await setDoc(aref,{studentId:sid,assessmentType:'reflection',mode:'reflection',completed:true,reflection:record,firebaseReceiptToken:receipt,firebaseSavedByUid:currentUser.uid,firebaseSavedAt:serverTimestamp(),firebaseBuild:HEROHEALTH_FIREBASE_BUILD,release:RELEASE},{merge:true});await setDoc(pref,{studentId:sid,reflectionCompleted:true,researchImmediateCompleted:true,completed:{reflection:true,postExperience:true,researchImmediate:true},reflection:record,reflectionReceiptToken:receipt,researchImmediate:{completed:true,completedAtClient:new Date().toISOString(),required:['posttest','postExperience','reflection']},updatedByUid:currentUser.uid,updatedAt:serverTimestamp(),build:HEROHEALTH_FIREBASE_BUILD},{merge:true});const [as,ps]=await Promise.all([getDoc(aref),getDoc(pref)]),p=ps.data();if(as.data()?.firebaseReceiptToken!==receipt||p?.reflectionReceiptToken!==receipt||p?.reflectionCompleted!==true||p?.postExperienceCompleted!==true||p?.researchImmediateCompleted!==true)throw Error('firebase-reflection-research-gate-mismatch');state=read();state.reflection=record;state.reflectionCompleted=true;state.researchImmediateCompleted=true;state.completed={...(state.completed||{}),reflection:true,postExperience:true,researchImmediate:true};write(state);show('✓ Firebase ยืนยันแบบประเมินหลังเล่นและ Reflection ครบแล้ว\nกำลังกลับ Hero Passport','ok');const url=new URL(back,location.href);url.searchParams.set('authority','firebase');url.searchParams.set('studentId',sid);url.searchParams.set('sid',sid);url.searchParams.set('firebaseReady','1');url.searchParams.set('reflectionReceipt','1');url.searchParams.set('postExperienceReceipt','1');url.searchParams.set('researchImmediateCompleted','1');url.searchParams.set('v',RELEASE);setTimeout(()=>location.replace(url.href),800)}catch(error){show('ยังบันทึก Firebase ไม่สำเร็จ\n'+String(error?.message||error),'error');button.disabled=false;button.textContent='ลองส่ง Reflection ไป Firebase อีกครั้ง'}};</script></body></html>
