<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7c3aed">
<title>HeroHealth Firebase Reflection</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#241442;background:#f7f3ff}*{box-sizing:border-box}body{margin:0}.wrap{width:min(760px,100%);margin:auto;padding:16px}.head,.card{background:#fff;border:1px solid #e5d9fa;border-radius:22px}.head{padding:22px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff}.card{padding:18px;margin-top:14px}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice label{padding:14px 8px;border:1px solid #ddd0f4;border-radius:15px;text-align:center;font-weight:800}.choice label:has(input:checked){border-color:#7c3aed;background:#f0e9ff}.choice input{display:block;margin:0 auto 8px}textarea{width:100%;min-height:110px;border:1px solid #d8c8ee;border-radius:14px;padding:12px;font:inherit}.btn{width:100%;min-height:50px;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#7c3aed;color:#fff}.btn:disabled{opacity:.58}.muted{color:#695c7a}.status{margin-top:12px;padding:12px;border-radius:14px;background:#f4efff;color:#5b21b6;font-weight:800;text-align:center;white-space:pre-line}.status.ok{background:#dcfce7;color:#166534}.status.error{background:#fee2e2;color:#991b1b}@media(max-width:560px){.choice{grid-template-columns:1fr}.head,.card{border-radius:18px}.wrap{padding:10px}}
</style>
</head>
<body>
<main class="wrap">
<section class="head"><small>HERO REFLECTION • FIREBASE RECEIPT R2</small><h1>ฉันได้เรียนรู้อะไรวันนี้</h1><p id="who"></p></section>
<form id="form">
<section class="card"><h2>1. วันนี้ฉันเข้าใจเรื่องสุขภาพมากขึ้นแค่ไหน</h2><div class="choice"><label><input type="radio" name="understand" value="1" required>🙂 เล็กน้อย</label><label><input type="radio" name="understand" value="2">😊 มากขึ้น</label><label><input type="radio" name="understand" value="3">🌟 มากที่สุด</label></div></section>
<section class="card"><h2>2. ภารกิจใดช่วยให้ฉันเรียนรู้มากที่สุด</h2><div class="choice"><label><input type="radio" name="best" value="hygiene" required>🧼 สุขอนามัย</label><label><input type="radio" name="best" value="nutrition">🥗 โภชนาการ</label><label><input type="radio" name="best" value="fitness">🏃 การเคลื่อนไหว</label></div></section>
<section class="card"><h2>3. พรุ่งนี้ฉันจะทำพฤติกรรมสุขภาพอะไร</h2><textarea name="action" required maxlength="240" placeholder="ตัวอย่าง: ฉันจะล้างมือก่อนกินอาหารทุกครั้ง"></textarea><p class="muted">เขียนสั้น ๆ อย่างน้อย 1 ประโยค</p></section>
<section class="card"><button id="submitBtn" class="btn">ส่ง Reflection ไป Firebase</button><div id="status" class="status" hidden></div></section>
</form>
</main>
<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import { HEROHEALTH_FIREBASE_CONFIG, HEROHEALTH_FIREBASE_BUILD } from '../firebase/firebase-config.js';

const RELEASE='20260806-FIREBASE-REFLECTION-RECEIPT-R2-PROGRESS-DOC';
const KEY='herohealth_learning_platform_rc2';
const q=new URLSearchParams(location.search);
const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}};
const write=value=>localStorage.setItem(KEY,JSON.stringify(value));
const clean=value=>String(value==null?'':value).trim();
let state=read();
const sid=clean(q.get('studentId')||q.get('sid')||state.profile?.studentId);
const form=document.getElementById('form'),button=document.getElementById('submitBtn'),status=document.getElementById('status');
const back=q.get('return')||'../index.html?authority=firebase';
document.getElementById('who').textContent=q.get('fullName')||state.profile?.fullName||'ผู้เล่น';
function show(text,type=''){status.hidden=false;status.className='status'+(type?' '+type:'');status.textContent=text}
if(!sid){show('ไม่พบรหัสนักเรียน กรุณากลับเข้าสู่ Hero Passport ใหม่','error');button.disabled=true;throw new Error('student_id_required')}

const app=getApps().length?getApps()[0]:initializeApp(HEROHEALTH_FIREBASE_CONFIG);
const auth=getAuth(app),db=getFirestore(app);
async function user(){return auth.currentUser||(await signInAnonymously(auth)).user}
function receiptToken(){return `${sid}:reflection:${crypto.randomUUID?.()||Date.now()}`}
function restore(){const reflection=state.reflection||{};if(reflection.understand)form.elements.understand.value=String(reflection.understand);if(reflection.best)form.elements.best.value=String(reflection.best);if(reflection.action)form.elements.action.value=reflection.action}
restore();

form.onsubmit=async event=>{
 event.preventDefault();
 const fd=new FormData(form),action=clean(fd.get('action'));
 if(!action){show('กรุณาเขียนสิ่งที่จะนำไปทำอย่างน้อย 1 ประโยค','error');return}
 const reflection={understand:Number(fd.get('understand'))||0,best:clean(fd.get('best')),action,submittedAt:new Date().toISOString()};
 button.disabled=true;button.textContent='กำลังบันทึกและตรวจ Firebase Receipt…';show('กำลังส่ง Reflection ไป Firebase…');
 try{
  const currentUser=await user(),receipt=receiptToken();
  const progressCollection=sid==='990014'?'studentProgressSandbox':'studentProgress';
  const progressRef=doc(db,progressCollection,sid);
  const reflectionRecord={...reflection,completed:true,firebaseReceiptToken:receipt,firebaseSavedByUid:currentUser.uid,firebaseClientSavedAt:new Date().toISOString(),release:RELEASE};
  await setDoc(progressRef,{
    studentId:sid,
    reflectionCompleted:true,
    completed:{reflection:true},
    reflection:reflectionRecord,
    reflectionReceiptToken:receipt,
    updatedByUid:currentUser.uid,
    updatedAt:serverTimestamp(),
    build:HEROHEALTH_FIREBASE_BUILD
  },{merge:true});
  const progressSnap=await getDoc(progressRef);
  const remoteProgress=progressSnap.exists()?progressSnap.data():null;
  const confirmed=remoteProgress?.reflection?.firebaseReceiptToken===receipt&&remoteProgress?.reflectionReceiptToken===receipt&&remoteProgress?.reflectionCompleted===true&&remoteProgress?.completed?.reflection===true;
  if(!confirmed)throw new Error('firebase-reflection-receipt-mismatch');
  state=read();state.reflection=reflectionRecord;state.reflectionCompleted=true;state.completed={...(state.completed||{}),reflection:true};state.firebaseReflection={receipt,confirmedAt:new Date().toISOString(),release:RELEASE,progressPath:progressRef.path};write(state);
  show('✓ Firebase ยืนยัน Reflection แล้ว\nกำลังกลับ Hero Passport','ok');
  const url=new URL(back,location.href);url.searchParams.set('authority','firebase');url.searchParams.set('studentId',sid);url.searchParams.set('sid',sid);url.searchParams.set('firebaseReady','1');url.searchParams.set('firebaseReceipt','1');url.searchParams.set('reflectionReceipt','1');url.searchParams.set('authorityRefresh',String(Date.now()));url.searchParams.set('v',RELEASE);
  setTimeout(()=>location.replace(url.href),700);
 }catch(error){console.error('[Firebase Reflection R2]',error);show('ยังบันทึก Firebase ไม่สำเร็จ\n'+String(error?.message||error),'error');button.disabled=false;button.textContent='ลองส่ง Reflection ไป Firebase อีกครั้ง'}
};
</script>
</body>
</html>
