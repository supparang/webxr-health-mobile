<!doctype html>
<html lang="th" style="display:none">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f766e">
<title>HeroHealth Post-test V6</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#12302c;background:#f3fbf9}*{box-sizing:border-box}body{margin:0}.wrap{width:min(860px,100%);margin:auto;padding:16px}.head,.card{background:#fff;border:1px solid #d6e9e4;border-radius:22px;box-shadow:0 12px 30px rgba(15,118,110,.1)}.head{padding:22px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}.head p{color:#dcfffa}.card{padding:18px;margin-top:14px}.q{font-size:18px;font-weight:900;margin-bottom:12px}.meta{font-size:12px;color:#68807b;margin:-5px 0 10px}.opts{display:grid;gap:9px}.opt{display:flex;gap:10px;padding:13px;border:1px solid #cfe3df;border-radius:14px}.opt:has(input:checked){border-color:#0f766e;background:#e8f8f4}.btn{width:100%;min-height:50px;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#0f766e;color:#fff}.btn:disabled{opacity:.65}.progress{height:10px;background:#dcebe8;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#14b8a6}.muted{color:#5f7470}.hidden{display:none}.done{padding:30px 24px;text-align:center}.done-icon{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#dff8ef;color:#087b62;font-size:36px;font-weight:900}.done h2{margin:0 0 8px;font-size:26px}.score{font-size:20px;font-weight:900;margin:14px 0}.sync{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:#e8f8f4;color:#087b62;font-weight:800}.sync.queue{background:#fff5db;color:#9a6700}.countdown{font-size:14px;color:#5f7470;margin:16px 0 0}.done .btn{margin-top:16px}.error{color:#b91c1c;font-weight:900}@media(max-width:600px){.wrap{padding:12px}.head{padding:18px}.done{padding:26px 18px}.q{font-size:17px}.opt{min-height:48px}}
</style>
<script src="../assets/posttest-summary-gate-v1.js?v=20260731-assessment-stable-v6"></script>
</head>
<body>
<main class="wrap">
<section class="head"><small id="formLabel">HSAS-P5 • RESEARCH ASSESSMENT V6</small><h1>Post-test หลังจบภารกิจ</h1><p id="who">กำลังดึงชุดข้อสอบคู่ขนานจาก Google Sheet</p><div class="progress"><i id="bar" style="width:0%"></i></div></section>
<form id="form"></form><section id="result" class="card hidden"></section>
</main>
<script src="../data/config.js?v=20260731-assessment-stable-v6"></script>
<script src="assessment-sheet-sync-r89.js?v=20260731-assessment-stable-v6"></script>
<script src="assessment-bank-v3.js?v=20260731-assessment-stable-v6"></script>
<script src="assessment-engine-v6.js?v=20260731-assessment-stable-v6"></script>
<script>
(async()=>{'use strict';
const MODE='post',KEY='herohealth_learning_platform_rc2',q=new URLSearchParams(location.search),ENGINE=window.HHAssessmentEngineV6,SYNC=window.HHAssessmentSync;
let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}
const sid=String(q.get('studentId')||q.get('sid')||state.profile?.studentId||'').trim();
const fullName=q.get('fullName')||state.profile?.fullName||'';
const section=q.get('section')||state.profile?.section||'';
const group=q.get('group')||state.profile?.group||'';
const back=q.get('return')||'../index.html';
const BANK=window.HH_ASSESSMENT_BANK_V3||[];
const studyId=q.get('studyId')||'HEROHEALTH-P5-2026';
const attemptId=q.get('attemptId')||ENGINE?.stableAttemptId(MODE,sid,studyId)||`POST-${sid}`;
if(!sid){$('who').innerHTML='<span class="error">ไม่พบรหัสนักเรียน กรุณาเปิด Post-test จาก Hero Passport</span>';document.documentElement.style.display='';return}
if(BANK.length!==45||!ENGINE||!SYNC){$('who').textContent='ไม่สามารถโหลดระบบข้อสอบ 90 ข้อได้';document.documentElement.style.display='';return}
let localRegistry=null;try{localRegistry=JSON.parse(localStorage.getItem(`HH_ASSESSMENT_PAIRS_${sid}`)||sessionStorage.getItem(`HH_ASSESSMENT_PAIRS_${sid}`)||'null')}catch(_){}
let remoteRegistry=null;
try{
 const remote=await Promise.race([SYNC.getPretestAssignment(sid),new Promise(resolve=>setTimeout(()=>resolve({ok:false,reason:'registry_timeout'}),5000))]);
 if(remote?.ok&&ENGINE.validPairIds(BANK,remote.assignment?.pairIds,15)&&(remote.assignment.studyId===''||remote.assignment.studyId===studyId))remoteRegistry=remote.assignment;
}catch(err){console.warn('[Post-test V6] Sheet registry unavailable, using deterministic fallback',err)}
let registry=null,assignmentSource='student-deterministic-v6';
if(remoteRegistry){registry=remoteRegistry;assignmentSource='google-sheet-pretest-registry'}
else if(localRegistry?.studentId===sid&&ENGINE.validPairIds(BANK,localRegistry.pairIds,15)&&(localRegistry.studyId==null||localRegistry.studyId===studyId)){registry=localRegistry;assignmentSource='local-pretest-registry'}
const deterministic=ENGINE.assignPairs(BANK,{studentId:sid,studyId});
const pairIds=registry?.pairIds||deterministic.pairIds;
const pairs=ENGINE.pairsFromIds(BANK,pairIds);
if(pairs.length!==15){$('who').textContent='ไม่พบชุดข้อสอบคู่ขนานที่สมบูรณ์ กรุณาติดต่อครู';document.documentElement.style.display='';return}
const preAttemptId=q.get('preAttemptId')||registry?.preAttemptId||registry?.attemptId||ENGINE.stableAttemptId('pre',sid,studyId);
const selectionSeed=registry?.selectionSeed??deterministic.selectionSeed;
const assignmentMethod=registry?.assignmentMethod||deterministic.assignmentMethod;
const assignmentFingerprint=registry?.assignmentFingerprint||ENGINE.assignmentFingerprint(pairIds,{studentId:sid,studyId});
const built=ENGINE.buildItems(pairs,{mode:MODE,studentId:sid,studyId});
const items=built.items;
const formCode='POST-V6-'+String(built.orderSeed%200+1).padStart(3,'0');
$('formLabel').textContent=`HSAS-P5 • ${formCode} • PARALLEL 5-5-5`;
$('who').textContent=`${fullName||'รหัส '+sid} • 15 ข้อคู่ขนานจาก Pre-test • Easy 6 / Medium 6 / Hard 3`;
document.documentElement.style.display='';
const openedAt=performance.now(),firstSeen=items.map(()=>openedAt),lastChange=items.map(()=>0),changeCount=items.map(()=>0),form=$('form');
form.innerHTML=items.map((it,i)=>`<section class="card" data-qid="${it.id}" data-index="${i}"><div class="q">${i+1}. ${it.text}</div><div class="meta">${it.domain} • ${it.indicator} • ${it.difficulty} • ${it.bloom}</div><div class="opts">${it.displayOptions.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" required><span>${String.fromCharCode(65+j)}. ${o.text}</span></label>`).join('')}</div></section>`).join('')+`<section class="card"><button class="btn" id="submitBtn">ส่งคำตอบ Post-test</button><p class="muted">ใช้ Pair ID เดียวกับ Pre-test จาก Sheet ก่อน และสร้างซ้ำแบบคงที่เมื่อเปลี่ยนเครื่อง</p></section>`;
form.onchange=e=>{const m=String(e.target?.name||'').match(/^q(\d+)$/);if(m){const i=Number(m[1]);lastChange[i]=performance.now();changeCount[i]++}$('bar').style.width=`${form.querySelectorAll('input:checked').length/items.length*100}%`};
form.onsubmit=async e=>{
 e.preventDefault();const btn=$('submitBtn');btn.disabled=true;btn.textContent='กำลังส่งและตรวจผลจาก Google Sheet...';
 const submittedPerf=performance.now(),fd=new FormData(form);let score=0;
 const responses=items.map((it,i)=>{const displayIndex=Number(fd.get(`q${i}`)),selectedOriginalIndex=it.displayOptions[displayIndex]?.index??null,correct=displayIndex===it.correctDisplayIndex;if(correct)score++;return{questionId:it.id,pairId:it.pairId,domain:it.domain,indicator:it.indicator,difficulty:it.difficulty,bloom:it.bloom,selectedDisplayIndex:displayIndex,selectedOptionIndex:selectedOriginalIndex,optionOrder:it.displayOptions.map(o=>o.index),correctPosition:it.correctPosition,correct,responseTimeMs:Math.round((lastChange[i]||submittedPerf)-firstSeen[i]),answerChangeCount:changeCount[i]}});
 const payload={assessmentVersion:'6.0',engineVersion:ENGINE.VERSION,bankVersion:'HSAS-P5-PARALLEL-90',studyId,studentId:sid,studentName:fullName,section,groupCode:group,attemptId,preAttemptId,mode:MODE,score,total:items.length,responses,submittedAt:new Date().toISOString(),form:formCode,selectionSeed,orderSeed:built.orderSeed,questionOrder:built.questionOrder,optionOrders:built.optionOrders,correctPositionDistribution:built.correctPositionDistribution,assignmentMethod,assignmentSource,assignmentFingerprint,blueprint:{domains:{hygiene:5,nutrition:5,fitness:5},difficulty:{easy:6,medium:6,hard:3}},bankSize:90,pairIds,totalTimeMs:Math.round(submittedPerf-openedAt),researchMetadata:{individualAssignment:true,studentStableAssignment:true,groupExcludedFromSeed:true,parallelForm:true,parallelMatchGuaranteed:true,sheetRegistryPreferred:true,crossDeviceReconstruction:true,answerPositionBalanced:true,itemExposureBalanced:true}};
 try{sessionStorage.setItem('HH_POSTTEST_LAST',JSON.stringify(payload));localStorage.setItem(`HH_POSTTEST_LAST_${sid}`,JSON.stringify(payload))}catch(_){}
 let syncResult={ok:false,queued:true};try{syncResult=await SYNC.submit(payload)}catch(err){console.error('[Post-test V6 submit]',err)}
 const u=new URL(back,location.href);[['hhReturn','assessment'],['task','posttest'],['score',score],['studentId',sid],['form',formCode],['attemptId',attemptId],['assessmentVersion','6.0'],['sheetSync',syncResult.ok?'confirmed':'pending']].forEach(([k,v])=>u.searchParams.set(k,v));
 form.classList.add('hidden');document.querySelector('.head h1').textContent='Post-test สำเร็จ';$('who').textContent=syncResult.ok?'Google Sheet ยืนยันผลและ Pair Registry แล้ว':'บันทึกสำรองแล้ว ยังรอ Sheet ยืนยัน';$('bar').style.width='100%';
 const r=$('result');r.classList.remove('hidden');r.classList.add('done');r.innerHTML=`<div class="done-icon">✓</div><h2>ทำ Post-test เรียบร้อยแล้ว</h2><div class="score">คะแนน ${score}/15</div><div class="${syncResult.ok?'sync':'sync queue'}">${syncResult.ok?'✓ Google Sheet ยืนยันแล้ว':'↻ ยังไม่ได้รับการยืนยันจาก Google Sheet'}</div><p class="countdown">${syncResult.ok?'กำลังกลับ HeroHealth ใน <strong id="countdown">3</strong> วินาที':`${syncResult.error||syncResult.reason||'รอส่งซ้ำ'}`}</p><button id="back" class="btn">${syncResult.ok?'กลับ HeroHealth ตอนนี้':'กลับ Passport โดยเก็บผลไว้ส่งซ้ำ'}</button>`;
 const go=()=>location.replace(u.href);$('back').onclick=go;if(syncResult.ok){let n=3;const timer=setInterval(()=>{n--;$('countdown').textContent=String(Math.max(n,0));if(n<=0){clearInterval(timer);go()}},1000)}scrollTo({top:0,behavior:'smooth'});
};
function $(id){return document.getElementById(id)}
})().catch(err=>{console.error('[Post-test V6 boot]',err);document.documentElement.style.display='';const who=document.getElementById('who');if(who)who.innerHTML='<span class="error">เปิดแบบทดสอบไม่สำเร็จ กรุณากลับ Passport แล้วลองใหม่</span>'});
</script>
</body>
</html>
