<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0f766e"><title>HeroHealth Post-test v3</title><style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#12302c;background:#f3fbf9}*{box-sizing:border-box}body{margin:0}.wrap{width:min(860px,100%);margin:auto;padding:16px}.head,.card{background:#fff;border:1px solid #d6e9e4;border-radius:22px;box-shadow:0 12px 30px rgba(15,118,110,.1)}.head{padding:22px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}.head p{color:#dcfffa}.card{padding:18px;margin-top:14px}.q{font-size:18px;font-weight:900;margin-bottom:12px}.meta{font-size:12px;color:#68807b;margin:-5px 0 10px}.opts{display:grid;gap:9px}.opt{display:flex;gap:10px;padding:13px;border:1px solid #cfe3df;border-radius:14px}.opt:has(input:checked){border-color:#0f766e;background:#e8f8f4}.btn{width:100%;min-height:50px;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#0f766e;color:#fff}.progress{height:10px;background:#dcebe8;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#14b8a6}.muted{color:#5f7470}.hidden{display:none}.done{padding:30px 24px;text-align:center}.done-icon{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#dff8ef;color:#087b62;font-size:36px;font-weight:900}.done h2{margin:0 0 8px;font-size:26px}.score{font-size:20px;font-weight:900;margin:14px 0}.sync{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:#e8f8f4;color:#087b62;font-weight:800}.countdown{font-size:14px;color:#5f7470;margin:16px 0 0}.done .btn{margin-top:16px;background:#0f766e}@media(max-width:600px){.wrap{padding:12px}.head{padding:18px}.done{padding:26px 18px}.done h2{font-size:23px}}
</style></head>
<body><main class="wrap"><section class="head"><small id="formLabel">HSAS-P5 • ASSESSMENT V3</small><h1>Post-test หลังจบเกม</h1><p id="who">กำลังสร้างแบบทดสอบขนาน</p><div class="progress"><i id="bar" style="width:0%"></i></div></section><form id="form"></form><section id="result" class="card hidden"></section></main>
<script src="assessment-bank-v3.js?v=20260726"></script><script>
(()=>{'use strict';
const MODE='post',KEY='herohealth_learning_platform_rc2',q=new URLSearchParams(location.search);let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}const sid=q.get('studentId')||state.profile?.studentId||'',back=q.get('return')||'../index.html',BANK=window.HH_ASSESSMENT_BANK_V3||[];
function hash(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let x=seed||123456789;return()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickUnique(pool,count,r,used){const picked=[];for(const item of shuffle(pool,r)){if(!used.has(item.indicator)){picked.push(item);used.add(item.indicator);if(picked.length===count)break}}if(picked.length<count){for(const item of shuffle(pool,r)){if(!picked.includes(item)){picked.push(item);if(picked.length===count)break}}}return picked}
function selectDomain(domain,r){const all=BANK.filter(x=>x.domain===domain),used=new Set();return [...pickUnique(all.filter(x=>x.difficulty==='easy'),2,r,used),...pickUnique(all.filter(x=>x.difficulty==='medium'),2,r,used),...pickUnique(all.filter(x=>x.difficulty==='hard'),1,r,used)]}
if(BANK.length!==45){document.getElementById('who').textContent='ไม่สามารถโหลดคลังข้อสอบ 90 ข้อได้';return}
const selectionSeed=hash(`herohealth-assessment-v3|${sid||'guest'}`),selectionRandom=rng(selectionSeed),orderSeed=hash(`herohealth-posttest-order-v3|${sid||'guest'}`),random=rng(orderSeed),formCode='POST-V3-'+String(selectionSeed%24+1).padStart(2,'0');
let pairs=null;try{const saved=JSON.parse(sessionStorage.getItem(`HH_ASSESSMENT_PAIRS_${sid||'guest'}`)||'null');if(Array.isArray(saved)&&saved.length===15)pairs=saved.map(id=>BANK.find(x=>x.pairId===id)).filter(Boolean)}catch(_){}
if(!pairs||pairs.length!==15)pairs=['hygiene','nutrition','fitness'].flatMap(d=>selectDomain(d,selectionRandom));
const items=shuffle(pairs,random).map(pair=>{const source=pair.post,opts=shuffle(source.options.map((text,index)=>({text,index})),random);return{...pair,...source,displayOptions:opts,correctDisplayIndex:opts.findIndex(o=>o.index===source.answer)}});
document.getElementById('formLabel').textContent=`HSAS-P5 • ${formCode} • PARALLEL STRATIFIED 5-5-5`;
document.getElementById('who').textContent=`${state.profile?.fullName||'รหัส '+(sid||'-')} • 15 ข้อคู่ขนานจากคลังรวม 90 ข้อ • Easy 6 / Medium 6 / Hard 3`;
const form=document.getElementById('form');form.innerHTML=items.map((it,i)=>`<section class="card" data-qid="${it.id}"><div class="q">${i+1}. ${it.text}</div><div class="meta">${it.domain} • ${it.indicator} • ${it.difficulty}</div><div class="opts">${it.displayOptions.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" required><span>${String.fromCharCode(65+j)}. ${o.text}</span></label>`).join('')}</div></section>`).join('')+`<section class="card"><button class="btn">ส่งคำตอบ Post-test</button><p class="muted">สุ่มคำถามและลำดับตัวเลือกเหมือน Pre-test โดยใช้ข้อคู่ขนานคนละข้อในระดับและตัวชี้วัดเดียวกัน</p></section>`;
form.onchange=()=>document.getElementById('bar').style.width=`${form.querySelectorAll('input:checked').length/items.length*100}%`;
form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);let score=0;const responses=items.map((it,i)=>{const displayIndex=Number(fd.get(`q${i}`)),selectedOriginalIndex=it.displayOptions[displayIndex]?.index??null,correct=displayIndex===it.correctDisplayIndex;if(correct)score++;return{questionId:it.id,pairId:it.pairId,domain:it.domain,indicator:it.indicator,difficulty:it.difficulty,bloom:it.bloom,selectedDisplayIndex:displayIndex,selectedOptionIndex:selectedOriginalIndex,optionOrder:it.displayOptions.map(o=>o.index),correct,responseTimeMs:null}});const payload={assessmentVersion:'3.0',studentId:sid,mode:MODE,score,total:items.length,responses,submittedAt:new Date().toISOString(),form:formCode,seed:selectionSeed,orderSeed,blueprint:{domains:{hygiene:5,nutrition:5,fitness:5},difficulty:{easy:6,medium:6,hard:3}},bankSize:90,pairIds:pairs.map(x=>x.pairId)};try{sessionStorage.setItem('HH_POSTTEST_LAST',JSON.stringify(payload))}catch(_){}
const buildReturnUrl=()=>{const u=new URL(back,location.href);u.searchParams.set('hhReturn','assessment');u.searchParams.set('task','posttest');u.searchParams.set('score',score);u.searchParams.set('studentId',sid);u.searchParams.set('form',formCode);u.searchParams.set('assessmentVersion','3.0');return u.href};
form.classList.add('hidden');document.querySelector('.head h1').textContent='Post-test สำเร็จ';document.getElementById('who').textContent='บันทึกผลเรียบร้อย กำลังกลับ HeroHealth';document.getElementById('bar').style.width='100%';const r=document.getElementById('result');r.classList.remove('hidden');r.classList.add('done');r.innerHTML=`<div class="done-icon">✓</div><h2>ทำ Post-test เรียบร้อยแล้ว</h2><div class="score">คะแนน ${score}/15</div><div class="sync">✓ บันทึกผลแล้ว</div><p class="countdown">กำลังกลับ HeroHealth ใน <strong id="countdown">3</strong> วินาที</p><button id="back" class="btn">กลับ HeroHealth ตอนนี้</button>`;
const goBack=()=>{location.replace(buildReturnUrl())};document.getElementById('back').onclick=goBack;let remaining=3;const timer=setInterval(()=>{remaining-=1;const el=document.getElementById('countdown');if(el)el.textContent=String(Math.max(remaining,0));if(remaining<=0){clearInterval(timer);goBack()}},1000);scrollTo({top:0,behavior:'smooth'})};
})();
</script></body></html>
