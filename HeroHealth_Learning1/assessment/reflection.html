<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7c3aed">
<title>HeroHealth Reflection</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#241442;background:#f7f3ff}*{box-sizing:border-box}body{margin:0}.wrap{width:min(760px,100%);margin:auto;padding:16px}.head,.card{background:#fff;border:1px solid #e5d9fa;border-radius:22px}.head{padding:22px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff}.card{padding:18px;margin-top:14px}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice label{padding:14px 8px;border:1px solid #ddd0f4;border-radius:15px;text-align:center;font-weight:800}.choice label:has(input:checked){border-color:#7c3aed;background:#f0e9ff}.choice input{display:block;margin:0 auto 8px}textarea{width:100%;min-height:110px;border:1px solid #d8c8ee;border-radius:14px;padding:12px;font:inherit}.btn{width:100%;min-height:50px;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#7c3aed;color:#fff}.btn:disabled{opacity:.58}.muted{color:#695c7a}.status{margin-top:12px;padding:12px;border-radius:14px;background:#f4efff;color:#5b21b6;font-weight:800;text-align:center;white-space:pre-line}.status.ok{background:#dcfce7;color:#166534}.status.error{background:#fee2e2;color:#991b1b}@media(max-width:560px){.choice{grid-template-columns:1fr}.head,.card{border-radius:18px}.wrap{padding:10px}}
</style>
<script src="../data/backend-config.js?v=20260731-reflection-authority-r54"></script>
</head>
<body>
<main class="wrap">
<section class="head"><small>HERO REFLECTION • SHEET AUTHORITY R54</small><h1>ฉันได้เรียนรู้อะไรวันนี้</h1><p id="who"></p></section>
<form id="form">
<section class="card"><h2>1. วันนี้ฉันเข้าใจเรื่องสุขภาพมากขึ้นแค่ไหน</h2><div class="choice"><label><input type="radio" name="understand" value="1" required>🙂 เล็กน้อย</label><label><input type="radio" name="understand" value="2">😊 มากขึ้น</label><label><input type="radio" name="understand" value="3">🌟 มากที่สุด</label></div></section>
<section class="card"><h2>2. ภารกิจใดช่วยให้ฉันเรียนรู้มากที่สุด</h2><div class="choice"><label><input type="radio" name="best" value="hygiene" required>🧼 สุขอนามัย</label><label><input type="radio" name="best" value="nutrition">🥗 โภชนาการ</label><label><input type="radio" name="best" value="fitness">🏃 การเคลื่อนไหว</label></div></section>
<section class="card"><h2>3. พรุ่งนี้ฉันจะทำพฤติกรรมสุขภาพอะไร</h2><textarea name="action" required maxlength="240" placeholder="ตัวอย่าง: ฉันจะล้างมือก่อนกินอาหารทุกครั้ง"></textarea><p class="muted">เขียนสั้น ๆ อย่างน้อย 1 ประโยค</p></section>
<section class="card"><button id="submitBtn" class="btn">ส่ง Reflection และบันทึกลง Google Sheet</button><div id="status" class="status" hidden></div></section>
</form>
</main>
<script>
(()=>{'use strict';
const RELEASE='20260731-REFLECTION-SHEET-AUTHORITY-R54';
const KEY='herohealth_learning_platform_rc2';
const ENDPOINT=String(window.HH_CONFIG?.backend?.webAppUrl||'https://script.google.com/macros/s/AKfycbwa-OSdqWS7uPne01wNr5a42PgKfAoxmUUm7yMcUx2D0C0OnbjrbppNUHkfjUxm79Fz/exec').trim();
const form=document.getElementById('form'),button=document.getElementById('submitBtn'),status=document.getElementById('status');
const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}};
const write=value=>localStorage.setItem(KEY,JSON.stringify(value));
const clean=value=>String(value==null?'':value).trim();
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let state=read();
const sid=clean(state.profile?.studentId);
document.getElementById('who').textContent=state.profile?.fullName||'ผู้เล่น';
if(!sid){show('ไม่พบรหัสนักเรียน กรุณากลับเข้าสู่ Hero Passport ใหม่','error');button.disabled=true;return}

function show(text,type=''){status.hidden=false;status.className='status'+(type?' '+type:'');status.textContent=text}
function eventId(reflection){const token=clean(reflection.submittedAt).replace(/[^0-9A-Za-z]+/g,'').slice(0,30)||Date.now();return `HH-reflection-${sid}-${token}`}
function jsonp(params,timeout=30000){return new Promise((resolve,reject)=>{const callback='HHR54_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),script=document.createElement('script');let done=false;const finish=(error,data)=>{if(done)return;done=true;clearTimeout(timer);try{delete window[callback]}catch(_){}try{script.remove()}catch(_){}error?reject(error):resolve(data)};const timer=setTimeout(()=>finish(new Error('sheet_timeout')),timeout);window[callback]=data=>finish(null,data);script.onerror=()=>finish(new Error('sheet_load_failed'));script.src=ENDPOINT+'?'+new URLSearchParams({...params,callback,clientVersion:RELEASE,_:Date.now()});document.head.appendChild(script)})}
function payload(reflection){const p=state.profile||{};return{eventId:eventId(reflection),eventType:'reflection',studentId:sid,clientTs:new Date().toISOString(),profile:{fullName:p.fullName||'',section:p.section||'',group:p.group||state.group||''},status:'ส่ง Reflection',currentStep:'reflection',reflection,platformVersion:window.HH_CONFIG?.platformVersion||'',recoveryPolicy:'sheet-confirmed-before-passport-return-r54'}}
function applyAuthority(api){const authority=api.authoritativeState||api,current=read();const next={...current,...authority,profile:{...(current.profile||{}),...(authority.profile||api.profile||{}),studentId:sid},completed:{...(current.completed||{}),...(authority.completed||api.completed||{})},scores:{...(current.scores||{}),...(authority.scores||api.scores||{})},gameCompleted:authority.gameCompleted||api.gameCompleted||current.gameCompleted,gameScores:authority.gameScores||api.gameScores||current.gameScores,gameResults:authority.gameResults||api.gameResults||current.gameResults,reflection:authority.reflection||api.reflection||current.reflection,progress:authority.progress||api.progress||current.progress,authoritativeProgress:authority.progress||api.progress||current.authoritativeProgress,sheetAuthority:true,offlineAuthority:false,pendingAssessmentAuthority:null,lastAuthoritySyncAt:new Date().toISOString(),reflectionAuthorityVersion:RELEASE};write(next)}
async function sendAndConfirm(reflection){const body=payload(reflection);const ack=await jsonp({action:'submit',payload:JSON.stringify(body)},30000);if(!ack?.ok)throw new Error(ack?.error||'reflection_submit_failed');for(let attempt=1;attempt<=12;attempt++){show('Google Sheet รับคำตอบแล้ว\nกำลังยืนยัน Reflection…'+(attempt>1?'\nตรวจสอบครั้งที่ '+attempt:''));await sleep(450+attempt*170);const api=await jsonp({action:'student',studentId:sid,reconcile:'1',force:'1'},24000).catch(()=>null);const authority=api?.authoritativeState||api;if(api?.ok&&authority?.completed?.reflection===true){applyAuthority(api);show('✓ Google Sheet ยืนยัน Reflection แล้ว\nกำลังกลับ Hero Passport','ok');await sleep(500);const url=new URL('../index.html',location.href);url.searchParams.set('studentId',sid);url.searchParams.set('authorityRefresh',Date.now());url.searchParams.set('v','20260731-reflection-r54-confirmed');location.replace(url.href);return}if(attempt===6)await jsonp({action:'reconcileStudent',studentId:sid,force:'1'},24000).catch(()=>null)}throw new Error('reflection_authority_not_confirmed')}
function restore(){const reflection=state.reflection||{};if(reflection.understand)form.elements.understand.value=String(reflection.understand);if(reflection.best)form.elements.best.value=String(reflection.best);if(reflection.action)form.elements.action.value=reflection.action}
restore();
form.onsubmit=async event=>{event.preventDefault();const fd=new FormData(form),action=clean(fd.get('action'));if(!action){show('กรุณาเขียนสิ่งที่จะนำไปทำอย่างน้อย 1 ประโยค','error');return}const reflection={understand:Number(fd.get('understand'))||0,best:clean(fd.get('best')),action,submittedAt:state.reflection?.submittedAt||new Date().toISOString()};state=read();state.reflection=reflection;state.pendingReflectionAuthority={studentId:sid,eventId:eventId(reflection),createdAt:new Date().toISOString(),version:RELEASE};write(state);button.disabled=true;button.textContent='กำลังบันทึก Reflection…';show('กำลังส่งคำตอบไป Google Sheet…');try{await sendAndConfirm(reflection)}catch(error){console.error('[Reflection Authority R54]',error);show('ยังยืนยันกับ Google Sheet ไม่สำเร็จ\nคำตอบถูกเก็บไว้ในเครื่องแล้ว กรุณากดส่งอีกครั้ง','error');button.disabled=false;button.textContent='ส่ง Reflection อีกครั้ง'}};
})();
</script>
</body>
</html>
