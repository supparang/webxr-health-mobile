<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0f766e"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>HeroHealth Reflection</title><style>:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#17352f;background:#f3fbf9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eafaf7,#f8fbfb 42%)}.wrap{width:min(760px,100%);margin:auto;padding:16px}.head,.card{background:#fff;border:1px solid #d6e9e4;border-radius:22px}.head{padding:22px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;box-shadow:0 12px 30px rgba(15,118,110,.12)}.card{padding:18px;margin-top:14px}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice label{padding:14px 8px;border:1px solid #cfe3df;border-radius:15px;text-align:center;font-weight:800;background:#fff}.choice label:has(input:checked){border-color:#0f766e;background:#e8f8f4;color:#0f5f58}.choice input{display:block;margin:0 auto 8px;accent-color:#0f766e}textarea{width:100%;min-height:110px;border:1px solid #bfd5d0;border-radius:14px;padding:12px;font:inherit;outline:none}textarea:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.10)}.btn{width:100%;min-height:50px;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}.btn:disabled{opacity:.58}.muted{color:#607570}.status{margin-top:12px;padding:12px;border-radius:14px;background:#e8f8f4;color:#0f5f58;font-weight:800;text-align:center;white-space:pre-line}.status.ok{background:#dcfce7;color:#166534}.status.error{background:#fee2e2;color:#991b1b}@media(max-width:560px){.choice{grid-template-columns:1fr}.head,.card{border-radius:18px}.wrap{padding:10px}}</style></head><body><main class="wrap"><section class="head"><small>HH-REF01 • FIREBASE ATOMIC R7</small><h1>ฉันได้เรียนรู้อะไรวันนี้</h1><p id="who"></p></section><form id="form"><section class="card"><h2>1. วันนี้ฉันเข้าใจเรื่องสุขภาพมากขึ้นแค่ไหน</h2><div class="choice"><label><input type="radio" name="understand" value="1" required>🙂 เล็กน้อย</label><label><input type="radio" name="understand" value="2">😊 มากขึ้น</label><label><input type="radio" name="understand" value="3">🌟 มากที่สุด</label></div></section><section class="card"><h2>2. ภารกิจใดช่วยให้ฉันเรียนรู้มากที่สุด</h2><div class="choice"><label><input type="radio" name="best" value="hygiene" required>🧼 สุขอนามัย</label><label><input type="radio" name="best" value="nutrition">🥗 โภชนาการ</label><label><input type="radio" name="best" value="fitness">🏃 การเคลื่อนไหว</label></div></section><section class="card"><h2>3. พรุ่งนี้ฉันจะทำพฤติกรรมสุขภาพอะไร</h2><textarea name="action" required maxlength="240" placeholder="ตัวอย่าง: ฉันจะล้างมือก่อนกินอาหารทุกครั้ง"></textarea><p class="muted">เขียนสั้น ๆ อย่างน้อย 1 ประโยค</p></section><section class="card"><button id="submitBtn" class="btn">ส่งคำตอบและยืนยันกับ Firebase</button><div id="status" class="status" hidden></div></section></form></main><script type="module">
import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{getFirestore,doc,getDoc,runTransaction,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{HEROHEALTH_FIREBASE_CONFIG,HEROHEALTH_FIREBASE_BUILD}from'../firebase/firebase-config.js';
const RELEASE='20260818-FIREBASE-REFLECTION-R7-ATOMIC-STRICT-GATE',KEY='herohealth_learning_platform_rc2',q=new URLSearchParams(location.search),SANDBOX=new Set(Array.from({length:29},(_,i)=>String(990001+i))),CORE=[['hygiene',['handwash','hand-wash']],['hygiene',['toothbrush','brush']],['nutrition',['groups','foodgroups','food-groups']],['nutrition',['goodjunk','good-junk']],['fitness',['jumpduck','jump-duck']],['fitness',['balance','balancehold','balance-hold']]];
const clean=v=>String(v==null?'':v).trim(),read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}},write=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch(_){}};let state=read();const urlIds=[...new Set(['studentId','sid','pid'].map(k=>clean(q.get(k))).filter(Boolean))],sid=urlIds.length===1?urlIds[0]:(!urlIds.length?clean(state?.profile?.studentId):''),form=document.getElementById('form'),button=document.getElementById('submitBtn'),status=document.getElementById('status'),back=q.get('return')||'../index.html?authority=firebase';document.getElementById('who').textContent=q.get('fullName')||state?.profile?.fullName||'ผู้เล่น';
function show(t,c=''){status.hidden=false;status.className='status'+(c?' '+c:'');status.textContent=t}function resultDone(r){return!!(r&&r.completed===true&&r.passed!==false&&r.progressionEligible!==false&&r.firebaseReceiptToken)}function gameDone(p,z,a){return a.some(id=>p?.gameCompleted?.[z]?.[id]===true)||a.some(id=>resultDone(p?.gameResults?.[id]))}function allGames(p){return CORE.every(([z,a])=>gameDone(p,z,a))}function preDone(p){return p?.pretestCompleted===true||p?.assessments?.pretest?.completed===true}function postDone(p){return p?.posttestCompleted===true||p?.assessments?.posttest?.completed===true}function expDone(p){return p?.postExperienceCompleted===true&&!!p?.postExperienceReceiptToken&&p?.postExperience?.completed===true}function prerequisites(p){return preDone(p)&&allGames(p)&&postDone(p)&&expDone(p)}
if(!sid||urlIds.length>1){show('รหัสนักเรียนไม่ถูกต้อง กรุณากลับเข้าสู่ Hero Passport ใหม่','error');button.disabled=true;throw Error('identity_invalid')}
const draftKey=`HH_REFLECTION_DRAFT_${sid}`;try{const d=JSON.parse(localStorage.getItem(draftKey)||'{}');if(d.understand)form.elements.understand.value=String(d.understand);if(d.best)form.elements.best.value=d.best;if(d.action)form.elements.action.value=d.action}catch(_){}function saveDraft(){try{const fd=new FormData(form);localStorage.setItem(draftKey,JSON.stringify({understand:Number(fd.get('understand'))||0,best:clean(fd.get('best')),action:clean(fd.get('action'))}))}catch(_){}}form.addEventListener('change',saveDraft);form.elements.action.addEventListener('input',saveDraft);
const app=getApps().length?getApps()[0]:initializeApp(HEROHEALTH_FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);async function user(){return auth.currentUser||(await signInAnonymously(auth)).user}const sandbox=SANDBOX.has(sid),pcol=sandbox?'studentProgressSandbox':'studentProgress',acol=sandbox?'studentAssessmentsSandbox':'studentAssessments',pref=doc(db,pcol,sid),aref=doc(db,acol,`${sid}_REFLECTION`);
function goBack(receipt=''){const url=new URL(back,location.href);url.searchParams.set('authority','firebase');url.searchParams.set('studentId',sid);url.searchParams.set('sid',sid);url.searchParams.delete('pid');url.searchParams.set('firebaseReady','1');url.searchParams.set('reflectionReceipt','1');if(receipt)url.searchParams.set('reflectionReceiptToken',receipt);url.searchParams.set('researchImmediateCompleted','1');url.searchParams.set('authorityRefresh',String(Date.now()));url.searchParams.set('v',RELEASE);location.replace(url.href)}
async function preflight(){try{const ps=await getDoc(pref),p=ps.exists()?ps.data():{};if(p?.reflectionCompleted===true&&p?.reflectionReceiptToken&&p?.researchImmediateCompleted===true){show('✓ Firebase มี Reflection ที่ยืนยันแล้ว กำลังกลับ Passport','ok');setTimeout(()=>goBack(p.reflectionReceiptToken),500);return false}if(!prerequisites(p)){show('ยังไม่เปิด Reflection: ต้องทำ Pre-test, เกมครบ 6 เกม, Post-test และแบบประเมินหลังเล่นให้ Firebase ยืนยันก่อน','error');button.disabled=true;return false}return true}catch(e){show('ตรวจลำดับภารกิจไม่สำเร็จ: '+String(e?.message||e),'error');button.disabled=true;return false}}
await user();await preflight();
form.onsubmit=async event=>{event.preventDefault();const fd=new FormData(form),action=clean(fd.get('action'));if(!action){show('กรุณาเขียนสิ่งที่จะนำไปทำอย่างน้อย 1 ประโยค','error');return}button.disabled=true;button.textContent='กำลังบันทึกแบบ Atomic และตรวจ Receipt…';try{const currentUser=await user();let receipt='';const reflection={understand:Number(fd.get('understand'))||0,best:clean(fd.get('best')),action,submittedAt:new Date().toISOString()};await runTransaction(db,async tx=>{const [as,ps]=await Promise.all([tx.get(aref),tx.get(pref)]),existing=as.exists()?as.data():null,p=ps.exists()?ps.data():{};if(!prerequisites(p))throw Error('firebase-reflection-prerequisite-mismatch');receipt=String(existing?.firebaseReceiptToken||'')||`${sid}:reflection:${crypto.randomUUID?.()||Date.now()}`;const record={...reflection,completed:true,instrument:'HH-REF01',instrumentVersion:'HH-REF01-v1',firebaseReceiptToken:receipt,firebaseSavedByUid:currentUser.uid,firebaseClientSavedAt:new Date().toISOString(),release:RELEASE,progressionGate:{pretest:true,sixGames:true,posttest:true,postExperience:true}};tx.set(aref,{studentId:sid,assessmentType:'reflection',mode:'reflection',completed:true,reflection:record,firebaseReceiptToken:receipt,firebaseSavedByUid:currentUser.uid,firebaseSavedAt:serverTimestamp(),firebaseBuild:HEROHEALTH_FIREBASE_BUILD,release:RELEASE},{merge:true});tx.set(pref,{studentId:sid,reflectionCompleted:true,researchImmediateCompleted:true,completed:{...(p.completed||{}),reflection:true,postExperience:true,researchImmediate:true},reflection:record,reflectionReceiptToken:receipt,researchImmediate:{completed:true,completedAtClient:new Date().toISOString(),required:['pretest','sixGames','posttest','postExperience','reflection'],release:RELEASE},updatedByUid:currentUser.uid,updatedAt:serverTimestamp(),build:HEROHEALTH_FIREBASE_BUILD,researchFlowRelease:RELEASE},{merge:true})});const [as,ps]=await Promise.all([getDoc(aref),getDoc(pref)]),p=ps.exists()?ps.data():{};if(!as.exists()||as.data()?.firebaseReceiptToken!==receipt||p?.reflectionReceiptToken!==receipt||p?.reflectionCompleted!==true||p?.postExperienceCompleted!==true||p?.researchImmediateCompleted!==true||!preDone(p)||!allGames(p)||!postDone(p))throw Error('firebase-reflection-research-gate-mismatch');state=read();state.reflection={...reflection,completed:true,firebaseReceiptToken:receipt,release:RELEASE};state.reflectionCompleted=true;state.researchImmediateCompleted=true;state.completed={...(state.completed||{}),reflection:true,postExperience:true,researchImmediate:true};write(state);localStorage.removeItem(draftKey);show('✓ Firebase ยืนยัน Reflection และ Research Gate แล้ว\nกำลังกลับ Hero Passport','ok');setTimeout(()=>goBack(receipt),750)}catch(error){show('ยังบันทึก Firebase ไม่สำเร็จ\n'+String(error?.message||error),'error');button.disabled=false;button.textContent='ลองส่งคำตอบอีกครั้ง'}};
</script></body></html>
