<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#dff7ff">
  <title>กำลังเปิดภารกิจแปรงฟัน</title>
  <style>
    html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#dff7ff;color:#17324d;font-family:system-ui,sans-serif}
    .loading{width:min(88vw,420px);padding:24px;border-radius:24px;background:#fff;text-align:center;box-shadow:0 18px 50px #0002;font-weight:900}
  </style>
</head>
<body>
  <div class="loading" id="loading">กำลังเตรียมภารกิจแปรงฟัน…</div>
  <script>
  (async()=>{
    const replaceRequired=(source,search,replacement,label)=>{
      if(!source.includes(search))throw new Error('ไม่พบจุดแก้ไข '+label);
      return source.replace(search,replacement);
    };

    try{
      const response=await fetch('./toothbrush-classroom-challenge-v26.html?v=20260729-camera-base-r1',{cache:'no-store'});
      if(!response.ok)throw new Error('โหลดเกมหลักไม่สำเร็จ HTTP '+response.status);
      let html=await response.text();

      html=replaceRequired(html,'HeroHealth • Toothbrush Challenge V26','HeroHealth • ภารกิจแปรงฟัน','document title');
      html=replaceRequired(html,'🪥 Toothbrush Challenge','🪥 ภารกิจแปรงฟัน','student heading');
      html=replaceRequired(html,'Skill Practice V26','กำจัดคราบให้ครบ 6 โซน','student subtitle');
      html=replaceRequired(
        html,
        'const VERSION="20260729-TOOTHBRUSH-MULTI-PLAQUE-V26";',
        'const VERSION="20260730-TOOTHBRUSH-MULTI-PLAQUE-V27-THAI-START-R5";',
        'analytics version'
      );
      html=replaceRequired(
        html,
        'โซนด้านข้างมี 4 จุด และโซนกลางมี 5 จุด<br>ปัดผ่านคราบให้ถูกทิศทาง แล้วเลื่อนแปรงกลับก่อนเริ่มครั้งถัดไป<br>ต้องอยู่ในแต่ละโซนรวมอย่างน้อย 0.6 วินาที',
        '<b>1.</b> ชูนิ้วชี้ให้กล้องเห็น<br><b>2.</b> เลื่อนแปรงผ่านคราบตามลูกศร<br><b>3.</b> เลื่อนแปรงกลับก่อนปัดครั้งถัดไป',
        'student instructions'
      );
      html=replaceRequired(html,'เริ่ม Challenge','เริ่มภารกิจ','student start button');

      const oldPlaqueCss='.plaque{position:absolute;width:34px;height:34px;margin:-17px;display:grid;place-items:center;border:2px solid #ffffffd9;border-radius:13px;background:#ffffffea;box-shadow:0 4px 12px #0002;font-size:22px;transition:opacity .18s,transform .18s,filter .18s;will-change:transform,opacity}\n    .plaque.clean{opacity:.30;transform:scale(.58);filter:saturate(.45)}';
      const newPlaqueCss='.plaque{position:absolute;width:32px;height:32px;margin:-16px;display:grid;place-items:center;border:2px solid #ffffffd9;border-radius:13px;box-shadow:0 4px 12px #0002;font-size:20px;transition:opacity .18s,transform .18s,filter .18s;will-change:transform,opacity}\n    .plaque-green-germ{background:#f0fdf4ea;border-color:#86efac}\n    .plaque-yellow-plaque{background:#fefce8ea;border-color:#fde047}\n    .plaque-germ-cluster{background:#ecfeffea;border-color:#67e8f9}\n    .plaque-sticky-plaque{background:#fff7edea;border-color:#fdba74}\n    .plaque.clean{opacity:.30;transform:scale(.58);filter:saturate(.45)}\n    #start .card>p:first-of-type{margin:8px 0 14px;color:#0f766e;font-size:clamp(18px,5vw,24px)}\n    #start .card>p:nth-of-type(2){margin:16px 0 4px;text-align:left;font-size:clamp(16px,4.4vw,21px);line-height:1.75}\n    #back:disabled{opacity:.72;cursor:wait}';
      html=replaceRequired(html,oldPlaqueCss,newPlaqueCss,'plaque and start styles');

      const oldLayouts="const TARGET_LAYOUTS={\n  4:[{x:22,y:28},{x:76,y:31},{x:31,y:72},{x:72,y:70}],\n  5:[{x:16,y:31},{x:50,y:23},{x:84,y:32},{x:29,y:73},{x:71,y:72}]\n};";
      const newLayouts="const TARGET_LAYOUTS={\n  4:[{x:16,y:18},{x:82,y:18},{x:18,y:82},{x:82,y:82}],\n  5:[{x:10,y:18},{x:50,y:18},{x:90,y:18},{x:27,y:82},{x:73,y:82}]\n};\nconst PLAQUE_VARIANTS=[\n  {key:'green-germ',icon:'🦠',label:'แบคทีเรียสีเขียว'},\n  {key:'yellow-plaque',icon:'🟡',label:'คราบพลัคสีเหลือง'},\n  {key:'germ-cluster',icon:'🧫',label:'กลุ่มแบคทีเรีย'},\n  {key:'sticky-plaque',icon:'🟠',label:'คราบพลัคเหนียว'}\n];\nconst PLAQUE_VARIANT_OFFSET={tl:0,tm:1,tr:2,bl:3,bm:0,br:1};";
      html=replaceRequired(html,oldLayouts,newLayouts,'target layouts and variants');

      const oldMakeZoneRow="function makeZoneRow(z){return{dwell:0,strokes:0,complete:false,targets:TARGET_LAYOUTS[z.targetCount].map((p,i)=>({id:`${z.id}-${i+1}`,x:p.x,y:p.y,clean:false}))}}";
      const newMakeZoneRow="function makeZoneRow(z){const offset=PLAQUE_VARIANT_OFFSET[z.id]||0;return{dwell:0,strokes:0,complete:false,targets:TARGET_LAYOUTS[z.targetCount].map((p,i)=>{const variant=PLAQUE_VARIANTS[(offset+i)%PLAQUE_VARIANTS.length];return{id:`${z.id}-${i+1}`,x:p.x,y:p.y,clean:false,variantKey:variant.key,variantIcon:variant.icon,variantLabel:variant.label}})}}";
      html=replaceRequired(html,oldMakeZoneRow,newMakeZoneRow,'zone target creation');

      const oldRender="function renderPlaques(z,row){\n  D.plaques.replaceChildren();\n  for(const target of row.targets){\n    const e=document.createElement('span');\n    e.className='plaque'+(target.clean?' clean':'');\n    e.textContent=target.clean?'✨':'🦠';\n    e.style.left=(z.x1+(z.x2-z.x1)*target.x/100)+'%';\n    e.style.top=(z.y1+(z.y2-z.y1)*target.y/100)+'%';\n    e.dataset.targetId=target.id;\n    D.plaques.appendChild(e);\n  }\n}";
      const newRender="function renderPlaques(z,row){\n  D.plaques.replaceChildren();\n  for(const target of row.targets){\n    const e=document.createElement('span');\n    e.className='plaque plaque-'+(target.variantKey||'green-germ')+(target.clean?' clean':'');\n    e.textContent=target.clean?'✨':(target.variantIcon||'🦠');\n    e.style.left=(z.x1+(z.x2-z.x1)*target.x/100)+'%';\n    e.style.top=(z.y1+(z.y2-z.y1)*target.y/100)+'%';\n    e.dataset.targetId=target.id;\n    e.dataset.variant=target.variantKey||'green-germ';\n    e.setAttribute('aria-label',target.variantLabel||'คราบพลัค');\n    D.plaques.appendChild(e);\n  }\n}";
      html=replaceRequired(html,oldRender,newRender,'plaque rendering');

      html=replaceRequired(
        html,
        '<section id="result" class="screen"><div class="card"><h1>จบภารกิจ ✨</h1><p id="resultText"></p><div id="badge" class="badge"></div><div class="sum"><div>Coverage<b id="resultCoverage">0/6</b></div><div>Direction<b id="resultDirection">0%</b></div><div>Tracking<b id="resultTracking">0%</b></div><div>Plaque<b id="resultStrokes">0/26</b></div></div><button id="back" class="btn">กลับ Passport</button><button id="again" class="btn alt">ฝึกเพิ่ม</button></div></section>',
        '<section id="result" class="screen"><div class="card"><h1>จบภารกิจ ✨</h1><p id="resultText"></p><div id="badge" class="badge"></div><div class="sum"><div>โซนที่ทำครบ<b id="resultCoverage">0/6</b></div><div>ทิศทางถูกต้อง<b id="resultDirection">0%</b></div><div>การตรวจจับ<b id="resultTracking">0%</b></div><div>กำจัดคราบ<b id="resultStrokes">0/26</b></div></div><button id="back" class="btn">← กลับ Passport</button><p style="margin:12px 0 0;color:#64748b;font-size:12px">ระบบจะนำผลไปอัปเดตใน Passport และภารกิจถัดไป</p></div></section>',
        'student result actions'
      );

      html=replaceRequired(
        html,
        "motionProfile:'multi-plaque-spatial-coverage-v26',markerBrushSameCoordinate:true",
        "motionProfile:'multi-plaque-spatial-coverage-v27-thai-start-r5',plaqueVariantPolicy:'four-balanced-visuals-equal-hitbox',plaqueVariantCount:PLAQUE_VARIANTS.length,returnContract:'jumpduck-compatible-passport-return-v1',studentRetryVisible:false,studentResultLanguage:'thai-child-friendly-r2',studentStartLanguage:'thai-grade5-three-step-r1',visibleTechnicalVersion:false,coverageLabelPolicy:'neutral-completed-zone-count',markerBrushSameCoordinate:true",
        'analytics interface contract'
      );

      html=replaceRequired(
        html,
        "$('resultText').textContent=p.skillMet?'จบภารกิจและทักษะถึงเกณฑ์':'จบภารกิจแล้ว บันทึกผลเพื่อฝึกต่อ';",
        "$('resultText').textContent=p.skillMet?'จบภารกิจแล้ว และทักษะถึงเกณฑ์':'จบภารกิจแล้ว ระบบบันทึกผลเรียบร้อย';",
        'student completion text'
      );

      html=replaceRequired(
        html,
        "$('badge').textContent=p.skillMet?'Skill Met • กำจัดคราบครบ 26 จุด':'Mission Completed • ไม่บังคับ Retry';",
        "$('badge').textContent=p.skillMet?'ทักษะถึงเกณฑ์ • กำจัดคราบครบ 26 จุด':'จบภารกิจแล้ว • ไม่ต้องเล่นซ้ำ';",
        'student badge text'
      );

      html=replaceRequired(
        html,
        "function passport(){const u=new URL('./index.html',location.href);for(const k of ['studentId','pid','fullName','studentName','name','section','group']){const v=query.get(k);if(v)u.searchParams.set(k,v)}u.searchParams.set('returnedGame','toothbrush');u.searchParams.set('gameCompleted','1');u.searchParams.set('v',VERSION);location.href=u}",
        "function passport(){const btn=$('back');if(btn){btn.disabled=true;btn.textContent='กำลังกลับ Passport…'}try{window.HH_releaseCamera?.()}catch(_){}if(window.parent!==window){try{const returnBtn=parent.document.getElementById('returnBtn');const leaveBtn=parent.document.getElementById('leaveBtn');const backBtn=parent.document.getElementById('back');if(returnBtn&&!returnBtn.disabled){returnBtn.click();return}if(leaveBtn&&!leaveBtn.disabled){leaveBtn.click();return}if(backBtn){backBtn.click();return}}catch(_){}}const target=query.get('return')||query.get('back')||'./index.html';const u=new URL(target,location.href);for(const k of ['studentId','sid','pid','fullName','studentName','name','section','group']){const v=query.get(k);if(v)u.searchParams.set(k,v)}const sid=query.get('studentId')||query.get('sid')||query.get('pid');if(sid){u.searchParams.set('studentId',sid);u.searchParams.set('sid',sid)}u.searchParams.set('returnedGame','toothbrush');u.searchParams.set('gameCompleted','1');u.searchParams.set('fromGame','toothbrush');u.searchParams.set('authorityRefresh',String(Date.now()));u.searchParams.set('v',VERSION);location.href=u.href}",
        'passport return function'
      );

      html=replaceRequired(
        html,
        "$('go').onclick=start;$('again').onclick=reset;$('back').onclick=passport;$('pause').onclick=()=>",
        "$('go').onclick=start;$('back').onclick=passport;$('pause').onclick=()=>",
        'student result bindings'
      );

      const moduleOpen='<scr'+'ipt type="module">';
      const guard='<scr'+'ipt src="./assets/camera-start-guard-v1.js?v=20260729-camera-r1"></scr'+'ipt>';
      if(!html.includes(moduleOpen))throw new Error('ไม่พบจุดเริ่มระบบเกม');
      html=html.replace(moduleOpen,guard+moduleOpen);

      document.open('text/html','replace');
      document.write(html);
      document.close();
    }catch(error){
      const box=document.getElementById('loading');
      if(box)box.textContent='เปิดเกมไม่สำเร็จ: '+(error?.message||error);
    }
  })();
  </script>
</body>
</html>
