function installHandAssist(w){if(kind!=='handwash'||!w||w.__HH_HAND_ASSIST_INSTALLED__)return;const patch=()=>{const Hands=w.Hands;if(!Hands||!Hands.prototype)return false;const p=Hands.prototype;if(p.__hhAssistPatched)return true;p.__hhAssistPatched=true;const originalSet=p.setOptions;p.setOptions=function(options){const next={...(options||{}),modelComplexity:0,minDetectionConfidence:.42,minTrackingConfidence:.38,maxNumHands:2};return originalSet.call(this,next)};const originalOn=p.onResults;p.onResults=function(callback){let lastTwo=null,lastTwoAt=0,oneSince=0;const clonePoints=(points,dx)=>Array.isArray(points)?points.map(pt=>({...pt,x:Math.max(0.02,Math.min(.98,Number(pt.x||0)+dx))})):points;const wrap=result=>{try{const now=w.performance.now();let landmarks=(result?.multiHandLandmarks||[]).slice();let world=(result?.multiHandWorldLandmarks||[]).slice();let handed=(result?.multiHandedness||[]).slice();if(landmarks.length>=2){lastTwo={landmarks:landmarks.slice(0,2),world:world.slice(0,2),handed:handed.slice(0,2)};lastTwoAt=now;oneSince=0}else if(landmarks.length===1){if(!oneSince)oneSince=now;if(lastTwo&&now-lastTwoAt<1600){landmarks=lastTwo.landmarks;world=lastTwo.world;handed=lastTwo.handed}else if(now-oneSince>900){const first=landmarks[0],dx=(first?.[9]?.x||.5)>.5?-.085:.085;landmarks=[first,clonePoints(first,dx)];world=[world[0]||first,clonePoints(world[0]||first,dx)];handed=[handed[0]||{label:'Left',score:.7},{label:String(handed[0]?.label||'Left').toLowerCase().includes('left')?'Right':'Left',score:.62}];w.__HH_HAND_ASSIST_USED__=true}}else if(lastTwo&&now-lastTwoAt<1300){landmarks=lastTwo.landmarks;world=lastTwo.world;handed=lastTwo.handed}callback({...result,multiHandLandmarks:landmarks,multiHandWorldLandmarks:world,multiHandedness:handed})}catch(_){callback(result)}};return originalOn.call(this,wrap)};w.__HH_HAND_ASSIST_INSTALLED__=true;return true};if(patch())return;let tries=0;const timer=w.setInterval(()=>{tries++;if(patch()||tries>80)w.clearInterval function fill(d){const set=(ids,v)=>ids.forEach(id=>{const e=d.getElementById(id);if(e&&v){e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))}});set(['studentId','studentIdInput','pid'],sid);set(['section','sectionInput','classSection'],q.get('section')||'');set(['classInput','classId'],q.get('group')||q.get('section')||'');set(['nameInput','playerName','studentName'],q.get('fullName')||q.get('name')||q.get('studentName')||'Hero');let s=d.getElementById('hh-wrapper-style');if(!s){s=d.createElement('style');s.id='hh-wrapper-style';if(kind==='handwash')s.textContent=`

function realPass(raw){if(kind==='toothbrush'){const learning=String(raw.play_mode||'').toLowerCase()==='learning';return learning?yes(raw.learning_complete)&&yes(raw.challenge_passed):yes(raw.challenge_passed)}if(Object.prototype.hasOwnProperty.call(raw,'passed'))return yes(raw.passed);if(Object.prototype.hasOwnProperty.call(raw,'completed'))return yes(raw.completed);return false}
function finishCheck(){if(sent)return;try{const w=f.contentWindow,d=f.contentDocument;if(!d)return;fill(d);const text=String(d.body?.innerText||'');const done=[d.getElementById('resultOverlay'),d.getElementById('resultScreen'),d.getElementById('summaryScreen'),d.getElementById('result'),d.getElementById('summary'),d.getElementById('endOverlay'),d.getElementById('finalModal')].some(e=>visible(e,w))||/(จบภารกิจ|สรุปผล|Healthy Hero|ภารกิจสำเร็จ|Mission Complete|ผลการเล่น|คะแนนรวม)/i.test(text);if(!done)return;const raw=stored(w);const ids=['scoreText','summaryScore','sumScore','finalScore','score','hudScore','resultScore'];let score=num(raw.score??raw.totalScore);for(const id of ids)score=Math.max(score,num(d.getElementById(id)?.textContent));let accuracy=num(raw.accuracy??raw.direction_accuracy??raw.correctRate);for(const id of ['accuracyText','summaryAccuracy','sumAccuracy','finalAcc','accuracy','resultAccuracy'])accuracy=Math.max(accuracy,num(d.getElementById(id)?.textContent));const explicitFail=/(ยังไม่ผ่าน|หมดเวลา|time\s*up|ต้องลองใหม่|เล่นใหม่)/i.test(text);const passed=kind==='handwash'?(done&&!explicitFail):realPass(raw);const payload={...raw,completed:passed,passed,score,accuracy,assistUsed:raw.assistUsed===true||w.__HH_HAND_ASSIST_USED__===true,completionPolicy:kind==='handwash'?'single-round-summary':'game-result',eventId:raw.eventId||raw.record_id||`HH-game-${zone}-${kind}-${sid}-${Date.now()}`,inputMode:raw.inputMode||raw.mode||'classroom-ar',gameVersion:raw.gameVersion||`${kind}-classroom-wrapper-v5-single-round`,autoSubmit:true};sent=true;status.textContent=passed?'ผ่านแล้ว • กำลังส่งผล':'ยังไม่ผ่าน • กรุณาเล่นใหม่';status.className=passed?'status ok':'status err';parent.postMessage({type:'HEROHEALTH_GAME_COMPLETE',payload},location.origin);if(passed)setTimeout(()=>{try{parent.document.getElementById('returnBtn')?.click()}catch(_){}},1300)}catch(e){status.textContent='กำลังรอผลเกม'}}
