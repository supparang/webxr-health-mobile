<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071827"><title>HeroHealth Classroom Game</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071827;font-family:system-ui,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.status{position:fixed;z-index:20;left:50%;bottom:12px;transform:translateX(-50%);max-width:92vw;padding:8px 13px;border-radius:999px;background:#0f172dcc;color:#fff;font-size:12px;font-weight:900;pointer-events:none}.status.ok{background:#065f46dd}.status.err{background:#991b1bdd}</style></head><body><iframe id="game" allow="camera;microphone;fullscreen;autoplay"></iframe><div id="status" class="status">กำลังเตรียมเกม Classroom…</div><script>
(()=>{'use strict';
const q=new URLSearchParams(location.search),kind=q.get('wrappedGame')||q.get('gameId')||'',sid=q.get('studentId')||q.get('pid')||'';
const targets={
 handwash:'../herohealth/hygiene-zone/handwash-realistic-v3.html',
 toothbrush:'../herohealth/hygiene-zone/toothbrush-ar.html?mode=learning&diff=easy&time=90&classroom=1',
 groups:'../herohealth/groups-ar-gate.html?phase=warmup&next=./groups-ar.html',
 goodjunk:'../herohealth/goodjunk-ar-classroom-v12.html?classroom=1&mode=solo&time=60'
};
const zones={handwash:'hygiene',toothbrush:'hygiene',groups:'nutrition',goodjunk:'nutrition'};
const target=targets[kind],zone=zones[kind]||q.get('zone')||'',f=document.getElementById('game'),status=document.getElementById('status');let sent=false,started=false;
if(!target){status.textContent='ไม่พบเกมที่ต้องเปิด';status.className='status err';return}
const u=new URL(target,location.href);for(const [k,v] of q.entries())if(!['target','return','wrappedGame'].includes(k))u.searchParams.set(k,v);u.searchParams.set('classroom','1');u.searchParams.set('studentId',sid);u.searchParams.set('pid',sid);u.searchParams.set('gameId',kind);u.searchParams.set('zone',zone);f.src=u.href;
const num=v=>{const n=Number(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0};
function postStart(){if(started)return;started=true;status.textContent='กำลังเล่น';try{parent.postMessage({type:'HEROHEALTH_GAME_STARTED'},location.origin)}catch(_){}}
function visible(el,w){if(!el)return false;const cs=w.getComputedStyle(el),r=el.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&Number(cs.opacity||1)>0&&r.width>0&&r.height>0}
function stored(w){const keys=['HHA_HANDWASH_LAST_RESULT','toothbrush_pending_result','HHA_TOOTHBRUSH_LAST_RESULT','HHA_GROUPS_AR_LAST_RESULT','groups_ar_last_result','HHA_GOODJUNK_AR_LAST_RESULT','GOODJUNK_AR_LAST_RESULT','goodjunk_pending_result'];for(const k of keys){try{const v=JSON.parse(w.localStorage.getItem(k)||'null');if(v)return v}catch(_){}}return w.__HANDWASH_LAST_RESULT__||w.__TOOTHBRUSH_LAST_RESULT__||w.__GROUPS_LAST_RESULT__||w.__GOODJUNK_LAST_RESULT__||{}}
function fill(d){const set=(ids,v)=>ids.forEach(id=>{const e=d.getElementById(id);if(e&&v){e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))}});set(['studentId','studentIdInput','pid'],sid);set(['section','sectionInput','classSection'],q.get('section')||'');set(['classInput','classId'],q.get('group')||q.get('section')||'');set(['nameInput','playerName','studentName'],q.get('fullName')||q.get('name')||q.get('studentName')||'Hero');let s=d.getElementById('hh-wrapper-style');if(!s){s=d.createElement('style');s.id='hh-wrapper-style';if(kind==='handwash')s.textContent='#startOverlay .form,#backBtn{display:none!important}';else if(kind==='toothbrush')s.textContent='#homeBtn,.field{display:none!important}';else s.textContent='#back,.back,#homeBtn,[data-action="home"]{display:none!important}';d.head.appendChild(s)}}
function finishCheck(){if(sent)return;try{const w=f.contentWindow,d=f.contentDocument;if(!d)return;fill(d);const text=String(d.body?.innerText||'');const done=[d.getElementById('resultOverlay'),d.getElementById('resultScreen'),d.getElementById('summaryScreen'),d.getElementById('result'),d.getElementById('summary'),d.getElementById('endOverlay'),d.getElementById('finalModal')].some(e=>visible(e,w))||/(จบภารกิจ|สรุปผล|Healthy Hero|ภารกิจสำเร็จ|Mission Complete|ผลการเล่น|คะแนนรวม)/i.test(text);if(!done)return;const raw=stored(w);const ids=['scoreText','summaryScore','sumScore','finalScore','score','hudScore','resultScore'];let score=num(raw.score??raw.totalScore);for(const id of ids)score=Math.max(score,num(d.getElementById(id)?.textContent));let accuracy=num(raw.accuracy??raw.direction_accuracy??raw.correctRate);for(const id of ['accuracyText','summaryAccuracy','sumAccuracy','finalAcc','accuracy','resultAccuracy'])accuracy=Math.max(accuracy,num(d.getElementById(id)?.textContent));const payload={...raw,completed:true,passed:raw.passed!==false,score,accuracy,eventId:raw.eventId||raw.record_id||`HH-game-${zone}-${kind}-${sid}-${Date.now()}`,inputMode:raw.inputMode||raw.mode||'classroom-ar',gameVersion:raw.gameVersion||`${kind}-classroom-wrapper-v2`,autoSubmit:true};sent=true;status.textContent='จบเกมแล้ว • กำลังส่งผล';status.className='status ok';parent.postMessage({type:'HEROHEALTH_GAME_COMPLETE',payload},location.origin);setTimeout(()=>{try{parent.document.getElementById('returnBtn')?.click()}catch(_){}},2300)}catch(e){status.textContent='กำลังรอผลเกม'}}
f.addEventListener('load',()=>{status.textContent='พร้อมเริ่มเกม';try{const d=f.contentDocument;fill(d);d.addEventListener('click',e=>{if(/เริ่ม|start|เปิดกล้อง|calibration|ไปต่อ/i.test(String(e.target?.textContent||'')))postStart()},{capture:true});new MutationObserver(finishCheck).observe(d.documentElement,{subtree:true,childList:true,characterData:true,attributes:true})}catch(_){}});setInterval(finishCheck,800);
})();
</script></body></html>
