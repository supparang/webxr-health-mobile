<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071827"><title>HeroHealth Classroom Game</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071827;font-family:system-ui,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.status{position:fixed;z-index:20;left:50%;bottom:12px;transform:translateX(-50%);max-width:92vw;padding:8px 13px;border-radius:999px;background:#0f172dcc;color:#fff;font-size:12px;font-weight:900;pointer-events:none}.status.ok{background:#065f46dd}.status.err{background:#991b1bdd}</style></head><body><iframe id="game" allow="camera;microphone;fullscreen;autoplay"></iframe><div id="status" class="status">กำลังเตรียมเกม Classroom…</div><script>
(()=>{'use strict';
const q=new URLSearchParams(location.search),kind=q.get('wrappedGame')||q.get('gameId')||'',sid=q.get('studentId')||'';
const targets={handwash:'../herohealth/hygiene-zone/handwash-realistic-v3.html',toothbrush:'../herohealth/hygiene-zone/toothbrush-ar.html?mode=learning&diff=easy&time=90&classroom=1'};
const target=targets[kind],f=document.getElementById('game'),status=document.getElementById('status');let sent=false,started=false;
if(!target){status.textContent='ไม่พบเกมที่ต้องเปิด';status.className='status err';return}
const u=new URL(target,location.href);for(const [k,v] of q.entries())if(!['target','return','wrappedGame'].includes(k))u.searchParams.set(k,v);u.searchParams.set('classroom','1');f.src=u.href;
const num=v=>{const n=Number(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0};
function postStart(){if(started)return;started=true;status.textContent='กำลังเล่น';try{parent.postMessage({type:'HEROHEALTH_GAME_STARTED'},location.origin)}catch(_){}}
function visible(el,w){if(!el)return false;const cs=w.getComputedStyle(el),r=el.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>0&&r.height>0}
function stored(w){for(const k of ['HHA_HANDWASH_LAST_RESULT','toothbrush_pending_result','HHA_TOOTHBRUSH_LAST_RESULT']){try{const v=JSON.parse(w.localStorage.getItem(k)||'null');if(v)return v}catch(_){}}return w.__HANDWASH_LAST_RESULT__||w.__TOOTHBRUSH_LAST_RESULT__||{}}
function fill(d){const set=(ids,v)=>ids.forEach(id=>{const e=d.getElementById(id);if(e&&v){e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))}});set(['studentId','studentIdInput'],sid);set(['section','sectionInput'],q.get('section')||'');set(['classInput','classId'],q.get('group')||q.get('section')||'');set(['nameInput','playerName'],q.get('fullName')||q.get('name')||'Hero');let s=d.getElementById('hh-wrapper-style');if(!s){s=d.createElement('style');s.id='hh-wrapper-style';s.textContent=kind==='handwash'?'#startOverlay .form,#backBtn{display:none!important}':'#homeBtn,.field{display:none!important}';d.head.appendChild(s)}}
function finishCheck(){if(sent)return;try{const w=f.contentWindow,d=f.contentDocument;if(!d)return;fill(d);const text=String(d.body?.innerText||'');const done=[d.getElementById('resultOverlay'),d.getElementById('resultScreen'),d.getElementById('summaryScreen'),d.getElementById('result'),d.getElementById('summary')].some(e=>visible(e,w))||/(จบภารกิจ|สรุปผล|Healthy Hero|ภารกิจสำเร็จ)/i.test(text);if(!done)return;const raw=stored(w);const ids=['scoreText','summaryScore','sumScore','finalScore','score'];let score=num(raw.score);for(const id of ids)score=Math.max(score,num(d.getElementById(id)?.textContent));let accuracy=num(raw.accuracy??raw.direction_accuracy);for(const id of ['accuracyText','summaryAccuracy','sumAccuracy','finalAcc','accuracy'])accuracy=Math.max(accuracy,num(d.getElementById(id)?.textContent));const payload={...raw,completed:true,passed:raw.passed!==false,score,accuracy,eventId:raw.eventId||raw.record_id||`HH-game-hygiene-${kind}-${sid}-${Date.now()}`,inputMode:raw.inputMode||'classroom-ar',gameVersion:raw.gameVersion||`${kind}-classroom-wrapper-v1`,autoSubmit:true};sent=true;status.textContent='จบเกมแล้ว • กำลังส่งผล';status.className='status ok';parent.postMessage({type:'HEROHEALTH_GAME_COMPLETE',payload},location.origin);setTimeout(()=>{try{parent.document.getElementById('returnBtn')?.click()}catch(_){}},2300)}catch(e){status.textContent='กำลังรอผลเกม';}}
f.addEventListener('load',()=>{status.textContent='พร้อมเริ่มเกม';try{const d=f.contentDocument;fill(d);d.addEventListener('click',e=>{if(/เริ่ม|start|เปิดกล้อง|calibration/i.test(String(e.target?.textContent||'')))postStart()},{capture:true});new MutationObserver(finishCheck).observe(d.documentElement,{subtree:true,childList:true,characterData:true,attributes:true})}catch(_){}});setInterval(finishCheck,800);
})();
</script></body></html>
