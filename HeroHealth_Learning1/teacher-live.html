<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HeroHealth Teacher Console</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#17332f;background:#f3faf8;--brand:#0f766e;--line:#d8e9e5;--muted:#617873;--ok:#166534;--warn:#92400e;--danger:#991b1b}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:900;font-size:20px}.status{font-size:13px;color:var(--muted)}.wrap{width:min(1480px,100%);margin:auto;padding:18px}.toolbar,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.toolbar{padding:14px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.toolbar input,.toolbar select,.toolbar button{min-height:44px;border:1px solid #cfe3df;border-radius:12px;padding:10px;font:inherit}.toolbar button,.action{background:var(--brand);color:#fff;font-weight:800;border:0;cursor:pointer;border-radius:12px;padding:10px 14px}.action.secondary{background:#e9f7f3;color:var(--brand)}.action.warnbtn{background:#f59e0b}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.sum{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center}.sum b{display:block;font-size:25px;color:var(--brand)}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}.group{padding:16px;cursor:pointer}.group.active{outline:3px solid #14b8a6}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:#eef8f5;border-radius:12px;padding:9px;text-align:center}.kpi b{display:block;font-size:20px}.scroll{overflow:auto;max-height:62vh}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{padding:11px;border-top:1px solid #e4efec;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f8fcfb}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9f7f3;font-size:12px;font-weight:800}.online,.done{background:#dcfce7;color:var(--ok)}.offline{background:#f1f5f9;color:#64748b}.warn{background:#fef3c7;color:var(--warn)}.stalled,.fail{background:#fee2e2;color:var(--danger)}.namebtn{border:0;background:none;color:var(--brand);font:inherit;font-weight:900;cursor:pointer}.empty{padding:40px;text-align:center}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:99}.modal.open{display:flex}.dialog{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:20px}.close{float:right;border:0;background:#edf2f7;border-radius:10px;padding:8px 12px;font-weight:900;cursor:pointer}.detailGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.detail{background:#eef8f5;border-radius:14px;padding:12px}.detail b{display:block;font-size:18px;margin-top:4px}.sectionTitle{margin:22px 0 10px}.assessmentGrid,.zoneGrid,.evidenceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.panel{border:1px solid var(--line);border-radius:16px;padding:14px}.gameRow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #e8f0ee}.gameRow:first-child{border-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.alert{border-radius:14px;padding:12px 14px;margin:8px 0}.alert.ok{background:#dcfce7;color:#166534}.alert.warn{background:#fef3c7;color:#92400e}.alert.fail{background:#fee2e2;color:#991b1b}.danger{color:var(--danger)}@media(max-width:920px){.toolbar{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:repeat(3,1fr)}.detailGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:10px}.toolbar{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.groups{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.assessmentGrid,.zoneGrid,.evidenceGrid{grid-template-columns:1fr}.detailGrid{grid-template-columns:1fr 1fr}.dialog{padding:15px}.top{padding:11px 12px}.gameRow{grid-template-columns:1fr auto}}
</style></head><body>
<script src="./assets/teacher-page-guard.js?v=20260730-teacher-ops-v3"></script>
<header class="top"><div><div class="brand">💚 HeroHealth Teacher Console</div><div class="status" id="status">กำลังเชื่อมต่อ Google Sheet...</div></div><a href="./index.html">← กลับ Platform</a></header>
<main class="wrap"><section class="toolbar"><select id="section"><option value="">ทุกห้อง</option></select><select id="group"><option value="">ทุกกลุ่ม</option></select><select id="state"><option value="">ทุกสถานะ</option><option value="online">ออนไลน์</option><option value="offline">ออฟไลน์</option><option value="stalled">ค้างเกิน 5 นาที</option><option value="complete">ทำครบแล้ว</option><option value="incomplete">ยังไม่ครบ</option></select><input id="q" placeholder="ค้นหารหัสหรือชื่อ"><button id="refresh">รีเฟรชทันที</button><button id="auto">Auto refresh: ON</button></section><section class="summary" id="summary"></section><section class="groups" id="groups"></section><section class="card"><div style="padding:14px"><b id="title">รายชื่อนักเรียนทั้งหมด</b><div class="status" id="count"></div></div><div class="scroll"><table><thead><tr><th>กลุ่ม</th><th>รหัส</th><th>ชื่อ</th><th>ห้อง</th><th>ขั้นปัจจุบัน</th><th>สถานะ</th><th>ความคืบหน้า</th><th>ออนไลน์</th><th>อัปเดตล่าสุด</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>ยังไม่มีข้อมูลนักเรียน</div></div></section></main>
<div class="modal" id="modal"><div class="dialog"><button class="close" id="close">ปิด</button><h2 id="dname">รายละเอียดนักเรียน</h2><div id="detail">กำลังโหลด...</div></div></div>
<script src="./data/backend-config.js?v=20260730-teacher-ops-v3"></script>
<script>(()=>{'use strict';
const endpoint=window.HH_CONFIG?.backend?.webAppUrl||'', $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), yes=v=>v===true||String(v).toUpperCase()==='TRUE', ageMin=x=>x?.lastSeen?(Date.now()-new Date(x.lastSeen).getTime())/60000:999, fmt=v=>v?new Date(v).toLocaleString('th-TH'):'-';
let data={students:[]},auto=true,activeGroup='',activeStudent='';
function call(action,params,cb){const name='HH_'+action+'_'+Date.now()+'_'+Math.random().toString(36).slice(2);window[name]=x=>{delete window[name];document.getElementById(name)?.remove();cb(x)};const s=document.createElement('script');s.id=name;s.onerror=()=>cb({ok:false,error:'network'});s.src=endpoint+'?action='+action+'&callback='+name+'&_='+Date.now()+Object.entries(params||{}).map(([k,v])=>'&'+k+'='+encodeURIComponent(v)).join('');document.body.appendChild(s)}
const complete=x=>yes(x?.missionComplete);
function load(){if(!endpoint){$('status').innerHTML='<span class="danger">ยังไม่ได้ตั้งค่า Backend URL</span>';return}call('live',{},x=>{if(!x?.ok){$('status').innerHTML='<span class="danger">เชื่อมต่อ Backend ไม่สำเร็จ</span>';return}data=x;filters();render();$('status').textContent='Google Sheet authority • อัปเดต '+fmt(x.generatedAt)+' • นักเรียน '+(x.students||[]).length+' คน'})}
function filters(){const s=data.students||[],ss=[...new Set(s.map(x=>String(x.section||'')).filter(Boolean))].sort(),gg=[...new Set(s.map(x=>String(x.group||'')).filter(Boolean))].sort(),ks=$('section').value,kg=$('group').value;$('section').innerHTML='<option value="">ทุกห้อง</option>'+ss.map(x=>`<option value="${esc(x)}" ${x===ks?'selected':''}>${esc(x)}</option>`).join('');$('group').innerHTML='<option value="">ทุกกลุ่ม</option>'+gg.map(x=>`<option value="${esc(x)}" ${x===kg?'selected':''}>${esc(x)}</option>`).join('')}
function list(){const sec=$('section').value,g=$('group').value||activeGroup,st=$('state').value,q=$('q').value.toLowerCase();return(data.students||[]).filter(x=>(!sec||String(x.section)===sec)&&(!g||String(x.group)===g)&&(!q||(String(x.studentId)+' '+String(x.fullName)).toLowerCase().includes(q))&&(!st||(st==='online'&&yes(x.online))||(st==='offline'&&!yes(x.online))||(st==='stalled'&&!complete(x)&&ageMin(x)>5)||(st==='complete'&&complete(x))||(st==='incomplete'&&!complete(x))))}
function summary(){const s=data.students||[],online=s.filter(x=>yes(x.online)).length,completeN=s.filter(complete).length,stalled=s.filter(x=>!complete(x)&&ageMin(x)>5).length,pre=s.filter(x=>String(x.currentStep||'')!=='pretest').length,post=s.filter(x=>['reflection','certificate'].includes(String(x.currentStep||''))).length;$('summary').innerHTML=[['นักเรียนทั้งหมด',s.length],['ออนไลน์',online],['ผ่าน Pre-test',pre],['ถึง Post-test',post],['จบครบ',completeN],['ค้าง >5 นาที',stalled]].map(([a,b])=>`<div class="sum">${a}<b>${b}</b></div>`).join('')}
function groupCards(){const by={};(data.students||[]).forEach(s=>{const g=String(s.group||'-');if(!by[g])by[g]={group:g,total:0,online:0,complete:0,stalled:0};const a=by[g];a.total++;if(yes(s.online))a.online++;if(complete(s))a.complete++;if(!complete(s)&&ageMin(s)>5)a.stalled++});$('groups').innerHTML=Object.values(by).sort((a,b)=>a.group.localeCompare(b.group)).map(x=>`<article class="card group ${activeGroup===x.group?'active':''}" data-g="${esc(x.group)}"><h3>กลุ่ม ${esc(x.group)}</h3><div class="kpis"><div class="kpi">ทั้งหมด<b>${x.total}</b></div><div class="kpi">ออนไลน์<b>${x.online}</b></div><div class="kpi">ครบแล้ว<b>${x.complete}</b></div><div class="kpi">ค้าง<b>${x.stalled}</b></div></div></article>`).join('');$('groups').querySelectorAll('[data-g]').forEach(e=>e.onclick=()=>{activeGroup=activeGroup===e.dataset.g?'':e.dataset.g;$('group').value=activeGroup;render()})}
function rows(){const a=list();$('title').textContent=(activeGroup||$('group').value)?'รายชื่อกลุ่ม '+(activeGroup||$('group').value):'รายชื่อนักเรียนทั้งหมด';$('count').textContent='แสดง '+a.length+' คน';$('empty').hidden=!!a.length;$('rows').innerHTML=a.sort((x,y)=>String(x.group).localeCompare(String(y.group))||String(x.studentId).localeCompare(String(y.studentId))).map(x=>{const stalled=!complete(x)&&ageMin(x)>5;return`<tr><td><b>${esc(x.group||'-')}</b></td><td>${esc(x.studentId)}</td><td><button class="namebtn" data-sid="${esc(x.studentId)}">${esc(x.fullName||'-')}</button></td><td>${esc(x.section||'-')}</td><td>${esc(x.currentStep||'-')}</td><td><span class="badge ${complete(x)?'done':stalled?'stalled':''}">${stalled?'ค้างเกิน 5 นาที':esc(x.status||'-')}</span></td><td>${Number(x.progressPct)||0}% (${Number(x.completedCount)||0}/9)</td><td><span class="badge ${yes(x.online)?'online':'offline'}">${yes(x.online)?'ออนไลน์':'ออฟไลน์'}</span></td><td>${esc(fmt(x.lastSeen))}</td></tr>`}).join('');document.querySelectorAll('[data-sid]').forEach(b=>b.onclick=()=>detail(b.dataset.sid))}
function gameName(id){return({handwash:'ล้างมือ',toothbrush:'แปรงฟัน',groups:'หมู่อาหาร',goodjunk:'GoodJunk',jumpduck:'JumpDuck','balance-hold':'Balance Hold'})[id]||id}
function unlockReasons(x){const c=x.completed||{},g=x.gameCompleted||{},r=x.gameResults||{},out=[];if(!c.pretest)out.push('ยังไม่พบ Pre-test ใน HH_Assessments');for(const z of ['hygiene','nutrition','fitness'])for(const id of Object.keys(g[z]||{})){if(g[z][id]!==true){const gr=r[z+':'+id];out.push(gr?(gameName(id)+': มีผลเกม แต่ completed=false / passed='+(gr.passed===true?'true':'false')):(gameName(id)+': ยังไม่พบผลเกมใน HH_Game_Results'))}}if(c.hygiene&&c.nutrition&&c.fitness&&!c.posttest)out.push('เกมครบแล้ว แต่ยังไม่พบ Post-test');if(c.posttest&&!c.reflection)out.push('Post-test แล้ว แต่ยังไม่พบ Reflection');if(!out.length)out.push('ไม่มีเงื่อนไขติดค้างจากหลักฐานใน Sheet');return out}
function qualityAlerts(x){const p=x.profile||{},ev=x.evidence||{},pr=x.progress||{},alerts=[];if(!p.fullName)alerts.push(['fail','Profile ไม่มีชื่อ']);if(!p.section)alerts.push(['fail','Profile ไม่มี section']);if(!p.group)alerts.push(['fail','Profile ไม่มี group']);if((ev.pretestRows||0)>1)alerts.push(['warn','พบ Pre-test มากกว่า 1 แถว']);if((ev.posttestRows||0)>1)alerts.push(['warn','พบ Post-test มากกว่า 1 แถว']);if((ev.liveRows||0)>1)alerts.push(['warn','HH_Live_Status มีหลายแถวสำหรับรหัสนี้']);const evidence=(x.completed?.pretest?1:0)+Object.values(x.gameCompleted||{}).reduce((n,z)=>n+Object.values(z||{}).filter(Boolean).length,0)+(x.completed?.posttest?1:0)+(x.completed?.reflection?1:0);if(Number(pr.completedCount)!==evidence)alerts.push(['fail','Progress ไม่ตรงกับหลักฐาน: '+Number(pr.completedCount||0)+' vs '+evidence]);if(x.live&&String(x.live.currentStep||'')&&pr.nextStep&&String(x.live.currentStep)!==String(pr.nextStep))alerts.push(['warn','Live step ไม่ตรง Authority: '+x.live.currentStep+' vs '+pr.nextStep]);return alerts.length?alerts:[['ok','ไม่พบความผิดปกติสำคัญ']];}
function assessmentCard(label,key,x){const done=yes(x.completed?.[key]),score=x.scores?.[key];return`<div class="panel"><h3>${label}</h3><p><span class="badge ${done?'done':'warn'}">${done?'มีหลักฐานใน Sheet':'ยังไม่พบหลักฐาน'}</span></p><p>คะแนน: <b>${score??'-'}</b></p><p class="status">จำนวนแถว: ${key==='pretest'?(x.evidence?.pretestRows||0):(x.evidence?.posttestRows||0)}</p></div>`}
function zonePanel(zone,label,x){const completed=x.gameCompleted?.[zone]||{},results=x.gameResults||{},ids=Object.keys(completed);return`<div class="panel"><h3>${label}</h3>${ids.map(id=>{const r=results[zone+':'+id]||{},done=completed[id]===true;return`<div class="gameRow"><b>${esc(gameName(id))}</b><span class="badge ${done?'done':'warn'}">${done?'ผ่าน':'ยังไม่ผ่าน'}</span><span>คะแนน ${Number.isFinite(Number(r.score))?Number(r.score):'-'}</span><span>${r.finishedAt?esc(fmt(r.finishedAt)):'-'}</span></div>`}).join('')||'<p class="status">ยังไม่มีข้อมูลเกม</p>'}</div>`}
function reconcile(sid){const box=$('reconcileStatus');if(box)box.textContent='กำลัง Reconcile จาก Sheet...';call('reconcileStudent',{studentId:sid},x=>{if(!x?.ok){if(box)box.innerHTML='<span class="danger">Reconcile ไม่สำเร็จ: '+esc(x?.error||'unknown')+'</span>';return}if(box)box.textContent='Reconcile สำเร็จ '+fmt(new Date());setTimeout(()=>detail(sid),500);load()})}
function detail(sid){activeStudent=sid;$('modal').classList.add('open');$('detail').textContent='กำลังอ่านข้อมูลจาก Google Sheet...';call('student',{studentId:sid},x=>{if(!x?.ok){$('detail').innerHTML='<p class="danger">โหลดรายละเอียดไม่สำเร็จ: '+esc(x?.error||'unknown')+'</p>';return}const p=x.profile||{},l=x.live||{},pr=x.progress||x.authoritativeState?.progress||{},ev=x.evidence||{},reasons=unlockReasons(x),alerts=qualityAlerts(x);$('dname').textContent=(p.fullName||l.fullName||sid)+' ('+sid+')';$('detail').innerHTML=`<div class="actions"><button class="action warnbtn" id="reconcileBtn">Reconcile Student</button><button class="action secondary" id="refreshStudent">Refresh Student</button><button class="action secondary" id="openPassport">เปิด Passport</button><button class="action secondary" id="copyDebug">คัดลอก Debug URL</button></div><div id="reconcileStatus" class="status"></div><div class="detailGrid"><div class="detail">ห้อง<b>${esc(p.section||l.section||'-')}</b></div><div class="detail">กลุ่ม<b>${esc(p.group||l.group||'-')}</b></div><div class="detail">ขั้นถัดไป<b>${esc(pr.nextStep||l.currentStep||'-')}</b></div><div class="detail">ความคืบหน้า<b>${Number(pr.progressPct)||0}% (${Number(pr.completedCount)||0}/${Number(pr.totalSteps)||9})</b></div><div class="detail">สถานะล่าสุด<b>${esc(l.status||'-')}</b></div><div class="detail">ออนไลน์<b>${yes(l.online)?'ออนไลน์':'ออฟไลน์'}</b></div><div class="detail">อัปเดตล่าสุด<b>${esc(fmt(l.lastSeen||x.generatedAt))}</b></div><div class="detail">Authority<b>${esc(x.authority||'google_sheet')}</b></div></div><h3 class="sectionTitle">เหตุผลที่ยังไม่ปลดล็อก</h3>${reasons.map((v,i)=>`<div class="alert ${i===0&&reasons.length===1&&v.startsWith('ไม่มี')?'ok':'warn'}">${esc(v)}</div>`).join('')}<h3 class="sectionTitle">Data Quality</h3>${alerts.map(([t,m])=>`<div class="alert ${t}">${esc(m)}</div>`).join('')}<h3 class="sectionTitle">แบบประเมิน</h3><div class="assessmentGrid">${assessmentCard('Pre-test','pretest',x)}${assessmentCard('Post-test','posttest',x)}</div><h3 class="sectionTitle">ผลเกมราย Zone</h3><div class="zoneGrid">${zonePanel('hygiene','🧼 Hygiene',x)}${zonePanel('nutrition','🥗 Nutrition',x)}${zonePanel('fitness','🏃 Fitness',x)}</div><h3 class="sectionTitle">หลักฐานจาก Sheet</h3><div class="evidenceGrid"><div class="panel">Assessments <b>${Number(ev.assessments)||0}</b><br>Games <b>${Number(ev.games)||0}</b><br>Game summaries <b>${Number(ev.gameSummaries)||0}</b></div><div class="panel">Reflections <b>${Number(ev.reflections)||0}</b><br>Progress rows <b>${Number(ev.progressRows)||0}</b><br>Live rows <b>${Number(ev.liveRows)||0}</b></div></div>`;$('reconcileBtn').onclick=()=>reconcile(sid);$('refreshStudent').onclick=()=>detail(sid);$('openPassport').onclick=()=>window.open('./index.html?studentId='+encodeURIComponent(sid)+'&teacherPreview=1','_blank');$('copyDebug').onclick=async()=>{const u=endpoint+'?action=studentDebug&studentId='+encodeURIComponent(sid);try{await navigator.clipboard.writeText(u);$('reconcileStatus').textContent='คัดลอก Debug URL แล้ว'}catch(_){prompt('คัดลอก URL นี้',u)}}})}
function render(){summary();groupCards();rows()}['section','group','state'].forEach(id=>$(id).onchange=()=>{if(id==='group')activeGroup=$('group').value;render()});$('q').oninput=render;$('refresh').onclick=load;$('auto').onclick=()=>{auto=!auto;$('auto').textContent='Auto refresh: '+(auto?'ON':'OFF')};$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};setInterval(()=>{if(auto)load()},15000);load();})();</script></body></html>
