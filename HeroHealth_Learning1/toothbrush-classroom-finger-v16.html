          `function runHand(t){}
function trackingBadge(mode,text){
  const el=document.getElementById("trackingBadge");if(!el)return;
  el.textContent=text;el.classList.toggle("lost",mode==="lost");el.classList.toggle("touch",mode==="touch");
}
function fingerCursor(x,y,show){
  const el=document.getElementById("fingerCursor");if(!el)return;
  if(Number.isFinite(x)&&Number.isFinite(y)){el.style.left=x+"px";el.style.top=y+"px"}
  el.classList.toggle("show",!!show);
}
function alphaFor(cutoff,dt){const tau=1/(2*Math.PI*cutoff);return 1/(1+tau/Math.max(.001,dt))}
function filterFinger(raw,t){
  const hs=state.handState;
  if(!hs.filtered){hs.filtered={x:raw.x,y:raw.y};hs.velocity={x:0,y:0};hs.filterTs=t;return hs.filtered}
  const dt=Math.max(.016,Math.min(.18,(t-(hs.filterTs||t))/1000));hs.filterTs=t;
  const vx=(raw.x-hs.filtered.x)/dt,vy=(raw.y-hs.filtered.y)/dt;
  const speed=Math.hypot(vx,vy);
  const cutoff=1.6+Math.min(8,speed/240);
  const a=alphaFor(cutoff,dt);
  const oldX=hs.filtered.x,oldY=hs.filtered.y;
  hs.filtered.x+=a*(raw.x-hs.filtered.x);hs.filtered.y+=a*(raw.y-hs.filtered.y);
  hs.velocity.x=hs.velocity.x*.55+((hs.filtered.x-oldX)/dt)*.45;
  hs.velocity.y=hs.velocity.y*.55+((hs.filtered.y-oldY)/dt)*.45;
  const lead=Math.min(.055,Math.max(.018,dt*.55));
  return{x:hs.filtered.x+hs.velocity.x*lead,y:hs.filtered.y+hs.velocity.y*lead}
}
function detectFingerOnce(t){
  const hs=state.handState;
  if(!state.handOn||!state.hand||!state.cameraReady||D.camera.readyState<2||state.phase!=="playing"||hs.detectBusy)return;
  const videoTime=Number(D.camera.currentTime||0);if(videoTime&&videoTime===hs.lastVideoTime)return;hs.lastVideoTime=videoTime;hs.detectBusy=true;
  const started=performance.now();
  try{
    const c=hs.inputCanvas||(hs.inputCanvas=document.createElement("canvas"));
    if(c.width!==320){c.width=320;c.height=240;hs.inputCtx=c.getContext("2d",{alpha:false,desynchronized:true})}
    hs.inputCtx.drawImage(D.camera,0,0,320,240);
    const r=state.hand.detectForVideo(c,t);
    const cost=performance.now()-started;hs.inferenceSamples=(hs.inferenceSamples||0)+1;hs.inferenceCostTotal=(hs.inferenceCostTotal||0)+cost;
    hs.detectInterval=cost>70?125:cost>48?100:cost>30?82:68;
    if(!r.landmarks?.length){hs.missCount=(hs.missCount||0)+1;return}
    const h=r.landmarks[0],tip=screenPoint(h[8]),dip=screenPoint(h[7]),mcp=screenPoint(h[5]);
    const raw={x:tip.x+(tip.x-dip.x)*.10,y:tip.y+(tip.y-dip.y)*.10};
    const target=filterFinger(raw,t);
    hs.target={x:clamp(target.x,8,innerWidth-8),y:clamp(target.y,8,innerHeight-8)};
    hs.targetAngle=Math.atan2(tip.y-mcp.y,tip.x-mcp.x)*180/Math.PI-8;
    hs.lastSeen=t;hs.quality=100;hs.missCount=0;state.brush.active=true;
    fingerCursor(hs.target.x,hs.target.y,true);trackingBadge("finger","นิ้วชี้: ตรวจพบ");
  }catch(error){hs.errorCount=(hs.errorCount||0)+1;hs.detectInterval=Math.min(160,Math.max(100,(hs.detectInterval||75)+18))}
  finally{hs.detectBusy=false}
}
function startFingerDetector(){
  const hs=state.handState;if(hs.detectorStarted)return;hs.detectorStarted=true;
  const tick=()=>{
    const t=performance.now();detectFingerOnce(t);
    if(state.phase==="playing"&&t-(hs.lastSeen||0)>900&&t>(hs.manualUntil||0)){fingerCursor(0,0,false);trackingBadge("lost","ไม่พบนิ้ว • แตะลากได้");state.brush.active=false}
    setTimeout(tick,Number(hs.detectInterval||75));
  };tick();
}
function renderBrushFrame(t){
  const hs=state.handState;let target=null,angle=null;
  if(t<(hs.manualUntil||0)&&hs.manualPoint){target=hs.manualPoint;angle=hs.manualAngle;trackingBadge("touch","Touch fallback")}
  else if(hs.target&&t-(hs.lastSeen||0)<900){target=hs.target;angle=hs.targetAngle;state.brush.active=true}
  if(!target)return;
  const b=state.brush,dx=target.x-b.x,dy=target.y-b.y,distance=Math.hypot(dx,dy);
  const alpha=distance>100?.72:distance>45?.56:.38;
  moveBrush(b.x+dx*alpha,b.y+dy*alpha,Number.isFinite(angle)?angle:null);
}
function moveBrush(x,y,angle=null){
  const b=state.brush,t=now(),dt=Math.max(8,t-b.lastT),nextX=clamp(x,10,innerWidth-10),nextY=clamp(y,10,innerHeight-10);
  const dx=nextX-b.x,dy=nextY-b.y;b.lastX=b.x;b.lastY=b.y;b.x=nextX;b.y=nextY;b.speed=Math.hypot(dx,dy)/dt*1000;b.lastT=t;
  b.angle=Number.isFinite(angle)?angle:clamp(dx*.18,-32,32)-22;
  D.brush.style.left=b.x+"px";D.brush.style.top=b.y+"px";D.brush.style.transform=\`translate(-17px,-50%) rotate(\${b.angle}deg)\`;D.brush.classList.toggle("ghost",!b.active);
}
function brushNormalized`,

  $("startBtn").onclick=start;$("replayBtn").onclick=()=>showScreen($("startScreen"));$("zoneBtn").onclick=$("resultZoneBtn").onclick=()=>location.href=CONFIG.hygieneZoneUrl;
  $("pauseBtn").onclick=()=>{if(state.phase==="playing"){state.phase="pause";state.pausedAt=now();$("pauseBtn").textContent="▶"}else if(state.phase==="pause"){state.pauseMs+=now()-state.pausedAt;state.phase="playing";state.last=now();$("pauseBtn").textContent="⏸"}};
  const manual=e=>{if(state.phase!=="playing"||e.target.closest(".screen")||e.target.closest(".actions"))return;const hs=state.handState,t=now();hs.manualUntil=t+650;hs.manualPoint={x:e.clientX,y:e.clientY};hs.touchFallbackCount=(hs.touchFallbackCount||0)+1;state.brush.active=true;moveBrush(e.clientX,e.clientY);if(e.cancelable)e.preventDefault()};
  addEventListener("pointerdown",manual,{passive:false});addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")manual(e)},{passive:false});
  addEventListener("touchmove",e=>{const t=e.touches?.[0];if(t)manual({clientX:t.clientX,clientY:t.clientY,target:e.target,cancelable:e.cancelable,preventDefault:()=>e.preventDefault()})},{passive:false});
  addEventListener("resize",()=>updateMouthAnchor(state.faceAnchor));
}
async function boot`,
          'finger-bind');

        html=replaceRequired(html,
          /async function boot\(\)\{[\s\S]*?\}\nboot\(\);/,

boot();`,

        html=replaceRequired(html,

          `function finishZone(zid){const g=state.guided;if(g.completed[zid])return;g.completed[zid]=true;state.score+=120;state.clean=clamp(state.clean+16.7,0,100);state.technique=clamp(state.technique+3,35,100);tone("win");strokeFlash(\`ผ่านโซน \${zoneById(zid).label}!\`,"good");let n=g.targetIndex+1;if(n>=ZONES.length){g.complete=true;showCoach("🏆 ครบ 6 โซนแล้ว กำลังสรุปผล");clearPlaques();updateGuides();setTimeout(()=>end("classroom_complete"),700)}else{g.targetIndex=n;g.targetId=ZONES[n].id;clearPlaques();ensureTargetPlaques();showCoach(\`ดีมาก! ต่อไป \${zoneById(g.targetId).label} — \${directionName(expected(g.targetId))}\`)}}
function updateGuided`,

        html=replaceRequired(html,

function showScreen`,
