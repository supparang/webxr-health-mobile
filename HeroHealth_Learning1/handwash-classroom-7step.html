<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#061521">
  <title>HeroHealth • เกมล้างมือ 7 ขั้น</title>
  <style>
    html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#061521;color:#effbff;font-family:system-ui,sans-serif}
    .loading{max-width:min(560px,92vw);padding:22px;border-radius:22px;background:#0b2d3d;text-align:center;box-shadow:0 20px 60px #0007}.loading b{display:block;font-size:20px}.loading small{display:block;margin-top:8px;color:#b9dbe7;line-height:1.45}.loading button{margin-top:14px;min-height:48px;padding:10px 18px;border:0;border-radius:12px;font:inherit;font-weight:900;cursor:pointer}
  </style>
</head>
<body>
  <div class="loading"><b>กำลังเตรียมเกมล้างมือ 7 ขั้น</b><small>เตรียม WHO Runtime และกิจกรรม กรุณารอสักครู่</small></div>
  <script>
  (()=>{
    'use strict';
    const RELEASE='20260809-HANDWASH-R54-E2E29-DYNAMIC-RECEIPT';
    const sourceUrl=new URL('../herohealth/hygiene-zone/handwash-realistic-v3.html',location.href);
    sourceUrl.searchParams.set('bootstrap',RELEASE);
    sourceUrl.searchParams.set('_',String(Date.now()));
    const fetchWithTimeout=(url,ms=10000)=>new Promise((resolve,reject)=>{
      let done=false;
      const timer=setTimeout(()=>{if(done)return;done=true;reject(new Error('โหลดหน้าเกมเกินเวลา '+ms+'ms'))},ms);
      fetch(url,{cache:'no-store'}).then(r=>{if(done)return;done=true;clearTimeout(timer);resolve(r)}).catch(e=>{if(done)return;done=true;clearTimeout(timer);reject(e)});
    });
    fetchWithTimeout(sourceUrl.href)
      .then(response=>{if(!response.ok)throw new Error('โหลดหน้าเกมไม่สำเร็จ '+response.status);return response.text();})
      .then(source=>{
        let html=source;
        html=html.replace('<head>','<head><base href="../herohealth/hygiene-zone/">');
        html=html.replace('id="stepText">0/11','id="stepText">0/12');
        html=html.replace('id="rubText">0/6','id="rubText">0/7');
        html=html.replace('<section id="summaryOverlay"','<button id="zoneBtn" type="button" hidden aria-hidden="true"></button><section id="summaryOverlay"');
        html=html.replace(/(<section id="summaryOverlay"[^>]*><div class="card">)<div class="hero">/i,'$1<div id="summaryHero" class="hero">');
        html=html.replace('id="summaryText"','id="summarySub"');
        html=html.replace('<div id="summaryGrid" class="summary-grid"></div>','<div id="summaryGrid" class="summary-grid"><div class="summary-box"><span>คะแนน</span><b id="sumScore">0</b></div><div class="summary-box"><span>ดาว</span><b id="sumStars">☆☆☆</b></div><div class="summary-box"><span>WHO Accuracy</span><b id="sumAccuracy">0%</b></div><div class="summary-box"><span>เวลา</span><b id="sumTime">0.0s</b></div></div>');
        html=html.replace('id="retryBtn"','id="replayBtn"');
        html=html.replace(/<script src="\.\/handwash-summary-r8\.js[^>]*><\/script>/i,'');
        html=html.replace(
          /<script src="\.\/handwash-who-v4\.js[^>]*><\/script>/i,
          '<script src="./handwash-7step-runtime-patch-r28.js?cv='+RELEASE+'"><\/script>'+ 
          '<script src="./handwash-who-loader-r43-4.js?cv='+RELEASE+'"><\/script>'+ 
          '<script src="./handwash-unified-analytics-r30.js?cv='+RELEASE+'"><\/script>'+ 
          '<script src="./handwash-summary-completion-r30.js?cv='+RELEASE+'"><\/script>'+ 
          '<script src="./handwash-step-coach-r33.js?cv='+RELEASE+'"><\/script>'+ 
          '<script src="./handwash-mobile-fullviewport-r37.js?cv='+RELEASE+'"><\/script>'+ 
          '<script src="./handwash-active-target-r38.js?cv='+RELEASE+'"><\/script>'+ 
          '<script src="./handwash-summary-actions-r39.js?cv='+RELEASE+'"><\/script>'+ 
          '<script src="./handwash-summary-passport-return-r47.js?cv='+RELEASE+'"><\/script>'+ 
          '<script src="./handwash-mission-pass-bridge-r48.js?cv='+RELEASE+'"><\/script>'
        );
        html=html.replace(
          /<script src="\.\/handwash-mobile-grade5-rescue-v1\.js[^>]*><\/script>/i,
          '$&<script src="./handwash-mobile-grade5-rescue-r44.js?cv='+RELEASE+'"><\/script><script src="./handwash-classroom-detection-assist-r45.js?cv='+RELEASE+'"><\/script><script src="./handwash-mobile-final-step-finisher-r46.js?cv='+RELEASE+'"><\/script>'
        );
        html=html.replace('ฝึก 6 ท่าถูมือตาม WHO','ฝึก 7 ท่าถูมือให้ครบ รวมรอบข้อมือ');
        document.open();document.write(html);document.close();
      })
      .catch(error=>{
        console.error('[Handwash bootstrap R54]',error);
        document.body.innerHTML='<div class="loading"><b>ยังเข้าเกมล้างมือไม่ได้</b><small>'+String(error?.message||error)+'</small><button id="retryHandwash">ลองใหม่</button></div>';
        document.getElementById('retryHandwash').onclick=()=>{const u=new URL(location.href);u.searchParams.set('retry',Date.now());location.replace(u.href)};
      });
  })();
  </script>
</body>
</html>
