<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>HeroHealth Firebase Teacher Console R5</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;--b:#0f766e;--b2:#0d9488;--ink:#17312d;--muted:#657b77;--line:#d5e8e4;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e5f7f4,#f8fbfa);color:var(--ink)}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;box-shadow:0 4px 18px #0f766e22}.topin{width:min(1480px,100%);margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:20px;font-weight:1000}.sub{font-size:12px;color:#d9fffa;margin-top:3px}.auth{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.auth input{width:180px;border:0;border-radius:10px;padding:9px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:#fff;color:var(--b)}.danger{background:#fee2e2;color:#991b1b}.soft{background:#dff7f2;color:var(--b)}.excel{background:#dcfce7;color:#166534;border:1px solid #86efac}.wrap{width:min(1480px,100%);margin:auto;padding:16px}.notice{padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:12px}.notice.ok{background:#dcfce7;color:#166534}.notice.warn{background:#fef3c7;color:#92400e}.notice.bad{background:#fee2e2;color:#991b1b}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #0f766e14}.toolbar{padding:13px;display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:12px}.toolbar input,.toolbar select{width:100%;min-height:42px;border:1px solid #bfd9d4;border-radius:10px;padding:8px}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:12px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.kpi b{display:block;font-size:24px;color:var(--b)}.kpi span,.status{font-size:12px;color:var(--muted)}.head{padding:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.scroll{overflow:auto;max-height:68vh;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;min-width:1180px}th,td{padding:9px;border-top:1px solid #e4efed;text-align:left;font-size:13px;vertical-align:top}th{position:sticky;top:0;background:#eaf7f4;z-index:2}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900}.okb{background:#dcfce7;color:#166534}.warnb{background:#fef3c7;color:#92400e}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.session{font-weight:900;background:#dff7f2;color:#0f766e;padding:9px 12px;border-radius:12px}.cohort-note{font-size:12px;color:#0f766e;font-weight:800}
@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.summary{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.top{position:relative}.topin{align-items:stretch;flex-direction:column}.auth{display:grid;grid-template-columns:1fr 1fr}.auth input{width:100%}.auth #email{grid-column:1/-1}.wrap{padding:10px}.toolbar{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}table{min-width:1050px}th,td{padding:8px;font-size:12px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div><div class="brand">💚 HeroHealth Firebase Teacher Console R5</div><div class="sub">Production • Cohort 56 • Safe Excel Export</div></div><div class="auth"><input id="email" type="email" autocomplete="username" placeholder="อีเมลครู"><input id="password" type="password" autocomplete="current-password" placeholder="รหัสผ่าน"><button id="login" class="btn primary">เข้าสู่ระบบครู</button><div id="session" class="session" hidden></div><button id="logout" class="btn danger" hidden>ออกจากระบบ</button></div></div></header>
<main class="wrap">
<div id="notice" class="notice warn">ยังไม่ได้เชื่อมต่อ Firebase</div>
<div class="card toolbar">
<select id="cohort"><option value="research56" selected>ชุดวิจัย 56 คน • 501–528, 601–628</option><option value="all">Production ทั้งหมด</option></select>
<select id="section"><option value="">ทุกห้อง</option></select>
<select id="group"><option value="">ทุกกลุ่ม</option></select>
<select id="state"><option value="">ทุกสถานะ</option><option value="complete">จบ Flow</option><option value="incomplete">ยังไม่ครบ</option></select>
<input id="search" placeholder="ค้นหารหัสหรือชื่อ">
<button id="refresh" class="btn soft">รีเฟรช</button>
</div>
<div class="actions"><button id="xlsx" class="btn excel">📥 Excel (.xlsx)</button><span class="cohort-note">ค่าเริ่มต้นแสดงเฉพาะ 56 คนชุดใหม่</span></div>
<div id="kpis" class="summary"></div>
<section class="card"><div class="head"><div><b>Participant Report</b><div id="status" class="status"></div></div></div><div class="scroll"><table><thead><tr><th>#</th><th>รหัส</th><th>ชื่อ</th><th>ห้อง</th><th>กลุ่ม</th><th>Pre</th><th>Post</th><th>Gain</th><th>เกม</th><th>Post</th><th>Reflection</th><th>จบ Flow</th><th>Certificate</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script type="module">
import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,getDocs,query,limit}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import{HEROHEALTH_FIREBASE_CONFIG}from"../firebase/firebase-config.js";
import*as XLSX from"https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs";
const RELEASE='20260912-FIREBASE-TEACHER-CONSOLE-R5-COHORT56-XLSX-SAFE';
const app=getApps().length?getApps()[0]:initializeApp(HEROHEALTH_FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let students=[];
const yes=v=>v===true||String(v).toLowerCase()==='true';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const isResearch56=id=>{const n=Number(String(id));return Number.isInteger(n)&&((n>=501&&n<=528)||(n>=601&&n<=628))};
function dval(v){if(!v)return null;if(typeof v.toDate==='function')return v.toDate();if(v.seconds)return new Date(v.seconds*1000);const d=new Date(v);return Number.isNaN(d.getTime())?null:d}
function iso(v){const d=dval(v);return d?d.toISOString():''}
function score(v){if(v===null||v===undefined||v==='')return null;if(v&&typeof v==='object')v=v.score??v.value??v.percent??v.totalScore;if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}
function gameFlags(p={}){const gc=p.gameCompleted||{},r=p.gameResults||{},pass=(z,ids)=>ids.some(id=>gc?.[z]?.[id]===true)||ids.some(id=>r[id]?.completed===true||r[id]?.passed===true||!!r[id]?.firebaseReceiptToken);return{handwash:pass('hygiene',['handwash']),toothbrush:pass('hygiene',['toothbrush','brush']),groups:pass('nutrition',['groups','foodgroups','food-groups']),goodjunk:pass('nutrition',['goodjunk','good-junk']),jumpduck:pass('fitness',['jumpduck','jump-duck']),balance:pass('fitness',['balance','balancehold','balance-hold'])}}
async function read(ref){try{const s=await getDoc(ref);return s.exists()?s.data():null}catch(e){return null}}
function normalize(id,p={},r={}){const flags=gameFlags(p),games=Object.values(flags).filter(Boolean).length,pre=score(p.assessments?.pretest?.score??p.assessmentScores?.pretest),post=score(p.assessments?.posttest?.score??p.assessmentScores?.posttest),postDone=yes(p.posttestCompleted)||yes(p.completed?.posttest)||yes(p.assessments?.posttest?.completed),reflectionDone=yes(p.reflectionCompleted)||yes(p.completed?.reflection)||yes(p.reflection?.completed),complete=games===6&&postDone&&reflectionDone;return{id:String(id),name:r.fullName||r.studentName||r.name||'',section:r.section||r.classId||'',group:r.group||r.rotationGroup||'',games,flags,pre,post,gain:pre!==null&&post!==null?post-pre:null,postDone,reflectionDone,complete,raw:p}}
function cohortStudents(){return $('cohort').value==='research56'?students.filter(x=>isResearch56(x.id)):students}
function filtered(){const sec=$('section').value,g=$('group').value,st=$('state').value,q=$('search').value.toLowerCase();return cohortStudents().filter(x=>(!sec||x.section===sec)&&(!g||x.group===g)&&(!q||(x.id+' '+x.name).toLowerCase().includes(q))&&(!st||(st==='complete'&&x.complete)||(st==='incomplete'&&!x.complete)))}
function badge(v,a='✓',b='—'){return`<span class="badge ${v?'okb':'warnb'}">${v?a:b}</span>`}
function filters(){const base=cohortStudents(),sec=[...new Set(base.map(x=>x.section).filter(Boolean))].sort(),grp=[...new Set(base.map(x=>x.group).filter(Boolean))].sort(),s=$('section').value,g=$('group').value;$('section').innerHTML='<option value="">ทุกห้อง</option>'+sec.map(x=>`<option ${x===s?'selected':''}>${esc(x)}</option>`).join('');$('group').innerHTML='<option value="">ทุกกลุ่ม</option>'+grp.map(x=>`<option ${x===g?'selected':''}>${esc(x)}</option>`).join('')}
async function load(){if(!auth.currentUser||auth.currentUser.isAnonymous){$('notice').className='notice warn';$('notice').textContent='กรุณาเข้าสู่ระบบครูก่อน';return}$('notice').className='notice warn';$('notice').textContent='กำลังโหลด Production…';try{const snap=await getDocs(query(collection(db,'studentProgress'),limit(500)));students=await Promise.all(snap.docs.map(async d=>normalize(d.id,d.data(),(await read(doc(db,'students',d.id)))||{})));filters();render();$('notice').className='notice ok';$('notice').textContent=`Production พร้อม • ทั้งหมด ${students.length} • ชุดวิจัย ${students.filter(x=>isResearch56(x.id)).length}/56`}catch(e){$('notice').className='notice bad';$('notice').textContent='โหลดไม่สำเร็จ: '+(e?.message||e)}}
async function certificateId(id){const c=await read(doc(db,'studentAssessments',`${id}_CERTIFICATE`));return c?.certificateId||c?.certificate_id||''}
async function render(){const a=filtered(),base=cohortStudents();$('kpis').innerHTML=[['ผู้เข้าร่วม',base.length],['เกมครบ',base.filter(x=>x.games===6).length],['Post-test',base.filter(x=>x.postDone).length],['Reflection',base.filter(x=>x.reflectionDone).length],['จบ Flow',base.filter(x=>x.complete).length],['กำลังแสดง',a.length]].map(([k,v])=>`<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join('');$('status').textContent=`แสดง ${a.length}/${base.length}`;$('rows').innerHTML='<tr><td colspan="13">กำลังโหลด Certificate…</td></tr>';const certs=await Promise.all(a.map(x=>certificateId(x.id)));$('rows').innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td class="mono">${x.id}</td><td>${esc(x.name||'—')}</td><td>${esc(x.section||'—')}</td><td>${esc(x.group||'—')}</td><td>${x.pre??'—'}</td><td>${x.post??'—'}</td><td>${x.gain??'—'}</td><td>${x.games}/6</td><td>${badge(x.postDone)}</td><td>${badge(x.reflectionDone)}</td><td>${badge(x.complete,'ครบ','ไม่ครบ')}</td><td class="mono">${esc(certs[i]||'—')}</td></tr>`).join('')||'<tr><td colspan="13">ไม่พบข้อมูล</td></tr>'}
function safeCell(v){if(v===null||v===undefined)return'';let s=typeof v==='string'?v:JSON.stringify(v);if(s.length>30000)s=s.slice(0,29950)+'…[TRUNCATED]';return s}
function plain(v){if(v===null||v===undefined)return v;if(v instanceof Date)return v.toISOString();if(typeof v?.toDate==='function')return v.toDate().toISOString();if(Array.isArray(v))return v.map(plain);if(typeof v==='object'){const o={};for(const[k,val]of Object.entries(v))o[k]=plain(val);return o}return v}
function makeSheet(rows,headers){const safeRows=rows.map(r=>{const o={};for(const h of headers)o[h]=safeCell(r[h]);return o});const ws=XLSX.utils.json_to_sheet(safeRows,{header:headers});ws['!cols']=headers.map(h=>({wch:Math.min(60,Math.max(10,String(h).length+2))}));if(ws['!ref'])ws['!autofilter']={ref:ws['!ref']};return ws}
async function exportXlsx(){const btn=$('xlsx');btn.disabled=true;const old=btn.textContent;btn.textContent='กำลังสร้าง Excel…';try{const base=cohortStudents(),rows=await Promise.all(base.map(async x=>{const cert=await read(doc(db,'studentAssessments',`${x.id}_CERTIFICATE`));return{student_id:x.id,full_name:x.name,section:x.section,group:x.group,pre_score:x.pre??'',post_score:x.post??'',gain:x.gain??'',handwash:x.flags.handwash,toothbrush:x.flags.toothbrush,groups:x.flags.groups,goodjunk:x.flags.goodjunk,jumpduck:x.flags.jumpduck,balance:x.flags.balance,game_count:x.games,posttest_completed:x.postDone,reflection_completed:x.reflectionDone,flow_completed:x.complete,certificate_id:cert?.certificateId||cert?.certificate_id||'',updated_at:iso(x.raw?.updatedAt||x.raw?.lastSeen),raw_json:safeCell(JSON.stringify(plain(x.raw||{})))}}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,makeSheet(rows,['student_id','full_name','section','group','pre_score','post_score','gain','handwash','toothbrush','groups','goodjunk','jumpduck','balance','game_count','posttest_completed','reflection_completed','flow_completed','certificate_id','updated_at','raw_json']),'Summary');const d=new Date(),pad=n=>String(n).padStart(2,'0'),tag=$('cohort').value==='research56'?'Research56':'ProductionAll';XLSX.writeFile(wb,`HeroHealth_${tag}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.xlsx`,{compression:true});$('notice').className='notice ok';$('notice').textContent=`Export Excel สำเร็จ • ${rows.length} คน • safe-cell 30,000 chars`}catch(e){console.error(e);$('notice').className='notice bad';$('notice').textContent='Export Excel ไม่สำเร็จ: '+(e?.message||e)}finally{btn.disabled=false;btn.textContent=old}}
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await load()}catch(e){$('notice').className='notice bad';$('notice').textContent='เข้าสู่ระบบไม่สำเร็จ: '+e.message}};
$('logout').onclick=async()=>{await signOut(auth);students=[];render()};
$('refresh').onclick=load;$('xlsx').onclick=exportXlsx;
['cohort','section','group','state','search'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='cohort')filters();render()}));
onAuthStateChanged(auth,u=>{const on=!!u&&!u.isAnonymous;$('email').hidden=on;$('password').hidden=on;$('login').hidden=on;$('session').hidden=!on;$('logout').hidden=!on;if(on)$('session').textContent='✅ Production • '+(u.email||'Teacher')});
console.info('[HeroHealth Teacher Console R5]',RELEASE);
</script>
</body>
</html>
