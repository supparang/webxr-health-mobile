<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <title>HeroHealth Learning Platform</title>
  <link rel="stylesheet" href="./assets/app.css?v=20260729-passport-mobile-v87" />
  <style>
    :root{--bg:#f4fbfa;--surface:#fff;--ink:#12302c;--muted:#5f7470;--brand:#0f766e;--brand2:#14b8a6;--line:#d7e8e4;--warn:#f59e0b;--danger:#dc2626;--ok:#16a34a;--shadow:0 12px 30px rgba(15,118,110,.12);font-family:Inter,"Noto Sans Thai",system-ui,-apple-system,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eafaf7,#f8fbfb 36%);color:var(--ink)}button,input,select{font:inherit}
    .shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;min-width:0}.brand>div:last-child{min-width:0}.logo{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:22px;box-shadow:var(--shadow)}
    .container{width:min(1180px,100%);margin:auto;padding:20px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
    .hero-card{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;overflow:hidden;position:relative}.hero-card:after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
    h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.hero-card .muted{color:#d8fffa}.actions{display:flex;flex-wrap:wrap;gap:10px}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--brand);color:#fff}.btn-light{background:#fff;color:var(--brand)}.btn-soft{background:#e7f7f4;color:var(--brand)}.btn-danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.station{position:relative;overflow:hidden}.station .emoji{font-size:34px}.station.locked{opacity:.58}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:#e7f7f4;color:var(--brand);font-weight:800;font-size:13px}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}
    .progress{height:12px;border-radius:99px;background:#e6efed;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:inherit}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fbfefd}.kpi b{display:block;font-size:25px}
    .timeline{display:grid;gap:10px}.step{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px}.step .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e7f7f4;color:var(--brand);font-weight:900}.step.done .num{background:var(--ok);color:#fff}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field input,.field select{width:100%;border:1px solid #bfd5d0;border-radius:12px;padding:12px;background:#fff}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{border:0;background:transparent;border-radius:12px;padding:9px 12px;font-weight:800;color:var(--muted);cursor:pointer}.nav button.active{background:#e7f7f4;color:var(--brand)}
    .screen{display:none}.screen.active{display:block}.center{text-align:center}.timer{font-size:48px;font-weight:1000;letter-spacing:1px}.group-board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.group{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}
    .passport{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:center}.passport>div{min-width:0}.avatar{height:120px;border-radius:28px;background:linear-gradient(135deg,#fde68a,#fb7185);display:grid;place-items:center;font-size:58px}.hero-card .passport h1{overflow-wrap:anywhere;word-break:normal}.toast{position:fixed;right:16px;bottom:16px;background:#12302c;color:#fff;border-radius:14px;padding:12px 15px;box-shadow:var(--shadow);z-index:50}.small{font-size:13px}.hidden{display:none!important}
    .topbar .nav,.hh-live-link,a[href*="teacher"],button[onclick*="teacher"],button[onclick*="classroom"]{display:none!important}
    @media(max-width:820px){.hero,.grid,.group-board,.kpis{grid-template-columns:1fr 1fr}.passport{grid-template-columns:100px minmax(0,1fr)}.avatar{height:100px}}
    @media(max-width:560px){body{background:linear-gradient(180deg,#e9faf7,#f7fbfb 42%)}.container{padding:12px}.topbar{padding:9px 12px;min-height:64px}.hero,.grid,.group-board,.kpis,.form-row{grid-template-columns:1fr}.topbar .brand{gap:9px;font-size:1.04rem;line-height:1.18}.topbar .logo{width:40px;height:40px;flex-basis:40px;border-radius:13px;font-size:20px}.topbar .brand .small.muted{display:none!important}.card{border-radius:22px;padding:16px}.hero{gap:12px}.timer{font-size:38px}.nav{display:none}.hero-card{padding:16px 15px;background:linear-gradient(135deg,#0f766e,#0d9488)}.passport{grid-template-columns:84px minmax(0,1fr);gap:13px;align-items:center}.avatar{height:84px;border-radius:22px;font-size:43px}.hero-card .badge{padding:5px 9px;font-size:.72rem;letter-spacing:.02em}.hero-card .passport h1{margin:7px 0 4px!important;font-size:clamp(1.55rem,7vw,2rem);line-height:1.13;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.hero-card .passport p.muted{margin:0 0 9px;font-size:.88rem;line-height:1.3;overflow-wrap:anywhere}.hero-card .progress{height:10px}.hero-card .progress+p{margin:6px 0 0!important;font-size:.9rem}.hero>.card:not(.hero-card){padding:17px 16px;text-align:left}.hero>.card:not(.hero-card) h2{margin:0 0 5px;font-size:1.7rem;line-height:1.15}.hero>.card:not(.hero-card)>p.muted{margin:0 0 13px;font-size:1rem;line-height:1.35}.hero>.card:not(.hero-card) .btn-light{display:block;width:100%;min-height:54px!important;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:1.08rem;font-weight:900;box-shadow:0 9px 20px rgba(15,118,110,.2)}.hero>.card:not(.hero-card) .btn-soft{display:block;width:auto!important;min-width:0;margin:10px auto 0!important;padding:9px 14px;min-height:40px;border:1px solid #cfe8e3;background:#f2faf8;color:#55706b;font-size:.9rem;font-weight:800;box-shadow:none}.container>h2{font-size:1.65rem;line-height:1.2;margin-top:20px!important;margin-bottom:11px}.timeline{gap:9px}.step{grid-template-columns:46px minmax(0,1fr) auto;gap:10px;padding:11px 12px;border-radius:18px}.step .num{width:42px;height:42px;font-size:1.18rem}.step b{font-size:1.05rem;line-height:1.2}.step .small{font-size:.82rem}.step .badge{font-size:.76rem;padding:5px 9px}}
    @media(max-width:370px){.container{padding:9px}.topbar{padding:8px 9px}.passport{grid-template-columns:72px minmax(0,1fr);gap:10px}.avatar{height:72px;font-size:37px;border-radius:19px}.hero-card .passport h1{font-size:1.42rem}.hero-card .passport p.muted{font-size:.8rem}.hero>.card:not(.hero-card) h2{font-size:1.48rem}}
  </style>
