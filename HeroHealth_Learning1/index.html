  <script>
    const __hhEntryParams=new URLSearchParams(location.search);
    window.HH_AUTHORITY_MODE=String(__hhEntryParams.get('authority')||'firebase').toLowerCase();

    window.HH_APP_RELEASE='20260820-PASSPORT-R48-NO-OBSERVER';
    if(window.HH_FIREBASE_MODE){
      const hasIdentity=['studentId','sid','pid'].some(k=>String(__hhEntryParams.get(k)||'').trim());
      const isHandoff=__hhEntryParams.get('firebaseReceipt')==='1'||__hhEntryParams.has('returnedGame')||__hhEntryParams.has('gameCompleted')||__hhEntryParams.has('receiptToken')||__hhEntryParams.has('authorityRefresh')||__hhEntryParams.get('firebaseReady')==='1'||String(__hhEntryParams.get('returnSessionPolicy')||'').startsWith('force-firebase-rehydrate');
      if(!hasIdentity&&!isHandoff&&__hhEntryParams.get('logout')!=='1'){
        const u=new URL(location.href);u.searchParams.set('authority','firebase');u.searchParams.set('logout','1');u.searchParams.set('v','20260820-r48');history.replaceState(null,'',u.href);
      }
    }
