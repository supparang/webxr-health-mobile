    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eafaf7,#f8fbfb 36%);color:var(--ink)}button,input,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:900;min-width:0}.brand>div:last-child{min-width:0}.logo{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:22px;box-shadow:var(--shadow)}.container{width:min(1180px,100%);margin:auto;padding:20px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.hero-card{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;overflow:hidden;position:relative}.hero-card:after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.hero-card .muted{color:#d8fffa}.actions{display:flex;flex-wrap:wrap;gap:10px}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--brand);color:#fff}.btn-light{background:#fff;color:var(--brand)}.btn-soft{background:#e7f7f4;color:var(--brand)}.btn-danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.station{position:relative;overflow:hidden}.station .emoji{font-size:34px}.station.locked{opacity:.58}.badge{display:inline-flex;align-items: oup-board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.group{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.passport{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:center}.passport>div{min-width:0}.avatar{height:120px;border-radius:28px;background:linear-gradient(135deg,#fde68a,#fb7185);display:grid;place-items:center;font-size:58px}.toast{position:fixed;right:16px;bottom:16px;background:#12302c;color:#fff;border-radius:14px;padding:12px 15px;box-shadow:var(--shadow);z-index:50}.small{font-size:13px}.hidden{display:none!important}.topbar .nav,.hh-live-link,a[href*="teacher"],button[onclick*="teacher"],button[onclick*="classroom"]{display:none!important}@media(max-width:820px){.hero,.grid,.group-board,.kpis{grid-template-columns:1fr 1fr}.passport{grid-template-columns:100px minmax(0,1fr)}.avatar{height:100px}}@media(max-width:560px){.container{padding:12px}.topbar{padding:9px 12px}.hero,.grid,.group-board,.kpis,.form-row{grid-template-columns:1fr}.card{border-radius:22px;padding:16px}.passport{grid-template-columns:84px minmax(0,1fr);gap:13px}.avatar{height:84px;font-size:43px}.nav{display:none}.step{grid-template-columns:42px minmax(0,1fr) auto;padding:9px 10px}}
