function jsonp(params,timeout=30000){return new Promise((resolve,reject)=>{const cb='HHREPAIR_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const finish=(e,d)=>{if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch(_){}s.remove();e?reject(e):resolve(d)};const t=setTimeout(()=>finish(new Error('timeout')),timeout);window[cb]=d=>finish(null,d);s.onerror=()=>finish(new Error('load_failed'));s.src=ENDPOINT+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.head.appendChild(s)})}
