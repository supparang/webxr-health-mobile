<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Repair Handwash 990007</title><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#eefaf7;color:#123}.card{width:min(520px,92vw);background:#fff;padding:28px;border-radius:22px;box-shadow:0 16px 48px #1232;text-align:center}button,a{border:0;border-radius:14px;padding:14px 18px;background:#0f766e;color:#fff;font-weight:800;font-size:18px;width:100%;display:block;text-decoration:none;box-sizing:border-box}.ok{color:#087f5b}.err{color:#b42318}.muted{color:#52606d;font-size:14px}iframe{width:1px;height:1px;border:0;position:absolute;left:-9999px}</style></head><body><div class="card"><h1>ซ่อมสถานะ Handwash</h1><p id="msg">กำลังส่งผลของนักเรียน 990007 เข้า Google Sheet Authority…</p><p class="muted">หน้านี้ใช้วิธีส่งแบบ Mobile-safe โดยไม่พึ่ง JSONP</p><button id="retry" hidden>ลองอีกครั้ง</button><a id="home" href="./index.html" hidden>กลับ HeroHealth</a><iframe id="sink" name="sink"></iframe></div><script>
(()=>{'use strict';

const msg=document.getElementById('msg'),retry=document.getElementById('retry'),home=document.getElementById('home'),sink=document.getElementById('sink');
const payload={eventType:'game',eventId:'HH-REPAIR-990007-HANDWASH-20260727-V3-MOBILE',studentId:'990007',profile:{fullName:'',section:'QA-P5-ASSESSMENT',group:'A'},clientTs:new Date().toISOString(),currentStep:'hygiene:handwash',status:'ซ่อมผล Handwash ที่เล่นจบจริงแล้ว',game:{zone:'hygiene',gameId:'handwash',score:255,accuracy:0,scoreAvailable:true,passed:true,completed:true,finishedAt:new Date().toISOString(),sessionId:'HH-DATA-REPAIR-990007-HANDWASH-V3',inputMode:'classroom-ar',gameVersion:'HANDWASH-REPAIR-V3-MOBILE',repairReason:'Student completed one real classroom round but wrapper did not persist authority',singleAttemptPolicy:true,completionPolicy:'single-round-summary'}};

retry.onclick=run;run();
})();
</script></body></html>
