<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Repair Handwash 990007</title><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#eefaf7;color:#123}.card{width:min(520px,92vw);background:#fff;padding:28px;border-radius:22px;box-shadow:0 16px 48px #1232;text-align:center}button,a{border:0;border-radius:14px;padding:14px 18px;background:#0f766e;color:#fff;font-weight:800;font-size:18px;width:100%;display:block;text-decoration:none;box-sizing:border-box;margin-top:10px}.ok{color:#087f5b}.err{color:#b42318}.muted{color:#52606d;font-size:14px}.count{font-size:34px;font-weight:900;color:#0f766e}iframe{width:1px;height:1px;border:0;position:absolute;left:-9999px}</style></head><body><div class="card"><h1>ซ่อมสถานะ Handwash</h1><p id="msg">กำลังส่งผลของนักเรียน 990007 เข้า Google Sheet Authority…</p><div id="count" class="count">12</div><p class="muted">กรุณารอจนระบบกลับหน้า HeroHealth เอง อย่าปิดหน้านี้ก่อน</p><button id="retry" hidden>ลองอีกครั้ง</button><a id="home" href="./index.html" hidden>กลับ HeroHealth</a><iframe id="sink" name="sink"></iframe></div><script>
(()=>{'use strict';
const ENDPOINT='https://script.google.com/macros/s/AKfycbwa-OSdqWS7uPne01wNr5a42PgKfAoxmUUm7yMcUx2D0C0OnbjrbppNUHkfjUxm79Fz/exec';
const msg=document.getElementById('msg'),retry=document.getElementById('retry'),home=document.getElementById('home'),sink=document.getElementById('sink'),count=document.getElementById('count');
const payload={eventType:'game',eventId:'HH-REPAIR-990007-HANDWASH-20260727-V4-MULTI',studentId:'990007',profile:{fullName:'',section:'QA-P5-ASSESSMENT',group:'A'},clientTs:new Date().toISOString(),currentStep:'hygiene:handwash',status:'ซ่อมผล Handwash ที่เล่นจบจริงแล้ว',game:{zone:'hygiene',gameId:'handwash',score:255,accuracy:0,scoreAvailable:true,passed:true,completed:true,finishedAt:new Date().toISOString(),sessionId:'HH-DATA-REPAIR-990007-HANDWASH-V4',inputMode:'classroom-ar',gameVersion:'HANDWASH-REPAIR-V4-MULTI',repairReason:'Student completed one real classroom round but wrapper did not persist authority',singleAttemptPolicy:true,completionPolicy:'single-round-summary'}};
function url(){return ENDPOINT+'?'+new URLSearchParams({action:'submit',payload:JSON.stringify(payload),_:Date.now()})}
function fireAll(){const u=url();try{const form=document.createElement('form');form.method='GET';form.action=ENDPOINT;form.target='sink';form.style.display='none';for(const [k,v] of Object.entries({action:'submit',payload:JSON.stringify(payload),_:Date.now()})){const i=document.createElement('input');i.name=k;i.value=v;form.appendChild(i)}document.body.appendChild(form);form.submit()}catch(_){ }
try{fetch(u,{mode:'no-cors',cache:'no-store',keepalive:true}).catch(()=>{})}catch(_){ }
try{const img=new Image();img.src=u+'&transport=image'}catch(_){ }
try{sink.src=u+'&transport=iframe'}catch(_){ }
try{if(navigator.sendBeacon){const body=new Blob([JSON.stringify(payload)],{type:'application/json'});navigator.sendBeacon(ENDPOINT,body)}}catch(_){ }}
async function run(){retry.hidden=true;home.hidden=true;msg.className='';msg.textContent='กำลังส่งผลของนักเรียน 990007 เข้า Google Sheet Authority…';fireAll();let n=12;count.textContent=n;const timer=setInterval(()=>{n--;count.textContent=Math.max(0,n);if(n===7)fireAll();if(n<=0){clearInterval(timer);msg.className='ok';msg.textContent='ส่งคำสั่งซ่อมครบแล้ว กำลังกลับไปตรวจสถานะ…';setTimeout(()=>location.replace('./index.html?authorityRefresh='+Date.now()+'&repair990007=1&v=4'),900)}},1000)}
retry.onclick=run;run();
})();
</script></body></html>
