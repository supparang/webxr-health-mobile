<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeroHealth Research Session Tools</title><style>:root{font-family:Inter,"Noto Sans Thai",system-ui;color:#17352f;background:#f5faf9}*{box-sizing:border-box}body{margin:0}.w{max-width:960px;margin:auto;padding:16px}.h,.c{background:#fff;border:1px solid #d7e8e4;border-radius:18px;padding:18px;margin:12px 0}.h{background:#12302c;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;padding:10px;border:1px solid #bfd5d0;border-radius:10px}label{display:block;margin:8px 0}.b{padding:12px 16px;border:0;border-radius:12px;background:#0f766e;color:#fff;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><section class="h"><small>HEROHEALTH RESEARCH OPERATIONS</small><h1>Session Evidence Console</h1><p>HH-FID01 • HH-AE01 • HH-OBS01 • HH-TCH01 • HH-DQ01</p></section><form id="f"><section class="c"><h2>Session</h2><div class="grid"><label>Student ID<input name="studentId" required></label><label>Session ID<input name="sessionId" required></label><label>School/Site<input name="site"></label><label>Round<input name="round"></label><label>Recorder role<select name="role"><option>researcher</option><option>observer</option><option>teacher</option></select></label><label>App build<input name="appBuild"></label></div></section><section class="c"><h2>HH-FID01 Fidelity</h2><label><input type="checkbox" name="fid_pre"> Pre-test ก่อน intervention</label><label><input type="checkbox" name="fid_protocol"> ดำเนินกิจกรรมตาม protocol</label><label><input type="checkbox" name="fid_noanswer"> ไม่มีการเฉลยระหว่างภารกิจ</label><label><input type="checkbox" name="fid_post"> Post-test หลัง intervention</label><label><input type="checkbox" name="fid_postexp"> Post-experience + Reflection ตามลำดับ</label><label>Protocol deviation<textarea name="protocolDeviation"></textarea></label></section><section class="c"><h2>HH-AE01 Safety</h2><label>Safety event<select name="safetyEvent"><option value="none">ไม่พบ</option><option>dizziness</option><option>pain</option><option>near_fall_or_fall</option><option>collision</option><option>eye_discomfort</option><option>distress</option><option>other</option></select></label><label>Severity<select name="severity"><option>none</option><option>mild</option><option>moderate</option><option>severe</option></select></label><label>Action taken<textarea name="safetyAction"></textarea></label></section><section class="c"><h2>HH-OBS01 Observation</h2><div class="grid"><label>On-task 1–5<input type="number" min="1" max="5" name="onTask"></label><label>Independent use 1–5<input type="number" min="1" max="5" name="independent"></label><label>Help needed 0–3<input type="number" min="0" max="3" name="help"></label><label>Visible engagement 1–5<input type="number" min="1" max="5" name="engagement"></label></div><label>Observation notes<textarea name="observationNotes"></textarea></label></section><section class="c"><h2>HH-TCH01 Teacher Implementation</h2><div class="grid"><label>เหมาะกับวัย 1–5<input type="number" min="1" max="5" name="t_age"></label><label>ใช้ในชั้นเรียนได้ 1–5<input type="number" min="1" max="5" name="t_feasible"></label><label>ช่วยการเรียนรู้ 1–5<input type="number" min="1" max="5" name="t_learning"></label><label>ควรใช้ต่อ 1–5<input type="number" min="1" max="5" name="t_continue"></label></div><label>Teacher comments<textarea name="teacherComments"></textarea></label></section><section class="c"><h2>HH-DQ01 Data Quality</h2><label><input type="checkbox" name="dq_identity"> Identity verified</label><label><input type="checkbox" name="dq_prepost"> Pre/Post receipt verified</label><label><input type="checkbox" name="dq_games"> Game completion receipts verified</label><label><input type="checkbox" name="dq_postexp"> Post-experience/Reflection receipt verified</label><label>Technical incident<textarea name="technicalIncident"></textarea></label></section><section class="c"><button class="b">บันทึก Research Session Record</button><p id="st"></p></section></form></main><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{HEROHEALTH_FIREBASE_CONFIG}from'../firebase/firebase-config.js';const app=getApps().length?getApps()[0]:initializeApp(HEROHEALTH_FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app),f=document.getElementById('f');f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),g=k=>String(fd.get(k)||''),b=k=>fd.get(k)==='on',n=k=>Number(fd.get(k)||0),sid=g('studentId'),session=g('sessionId'),u=auth.currentUser||(await signInAnonymously(auth)).user;const rec={studentId:sid,sessionId:session,site:g('site'),round:g('round'),recorderRole:g('role'),appBuild:g('appBuild'),fidelity:{pre:b('fid_pre'),protocol:b('fid_protocol'),noAnswer:b('fid_noanswer'),post:b('fid_post'),postExperience:b('fid_postexp'),deviation:g('protocolDeviation')},safety:{event:g('safetyEvent'),severity:g('severity'),action:g('safetyAction')},observation:{onTask:n('onTask'),independent:n('independent'),help:n('help'),engagement:n('engagement'),notes:g('observationNotes')},teacher:{age:n('t_age'),feasible:n('t_feasible'),learning:n('t_learning'),continue:n('t_continue'),comments:g('teacherComments')},dataQuality:{identity:b('dq_identity'),prepost:b('dq_prepost'),games:b('dq_games'),postExperience:b('dq_postexp'),technicalIncident:g('technicalIncident')},instrumentVersions:{fidelity:'HH-FID01-v1',safety:'HH-AE01-v1',observation:'HH-OBS01-v1',teacher:'HH-TCH01-v1',dataQuality:'HH-DQ01-v1'},submittedAt:serverTimestamp(),uid:u.uid};await setDoc(doc(db,'researchSessionRecords',`${sid}_${session}`),rec,{merge:true});document.getElementById('st').textContent='✓ บันทึกแล้ว';};</script></body></html>
