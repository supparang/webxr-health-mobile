function compactForQueue(value,depth=0){if(depth>5||value==null)return value==null?value:undefined;if(typeof value==='number'||typeof value==='boolean')return value;if(typeof value==='string')return value.slice(0,4000);if(Array.isArray(value))return value.slice(0,500).map(v=>compactForQueue(v,depth+1)).filter(v=>v!==undefined);if(typeof value==='object'){const out={};Object.keys(value).slice(0,300).forEach(k=>{if(/base64|imageData|videoData|rawFrame|blob/i.test(k))return;const v=compactForQueue(value[k],depth+1);if(v!==undefined)out[k]=v});return out}return undefined}

function makeCorePayload(full){const g=full.game||{},handwash=gameId==='handwash',coreGame={studentId:sid,profile:g.profile||full.profile||{},zone,gameId,game_id:gameId,game_key:gameId,score:num(g.score),accuracy:num(g.accuracy),scoreAvailable:g.scoreAvailable===true,passed:g.passed===true,completed:g.completed===true,procedureCompleted:g.procedureCompleted===true,progressionEligible:g.progressionEligible===true,finishedAt:g.finishedAt||full.clientTs,durationSec:num(g.durationSec),inputMode:g.inputMode||'classroom-ar',gameVersion:g.gameVersion||'',sessionId:g.sessionId||sessionId,singleAttemptPolicy:true,retryRequired:false,completionPolicy:g.completionPolicy||'one-classroom-round-completes',skillCriteriaMet:g.skillCriteriaMet===true,originalPassed:g.originalPassed===true,analyticsSchemaVersion:g.analyticsSchemaVersion||'HH-UNIFIED-GAME-ANALYTICS-V2',metricCompletenessPct:num(g.metricCompletenessPct),coreResultOnly:!handwash,fullAnalyticsQueued:true,transportVersion:RELEASE};if(handwash){const a=result.handwashAudit||handwashAudit(result);coreGame.completedRubSteps=a.rubDone;coreGame.totalWhoRubSteps=a.rubTotal;coreGame.completedProcessSteps=a.processDone;coreGame.totalProcessSteps=a.processTotal;coreGame.wristsPassed=a.wristsPassed;coreGame.steps=Array.isArray(g.steps)?g.steps.slice(0,20):Array.isArray(g.stepResults)?g.stepResults.slice(0,20):[];coreGame.events=Array.isArray(g.events)?g.events.slice(0,30):Array.isArray(g.eventLog)?g.eventLog.slice(0,30):[];coreGame.coreResultOnly=false}return{eventType:'game',type:'game',eventId:full.eventId,studentId:sid,zone,gameId,completed:coreGame.completed,procedureCompleted:coreGame.procedureCompleted,progressionEligible:coreGame.progressionEligible,passed:coreGame.passed,profile:coreGame.profile,clientTs:full.clientTs,currentStep:full.currentStep,status:`Core result submitted first for ${zone}:${gameId}`,game:coreGame}}
function gameConfirmedIn(obj){if(!obj||typeof obj!=='object')return false;const gc=obj.gameCompleted;if(gc?.[zone]?.[gameId]===true)return true;if(gc===true&&String(obj.gameId||obj.game_id||gameId)===gameId)return true;const games=obj.completedGames||obj.progress?.completedGames;if(Array.isArray(games)&&games.some(v=>String(v)===`${zone}:${gameId}`||String(v)===gameId))return true;return false}

async function waitForAuthority(seed){if(seed&&authorityHasGame(seed)){applyAuthority(seed);return seed}let last=seed||null;for(let attempt=1;attempt<=10;attempt++){if(attempt===1||attempt===4||attempt===7){const reconciled=await reconcileStudent();last=reconciled;if(authorityHasGame(reconciled)){applyAuthority(reconciled);return reconciled}}syncEl.textContent=`กำลังตรวจ Passport จาก Google Sheet (${attempt}/10)…`;try{const api=await jsonp({action:'student',studentId:sid,force:'1'},18000);last=api;if(api?.ok&&authorityHasGame(api)){applyAuthority(api);return api}}catch(error){last={ok:false,error:String(error?.message||error)}}await sleep(650+Math.floor(Math.random()*500)+attempt*180)}throw new Error(last?.error||'authority_not_advanced_after_reconcile')}
async function submitCore(core){if(await eventFound(core.eventId))return true;await sleep(Math.floor(Math.random()*1200));await formPost(core);if(await waitForEvent(core.eventId,1))return true;await fetchNoCors(core).catch(()=>false);return waitForEvent(core.eventId,2)}
function returnUrl(authority,pending=false){const u=new URL(back,location.href);u.searchParams.set('sid',sid);u.searchParams.set('authorityRefresh',Date.now());u.searchParams.set('gameSync','1');u.searchParams.set('autoNext','1');if(pending)u.searchParams.set('pendingGameSync',`${zone}:${gameId}`);const next=authority?.authoritativeState?.progress?.nextStep||authority?.progress?.nextStep;if(next)u.searchParams.set('confirmedNext',next);return u.href}
async function finishAndGo(automatic=false){if(syncing)return;read();if(strictHandwash&&!result.completed){syncEl.textContent='Handwash ยังทำไม่ครบ 7 ท่าถูและ 5 ขั้นกระบวนการ';return}syncing=true;returnBtn.disabled=true;leaveBtn.disabled=true;const full=makeFullPayload(),core=makeCorePayload(full);enqueueCore(core);enqueueAnalytics(full);try{syncEl.classList.remove('error');syncEl.textContent='กำลังส่งผลหลักเข้า Google Sheet…';const found=await submitCore(core);if(!found)throw new Error('core_event_not_found_after_all_transports');const authority=await waitForAuthority(null);dequeueCore(core.eventId);const next=authority?.authoritativeState?.progress?.nextStep||authority?.progress?.nextStep||'ภารกิจถัดไป';syncEl.textContent=`Passport ยืนยันแล้ว • ถัดไป ${next}`;statusEl.textContent='ปลดล็อกภารกิจถัดไปแล้ว';setTimeout(()=>location.replace(returnUrl(authority)),500)}catch(error){lastError=String(error?.message||error);console.error('[HeroHealth R38 core-first]',error);syncing=false;automaticRounds++;if(automatic&&automaticRounds<3){syncEl.classList.remove('error');syncEl.textContent=`Google Sheet ยังประมวลผลไม่เสร็จ (${lastError})\nระบบกำลังลองส่งผลหลักอีกครั้ง…`;setTimeout(()=>finishAndGo(true),2500+Math.floor(Math.random()*1200));return}syncEl.classList.add('error');syncEl.textContent=`Google Sheet ยังไม่ยืนยันภารกิจ\nรหัส: ${lastError}\nผลหลักถูกเก็บไว้ในเครื่องแล้ว`;statusEl.textContent='รอ Google Sheet ยืนยัน';returnBtn.textContent='ลองส่งผลหลักอีกครั้ง';returnBtn.disabled=false;leaveBtn.disabled=false}}
function leavePending(){location.href=returnUrl(null,true)}
configureDefaultButtons();f.src=target;
f.addEventListener('load',()=>{loading.classList.add('hide');statusEl.textContent='พร้อมเริ่มเกม';clearStaleResults();try{const d=f.contentDocument;d.addEventListener('click',event=>{if(/เริ่ม|start|เปิดกล้อง|calibration|coach/i.test(String(event.target?.textContent||'')))onStart()},{capture:true})}catch(_){}});
addEventListener('message',event=>{if(event.origin!==location.origin)return;const message=event.data||{};if(message.type==='HEROHEALTH_GAME_STARTED')onStart();if(message.type==='HEROHEALTH_GAME_COMPLETE'&&message.payload){if(!startedAtMs)onStart();show(message.payload)}});
})();
