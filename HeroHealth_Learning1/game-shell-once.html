<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#082f49">
<title>HeroHealth Classroom Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03131d;font-family:system-ui,sans-serif}
.bar{position:fixed;z-index:20;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#03131df5;color:#fff}.bar b{flex:1}.bar button,.btn{border:0;border-radius:12px;min-height:44px;padding:9px 12px;font:inherit;font-weight:900}.back{background:#173b4b;color:#fff}.status{font-size:13px;opacity:.9}
iframe{position:fixed;top:60px;left:0;width:100%;height:calc(100% - 60px);border:0;background:#000}.overlay{position:fixed;z-index:50;inset:60px 0 0;display:none;place-items:center;padding:18px;background:#010a12e8}.overlay.show{display:grid}.card{width:min(540px,96vw);padding:24px;border-radius:24px;background:#fff;color:#12302c;text-align:center}.score{font-size:36px;font-weight:1000;color:#0f766e}.btn{width:100%;background:#0f766e;color:#fff}.btn:disabled{opacity:.55}.sync{min-height:48px;font-weight:800;color:#0f766e}.loading{position:fixed;z-index:45;inset:60px 0 0;display:grid;place-items:center;background:#03131d;color:#fff}.loading.hide{display:none}.audit{margin:12px 0;padding:10px;border-radius:12px;background:#ecfdf5;color:#065f46;font-size:12px;font-weight:800}
</style>
</head>
<body>
<header class="bar"><button id="back" class="back">← ออกชั่วคราว</button><b id="title">HeroHealth</b><small id="status" class="status">กำลังเตรียมเกม</small></header>
<iframe id="game" allow="camera;microphone;fullscreen;autoplay"></iframe>
<section id="loading" class="loading"><b>กำลังเตรียมภารกิจ</b></section>
<section id="overlay" class="overlay"><div class="card"><div style="font-size:56px">🏆</div><h1 id="overlayTitle">จบภารกิจแล้ว</h1><div id="score" class="score">ผ่านเกณฑ์แล้ว</div><div id="audit" class="audit">กำลังตรวจสอบผล</div><p id="sync" class="sync">กำลังเตรียมบันทึกผล</p><button id="returnBtn" class="btn">บันทึกผลและไปภารกิจถัดไป</button></div></section>
<script src="./data/backend-config.js?v=20260727-public-mobile-receiver-v3"></script>
<script src="./assets/mobile-classroom-ui-v1.js?v=20260726-mobile-all-pages-v1"></script>
<script>
(()=>{'use strict';
const RELEASE='20260727-GAME-SHELL-STRICT-HANDWASH-R28';
const STATE_KEY='herohealth_learning_platform_rc2',QUEUE_KEY='herohealth_backend_queue_v7';
const RESULT_KEYS=['HHA_GROUPS_AR_LAST_RESULT','HHA_GOODJUNK_AR_LAST_RESULT','HHA_HANDWASH_LAST_RESULT','HHA_TOOTHBRUSH_LAST_RESULT','toothbrush_pending_result'];
const q=new URLSearchParams(location.search),target=q.get('target'),back=q.get('return')||'./index.html',sid=q.get('studentId')||'',zone=q.get('zone')||'',gameId=q.get('gameId')||'',section=q.get('section')||'',group=q.get('group')||'';
const strictHandwash=gameId==='handwash';
const f=document.getElementById('game'),ov=document.getElementById('overlay'),loading=document.getElementById('loading'),statusEl=document.getElementById('status'),returnBtn=document.getElementById('returnBtn'),syncEl=document.getElementById('sync'),auditEl=document.getElementById('audit'),endpoint=String(window.HH_CONFIG?.backend?.webAppUrl||'').trim();
const openedAtMs=Date.now(),openedAt=new Date(openedAtMs).toISOString(),sessionId=`GS-ONCE-${sid}-${zone}-${gameId}-${openedAtMs}-${Math.random().toString(36).slice(2,7)}`;
let startedAt='',startedAtMs=0,ended=false,syncing=false,iframeReady=false,result={completed:false,passed:false,score:0,accuracy:0,eventId:'',scoreAvailable:false};
document.getElementById('title').textContent=q.get('title')||gameId;
if(!target){statusEl.textContent='ไม่พบเกม';throw new Error('missing_target')}
const num=v=>{const n=Number(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0};
const yes=v=>v===true||v===1||String(v||'').toLowerCase()==='true'||String(v||'')==='1'||String(v||'').toLowerCase()==='yes';
const eid=()=>`HH-game-${zone}-${gameId}-${sid}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
function readJson(k,fallback){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(fallback))}catch(_){return fallback}}
function writeJson(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}}
function state(){return readJson(STATE_KEY,{})}
function enqueue(payload){const list=readJson(QUEUE_KEY,[]);if(!list.some(x=>x.eventId===payload.eventId)){list.push(payload);writeJson(QUEUE_KEY,list.slice(-80))}}
function dequeue(eventId){writeJson(QUEUE_KEY,readJson(QUEUE_KEY,[]).filter(x=>x.eventId!==eventId))}
function jsonp(params,timeout=30000){return new Promise((resolve,reject)=>{const cb='HHGAME_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const finish=(e,d)=>{if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch(_){}s.remove();e?reject(e):resolve(d)};const t=setTimeout(()=>finish(new Error('sheet_timeout')),timeout);window[cb]=d=>finish(null,d);s.onerror=()=>finish(new Error('sheet_load_failed'));s.src=endpoint+(endpoint.includes('?')?'&':'?')+new URLSearchParams({...params,callback:cb,_:Date.now()});document.head.appendChild(s)})}
function onStart(){if(!startedAt){startedAtMs=Date.now();startedAt=new Date(startedAtMs).toISOString();statusEl.textContent='กำลังเล่น'}}
function clearStaleResults(){try{const w=f.contentWindow;RESULT_KEYS.forEach(k=>{try{w.localStorage.removeItem(k)}catch(_){}});try{delete w.__TOOTHBRUSH_LAST_RESULT__}catch(_){};try{delete w.__HANDWASH_LAST_RESULT__}catch(_){};try{delete w.__GROUPS_LAST_RESULT__}catch(_){};try{delete w.__GOODJUNK_LAST_RESULT__}catch(_){} }catch(_){} }
function resultTimestamp(raw){for(const k of ['finishedAt','submittedAt','timestamp','ts','endedAt','createdAt']){const v=raw?.[k];if(!v)continue;const t=typeof v==='number'?v:Date.parse(v);if(Number.isFinite(t))return t}return 0}
function isFresh(raw){if(!raw||typeof raw!=='object'||!Object.keys(raw).length)return false;const t=resultTimestamp(raw);if(t&&t<openedAtMs-1500)return false;return startedAtMs>0||t>=openedAtMs-1500}
function rawResult(){try{const w=f.contentWindow;for(const k of RESULT_KEYS){try{const v=JSON.parse(w.localStorage.getItem(k)||'null');if(isFresh(v))return v}catch(_){}}const candidates=[w.__TOOTHBRUSH_LAST_RESULT__,w.__HANDWASH_LAST_RESULT__,w.__GROUPS_LAST_RESULT__,w.__GOODJUNK_LAST_RESULT__];for(const v of candidates){if(isFresh(v))return v}return{}}catch(_){return{}}}
function handwashAudit(raw){
 const rows=Array.isArray(raw?.steps)?raw.steps:Array.isArray(raw?.stepResults)?raw.stepResults:[];
 const rowDone=row=>yes(row?.completed)||['strict','grace','assist','pass','passed'].includes(String(row?.passMode||'').toLowerCase());
 const rubRows=rows.filter(row=>String(row.group||row.kind||'').toLowerCase().includes('rub'));
 const processRows=rows.filter(row=>String(row.group||row.kind||'').toLowerCase()==='process');
 const rubDone=num(raw?.completedRubSteps??raw?.whoStepsCompleted)||rubRows.filter(rowDone).length;
 const rubTotal=num(raw?.totalWhoRubSteps??raw?.totalRubSteps??raw?.whoStepsTotal)||rubRows.length;
 const processDone=num(raw?.completedProcessSteps)||processRows.filter(rowDone).length;
 const processTotal=num(raw?.totalProcessSteps)||processRows.length;
 const wrist=rows.find(row=>String(row?.id||'').toLowerCase()==='wrists'||num(row?.stepId??row?.whoStep)===8||/ข้อมือ/.test(String(row?.label||'')));
 const wristsPassed=yes(raw?.wristsPassed)||rowDone(wrist);
 const analyticsReady=String(raw?.analyticsSchemaVersion||'').includes('V2')&&num(raw?.metricCompletenessPct)>=90&&rows.length>=12&&Array.isArray(raw?.events);
 const valid=yes(raw?.passed)&&yes(raw?.completed)&&rubDone>=7&&rubTotal>=7&&processDone>=5&&processTotal>=5&&wristsPassed&&analyticsReady;
 return {valid,rubDone,rubTotal,processDone,processTotal,wristsPassed,analyticsReady,metricCompletenessPct:num(raw?.metricCompletenessPct),rowCount:rows.length};
}
function read(){
 try{
  const d=f.contentDocument,raw=rawResult();let score=num(raw.score??raw.totalScore);for(const id of ['score','scoreText','summaryScore','sumScore','finalScore'])score=Math.max(score,num(d?.getElementById(id)?.textContent));let accuracy=num(raw.accuracy??raw.direction_accuracy??raw.overall_direction_accuracy);for(const id of ['accuracy','accuracyText','summaryAccuracy','sumAccuracy'])accuracy=Math.max(accuracy,num(d?.getElementById(id)?.textContent));
  const scoreAvailable=score>0||raw.scoreAvailable===true;
  if(strictHandwash){const audit=handwashAudit(raw);result={...result,...raw,completed:audit.valid,passed:audit.valid,score,accuracy,scoreAvailable,eventId:raw.eventId||raw.attemptId||result.eventId||eid(),singleAttemptPolicy:true,skillCriteriaMet:audit.valid,originalPassed:raw.passed===true,handwashAudit:audit};}
  else result={...result,...raw,completed:true,passed:true,score,accuracy,scoreAvailable,eventId:raw.eventId||raw.record_id||result.eventId||eid(),singleAttemptPolicy:true,skillCriteriaMet:raw.passed===true||raw.learning_complete===true||String(raw.learning_complete||'').toLowerCase()==='yes',originalPassed:raw.passed===true};
 }catch(_){if(!strictHandwash)result={...result,completed:true,passed:true,eventId:result.eventId||eid(),singleAttemptPolicy:true}}
 return result;
}
function show(payload={}){
 if(ended||!startedAtMs)return;
 result={...result,...payload};read();
 if(strictHandwash&&!result.passed){const a=result.handwashAudit||handwashAudit(result);statusEl.textContent=`ยังไม่ผ่าน • ${a.rubDone}/7 ท่าถู • Analytics ${a.metricCompletenessPct}%`;return;}
 ended=true;document.getElementById('score').textContent=result.scoreAvailable?`${result.score} คะแนน`:'ผ่านเกณฑ์แล้ว';document.getElementById('overlayTitle').textContent=strictHandwash?'ผ่าน Handwash ครบ 7 ขั้น':'จบภารกิจแล้ว';
 if(strictHandwash){const a=result.handwashAudit||handwashAudit(result);auditEl.textContent=`ท่าถู ${a.rubDone}/7 • กระบวนการ ${a.processDone}/5 • รอบข้อมือผ่าน • Analytics ${a.metricCompletenessPct}%`;}
 else auditEl.textContent='เล่นครบหนึ่งรอบตาม Classroom Policy';
 ov.classList.add('show');statusEl.textContent='ผ่านเกณฑ์แล้ว';syncEl.textContent='พร้อมบันทึกผลและไปต่อ';setTimeout(finishAndGo,700);
}
function compactForSheet(value,depth=0){if(depth>5||value==null)return value==null?value:undefined;if(typeof value==='number'||typeof value==='boolean')return value;if(typeof value==='string')return value.slice(0,4000);if(Array.isArray(value))return value.slice(0,500).map(v=>compactForSheet(v,depth+1)).filter(v=>v!==undefined);if(typeof value==='object'){const out={};Object.keys(value).slice(0,300).forEach(k=>{if(/base64|imageData|videoData|rawFrame|blob/i.test(k))return;const v=compactForSheet(value[k],depth+1);if(v!==undefined)out[k]=v});return out}return undefined}
function makePayload(){
 const p=state().profile||{},eventId=result.eventId||eid();result.eventId=eventId;const raw=compactForSheet(result)||{};
 return{eventType:'game',eventId,studentId:sid,profile:{fullName:p.fullName||'',section:section||p.section||'',group:group||p.group||''},clientTs:new Date().toISOString(),currentStep:`${zone}:${gameId}`,status:result.passed?'ผ่านเกณฑ์ '+gameId:'ยังไม่ผ่าน '+gameId,game:{...raw,zone,gameId,score:num(result.score),accuracy:num(result.accuracy),scoreAvailable:result.scoreAvailable===true,passed:result.passed===true,completed:result.completed===true,finishedAt:new Date().toISOString(),sessionId,openedAt,startedAt:startedAt||openedAt,durationSec:Math.max(0,Math.round((Date.now()-Date.parse(startedAt||openedAt))/1000)),inputMode:result.inputMode||result.play_mode||'classroom-ar',gameVersion:result.gameVersion||result.version||'',singleAttemptPolicy:true,skillCriteriaMet:result.skillCriteriaMet===true,originalPassed:result.originalPassed===true,rawLearningComplete:result.learning_complete??'',rawChallengePassed:result.challenge_passed??'',rawEndReason:result.end_reason??result.endReason??'',analyticsSchemaVersion:result.analyticsSchemaVersion||'HH-UNIFIED-GAME-ANALYTICS-V1',shellRelease:RELEASE}};
}
function returnUrl(){const u=new URL(back,location.href);u.searchParams.set('authorityRefresh',Date.now());u.searchParams.set('gameSync','1');u.searchParams.set('queuedSync','1');return u.href}
async function finishAndGo(){
 if(syncing)return;read();if(strictHandwash&&!result.passed){syncEl.textContent='ยังไม่ผ่านเกณฑ์ Handwash';return}
 syncing=true;returnBtn.disabled=true;const p=makePayload();enqueue(p);
 try{
  syncEl.textContent='กำลังส่งผลและ Learning Analytics เข้า Google Sheet…';
  const ack=await jsonp({action:'submit',payload:JSON.stringify(p)},12000);
  if(!ack?.ok)throw new Error(ack?.error||'submit_failed');
  if(String(ack.eventId||'')!==String(p.eventId))throw new Error('event_ack_mismatch');
  if(strictHandwash&&ack.analyticsSaved!==true)throw new Error('analytics_not_confirmed');
  dequeue(p.eventId);syncEl.textContent='Google Sheet ยืนยันบันทึก Analytics แล้ว • กำลังไปภารกิจถัดไป…';setTimeout(()=>location.replace(returnUrl()),450);
 }catch(error){
  syncEl.textContent='ยังไม่ได้รับคำยืนยันจาก Sheet • เก็บคิวไว้และยังไม่ควรถือว่าตรวจครบ';statusEl.textContent='รอส่งข้อมูล';returnBtn.disabled=false;syncing=false;
 }
}
returnBtn.onclick=finishAndGo;document.getElementById('back').onclick=()=>location.href=new URL(back,location.href).href;
f.src=target;
f.addEventListener('load',()=>{loading.classList.add('hide');statusEl.textContent='พร้อมเริ่มเกม';iframeReady=true;clearStaleResults();try{const d=f.contentDocument;d.addEventListener('click',event=>{if(/เริ่ม|start|เปิดกล้อง|calibration|coach/i.test(String(event.target?.textContent||'')))onStart()},{capture:true})}catch(_){}});
addEventListener('message',event=>{if(event.origin!==location.origin)return;const message=event.data||{};if(message.type==='HEROHEALTH_GAME_STARTED')onStart();if(message.type==='HEROHEALTH_GAME_COMPLETE'&&message.payload){if(!startedAtMs)onStart();show(message.payload)}});
})();
</script>
</body>
</html>
