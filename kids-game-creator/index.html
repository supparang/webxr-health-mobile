<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kids Game Creator Phase 2.1</title><style>body{font:16px system-ui;background:#eef3ff;margin:0;padding:24px}main{max-width:760px;margin:auto;background:white;padding:24px;border-radius:18px}textarea,select,button{box-sizing:border-box;width:100%;margin:10px 0;padding:12px;font:inherit}textarea{min-height:120px}button{background:#3458db;color:white;border:0;border-radius:10px;cursor:pointer}pre{background:#f1f4fa;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>Kids Game Creator AI</h1><p>Phase 2.1 — ตัวตีความคำสั่งภาษาไทยแบบกฎ (ยังไม่เชื่อม AI จริง)</p><label for="ageLevel">ระดับชั้น</label><select id="ageLevel"><option value="p1">ป.1–ป.3</option><option value="p4" selected>ป.4–ป.6</option><option value="m1">ม.1–ม.3</option><option value="m4">ม.4–ม.6</option></select><label for="prompt">อธิบายเกม</label><textarea id="prompt">สร้างเกมกระต่ายผจญภัยในป่า เก็บแครอท 10 ชิ้น มี 3 ชีวิต และมี 3 ด่าน</textarea><button id="generate">สร้างโครงสร้างเกม</button><p id="status" role="status"></p><h2>ทดลองเล่นเกม</h2><canvas id="gameCanvas" hidden aria-label="เกมผจญภัย" style="display:block;max-width:100%;height:auto;border-radius:12px" width="720" height="400"></canvas><div style="display:flex;gap:8px;touch-action:none"><button type="button" data-control="left">◀ ซ้าย</button><button type="button" data-control="up">▲ ขึ้น</button><button type="button" data-control="jump">⤒ กระโดด</button><button type="button" data-control="down">▼ ลง</button><button type="button" data-control="right">ขวา ▶</button></div><button id="restart" type="button">เริ่มใหม่</button><h2>Game JSON</h2><pre id="output"></pre></main><script type="module" src="./js/app.js"></script></body></html>
