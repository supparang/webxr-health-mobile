<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kids Game Creator — สร้างเกมด้วยภาษาไทย</title><style>body{font:16px system-ui;background:#eef3ff;margin:0;padding:24px}main{max-width:760px;margin:auto;background:white;padding:24px;border-radius:18px}textarea,select,button{box-sizing:border-box;width:100%;margin:10px 0;padding:12px;font:inherit}textarea{min-height:120px}button{background:#3458db;color:white;border:0;border-radius:10px;cursor:pointer}pre{background:#f1f4fa;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}#gameControls:not([hidden]){display:flex}.quiz-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.quiz-choices button{margin:0}.quiz-choices button:disabled{opacity:.65}.genre-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}.genre-card{background:#f0f5ff;color:#172a52;border:2px solid #d9e4ff;border-radius:14px;padding:16px;text-align:left;min-height:120px;cursor:pointer}.genre-card strong{display:block;font-size:19px;margin-bottom:6px}.genre-card span{font-size:14px}.genre-card:focus-visible{outline:3px solid #3458db;outline-offset:2px}</style></head><body><main><h1>🎮 Kids Game Creator</h1><p>เลือกแนวเกมที่ชอบ แล้วแก้คำอธิบายเป็นภาษาไทยได้เลย</p><h2>อยากสร้างเกมแบบไหน?</h2><div class="genre-grid" aria-label="ตัวอย่างแนวเกม"><button class="genre-card" type="button" data-example="สร้างเกมกระต่ายผจญภัยในป่า เก็บแครอท 10 ชิ้น มี 3 ชีวิต และมี 3 ด่าน"><strong>🐰 ผจญภัย</strong><span>วิ่ง กระโดด เก็บของ และผ่านด่าน</span></button><button class="genre-card" type="button" data-example="สร้างเกมเขาวงกตในปราสาท มี 3 ด่าน"><strong>🧩 เขาวงกต</strong><span>หาทางออกจากเส้นทางที่ซับซ้อน</span></button><button class="genre-card" type="button" data-example="สร้างเกมตอบคำถามวิทยาศาสตร์"><strong>🧠 ตอบคำถาม</strong><span>เลือกคำตอบ รับคะแนน และอ่านเฉลย</span></button><button class="genre-card" type="button" data-example="สร้างเกมยานอวกาศหลบอุกกาบาต ทำ 10 คะแนน มี 3 ชีวิต"><strong>🚀 หลบสิ่งกีดขวาง</strong><span>เคลื่อนตัวหลบอุปสรรคและสะสมคะแนน</span></button></div><p><small>ต้นแบบนี้มีเกม 4 แนว และยังใช้ระบบตีความภาษาไทยแบบกฎ ไม่ใช่ AI สร้างเกมอิสระทุกประเภท</small></p><label for="ageLevel">ระดับชั้น</label><select id="ageLevel"><option value="p1">ป.1–ป.3</option><option value="p4" selected>ป.4–ป.6</option><option value="m1">ม.1–ม.3</option><option value="m4">ม.4–ม.6</option></select><label for="prompt">อธิบายเกม</label><textarea id="prompt">สร้างเกมกระต่ายผจญภัยในป่า เก็บแครอท 10 ชิ้น มี 3 ชีวิต และมี 3 ด่าน</textarea><button id="generate">สร้างโครงสร้างเกม</button><p id="status" role="status"></p><h2>ทดลองเล่นเกม</h2><canvas id="gameCanvas" hidden aria-label="เกม" style="max-width:100%;height:auto;border-radius:12px" width="720" height="400"></canvas><section id="quizPanel" hidden aria-label="เกมตอบคำถาม"></section><div id="gameControls" hidden style="gap:8px;touch-action:none;flex-wrap:wrap"><button type="button" data-control="left">◀ ซ้าย</button><button type="button" data-control="up">▲ ขึ้น</button><button type="button" data-control="jump">⤒ กระโดด</button><button type="button" data-control="down">▼ ลง</button><button type="button" data-control="right">ขวา ▶</button></div><button id="restart" type="button">เริ่มใหม่</button><h2>Game JSON</h2><pre id="output"></pre></main><script type="module" src="./js/app.js"></script><script>document.querySelectorAll("[data-example]").forEach(button=>button.addEventListener("click",()=>{document.querySelector("#prompt").value=button.dataset.example;document.querySelector("#generate").click();document.querySelector("#status").scrollIntoView({behavior:"smooth",block:"center"});}));</script></body></html>
