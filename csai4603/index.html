  document.getElementById("ui-week").innerText = Math.min(playerState.unlockedWeek, 15);
  document.getElementById("ui-score").innerText = playerState.totalScore.toLocaleString();

  const grid = document.getElementById("weeks-grid");
  grid.innerHTML = "";

  WEEKS_DATA.forEach(item => {
    const isUnlocked = item.week <= playerState.unlockedWeek;
    const isCleared = item.week < playerState.unlockedWeek;

    const card = document.createElement("div");
    card.className = `week-card ${isCleared ? "cleared" : (isUnlocked ? "unlocked" : "locked")}`;

    let statusText = "🔒 ต้องผ่าน Week " + (item.week - 1) + " ก่อน";
    if (isCleared) statusText = "✅ ปราบ Boss สำเร็จแล้ว (เล่นซ้ำได้)";
    else if (isUnlocked) statusText = "⚔️ ท้าสู้ Boss ประจำสัปดาห์!";

    card.innerHTML = `
      <div>
        <div style="display:flex; justify-content:space-between; font-size:12px; color:#94a3b8; font-weight:bold;">
          <span>WEEK ${item.week}</span>
          <span style="color:#38bdf8;">${item.chapter}</span>
        </div>
        <div style="font-weight:bold; margin:8px 0; font-size:14px; line-height:1.4;">${item.title}</div>
      </div>
      <div>
        <div style="font-size:12px; color:#fda4af; margin-bottom:8px;">👾 Boss: <strong>${item.boss}</strong></div>
        <div style="font-size:12px; font-weight:bold; padding:6px; border-radius:6px; background:rgba(0,0,0,0.3); text-align:center;">
          ${statusText}
        </div>
      </div>
    `;

    if (isUnlocked) {
      card.onclick = () => startBossBattle(item);
    }
    grid.appendChild(card);
  });
}

// =========================================================================
// 5. ระบบต่อสู้กับ Boss (ต้องตอบถูกครบ 3 ข้อเพื่อลด HP Boss จนเหลือ 0)
// =========================================================================
const canvas = document.getElementById("battleCanvas");
const ctx = canvas.getContext("2d");
let animationId = null;

function startBossBattle(weekObj) {
  currentBattle.weekObj = weekObj;
  currentBattle.qIndex = 0;
  currentBattle.bossMaxHP = 300;
  currentBattle.bossHP = 300;
  currentBattle.playerHP = 100;
  currentBattle.answeredCurrent = false;

  document.getElementById("map-screen").style.display = "none";
  document.getElementById("battle-screen").style.display = "block";
  document.getElementById("battle-title").innerText =
    `Week ${weekObj.week} (${weekObj.chapter}): ปะทะ ${weekObj.boss}`;

  loadQuestion();
  if (!animationId) gameLoop();
}

function gameLoop() {
  currentBattle.animFrame++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // พื้นหลังสนามประลองไซเบอร์
  ctx.strokeStyle = "#1e293b";
  for (let x = 0; x < canvas.width; x += 45) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }

  // วาดผู้เล่น (ฝั่งซ้าย)
  ctx.fillStyle = "#38bdf8";
  ctx.fillRect(90, 115, 65, 65);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px Tahoma";
  ctx.fillText(`🛡️ นักศึกษา CSAI (HP: ${currentBattle.playerHP}/100)`, 45, 80);

  // หลอดเลือดผู้เล่น
  ctx.fillStyle = "#334155";
  ctx.fillRect(45, 90, 180, 12);
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(45, 90, (currentBattle.playerHP / 100) * 180, 12);

  // วาด Boss ประจำสัปดาห์ (ฝั่งขวา)
  const bounce = Math.sin(currentBattle.animFrame * 0.08) * 8;
  ctx.fillStyle = "#f43f5e";
  ctx.fillRect(670, 95 + bounce, 95, 85);
  ctx.fillStyle = "#fff";
  ctx.fillText(`👾 ${currentBattle.weekObj.boss} (HP: ${currentBattle.bossHP}/${currentBattle.bossMaxHP})`, 520, 65);

  // หลอดเลือด Boss
  ctx.fillStyle = "#334155";
  ctx.fillRect(520, 75, 280, 14);
  ctx.fillStyle = "#f43f5e";
  ctx.fillRect(520, 75, (currentBattle.bossHP / currentBattle.bossMaxHP) * 280, 14);

  animationId = requestAnimationFrame(gameLoop);
}

function loadQuestion() {
  currentBattle.answeredCurrent = false;
  document.getElementById("feedback-box").style.display = "none";
  document.getElementById("next-q-btn").style.display = "none";

  const w = currentBattle.weekObj;
  const qObj = w.questions[currentBattle.qIndex];

  document.getElementById("question-progress").innerText =
    `⚡ เฟสการโจมตีที่ ${currentBattle.qIndex + 1} / ${w.questions.length} — หัวข้อ: ${w.title}`;
  document.getElementById("question-text").innerText = qObj.q;

  const box = document.getElementById("choices-box");
  box.innerHTML = "";

  const thaiLabels = ["ก", "ข", "ค", "ง"];
  qObj.choices.forEach((choiceText, idx) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerText = `${thaiLabels[idx]}. ${choiceText}`;
    btn.onclick = () => checkAnswer(idx, btn);
    box.appendChild(btn);
  });
}

function checkAnswer(selectedIndex, btnElement) {
  if (currentBattle.answeredCurrent) return;

  const w = currentBattle.weekObj;
  const qObj = w.questions[currentBattle.qIndex];
  const feedback = document.getElementById("feedback-box");

  if (selectedIndex === qObj.ans) {
    currentBattle.answeredCurrent = true;
    currentBattle.bossHP = Math.max(0, currentBattle.bossHP - 100);
    btnElement.style.borderColor = "#22c55e";
    btnElement.style.background = "#143529";

    feedback.style.display = "block";
    feedback.style.background = "#0f291e";
    feedback.style.border = "1px solid #22c55e";
    feedback.innerHTML = `✅ <strong>โจมตีเข้าจุดอ่อน Boss (-100 HP)!</strong><br>คำอธิบายเชิงวิชาการ: ${qObj.exp}`;

    document.getElementById("next-q-btn").style.display = "inline-block";
    if (currentBattle.bossHP === 0) {
      document.getElementById("next-q-btn").innerText = "🏆 รับรางวัลและปลดล็อกด่านถัดไป!";
    } else {
      document.getElementById("next-q-btn").innerText = "โจมตีเฟสถัดไป ➔";
    }
  } else {
    currentBattle.playerHP = Math.max(0, currentBattle.playerHP - 50);
    btnElement.style.borderColor = "#f43f5e";
    btnElement.style.background = "#3b1219";

    feedback.style.display = "block";
    feedback.style.background = "#3b1219";
    feedback.style.border = "1px solid #f43f5e";
    feedback.innerHTML = `❌ <strong>ตอบผิด! ถูก ${w.boss} โจมตีสวนกลับ (-50 HP)</strong> กรุณาวิเคราะห์และเลือกคำตอบที่ถูกต้องอีกครั้ง!`;

    if (currentBattle.playerHP <= 0) {
      setTimeout(() => {
        alert("💥 พลังชีวิตของคุณหมด! กรุณาทบทวนเนื้อหาบทเรียนสัปดาห์นี้แล้วกลับมาท้าสู้ Boss ใหม่อีกครั้ง");
        backToMap();
      }, 300);
    }
  }
}

function nextQuestionStep() {
  const w = currentBattle.weekObj;
  if (currentBattle.qIndex + 1 < w.questions.length) {
    currentBattle.qIndex++;
    loadQuestion();
  } else {
    // ชนะ Boss ประจำสัปดาห์
    const earnedScore = w.week * 150;
    playerState.totalScore += earnedScore;

    if (w.week === playerState.unlockedWeek && playerState.unlockedWeek <= 15) {
      playerState.unlockedWeek++;
    }

    saveProgressAndCloud();
    alert(`🎉 ปราบ ${w.boss} ประจำ Week ${w.week} สำเร็จ!\nได้รับคะแนน +${earnedScore} คะแนน และปลดล็อกด่านถัดไปเรียบร้อยแล้ว!`);
    backToMap();
  }
}

function backToMap() {
  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }
  document.getElementById("battle-screen").style.display = "none";
  document.getElementById("map-screen").style.display = "block";
  renderMap();
}

// =========================================================================
// 6. การบันทึกข้อมูลลง LocalStorage & Google Sheets (Apps Script)
// =========================================================================
async function saveProgressAndCloud() {
  localStorage.setItem("csai4603_full_save", JSON.stringify(playerState));
  renderMap();

  if (!WEB_APP_URL.startsWith("http")) return;

  const playerName = document.getElementById("player-name").value.trim() || "CSAI_Student01";
  const payload = {
    playerName: playerName,
    unlockedWeek: playerState.unlockedWeek,
    totalScore: playerState.totalScore,
    sessionToken: SESSION_TOKEN
  };

  try {
    await fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  } catch (err) {
    console.error("Cloud save error:", err);
  }
}

async function loadProgressFromCloud() {
  const playerName = document.getElementById("player-name").value.trim();
  if (!WEB_APP_URL.startsWith("http")) {
    alert("ขณะนี้ใช้ระบบบันทึกอัตโนมัติในเบราว์เซอร์ (LocalStorage) หากต้องการเชื่อม Google Sheets กรุณานำ URL ของ Web App มาใส่ในตัวแปร WEB_APP_URL ครับ");
    return;
  }
  try {
    const res = await fetch(`${WEB_APP_URL}?action=loadPlayer&playerName=${encodeURIComponent(playerName)}`);
    const data = await res.json();
    if (data.status === "success" || data.status === "new_player") {
      playerState.unlockedWeek = data.unlockedWeek;
      playerState.totalScore = data.totalScore;
      localStorage.setItem("csai4603_full_save", JSON.stringify(playerState));
      renderMap();
      alert(`☁️ โหลดข้อมูลของ ${playerName} สำเร็จ! (ปลดล็อกถึง Week ${Math.min(playerState.unlockedWeek, 15)})`);
    }
  } catch (err) {
    console.error("Load error:", err);
  }
}

function resetLocalProgress() {
  if (confirm("ต้องการรีเซ็ตความคืบหน้ากลับไปเริ่มที่ Week 1 ใหม่หรือไม่?")) {
    playerState = { unlockedWeek: 1, totalScore: 0 };
    localStorage.setItem("csai4603_full_save", JSON.stringify(playerState));
    renderMap();
  }
}

// โหลดเซฟเมื่อเปิดหน้าเว็บ
const saved = localStorage.getItem("csai4603_full_save");
if (saved) {
  playerState = JSON.parse(saved);
}
renderMap();
</script>
