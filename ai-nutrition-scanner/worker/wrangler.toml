name = "nutrilens-th-api"
main = "src/index.js"
compatibility_date = "2025-10-01"

[vars]
AI_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-2.5-flash"
ALLOWED_ORIGINS = "https://supparang.github.io,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8787"
RATE_LIMIT_MAX_PER_MIN = "15"

# Secrets (set once via CLI — NEVER commit keys here):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put STUDY_ACCESS_CODE   # optional cohort passcode
