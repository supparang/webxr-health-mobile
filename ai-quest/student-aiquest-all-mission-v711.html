<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071426">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<title>CSAI2102 • Mission v7.3.2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071426;color:#e8f1ff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
#missionCore{display:block;width:100%;height:100%;border:0;background:#071426}
.loading{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#071426;color:#dbeafe;font-weight:800;text-align:center;padding:24px}
.loading.hide{display:none}.loading.bad{color:#fecdd3}
</style>
</head>
<body>
<div id="loading" class="loading">กำลังเปิด Mission…</div>
<iframe id="missionCore" title="CSAI2102 Mission Core"></iframe>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search);
var mission=String(q.get('mission')||q.get('session')||'s1').toLowerCase().replace(/^m(?=\d)/,'s').replace(/^boss/,'b');
var studentId=String(q.get('studentId')||'').trim();
var studentName=String(q.get('studentName')||'').trim();
var section=String(q.get('section')||'101').trim();
var integrated=!!studentId||String(q.get('integrated')||q.get('release')||'').toLowerCase().indexOf('integrated')>=0;
var frame=document.getElementById('missionCore');
var loading=document.getElementById('loading');
var target=new URL('./student-aiquest-all-mission-v711-core.html',location.href);
var timers=[];
var intervalId=0;

var PROMPTS={
 s1:['หลักฐานใดทำให้จัดระบบใน Case เป็น AI, Automation, ML หรือ GenAI','Threshold หรือข้อมูลใดทำให้การตัดสินใจเปลี่ยน และเพราะเหตุใด','งานใดควรใช้ AI และงานใดใช้ Automation ก็เพียงพอ พร้อมความเสี่ยง'],
 s2:['ระบุ PEAS ของ Agent ใน Case ให้ครบ','Environment เป็น observable, deterministic และ static หรือไม่ เพราะเหตุใด','Agent ควรใช้ Percept, Internal state, Goal หรือ Utility อย่างไร'],
 s3:['กำหนด Start state, Goal, Actions, Transition และ Cost ของ Search problem','เปรียบเทียบ BFS กับ DFS ด้าน Completeness, Optimality, Time และ Memory','Visited set และ Parent/Path reconstruction ช่วยแก้ปัญหาใด'],
 b1:['เชื่อม AI identity, PEAS และ Search formulation ของระบบ','เหตุใดจึงเลือก BFS หรือ DFS และมีข้อจำกัดใด','ควรวาง Safe fallback, Evidence และ Human review อย่างไรก่อนผ่าน Boss'],
 s4:['UCS ต่างจาก BFS อย่างไรเมื่อ Step cost ไม่เท่ากัน','Priority queue, g(n), Best cost และ Parent ทำงานร่วมกันอย่างไร','UCS รับประกัน Optimality ภายใต้เงื่อนไขใด'],
 s5:['อธิบายบทบาท g(n), h(n) และ f(n)','Heuristic มาจาก Relaxed problem ใด และ Admissible/Consistent หรือไม่','Heuristic ที่ Overestimate กระทบ Optimality อย่างไร'],
 s6:['ระบุ MAX, MIN, Terminal utility และ Action ที่ Minimax เลือก','Alpha-beta ตัดกิ่งใดได้ และ Move ordering ส่งผลอย่างไร','Evaluation function หรือ Depth cutoff ที่ไม่ดีทำให้ Agent ผิดอย่างไร'],
 b2:['เชื่อม S4–S6 และเลือก UCS, A* หรือ Minimax พร้อมเหตุผล','การเลือก Algorithm ผิดกระทบ Time, Memory, Cost หรือ Optimality อย่างไร','ควรตรวจ Cost, Heuristic, Opponent response และ Fallback อะไร'],
 s7:['แยก Facts, Rules, Relations และข้อสรุปที่ Entail','Forward chaining และ Backward chaining เหมาะกับส่วนใด','Exception, Conflict หรือ Inconsistency ใดต้องจัดการ'],
 s8:['ระบุ Prior, Likelihood, Evidence และ Posterior','Base rate และ Conditional independence ส่งผลต่อการคำนวณอย่างไร','ควรสื่อสาร Probability และ Uncertainty อย่างไร'],
 s9:['ระบุ Knowledge base, Inference engine, Matched rule และ Explanation','Logical conflict หรือ Rule conflict ใดเกิดขึ้นและแก้อย่างไร','เมื่อใดควรหยุดสรุปและส่งต่อผู้เชี่ยวชาญมนุษย์'],
 b3:['เชื่อม Knowledge, Logic และ Probability ใน Case','Confidence, Evidence และ Explanation สนับสนุน Decision อย่างไร','Uncertainty, Bias หรือ Rule conflict ใดต้อง Expert review'],
 s10:['อธิบาย Features, Labels และ Train-Validation-Test split','จุดใดเสี่ยง Data leakage, Dirty labels หรือ Sampling bias','ควรบันทึก Seed, Version, Preprocessing และ Evaluation อย่างไร'],
 s11:['Case เป็น Classification หรือ Regression และควรใช้ Metric ใด','Threshold ทำให้ False positive และ False negative เปลี่ยนอย่างไร','เลือก Precision, Recall หรือ F1 จาก Cost ของ Error อย่างไร'],
 s12:['อธิบาย Assignment, Centroid update และการเลือก k','Initialization, Outlier หรือ Minority group ทำให้ Cluster เปลี่ยนอย่างไร','PCA หรือ Hierarchical clustering ช่วยอะไรและมีข้อจำกัดอะไร'],
 b4:['เชื่อม Pipeline, Model, Metric และหลักฐาน Generalization','มี Leakage, Imbalance, Overfitting หรือ Underfitting ตรงไหน','ก่อน Deploy ต้องตรวจ Performance, Fairness, Monitoring และ Rollback อะไร'],
 s13:['Weight, Bias และ Activation ทำให้ Neuron output เปลี่ยนอย่างไร','Loss, Gradient และ Backpropagation อัปเดต Network อย่างไร','ข้อมูลเหมาะกับ CNN, RNN หรือ Transformer เพราะเหตุใด'],
 s14:['กำหนด States, Actions, Transitions, Rewards และ Policy ของ MDP','Alpha, Gamma, TD target และ Epsilon ส่งผลต่อ Q-learning อย่างไร','Reward design ใดอาจทำให้ Reward hacking และป้องกันอย่างไร'],
 s15:['LLM, Foundation model และ Generative AI ต่างกันอย่างไร','Retrieval, Context, Generation, Grounding และ Citation เชื่อมกันอย่างไร','เมื่อหลักฐานไม่พอควร Fallback, ปฏิเสธตอบ หรือส่งต่อมนุษย์เมื่อใด'],
 b5:['ระบบรวม Agent, Search, Reasoning, ML, NN, RL และ GenAI อย่างไร','ตรวจ Fairness, Privacy, Transparency, Safety และ Accountability อย่างไร','Human oversight, Audit log, Monitoring, Incident response และ Appeal ควรทำงานอย่างไร']
};

q.forEach(function(v,k){target.searchParams.set(k,v);});
target.searchParams.set('mission',mission);
target.searchParams.set('integrated',integrated?'1':'0');
target.searchParams.set('ui','aligned-runtime-v732');
target.searchParams.set('contentRelease','aligned732');
target.searchParams.set('_',Date.now());

function innerDoc(){
 try{return frame.contentDocument||frame.contentWindow.document;}catch(e){return null;}
}
function mapUrl(){
 var u=new URL('./course-map-all-v720.html',location.href);
 if(studentId)u.searchParams.set('studentId',studentId);
 if(studentName)u.searchParams.set('studentName',studentName);
 u.searchParams.set('section',section);
 u.searchParams.set('from',mission);
 u.searchParams.set('release','aligned732');
 u.searchParams.set('_',Date.now());
 return u.href;
}
function goMap(e){
 if(e){e.preventDefault();e.stopPropagation();if(typeof e.stopImmediatePropagation==='function')e.stopImmediatePropagation();}
 window.top.location.href=mapUrl();
 return false;
}
function addStyle(d){
 if(!d||d.getElementById('integratedCompactStyle'))return;
 var s=d.createElement('style');
 s.id='integratedCompactStyle';
 s.textContent='body.integrated-mode .wrap{max-width:900px}body.integrated-mode main.wrap>header.top{margin-bottom:4px}body.integrated-mode main.wrap>header.top #sub{display:none}body.integrated-mode .integrated-profile-card{display:none!important}@media(max-width:780px){body.integrated-mode .wrap{padding:10px}body.integrated-mode main.wrap>header.top{display:none}body.integrated-mode #entry>.card:first-child{margin-top:0;padding:13px}body.integrated-mode #entry>.card:last-child{padding:12px}body.integrated-mode #start{width:100%;justify-content:center;padding:13px}}';
 d.head.appendChild(s);
}
function bindMap(d){
 if(!d)return;
 Array.prototype.forEach.call(d.querySelectorAll('a,button'),function(el){
  var text=String(el.textContent||'').trim();
  var href=String(el.getAttribute&&el.getAttribute('href')||'');
  if(text==='แผนที่'||/course-map/i.test(href)){
   if(el.dataset.aiqMapBound==='1')return;
   el.dataset.aiqMapBound='1';
   el.style.display='';
   if(el.tagName==='A')el.href=mapUrl();
   el.addEventListener('click',goMap,true);
  }
 });
}
function patchPrompts(d){
 if(!d)return;
 var p=PROMPTS[mission]||PROMPTS.s1;
 var labels=[d.getElementById('l1'),d.getElementById('l2'),d.getElementById('l3')];
 labels.forEach(function(el,i){var t=(i+1)+') '+p[i];if(el&&el.textContent!==t)el.textContent=t;});
 var intro=d.getElementById('promptIntro');
 var text=mission.toUpperCase()+' • Reflection ต้องอ้างอิง Case และแนวคิดเฉพาะของด่าน';
 if(intro&&intro.textContent!==text)intro.textContent=text;
}
function patchIdentity(d){
 if(!integrated||!d)return;
 d.body.classList.add('integrated-mode');
 var sid=d.getElementById('sid'),name=d.getElementById('name'),sec=d.getElementById('section');
 if(sid&&studentId){sid.value=studentId;sid.readOnly=true;}
 if(name&&studentName){name.value=studentName;name.readOnly=true;}
 if(sec){sec.value=section;sec.readOnly=true;}
 var save=d.getElementById('saveProfile');
 if(save){var card=save.closest('.card');if(card)card.classList.add('integrated-profile-card');}
}
function patchLabels(d){
 if(!d)return;
 try{
  var C=frame.contentWindow.AIQuestAllContentV702;
  var spec=C&&C.spec?C.spec(mission):(C&&C.sessions?C.sessions[mission]:null);
  var title=d.getElementById('title'),desc=d.getElementById('desc');
  if(spec&&title)title.textContent=(spec.code||mission.toUpperCase())+' • '+(spec.title||'Mission');
  if(spec&&desc)desc.textContent=(spec.mission||'')+(spec.theme?' • '+spec.theme:'');
 }catch(e){}
}
function patch(){
 var d=innerDoc();
 if(!d||!d.body)return;
 addStyle(d);bindMap(d);patchPrompts(d);patchIdentity(d);patchLabels(d);
 Array.prototype.forEach.call(d.querySelectorAll('.notice.bad,.fb.bad'),function(el){
  if(/studentGate unavailable|ตรวจสิทธิ์จาก Sheet ไม่สำเร็จ/i.test(String(el.textContent||'')))el.style.display='none';
 });
}
function installRuntime(d){
 if(!d||d.documentElement.dataset.aiqRuntime732==='1')return;
 d.documentElement.dataset.aiqRuntime732='1';
 var w=frame.contentWindow;
 var runtime=d.createElement('script');
 runtime.src='./js/aiquest-runtime-alignment-v732.js?v=20260727-runtime732&_='+Date.now();
 runtime.onload=function(){
  try{
   var C=w.AIQuestAllContentV702;
   if(C){C.__challengeV731=false;C.__challengeV713=false;C.__challengeV7128=false;C.__challengeV706=false;}
   try{w.AIQuestChallengeLayerV731=null;}catch(e){}
   var challenge=d.createElement('script');
   challenge.src='./js/aiquest-challenge-layer-v706.js?v=20260727-full731&_='+Date.now();
   challenge.onload=function(){patch();};
   challenge.onerror=function(){console.error('[AIQuest] aligned challenge layer failed to load');};
   d.head.appendChild(challenge);
  }catch(e){console.error('[AIQuest] runtime challenge reload failed',e);}
 };
 runtime.onerror=function(){console.error('[AIQuest] runtime alignment file failed to load');};
 d.head.appendChild(runtime);
}

frame.addEventListener('load',function(){
 var d=innerDoc();
 loading.className='loading hide';
 installRuntime(d);
 patch();
 [180,450,900,1600,3000,5000].forEach(function(ms){timers.push(setTimeout(patch,ms));});
 intervalId=setInterval(patch,700);
},{once:true});
frame.addEventListener('error',function(){
 loading.className='loading bad';
 loading.textContent='เปิด Mission ไม่สำเร็จ กรุณารีเฟรชหน้าอีกครั้ง';
},{once:true});
window.addEventListener('beforeunload',function(){timers.forEach(clearTimeout);if(intervalId)clearInterval(intervalId);});
frame.src=target.href;
})();
</script>
</body>
</html>
