<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>CSAI2102 • Opening Current Session</title>
<script>
(function(){
  'use strict';
  var current=new URL(location.href),mission=String(current.searchParams.get('mission')||current.searchParams.get('session')||'s1').toLowerCase().replace(/^m(?=\d)/,'s').replace(/^boss/,'b');
  var studentId=String(current.searchParams.get('studentId')||'').trim(),studentName=String(current.searchParams.get('studentName')||'').trim();
  function read(key){try{return JSON.parse(localStorage.getItem(key)||sessionStorage.getItem(key)||'{}')}catch(e){return {}}}
  var saved=read('CSAI2102_IDENTITY_V1'),legacy=read('CSAI2102_AIQUEST_PROFILE_V421');
  studentId=studentId||String(saved.studentId||legacy.studentId||'').trim();studentName=studentName||String(saved.studentName||legacy.studentName||legacy.name||'').trim();
  var target=new URL(studentId&&studentName?'./student-session-integrated-v723.html':'./course-map-all-v720.html',location.href);
  target.searchParams.set('section','101');target.searchParams.set('from','legacy-core3-v646');target.searchParams.set('_',Date.now());
  if(studentId&&studentName){target.searchParams.set('mission',mission);target.searchParams.set('session',mission.toUpperCase());target.searchParams.set('studentId',studentId);target.searchParams.set('studentName',studentName);}
  location.replace(target.href);
})();
</script>
</head>
<body style="margin:0;background:#071426;color:#e8f1ff;font-family:system-ui;padding:24px">กำลังเปิดระบบ CSAI2102 รุ่นปัจจุบัน…</body>
</html>
