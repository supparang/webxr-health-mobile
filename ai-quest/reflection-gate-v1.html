<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>CSAI2102 • Reflection Gate</title>
<style>
:root{--bg:#071426;--panel:#101d33;--line:#334155;--text:#e8f1ff;--muted:#a9bad3;--blue:#0369a1;--green:#07875a;--bad:#9f1239;--amber:#a16207}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:920px;margin:auto;padding:16px 12px 90px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.hero{border-color:#38bdf8}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#065f46;color:#d1fae5;font-weight:900}.muted{color:var(--muted);line-height:1.55}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#132238;white-space:pre-wrap;line-height:1.5}.notice.good{background:#064e3b;border-color:#15803d;color:#d1fae5}.notice.bad{background:#4c1d2b;border-color:var(--bad);color:#fecdd3}.notice.wait{background:#3a2505;border-color:var(--amber);color:#fde68a}label{display:block;font-weight:850;margin:15px 0 7px;line-height:1.45}textarea{width:100%;min-height:120px;padding:12px;border:1px solid #475569;border-radius:12px;background:#17263f;color:#fff;font:inherit}.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}.counter.ok{color:#bbf7d0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:#17263f;color:#fff;font:inherit;font-weight:900;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}.btn:disabled{opacity:.48;cursor:not-allowed}@media(max-width:640px){main{padding:10px 8px 90px}.card{padding:14px}.actions{display:grid}.btn{width:100%}}
</style>
</head>
<body><main>
<section class="card hero"><span id="badge" class="badge">S1</span><h1 id="title">Reflection</h1><p id="identity" class="muted"></p><div id="authority" class="notice wait">กำลังยืนยัน Mission และ Coding จาก Google Sheet…</div></section>
<section id="formCard" class="card" hidden>
<h2>3 • Reflection</h2>
<p class="muted">ตอบโดยเชื่อมหลักฐานจาก Mission กับ Coding Lab ข้อละอย่างน้อย 55 ตัวอักษร และทั้ง 3 ข้อต้องเป็นคนละประเด็น</p>
<label id="l1" for="r1">1. Reflection</label><textarea id="r1"></textarea><div id="c1" class="counter">0/55</div>
<label id="l2" for="r2">2. Reflection</label><textarea id="r2"></textarea><div id="c2" class="counter">0/55</div>
<label id="l3" for="r3">3. Reflection</label><textarea id="r3"></textarea><div id="c3" class="counter">0/55</div>
<div class="actions"><button id="submit" class="btn green" disabled>ส่ง Reflection และจบ Session</button><a id="map" class="btn">กลับแผนที่</a></div>
<div id="status" class="notice" style="margin-top:12px">ยังไม่ได้ส่ง</div>
</section>
<section id="blocked" class="card" hidden><div id="blockedText" class="notice bad"></div><div class="actions"><a id="backSession" class="btn blue">กลับ Session</a><a id="blockedMap" class="btn">กลับแผนที่</a></div></section>
<script>
(function(){'use strict';
const API='https://script.google.com/macros/s/AKfycbwXSUHbhVbZtKcjNIDzs4TawAohdeInm1MxLpomVeST2JilOL3L0LWQtT4_Yb7fbJG9/exec';
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id),MIN=55;
const raw=(q.get('session')||q.get('mission')||'S1').toUpperCase();const session=raw.replace(/^M(?=\d)/,'S').replace(/^BOSS/,'B');const mission=session.toLowerCase();
const sid=(q.get('studentId')||'').trim(),name=(q.get('studentName')||'').trim(),section=(q.get('section')||'101').trim();
const PROMPTS={
S1:['จาก Mission หลักฐานใดทำให้จัดระบบเป็น AI, Automation, ML หรือ Generative AI','ใน Coding Lab การเปลี่ยน Threshold หรือข้อมูลทดสอบทำให้ผลเปลี่ยนอย่างไร','เสนอกรณีที่ควรใช้ AI และกรณีที่ Automation ธรรมดาเพียงพอ พร้อมความเสี่ยง'],
S2:['ระบุ PEAS และประเภท Task environment ของ Agent ใน Mission','Completed Code ใช้ Percept, Internal state, Goal หรือ Utility อย่างไร','ถ้า Sensor ไม่ครบหรือผิดพลาด Agent ควรมี Safe fallback และ Human oversight แบบใด'],
S3:['กำหนด Start state, Goal, Actions, Transition และ Cost ของ Search problem','BFS และ DFS ต่างกันด้าน Frontier, Completeness, Optimality และ Memory อย่างไร','Visited set และ Parent/Path ใน Coding Lab ช่วยป้องกันหรือแก้ปัญหาใด'],
B1:['อธิบายการเชื่อม AI identity, PEAS และ BFS/DFS ในระบบ Boss','Coding Lab เชื่อม Percept, Internal state, Goal และ Route planning อย่างไร','ข้อจำกัดใดต้องมี Evidence, Safe fallback และ Human review ก่อนผ่าน Boss'],
S4:['UCS ต่างจาก BFS อย่างไรเมื่อ Step cost ไม่เท่ากัน','Priority queue, g(n), Best cost และ Parent ใน Coding Lab ทำงานร่วมกันอย่างไร','UCS รับประกัน Optimality ภายใต้เงื่อนไขใด และ Case นี้ตรงเงื่อนไขหรือไม่'],
S5:['อธิบายบทบาท g(n), h(n) และ f(n) ใน Mission','Heuristic และ Path reconstruction ใน Coding Lab ทำงานอย่างไร','Heuristic ที่ไม่ Admissible หรือไม่ Consistent อาจทำให้ผลผิดอย่างไร'],
S6:['ระบุ MAX, MIN, Utility และ Action ที่ Minimax เลือก','Recursive Minimax หรือ Alpha-beta ใน Coding Lab ลดหรือจัดการการค้นหาอย่างไร','Evaluation function, Depth cutoff หรือ Move ordering ที่ไม่ดีส่งผลอย่างไร'],
B2:['เกณฑ์ใดทำให้เลือก UCS, A* หรือ Minimax ใน Boss','Strategy selector ใน Coding Lab ตรวจ Weighted, Heuristic และ Opponent อย่างไร','การเลือก Algorithm ผิดกระทบ Time, Memory, Cost หรือ Optimality อย่างไร'],
S7:['แยก Facts, Rules, Relations และข้อสรุปจาก Mission','Forward chaining ใน Coding Lab เพิ่ม Fact และ Explanation trace อย่างไร','Exception, Conflict หรือ Inconsistency ใดต้องจัดการก่อนใช้ผลจริง'],
S8:['ระบุ Prior, Likelihood, Evidence และ Posterior จาก Mission','Bayes function ใน Coding Lab คำนวณและ Normalize อย่างไร','Base rate, Dependency และ Uncertainty ควรถูกสื่อสารอย่างไร'],
S9:['ระบุ Knowledge base, Inference engine, Matched rule และ Explanation','Coding Lab แสดง Reasoning trace หรือ Conflict resolution อย่างไร','เมื่อข้อมูลไม่ครบหรือความเสี่ยงสูง ระบบควรส่งต่อ Expert เมื่อใด'],
B3:['Logic, Knowledge และ Probability ถูกใช้ส่วนใดของ Boss','Decision, Confidence, Evidence และ Explanation ใน Coding Lab เชื่อมกันอย่างไร','Bias, Uncertainty หรือ Rule conflict ใดต้อง Expert review ก่อนผ่าน Boss'],
S10:['อธิบาย Features, Labels และ Train-Validation-Test split ของ Mission','Coding Lab ตรวจ Leakage และ Reproducibility ด้วยวิธีใด','เหตุใด Evaluation บนข้อมูลที่เคยเห็นหรือ Accuracy อย่างเดียวจึงไม่น่าเชื่อถือ'],
S11:['ปัญหาใน Mission เป็น Classification หรือ Regression และควรใช้ Metric ใด','Threshold และ Confusion matrix ใน Coding Lab ทำให้ FP/FN เปลี่ยนอย่างไร','เลือก Precision, Recall หรือ F1 จาก Cost ของ Error และผลกระทบอย่างไร'],
S12:['อธิบาย Assignment, Centroid update และการเลือก k','Coding Lab จัดการ Tie, Iterations และ Centroid อย่างไร','Initialization, Outlier, PCA หรือ Minority group ทำให้การตีความคลาดเคลื่อนอย่างไร'],
B4:['อธิบาย Pipeline, Model, Metric และหลักฐาน Generalization ใน Boss','Coding Lab วินิจฉัย Overfitting/Underfitting และให้ Recommendation อย่างไร','ก่อน Deploy ต้องตรวจ Leakage, Imbalance, Fairness, Monitoring และ Rollback อะไร'],
S13:['Weight, Bias และ Activation ทำให้ Neuron output เปลี่ยนอย่างไร','Dense layer, Loss, Gradient หรือ Backprop ใน Coding Lab เชื่อมกันอย่างไร','ข้อมูลแบบใดเหมาะกับ CNN, RNN หรือ Transformer และมีข้อจำกัดด้าน Interpretability อะไร'],
S14:['กำหนด States, Actions, Rewards และ Policy จาก Mission','Q-update, Alpha, Gamma และ Exploration ใน Coding Lab เชื่อมกันอย่างไร','Reward hacking หรือ Poor reward design ทำให้ Agent เรียนรู้พฤติกรรมผิดอย่างไร'],
S15:['LLM, Retrieval, Context และ Generation เชื่อมกันอย่างไร','Coding Lab ทำ Retrieval, Grounding และ Citation หรือ Fallback อย่างไร','Hallucination และ Context limitation ต้องตรวจด้วย Evidence แบบใด'],
B5:['อธิบาย Fairness, Privacy, Safety และ Accountability ของระบบใน Boss','Coding Lab ใช้ Confidence, Evidence, Human review และ Audit log อย่างไร','ก่อนใช้จริงต้องมี Monitoring, Appeal, Incident response และ Governance แบบใด']};
const prompts=PROMPTS[session]||['สรุปหลักฐานสำคัญจาก Mission','อธิบายสิ่งที่ได้เรียนรู้จาก Coding Lab','เสนอข้อจำกัดและวิธีนำความรู้ไปใช้'];
function idUrl(path){const u=new URL(path,location.href);u.searchParams.set('mission',mission);u.searchParams.set('session',session);u.searchParams.set('studentId',sid);u.searchParams.set('studentName',name);u.searchParams.set('section',section);u.searchParams.set('_',Date.now());return u.href}
const mapUrl=idUrl('./course-map-all-v720.html'),sessionUrl=idUrl('./student-session-integrated-v723.html');
$('badge').textContent=session;$('title').textContent=session+' • Reflection';$('identity').textContent=(sid||'-')+' • '+(name||'-')+' • Section '+section;$('l1').textContent='1. '+prompts[0];$('l2').textContent='2. '+prompts[1];$('l3').textContent='3. '+prompts[2];$('map').href=mapUrl;$('blockedMap').href=mapUrl;$('backSession').href=sessionUrl;
async function post(module,action,data,timeout=25000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({module,action,studentId:sid,studentName:name,section,sessionId:session,requestId:Date.now()+'-'+Math.random()},data||{})),signal:ctl.signal});if(!r.ok)throw Error('HTTP_'+r.status);const t=await r.text();try{return JSON.parse(t)}catch(e){throw Error('BACKEND_NOT_JSON')}}finally{clearTimeout(timer)}}
function truth(v){return v===true||['true','1','yes','passed','pass','completed','complete','mastered','submitted','success','ok'].includes(String(v??'').trim().toLowerCase())}
function normalize(v){return String(v||'').toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9ก-๙]/g,'')}
function showBlocked(msg){$('authority').className='notice bad';$('authority').textContent=msg;$('formCard').hidden=true;$('blocked').hidden=false;$('blockedText').textContent=msg}
async function verify(){if(!sid||!name){showBlocked('ข้อมูลผู้เรียนไม่ครบ กรุณากลับ Session หรือแผนที่');return}try{const flow=await post('AIQFLOW','GET_SESSION_STATUS',{});if(!flow?.ok)throw Error(flow?.code||'FLOW_STATUS_FAILED');const missionPassed=truth(flow?.mission?.completed)||truth(flow?.mission?.passed)||truth(flow?.missionPassed)||truth(flow?.missionCompleted);let codingPassed=truth(flow?.coding?.completed)||truth(flow?.coding?.passed)||truth(flow?.codingPassed)||truth(flow?.codingCompleted);let codingScore=Number(flow?.coding?.bestScore||flow?.codingScore||0);const reflectionDone=truth(flow?.reflection?.completed)||truth(flow?.reflection?.submitted)||truth(flow?.reflectionSubmitted)||truth(flow?.reflectionCompleted);try{const cs=await post('AIQCODING','GET_CODING_STATUS',{});if(cs?.ok){codingScore=Number(cs.bestScore||codingScore||0);codingPassed=codingPassed||truth(cs.completed)||codingScore>=60}}catch(e){}if(reflectionDone){$('authority').className='notice good';$('authority').textContent='✓ Reflection ส่งแล้ว • Session นี้เสร็จสมบูรณ์';$('formCard').hidden=true;$('blocked').hidden=false;$('blockedText').className='notice good';$('blockedText').textContent='Session Complete แล้ว ไม่ต้องส่งซ้ำ';return}if(!missionPassed){showBlocked('ยังไม่พบหลักฐาน Graded Mission ที่ผ่านจาก Server');return}if(!codingPassed){showBlocked('ยังไม่พบ Coding Lab ที่ผ่านจาก Server จึงยังเปิด Reflection ไม่ได้');return}$('authority').className='notice good';$('authority').textContent='✓ Server ยืนยัน Mission ผ่าน + Coding ผ่าน'+(codingScore?' '+Math.round(codingScore)+'/100':'')+' • พร้อมทำ Reflection';$('formCard').hidden=false;$('blocked').hidden=true;update()}catch(e){showBlocked('ตรวจสถานะจาก Server ไม่สำเร็จ: '+String(e.message||e))}}
function update(){const a=[$('r1').value,$('r2').value,$('r3').value],counts=a.map(x=>String(x).replace(/\s/g,'').length);counts.forEach((n,i)=>{const c=$('c'+(i+1));c.textContent=n+'/'+MIN;c.className='counter '+(n>=MIN?'ok':'')});const distinct=new Set(a.map(normalize).filter(Boolean)).size===3;$('submit').disabled=!(counts.every(n=>n>=MIN)&&distinct);$('status').textContent=$('submit').disabled?'ต้องตอบข้อละอย่างน้อย '+MIN+' ตัวอักษร และทั้ง 3 ข้อต้องเป็นคนละประเด็น':'Reflection ครบตามเกณฑ์ พร้อมส่ง'}
['r1','r2','r3'].forEach(id=>$(id).addEventListener('input',update));
$('submit').onclick=async()=>{const a=[$('r1').value.trim(),$('r2').value.trim(),$('r3').value.trim()];$('submit').disabled=true;$('status').textContent='กำลังส่ง Reflection และตรวจยืนยัน…';try{const d=await post('AIQFLOW','SUBMIT_REFLECTION',{reflection1:a[0],reflection2:a[1],reflection3:a[2],reflectionPrompt1:prompts[0],reflectionPrompt2:prompts[1],reflectionPrompt3:prompts[2],contentVersion:'reflection-gate-v1-min55'});if(!d?.ok)throw Error(d?.message||d?.code||'SUBMIT_FAILED');$('status').className='notice good';$('status').textContent='✓ ส่ง Reflection สำเร็จ • Session Complete • กำลังกลับแผนที่';setTimeout(()=>location.replace(mapUrl),900)}catch(e){$('status').className='notice bad';$('status').textContent='ส่งไม่สำเร็จ: '+String(e.message||e);$('submit').disabled=false}};
verify();
})();
</script></body></html>
