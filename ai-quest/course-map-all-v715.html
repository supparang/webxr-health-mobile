<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#071426">
<title>CSAI2102 • Redirecting to latest Quest Map</title>
<script>
(function(){
  var target = new URL('./course-map-all-v720.html', location.href);
  var current = new URLSearchParams(location.search);
  current.forEach(function(value,key){
    if (value !== '') target.searchParams.set(key,value);
  });
  try {
    var raw = sessionStorage.getItem('CSAI2102_IDENTITY_V1') || localStorage.getItem('CSAI2102_IDENTITY_V1');
    var saved = raw ? JSON.parse(raw) : {};
    if (!target.searchParams.get('studentId') && saved.studentId) target.searchParams.set('studentId', saved.studentId);
    if (!target.searchParams.get('studentName') && saved.studentName) target.searchParams.set('studentName', saved.studentName);
    if (!target.searchParams.get('section') && saved.section) target.searchParams.set('section', saved.section);
  } catch (e) {}
  if (!target.searchParams.get('section')) target.searchParams.set('section','101');
  target.searchParams.set('from','v715');
  target.searchParams.set('_',Date.now().toString());
  target.hash = location.hash;
  location.replace(target.href);
})();
</script>
<noscript>
<meta http-equiv="refresh" content="0; url=./course-map-all-v720.html?section=101&from=v715">
</noscript>
</head>
<body style="margin:0;background:#071426;color:#eef6ff;font-family:system-ui;padding:24px">
กำลังเปิด CSAI2102 Quest Map รุ่นล่าสุด…
</body>
</html>
