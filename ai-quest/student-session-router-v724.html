<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta name="theme-color" content="#071426">
<title>CSAI2102 • Session Router v724</title>
<style>
:root{--bg:#071426;--panel:#101d33;--line:#334155;--text:#e8f1ff;--muted:#a9bad3;--green:#07875a;--blue:#0369a1;--bad:#9f1239}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:760px;margin:auto;padding:26px 14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#132238;line-height:1.55}.good{border-color:#15803d;background:#052e24;color:#bbf7d0}.bad{border-color:var(--bad);background:#35101d;color:#fecdd3}.actions{display:grid;gap:10px;margin-top:14px}.btn{min-height:50px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#17263f;color:#fff;text-decoration:none;font-weight:900;display:flex;align-items:center;justify-content:center}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.muted{color:var(--muted)}
</style>
</head><body><main><section class="card"><h1 id="title">กำลังตรวจ Session…</h1><p id="identity" class="muted"></p><div id="note" class="notice">กำลังตรวจสถานะล่าสุดจาก Server</div><div id="actions" class="actions"></div></section></main>
<script>
(function(){'use strict';
const API='https://script.google.com/macros/s/AKfycbwXSUHbhVbZtKcjNIDzs4TawAohdeInm1MxLpomVeST2JilOL3L0LWQtT4_Yb7fbJG9/exec';
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);const mission=(q.get('mission')||q.get('session')||'s1').toLowerCase().replace(/^m(?=\d)/,'s').replace(/^boss/,'b'),session=mission.toUpperCase(),sid=(q.get('studentId')||'').trim(),name=(q.get('studentName')||'').trim(),section=(q.get('section')||'101').trim();
$('title').textContent=session+' • กำลังตรวจขั้นตอน';$('identity').textContent=(sid||'-')+' • '+(name||'-')+' • Section '+section;
function u(path){const x=new URL(path,location.href);x.searchParams.set('mission',mission);x.searchParams.set('session',session);x.searchParams.set('studentId',sid);x.searchParams.set('studentName',name);x.searchParams.set('section',section);x.searchParams.set('release','router-v724-r2');x.searchParams.set('_',Date.now());return x}
function map(){return u('./course-map-all-v720.html')}
function routerUrl(){return u('./student-session-router-v724.html')}
function missionPage(){const x=u('./student-mission-graded-v733.html');x.searchParams.set('returnUrl',routerUrl().href);x.searchParams.set('from','router-v724');return x}
function reflectionPage(){const x=u('./reflection-gate-v1.html');x.searchParams.set('from','router-v724');return x}
function codingPage(){const x=u('./coding-lab-mobile-gate-v1.html');x.searchParams.set('returnUrl',reflectionPage().href);x.searchParams.set('from','router-v724');return x}
async function post(module,action,data,timeout=30000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({module,action,studentId:sid,studentName:name,section,sessionId:session,requestId:Date.now()+'-'+Math.random()},data||{})),signal:ctl.signal});if(!r.ok)throw Error('HTTP_'+r.status);const t=await r.text();try{return JSON.parse(t)}catch(e){throw Error('BACKEND_NOT_JSON')}}catch(e){if(e&&e.name==='AbortError')throw Error('REQUEST_TIMEOUT');throw e}finally{clearTimeout(timer)}}
function btn(text,href,cls){return '<a class="btn '+(cls||'')+'" href="'+href.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+text+'</a>'}
async function init(){if(!sid||!name){$('note').className='notice bad';$('note').textContent='ข้อมูลผู้เรียนไม่ครบ กรุณากลับแผนที่';$('actions').innerHTML=btn('กลับแผนที่',map().href,'blue');return}try{const flow=await post('AIQFLOW','GET_SESSION_STATUS',{});if(!flow||flow.ok===false)throw Error((flow&&flow.code)||'FLOW_STATUS_FAILED');let missionOk=!!(flow.mission?.completed||flow.mission?.passed||flow.missionPassed||flow.missionCompleted),reflectionOk=!!(flow.reflection?.completed||flow.reflection?.submitted||flow.reflectionSubmitted||flow.reflectionCompleted),codingOk=!!(flow.coding?.completed||flow.coding?.passed||flow.codingPassed||flow.codingCompleted);if(!codingOk){const c=await post('AIQCODING','GET_CODING_STATUS',{});codingOk=!!(c&&c.ok!==false&&(c.completed===true||Number(c.bestScore||0)>=60));}
const complete=!!(flow.completed||flow.sessionCompleted||(missionOk&&codingOk&&reflectionOk));
if(complete){$('note').className='notice good';$('note').innerHTML='✓ '+session+' จบสมบูรณ์แล้ว<br>Mission ✓ • Coding ✓ • Reflection ✓<br>ไม่ต้องเปิด Mission หรือ Coding ซ้ำ';$('actions').innerHTML=btn('กลับแผนที่และไปด่านถัดไป',map().href,'green');return}
if(!missionOk){location.replace(missionPage().href);return}
if(!codingOk){location.replace(codingPage().href);return}
if(!reflectionOk){location.replace(reflectionPage().href);return}
$('note').className='notice good';$('note').textContent='✓ Session Complete';$('actions').innerHTML=btn('กลับแผนที่',map().href,'green');
}catch(e){$('note').className='notice bad';$('note').textContent='ตรวจสถานะไม่สำเร็จ: '+String(e.message||e);$('actions').innerHTML=btn('ลองใหม่',location.href,'blue')+btn('กลับแผนที่',map().href,'');}}
init();
})();
</script></body></html>
