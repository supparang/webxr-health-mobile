<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache">
<title>CSAI2102 • Coding Gate v3.3.2</title>
<style>
:root{--bg:#071426;--panel:#101d33;--line:#334155;--text:#e8f1ff;--muted:#a9bad3;--green:#059669;--blue:#0284c7;--amber:#b45309;--bad:#be3455}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}body{display:flex;flex-direction:column}.gate{max-width:760px;margin:auto;padding:18px;width:100%}.card{padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}h1,p{margin-top:0}.muted{color:var(--muted);line-height:1.55}.notice{padding:13px;border:1px solid var(--line);border-radius:14px;background:#17263f;line-height:1.5}.good{border-color:#15803d;background:#052e24;color:#bbf7d0}.bad{border-color:var(--bad);background:#35101d;color:#fecdd3}.actions{display:grid;gap:10px;margin-top:14px}.btn{min-height:52px;padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:#17263f;color:#fff;text-decoration:none;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.amber{background:var(--amber)}iframe{border:0;width:100%;height:100%;display:none;background:var(--bg)}.floatTop{position:fixed;right:12px;bottom:12px;z-index:50;width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:#17263f;color:#fff;font-weight:900;display:none;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.35)}
</style></head><body>
<div id="gate" class="gate"><section class="card"><h1 id="title">กำลังตรวจ Coding Lab…</h1><p class="muted" id="identity"></p><p class="muted" style="font-size:12px;margin:0 0 14px">Coding Gate v3.3.2 • Resume S/B</p><div id="notice" class="notice">กำลังยืนยันสิทธิ์จาก Google Sheet</div><div id="actions" class="actions"></div></section></div>
<iframe id="lab" title="CSAI2102 Coding Lab"></iframe><button id="top" class="floatTop" aria-label="กลับด้านบน">↑</button>
<script>
(function(){'use strict';
const VERSION='20261029-CODING-GATE-V3.3.2-RESUME-VISIBLE';
const API='https://script.google.com/macros/s/AKfycbwXSUHbhVbZtKcjNIDzs4TawAohdeInm1MxLpomVeST2JilOL3L0LWQtT4_Yb7fbJG9/exec';
const ORDER=['S1','S2','S3','B1','S4','S5','S6','B2','S7','S8','S9','B3','S10','S11','S12','B4','S13','S14','S15','B5'];
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);
const session=String(q.get('session')||q.get('mission')||'S1').toUpperCase().replace(/^MISSION/,'').replace(/^M(?=\d)/,'S');
let labAuthorized=false;
const mission=session.toLowerCase(),sid=String(q.get('studentId')||'').trim(),name=String(q.get('studentName')||'').trim(),section=String(q.get('section')||'101').trim();
function identityUrl(path){const u=new URL(path,location.href);u.searchParams.set('mission',mission);u.searchParams.set('session',session);u.searchParams.set('studentId',sid);u.searchParams.set('studentName',name);u.searchParams.set('section',section);u.searchParams.set('release',VERSION);u.searchParams.set('_',Date.now());return u}
function withIdentity(path){return identityUrl(path).href}
const reflectionUrl=withIdentity('./reflection-gate-v1.html'),sessionUrl=withIdentity('./student-session-router-v724.html'),mapUrl=withIdentity('./course-map-all-v720.html');
$('title').textContent=session+' • ตรวจสิทธิ์ Coding Lab';$('identity').textContent=(sid||'-')+' • '+(name||'-')+' • Section '+section;
async function post(module,action,payload,timeout=30000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({module,action,studentId:sid,studentName:name,section,sessionId:session,requestId:Date.now()+'-'+Math.random()},payload||{})),signal:ctl.signal});if(!r.ok)throw Error('HTTP_'+r.status);const t=await r.text();try{return JSON.parse(t)}catch(e){throw Error('BACKEND_NOT_JSON')}}catch(e){if(e&&e.name==='AbortError')throw Error('AUTHORITY_TIMEOUT');throw e}finally{clearTimeout(timer)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function button(text,href,cls){return '<a class="btn '+(cls||'')+'" href="'+esc(href)+'">'+esc(text)+'</a>'}
function block(code,message){$('notice').className='notice bad';$('notice').innerHTML='<b>ไม่อนุญาตให้เข้า Coding Lab</b><br>'+esc(message)+'<br><small>'+esc(code)+' • Google Sheet authority</small>';$('actions').innerHTML=button('กลับ Session',sessionUrl,'amber')+button('กลับแผนที่',mapUrl,'blue')}
function mismatch(msg){
 $('gate').style.display='block';$('lab').style.display='none';$('top').style.display='none';
 $('notice').className='notice bad';$('notice').textContent=msg;
 // A Coding/Flow discrepancy must NOT trap an eligible student outside Coding Lab.
 // Only allow a return to the lab after Mission and prerequisite gate checks pass.
 $('actions').innerHTML=(labAuthorized?'<button type="button" class="btn green" id="resumeCoding">เปิด Coding Lab '+esc(session)+' / ทำต่อ</button>':'')+
   button('ตรวจสถานะอีกครั้ง',location.href,'blue')+button('กลับแผนที่',mapUrl,'amber');
 const resume=$('resumeCoding');
 if(resume)resume.onclick=()=>openLab();
}
function safeVersion(obj){
 const version=String(obj?.version||'unknown').replace(/[^a-zA-Z0-9._:-]/g,'');
 return version.slice(0,96)||'unknown';
}
async function goReflection(){
 try{
  const flow=await post('AIQFLOW','GET_SESSION_STATUS',{},30000);
  if(flow?.ok===true&&flow.mission?.completed===true&&
     (flow.coding?.completed===true||(flow.coding?.found===true&&Number(flow.coding?.bestScore||0)>=60))){
    window.top.location.href=reflectionUrl;return;
  }
  let coding=null,failed=false;
  try{coding=await post('AIQCODING','GET_CODING_STATUS',{},30000)}catch(_){failed=true}
  const codingPass=!!(coding?.ok===true&&coding.found===true&&
    (coding.completed===true||Number(coding.bestScore||0)>=60));
  const detail='รหัสตรวจสอบ: '+session+'-CODING-FLOW-CHECK'+
    ' • Flow: '+safeVersion(flow)+
    ' • Coding: '+(failed?'STATUS_UNAVAILABLE':safeVersion(coding))+
    ' • Flow found: '+(flow?.coding?.found===true?'YES':'NO')+
    ' • Coding found: '+(coding?.found===true?'YES':'NO')+
    ' • Flow coding: '+(flow?.coding?.completed===true?'PASS':'NOT_CONFIRMED')+
    ' • Coding status: '+(codingPass?'PASS':'NOT_CONFIRMED');
  const message=codingPass?
    'Coding Lab ผ่านในระบบ Coding แต่ Flow ยังไม่ยืนยัน • โปรดแจ้งผู้สอน ไม่ต้องทำ Mission หรือ Coding ซ้ำ':
    (failed?'ยังตรวจระบบ Coding ไม่สำเร็จ ไม่สามารถยืนยันผลผ่าน • โปรดลองตรวจสถานะอีกครั้ง':
    'ยังไม่พบหลักฐาน Coding Lab '+session+' ที่ผ่านจากทั้งสองระบบ • โปรดตรวจประวัติการกดส่งงานกับผู้สอน ไม่ต้องทำ Mission ซ้ำ');
  mismatch(message+'\n'+detail);
 }catch(e){mismatch('ตรวจผล Coding Lab จาก Flow ไม่สำเร็จ: '+String(e.message||e)+' • กรุณาลองใหม่');}
}
function wireInnerReturn(){
 try{
  const d=$('lab').contentDocument;if(!d)return;
  const rb=d.getElementById('returnBtn');if(!rb||rb.dataset.flowGateWired==='yes')return;
  rb.dataset.flowGateWired='yes';
  // Do not show this button. The Coding Lab itself reveals it only AFTER a valid server submission.
  rb.textContent='ไป Reflection';
  rb.addEventListener('click',function(ev){
    ev.preventDefault();ev.stopImmediatePropagation();
    goReflection();
  },true);
 }catch(e){}
}
function openLab(){if(!labAuthorized)return;try{if($('lab').getAttribute('src')){$('gate').style.display='none';$('lab').style.display='block';$('top').style.display='flex';return;}const u=identityUrl('./web/coding-lab-v3.html');u.searchParams.set('build','coding-lab-335');u.searchParams.set('returnUrl',reflectionUrl);u.searchParams.set('authority','sheet-gated');$('gate').style.display='none';$('lab').style.display='block';$('lab').src=u.href;$('top').style.display='flex';$('top').onclick=()=>{try{$('lab').contentWindow.scrollTo({top:0,behavior:'smooth'})}catch(e){}};$('lab').addEventListener('load',()=>{try{const d=$('lab').contentDocument;if(!d)return;const style=d.createElement('style');style.textContent='.sticky{padding:6px 8px!important;justify-content:flex-end!important;background:transparent!important;border-top:0!important;pointer-events:none!important}.sticky .btn{pointer-events:auto!important}.sticky #goTop{display:none!important}.sticky #returnBtn{max-width:260px!important;min-height:46px!important}main{padding-bottom:80px!important}@media(max-width:720px){.sticky{display:flex!important;grid-template-columns:none!important}}';d.head.appendChild(style);wireInnerReturn();setTimeout(wireInnerReturn,250);setTimeout(wireInnerReturn,900)}catch(e){}})}catch(e){$('gate').style.display='block';$('lab').style.display='none';$('top').style.display='none';$('notice').className='notice bad';$('notice').textContent='เปิด Coding Lab ไม่สำเร็จ: '+String(e.message||e);$('actions').innerHTML=button('ลองใหม่',location.href,'blue')+button('กลับ Session',sessionUrl,'amber')}}
function missionPassed(flow){return !!(flow&&flow.mission&&(flow.mission.completed===true||flow.mission.passed===true))}
async function init(){
 if(!ORDER.includes(session)){block('INVALID_SESSION','ไม่พบด่านนี้ในลำดับรายวิชา');return}
 if(!sid||!name){block('IDENTITY_MISSING','ต้องมีรหัสนักศึกษาและชื่อผู้เรียนจาก Session');return}
 try{
   const index=ORDER.indexOf(session);
   $('notice').textContent='กำลังตรวจ Graded Mission ของ '+session+' จาก AIQFLOW…';
   const current=await post('AIQFLOW','GET_SESSION_STATUS',{},30000);
   if(!current||current.ok===false)throw Error((current&&current.code)||'CURRENT_STATUS_FAILED');
   if(!missionPassed(current)){block('MISSION_NOT_PASSED','ต้องผ่าน Graded Mission ของ '+session+' ก่อน จึงจะเปิด Coding Lab ได้');return}

   if(index>0){
     const previousId=ORDER[index-1];
     $('notice').textContent='กำลังตรวจการจบด่านก่อนหน้า '+previousId+'…';
     const previous=await post('AIQFLOW','GET_SESSION_STATUS',{sessionId:previousId},30000);
     if(!previous||previous.ok===false)throw Error((previous&&previous.code)||'PREVIOUS_STATUS_FAILED');
     if(previous.completed!==true){block('SESSION_LOCKED','ต้องจบ '+previousId+' ให้ครบ Mission + Coding + Reflection ก่อน');return}
   }

   labAuthorized=true;
   $('notice').className='notice good';$('notice').innerHTML='✓ Authority ผ่าน: '+session+' ถูกปลดล็อกและ Graded Mission ผ่านแล้ว<br>กำลังตรวจ Coding evidence…';
   const s=await post('AIQCODING','GET_CODING_STATUS',{},30000);
   if(s&&s.ok&&(s.completed===true||(s.found===true&&Number(s.bestScore||0)>=60))){
     if(current.coding?.completed===true||(current.coding?.found===true&&Number(current.coding?.bestScore||0)>=60)){
       $('notice').className='notice good';$('notice').innerHTML='✓ Coding Lab ผ่านแล้ว และ Flow ยืนยันตรงกัน<br>คะแนนดีที่สุด '+Number(s.bestScore||0);
       $('actions').innerHTML=button('ไป Reflection',reflectionUrl,'green')+button('กลับแผนที่',mapUrl,'blue');return;
     }
     mismatch('พบ Coding Lab ที่ผ่านในระบบ Coding แต่ Flow ยังไม่ยืนยัน • ข้อมูลสองระบบไม่ตรงกัน กรุณาแจ้งผู้สอน • ไม่ต้องทำ Coding หรือ Mission ซ้ำ\nFlow: '+safeVersion(current)+' • Coding: '+safeVersion(s));
     return;
   }
   $('notice').className='notice good';$('notice').textContent='✓ สิทธิ์ครบ กำลังเปิด Coding Lab';setTimeout(openLab,150);
 }catch(e){
   $('notice').className='notice bad';$('notice').textContent='ตรวจ authority ไม่สำเร็จ จึงไม่เปิด Lab เพื่อป้องกัน bypass: '+String(e.message||e);
   $('actions').innerHTML='<button class="btn blue" id="retry">ตรวจใหม่</button>'+button('กลับ Session',sessionUrl,'amber');
   setTimeout(()=>{const b=$('retry');if(b)b.onclick=()=>location.reload()},0);
 }
}
init();
})();
</script></body></html>
