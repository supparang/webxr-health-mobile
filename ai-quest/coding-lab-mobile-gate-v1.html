<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache">
<title>CSAI2102 • Coding Gate</title>
<style>
:root{--bg:#071426;--panel:#101d33;--line:#334155;--text:#e8f1ff;--muted:#a9bad3;--green:#059669;--blue:#0284c7;--amber:#b45309;--bad:#be3455}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}body{display:flex;flex-direction:column}.gate{max-width:760px;margin:auto;padding:18px;width:100%}.card{padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}h1,p{margin-top:0}.muted{color:var(--muted);line-height:1.55}.notice{padding:13px;border:1px solid var(--line);border-radius:14px;background:#17263f;line-height:1.5}.good{border-color:#15803d;background:#052e24;color:#bbf7d0}.bad{border-color:var(--bad);background:#35101d;color:#fecdd3}.actions{display:grid;gap:10px;margin-top:14px}.btn{min-height:52px;padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:#17263f;color:#fff;text-decoration:none;font-weight:900;display:flex;align-items:center;justify-content:center}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}iframe{border:0;width:100%;height:100%;display:none;background:var(--bg)}.floatTop{position:fixed;right:12px;bottom:12px;z-index:50;width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:#17263f;color:#fff;font-weight:900;display:none;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.35)}
</style></head><body>
<div id="gate" class="gate"><section class="card"><h1 id="title">กำลังตรวจ Coding Lab…</h1><p class="muted" id="identity"></p><div id="notice" class="notice">กำลังอ่านสถานะจาก Google Sheet</div><div id="actions" class="actions"></div></section></div>
<iframe id="lab" title="CSAI2102 Coding Lab"></iframe><button id="top" class="floatTop" aria-label="กลับด้านบน">↑</button>
<script>
(function(){'use strict';
const API='https://script.google.com/macros/s/AKfycbwXSUHbhVbZtKcjNIDzs4TawAohdeInm1MxLpomVeST2JilOL3L0LWQtT4_Yb7fbJG9/exec';
const q=new URLSearchParams(location.search);const session=(q.get('session')||q.get('mission')||'S1').toUpperCase();const sid=(q.get('studentId')||'').trim();const name=(q.get('studentName')||'').trim();const section=(q.get('section')||'101').trim();const returnUrl=q.get('returnUrl')||'./course-map-all-v720.html';const $=id=>document.getElementById(id);
$('title').textContent=session+' • ตรวจสถานะ Coding Lab';$('identity').textContent=(sid||'-')+' • '+(name||'-')+' • Section '+section;
async function post(action,payload){const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({module:'AIQCODING',action:action},payload||{}))});if(!r.ok)throw Error('HTTP_'+r.status);return JSON.parse(await r.text())}
function button(text,href,cls){return '<a class="btn '+(cls||'')+'" href="'+href.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+text+'</a>'}
function openLab(){const u=new URL('./web/coding-lab-v3.html',location.href);['mission','session','studentId','studentName','section','returnUrl'].forEach(k=>{const v=q.get(k);if(v)u.searchParams.set(k,v)});u.searchParams.set('release','mobile-gate-v1');u.searchParams.set('_',Date.now());$('gate').style.display='none';$('lab').style.display='block';$('lab').src=u.href;$('top').style.display='flex';$('top').onclick=()=>{try{$('lab').contentWindow.scrollTo({top:0,behavior:'smooth'})}catch(e){}};$('lab').addEventListener('load',()=>{try{const d=$('lab').contentDocument;if(!d)return;const style=d.createElement('style');style.textContent='.sticky{padding:6px 8px!important;justify-content:flex-end!important;background:transparent!important;border-top:0!important;pointer-events:none!important}.sticky .btn{pointer-events:auto!important}.sticky #goTop{display:none!important}.sticky #returnBtn{max-width:180px!important;min-height:46px!important}main{padding-bottom:80px!important}@media(max-width:720px){.sticky{display:flex!important;grid-template-columns:none!important}}';d.head.appendChild(style)}catch(e){}})}
async function init(){if(!sid){$('notice').className='notice bad';$('notice').textContent='ไม่พบรหัสนักศึกษา';$('actions').innerHTML=button('กลับแผนที่',returnUrl,'blue');return}try{const s=await post('GET_CODING_STATUS',{studentId:sid,studentName:name,section:section,sessionId:session});if(s&&s.ok&&(s.completed===true||Number(s.bestScore||0)>=60)){$('notice').className='notice good';$('notice').innerHTML='✓ Coding Lab ผ่านแล้ว<br>คะแนนดีที่สุด '+Number(s.bestScore||0)+' • ไม่ต้องทำซ้ำ';$('actions').innerHTML=button('กลับ Session เพื่อทำ Reflection',returnUrl,'green')+button('กลับแผนที่','./course-map-all-v720.html?studentId='+encodeURIComponent(sid)+'&studentName='+encodeURIComponent(name)+'&section='+encodeURIComponent(section),'blue');return} $('notice').textContent='ยังไม่พบ Coding Lab ที่ผ่านเกณฑ์ กำลังเปิดแบบฝึก';setTimeout(openLab,350)}catch(e){$('notice').className='notice bad';$('notice').textContent='ตรวจสถานะไม่สำเร็จ: '+String(e.message||e);$('actions').innerHTML='<button class="btn blue" id="retry">ลองตรวจอีกครั้ง</button>'+button('กลับแผนที่',returnUrl,'');setTimeout(()=>{const b=$('retry');if(b)b.onclick=()=>location.reload()},0)}}
init();
})();
</script></body></html>
