<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache">
<title>CSAI2102 • Quest Map v721</title>
<style>
:root{--bg:#071426;--panel:#101d33;--line:#334155;--text:#e8f1ff;--muted:#a9bad3;--green:#059669;--blue:#0284c7;--amber:#b45309;--violet:#7c3aed;--bad:#be3455}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#06101f,#08162a 55%,#111537);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:1080px;margin:auto;padding:14px 12px 44px}.card{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:20px;background:rgba(15,23,42,.95)}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted);line-height:1.55}.profile{display:grid;grid-template-columns:1fr 1fr .35fr auto;gap:8px}.input,.btn{min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#17263f;color:#fff;font:inherit}.btn{font-weight:900;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}.btn.good{background:var(--green)}.btn.blue{background:var(--blue)}.btn.amber{background:var(--amber)}.btn.violet{background:var(--violet)}.btn:disabled{opacity:.55;cursor:wait}.notice{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#132238;line-height:1.5}.notice.good{border-color:#168568;color:#bbf7d0}.notice.bad{border-color:var(--bad);color:#fecdd3}.notice.loading{border-color:#a16207;color:#fde68a}.notice small{display:block;margin-top:5px;opacity:.85}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.block{grid-column:1/-1;padding:12px 14px;border-left:6px solid #38bdf8;border-radius:13px;background:#0e1a2e;font-size:19px;font-weight:950}.mission{min-height:255px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel);display:flex;flex-direction:column;gap:9px}.mission.done{border-color:#10b981}.mission.active{border-color:#38bdf8}.mission.partial{border-color:#f59e0b}.mission.locked{opacity:.56}.mission.boss{background:#1b1535}.status{font-size:13px;font-weight:900}.topic{color:var(--muted);line-height:1.45}.parts{display:grid;gap:6px}.part{padding:8px;border:1px solid var(--line);border-radius:10px;background:#0c1729;font-size:13px}.part.ok{border-color:#15803d;background:#052e24;color:#bbf7d0}.part.wait{border-color:#a16207;background:#351b05;color:#fde68a}.part.lock{opacity:.6}.result{padding:9px;border:1px solid #15803d;border-radius:11px;background:#052e24;color:#bbf7d0}.actions{margin-top:auto}.actions .btn{width:100%}.meta{margin-top:7px;color:var(--muted);font-size:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){main{padding:10px 8px 32px}.profile,.grid{grid-template-columns:1fr}.mission{min-height:auto}.card{padding:13px}.btn{min-height:52px}}
</style></head><body><main>
<h1>🧠 CSAI2102 AI Quest</h1><p class="muted">Map v721 • Google Sheet/Backend เป็นแหล่งข้อมูลทางการเพียงแห่งเดียว</p>
<section class="card"><h2>ข้อมูลผู้เรียน</h2><div class="profile"><input id="sid" class="input" inputmode="numeric" placeholder="รหัสนักศึกษา"><input id="name" class="input" placeholder="ชื่อ-นามสกุล"><input id="section" class="input" value="101" readonly><button id="load" class="btn good">โหลดจาก Sheet</button></div><div id="note" class="notice">กรอกรหัสนักศึกษา แล้วโหลดข้อมูลจาก Sheet</div><div id="meta" class="meta"></div></section>
<section class="card"><h2>Mission Grid</h2><div id="grid" class="grid"></div></section>
</main><script>
(function(){'use strict';
const API='https://script.google.com/macros/s/AKfycbwXSUHbhVbZtKcjNIDzs4TawAohdeInm1MxLpomVeST2JilOL3L0LWQtT4_Yb7fbJG9/exec';
const KEY='CSAI2102_IDENTITY_V1';
const ORDER=['s1','s2','s3','b1','s4','s5','s6','b2','s7','s8','s9','b3','s10','s11','s12','b4','s13','s14','s15','b5'];
const BLOCK={s1:'Block 1 • AI Foundation',s4:'Block 2 • Search Strategy',s7:'Block 3 • Knowledge & Reasoning',s10:'Block 4 • Machine Learning',s13:'Block 5 • Modern AI & Governance'};
const TITLE={s1:'AI Spotter',s2:'Agent Builder',s3:'Search Maze',b1:'Foundation Boss',s4:'UCS Cost Board',s5:'A* Overlay',s6:'Minimax Board',b2:'Search Boss',s7:'Rule Chain Builder',s8:'Bayes Console',s9:'Expert Diagnosis Board',b3:'Reasoning Boss',s10:'Data Pipeline Defense',s11:'Threshold Rescue',s12:'Cluster Cartographer',b4:'ML Boss',s13:'Neural Forge',s14:'Reward Hack Arena',s15:'RAG Fact Check',b5:'Final Applied AI Boss'};
const TOPIC={s1:'AI vs Automation',s2:'Intelligent Agent และ PEAS',s3:'Breadth-First Search',b1:'AI + Agent + Search',s4:'Uniform Cost Search',s5:'Heuristic และ A*',s6:'Game Search และ Minimax',b2:'Search Strategy Integration',s7:'Facts • Rules • Inference',s8:'Prior • Evidence • Posterior',s9:'Expert System',b3:'Knowledge and Reasoning',s10:'Train • Validation • Test',s11:'Metrics • Threshold',s12:'Clusters • Outliers',b4:'Machine Learning Integration',s13:'Neural Network',s14:'Reinforcement Learning',s15:'NLP • Generative AI • RAG',b5:'Applied AI Integration'};
const $=id=>document.getElementById(id);let sid='',sname='',verified=false,rows={},requestNo=0;
const truth=v=>v===true||['true','1','yes','passed','pass','completed','mastered','submitted'].includes(String(v??'').trim().toLowerCase());
const num=v=>v===null||v===undefined||String(v).trim()===''?null:(Number.isFinite(Number(v))?Number(v):null);
const first=(...a)=>{for(const v of a){const n=num(v);if(n!==null)return n}return null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function identity(){let saved={};try{saved=JSON.parse(sessionStorage.getItem(KEY)||localStorage.getItem(KEY)||'{}')}catch(e){}const q=new URLSearchParams(location.search);const out={studentId:(q.get('studentId')||saved.studentId||'').trim(),studentName:(q.get('studentName')||saved.studentName||'').trim(),section:(q.get('section')||saved.section||'101').trim()};if(out.studentId){try{sessionStorage.setItem(KEY,JSON.stringify(out));localStorage.setItem(KEY,JSON.stringify(out))}catch(e){}}return out}
function saveIdentity(){const x={studentId:sid,studentName:sname,section:'101'};try{sessionStorage.setItem(KEY,JSON.stringify(x));localStorage.setItem(KEY,JSON.stringify(x))}catch(e){}}
function say(t,k='',d=''){$('note').className='notice'+(k?' '+k:'');$('note').innerHTML=esc(t)+(d?'<small>'+esc(d)+'</small>':'')}
function empty(id){return{id,mission:false,coding:false,reflection:false,completed:false,unlocked:id==='s1',score:null,accuracy:null,correct:null,total:null,source:''}}
function normalize(id,d){d=d||{};const m=d.mission||{},c=d.coding||{},r=d.reflection||{};const mission=truth(m.completed)||truth(m.passed)||truth(d.missionCompleted)||truth(d.missionPassed)||truth(d.passed);const coding=truth(c.completed)||truth(c.passed)||truth(d.codingCompleted)||truth(d.codingPassed)||(first(c.bestScore,c.score,d.codingScore)??0)>=60;const reflection=truth(r.completed)||truth(r.submitted)||truth(d.reflectionCompleted)||truth(d.reflectionSubmitted);return{id,mission,coding,reflection,completed:mission&&coding&&reflection,unlocked:id==='s1',score:first(m.bestScore,m.score,d.missionScore,d.score),accuracy:first(m.accuracy,d.missionAccuracy,d.accuracy),correct:first(m.correct,d.missionCorrect,d.correct),total:first(m.total,d.missionTotal,d.total),source:String(d.version||'')}}
function derive(x){ORDER.forEach((id,i)=>{if(!x[id])x[id]=empty(id);x[id].unlocked=id==='s1'||!!x[ORDER[i-1]]?.completed});return x}
async function post(module,action,payload,timeout=22000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({module,action,section:'101',requestId:Date.now()+'-'+Math.random()},payload||{})),signal:ctl.signal});if(!r.ok)throw Error('HTTP_'+r.status);const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){throw Error('BACKEND_NOT_JSON')}return d}catch(e){if(e.name==='AbortError')throw Error('REQUEST_TIMEOUT');throw e}finally{clearTimeout(timer)}}
async function loadOne(id){let flow=null;try{flow=await post('AIQFLOW','GET_SESSION_STATUS',{studentId:sid,studentName:sname,sessionId:id.toUpperCase()},18000)}catch(e){}let row=flow&&flow.ok?normalize(id,flow):empty(id);if(!row.coding){try{const cs=await post('AIQCODING','GET_CODING_STATUS',{studentId:sid,studentName:sname,sessionId:id.toUpperCase()},18000);if(cs&&cs.ok&&(cs.completed===true||Number(cs.bestScore||0)>=60)){row.coding=true;row.codingScore=Number(cs.bestScore||0);row.codingSource='AIQCODING.getStatus_'}}catch(e){}}
row.completed=row.mission&&row.coding&&row.reflection;return row}
async function loadAll(){const out={};let ok=0;for(let i=0;i<ORDER.length;i+=4){say('กำลังตรวจสถานะรายด่าน…','loading','ด่าน '+(i+1)+'–'+Math.min(i+4,ORDER.length)+' จาก '+ORDER.length);const batch=ORDER.slice(i,i+4);const got=await Promise.all(batch.map(async id=>{for(let a=1;a<=2;a++){try{return[id,await loadOne(id)]}catch(e){if(a===2)return[id,null];await new Promise(r=>setTimeout(r,500))}}}));got.forEach(([id,row])=>{out[id]=row||empty(id);if(row)ok++})}if(!ok)throw Error('NO_SESSION_STATUS');return derive(out)}
function part(label,ok,locked){return'<div class="part '+(ok?'ok':locked?'lock':'wait')+'">'+(ok?'✓':locked?'🔒':'○')+' '+label+'</div>'}
function result(r){if(!r.mission)return'';const p=[];if(r.score!==null)p.push(Math.round(r.score)+'%');if(r.accuracy!==null)p.push('Accuracy '+Math.round(r.accuracy)+'%');if(r.correct!==null&&r.total!==null)p.push(Math.round(r.correct)+'/'+Math.round(r.total)+' ข้อ');if(r.codingScore)p.push('Coding '+Math.round(r.codingScore)+'%');return p.length?'<div class="result">'+p.map(esc).join(' • ')+'</div>':'<div class="result">ผ่าน Mission แล้ว</div>'}
function sessionUrl(id){const u=new URL('./student-session-integrated-v722.html',location.href);u.searchParams.set('mission',id);u.searchParams.set('session',id.toUpperCase());u.searchParams.set('studentId',sid);u.searchParams.set('studentName',sname);u.searchParams.set('section','101');u.searchParams.set('release','v722-v721');u.searchParams.set('_',Date.now());return u.href}
function codingUrl(id){const u=new URL('./coding-lab-mobile-gate-v1.html',location.href);u.searchParams.set('mission',id);u.searchParams.set('session',id.toUpperCase());u.searchParams.set('studentId',sid);u.searchParams.set('studentName',sname);u.searchParams.set('section','101');u.searchParams.set('returnUrl',sessionUrl(id));u.searchParams.set('_',Date.now());return u.href}
function render(){const g=$('grid');g.innerHTML='';ORDER.forEach(id=>{if(BLOCK[id])g.insertAdjacentHTML('beforeend','<div class="block">'+esc(BLOCK[id])+'</div>');const r=rows[id]||empty(id),open=verified&&r.unlocked,locked=!open,cls=['mission'];if(id[0]==='b')cls.push('boss');if(r.completed)cls.push('done');else if(locked)cls.push('locked');else if(r.mission||r.coding)cls.push('partial');else cls.push('active');const status=r.completed?'ผ่านครบ 3 ส่วนแล้ว':locked?'ล็อก':!r.mission?'เปิดเล่น':!r.coding?'เหลือ Coding Lab + Reflection':!r.reflection?'เหลือ Reflection':'กำลังตรวจ';const label=r.completed?'↻ ทบทวน / เล่นซ้ำ':!r.mission?'▶ เริ่ม Mission':!r.coding?'▶ ทำ Coding Lab':'▶ ส่ง Reflection';let href=sessionUrl(id);if(!r.coding&&r.mission)href=codingUrl(id);const action=open?'<a class="btn '+(r.completed?'good':!r.mission?'blue':!r.coding?'violet':'amber')+'" href="'+esc(href)+'">'+label+'</a>':'<span class="btn">ต้องครบ 3 ส่วนของด่านก่อนหน้า</span>';const e=document.createElement('article');e.className=cls.join(' ');e.innerHTML='<div class="status">'+esc(status)+'</div><h3>'+id.toUpperCase()+' • '+esc(TITLE[id])+'</h3><div class="topic">'+esc(TOPIC[id])+'</div><div class="parts">'+part('1. Mission',r.mission,locked&&!r.mission)+part('2. Coding Lab',r.coding,locked)+part('3. Reflection',r.reflection,locked)+'</div>'+result(r)+'<div class="actions">'+action+'</div>';g.appendChild(e)})}
async function load(){const mine=++requestNo;sid=$('sid').value.trim();sname=$('name').value.trim();if(!sid)return say('กรุณากรอกรหัสนักศึกษา','bad');saveIdentity();verified=false;rows={};render();$('load').disabled=true;$('load').textContent='กำลังโหลด…';try{rows=await loadAll();if(mine!==requestNo)return;verified=true;render();const done=ORDER.filter(id=>rows[id]?.completed).length;say('โหลดสถานะรายด่านจาก Sheet สำเร็จ: '+sid+' • Section 101','good',done+'/'+ORDER.length+' ด่านผ่านครบ 3 ส่วน');$('meta').textContent='อัปเดต '+new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok'})}catch(e){if(mine!==requestNo)return;verified=false;rows={};render();say('โหลดสถานะไม่สำเร็จ','bad',String(e.message||e))}finally{$('load').disabled=false;$('load').textContent='โหลดจาก Sheet'}}
$('load').onclick=load;const id=identity();$('sid').value=id.studentId;$('name').value=id.studentName;$('section').value=id.section||'101';$('sid').addEventListener('input',()=>{requestNo++;verified=false;rows={};render()});render();if(id.studentId)setTimeout(load,80);
})();
</script></body></html>
