<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<title>CSAI2102 • Graded Mission</title>
<style>
:root{--bg:#071426;--panel:#101d33;--panel2:#142640;--line:#334155;--text:#e8f1ff;--muted:#a9bad3;--blue:#0369a1;--green:#07875a;--amber:#b45309;--bad:#9f1239}
*{box-sizing:border-box;min-width:0}html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#06101f,#071426 60%,#111537);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:980px;margin:auto;padding:14px 12px 80px}.card{margin:12px 0;padding:17px;border:1px solid var(--line);border-radius:18px;background:rgba(16,29,51,.97)}
h1,h2,h3,p{margin-top:0}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top .spacer{margin-left:auto}.muted{color:var(--muted);line-height:1.55}.chip{display:inline-flex;padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:850;color:#dbeafe}.chip.risk{border-color:#a16207;color:#fde68a}
.notice{padding:12px;border:1px solid var(--line);border-radius:13px;background:#132238;line-height:1.55;white-space:pre-wrap}.notice.good{border-color:#15803d;background:#052e24;color:#bbf7d0}.notice.bad{border-color:var(--bad);background:#35101d;color:#fecdd3}.notice.wait{border-color:#a16207;color:#fde68a}
.btn{min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#17263f;color:#fff;font:inherit;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}.btn.amber{background:var(--amber)}.btn:disabled{opacity:.5;cursor:not-allowed}
.screen{display:none}.screen.on{display:block}.identity{display:grid;grid-template-columns:1fr 1fr .35fr;gap:8px}.identity div{padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.hud{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.bar{height:9px;flex:1;min-width:150px;border-radius:999px;background:#26364f;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#8b5cf6,#f59e0b)}
.question{font-size:20px;line-height:1.55;white-space:pre-line;margin:14px 0}.context{padding:10px 11px;border:1px solid #475569;border-radius:11px;background:#111f3a;color:#dbeafe;line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{min-height:76px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#1a2a44;color:#fff;text-align:left;font:inherit;line-height:1.45;cursor:pointer}.choice.ok{border-color:#34d399;background:#103d37}.choice.no{border-color:#fb7185;background:#492033}.feedback{display:none;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#132238;line-height:1.55}.feedback.show{display:block}.feedback.good{border-color:#15803d;color:#bbf7d0}.feedback.bad{border-color:#be3455;color:#fecdd3}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.metric b{font-size:28px}.review{margin-top:10px}.wrong{margin-top:8px;padding:11px;border:1px solid #6e3b49;border-radius:12px;background:#1f1726;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:720px){main{padding:9px 8px 90px}.identity,.choices,.summary{grid-template-columns:1fr}.card{padding:13px}.question{font-size:18px}.actions{display:grid}.actions .btn{width:100%}}
</style>
<script src="./js/aiquest-all-content-v702.js?v=20260728-mission733"></script>
<script src="./js/aiquest-runtime-alignment-v732.js?v=20260728-mission733"></script>
<script src="./js/aiquest-challenge-layer-v706.js?v=20260728-full731-mission733"></script>
</head>
<body>
<main>
<section class="card">
 <div class="top"><div><span id="sessionChip" class="chip">S1</span><h1 id="title">CSAI2102 Graded Mission</h1><p id="subtitle" class="muted">กำลังตรวจสิทธิ์จาก Google Sheet…</p></div><span class="spacer"></span><button id="mapBtn" class="btn">แผนที่รายวิชา</button></div>
 <div class="identity"><div><b>รหัสนักศึกษา</b><br><span id="sidText">—</span></div><div><b>ชื่อผู้เรียน</b><br><span id="nameText">—</span></div><div><b>Section</b><br><span id="sectionText">101</span></div></div>
 <div id="authority" class="notice wait" style="margin-top:10px">กำลังตรวจ Profile และสิทธิ์ของด่านจาก Sheet</div>
</section>

<section id="entry" class="screen on card">
 <h2>Mission แบบให้คะแนน</h2>
 <p id="missionText" class="muted"></p>
 <div id="entryNote" class="notice">ยังไม่พร้อมเริ่ม</div>
 <div class="actions"><button id="start" class="btn blue" disabled>▶ เริ่ม Graded Mission</button><button id="returnEntry" class="btn green" hidden>กลับ Session</button></div>
</section>

<section id="game" class="screen">
 <section class="card"><div id="hud" class="hud"></div></section>
 <section class="card"><div id="caseContext" class="context"></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><div class="actions"><button id="next" class="btn blue" disabled>ข้อต่อไป</button><button id="exit" class="btn">ออกจาก Mission</button></div></section>
</section>

<section id="result" class="screen card">
 <div id="badge" class="notice"></div>
 <div id="score" style="font-size:58px;font-weight:950;margin:10px 0">0</div>
 <div id="stars" style="font-size:25px;color:#fbbf24">☆☆☆</div>
 <p id="resultText" class="muted"></p>
 <div id="summary" class="summary"></div>
 <div id="review" class="review"></div>
 <div id="saveNote" class="notice" style="margin-top:12px">ต้องบันทึกผลลง Sheet ก่อน ระบบจึงจะนับ Mission อย่างเป็นทางการ</div>
 <div class="actions"><button id="save" class="btn green">บันทึกผล Mission แบบ Graded</button><button id="replay" class="btn amber">↻ สร้าง Deck ใหม่</button><button id="continue" class="btn blue" hidden>ไป Coding Lab ต่อ</button><button id="mapResult" class="btn">กลับแผนที่</button></div>
</section>
</main>
<script>
(function(){'use strict';
const API='https://script.google.com/macros/s/AKfycbwXSUHbhVbZtKcjNIDzs4TawAohdeInm1MxLpomVeST2JilOL3L0LWQtT4_Yb7fbJG9/exec';
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);
const ORDER=['s1','s2','s3','b1','s4','s5','s6','b2','s7','s8','s9','b3','s10','s11','s12','b4','s13','s14','s15','b5'];
let mission=String(q.get('mission')||q.get('session')||'s1').toLowerCase().replace(/^m(?=\d)/,'s').replace(/^boss/,'b');if(!ORDER.includes(mission))mission='s1';
const session=mission.toUpperCase(),sid=String(q.get('studentId')||'').trim(),studentName=String(q.get('studentName')||'').trim(),section='101';
const returnUrl=q.get('returnUrl')||('./student-session-integrated-v723.html?mission='+encodeURIComponent(mission)+'&session='+encodeURIComponent(session)+'&studentId='+encodeURIComponent(sid)+'&studentName='+encodeURIComponent(studentName)+'&section=101');
const mapUrl='./course-map-all-v720.html?studentId='+encodeURIComponent(sid)+'&studentName='+encodeURIComponent(studentName)+'&section=101&from='+encodeURIComponent(mission);
let deck=[],index=0,correct=0,combo=0,maxCombo=0,wrong=[],answered=false,startedAt=0,result=null,round=1,verified=false,saving=false;
const C=window.AIQuestAllContentV702;
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const uid=()=>('mission_'+sid+'_'+session+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');scrollTo({top:0,behavior:'auto'});}
function threshold(){if(mission==='b5')return 75;if(mission[0]==='b')return 70;return 60;}
function spec(){return C&&typeof C.spec==='function'?C.spec(mission):(C&&C.sessions?C.sessions[mission]:null);}
async function post(module,action,data,timeout=22000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({module,action,studentId:sid,studentName,section,sessionId:session,requestId:Date.now()+'-'+Math.random()},data||{})),signal:ctl.signal});if(!r.ok)throw Error('HTTP_'+r.status);const text=await r.text();try{return JSON.parse(text)}catch(e){throw Error('BACKEND_NOT_JSON')}}finally{clearTimeout(timer)}}
async function queueAttempt(payload){await fetch(API,{method:'POST',mode:'no-cors',cache:'no-store',keepalive:true,headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'sync_v23',kind:'attempt',payload})});return true;}
function orderChoices(card){const distractors=[...(card.distractors||card.wrong||[])].filter(x=>String(x)!==String(card.correct)).slice(0,3);while(distractors.length<3)distractors.push('ยังไม่มีหลักฐานเพียงพอสำหรับข้อสรุปนี้');const slot=Math.max(0,Math.min(3,Number(card.answerSlot)));const out=distractors.slice();out.splice(slot,0,card.correct);return out.slice(0,4);}
function paintIdentity(){const s=spec()||{};$('sessionChip').textContent=session;$('title').textContent=session+' • '+(s.title||'Graded Mission');$('subtitle').textContent=(s.theme||'AI Quest')+' • Google Sheet เป็นแหล่งข้อมูลทางการ';$('missionText').textContent=(s.mission||s.topic||'ทำ Mission ให้ผ่านเกณฑ์ก่อนเข้าสู่ Coding Lab');$('sidText').textContent=sid||'—';$('nameText').textContent=studentName||'—';$('sectionText').textContent=section;[$('mapBtn'),$('mapResult')].forEach(b=>b.onclick=()=>{window.top.location.href=mapUrl});$('returnEntry').onclick=()=>{window.top.location.href=returnUrl};$('continue').onclick=()=>{window.top.location.href=returnUrl};}
async function verifyAuthority(){paintIdentity();if(!sid||!studentName){$('authority').className='notice bad';$('authority').textContent='ไม่พบรหัสหรือชื่อผู้เรียน กรุณากลับแผนที่และโหลด Profile จาก Sheet';$('entryNote').className='notice bad';$('entryNote').textContent='ไม่อนุญาตให้เริ่มโดยไม่มี Identity ที่ครบ';return}try{const profile=await post('AIQFLOW','LOOKUP_PROFILE',{});if(!profile||!profile.ok||!profile.found)throw Error('PROFILE_NOT_FOUND');const flow=await post('AIQFLOW','GET_FLOW_PROGRESS',{});const row=flow&&flow.progress&&flow.progress[mission];if(!flow||!flow.ok||!row)throw Error('FLOW_STATUS_MISSING');if(row.completed||row.missionPassed){verified=true;$('authority').className='notice good';$('authority').textContent='✓ Sheet ยืนยันว่า Mission นี้ผ่านแล้ว ไม่ต้องทำซ้ำ';$('entryNote').className='notice good';$('entryNote').textContent='ขั้นตอนถัดไป: Coding Lab';$('returnEntry').hidden=false;$('start').hidden=true;return}if(!row.unlocked){$('authority').className='notice bad';$('authority').textContent='ด่านนี้ยังล็อกตามข้อมูลใน Sheet';$('entryNote').className='notice bad';$('entryNote').textContent='ต้องจบด่านก่อนหน้าให้ครบ Mission + Coding + Reflection';return}verified=true;$('authority').className='notice good';$('authority').textContent='✓ Profile และสิทธิ์ของด่านได้รับการยืนยันจาก Sheet';$('entryNote').className='notice good';$('entryNote').textContent='พร้อมเริ่ม Graded Mission • ต้องได้อย่างน้อย '+threshold()+'%';$('start').disabled=false;}catch(e){$('authority').className='notice bad';$('authority').textContent='ตรวจสิทธิ์จาก Sheet ไม่สำเร็จ: '+String(e.message||e);$('entryNote').className='notice bad';$('entryNote').textContent='ระบบหยุดแบบ Fail-closed และจะไม่ใช้ localStorage ปลดล็อก';}}
function buildDeck(){if(!C||typeof C.deck!=='function')throw Error('CONTENT_ENGINE_NOT_READY');deck=C.deck(mission,round)||[];if(deck.length<15)throw Error('DECK_INCOMPLETE_'+deck.length);deck=deck.slice(0,15);index=0;correct=0;combo=0;maxCombo=0;wrong=[];answered=false;startedAt=Date.now();result=null;}
function renderHud(){const pct=Math.round(index/deck.length*100);$('hud').innerHTML='<span class="chip">'+session+'</span><span class="chip">เคส '+(index+1)+'/'+deck.length+'</span><span class="chip">ถูก '+correct+'</span><span class="chip">🔥 x'+combo+'</span><div class="bar"><i style="width:'+pct+'%"></i></div>';}
function renderCard(){if(index>=deck.length){finish();return}const card=deck[index],choices=orderChoices(card);renderHud();$('caseContext').innerHTML='<span class="chip risk">'+esc(card.riskLevel||card.phase||'CASE')+'</span> <b>'+esc(card.context||card.concept||'Case')+'</b><br><span class="muted">'+esc(card.concept||card.principle||'')+'</span>';$('question').textContent=card.prompt||'';$('choices').innerHTML=choices.map((x,i)=>'<button class="choice" data-choice="'+i+'">'+esc(x)+'</button>').join('');$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=true;answered=false;document.querySelectorAll('[data-choice]').forEach((b,i)=>b.onclick=()=>answer(choices[i],b));}
function answer(value,button){if(answered)return;answered=true;const card=deck[index],ok=String(value)===String(card.correct);if(ok){correct++;combo++;maxCombo=Math.max(maxCombo,combo)}else{combo=0;wrong.push({caseNo:index+1,context:card.context||'',concept:card.concept||'',prompt:card.prompt||'',answer:value,correct:card.correct,principle:card.principle||''})}document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;if(String(b.textContent)===String(card.correct))b.classList.add('ok')});if(!ok)button.classList.add('no');$('feedback').className='feedback show '+(ok?'good':'bad');$('feedback').innerHTML=ok?'<b>✓ ถูกต้อง</b><br>'+esc(card.principle||card.concept||''):('<b>ยังไม่ถูก</b><br><b>คำตอบที่เหมาะสม:</b> '+esc(card.correct)+'<br>'+esc(card.principle||''));$('next').disabled=false;renderHud();}
function finish(){const score=Math.round(correct/deck.length*100),pass=score>=threshold(),usedSec=Math.max(1,Math.round((Date.now()-startedAt)/1000));result={score,pass,usedSec,correct,total:deck.length};$('badge').className='notice '+(pass?'good':'bad');$('badge').textContent=pass?'✓ ผ่าน Mission แบบ Graded':'ยังไม่ผ่าน Mission';$('score').textContent=score;$('stars').textContent='★'.repeat(score>=85?3:score>=70?2:score>=60?1:0)+'☆'.repeat(score>=85?0:score>=70?1:score>=60?2:3);$('resultText').textContent=pass?'ผ่านเกณฑ์ Mission แล้ว แต่ยังไม่ถือว่าจบด่านจนกว่าจะผ่าน Coding Lab และส่ง Reflection':'ต้องได้อย่างน้อย '+threshold()+'% จึงจะเปิด Coding Lab';$('summary').innerHTML='<div class="metric"><b>'+correct+'/'+deck.length+'</b><br>คำตอบถูก</div><div class="metric"><b>'+score+'%</b><br>คะแนน Mission</div><div class="metric"><b>'+usedSec+'</b><br>วินาที</div>';$('review').innerHTML=wrong.length?'<h3>Case ที่ควรทบทวน</h3>'+wrong.slice(0,8).map(x=>'<div class="wrong"><b>Case '+x.caseNo+' • '+esc(x.context)+'</b><br>'+esc(x.prompt)+'<br><b>คำตอบที่เหมาะสม:</b> '+esc(x.correct)+'</div>').join(''):'<h3>Perfect Deck</h3><p class="muted">ตอบถูกครบทุก Case ในรอบนี้</p>';$('save').disabled=false;$('save').textContent='บันทึกผล Mission แบบ Graded';$('continue').hidden=true;show('result');}
async function saveResult(){if(!result||saving)return;saving=true;$('save').disabled=true;$('save').textContent='กำลังบันทึก…';$('saveNote').className='notice wait';$('saveNote').textContent='กำลังส่งผลและตรวจยืนยันจาก Google Sheet';const s=spec()||{},attemptId=uid(),payload={attemptId,studentId:sid,studentName,section,sessionId:mission,missionId:mission,missionTitle:s.title||session,difficulty:'graded',score:result.score,accuracy:result.score,correct:result.correct,total:result.total,stars:result.score>=85?3:result.score>=70?2:result.score>=60?1:0,gateStatus:result.pass?'passed':'review',mastered:result.score>=85,usedTimeSec:result.usedSec,maxCombo,wrong:wrong.length,bossWin:mission[0]==='b'&&result.pass,runMode:'graded',isPractice:false,isGraded:true,clientTs:new Date().toISOString(),schemaVersion:'20260728-MISSION-V733-SHEET-AUTHORITY',extraJson:{contentVersion:C.version||'unknown',challengeVersion:C.challengeLayerVersion||'',deckRound:round,deckTotal:deck.length,threshold:threshold(),challengeAudit:deck.challengeAudit||null,wrongItems:wrong}};try{await queueAttempt(payload);let confirmed=false,last=null;for(let i=0;i<7;i++){await sleep(i===0?900:1400);try{last=await post('AIQFLOW','GET_SESSION_STATUS',{},18000);if(last&&last.ok&&last.mission&&last.mission.completed){confirmed=true;break}}catch(e){}}if(confirmed){$('saveNote').className='notice good';$('saveNote').textContent='✓ Sheet ยืนยันผล Mission แล้ว • ขั้นต่อไปคือ Coding Lab';$('save').textContent='✓ บันทึกแล้ว';$('save').disabled=true;$('continue').hidden=false;}else if(!result.pass){$('saveNote').className='notice good';$('saveNote').textContent='บันทึก Attempt เพื่อการวิเคราะห์แล้ว แต่คะแนนยังไม่ผ่าน จึงยังไม่เปิด Coding Lab';$('save').textContent='✓ บันทึก Attempt แล้ว';$('save').disabled=true;}else{throw Error('SHEET_CONFIRM_TIMEOUT')}}catch(e){$('saveNote').className='notice bad';$('saveNote').textContent='ยังยืนยันการบันทึกจาก Sheet ไม่ได้: '+String(e.message||e)+'\nข้อมูลจะไม่ถูกใช้ปลดล็อกจนกว่า Sheet จะยืนยัน';$('save').disabled=false;$('save').textContent='ลองบันทึกอีกครั้ง';}finally{saving=false;}}
$('start').onclick=()=>{if(!verified)return;try{buildDeck();show('game');renderCard()}catch(e){$('entryNote').className='notice bad';$('entryNote').textContent='สร้าง Deck ไม่สำเร็จ: '+String(e.message||e)}};$('next').onclick=()=>{if(!answered)return;index++;renderCard()};$('exit').onclick=()=>{if(confirm('ออกจาก Mission รอบนี้หรือไม่? ผลที่ยังไม่บันทึกจะไม่ถูกนับ'))show('entry')};$('save').onclick=saveResult;$('replay').onclick=()=>{round++;try{buildDeck();show('game');renderCard()}catch(e){$('saveNote').className='notice bad';$('saveNote').textContent=String(e.message||e)}};
paintIdentity();verifyAuthority();
})();
</script>
</body>
</html>
