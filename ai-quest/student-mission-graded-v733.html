<style>

*{box-sizing:border-box;min-width:0}html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#06101f,#071426 60%,#111537);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:980px;margin:auto;padding:14px 12px 80px}.card{margin:12px 0;padding:17px;border:1px solid var(--line);border-radius:18px;background:rgba(16,29,51,.97)}h1,h2,h3,p{margin-top:0}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top .spacer{margin-left:auto}.muted{color:var(--muted);line-height:1.55}.chip{display:inline-flex;padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:850;color:#dbeafe}.chip.risk{border-color:#a16207;color:#fde68a}.notice{padding:12px;border:1px solid var(--line);border-radius:13px;background:#132238;line-height:1.55;white-space:pre-wrap}.notice.good{border-color:#15803d;background:#052e24;color:#bbf7d0}.notice.bad{border-color:var(--bad);background:#35101d;color:#fecdd3}.notice.wait{border-color:#a16207;color:#fde68a}.btn{min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#17263f;color:#fff;font:inherit;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}.btn.amber{background:var(--amber)}.btn:disabled{opacity:.5;cursor:not-allowed}.screen{display:none}.screen.on{display:block}.identity{display:grid;grid-template-columns:1fr 1fr .35fr;gap:8px}.identity div{padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}.hud{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.bar{height:9px;flex:1;min-width:150px;border-radius:999px;background:#26364f;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#8b5cf6,#f59e0b)}.question{font-size:20px;line-height:1.55;white-space:pre-line;margin:14px 0}.context{padding:10px 11px;border:1px solid #475569;border-radius:11px;background:#111f3a;color:#dbeafe;line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{min-height:76px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#1a2a44;color:#fff;text-align:left;font:inherit;line-height:1.45;cursor:pointer}.choice.ok{border-color:#34d399;background:#103d37}.choice.no{border-color:#fb7185;background:#492033}.feedback{display:none;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#132238;line-height:1.55}.feedback.show{display:block}.feedback.good{border-color:#15803d;color:#bbf7d0}.feedback.bad{border-color:#be3455;color:#fecdd3}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.metric b{font-size:28px}.review{margin-top:10px}.wrong{margin-top:8px;padding:11px;border:1px solid #6e3b49;border-radius:12px;background:#1f1726;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:720px){main{padding:9px 8px 90px}.identity,.choices,.summary{grid-template-columns:1fr}.card{padding:13px}.question{font-size:18px}.actions{display:grid}.actions .btn{width:100%}}

<body>
<main>
<section class="card"><div class="top"><div><span id="sessionChip" class="chip">S1</span><h1 id="title">CSAI2102 Graded Mission</h1><p id="subtitle" class="muted">กำลังตรวจสิทธิ์จาก Google Sheet…</p></div><span class="spacer"></span><button id="mapBtn" class="btn">แผนที่รายวิชา</button></div><div class="identity"><div><b>รหัสนักศึกษา</b><br><span id="sidText">—</span></div><div><b>ชื่อผู้เรียน</b><br><span id="nameText">—</span></div><div><b>Section</b><br><span id="sectionText">101</span></div></div><div id="authority" class="notice wait" style="margin-top:10px">กำลังตรวจ Profile และสิทธิ์ของด่านจาก Sheet</div></section>
<section id="entry" class="screen on card"><h2>Mission แบบให้คะแนน</h2><p id="missionText" class="muted"></p><div id="entryNote" class="notice">ยังไม่พร้อมเริ่ม</div><div class="actions"><button id="start" class="btn blue" disabled>▶ เริ่ม Graded Mission</button><button id="retryAuthority" class="btn amber" hidden>ตรวจสถานะอีกครั้ง</button><button id="returnEntry" class="btn green" hidden>กลับ Session</button></div></section>
<section id="game" class="screen"><section class="card"><div id="hud" class="hud"></div></section><section class="card"><div id="caseContext" class="context"></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><div class="actions"><button id="next" class="btn blue" disabled>ข้อต่อไป</button><button id="exit" class="btn">ออกจาก Mission</button></div></section></section>
<section id="result" class="screen card"><div id="badge" class="notice"></div><div id="score" style="font-size:58px;font-weight:950;margin:10px 0">0</div><div id="stars" style="font-size:25px;color:#fbbf24">☆☆☆</div><p id="resultText" class="muted"></p><div id="summary" class="summary"></div><div id="review" class="review"></div><div id="saveNote" class="notice" style="margin-top:12px">ต้องบันทึกผลลง Sheet ก่อน ระบบจึงจะนับ Mission อย่างเป็นทางการ</div><div class="actions"><button id="save" class="btn green">บันทึกผล Mission แบบ Graded</button><button id="checkSave" class="btn blue" hidden>ตรวจยืนยันจาก Sheet</button><button id="replay" class="btn amber">↻ สร้าง Deck ใหม่</button><button id="continue" class="btn blue" hidden disabled>ไป Coding Lab ต่อ</button><button id="mapResult" class="btn">กลับแผนที่</button></div></section>
</main>
<script>
(function(){'use strict';
const API='https://script.google.com/macros/s/AKfycbwXSUHbhVbZtKcjNIDzs4TawAohdeInm1MxLpomVeST2JilOL3L0LWQtT4_Yb7fbJG9/exec';
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);const ORDER=['s1','s2','s3','b1','s4','s5','s6','b2','s7','s8','s9','b3','s10','s11','s12','b4','s13','s14','s15','b5'];let mission=String(q.get('mission')||q.get('session')||'s1').toLowerCase().replace(/^m(?=\d)/,'s').replace(/^boss/,'b');if(!ORDER.includes(mission))mission='s1';const session=mission.toUpperCase(),sid=String(q.get('studentId')||'').trim(),studentName=String(q.get('studentName')||'').trim(),section='101';
function sessionUrl(){const u=new URL('./student-session-router-v724.html',location.href);u.searchParams.set('mission',mission);u.searchParams.set('session',session);u.searchParams.set('studentId',sid);u.searchParams.set('studentName',studentName);u.searchParams.set('section',section);u.searchParams.set('release','mission735-return');u.searchParams.set('_',Date.now());return u.href}
const returnUrl=q.get('returnUrl')||sessionUrl();const mapUrl='./course-map-all-v720.html?studentId='+encodeURIComponent(sid)+'&studentName='+encodeURIComponent(studentName)+'&section=101&from='+encodeURIComponent(mission)+'&_='+Date.now();
let deck=[],index=0,correct=0,combo=0,maxCombo=0,wrong=[],answered=false,startedAt=0,result=null,round=1,verified=false,saving=false,authorityBusy=false,pendingPayload=null,pendingAccepted=false;const C=window.AIQuestAllContentV702;const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const uid=()=>('mission_'+sid+'_'+session+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9));const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');scrollTo({top:0,behavior:'auto'})}function threshold(){if(mission==='b5')return 75;if(mission[0]==='b')return 70;return 60}function spec(){return C&&typeof C.spec==='function'?C.spec(mission):(C&&C.sessions?C.sessions[mission]:null)}
async function rawPost(body,timeout=45000){const ctl=new AbortController();let timedOut=false;const timer=setTimeout(()=>{timedOut=true;ctl.abort()},timeout);try{const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body),signal:ctl.signal});if(!r.ok)throw Error('HTTP_'+r.status);const text=await r.text();try{return JSON.parse(text)}catch(e){throw Error('BACKEND_NOT_JSON')}}catch(e){if(timedOut||e?.name==='AbortError'||/aborted/i.test(String(e?.message||e)))throw Error('REQUEST_TIMEOUT');throw e}finally{clearTimeout(timer)}}
async function post(module,action,data,opt){const cfg=Object.assign({timeout:45000,retries:1},opt||{});let last=null;for(let i=0;i<=cfg.retries;i++){try{return await rawPost(Object.assign({module,action,studentId:sid,studentName,section,sessionId:session,requestId:Date.now()+'-'+Math.random()},data||{}),cfg.timeout)}catch(e){last=e;if(i<cfg.retries)await sleep(900*(i+1))}}throw last||Error('REQUEST_FAILED')}
async function queueAttempt(payload){let last=null;for(let i=0;i<2;i++){try{const d=await rawPost({action:'sync_v23',kind:'attempt',payload},45000);if(d&&d.ok===false)throw Error(d.error||d.code||'SYNC_REJECTED');return d||{ok:true}}catch(e){last=e;if(i===0)await sleep(1200)}}throw last||Error('SYNC_FAILED')}
function orderChoices(card){const distractors=[...(card.distractors||card.wrong||[])].filter(x=>String(x)!==String(card.correct)).slice(0,3);while(distractors.length<3)distractors.push('ยังไม่มีหลักฐานเพียงพอสำหรับข้อสรุปนี้');const slot=Math.max(0,Math.min(3,Number(card.answerSlot)));const out=distractors.slice();out.splice(slot,0,card.correct);return out.slice(0,4)}
function paintIdentity(){const s=spec()||{};$('sessionChip').textContent=session;$('title').textContent=session+' • '+(s.title||'Graded Mission');$('subtitle').textContent=(s.theme||'AI Quest')+' • Google Sheet เป็นแหล่งข้อมูลทางการ';$('missionText').textContent=(s.mission||s.topic||'ทำ Mission ให้ผ่านเกณฑ์ก่อนเข้าสู่ Coding Lab');$('sidText').textContent=sid||'—';$('nameText').textContent=studentName||'—';$('sectionText').textContent=section;[$('mapBtn'),$('mapResult')].forEach(b=>b.onclick=()=>{window.top.location.href=mapUrl});$('returnEntry').onclick=()=>{window.top.location.href=returnUrl};$('continue').onclick=()=>{if(!$('continue').disabled)window.top.location.href=returnUrl}}
function setAuthorityError(e){verified=false;$('start').disabled=true;$('retryAuthority').hidden=false;$('authority').className='notice bad';const code=String(e?.message||e);$('authority').textContent=code==='REQUEST_TIMEOUT'?'ตรวจสถานะจาก Sheet ใช้เวลานานเกินไป ระบบจะลองใหม่ได้โดยไม่ทำข้อมูลเดิมหาย':'ตรวจสิทธิ์จาก Sheet ไม่สำเร็จ: '+code;$('entryNote').className='notice bad';$('entryNote').textContent='ยังไม่ปลดล็อกจากข้อมูลในเครื่อง • กด “ตรวจสถานะอีกครั้ง” เพื่อเชื่อม Server ใหม่'}
async function verifyAuthority(){if(authorityBusy)return;authorityBusy=true;$('retryAuthority').hidden=true;$('authority').className='notice wait';$('authority').textContent='กำลังตรวจ Profile และสถานะจาก Google Sheet…';$('entryNote').className='notice';$('entryNote').textContent='กรุณารอสักครู่ ระบบกำลังยืนยันข้อมูลทางการ';try{if(!sid||!studentName)throw Error('IDENTITY_MISSING');const flow=await post('AIQFLOW','GET_FLOW_PROGRESS',{}, {timeout:45000,retries:1});if(!flow||flow.ok===false)throw Error(flow?.code||'FLOW_STATUS_FAILED');const row=flow.progress&&flow.progress[mission];if(!row)throw Error('FLOW_STATUS_MISSING');if(row.completed||row.missionPassed||row.mission?.completed){verified=true;$('authority').className='notice good';$('authority').textContent='✓ Sheet ยืนยันว่า Mission นี้ผ่านแล้ว ไม่ต้องทำซ้ำ';$('entryNote').className='notice good';$('entryNote').textContent='ขั้นตอนถัดไปอยู่ที่ Session Router';$('returnEntry').hidden=false;$('start').hidden=true;return}if(!row.unlocked){$('authority').className='notice bad';$('authority').textContent='ด่านนี้ยังล็อกตามข้อมูลใน Sheet';$('entryNote').className='notice bad';$('entryNote').textContent='ต้องจบด่านก่อนหน้าให้ครบ Mission + Coding + Reflection';return}verified=true;$('authority').className='notice good';$('authority').textContent='✓ Sheet ยืนยัน Profile และสิทธิ์ของด่านแล้ว';$('entryNote').className='notice good';$('entryNote').textContent='พร้อมเริ่ม Graded Mission • ต้องได้อย่างน้อย '+threshold()+'%';$('start').disabled=false}catch(e){setAuthorityError(e)}finally{authorityBusy=false}}
function buildDeck(){if(!C||typeof C.deck!=='function')throw Error('CONTENT_ENGINE_NOT_READY');deck=C.deck(mission,round)||[];if(deck.length<15)throw Error('DECK_INCOMPLETE_'+deck.length);deck=deck.slice(0,15);index=0;correct=0;combo=0;maxCombo=0;wrong=[];answered=false;startedAt=Date.now();result=null;pendingPayload=null;pendingAccepted=false}
function renderHud(){const pct=Math.round(index/deck.length*100);$('hud').innerHTML='<span class="chip">'+session+'</span><span class="chip">เคส '+(index+1)+'/'+deck.length+'</span><span class="chip">ถูก '+correct+'</span><span class="chip">🔥 x'+combo+'</span><div class="bar"><i style="width:'+pct+'%"></i></div>'}
function renderCard(){if(index>=deck.length){finish();return}const card=deck[index],choices=orderChoices(card);renderHud();$('caseContext').innerHTML='<span class="chip risk">'+esc(card.riskLevel||card.phase||'CASE')+'</span> <b>'+esc(card.context||card.concept||'Case')+'</b><br><span class="muted">'+esc(card.concept||card.principle||'')+'</span>';$('question').textContent=card.prompt||'';$('choices').innerHTML=choices.map((x,i)=>'<button class="choice" data-choice="'+i+'">'+esc(x)+'</button>').join('');$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=true;answered=false;document.querySelectorAll('[data-choice]').forEach((b,i)=>b.onclick=()=>answer(choices[i],b))}
function answer(value,button){if(answered)return;answered=true;const card=deck[index],ok=String(value)===String(card.correct);if(ok){correct++;combo++;maxCombo=Math.max(maxCombo,combo)}else{combo=0;wrong.push({caseNo:index+1,context:card.context||'',concept:card.concept||'',prompt:card.prompt||'',answer:value,correct:card.correct,principle:card.principle||''})}document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;if(String(b.textContent)===String(card.correct))b.classList.add('ok')});if(!ok)button.classList.add('no');$('feedback').className='feedback show '+(ok?'good':'bad');$('feedback').innerHTML=ok?'<b>✓ ถูกต้อง</b><br>'+esc(card.principle||card.concept||''):('<b>ยังไม่ถูก</b><br><b>คำตอบที่เหมาะสม:</b> '+esc(card.correct)+'<br>'+esc(card.principle||''));$('next').disabled=false;renderHud()}
function finish(){const score=Math.round(correct/deck.length*100),pass=score>=threshold(),usedSec=Math.max(1,Math.round((Date.now()-startedAt)/1000));result={score,pass,usedSec,correct,total:deck.length,attemptId:uid()};$('badge').className='notice '+(pass?'good':'bad');$('badge').textContent=pass?'✓ ผ่าน Mission แบบ Graded':'ยังไม่ผ่าน Mission';$('score').textContent=score;$('stars').textContent='★'.repeat(score>=85?3:score>=70?2:score>=60?1:0)+'☆'.repeat(score>=85?0:score>=70?1:score>=60?2:3);$('resultText').textContent=pass?'ผ่านเกณฑ์ Mission แล้ว แต่ยังต้องให้ Sheet ยืนยันก่อนเปิด Coding Lab':'ต้องได้อย่างน้อย '+threshold()+'% จึงจะเปิด Coding Lab';$('summary').innerHTML='<div class="metric"><b>'+correct+'/'+deck.length+'</b><br>คำตอบถูก</div><div class="metric"><b>'+score+'%</b><br>คะแนน Mission</div><div class="metric"><b>'+usedSec+'</b><br>วินาที</div>';$('review').innerHTML=wrong.length?'<h3>Case ที่ควรทบทวน</h3>'+wrong.slice(0,8).map(x=>'<div class="wrong"><b>Case '+x.caseNo+' • '+esc(x.context)+'</b><br>'+esc(x.prompt)+'<br><b>คำตอบที่เหมาะสม:</b> '+esc(x.correct)+'</div>').join(''):'<h3>Perfect Deck</h3><p class="muted">ตอบถูกครบทุก Case ในรอบนี้</p>';$('save').disabled=false;$('save').textContent='บันทึกผล Mission แบบ Graded';$('checkSave').hidden=true;$('continue').hidden=true;$('continue').disabled=true;show('result')}
function makePayload(){if(pendingPayload)return pendingPayload;const s=spec()||{};pendingPayload={attemptId:result.attemptId,studentId:sid,studentName,section,sessionId:session,missionId:mission,missionTitle:s.title||session,difficulty:'graded',score:result.score,accuracy:result.score,correct:result.correct,total:result.total,stars:result.score>=85?3:result.score>=70?2:result.score>=60?1:0,gateStatus:result.pass?'passed':'review',mastered:result.score>=85,usedTimeSec:result.usedSec,maxCombo,wrong:wrong.length,bossWin:mission[0]==='b'&&result.pass,runMode:'graded',isPractice:false,isGraded:true,clientTs:new Date().toISOString(),schemaVersion:'20260810-MISSION-V735-CONFIRM',extraJson:{contentVersion:C?.version||'unknown',deckRound:round,deckTotal:deck.length,threshold:threshold(),wrongItems:wrong}};return pendingPayload}
async function missionConfirmed(){try{const d=await post('AIQFLOW','GET_SESSION_STATUS',{}, {timeout:40000,retries:0});return !!(d&&d.ok!==false&&(d.mission?.completed||d.mission?.passed||d.missionPassed||d.missionCompleted))}catch(e){return false}}
async function waitForConfirmation(rounds=5){for(let i=0;i<rounds;i++){if(await missionConfirmed())return true;if(i<rounds-1)await sleep(1800)}return false}
function markConfirmed(){pendingAccepted=true;$('saveNote').className='notice good';$('saveNote').textContent='✓ Sheet ยืนยันผล Mission แล้ว • พร้อมไป Coding Lab';$('save').textContent='✓ บันทึกแล้ว';$('save').disabled=true;$('checkSave').hidden=true;$('continue').hidden=false;$('continue').disabled=false}
async function checkPendingSave(){if(saving)return;saving=true;$('checkSave').disabled=true;$('saveNote').className='notice wait';$('saveNote').textContent='กำลังตรวจว่าผล Mission ปรากฏใน Sheet แล้วหรือยัง…';try{if(await waitForConfirmation(4)){markConfirmed();return}$('saveNote').className='notice bad';$('saveNote').textContent='ยังไม่พบหลักฐาน Mission ใน Sheet ตอนนี้\nไม่ต้องเล่น Mission ใหม่ • รอสักครู่แล้วกด “ตรวจยืนยันจาก Sheet” อีกครั้ง';$('checkSave').hidden=false;$('checkSave').disabled=false;$('continue').hidden=true;$('continue').disabled=true}catch(e){$('saveNote').className='notice bad';$('saveNote').textContent='ตรวจยืนยันไม่สำเร็จ: '+String(e.message||e);$('checkSave').hidden=false;$('checkSave').disabled=false;$('continue').hidden=true;$('continue').disabled=true}finally{saving=false}}
async function saveResult(){if(!result||saving)return;saving=true;$('save').disabled=true;$('save').textContent='กำลังบันทึก…';$('checkSave').hidden=true;$('continue').hidden=true;$('continue').disabled=true;$('saveNote').className='notice wait';$('saveNote').textContent='กำลังส่งผล Mission ไปยัง Server และรอ Sheet ยืนยัน';try{if(!pendingAccepted){const ack=await queueAttempt(makePayload());pendingAccepted=!!(ack&&ack.ok!==false)}if(!result.pass){$('saveNote').className='notice good';$('saveNote').textContent='✓ Server รับ Attempt แล้ว แต่คะแนนยังไม่ผ่าน จึงยังไม่เปิด Coding Lab';$('save').textContent='✓ บันทึก Attempt แล้ว';$('save').disabled=true;return}if(await waitForConfirmation(5)){markConfirmed();return}$('saveNote').className='notice bad';$('saveNote').textContent='Server รับผลแล้ว แต่ Sheet ยังไม่ยืนยัน Mission ภายในเวลาที่กำหนด\nไม่ต้องเล่นใหม่ และยังไม่เปิด Coding Lab จนกว่าจะยืนยัน';$('save').textContent='ส่งผลอีกครั้ง';$('save').disabled=false;$('checkSave').hidden=false;$('checkSave').disabled=false}catch(e){$('saveNote').className='notice bad';$('saveNote').textContent='ส่งหรือยืนยันผลยังไม่สำเร็จ: '+String(e.message||e)+'\nไม่ต้องเล่น Mission ใหม่ • สามารถลองส่งผลเดิมอีกครั้งได้';$('save').textContent='ส่งผลอีกครั้ง';$('save').disabled=false;$('checkSave').hidden=!pendingAccepted;$('checkSave').disabled=false;$('continue').hidden=true;$('continue').disabled=true}finally{saving=false}}
$('retryAuthority').onclick=verifyAuthority;$('checkSave').onclick=checkPendingSave;$('start').onclick=()=>{if(!verified)return;try{buildDeck();show('game');renderCard()}catch(e){$('entryNote').className='notice bad';$('entryNote').textContent='สร้าง Deck ไม่สำเร็จ: '+String(e.message||e)}};$('next').onclick=()=>{if(!answered)return;index++;renderCard()};$('exit').onclick=()=>{if(confirm('ออกจาก Mission รอบนี้หรือไม่? ผลที่ยังไม่บันทึกจะไม่ถูกนับ'))show('entry')};$('save').onclick=saveResult;$('replay').onclick=()=>{round++;try{buildDeck();show('game');renderCard()}catch(e){$('saveNote').className='notice bad';$('saveNote').textContent=String(e.message||e)}};paintIdentity();verifyAuthority();
})();
</script>
</body>
