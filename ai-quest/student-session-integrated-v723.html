<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache">
<title>CSAI2102 Integrated Session v7.2.3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#071426;color:#e8f1ff}.bar{position:sticky;top:0;z-index:20;padding:10px 14px;background:#0d1a2d;border-bottom:1px solid #334155}.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand{font-weight:950;margin-right:auto}.btn{border:1px solid #334155;border-radius:11px;padding:10px 13px;background:#17263f;color:#fff;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:#0369a1}.btn.good{background:#07875a}.btn:disabled{opacity:.48;cursor:not-allowed}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.step{padding:8px 10px;border:1px solid #334155;border-radius:10px;background:#132238;font-size:13px}.step small{display:block;margin-top:3px;color:#cbd5e1}.step.good{border-color:#10b981;background:#09352e}.step.active{border-color:#38bdf8;background:#102744}.notice{margin-top:8px;padding:10px 11px;border-radius:10px;background:#132238;color:#dbeafe;font-size:13px;line-height:1.45}.notice.good{background:#064e3b;color:#d1fae5}.notice.bad{background:#4c1d2b;color:#fecdd3}.notice.wait{background:#3a2505;color:#fde68a;border:1px solid #a16207}.frame{display:block;width:100%;height:calc(100vh - 190px);min-height:560px;border:0;background:#071426}.reflection{display:none;max-width:1000px;margin:18px auto 100px;padding:20px;border:1px solid #38bdf8;border-radius:18px;background:#0f1d33}.reflection.on{display:block}.reflection textarea{width:100%;min-height:110px;padding:12px;border:1px solid #475569;border-radius:12px;background:#17263f;color:#fff;font:inherit}.reflection label{display:block;font-weight:800;margin:14px 0 7px;line-height:1.45}.status{white-space:pre-wrap;background:#071426;padding:12px;border-radius:12px;border:1px solid #334155;margin-top:12px}.loading{display:grid;place-items:center;min-height:55vh;font-weight:850;color:#cbd5e1;padding:24px;text-align:center}.bottom{display:none}@media(max-width:760px){body{padding-bottom:72px}.bar{padding:8px 10px}.top .btn{display:none}.brand{font-size:18px}.flow{display:none}.frame{height:calc(100vh - 120px);min-height:520px}.reflection{margin:10px 9px 90px;padding:14px}.bottom{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:40;grid-template-columns:repeat(4,1fr);gap:5px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(7,20,38,.97);border-top:1px solid #334155}.nav{min-height:54px;border:1px solid #334155;border-radius:11px;background:#132238;color:#dbeafe;font-size:11px;font-weight:850;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none}.nav.active{background:#0369a1}.nav.good{background:#065f46}.nav:disabled{opacity:.48}}
</style></head><body>
<header class="bar"><div class="top"><div id="brand" class="brand">CSAI2102</div><button id="missionBtn" class="btn primary">1 • Mission</button><button id="codingBtn" class="btn good">2 • Coding Lab</button><button id="reflectionBtn" class="btn" disabled>3 • Reflection</button><a id="mapBtn" class="btn">แผนที่</a></div><div class="flow"><div id="mStep" class="step"><b>1. Mission</b><small id="mText">กำลังตรวจ</small></div><div id="cStep" class="step"><b>2. Coding Lab</b><small id="cText">กำลังตรวจ</small></div><div id="rStep" class="step"><b>3. Reflection</b><small id="rText">กำลังตรวจ</small></div></div><div id="notice" class="notice wait">กำลังตรวจสถานะล่าสุดจาก Google Sheet…</div></header>
<div id="loading" class="loading">กำลังตรวจขั้นตอนที่ต้องทำต่อ…</div><iframe id="missionFrame" class="frame" title="AI Quest Mission" hidden></iframe>
<section id="reflectionPanel" class="reflection"><h2 id="reflectionTitle">Reflection</h2><p>ตอบจาก Mission และ Coding Lab ข้อละอย่างน้อย 20 ตัวอักษร</p><label for="r1">1. สิ่งสำคัญที่เรียนรู้จากด่านนี้คืออะไร</label><textarea id="r1"></textarea><label for="r2">2. Coding Lab ช่วยให้เข้าใจแนวคิด AI อย่างไร</label><textarea id="r2"></textarea><label for="r3">3. จะนำแนวคิดนี้ไปใช้แก้ปัญหาใดได้บ้าง</label><textarea id="r3"></textarea><p><button id="submit" class="btn primary">ส่ง Reflection และจบ Session</button> <button id="back" class="btn">กลับ Mission</button></p><div id="status" class="status">ยังไม่ได้ส่ง</div></section>
<nav class="bottom"><button id="navMission" class="nav"><span>🎯</span><span>Mission</span></button><button id="navCoding" class="nav"><span>💻</span><span>Coding</span></button><button id="navReflection" class="nav" disabled><span>📝</span><span>Reflection</span></button><a id="navMap" class="nav"><span>🗺️</span><span>แผนที่</span></a></nav>
<script>(function(){'use strict';
const API='https://script.google.com/macros/s/AKfycbwXSUHbhVbZtKcjNIDzs4TawAohdeInm1MxLpomVeST2JilOL3L0LWQtT4_Yb7fbJG9/exec';
const p=new URLSearchParams(location.search),mission=(p.get('mission')||p.get('session')||'s1').toLowerCase(),session=mission.toUpperCase(),sid=(p.get('studentId')||'').trim(),sname=(p.get('studentName')||'').trim(),section=(p.get('section')||'101').trim(),$=id=>document.getElementById(id);let state={mission:false,coding:false,reflection:false,completed:false},routed=false;
$('brand').textContent='CSAI2102 • '+session;
function idUrl(path){const u=new URL(path,location.href);u.searchParams.set('mission',mission);u.searchParams.set('session',session);u.searchParams.set('studentId',sid);u.searchParams.set('studentName',sname);u.searchParams.set('section',section);u.searchParams.set('_',Date.now());return u}
function mapUrl(){return idUrl('./course-map-all-v720.html')}
function missionUrl(){const u=idUrl('./student-aiquest-all-mission-v711.html');u.searchParams.set('integrated','1');u.searchParams.set('release','v723');return u}
function codingUrl(){const u=idUrl('./coding-lab-mobile-gate-v1.html');u.searchParams.set('returnUrl',location.href);return u}
async function post(module,action,data,timeout=22000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({module,action,studentId:sid,studentName:sname,section,sessionId:session,requestId:Date.now()+'-'+Math.random()},data||{})),signal:ctl.signal});if(!r.ok)throw Error('HTTP_'+r.status);return JSON.parse(await r.text())}finally{clearTimeout(timer)}}
function applyFlow(d){state.mission=!!(d?.mission?.completed||d?.missionPassed||d?.missionCompleted);state.reflection=!!(d?.reflection?.completed||d?.reflectionSubmitted||d?.reflectionCompleted);state.completed=!!(d?.completed||d?.sessionCompleted)}
async function codingStatus(){try{const d=await post('AIQCODING','GET_CODING_STATUS',{});state.coding=!!(d?.completed||Number(d?.bestScore||0)>=60);return d}catch(e){return null}}
function paint(){const ready=state.mission&&state.coding;$('mStep').className='step '+(state.mission?'good':'active');$('cStep').className='step '+(state.coding?'good':state.mission?'active':'');$('rStep').className='step '+(state.reflection?'good':ready?'active':'');$('mText').textContent=state.mission?'ผ่านแล้ว':'ต้องทำ Mission';$('cText').textContent=state.coding?'ผ่านแล้ว':state.mission?'ขั้นตอนถัดไป':'รอ Mission';$('rText').textContent=state.reflection?'ส่งแล้ว':ready?'พร้อมทำ Reflection':'รอ Mission + Coding';$('reflectionBtn').disabled=!ready;$('navReflection').disabled=!ready;$('navMission').className='nav '+(state.mission?'good':'active');$('navCoding').className='nav '+(state.coding?'good':state.mission?'active':'');$('navReflection').className='nav '+(state.reflection?'good':ready?'active':'')}
function showMission(){routed=true;$('loading').hidden=true;$('reflectionPanel').classList.remove('on');$('missionFrame').hidden=false;if(!$('missionFrame').src)$('missionFrame').src=missionUrl().href;scrollTo(0,0)}
function openCoding(){routed=true;location.href=codingUrl().href}
function openReflection(){routed=true;$('loading').hidden=true;$('missionFrame').hidden=true;$('reflectionPanel').classList.add('on');scrollTo(0,0)}
function route(){if(routed)return;if(state.completed){$('notice').className='notice good';$('notice').textContent='✓ Session Complete';showMission()}else if(!state.mission){$('notice').className='notice';$('notice').textContent='เริ่มทำ Mission';showMission()}else if(!state.coding){$('notice').className='notice';$('notice').textContent='Mission ผ่านแล้ว • ทำ Coding Lab ต่อ';$('loading').textContent='กำลังเปิด Coding Gate…';setTimeout(openCoding,300)}else{$('notice').className='notice good';$('notice').textContent='✓ Coding Lab ผ่านแล้ว • ทำ Reflection ต่อ';openReflection()}}
async function verify(){if(!sid){$('notice').className='notice bad';$('notice').textContent='ไม่พบรหัสนักศึกษา';return}try{const flow=await post('AIQFLOW','GET_SESSION_STATUS',{});if(flow?.ok)applyFlow(flow);await codingStatus();state.completed=state.completed||(state.mission&&state.coding&&state.reflection);paint();route()}catch(e){$('notice').className='notice bad';$('notice').textContent='ตรวจสถานะไม่สำเร็จ: '+String(e.message||e);$('loading').textContent='กดรีเฟรชเพื่อตรวจใหม่ ข้อมูลเดิมไม่หาย'}}
[$('mapBtn'),$('navMap')].forEach(a=>a.href=mapUrl().href);$('missionBtn').onclick=showMission;$('navMission').onclick=showMission;$('codingBtn').onclick=openCoding;$('navCoding').onclick=openCoding;$('reflectionBtn').onclick=openReflection;$('navReflection').onclick=openReflection;$('back').onclick=showMission;
$('submit').onclick=async()=>{const a=[$('r1').value.trim(),$('r2').value.trim(),$('r3').value.trim()];if(a.some(x=>x.length<20)){$('status').textContent='แต่ละคำตอบต้องมีอย่างน้อย 20 ตัวอักษร';return}$('submit').disabled=true;$('status').textContent='กำลังส่ง…';try{const d=await post('AIQFLOW','SUBMIT_REFLECTION',{reflection1:a[0],reflection2:a[1],reflection3:a[2]});$('status').textContent=d?.ok?'✓ ส่ง Reflection สำเร็จ':JSON.stringify(d);if(d?.ok){state.reflection=true;state.completed=true;paint();$('notice').className='notice good';$('notice').textContent='✓ Session Complete'}}catch(e){$('status').textContent='ส่งไม่สำเร็จ: '+String(e.message||e)}finally{$('submit').disabled=false}};
verify();window.addEventListener('pageshow',()=>{routed=false;verify()});
})();</script></body></html>
