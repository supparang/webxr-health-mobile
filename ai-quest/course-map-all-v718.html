<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426">
<title>CSAI2102 • Quest Map v718</title>
<style>
:root{--bg:#071426;--panel:#101d33;--panel2:#142640;--line:#334155;--text:#e8f1ff;--muted:#a9bad3;--green:#059669;--blue:#0284c7;--amber:#b45309;--violet:#7c3aed;--bad:#be3455}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#06101f,#08162a 55%,#111537);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:1080px;margin:auto;padding:14px 12px 44px}.card{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:20px;background:rgba(15,23,42,.95)}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted);line-height:1.55}.profile{display:grid;grid-template-columns:1fr 1fr .35fr auto;gap:8px}.input,.btn{min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#17263f;color:#fff;font:inherit}.btn{font-weight:900;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}.btn.good{background:var(--green)}.btn.blue{background:var(--blue)}.btn.amber{background:var(--amber)}.btn.violet{background:var(--violet)}.btn:disabled{opacity:.55;cursor:wait}.notice{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#132238;line-height:1.5}.notice.good{border-color:#168568;color:#bbf7d0}.notice.bad{border-color:var(--bad);color:#fecdd3}.notice.loading{border-color:#a16207;color:#fde68a}.notice small{display:block;margin-top:5px;opacity:.85}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.block{grid-column:1/-1;padding:12px 14px;border-left:6px solid #38bdf8;border-radius:13px;background:#0e1a2e;font-size:19px;font-weight:950}.mission{min-height:255px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel);display:flex;flex-direction:column;gap:9px}.mission.done{border-color:#10b981}.mission.active{border-color:#38bdf8}.mission.partial{border-color:#f59e0b}.mission.locked{opacity:.56}.mission.boss{background:#1b1535}.status{font-size:13px;font-weight:900}.topic{color:var(--muted);line-height:1.45}.parts{display:grid;gap:6px}.part{padding:8px;border:1px solid var(--line);border-radius:10px;background:#0c1729;font-size:13px}.part.ok{border-color:#15803d;background:#052e24;color:#bbf7d0}.part.wait{border-color:#a16207;background:#351b05;color:#fde68a}.part.lock{opacity:.6}.result{padding:9px;border:1px solid #15803d;border-radius:11px;background:#052e24;color:#bbf7d0}.result.unknown{border-color:#64748b;background:#172033;color:#cbd5e1}.actions{margin-top:auto}.actions .btn{width:100%}.meta{margin-top:7px;color:var(--muted);font-size:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){main{padding:10px 8px 32px}.profile,.grid{grid-template-columns:1fr}.mission{min-height:auto}.card{padding:13px}.btn{min-height:52px}}
</style></head><body><main>
<h1>🧠 CSAI2102 AI Quest</h1><p class="muted">สถานะทางการอ่านจาก Google Sheet เพียงแหล่งเดียว • Mission + Coding Lab + Reflection ต้องครบก่อนเปิดด่านถัดไป</p>
<section class="card"><h2>ข้อมูลผู้เรียน</h2><div class="profile"><input id="sid" class="input" inputmode="numeric" placeholder="รหัสนักศึกษา"><input id="name" class="input" placeholder="ชื่อ-นามสกุล"><input id="section" class="input" value="101" readonly><button id="load" class="btn good">โหลดจาก Sheet</button></div><div id="note" class="notice">กรอกรหัสนักศึกษา แล้วโหลดข้อมูลจาก Sheet</div><div id="meta" class="meta"></div></section>
<section class="card"><h2>Mission Grid</h2><div id="grid" class="grid"></div></section>
</main><script>
(function(){'use strict';
const API='https://script.google.com/macros/s/AKfycbwXSUHbhVbZtKcjNIDzs4TawAohdeInm1MxLpomVeST2JilOL3L0LWQtT4_Yb7fbJG9/exec';
const ORDER=['s1','s2','s3','b1','s4','s5','s6','b2','s7','s8','s9','b3','s10','s11','s12','b4','s13','s14','s15','b5'];
const BLOCK={s1:'Block 1 • AI Foundation',s4:'Block 2 • Search Strategy',s7:'Block 3 • Knowledge & Reasoning',s10:'Block 4 • Machine Learning',s13:'Block 5 • Modern AI & Governance'};
const TITLE={s1:'AI Spotter',s2:'Agent Builder',s3:'Search Maze',b1:'Foundation Boss',s4:'UCS Cost Board',s5:'A* Overlay',s6:'Minimax Board',b2:'Search Boss',s7:'Rule Chain Builder',s8:'Bayes Console',s9:'Expert Diagnosis Board',b3:'Reasoning Boss',s10:'Data Pipeline Defense',s11:'Threshold Rescue',s12:'Cluster Cartographer',b4:'ML Boss',s13:'Neural Forge',s14:'Reward Hack Arena',s15:'RAG Fact Check',b5:'Final Applied AI Boss'};
const TOPIC={s1:'AI vs Automation',s2:'Intelligent Agent และ PEAS',s3:'Breadth-First Search',b1:'AI + Agent + Search',s4:'Uniform Cost Search',s5:'Heuristic และ A*',s6:'Game Search และ Minimax',b2:'Search Strategy Integration',s7:'Facts • Rules • Inference',s8:'Prior • Evidence • Posterior',s9:'Expert System',b3:'Knowledge and Reasoning',s10:'Train • Validation • Test',s11:'Metrics • Threshold',s12:'Clusters • Outliers',b4:'Machine Learning Integration',s13:'Neural Network',s14:'Reinforcement Learning',s15:'NLP • Generative AI • RAG',b5:'Applied AI Integration'};
const $=id=>document.getElementById(id);let sid='',verified=false,rows={},requestNo=0;
const bool=v=>v===true||['true','1','yes','passed','completed','mastered','submitted'].includes(String(v??'').toLowerCase());
const num=v=>v===null||v===undefined||String(v).trim()===''?null:(Number.isFinite(Number(v))?Number(v):null);
const first=(...a)=>{for(const v of a){const n=num(v);if(n!==null)return n}return null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function say(t,k='',d=''){$('note').className='notice'+(k?' '+k:'');$('note').innerHTML=esc(t)+(d?'<small>'+esc(d)+'</small>':'')}
function empty(id){return{id:id,mission:false,coding:false,reflection:false,completed:false,unlocked:id==='s1',score:null,accuracy:null,correct:null,total:null}}
function normalize(id,r){r=r||{};const m=r.mission||{},c=r.coding||{},f=r.reflection||{};const mission=bool(r.missionPassed)||bool(r.missionCompleted)||bool(m.completed)||bool(m.passed);const coding=bool(r.codingPassed)||bool(r.codingCompleted)||bool(c.completed)||bool(c.passed);const reflection=bool(r.reflectionSubmitted)||bool(r.reflectionCompleted)||bool(f.completed)||bool(f.submitted);return{id,mission,coding,reflection,completed:bool(r.completed)||bool(r.sessionCompleted)||(mission&&coding&&reflection),unlocked:bool(r.unlocked)||id==='s1',score:first(r.missionScore,m.bestScore,m.score,r.score),accuracy:first(r.missionAccuracy,m.accuracy,r.accuracy),correct:first(r.missionCorrect,m.correct,r.correct,r.correctCount),total:first(r.missionTotal,m.total,r.total,r.questionCount)}}
function derive(x){ORDER.forEach((id,i)=>{if(!x[id])x[id]=empty(id);x[id].unlocked=id==='s1'||!!x[ORDER[i-1]]?.completed});return x}
function parse(d){const out={};ORDER.forEach(id=>out[id]=empty(id));const src=d?.progress||d?.data?.progress||d?.sessions||d?.data?.sessions;if(Array.isArray(src))src.forEach(r=>{const id=String(r.sessionId||r.session||'').toLowerCase();if(ORDER.includes(id))out[id]=normalize(id,r)});else if(src&&typeof src==='object')Object.entries(src).forEach(([k,v])=>{const id=String(k).toLowerCase().replace(/^m/,'s').replace(/^boss/,'b');if(ORDER.includes(id))out[id]=normalize(id,v)});return derive(out)}
async function post(action,payload,timeout=22000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({module:'AIQFLOW',action,section:'101',requestId:Date.now()+'-'+Math.random()},payload||{})),signal:ctl.signal});if(!r.ok)throw Error('HTTP_'+r.status);const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){throw Error('BACKEND_NOT_JSON')}return d}catch(e){if(e.name==='AbortError')throw Error('REQUEST_TIMEOUT');throw e}finally{clearTimeout(timer)}}
async function retry(label,fn,n=3){let err;for(let i=1;i<=n;i++){try{return await fn()}catch(e){err=e;if(i<n){say(label+' • กำลังลองใหม่อัตโนมัติ','loading','ครั้งที่ '+(i+1)+' จาก '+n);await new Promise(r=>setTimeout(r,i*800))}}}throw err}
async function fallback(){const out={};let ok=0;for(let i=0;i<ORDER.length;i+=4){const batch=ORDER.slice(i,i+4);const got=await Promise.all(batch.map(async id=>{try{const d=await retry('กำลังตรวจ '+id.toUpperCase(),()=>post('GET_SESSION_STATUS',{studentId:sid,sessionId:id.toUpperCase()},18000),2);if(!d?.ok)throw Error('STATUS_FAILED');return[id,normalize(id,d)]}catch(e){return[id,null]}}));got.forEach(([id,r])=>{out[id]=r||empty(id);if(r)ok++})}if(!ok)throw Error('NO_SESSION_STATUS');return derive(out)}
function part(label,ok,locked){return'<div class="part '+(ok?'ok':locked?'lock':'wait')+'">'+(ok?'✓':locked?'🔒':'○')+' '+label+'</div>'}
function result(r){if(!r.mission)return'';const p=[];if(r.score!==null)p.push(Math.round(r.score)+'%');if(r.accuracy!==null)p.push('Accuracy '+Math.round(r.accuracy)+'%');if(r.correct!==null&&r.total!==null)p.push(Math.round(r.correct)+'/'+Math.round(r.total)+' ข้อ');return p.length?'<div class="result">'+p.map(esc).join(' • ')+'</div>':'<div class="result unknown">ผ่าน Mission แล้ว • ยังไม่มีรายละเอียดคะแนนใน Sheet</div>'}
function url(id){const u=new URL('./student-session-integrated-v721.html',location.href);u.searchParams.set('mission',id);u.searchParams.set('session',id.toUpperCase());u.searchParams.set('studentId',sid);u.searchParams.set('studentName',$('name').value.trim());u.searchParams.set('section','101');u.searchParams.set('release','map718');return u.href}
function render(){const g=$('grid');g.innerHTML='';ORDER.forEach(id=>{if(BLOCK[id])g.insertAdjacentHTML('beforeend','<div class="block">'+esc(BLOCK[id])+'</div>');const r=rows[id]||empty(id),open=verified&&r.unlocked,locked=!open,cls=['mission'];if(id[0]==='b')cls.push('boss');if(r.completed)cls.push('done');else if(locked)cls.push('locked');else if(r.mission||r.coding)cls.push('partial');else cls.push('active');let status=r.completed?'ผ่านครบ 3 ส่วนแล้ว':locked?'ล็อก':!r.mission?'เปิดเล่น':!r.coding?'เหลือ Coding Lab + Reflection':!r.reflection?'เหลือ Reflection':'กำลังตรวจ';let label=r.completed?'↻ ทบทวน / เล่นซ้ำ':!r.mission?'▶ เริ่ม Mission':!r.coding?'▶ ทำ Coding Lab':'▶ ส่ง Reflection';const action=open?'<a class="btn '+(r.completed?'good':!r.mission?'blue':!r.coding?'violet':'amber')+'" href="'+esc(url(id))+'">'+label+'</a>':'<span class="btn">ต้องครบ 3 ส่วนของด่านก่อนหน้า</span>';const e=document.createElement('article');e.className=cls.join(' ');e.innerHTML='<div class="status">'+esc(status)+'</div><h3>'+id.toUpperCase()+' • '+esc(TITLE[id])+'</h3><div class="topic">'+esc(TOPIC[id])+'</div><div class="parts">'+part('1. Mission',r.mission,locked&&!r.mission)+part('2. Coding Lab',r.coding,locked)+part('3. Reflection',r.reflection,locked)+'</div>'+result(r)+'<div class="actions">'+action+'</div>';g.appendChild(e)})}
async function load(){const mine=++requestNo;sid=$('sid').value.trim();if(!sid)return say('กรุณากรอกรหัสนักศึกษา','bad');verified=false;rows={};render();$('load').disabled=true;$('load').textContent='กำลังโหลด…';$('meta').textContent='';say('กำลังตรวจ Profile และ Progress จาก Google Sheet','loading','ระบบจะ retry อัตโนมัติ ไม่ต้องกดซ้ำ');try{const profile=await retry('กำลังตรวจ Profile',()=>post('LOOKUP_PROFILE',{studentId:sid}),3);if(mine!==requestNo)return;if(!(profile?.ok&&profile?.found&&profile?.profile)){verified=true;rows=derive({});$('name').readOnly=false;$('name').value='';render();say('ไม่พบข้อมูลใน Sheet — เริ่มได้เฉพาะ S1','good');return}$('name').value=profile.profile.studentName||profile.profile.name||'';$('name').readOnly=true;let d;try{d=await retry('กำลังโหลด Progress',()=>post('GET_FLOW_PROGRESS',{studentId:sid}),3);const src=d?.progress||d?.data?.progress||d?.sessions||d?.data?.sessions;if(!d?.ok||!src)throw Error('INCOMPLETE_PROGRESS');rows=parse(d)}catch(e){say('ข้อมูลรวมยังไม่ครบ • กำลังตรวจราย Session','loading');rows=await fallback()}if(mine!==requestNo)return;verified=true;render();say('โหลด official progress จาก Sheet สำเร็จ: '+sid+' • Section 101','good','ใช้ Mission + Coding + Reflection จาก response ชุดเดียว');$('meta').textContent='อัปเดต '+new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok'})}catch(e){if(mine!==requestNo)return;verified=false;rows={};render();console.error(e);say('เชื่อมต่อ Google Sheet ไม่สำเร็จ','bad','ระบบลองใหม่ครบแล้ว กรุณาตรวจอินเทอร์เน็ตแล้วกดโหลดอีกครั้ง')}finally{if(mine===requestNo){$('load').disabled=false;$('load').textContent='โหลดจาก Sheet'}}}
$('load').onclick=load;$('sid').addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('sid').addEventListener('input',()=>{requestNo++;verified=false;rows={};$('name').value='';$('name').readOnly=false;render();say('กรอกรหัสนักศึกษา แล้วโหลดข้อมูลจาก Sheet')});const q=new URLSearchParams(location.search);if(q.get('studentId')){$('sid').value=q.get('studentId');$('name').value=q.get('studentName')||'';setTimeout(load,80)}render();
})();
</script></body></html>
