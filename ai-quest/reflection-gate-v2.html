<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta name="theme-color" content="#071426"><title>CSAI2102 • Reflection Gate v2</title><style>:root{--bg:#071426;--panel:#101d33;--line:#334155;--text:#e8f1ff;--muted:#a9bad3;--ok:#07875a;--bad:#9f1239;--wait:#a16207;--blue:#0369a1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:900px;margin:auto;padding:16px 12px 90px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#065f46;color:#d1fae5;font-weight:900}.muted{color:var(--muted)}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#132238;line-height:1.5;white-space:pre-wrap}.good{background:#064e3b;border-color:#15803d;color:#d1fae5}.bad{background:#4c1d2b;border-color:var(--bad);color:#fecdd3}.wait{background:#3a2505;border-color:var(--wait);color:#fde68a}label{display:block;font-weight:850;margin:15px 0 7px}textarea{width:100%;min-height:120px;padding:12px;border:1px solid #475569;border-radius:12px;background:#17263f;color:#fff;font:inherit}.count{text-align:right;font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:#17263f;color:#fff;font:inherit;font-weight:900;text-decoration:none;cursor:pointer}.btn.green{background:var(--ok)}.btn.blue{background:var(--blue)}.btn:disabled{opacity:.45}@media(max-width:640px){.actions{display:grid}.btn{width:100%}}</style><script src="./js/aiquest-all-content-v702.js?v=20260813-pdf-aligned"></script></head><body><main><section class="card"><span id="badge" class="badge">S1</span><h1 id="title">Reflection</h1><p id="who" class="muted"></p><div id="authority" class="notice wait">กำลังยืนยัน Mission และ Coding จาก Google Sheet…</div></section><section id="form" class="card" hidden><h2>3 • Reflection</h2><p class="muted">ตอบข้อละอย่างน้อย 55 ตัวอักษร และทั้ง 3 ข้อต้องเป็นคนละประเด็น</p><label id="l1"></label><textarea id="r1"></textarea><div id="c1" class="count">0/55</div><label id="l2"></label><textarea id="r2"></textarea><div id="c2" class="count">0/55</div><label id="l3"></label><textarea id="r3"></textarea><div id="c3" class="count">0/55</div><div class="actions"><button id="submit" class="btn green" disabled>ส่ง Reflection และจบ Session</button><a id="map" class="btn">กลับแผนที่</a></div><div id="status" class="notice" style="margin-top:12px">ยังไม่ได้ส่ง</div></section><section id="blocked" class="card" hidden><div id="blockedText" class="notice bad"></div><div class="actions"><button id="retry" class="btn blue">ตรวจใหม่</button><a id="back" class="btn">กลับ Session</a><a id="map2" class="btn">กลับแผนที่</a></div></section></main><script>(function(){'use strict';const VERSION='20260813-REFLECTION-GATE-V2-SINGLE-STATUS',API='https://script.google.com/macros/s/AKfycbwXSUHbhVbZtKcjNIDzs4TawAohdeInm1MxLpomVeST2JilOL3L0LWQtT4_Yb7fbJG9/exec',q=new URLSearchParams(location.search),$=id=>document.getElementById(id),MIN=55;const raw=(q.get('session')||q.get('mission')||'S1').toUpperCase(),session=raw.replace(/^M(?=\d)/,'S').replace(/^BOSS/,'B'),mission=session.toLowerCase(),sid=(q.get('studentId')||'').trim(),name=(q.get('studentName')||'').trim(),section=(q.get('section')||'101').trim();const spec=window.AIQuestAllContentV702&&window.AIQuestAllContentV702.spec?window.AIQuestAllContentV702.spec(mission):null,prompts=(spec&&Array.isArray(spec.reflection)&&spec.reflection.length>=3?spec.reflection:['สรุปหลักฐานสำคัญจาก Mission','อธิบายสิ่งที่ได้เรียนรู้จาก Coding Lab','เสนอข้อจำกัดและวิธีนำความรู้ไปใช้']);function url(path){const u=new URL(path,location.href);u.searchParams.set('mission',mission);u.searchParams.set('session',session);u.searchParams.set('studentId',sid);u.searchParams.set('studentName',name);u.searchParams.set('section',section);u.searchParams.set('release',VERSION);u.searchParams.set('_',Date.now());return u.href}const mapUrl=url('./course-map-all-v720.html'),sessionUrl=url('./student-session-router-v724.html');$('badge').textContent=session;$('title').textContent=session+' • Reflection';$('who').textContent=(sid||'-')+' • '+(name||'-')+' • Section '+section;$('l1').textContent='1. '+prompts[0];$('l2').textContent='2. '+prompts[1];$('l3').textContent='3. '+prompts[2];$('map').href=mapUrl;$('map2').href=mapUrl;$('back').href=sessionUrl;async function post(module,action,data,timeout){timeout=timeout||45000;const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({module,action,studentId:sid,studentName:name,section,sessionId:session,requestId:Date.now()+'-'+Math.random()},data||{})),signal:ctl.signal});if(!r.ok)throw Error('HTTP_'+r.status);const t=await r.text();try{return JSON.parse(t)}catch(_){throw Error('BACKEND_NOT_JSON')}}catch(e){if(e&&e.name==='AbortError')throw Error('AUTHORITY_TIMEOUT');throw e}finally{clearTimeout(timer)}}function truth(v){return v===true||['true','1','yes','passed','pass','completed','complete','mastered','submitted','success','ok'].includes(String(v??'').trim().toLowerCase())}function norm(v){return String(v||'').toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9ก-๙]/g,'')}function block(msg){$('authority').className='notice bad';$('authority').textContent=msg;$('form').hidden=true;$('blocked').hidden=false;$('blockedText').textContent=msg}async function verify(){$('blocked').hidden=true;$('form').hidden=true;$('authority').className='notice wait';$('authority').textContent='กำลังยืนยัน Mission และ Coding จาก Google Sheet…';if(!sid||!name){block('ข้อมูลผู้เรียนไม่ครบ');return}try{const flow=await post('AIQFLOW','GET_SESSION_STATUS',{},45000);if(!flow||flow.ok===false)throw Error((flow&&flow.code)||'FLOW_STATUS_FAILED');const m=truth(flow.mission&&flow.mission.completed),c=truth(flow.coding&&flow.coding.completed)||Number(flow.coding&&flow.coding.bestScore||0)>=60,r=truth(flow.reflection&&flow.reflection.completed),score=Number(flow.coding&&flow.coding.bestScore||0);if(r){$('authority').className='notice good';$('authority').textContent='✓ Reflection ส่งแล้ว • Session Complete';$('blocked').hidden=false;$('blockedText').className='notice good';$('blockedText').textContent='Session นี้เสร็จสมบูรณ์แล้ว';return}if(!m){block('ยังไม่พบ Graded Mission ที่ผ่านจาก Server');return}if(!c){block('ยังไม่พบ Coding Lab ที่ผ่านจาก Server');return}$('authority').className='notice good';$('authority').textContent='✓ Mission ผ่าน + Coding ผ่าน'+(score?' '+Math.round(score)+'/100':'')+' • พร้อมทำ Reflection';$('form').hidden=false;update()}catch(e){block('ตรวจสถานะจาก Server ไม่สำเร็จ: '+String(e.message||e))}}function update(){const a=[$('r1').value,$('r2').value,$('r3').value],n=a.map(x=>String(x).replace(/\s/g,'').length);n.forEach((x,i)=>$('c'+(i+1)).textContent=x+'/'+MIN);$('submit').disabled=!(n.every(x=>x>=MIN)&&new Set(a.map(norm).filter(Boolean)).size===3)}['r1','r2','r3'].forEach(id=>$(id).addEventListener('input',update));$('retry').onclick=verify;$('submit').onclick=async()=>{const a=[$('r1').value.trim(),$('r2').value.trim(),$('r3').value.trim()];$('submit').disabled=true;$('status').className='notice wait';$('status').textContent='กำลังส่ง Reflection…';try{const d=await post('AIQFLOW','SUBMIT_REFLECTION',{reflection1:a[0],reflection2:a[1],reflection3:a[2],reflectionPrompt1:prompts[0],reflectionPrompt2:prompts[1],reflectionPrompt3:prompts[2],contentVersion:VERSION},60000);if(!d||d.ok===false)throw Error((d&&d.message)||(d&&d.code)||'SUBMIT_FAILED');$('status').className='notice good';$('status').textContent='✓ ส่ง Reflection สำเร็จ • Session Complete';setTimeout(()=>location.replace(mapUrl),900)}catch(e){$('status').className='notice bad';$('status').textContent='ส่งไม่สำเร็จ: '+String(e.message||e);$('submit').disabled=false}};verify()})();</script></body></html>
