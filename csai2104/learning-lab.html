<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CSAI2401 Learning Lab</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--line:#294866;--text:#eef7ff;--muted:#9fb2c8;--accent:#70a5ff;--ok:#42d392;--warn:#ffd166;--bad:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#07111f,#102a43);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}.shell{max-width:1040px;margin:auto;padding:14px}.top,.toolbar,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand h1{font-size:clamp(24px,5vw,42px);margin:0}.muted{color:var(--muted)}.pill,.panel,.weekCard,.scenario,.step{border:1px solid var(--line);border-radius:16px;background:rgba(13,27,45,.95)}.pill{padding:8px 11px;font-size:13px}.panel{padding:15px;margin-top:12px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.weekCard{padding:10px;min-height:82px;color:var(--text);text-align:left;cursor:pointer}.weekCard.locked{opacity:.5;cursor:not-allowed}.weekCard.completed{border-color:var(--ok);background:#0d2b23}.weekCard.active{border-color:var(--warn);box-shadow:0 0 0 2px #ffd16622}.weekNo{font-size:12px;color:var(--muted);letter-spacing:.08em}.scenarioGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.scenario{padding:13px;cursor:pointer}.scenario.selected{border-color:var(--warn);box-shadow:0 0 0 2px #ffd16622}.scenario h3{margin:2px 0 7px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:12px;margin:3px;color:var(--muted)}button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;background:var(--accent);color:#06101d;cursor:pointer}button.secondary{background:#17283e;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.4;cursor:not-allowed}.step{padding:15px}.option{display:block;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px;cursor:pointer;background:#10243a}.option.selected{border-color:var(--warn);background:#292416}.option input{margin-right:8px}.evidence{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.evidence label{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:13px;cursor:pointer}.feedback{padding:11px;border-radius:11px;margin-top:10px;background:#17233a}.feedback.ok{background:#0d2b23;color:#aaf2d2}.feedback.bad{background:#30171c;color:#ffd1d6}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#07111f;color:var(--text);margin-top:6px}@media(max-width:700px){.map{grid-template-columns:repeat(3,1fr)}.scenarioGrid{grid-template-columns:1fr}}@media(max-width:420px){.map{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main class="shell"><header class="top"><div class="brand"><div class="muted">CSAI2401 · วิศวกรรมซอฟต์แวร์ทางปัญญาประดิษฐ์</div><h1>Learning Lab</h1><div class="muted">Need → Requirement → Design → Test → Release → Change</div></div><div class="toolbar"><span class="pill">ผ่านแล้ว <b id="done">0</b>/15</span><span class="pill">สถานะ <b id="currentStatus">—</b></span></div></header><section class="panel"><div class="toolbar"><div><b>แผนที่การเรียนรู้ 15 สัปดาห์</b><div class="muted" id="gateText">แต่ละสัปดาห์ต้องบันทึกผลสำเร็จหลังตรวจสอบ storage แล้ว</div></div><button class="secondary" id="sync">ตรวจสอบความคืบหน้า</button></div><div class="map" id="map"></div></section><section class="panel" id="missionPanel"><div class="muted">กำลังโหลดภารกิจ…</div></section></main>
<script src="./core.js"></script><script src="./curriculum.js"></script><script src="./legacy-bridge.js"></script>
<script>
(function(){'use strict';const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);let week=Math.max(1,Math.min(15,Number(params.get('week')||1)));let data,scenario,attempt,step=0,total=0,selected=null;function state(){return CSAICore.load()}function stat(n){return CSAICore.status(n,state())}function renderMap(){const s=state(),done=Object.values(s.weeks).filter(x=>x&&x.status==='completed').length;$('done').textContent=done;$('map').innerHTML='';for(let n=1;n<=15;n++){const d=CSAICurriculum.weeks.find(x=>x.week===n),b=document.createElement('button');b.className='weekCard '+(stat(n)==='completed'?'completed ': '')+(n===week?'active ':'')+(stat(n)==='locked'?'locked':'');b.disabled=stat(n)==='locked';b.innerHTML='<span class="weekNo">W'+n+' · '+stat(n).toUpperCase()+'</span><br><b>'+((d&&d.title)||'สัปดาห์ที่ '+n)+'</b><br><small>'+((d&&d.artifact)||'')+'</small>';b.onclick=()=>{week=n;history.replaceState(null,'','?week='+n);render()};$('map').appendChild(b)}$('currentStatus').textContent=stat(week).toUpperCase();$('gateText').textContent=week===10?'Boss Gate: ต้องผ่าน W6–W9 และส่งหลักฐานก่อน':week===15?'Final Gate: ต้องผ่าน W10–W14 พร้อม dossier':'ผลสำเร็จจะแสดงหลัง read-back verification เท่านั้น'}function render(){data=CSAICurriculum.weeks.find(x=>x.week===week);renderMap();if(!data){$('missionPanel').innerHTML='<div class="feedback bad">ไม่พบข้อมูลสัปดาห์นี้</div>';return}if(stat(week)==='locked'){const req=CSAICore.prerequisites(week);$('missionPanel').innerHTML='<h2>สัปดาห์ที่ '+week+' ยังล็อกอยู่</h2><p class="muted">ต้องผ่าน '+req.map(x=>'W'+x).join(', ')+' ก่อน แล้วกลับมาเริ่มด่านนี้</p>';return}renderScenarios()}function renderScenarios(){scenario=null;attempt=null;step=0;total=0;selected=null;$('missionPanel').innerHTML='<div class="weekNo">W'+week+' · '+data.chapter+'</div><h2>'+data.title+'</h2><p>'+data.summary+'</p><p><b>ชิ้นงาน:</b> '+data.artifact+'</p><div class="scenarioGrid" id="scenarios">'+data.scenarios.map((x,i)=>'<article class="scenario" data-i="'+i+'"><h3>'+x.title+'</h3><p>'+x.brief+'</p>'+(x.evidence||[]).slice(0,3).map(e=>'<span class="tag">'+e.id+': '+e.label+'</span>').join('')+'</article>').join('')+'</div><div class="actions" style="margin-top:12px"><button id="start" disabled>เริ่มภารกิจ</button><a class="muted" href="./">กลับ Mission Control</a></div>';document.querySelectorAll('.scenario').forEach(card=>card.onclick=()=>{document.querySelectorAll('.scenario').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');scenario=data.scenarios[Number(card.dataset.i)];$('start').disabled=false});$('start').onclick=startScenario}function startScenario(){const r=CSAICore.begin(week,scenario.id);if(!r.ok){render();return}attempt=r.challengeId;step=0;total=0;renderStep()}function renderStep(){const s=scenario.steps[step];selected=null;$('missionPanel').innerHTML='<div class="weekNo">W'+week+' · STEP '+(step+1)+'/'+scenario.steps.length+'</div><h2>'+scenario.title+'</h2><div class="step"><p><b>'+s.prompt+'</b></p><div id="options">'+s.options.map(o=>'<label class="option"><input type="radio" name="answer" value="'+o.id+'"> '+o.label+'</label>').join('')+'</div><p class="muted">เลือก evidence ที่ใช้สนับสนุนการตัดสินใจ</p><div class="evidence">'+(scenario.evidence||[]).map(e=>'<label><input type="checkbox" value="'+e.id+'"> '+e.id+'</label>').join('')+'</div><label class="muted" style="display:block;margin-top:10px">ข้อจำกัดหรือ residual risk<textarea id="limitation" class="field" rows="2" placeholder="ระบุสิ่งที่ยังไม่พิสูจน์หรือความเสี่ยงที่เหลือ"></textarea></label><div class="actions" style="margin-top:12px"><button id="submitStep">บันทึก step แบบตรวจสอบแล้ว</button><button class="secondary" id="cancel">ยกเลิก attempt</button></div><div id="feedback"></div></div>';$('options').querySelectorAll('.option').forEach(x=>x.onclick=()=>{$('options').querySelectorAll('.option').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});$('submitStep').onclick=submit;$('cancel').onclick=()=>render()}function submit(){const radio=document.querySelector('input[name=answer]:checked'),ev=[...document.querySelectorAll('.evidence input:checked')].map(x=>x.value),lim=$('limitation').value.trim();if(!radio||!ev.length||!lim){$('feedback').className='feedback bad';$('feedback').textContent='ต้องเลือกคำตอบ, evidence และ limitation ก่อนบันทึก';return}const opt=scenario.steps[step].options.find(x=>x.id===radio.value);const r=CSAICore.submitStep(week,attempt,step,opt.id,opt.score,ev.concat(lim?['limitation:'+lim]:[]));if(!r.ok){$('feedback').className='feedback bad';$('feedback').textContent='ยังบันทึกไม่ได้: '+r.reason;return}total+=opt.score;step++;if(step<scenario.steps.length){$('feedback').className='feedback ok';$('feedback').textContent='บันทึก step แล้ว กำลังไปยัง step ถัดไป…';setTimeout(renderStep,350)}else{const f=CSAICore.finish(week,attempt,total,data.artifact);if(!f.ok||!f.passed){$('feedback').className='feedback bad';$('feedback').textContent=f.reason==='pending-save'?'ยังยืนยันการบันทึกไม่ได้ จึงยังไม่ปลดล็อกสัปดาห์ถัดไป':'ยังไม่ผ่านเกณฑ์ evidence/เหตุผล ลอง scenario ใหม่';return}$('missionPanel').innerHTML='<div class="feedback ok"><h2>ผ่าน W'+week+' แล้ว</h2><p>บันทึก '+data.artifact+' และตรวจสอบ storage สำเร็จ</p><p>คะแนน '+total+'/'+(scenario.steps.length*2)+' · สัปดาห์ถัดไปถูกปลดล็อก</p><button id="next">ไปสัปดาห์ถัดไป</button></div>';$('next').onclick=()=>{if(week<15){week++;history.replaceState(null,'','?week='+week);render()}else render()};renderMap()}}$('sync').onclick=()=>{if(window.CSABILegacy&&CSABILegacy.sync)CSABILegacy.sync();render()};if(window.CSABILegacy&&CSABILegacy.sync)CSABILegacy.sync();render()})();
</script></body></html>
