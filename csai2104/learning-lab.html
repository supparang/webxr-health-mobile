<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CSAI2401 Learning Lab</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--line:#294866;--text:#eef7ff;--muted:#9fb2c8;--accent:#70a5ff;--ok:#42d392;--warn:#ffd166;--bad:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#07111f,#102a43);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}.shell{max-width:1040px;margin:auto;padding:14px}.top,.toolbar,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand h1{font-size:clamp(24px,5vw,42px);margin:0}.readingLink{margin-top:7px}.readingLink a{color:#a8ccff;font-weight:700;font-size:13px}.muted{color:var(--muted)}.pill,.panel,.weekCard,.scenario,.step{border:1px solid var(--line);border-radius:16px;background:rgba(13,27,45,.95)}.pill{padding:8px 11px;font-size:13px}.panel{padding:15px;margin-top:12px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.weekCard{padding:10px;min-height:82px;color:var(--text);text-align:left;cursor:pointer}.weekCard.locked{opacity:.5;cursor:not-allowed}.weekCard.completed{border-color:var(--ok);background:#0d2b23}.weekCard.active{border-color:var(--warn);box-shadow:0 0 0 2px #ffd16622}.weekCard.boss{border-color:#9b6bd3;background:#171126}.weekCard.boss.completed{border-color:var(--ok);background:#0d2b23}.gateBadge{display:inline-block;margin-top:6px;color:#e9d5ff;font-size:11px;font-weight:800;letter-spacing:.03em}.checkpointBadge{display:inline-block;margin-top:5px;color:#9fb2c8;font-size:11px;font-weight:700}.gateStatus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.gateStatusCard{display:block;width:100%;min-height:112px;text-align:left;padding:11px;border:1px solid #9b6bd3;border-radius:13px;background:#171126;color:var(--text)}.gateStatusCard:hover{border-color:var(--warn)}.gateStatusCard.passed{border-color:var(--ok);background:#0d2b23}.gateStatusCard.locked{opacity:.65}.gateStatusCard .gateNo{font-size:11px;letter-spacing:.08em;color:#e9d5ff}.gateStatusCard .gateState{display:block;margin-top:5px;font-weight:900}.gateStatusCard small{display:block;margin-top:5px;color:var(--muted);line-height:1.35}@media(max-width:700px){.gateStatus{grid-template-columns:1fr}}.metaGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metaCard{border:1px solid var(--line);border-radius:12px;padding:11px;background:#10243a}.metaCard h3{margin:0 0 6px;font-size:14px}.metaCard ul{margin:5px 0 0;padding-left:18px}.metaCard li{margin:4px 0;color:var(--muted);line-height:1.35}.readingItem{margin:7px 0}.readingItem strong{display:block}.gatePanel{border-color:#9b6bd3;background:#171126}.gatePanel strong{color:#f0dcff}@media(max-width:700px){.map{grid-template-columns:repeat(3,1fr)}.scenarioGrid{grid-template-columns:1fr}.metaGrid{grid-template-columns:1fr}}.weekNo{font-size:12px;color:var(--muted);letter-spacing:.08em}.scenarioGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.scenario{padding:13px;cursor:pointer}.scenario.selected{border-color:var(--warn);box-shadow:0 0 0 2px #ffd16622}.scenario h3{margin:2px 0 7px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:12px;margin:3px;color:var(--muted)}button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;background:var(--accent);color:#06101d;cursor:pointer}button.secondary{background:#17283e;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.4;cursor:not-allowed}.step{padding:15px}.option{display:block;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px;cursor:pointer;background:#10243a}.option.selected{border-color:var(--warn);background:#292416}.option input{margin-right:8px}.evidence{display:grid;gap:8px;margin-top:8px}.evidence label{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;cursor:pointer;background:#10243a}.evidence label input{margin-top:3px;flex:0 0 auto}.evidenceCopy{display:grid;gap:3px;min-width:0}.evidenceCopy strong{font-size:14px;color:var(--text)}.evidenceCopy small{color:var(--muted);line-height:1.4}.evidenceId{font-size:10px;color:var(--muted);opacity:.75}.feedback{padding:11px;border-radius:11px;margin-top:10px;background:#17233a}.feedback.ok{background:#0d2b23;color:#aaf2d2}.feedback.bad{background:#30171c;color:#ffd1d6}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#07111f;color:var(--text);margin-top:6px}@media(max-width:700px){.map{grid-template-columns:repeat(3,1fr)}.scenarioGrid{grid-template-columns:1fr}}@media(max-width:420px){.map{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main class="shell"><header class="top"><div class="brand"><div class="muted">CSAI2401 · วิศวกรรมซอฟต์แวร์ทางปัญญาประดิษฐ์</div><h1>Learning Lab</h1><div class="muted">Need → Requirement → Design → Test → Release → Change</div><nav class="readingLink"><a href="reading-shelf.html">📚 หนังสืออ้างอิง</a></nav></div><div class="toolbar"><span class="pill">ผ่านแล้ว <b id="done">0</b>/15</span><span class="pill">สถานะ <b id="currentStatus">—</b></span></div></header><section class="panel"><div class="toolbar"><div><b>แผนที่การเรียนรู้ 15 สัปดาห์</b><div class="muted" id="gateText">แต่ละสัปดาห์ต้องบันทึกผลสำเร็จหลังตรวจสอบ storage แล้ว</div></div><button class="secondary" id="sync">ตรวจสอบความคืบหน้า</button></div><div id="gateStatus" class="gateStatus" aria-label="สถานะ Boss Gates"></div><div class="map" id="map"></div></section><section class="panel" id="missionPanel"><div class="muted">กำลังโหลดภารกิจ…</div></section></main>
<script src="./core.js"></script><script src="./curriculum.js"></script><script src="./legacy-bridge.js"></script>
<script>
(function(){'use strict';const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const GATE_LABELS={5:'Requirements Set Gate · ข้อกำหนดพร้อมสำหรับการยืนยัน',10:'ด่านหลักฐานการทดสอบและแก้จุดบกพร่อง · Evidence-based Debugging Gate',15:'ด่านพร้อมปล่อยและรับผิดชอบ · Release Readiness Gate'};const CHECKPOINTS={4:'Feasibility Confirmed · ยืนยันความเป็นไปได้',6:'Requirements Traceability · ติดตามข้อกำหนด',8:'Architecture Decision Recorded · บันทึกการตัดสินใจสถาปัตยกรรม',9:'Verification Evidence · หลักฐานการทวนสอบ',12:'Change and Release Ready · พร้อมเปลี่ยนแปลงและปล่อยใช้',14:'Responsible AI Assurance · หลักประกัน Responsible AI'};const BOOK_TITLES={'vliet-principles':'Software Engineering Principles · Hans van Vliet','pressman-7e':'Software Engineering: A Practitioner’s Approach · Roger S. Pressman','dcap405':'DCAP405 Software Engineering','mall-4e':'Fundamentals of Software Engineering · Rajib Mall','essentials-modern':'The Essentials of Modern Software Engineering','pg-msc-material':'PG M.Sc. Software Engineering','se2-8-2018':'Software Engineering SE 2/8 2018','sommerville-10e':'Software Engineering · Ian Sommerville 10th Global','sommerville-9e':'Software Engineering · Ian Sommerville 9th','mrcetit-software-engineering':'Software Engineering · MRCETIT','swe-at-google':'Software Engineering at Google','new-software-engineering':'The New Software Engineering','unit1':'Software Engineering · Unit 1','modi-software-engineering':'Software Engineering · Dr. Nilesh Modi','bscit-303':'BSCIT 303 Software Engineering'};let week=Math.max(1,Math.min(15,Number(params.get('week')||1)));let data,scenario,attempt,step=0,total=0,selected=null;function state(){return CSAICore.load()}function stat(n){return CSAICore.status(n,state())}function renderMap(){const st=state(),done=Object.values(st.weeks).filter(x=>x&&x.status==='completed').length;
$('done').textContent=done;$('map').innerHTML='';for(let n=1;n<=15;n++){const d=CSAICurriculum.weeks.find(x=>x.week===n),gate=GATE_LABELS[n],checkpoint=CHECKPOINTS[n],b=document.createElement('button');b.className='weekCard '+(stat(n)==='completed'?'completed ':'')+(n===week?'active ':'')+(stat(n)==='locked'?'locked ':'')+(gate?'boss':'');b.disabled=stat(n)==='locked';b.setAttribute('aria-label','W'+n+' '+((d&&d.title)||''));b.innerHTML='<span class="weekNo">W'+n+' · '+stat(n).toUpperCase()+'</span><br><b>'+((d&&d.title)||'สัปดาห์ที่ '+n)+'</b><br><small>'+((d&&d.artifact)||'')+'</small>'+(gate?'<br><span class="gateBadge">'+(n===15?'FINAL GATE':'BOSS GATE')+' · '+gate+'</span>':'')+(checkpoint?'<br><span class="checkpointBadge">CHECKPOINT · '+checkpoint+'</span>':'');b.onclick=()=>{week=n;history.replaceState(null,'','?week='+n);render();setTimeout(()=>document.getElementById('missionPanel')?.scrollIntoView({behavior:'smooth',block:'start'}),0)};$('map').appendChild(b)}const gateCards=[{n:1,week:5,label:'Requirements Set Gate',requires:'ผ่าน W1–W4',artifact:'Requirements Set'},{n:2,week:10,label:'Evidence-based Debugging Gate',requires:'ผ่าน W6–W9',artifact:'Evidence-based Debugging Pack'},{n:3,week:15,label:'Release Readiness Gate',requires:'ผ่าน W10–W14',artifact:'Final AI Software Engineering Dossier'}];$('gateStatus').innerHTML=gateCards.map(g=>{const gs=stat(g.week),passed=gs==='completed';return '<button class="gateStatusCard '+(passed?'passed ':'')+(gs==='locked'?'locked':'')+'" data-gate-week="'+g.week+'" '+(gs==='locked'?'disabled':'')+' aria-label="Boss Gate '+g.n+' '+(passed?'ผ่านแล้ว':gs==='locked'?'ล็อกอยู่':'พร้อมทำ')+'"><span class="gateNo">BOSS GATE '+g.n+'</span><span class="gateState">'+(passed?'ผ่านแล้ว · PASSED':gs==='locked'?'ล็อกอยู่ · LOCKED':'พร้อมทำ · AVAILABLE')+'</span><small>'+g.label+'<br>'+g.requires+' · '+g.artifact+'</small></button>'}).join('');$('gateStatus').querySelectorAll('[data-gate-week]').forEach(btn=>btn.onclick=()=>{week=Number(btn.dataset.gateWeek);history.replaceState(null,'','?week='+week);render();document.getElementById('missionPanel')?.scrollIntoView({behavior:'smooth',block:'start'})});const current=CSAICurriculum.weeks.find(x=>x.week===week);$('currentStatus').textContent=stat(week).toUpperCase();$('gateText').textContent=current&&current.gate?current.gate.label+': '+current.gate.feedback:CHECKPOINTS[week]?'Checkpoint: '+CHECKPOINTS[week]:'แต่ละสัปดาห์ต้องบันทึกผลสำเร็จหลังตรวจสอบ storage แล้ว'}function render(){data=CSAICurriculum.weeks.find(x=>x.week===week);renderMap();if(!data){$('missionPanel').innerHTML='<div class="feedback bad">ไม่พบข้อมูลสัปดาห์นี้</div>';return}if(stat(week)==='locked'){const req=CSAICore.prerequisites(week),gate=GATE_LABELS[week];$('missionPanel').innerHTML='<h2>สัปดาห์ที่ '+week+' ยังล็อกอยู่</h2>'+(gate?'<p><b>'+(week===15?'FINAL GATE':'BOSS GATE')+' · '+gate+'</b></p>':'')+'<p class="muted">ต้องผ่าน '+req.map(x=>'W'+x).join(', ')+' ก่อน แล้วกลับมาเริ่มด่านนี้</p>'+(data.gate?'<div class="metaCard gatePanel"><p><b>เกณฑ์เมื่อถึงด่าน:</b> '+data.gate.feedback+'</p><p><b>หลักฐาน:</b> '+data.gate.requiredEvidenceTags.join(' · ')+' · คะแนนอย่างน้อย '+data.gate.minScore+'/6 และทุก step อย่างน้อย '+data.gate.minStepScore+'</p></div>':'');return}renderScenarios()}function renderScenarios(){scenario=null;attempt=null;step=0;total=0;selected=null;const outcomes=(data.learningOutcomes||[]).map(x=>'<li>'+x+'</li>').join('');const readings=(data.readings||[]).map(r=>'<li class="readingItem"><strong>'+((BOOK_TITLES[r.bookId]||r.bookId))+'</strong><span class="muted">'+r.topic+' · '+r.why+'</span></li>').join('');const chain=data.evidenceChain?'<p class="muted"><b>Evidence chain:</b> '+data.evidenceChain.from+' → '+data.evidenceChain.to+' · '+data.evidenceChain.stage+'</p>':'';const gate=data.gate?'<div class="metaCard gatePanel"><h3>🚪 '+data.gate.label+'</h3><p>'+data.gate.feedback+'</p><p><b>ต้องผ่าน:</b> '+data.gate.requires+' · <b>ชิ้นงาน:</b> '+data.gate.artifact+'</p><p><b>หลักฐาน gate:</b> '+data.gate.requiredEvidenceTags.join(' · ')+' · คะแนนรวมอย่างน้อย '+data.gate.minScore+'/6 และทุก step อย่างน้อย '+data.gate.minStepScore+'</p></div>':'';$('missionPanel').innerHTML='<div class="weekNo">W'+week+' · '+data.chapter+'</div><h2>'+data.title+'</h2><p>'+data.summary+'</p><p><b>ชิ้นงาน:</b> '+data.artifact+'</p><div class="metaGrid"><div class="metaCard"><h3>ผลลัพธ์การเรียนรู้</h3><p>'+data.courseOutcome+'</p><ul>'+outcomes+'</ul></div><div class="metaCard"><h3>อ่านประกอบ</h3><ul>'+readings+'</ul></div></div>'+chain+gate+'<div class="scenarioGrid" id="scenarios">'+data.scenarios.map((x,i)=>'<article class="scenario" data-i="'+i+'"><h3>'+x.title+'</h3><p>'+x.brief+'</p>'+(x.evidence||[]).slice(0,3).map(e=>'<span class="tag"><b>'+e.label+'</b><small>'+e.text+'</small><em>รหัส: '+e.id+'</em></span>').join('')+'</article>').join('')+'</div><div class="actions" style="margin-top:12px"><button id="start" disabled>เริ่มภารกิจ</button><a class="muted" href="./">กลับ Mission Control</a></div>';const cards=[...document.querySelectorAll('.scenario')];cards.forEach(card=>card.onclick=()=>{cards.forEach(c=>c.classList.remove('selected'));card.classList.add('selected');scenario=data.scenarios[Number(card.dataset.i)];$('start').disabled=false});if(cards[0])cards[0].click();$('start').onclick=startScenario}function startScenario(){const r=CSAICore.begin(week,scenario.id);if(!r.ok){render();return}attempt=r.challengeId;const saved=r.state&&r.state.attempts&&r.state.attempts['w'+week];step=Math.min(Number(saved&&saved.stepIndex||0),scenario.steps.length-1);total=Number(saved&&saved.score||0);renderStep()}function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function displayRefs(text){return String(text||'').replace(/\[([^\]]+)\]/g,(_,id)=>{const e=(scenario&&scenario.evidence||[]).find(x=>x.id===id);return e?'“'+e.label+'”':'[หลักฐานที่ยังระบุไม่ได้]'})}function renderStep(){const st=scenario.steps[step];selected=null;const prompt=esc(displayRefs(st.prompt));$('missionPanel').innerHTML='<div class="weekNo">W'+week+' · STEP '+(step+1)+'/'+scenario.steps.length+'</div><h2>'+esc(scenario.title)+'</h2><div class="step"><p><b>'+prompt+'</b></p><div id="options">'+st.options.map(o=>'<label class="option"><input type="radio" name="answer" value="'+esc(o.id)+'"> '+esc(o.label)+'</label>').join('')+'</div><p class="muted">หลักฐานอ้างอิง (เลือกจากชื่อและคำอธิบาย ไม่ต้องจำรหัส)</p><div class="evidence">'+(scenario.evidence||[]).map(e=>'<label title="'+esc(e.text)+'"><input type="checkbox" value="'+esc(e.id)+'" aria-label="'+esc(e.label)+': '+esc(e.text)+'"> <span class="evidenceCopy"><strong>'+esc(e.label)+'</strong><small>'+esc(e.text)+'</small><code class="evidenceId">รหัส: '+esc(e.id)+'</code></span></label>').join('')+'</div><label class="muted" style="display:block;margin-top:10px">ข้อจำกัดหรือ residual risk<textarea id="limitation" class="field" rows="2" placeholder="ระบุสิ่งที่ยังไม่พิสูจน์หรือความเสี่ยงที่เหลือ"></textarea></label><div class="actions" style="margin-top:12px"><button id="submitStep">บันทึก step แบบตรวจสอบแล้ว</button><button class="secondary" id="cancel">ยกเลิก attempt</button></div><div id="feedback"></div></div>';$('options').querySelectorAll('.option').forEach(x=>x.onclick=()=>{$('options').querySelectorAll('.option').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});$('submitStep').onclick=submit;$('cancel').onclick=()=>{CSAICore.cancel(week,attempt);render()}}function submit(){const radio=document.querySelector('input[name=answer]:checked'),ev=[...document.querySelectorAll('.evidence input:checked')].map(x=>x.value),lim=$('limitation').value.trim();if(!radio||!ev.length||!lim){$('feedback').className='feedback bad';$('feedback').textContent='ต้องเลือกคำตอบ, evidence และ limitation ก่อนบันทึก';return}const opt=scenario.steps[step].options.find(x=>x.id===radio.value);const r=CSAICore.submitStep(week,attempt,step,opt.id,opt.score,ev.concat(lim?['limitation:'+lim]:[]));if(!r.ok){$('feedback').className='feedback bad';$('feedback').textContent='ยังบันทึกไม่ได้: '+r.reason;return}total+=opt.score;step++;if(step<scenario.steps.length){$('feedback').className='feedback ok';$('feedback').innerHTML='<b>บันทึก step แล้ว</b><br>'+esc(displayRefs(opt.why))+'<br>กำลังไปยัง step ถัดไป…';setTimeout(renderStep,550)}else{const f=CSAICore.finish(week,attempt,total,data.artifact);if(!f.ok||!f.passed){$('feedback').className='feedback bad';const a=f.assessment||{};const gateMsg=a.isGate?'ด่านนี้ต้องได้อย่างน้อย '+a.requiredScore+'/6 และทุก step ต้องได้อย่างน้อย 1 คะแนน':'ต้องได้คะแนนรวมอย่างน้อย '+(a.requiredScore||4)+'/6';const failed=a.failedSteps&&a.failedSteps.length?' ลองทบทวน step '+a.failedSteps.join(', ')+' แล้วเริ่ม attempt ใหม่':' ลอง scenario ใหม่';$('feedback').textContent=f.reason==='pending-save'?'ยังยืนยันการบันทึกไม่ได้ จึงยังไม่ปลดล็อกสัปดาห์ถัดไป':f.reason==='assessment-incomplete'?'attempt เก่านี้ไม่มีคะแนนต่อ step จึงต้องเริ่มใหม่':gateMsg+'.'+failed;return}$('missionPanel').innerHTML='<div class="feedback ok"><h2>ผ่าน W'+week+' แล้ว</h2><p>บันทึก '+esc(data.artifact)+' และตรวจสอบ storage สำเร็จ</p><p>คะแนน '+f.score+'/'+(scenario.steps.length*2)+' · สัปดาห์ถัดไปถูกปลดล็อก</p><button id="next">ไปสัปดาห์ถัดไป</button></div>';$('next').onclick=()=>{if(week<15){week++;history.replaceState(null,'','?week='+week);render()}else render()};renderMap()}}$('sync').onclick=()=>{if(window.CSABILegacy&&CSABILegacy.sync)CSABILegacy.sync();render()};if(window.CSABILegacy&&CSABILegacy.sync)CSABILegacy.sync();render()})();
</script></body></html>
