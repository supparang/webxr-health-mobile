<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CSAI2401 · Reading Shelf</title><style>
:root{--bg:#07111f;--panel:#0d1b2d;--line:#294866;--text:#eef7ff;--muted:#9fb2c8;--accent:#70a5ff;--ok:#42d392}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#07111f,#102a43);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}.shell{max-width:1080px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.kicker{color:var(--muted);letter-spacing:.08em;font-size:12px}.muted{color:var(--muted)}h1{font-size:clamp(28px,6vw,46px);margin:4px 0}.panel,.book{border:1px solid var(--line);border-radius:16px;background:rgba(13,27,45,.95)}.panel{padding:16px;margin-top:14px}.notice{border-left:4px solid var(--accent);padding:10px 12px;background:#10243a}.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.book{padding:15px}.book h2{margin:0 0 6px;font-size:20px}.book p{line-height:1.5}.meta{color:var(--muted);font-size:13px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:#cfe2f5;font-size:12px}.weeks{color:#aaf2d2;font-size:13px}.back{display:inline-block;margin-top:14px;color:#a8ccff}@media(max-width:700px){.books{grid-template-columns:1fr}.shell{padding:11px}}
</style></head><body><main class="shell"><header class="top"><div><div class="kicker">CSAI2401 · READING SHELF</div><h1>หนังสืออ้างอิง</h1><p class="muted">เลือกอ่านตามสัปดาห์และชิ้นงาน ไม่ต้องอ่านทุกเล่มพร้อมกัน</p></div><a class="back" href="learning-lab.html?week=1">กลับ Learning Lab</a></header><section class="panel"><div class="notice"><b>วิธีใช้</b><br>หนังสือในหน้านี้เป็นแหล่งอ่านประกอบ ผู้เรียนให้เริ่มจากสัปดาห์ที่กำลังเรียน แล้วดูหัวข้อและชิ้นงานของสัปดาห์นั้นเป็นหลัก</div><p class="meta" id="count">กำลังโหลดรายการ…</p><div class="books" id="books"></div></section></main><script>
fetch('references.json').then(r=>r.json()).then(data=>{const root=document.getElementById('books');document.getElementById('count').textContent='มีหนังสืออ้างอิง '+data.books.length+' รายการ · metadata จากไฟล์ที่ผู้สอนจัดเตรียม';root.innerHTML=data.books.map(b=>'<article class="book"><h2>'+b.title+'</h2><div class="meta">'+b.author+' · '+b.edition+(b.pages?' · '+b.pages+' หน้า':'')+'</div><p>'+b.note+'</p><div class="chips">'+b.topics.map(t=>'<span class="chip">'+t+'</span>').join('')+'</div><div class="weeks">แนะนำสำหรับ W'+b.weeks.join(', W')+'</div><p class="meta">ไฟล์ต้นฉบับ: '+b.sourceFile+'</p></article>').join('')}).catch(()=>{document.getElementById('count').textContent='ยังโหลดรายการอ้างอิงไม่ได้';});
</script></body></html>
