<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CSAI2104 — AI System Crisis</title><style>:root{--line:#24405f;--text:#eef7ff;--muted:#9fb2c8;--ok:#42d392;--bad:#ff6b6b;--accent:#70a5ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07111f;color:var(--text)}.shell{max-width:1180px;margin:auto;padding:22px}.top,.status{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand h1{margin:0;font-size:clamp(28px,4vw,46px)}.brand p,.card p{color:var(--muted)}.pill,.tag{background:#12243a;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:13px}.hero,.card{background:#0b1728;border:1px solid var(--line);border-radius:20px}.hero{padding:20px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:16px}.card.boss{border-color:#743b83;background:#171126}.card.locked{opacity:.45}.week{font-size:12px;letter-spacing:1.2px;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:var(--accent);color:#06101d;cursor:pointer}button:disabled{opacity:.4}.secondary{background:#17283e;color:white;border:1px solid var(--line)}dialog{width:min(820px,94vw);border:1px solid var(--line);border-radius:20px;background:#081523;color:white;padding:0}dialog::backdrop{background:#000b}.modal{padding:20px}.progress{height:9px;background:#17283e;border-radius:99px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:linear-gradient(90deg,#70a5ff,#42d392)}.incident{padding:14px;border-radius:13px;background:#151f31;border:1px solid var(--line);line-height:1.6;white-space:pre-line}.question{font-weight:800;margin:14px 0 8px}.choices{display:grid;gap:10px;margin:8px 0 14px}.choices button{display:block;width:100%;text-align:left;background:#12243a;color:white;border:1px solid var(--line);font-weight:650}.choices button:hover{border-color:#70a5ff;background:#18304c}.feedback{display:none;padding:11px;border-radius:11px;margin:10px 0}.feedback.good{display:block;background:#0d2b23;color:#aaf2d2}.feedback.bad{display:block;background:#30171c;color:#ffd2d8}.missionStats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}@media(max-width:820px){.grid{grid-template-columns:1fr}.shell{padding:13px}}</style></head><body><main class="shell"><header class="top"><div class="brand"><h1>AI SYSTEM CRISIS</h1><p>CSAI2104 • Engineering Mission Control</p></div><div class="status"><span class="pill">Rank: <b id="rank"></b></span><span class="pill">Evidence: <b id="ep"></b></span><span class="pill">Integrity: <b id="integrity"></b></span><span class="pill">Boss: <b id="bossCount"></b></span></div></header><section class="hero"><div class="week">CAMPAIGN BRIEFING</div><h2>Build it. Break it. Prove it. Save it.</h2><p>หนึ่ง Week = หนึ่ง Mission เต็ม: SCAN → HYPOTHESIZE → ACT → PROVE</p><button id="startBtn">เริ่ม Mission แรก</button></section><section class="grid" id="missionGrid"></section></main><dialog id="dlg"><div class="modal"><div class="week" id="mw"></div><h2 id="mt"></h2><div class="missionStats"><span class="tag" id="phaseTag"></span><span class="tag" id="runScore"></span></div><div class="progress"><div id="bar"></div></div><div class="incident" id="scene"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="fb"></div><div class="top"><button class="secondary" id="closeBtn">กลับ Mission Control</button><button id="nextBtn" style="display:none"></button></div></div></dialog><script>
const full={W1:{title:'SYSTEM DOWN!',boss:false,phases:[{label:'SCAN • Incident Alert',scene:'AI Vision accuracy 96% แต่ 17 คน Login ไม่ได้ กล้องบางเครื่องเปิดไม่ได้ และ Progress บางคนหาย',q:'ข้อสรุปใดดีที่สุด?',options:['Model สำเร็จ = ระบบพร้อม','Model success ยังไม่พิสูจน์ System success','เพิ่ม accuracy ก่อน'],ok:1,why:'ต้องประเมินระบบ End-to-End'},{label:'SCAN • Failure Hunt',scene:'ระบบทำงานต่างกันในอุปกรณ์ของผู้ใช้',q:'เลือก System/Integration concern ที่ชัดที่สุด',options:['Accuracy 96%','Camera permission ต่างตาม device/browser','ชื่อโมเดล'],ok:1,why:'Operational environment เป็นส่วนของระบบ'},{label:'HYPOTHESIZE',scene:'UI แสดง Complete แต่ Progress หายหลัง Login ใหม่',q:'สมมติฐานใดควรตรวจสอบก่อน?',options:['สีปุ่มผิด','State อยู่ local/cache แต่ไม่ persist backend','AI accuracy ต่ำ'],ok:1,why:'สมมติฐานเชื่อม symptom กับ persistence'},{label:'ACT • Evidence',scene:'คุณมี Investigation Energy เหลือ 1 หน่วย',q:'จะเปิดหลักฐานใด?',options:['CSS stylesheet','Backend save response + progress record','Logo'],ok:1,why:'หลักฐานแยก UI success กับ persisted success'},{label:'PROVE',scene:'ตรวจพบ UI success แต่ backend ไม่มี record',q:'การกระทำใดเหมาะสม?',options:['Release','แก้ persistence + End-to-End regression','เพิ่ม animation'],ok:1,why:'ต้องพิสูจน์ continuity หลังแก้'}]},W2:{title:'SOURCE OF TRUTH',boss:false,phases:[{label:'SCAN • Conflict',scene:'Game=COMPLETE • local=COMPLETE • Backend=INCOMPLETE • Passport=LOCKED',q:'ปัญหาหลักคืออะไร?',options:['UI color','State sources ขัดกัน','AI overfit'],ok:1,why:'นี่คือ state/authority conflict'},{label:'MAP • Data Flow',scene:'ต้องกำหนดเส้นทางสถานะทางการ',q:'Flow ใดเหมาะสมที่สุด?',options:['Game → UI → official','Game → save → backend confirm → Passport','local → Passport'],ok:1,why:'Authority ต้อง confirm'},{label:'HYPOTHESIZE',scene:'local COMPLETE แต่ backend INCOMPLETE',q:'สมมติฐานใดแข็งแรงที่สุด?',options:['Save/acknowledgement ล้มเหลว','Font ช้า','AI ต่ำ'],ok:0,why:'ควรตรวจ transport/save acknowledgement'},{label:'ACT • Offline',scene:'Backend ถูกกำหนดเป็น Source of Truth',q:'เมื่อ offline ควรทำอย่างไร?',options:['local=official ทันที','เก็บ pending แล้ว sync/confirm','ลบ progress'],ok:1,why:'Pending ไม่เท่ากับ official'},{label:'PROVE • Continuity',scene:'ต้องพิสูจน์ว่าความก้าวหน้าคงอยู่จริง',q:'Test ใดดีที่สุด?',options:['ดูสีเขียว','Complete → server confirm → logout → login → ยัง unlock','Refresh CSS'],ok:1,why:'นี่คือ End-to-End continuity'}]},B1:{title:'THE FALSE SUCCESS',boss:true,phases:[{label:'BOSS 100%',scene:'☠ Mission Complete แต่ Mission ถัดไป LOCK',q:'เปิดการโจมตีด้วยอะไร?',options:['เปลี่ยนสี','ตรวจ authoritative progress/save confirmation','Reload'],ok:1,why:'EVIDENCE STRIKE'},{label:'BOSS 80%',scene:'Boss ปล่อย Decoy: localStorage = COMPLETE',q:'ตอบโต้อย่างไร?',options:['เชื่อ local','เทียบ authoritative backend','ล้าง cache'],ok:1,why:'AUTHORITY SHIELD BROKEN'},{label:'BOSS 60%',scene:'POST /complete → timeout แต่ UI = COMPLETE',q:'Root cause class ใดน่าเชื่อที่สุด?',options:['Persistence/integration acknowledgement failure','Typography','Model accuracy'],ok:0,why:'ROOT CAUSE EXPOSED'},{label:'BOSS 40%',scene:'ต้องหยุด False Success ไม่ให้เกิดซ้ำ',q:'เลือก Fix',options:['รอ confirmed save; timeout=pending/retry','ขยายคำว่า COMPLETE','บันทึก local only'],ok:0,why:'FALSE SUCCESS CORE HIT'},{label:'BOSS 20%',scene:'ระบบถูกแก้แล้ว ต้องพิสูจน์ว่า bug ไม่ย้อนกลับ',q:'Regression test ใดเหมาะสม?',options:['ดู UI','Complete → timeout → no false unlock → retry → backend confirm → relogin → unlock','ตรวจ accuracy'],ok:1,why:'REGRESSION ARMOR BROKEN'},{label:'FINAL STRIKE',scene:'Boss เหลือพลังสุดท้าย',q:'Evidence ใดพอปิด Incident?',options:['Screenshot COMPLETE','Requirement + save evidence + authoritative record + relogin test','Developer บอกว่าหายแล้ว'],ok:1,why:'💥 BOSS DEFEATED'}]}};
const catalog=[['W1','SYSTEM DOWN!','Failure Hunt • System Thinking'],['W2','SOURCE OF TRUTH','System Map • State'],['B1','THE FALSE SUCCESS','Boss • Incident'],['W3','PROCESS RUSH','Strategy • Process'],['W4','STAKEHOLDER CHAOS','Detective • Stakeholder'],['W5','THE HIDDEN REQUIREMENT','Escape Room • Requirements'],['B2','SCOPE MONSTER','Boss • Scope'],['W6','ARCHITECTURE ARENA','Builder • Architecture'],['W7','AI HAS NO IDEA','Arcade • Fallback'],['W8','PROTOTYPE X','Experiment • Prototype'],['B3','CASCADE FAILURE','Boss • Cascade'],['W9','TEST LAB','Lab • Testing'],['W10','BUG HUNTER','Detective • Debugging'],['W11','ZERO-DAY RELEASE','Timed • QA'],['W12','UPDATE DISASTER','Release • Evolution'],['B4','PRODUCTION ON FIRE','Boss • War Room'],['W13','PROJECT SURVIVAL','Simulation • Project'],['W14','AI ON TRIAL','Tribunal • Responsible AI'],['W15','GO / NO-GO','Audit • Readiness'],['FINAL','SYSTEM ZERO','Final Boss • Dossier']];
const $=id=>document.getElementById(id);let state=JSON.parse(localStorage.getItem('csai2104_crisis_state_v2')||'{"done":[],"ep":0,"boss":0,"integrity":82}'),run=null;function save(){localStorage.setItem('csai2104_crisis_state_v2',JSON.stringify(state));render()}function unlocked(i){return i===0||state.done.includes(catalog[i-1][0])}function render(){$('rank').textContent=state.ep>=400?'Release Engineer':state.ep>=220?'System Investigator':'Junior Engineer';$('ep').textContent=state.ep+' EP';$('integrity').textContent=state.integrity+'%';$('bossCount').textContent=state.boss+'/5';$('missionGrid').innerHTML='';catalog.forEach((m,i)=>{const u=unlocked(i),done=state.done.includes(m[0]),impl=!!full[m[0]],c=document.createElement('article');c.className='card '+((m[0][0]==='B'||m[0]==='FINAL')?'boss ':'')+(!u?'locked':'');c.innerHTML=`<div class="week">${m[0]}${done?' • CLEARED':''}</div><h3>${m[1]}</h3><p>${impl?full[m[0]].phases.length+'-Phase Interactive Mission':'Mission mechanic queued'}</p><div class="tags">${m[2].split(' • ').map(x=>`<span class="tag">${x}</span>`).join('')}</div><button ${!u||!impl?'disabled':''}>${done?'เล่นซ้ำ':impl?'เข้าสู่ภารกิจ':'กำลังพัฒนา'}</button>`;c.querySelector('button').addEventListener('click',()=>start(m[0]));$('missionGrid').appendChild(c)})}function start(id){run={id,phase:0,correct:0,answered:false};$('dlg').showModal();show()}function show(){const m=full[run.id],p=m.phases[run.phase];$('mw').textContent=run.id+(m.boss?' • BOSS GATE':' • MISSION');$('mt').textContent=m.title;$('phaseTag').textContent=`Phase ${run.phase+1}/${m.phases.length} • ${p.label}`;$('runScore').textContent=`Evidence Hits ${run.correct}/${run.phase}`;$('bar').style.width=(run.phase/m.phases.length*100)+'%';$('scene').textContent=p.scene;$('question').textContent=p.q;$('fb').className='feedback';$('choices').innerHTML='';$('nextBtn').style.display='none';p.options.forEach((text,i)=>{const b=document.createElement('button');b.type='button';b.textContent=text;b.addEventListener('click',()=>answer(i));$('choices').appendChild(b)})}function answer(i){if(run.answered)return;run.answered=true;const p=full[run.id].phases[run.phase];[...$('choices').children].forEach(b=>b.disabled=true);if(i===p.ok){run.correct++;state.ep+=10;state.integrity=Math.min(100,state.integrity+1);$('fb').className='feedback good';$('fb').textContent='✓ '+p.why+' • +10 EP'}else{state.integrity=Math.max(0,state.integrity-2);$('fb').className='feedback bad';$('fb').textContent='✕ ยังไม่มีหลักฐานเพียงพอ — '+p.why}save();$('nextBtn').style.display='block';$('nextBtn').textContent=run.phase===full[run.id].phases.length-1?'สรุป Mission':'Phase ถัดไป →'}$('nextBtn').addEventListener('click',()=>{const m=full[run.id];if(run.phase<m.phases.length-1){run.phase++;run.answered=false;show();return}const pass=Math.ceil(m.phases.length*.7),passed=run.correct>=pass;$('scene').textContent=passed?`MISSION CLEARED\nEvidence ${run.correct}/${m.phases.length}`:`MISSION NOT CLEARED\nEvidence ${run.correct}/${m.phases.length} • ต้องได้อย่างน้อย ${pass}`;$('question').textContent='';$('choices').innerHTML='';$('nextBtn').style.display='none';if(passed&&!state.done.includes(run.id)){state.done.push(run.id);state.ep+=m.boss?60:35;if(m.boss)state.boss++;save()}$('fb').className='feedback '+(passed?'good':'bad');$('fb').textContent=passed?(m.boss?'☠ BOSS DEFEATED — Gate unlocked':'✓ Engineering Evidence Pack complete'):'ยังไม่ปลดล็อก Mission ถัดไป — สามารถเล่นซ้ำได้'});$('closeBtn').addEventListener('click',()=>$('dlg').close());$('startBtn').addEventListener('click',()=>start('W1'));render();</script></body></html>
