<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CSAI2104 — AI System Crisis</title><style>:root{--bg:#07111f;--panel:#0e1a2b;--line:#24405f;--text:#eef7ff;--muted:#9fb2c8;--ok:#42d392;--bad:#ff6b6b;--accent:#70a5ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07111f;color:var(--text)}.shell{max-width:1180px;margin:auto;padding:22px}.top,.status{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand h1{margin:0;font-size:clamp(28px,4vw,46px)}.muted,.brand p,.card p{color:var(--muted)}.pill,.tag{background:#12243a;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:13px}.hero,.card{background:#0b1728;border:1px solid var(--line);border-radius:20px}.hero{padding:20px;margin:20px 0}.hero h2{margin:4px 0;font-size:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:16px}.card.boss{border-color:#743b83;background:#171126}.card.locked{opacity:.45}.week{font-size:12px;letter-spacing:1.2px;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:var(--accent);color:#06101d;cursor:pointer}button:disabled{opacity:.4}.secondary{background:#17283e;color:white;border:1px solid var(--line)}dialog{width:min(820px,94vw);border:1px solid var(--line);border-radius:20px;background:#081523;color:white;padding:0}dialog::backdrop{background:#000b}.modal{padding:20px}.progress{height:9px;background:#17283e;border-radius:99px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:linear-gradient(90deg,#70a5ff,#42d392)}.incident{padding:14px;border-radius:13px;background:#151f31;border:1px solid var(--line);line-height:1.6;white-space:pre-line}.choices{display:grid;gap:9px;margin:14px 0}.choices button{text-align:left;background:#12243a;color:white;border:1px solid var(--line)}.feedback{display:none;padding:11px;border-radius:11px;margin:10px 0}.feedback.good{display:block;background:#0d2b23;color:#aaf2d2}.feedback.bad{display:block;background:#30171c;color:#ffd2d8}.missionStats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}@media(max-width:820px){.grid{grid-template-columns:1fr}.shell{padding:13px}}</style></head><body><main class="shell"><header class="top"><div class="brand"><h1>AI SYSTEM CRISIS</h1><p>CSAI2104 • Engineering Mission Control</p></div><div class="status"><span class="pill">Rank: <b id="rank"></b></span><span class="pill">Evidence: <b id="ep"></b></span><span class="pill">Integrity: <b id="integrity"></b></span><span class="pill">Boss: <b id="bossCount"></b></span></div></header><section class="hero"><div class="week">CAMPAIGN BRIEFING</div><h2>Build it. Break it. Prove it. Save it.</h2><p>หนึ่ง Week = หนึ่ง Mission เต็ม: SCAN → HYPOTHESIZE → ACT → PROVE ไม่ใช่ตอบคำถามเดียวแล้วผ่าน</p><button id="startBtn">เริ่ม Mission แรก</button></section><section class="grid" id="missionGrid"></section></main><dialog id="dlg"><div class="modal"><div class="week" id="mw"></div><h2 id="mt"></h2><div class="missionStats"><span class="tag" id="phaseTag"></span><span class="tag" id="runScore"></span></div><div class="progress"><div id="bar"></div></div><div class="incident" id="scene"></div><div class="choices" id="choices"></div><div class="feedback" id="fb"></div><div class="top"><button class="secondary" id="close">กลับ Mission Control</button><button id="next" style="display:none"></button></div></div></dialog><script>
const full={W1:{title:'SYSTEM DOWN!',boss:false,phases:[['SCAN • Incident Alert','AI Vision accuracy 96% แต่ 17 คน Login ไม่ได้ กล้องบางเครื่องเปิดไม่ได้ และ Progress บางคนหาย','ข้อสรุปใดดีที่สุด?',['Model สำเร็จ = ระบบพร้อม','Model success ยังไม่พิสูจน์ System success','เพิ่ม accuracy ก่อน'],1,'ต้องประเมินระบบ End-to-End'],['SCAN • Failure Hunt','เลือก System/Integration concern ที่ชัดที่สุด',['Accuracy 96%','Camera permission ต่างตาม device/browser','ชื่อโมเดล'],1,'Operational environment เป็นส่วนของระบบ'],['HYPOTHESIZE','UI Complete แต่ Progress หายหลัง Login ใหม่',['สีปุ่มผิด','state อยู่ local/cache แต่ไม่ persist backend','AI accuracy ต่ำ'],1,'สมมติฐานเชื่อม symptom กับ persistence'],['ACT • Evidence','มี Investigation Energy 1 จะเปิดอะไร?',['CSS','Backend save response + progress record','Logo'],1,'หลักฐานแยก UI success กับ persisted success'],['PROVE','UI success แต่ backend ไม่มี record',['Release','แก้ persistence + End-to-End regression','เพิ่ม animation'],1,'ต้องพิสูจน์ continuity หลังแก้']]},W2:{title:'SOURCE OF TRUTH',boss:false,phases:[['SCAN • Conflict','Game=COMPLETE • local=COMPLETE • Backend=INCOMPLETE • Passport=LOCKED','ปัญหาหลัก?',['UI color','State sources ขัดกัน','AI overfit'],1,'นี่คือ state/authority conflict'],['MAP • Data Flow','Flow ใดเหมาะกับ official state?',['Game→UI→official','Game→save→backend confirm→Passport','local→Passport'],1,'Authority ต้อง confirm'],['HYPOTHESIZE','local COMPLETE แต่ backend INCOMPLETE',['save/acknowledgement ล้มเหลว','font ช้า','AI ต่ำ'],0,'ตรวจ transport/save acknowledgement'],['ACT • Offline','Backend คือ Source of Truth เมื่อ offline ควร?',['local=official ทันที','เก็บ pending แล้ว sync/confirm','ลบ progress'],1,'Pending ไม่เท่ากับ official'],['PROVE • Continuity','Test ใดดีที่สุด?',['ดูสีเขียว','Complete→server confirm→logout→login→ยัง unlock','refresh CSS'],1,'End-to-End continuity']]},B1:{title:'THE FALSE SUCCESS',boss:true,phases:[['BOSS 100%','☠ Mission Complete แต่ Mission ถัดไป LOCK','โจมตีด้วยอะไร?',['เปลี่ยนสี','ตรวจ authoritative progress/save confirmation','reload'],1,'EVIDENCE STRIKE'],['BOSS 80%','Decoy: localStorage = COMPLETE','ทำอะไร?',['เชื่อ local','เทียบ authoritative backend','ล้าง cache'],1,'AUTHORITY SHIELD BROKEN'],['BOSS 60%','POST /complete → timeout แต่ UI = COMPLETE','Root cause class?',['Persistence/integration acknowledgement failure','Typography','Model accuracy'],0,'ROOT CAUSE EXPOSED'],['BOSS 40%','Fix ใดหยุด False Success?',['รอ confirmed save; timeout=pending/retry','ขยายคำว่า COMPLETE','local only'],0,'FALSE SUCCESS CORE HIT'],['BOSS 20%','Regression test?',['ดู UI','Complete→timeout→no false unlock→retry→backend confirm→relogin→unlock','accuracy'],1,'REGRESSION ARMOR BROKEN'],['FINAL STRIKE','Evidence ใดพอปิด incident?',['Screenshot','Requirement + save evidence + authoritative record + relogin test','developer บอก'],1,'💥 BOSS DEFEATED']]}};
const catalog=[['W1','SYSTEM DOWN!','Failure Hunt • System Thinking'],['W2','SOURCE OF TRUTH','System Map • State'],['B1','THE FALSE SUCCESS','Boss • Incident'],['W3','PROCESS RUSH','Strategy • Process'],['W4','STAKEHOLDER CHAOS','Detective • Stakeholder'],['W5','THE HIDDEN REQUIREMENT','Escape Room • Requirements'],['B2','SCOPE MONSTER','Boss • Scope'],['W6','ARCHITECTURE ARENA','Builder • Architecture'],['W7','AI HAS NO IDEA','Arcade • Fallback'],['W8','PROTOTYPE X','Experiment • Prototype'],['B3','CASCADE FAILURE','Boss • Cascade'],['W9','TEST LAB','Lab • Testing'],['W10','BUG HUNTER','Detective • Debugging'],['W11','ZERO-DAY RELEASE','Timed • QA'],['W12','UPDATE DISASTER','Release • Evolution'],['B4','PRODUCTION ON FIRE','Boss • War Room'],['W13','PROJECT SURVIVAL','Simulation • Project'],['W14','AI ON TRIAL','Tribunal • Responsible AI'],['W15','GO / NO-GO','Audit • Readiness'],['FINAL','SYSTEM ZERO','Final Boss • Dossier']];let state=JSON.parse(localStorage.getItem('csai2104_crisis_state_v2')||'{"done":[],"ep":0,"boss":0,"integrity":82}'),run=null;function save(){localStorage.setItem('csai2104_crisis_state_v2',JSON.stringify(state));render()}function unlocked(i){return i===0||state.done.includes(catalog[i-1][0])}function render(){rank.textContent=state.ep>=400?'Release Engineer':state.ep>=220?'System Investigator':'Junior Engineer';ep.textContent=state.ep+' EP';integrity.textContent=state.integrity+'%';bossCount.textContent=state.boss+'/5';missionGrid.innerHTML='';catalog.forEach((m,i)=>{let u=unlocked(i),done=state.done.includes(m[0]),impl=!!full[m[0]],c=document.createElement('article');c.className='card '+((m[0][0]==='B'||m[0]==='FINAL')?'boss ':'')+(!u?'locked':'');c.innerHTML=`<div class="week">${m[0]}${done?' • CLEARED':''}</div><h3>${m[1]}</h3><p>${impl?full[m[0]].phases.length+'-Phase Interactive Mission':'Mission mechanic queued'}</p><div class="tags">${m[2].split(' • ').map(x=>`<span class="tag">${x}</span>`).join('')}</div><button ${!u||!impl?'disabled':''}>${done?'เล่นซ้ำ':impl?'เข้าสู่ภารกิจ':'กำลังพัฒนา'}</button>`;c.querySelector('button').onclick=()=>start(m[0]);missionGrid.appendChild(c)})}function start(id){run={id,phase:0,correct:0,locked:false};dlg.showModal();show()}function show(){let m=full[run.id],p=m.phases[run.phase];mw.textContent=run.id+(m.boss?' • BOSS GATE':' • MISSION');mt.textContent=m.title;phaseTag.textContent=`Phase ${run.phase+1}/${m.phases.length} • ${p[0]}`;runScore.textContent=`Evidence Hits ${run.correct}/${run.phase}`;bar.style.width=(run.phase/m.phases.length*100)+'%';scene.textContent=p[1]+'\n\n'+p[2];fb.className='feedback';choices.innerHTML='';next.style.display='none';p[3].forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>answer(i,p);choices.appendChild(b)})}function answer(i,p){if(run.locked)return;run.locked=true;[...choices.children].forEach(x=>x.disabled=true);if(i===p[4]){run.correct++;state.ep+=10;state.integrity=Math.min(100,state.integrity+1);fb.className='feedback good';fb.textContent='✓ '+p[5]+' • +10 EP'}else{state.integrity=Math.max(0,state.integrity-2);fb.className='feedback bad';fb.textContent='✕ ASSUMPTION WITHOUT SUFFICIENT EVIDENCE — '+p[5]}save();next.style.display='block';next.textContent=run.phase===full[run.id].phases.length-1?'สรุป Mission':'Phase ถัดไป →'}next.onclick=()=>{let m=full[run.id];if(run.phase<m.phases.length-1){run.phase++;run.locked=false;show();return}let pass=Math.ceil(m.phases.length*.7);scene.textContent=run.correct>=pass?`MISSION CLEARED\nEvidence ${run.correct}/${m.phases.length}`:`MISSION NOT CLEARED\nEvidence ${run.correct}/${m.phases.length} • ต้องได้ ${pass}`;choices.innerHTML='';next.style.display='none';if(run.correct>=pass&&!state.done.includes(run.id)){state.done.push(run.id);state.ep+=m.boss?60:35;if(m.boss)state.boss++;save()}fb.className='feedback '+(run.correct>=pass?'good':'bad');fb.textContent=run.correct>=pass?(m.boss?'☠ BOSS DEFEATED':'✓ Evidence Pack complete'):'ยังไม่ปลดล็อก Mission ถัดไป'};close.onclick=()=>dlg.close();startBtn.onclick=()=>start('W1');render();
</script></body></html>
