<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>HeroHealth Firestore Smoke Test</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4fbff;color:#15324a}
    main{width:min(720px,calc(100% - 32px));background:#fff;border:1px solid #d9edf7;border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(32,89,117,.12)}
    h1{margin-top:0}.status{padding:14px 16px;border-radius:16px;background:#eef7ff;font-weight:800}.ok{background:#e9f9ef;color:#126b37}.error{background:#fff0f0;color:#982626}
    button{margin-top:16px;min-height:46px;padding:0 18px;border:0;border-radius:14px;font-weight:800;cursor:pointer}
    dl{display:grid;grid-template-columns:160px 1fr;gap:10px}dt{font-weight:800}dd{margin:0;overflow-wrap:anywhere}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
</head>
<body>
<main>
  <h1>HeroHealth Firestore Smoke Test</h1>
  <p>ทดสอบเขียนและอ่านเอกสารเฉพาะ UID ของผู้ใช้ Anonymous ปัจจุบัน</p>
  <div id="status" class="status">พร้อมทดสอบ</div>
  <button id="run">ทดสอบเขียน–อ่าน Firestore</button>
  <dl>
    <dt>Project</dt><dd id="project">-</dd>
    <dt>Anonymous UID</dt><dd><code id="uid">-</code></dd>
    <dt>Document path</dt><dd><code id="path">-</code></dd>
    <dt>Read back</dt><dd id="readback">-</dd>
  </dl>
</main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
  import { HEROHEALTH_FIREBASE_CONFIG } from "./firebase-config.js?v=20260804-1301";

  const statusEl=document.getElementById('status');
  const runBtn=document.getElementById('run');
  const projectEl=document.getElementById('project');
  const uidEl=document.getElementById('uid');
  const pathEl=document.getElementById('path');
  const readbackEl=document.getElementById('readback');

  projectEl.textContent=HEROHEALTH_FIREBASE_CONFIG.projectId;
  const app=initializeApp(HEROHEALTH_FIREBASE_CONFIG);
  const auth=getAuth(app);
  const db=getFirestore(app);

  async function ensureUser(){
    if(auth.currentUser) return auth.currentUser;
    const cred=await signInAnonymously(auth);
    return cred.user;
  }

  runBtn.addEventListener('click',async()=>{
    runBtn.disabled=true;
    statusEl.className='status';
    statusEl.textContent='กำลังทดสอบ…';
    try{
      const user=await ensureUser();
      uidEl.textContent=user.uid;
      const ref=doc(db,'firebaseSmokeTests',user.uid);
      pathEl.textContent=ref.path;
      await setDoc(ref,{uid:user.uid,projectId:HEROHEALTH_FIREBASE_CONFIG.projectId,testType:'firestore-smoke-test',clientTime:new Date().toISOString(),serverTime:serverTimestamp()},{merge:true});
      const snap=await getDoc(ref);
      if(!snap.exists()) throw new Error('เขียนสำเร็จแต่ไม่พบเอกสารตอนอ่านกลับ');
      readbackEl.textContent=JSON.stringify(snap.data());
      statusEl.textContent='เขียนและอ่าน Firestore สำเร็จ';
      statusEl.className='status ok';
    }catch(error){
      console.error(error);
      statusEl.textContent=`ทดสอบไม่สำเร็จ: ${error?.code || ''} ${error?.message || error}`;
      statusEl.className='status error';
    }finally{runBtn.disabled=false;}
  });
</script>
</body>
</html>
