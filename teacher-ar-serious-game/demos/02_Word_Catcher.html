<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Word Catcher</title><style>body{margin:0;background:#07131e;color:#fff;font-family:system-ui;overflow:hidden}#stage{position:relative;width:100vw;height:100vh;max-width:920px;margin:auto;background:radial-gradient(circle at 50% 20%,#24536b,#07131e 72%);overflow:hidden}#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.73}#shade{position:absolute;inset:0;background:linear-gradient(#00101b66,#00101b10 48%,#00101bb5);z-index:1}#world{position:absolute;inset:0;z-index:3}.obj{position:absolute;width:70px;height:70px;border-radius:22px;background:#fffffff4;color:#10243a;display:grid;place-items:center;font-size:36px;box-shadow:0 9px 24px #0006;touch-action:none;user-select:none}#hud{position:absolute;inset:0;z-index:8;padding:12px;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#ffffffe9;color:#10243a;padding:7px 10px;border-radius:999px;font-weight:900}#mission{position:absolute;top:62px;left:12px;right:12px;background:#07131edd;border:1px solid #ffffff55;border-radius:17px;padding:10px 13px}#bar{height:6px;background:#ffffff30;border-radius:99px;margin-top:8px;overflow:hidden}#fill{height:100%;width:0;background:#fff}#cursor{position:fixed;z-index:30;width:34px;height:34px;border:4px solid #fff;border-radius:50%;background:#10243ac7;transform:translate(-50%,-50%);display:none;pointer-events:none}#intro,#count{position:absolute;inset:0;z-index:25;background:#07131eef;display:grid;place-items:center;padding:20px}.panel{background:#fffffff5;color:#10243a;max-width:610px;width:min(94vw,610px);padding:24px;border-radius:25px;text-align:center}.hero{font-size:62px}button{border:0;border-radius:15px;min-height:56px;padding:12px;font-size:17px;font-weight:900;width:100%;margin-top:8px}.primary{background:#10243a;color:#fff}.secondary{background:#e7edf3;color:#10243a}#count{display:none;background:#07131e77;font-size:min(30vw,150px);font-weight:1000}#toast,#boss{position:absolute;z-index:19;left:50%;top:44%;transform:translate(-50%,-50%);font-size:28px;font-weight:1000;text-shadow:0 4px 15px #000;opacity:0}#boss{display:none;opacity:1;background:#fff;color:#10243a;padding:18px 25px;border-radius:20px;text-align:center}small{opacity:.72}</style><body><div id="stage"><video id="cam" autoplay playsinline muted></video><div id="shade"></div><div id="world"></div><div id="hud"><div class="top"><div class="stats"><span class="pill" id="score">⭐ 0</span><span class="pill" id="hearts">❤️❤️❤️</span><span class="pill" id="combo">COMBO ×0</span><span class="pill" id="best">BEST 0</span></div><span class="pill" id="progress">0/12</span></div><div id="mission"><b id="missionTitle">MISSION 1 • Find FOOD</b><div id="feedback">ใช้ Hand Cursor แตะเฉพาะสิ่งที่เป็น FOOD</div><div id="bar"><div id="fill"></div></div></div></div><div id="toast"></div><div id="boss"></div><div id="count"></div><div id="intro"><div class="panel"><div class="hero">🔤</div><h1>Word Catcher</h1><p>เข้าสู่ Word Portal — จับเฉพาะ FOOD เพื่อสะสม Language Combo</p><p><b>HAND CATCH • CATEGORY • COMBO</b></p><button id="hand" class="primary">✋ เล่นด้วยมือ</button><button id="touch" class="secondary">👆 Touch / Mouse สำรอง</button><small>Hand Mode ต้องใช้กล้องและอินเทอร์เน็ต • แนะนำเปิดผ่าน HTTPS</small></div></div></div><div id="cursor"></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script>const C={goal:12,duration:52,m2:16,m3:31,boss:'WORD RUSH',spawn:1000,speed:2.5,items:[['🍎',1,'APPLE is food.'],['🍕',1,'PIZZA is food.'],['🍌',1,'BANANA is food.'],['🪑',0,'CHAIR is furniture.'],['📚',0,'BOOK is a classroom object.'],['✏️',0,'PENCIL is a classroom object.']]};const $=q=>document.querySelector(q),stage=$('#stage'),world=$('#world'),video=$('#cam'),cursor=$('#cursor');let s=0,l=3,c=0,bestC=0,ok=0,err=0,miss=0,mode='touch',stream,hands,busy=false,objs=[],last=0,t0=0,bossOn=false,ended=false,mi=-1;const sr=()=>stage.getBoundingClientRect();function hud(msg){$('#score').textContent='⭐ '+s;$('#hearts').textContent='❤️'.repeat(l)+'♡'.repeat(3-l);$('#combo').textContent='COMBO ×'+c;$('#best').textContent='BEST '+bestC;if(msg)$('#feedback').textContent=msg;const done=ok+err+miss;$('#fill').style.width=Math.min(100,done/C.goal*100)+'%';$('#progress').textContent=Math.min(done,C.goal)+'/'+C.goal}function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,650)}async function countdown(){$('#count').style.display='grid';for(const x of ['3','2','1','GO!']){$('#count').textContent=x;await new Promise(r=>setTimeout(r,x==='GO!'?650:520))}$('#count').style.display='none';t0=performance.now();requestAnimationFrame(loop)}function startTouch(){mode='touch';$('#intro').remove();countdown()}async function startHand(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.55});hands.onResults(onHands);mode='hand';$('#intro').remove();track();countdown()}catch(e){alert('เปิด Hand Mode ไม่ได้ กรุณาใช้ HTTPS / Internet / Camera Permission หรือเลือก Touch Mode')}}async function track(){if(ended)return;if(mode==='hand'&&video.readyState>=2&&!busy){busy=true;try{await hands.send({image:video})}catch(e){}busy=false}requestAnimationFrame(track)}function onHands(r){if(!r.multiHandLandmarks?.length){cursor.style.display='none';return}const p=r.multiHandLandmarks[0][8],R=sr(),x=R.left+(1-p.x)*R.width,y=R.top+p.y*R.height;cursor.style.display='block';cursor.style.left=x+'px';cursor.style.top=y+'px';hitAt(x-R.left,y-R.top)}function spawn(){const d=C.items[Math.floor(Math.random()*C.items.length)],e=document.createElement('div');e.className='obj';e.textContent=d[0];e.style.left=(8+Math.random()*76)+'%';e.style.top='-78px';world.appendChild(e);const o={e,d,y:-78,speed:(bossOn?C.speed*1.42:C.speed)*(.88+Math.random()*.25),hit:false};objs.push(o);if(mode==='touch')e.onpointerdown=()=>hit(o)}function hitAt(x,y){const R=sr();for(const o of objs){if(o.hit)continue;const r=o.e.getBoundingClientRect();if(x>=r.left-R.left&&x<=r.right-R.left&&y>=r.top-R.top&&y<=r.bottom-R.top){hit(o);break}}}function hit(o){if(!o||o.hit)return;o.hit=true;if(o.d[1]){s+=100;c++;bestC=Math.max(bestC,c);ok++;toast(c>=3?'🔥 COMBO ×'+c:'+100');hud(o.d[2])}else{l--;c=0;err++;toast('ลองใหม่');hud(o.d[2]);if(l<=0)return finish(false)}o.e.remove();objs=objs.filter(x=>x!==o)}function mission(sec){const idx=sec<C.m2?0:sec<C.m3?1:2;if(idx!==mi){mi=idx;$('#missionTitle').textContent=['MISSION 1 • Find FOOD','MISSION 2 • Avoid Distractors','MISSION 3 • Combo Challenge'][idx];toast('MISSION '+(idx+1))}}function loop(t){if(ended)return;const sec=(t-t0)/1000;mission(sec);if((ok+err+miss)>=C.goal&&!bossOn){bossOn=true;$('#boss').style.display='block';$('#boss').innerHTML='🚨 FINAL BOSS<br>'+C.boss;$('#missionTitle').textContent='FINAL BOSS — '+C.boss;setTimeout(()=>$('#boss').style.display='none',1700)}if(sec>C.duration)return finish(true);if(t-last>(bossOn?C.spawn*.68:C.spawn)){spawn();last=t}for(const o of [...objs]){o.y+=o.speed;o.e.style.top=o.y+'px';if(o.y>stage.clientHeight-120){if(o.d[1]){miss++;l--;c=0;hud('เป้าหมาย FOOD หลุดไป!');if(l<=0)return finish(false)}o.e.remove();objs=objs.filter(x=>x!==o)}}requestAnimationFrame(loop)}function finish(win){ended=true;stream?.getTracks().forEach(t=>t.stop());const a=ok+err+miss,acc=a?Math.round(ok/a*100):0;document.body.innerHTML='<div style="min-height:100vh;background:#07131e;color:#fff;display:grid;place-items:center;font-family:system-ui;padding:20px;text-align:center"><div><div style="font-size:72px">'+(win?'🏆':'💪')+'</div><h1>'+(win?'WORD EXPLORER':'ฝึกอีกครั้ง')+'</h1><h2>'+s+' คะแนน</h2><p>Accuracy '+acc+'% • Best Combo ×'+bestC+'</p><p>Correct '+ok+' • Miss/Error '+(err+miss)+'</p><button onclick="location.reload()" style="max-width:360px">เล่นอีกครั้ง</button></div></div>'}$('#hand').onclick=startHand;$('#touch').onclick=startTouch;hud();</script></body></html>
