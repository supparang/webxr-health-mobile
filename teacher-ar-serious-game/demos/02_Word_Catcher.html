<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Word Catcher</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#07131e;color:#fff}#stage{position:relative;width:100%;height:100%;max-width:920px;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 20%,#24536b,#07131e 72%)}#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.73}#shade{position:absolute;inset:0;background:linear-gradient(#00101b66,#00101b0b 48%,#00101bb8);z-index:1;pointer-events:none}#world{position:absolute;inset:0;z-index:3}.obj{position:absolute;width:70px;height:70px;border-radius:22px;background:#fffffff4;color:#10243a;display:grid;place-items:center;font-size:36px;font-weight:950;box-shadow:0 9px 24px #0006;touch-action:none;user-select:none;transition:.15s}#hud{position:absolute;inset:0;z-index:8;padding:12px;pointer-events:none}.topbar{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#ffffffe9;color:#10243a;padding:7px 10px;border-radius:999px;font-weight:900;box-shadow:0 3px 12px #0003;font-size:14px}#missionCard{position:absolute;top:62px;left:12px;right:12px;background:#07131ee2;border:1px solid #ffffff55;border-radius:17px;padding:10px 13px;backdrop-filter:blur(8px)}#missionTitle{font-size:16px;font-weight:950}#feedback{font-size:13px;margin-top:3px;opacity:.96}#progressTrack{height:6px;background:#ffffff30;border-radius:99px;margin-top:8px;overflow:hidden}#progressBar{height:100%;width:0;background:#fff;border-radius:99px;transition:.2s}#cursor{position:fixed;z-index:30;width:34px;height:34px;border:4px solid #fff;border-radius:50%;background:#10243ac7;transform:translate(-50%,-50%);display:none;pointer-events:none}#intro,#countdown,#result{position:absolute;inset:0;z-index:25;background:#07131eef;display:grid;place-items:center;padding:20px}.panel{background:#fffffff5;color:#10243a;max-width:610px;width:min(94vw,610px);padding:24px;border-radius:25px;text-align:center;box-shadow:0 16px 50px #0007}.hero{font-size:62px}button{border:0;border-radius:15px;min-height:56px;padding:12px;font-size:17px;font-weight:900;width:100%;margin-top:8px;cursor:pointer}.primary{background:#10243a;color:#fff}.secondary{background:#e7edf3;color:#10243a}#countdown{display:none;background:#07131e77;font-size:min(30vw,150px);font-weight:1000;text-shadow:0 8px 30px #000}#toast{position:absolute;z-index:18;left:50%;top:45%;transform:translate(-50%,-50%);font-size:28px;font-weight:1000;text-shadow:0 4px 15px #000;opacity:0;pointer-events:none}#bossBanner{display:none;position:absolute;z-index:19;left:50%;top:43%;transform:translate(-50%,-50%);background:#fff;color:#10243a;padding:18px 25px;border-radius:20px;font-size:24px;font-weight:1000;text-align:center;box-shadow:0 10px 35px #0008}small{opacity:.72}@media(max-width:600px){.obj{width:62px;height:62px;font-size:31px}.pill{font-size:12px;padding:6px 8px}#missionCard{top:56px}}</style><body><div id="stage"><video id="cam" autoplay playsinline muted></video><div id="shade"></div><div id="world"></div><div id="hud"><div class="topbar"><div class="stats"><span class="pill" id="score">⭐ 0</span><span class="pill" id="hearts">❤️❤️❤️</span><span class="pill" id="combo">COMBO ×0</span><span class="pill" id="best">BEST 0</span></div><span class="pill" id="progress">0/0</span></div><div id="missionCard"><div id="missionTitle">READY</div><div id="feedback">เตรียมพร้อม</div><div id="progressTrack"><div id="progressBar"></div></div></div></div><div id="toast"></div><div id="bossBanner"></div><div id="countdown"></div><div id="intro"><div class="panel"><div class="hero">🔤</div><h1>Word Catcher</h1><p>จับคำศัพท์ตามหมวด Mission ที่เปลี่ยนจริงระหว่างด่าน</p><p><b>HAND CATCH • CATEGORY SHIFT • COMBO</b></p><button id="startHand" class="primary">✋ เล่นด้วยมือ</button><button id="startTouch" class="secondary">👆 Touch / Mouse สำรอง</button><small>Hand Mode ต้องใช้กล้องและ Internet • แนะนำ HTTPS</small></div></div></div><div id="cursor"></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script>const PRE_GOAL=9,BOSS_GOAL=8,BOSS_NAME="CATEGORY RUSH",BOSS_HINT="เป้าหมายจะเปลี่ยนหมวดทุก 2 คะแนน",BADGE="WORD EXPLORER",ITEMS=[{"icon":"🍎","kind":"food","label":"APPLE"},{"icon":"🍕","kind":"food","label":"PIZZA"},{"icon":"🍌","kind":"food","label":"BANANA"},{"icon":"📚","kind":"classroom","label":"BOOK"},{"icon":"✏️","kind":"classroom","label":"PENCIL"},{"icon":"🪑","kind":"classroom","label":"CHAIR"},{"icon":"🐶","kind":"animal","label":"DOG"},{"icon":"🐱","kind":"animal","label":"CAT"},{"icon":"🐘","kind":"animal","label":"ELEPHANT"}];const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)],stage=$('#stage'),world=$('#world'),cam=$('#cam'),cursor=$('#cursor');let score=0,lives=3,combo=0,best=0,correct=0,wrong=0,miss=0,stream=null,hands=null,busy=false,mode='touch',objs=[],drag=null,lastSpawn=0,ended=false,boss=false,bossCorrect=0;const SR=()=>stage.getBoundingClientRect();function hud(msg,done=0,total=1){$('#score').textContent='⭐ '+score;$('#hearts').textContent='❤️'.repeat(lives)+'♡'.repeat(3-lives);$('#combo').textContent='COMBO ×'+combo;$('#best').textContent='BEST '+best;$('#progress').textContent=(boss?'BOSS ':'')+done+'/'+total;$('#progressBar').style.width=Math.min(100,done/total*100)+'%';if(msg)$('#feedback').textContent=msg}function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,650)}async function count(){setup();$('#countdown').style.display='grid';for(const x of ['3','2','1','GO!']){$('#countdown').textContent=x;await new Promise(r=>setTimeout(r,x==='GO!'?600:480))}$('#countdown').style.display='none';requestAnimationFrame(loop)}function laneX(){return Math.random()<.5?(6+Math.random()*23):(69+Math.random()*23)}function good(msg){score+=100;combo++;best=Math.max(best,combo);correct++;if(boss)bossCorrect++;toast(combo>=3?'🔥 COMBO ×'+combo:'+100');hud(msg,boss?bossCorrect:correct,boss?BOSS_GOAL:PRE_GOAL);checkPhase()}function bad(msg){lives--;combo=0;wrong++;toast('ลองใหม่');hud(msg,boss?bossCorrect:correct,boss?BOSS_GOAL:PRE_GOAL);if(lives<=0)finish(false)}function removeObj(o){o.e.remove();objs=objs.filter(x=>x!==o)}function checkPhase(){if(!boss&&correct>=PRE_GOAL){boss=true;bossCorrect=0;$('#bossBanner').style.display='block';$('#bossBanner').innerHTML='🚨 FINAL BOSS<br>'+BOSS_NAME;$('#missionTitle').textContent='FINAL BOSS — '+BOSS_NAME;$('#feedback').textContent=BOSS_HINT;hud(null,0,BOSS_GOAL);setTimeout(()=>$('#bossBanner').style.display='none',1700)}else if(boss&&bossCorrect>=BOSS_GOAL)finish(true)}function summary(win){ended=true;stream?.getTracks().forEach(t=>t.stop());const attempts=correct+wrong+miss,acc=attempts?Math.round(correct/attempts*100):0;document.body.innerHTML=`<div id="result"><div class="panel"><div class="hero">${win?'🏆':'💪'}</div><h1>${win?BADGE:'ฝึกอีกครั้ง'}</h1><h2>${score} คะแนน</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:left;margin:16px 0"><div>🎯 Accuracy <b>${acc}%</b></div><div>🔥 Best Combo <b>×${best}</b></div><div>✅ Correct <b>${correct}</b></div><div>🧭 Miss/Error <b>${wrong+miss}</b></div></div><button class="primary" onclick="location.reload()">เล่นอีกครั้ง</button></div></div>`}function finish(win){if(!ended)summary(win)}let target='food',phase=0,bossTargetIndex=0;const targets=[['food','FOOD'],['classroom','CLASSROOM'],['animal','ANIMAL']];function setup(){setTarget()}function setTarget(){if(!boss){phase=correct<3?0:correct<6?1:2;target=targets[phase][0];$('#missionTitle').textContent='MISSION '+(phase+1)+' • Catch '+targets[phase][1]}else{target=targets[bossTargetIndex%3][0];$('#missionTitle').textContent='FINAL BOSS • Catch '+targets[bossTargetIndex%3][1]}hud('จับเฉพาะ '+targets.find(x=>x[0]===target)[1],boss?bossCorrect:correct,boss?BOSS_GOAL:PRE_GOAL)}function spawn(){const d=ITEMS[Math.floor(Math.random()*ITEMS.length)],e=document.createElement('div');e.className='obj';e.textContent=d.icon;e.style.left=laneX()+'%';e.style.top='-75px';world.appendChild(e);const o={e,d,y:-75,speed:(boss?3.5:2.45)*(.9+Math.random()*.25),hit:false};objs.push(o);if(mode==='touch')e.onpointerdown=()=>hit(o)}function hit(o){if(!o||o.hit)return;o.hit=true;if(o.d.kind===target){good(o.d.label+' ✓ '+targets.find(x=>x[0]===target)[1]);if(boss&&bossCorrect%2===0){bossTargetIndex++;setTarget()}else setTarget()}else bad(o.d.label+' เป็น '+o.d.kind.toUpperCase()+' ไม่ใช่ '+target.toUpperCase());removeObj(o)}function interact(x,y){const R=SR();for(const o of objs){if(o.hit)continue;const r=o.e.getBoundingClientRect();if(x>=r.left-R.left&&x<=r.right-R.left&&y>=r.top-R.top&&y<=r.bottom-R.top){hit(o);break}}}function loop(t){if(ended)return;if(t-lastSpawn>(boss?650:950)){spawn();lastSpawn=t}for(const o of [...objs]){o.y+=o.speed;o.e.style.top=o.y+'px';if(o.y>stage.clientHeight-110){if(o.d.kind===target){miss++;lives--;combo=0;hud(o.d.label+' หลุดไป — เป็นเป้าหมาย '+target.toUpperCase(),boss?bossCorrect:correct,boss?BOSS_GOAL:PRE_GOAL);if(lives<=0)return finish(false)}removeObj(o)}}requestAnimationFrame(loop)}function startTouch(){mode='touch';$('#intro').remove();count()}async function startHand(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});cam.srcObject=stream;await cam.play();hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.55});hands.onResults(r=>{if(!r.multiHandLandmarks?.length){cursor.style.display='none';return}const p=r.multiHandLandmarks[0][8],R=SR(),x=R.left+(1-p.x)*R.width,y=R.top+p.y*R.height;cursor.style.display='block';cursor.style.left=x+'px';cursor.style.top=y+'px';interact(x-R.left,y-R.top)});mode='hand';$('#intro').remove();track();count()}catch(e){alert('เปิด Hand Mode ไม่ได้ กรุณาใช้ HTTPS / Camera Permission หรือ Touch Mode')}}async function track(){if(ended)return;if(mode==='hand'&&cam.readyState>=2&&!busy){busy=true;try{await hands.send({image:cam})}catch(e){}busy=false}requestAnimationFrame(track)}const oldCheck=checkPhase;checkPhase=function(){let was=boss;oldCheck();if(!was&&boss){bossTargetIndex=0;setTarget()}};$('#startHand').onclick=startHand;$('#startTouch').onclick=startTouch;hud('เตรียมพร้อม',0,PRE_GOAL);</script></body></html>
