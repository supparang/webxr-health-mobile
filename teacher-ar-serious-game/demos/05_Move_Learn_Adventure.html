<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Move & Learn Adventure</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#07131e;color:#fff}#stage{position:relative;width:100%;height:100%;max-width:920px;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 20%,#24536b,#07131e 72%)}#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.73}#shade{position:absolute;inset:0;background:linear-gradient(#00101b66,#00101b0b 48%,#00101bb8);z-index:1;pointer-events:none}#hud{position:absolute;inset:0;z-index:8;padding:12px;pointer-events:none}.topbar{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#ffffffe9;color:#10243a;padding:7px 10px;border-radius:999px;font-weight:900;box-shadow:0 3px 12px #0003;font-size:14px}#missionCard{position:absolute;top:62px;left:12px;right:12px;background:#07131ee2;border:1px solid #ffffff55;border-radius:17px;padding:10px 13px;backdrop-filter:blur(8px)}#missionTitle{font-size:16px;font-weight:950}#feedback{font-size:13px;margin-top:3px;opacity:.96}#progressTrack{height:6px;background:#ffffff30;border-radius:99px;margin-top:8px;overflow:hidden}#progressBar{height:100%;width:0;background:#fff;border-radius:99px;transition:.2s}#intro,#result{position:absolute;inset:0;z-index:25;background:#07131eef;display:grid;place-items:center;padding:20px}.panel{background:#fffffff5;color:#10243a;max-width:610px;width:min(94vw,610px);padding:24px;border-radius:25px;text-align:center;box-shadow:0 16px 50px #0007}.hero{font-size:62px}button{border:0;border-radius:15px;min-height:56px;padding:12px;font-size:17px;font-weight:900;width:100%;margin-top:8px;cursor:pointer}.primary{background:#10243a;color:#fff}small{opacity:.72}#poseMission{position:absolute;z-index:10;left:50%;top:48%;transform:translate(-50%,-50%);font-size:36px;font-weight:1000;text-align:center;text-shadow:0 5px 18px #000;max-width:80%}@media(max-width:600px){.pill{font-size:12px;padding:6px 8px}#missionCard{top:56px}#poseMission{font-size:30px}}</style><body><div id="stage"><video id="cam" autoplay playsinline muted></video><div id="shade"></div><div id="hud"><div class="topbar"><div class="stats"><span class="pill" id="score"></span><span class="pill" id="hearts"></span><span class="pill" id="combo"></span><span class="pill" id="best"></span></div><span class="pill" id="progress"></span></div><div id="missionCard"><div id="missionTitle"></div><div id="feedback"></div><div id="progressTrack"><div id="progressBar"></div></div></div></div><div id="poseMission"></div><div id="intro"><div class="panel"><div class="hero">🏃</div><h1>Move & Learn Adventure</h1><p>ใช้ร่างกายตอบสนองต่อ Learning Prompt จริง</p><p><b>LEAN • JUMP • DUCK • BALANCE</b></p><button id="startPose" class="primary">🧍 เริ่ม Pose Mission</button><small>วางกล้องให้เห็นช่วงตัว • HTTPS + Internet</small></div></div></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script><script>const $=q=>document.querySelector(q);let pose,stream,busy=false,score=0,combo=0,best=0,idx=0,hold=0,last=0,ended=false;const tasks=[{text:'7 × 6 = 42',action:'LEAN RIGHT',icon:'➡️'},{text:'Water is a solid',action:'LEAN LEFT',icon:'⬅️'},{text:'Collect the Knowledge Star',action:'JUMP',icon:'⬆️'},{text:'Avoid the wrong fact',action:'DUCK',icon:'⬇️'},{text:'Hold steady to focus',action:'BALANCE',icon:'⚖️'},{text:'9 × 5 = 45',action:'LEAN RIGHT',icon:'➡️'},{text:'A cat is an animal',action:'LEAN RIGHT',icon:'➡️'},{text:'Ice is a gas',action:'LEAN LEFT',icon:'⬅️'},{text:'Collect the final star',action:'JUMP',icon:'⬆️'},{text:'Final focus',action:'BALANCE',icon:'⚖️'}];function upd(msg){$('#score').textContent='⭐ '+score;$('#combo').textContent='COMBO ×'+combo;$('#best').textContent='BEST '+best;$('#hearts').textContent='❤️❤️❤️';$('#progress').textContent=idx+'/10';$('#progressBar').style.width=(idx*10)+'%';$('#feedback').textContent=msg||'ทำ Action ที่ตรงกับโจทย์';if(idx<tasks.length){const t=tasks[idx];$('#missionTitle').textContent='MOTION LEARNING • '+t.text;$('#poseMission').innerHTML=t.icon+'<br>'+t.action}}async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});cam.srcObject=stream;await cam.play();pose=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f});pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:.55,minTrackingConfidence:.5});pose.onResults(res);intro.remove();upd('ยืนให้เห็นช่วงตัว แล้วทำท่าตามคำสั่ง');track()}catch(e){alert('เปิด Pose Detection ไม่ได้ กรุณาใช้ HTTPS / Internet และอนุญาตกล้อง')}}async function track(){if(ended)return;if(cam.readyState>=2&&!busy){busy=true;try{await pose.send({image:cam})}catch(e){}busy=false}requestAnimationFrame(track)}function res(r){if(!r.poseLandmarks||idx>=tasks.length)return;const l=r.poseLandmarks,n=l[0],ls=l[11],rs=l[12],lh=l[23],rh=l[24],la=l[27],ra=l[28],shoulderY=(ls.y+rs.y)/2,hipY=(lh.y+rh.y)/2,centerX=(ls.x+rs.x+lh.x+rh.x)/4,a=tasks[idx].action;let ok=false;if(a==='LEAN LEFT')ok=centerX<.43;if(a==='LEAN RIGHT')ok=centerX>.57;if(a==='DUCK')ok=n.y>shoulderY-.10;if(a==='JUMP')ok=hipY<.50&&la.y<.92&&ra.y<.92;if(a==='BALANCE')ok=Math.abs(ls.y-rs.y)<.04&&Math.abs(centerX-.5)<.08;if(ok){hold++;if(hold>8&&performance.now()-last>900){score+=100;combo++;best=Math.max(best,combo);idx++;hold=0;last=performance.now();upd('เยี่ยม! Action ถูกต้อง +100');if(idx>=tasks.length)finish()}}else hold=Math.max(0,hold-1)}function finish(){ended=true;stream?.getTracks().forEach(t=>t.stop());document.body.innerHTML='<div id="result"><div class="panel"><div class="hero">🏆</div><h1>MOTION HERO</h1><h2>'+score+' คะแนน</h2><p>ผ่าน Learning + Motion sequence ครบ 10 ภารกิจ</p><p>Best Combo ×'+best+'</p><button class="primary" onclick="location.reload()">เล่นอีกครั้ง</button></div></div>'}startPose.onclick=start;upd();</script></body></html>
