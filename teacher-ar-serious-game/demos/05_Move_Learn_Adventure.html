<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Move & Learn Adventure</title><style>body{margin:0;background:#07131e;color:#fff;font-family:system-ui;overflow:hidden}#stage{position:relative;width:100vw;height:100vh;max-width:920px;margin:auto;background:radial-gradient(circle at 50% 20%,#24536b,#07131e 72%);overflow:hidden}#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.73}#shade{position:absolute;inset:0;background:linear-gradient(#00101b66,#00101b10 48%,#00101bb5);z-index:1}#hud{position:absolute;inset:0;z-index:8;padding:12px;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#ffffffe9;color:#10243a;padding:7px 10px;border-radius:999px;font-weight:900}#mission{position:absolute;top:62px;left:12px;right:12px;background:#07131edd;border:1px solid #ffffff55;border-radius:17px;padding:10px 13px}#poseMission{position:absolute;z-index:10;left:50%;top:48%;transform:translate(-50%,-50%);font-size:38px;font-weight:1000;text-align:center;text-shadow:0 5px 18px #000}#intro{position:absolute;inset:0;z-index:25;background:#07131eef;display:grid;place-items:center;padding:20px}.panel{background:#fffffff5;color:#10243a;max-width:610px;width:min(94vw,610px);padding:24px;border-radius:25px;text-align:center}.hero{font-size:62px}button{border:0;border-radius:15px;min-height:56px;padding:12px;font-size:17px;font-weight:900;width:100%;margin-top:8px}.primary{background:#10243a;color:#fff}small{opacity:.72}</style><body><div id="stage"><video id="cam" autoplay playsinline muted></video><div id="shade"></div><div id="hud"><div class="top"><div class="stats"><span class="pill" id="score">⭐ 0</span><span class="pill" id="combo">COMBO ×0</span></div><span class="pill" id="progress">0/10</span></div><div id="mission"><b>MOTION MISSION</b><div id="feedback">ทำท่าตามคำสั่งบนหน้าจอ</div></div></div><div id="poseMission">🏃<br>READY?</div><div id="intro"><div class="panel"><div class="hero">🏃</div><h1>Move & Learn Adventure</h1><p>Motion Game ด้วย Pose Detection จริง</p><p><b>LEAN • JUMP • DUCK • BALANCE</b></p><button id="startPose" class="primary">🧍 เริ่ม Pose Mission</button><small>วางกล้องให้เห็นช่วงตัวมากที่สุด • ใช้ HTTPS และ Internet</small></div></div></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script><script>const $=q=>document.querySelector(q);let pose,stream,busy=false,score=0,combo=0,best=0,idx=0,hold=0,lastAction=0,ended=false;const actions=[['LEAN LEFT','⬅️'],['LEAN RIGHT','➡️'],['JUMP','⬆️'],['DUCK','⬇️'],['BALANCE','⚖️']];function upd(msg){$('#score').textContent='⭐ '+score;$('#combo').textContent='COMBO ×'+combo;$('#progress').textContent=idx+'/10';$('#feedback').textContent=msg||'ทำท่าตาม Mission';$('#poseMission').innerHTML=actions[idx%actions.length][1]+'<br>'+actions[idx%actions.length][0]}async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});cam.srcObject=stream;await cam.play();pose=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f});pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:.55,minTrackingConfidence:.5});pose.onResults(res);intro.remove();upd('ยืนให้เห็นช่วงตัวมากที่สุด แล้วทำท่าตามคำสั่ง');track()}catch(e){alert('เปิด Pose Detection ไม่ได้ กรุณาใช้ HTTPS / Internet และอนุญาตกล้อง')}}async function track(){if(ended)return;if(cam.readyState>=2&&!busy){busy=true;try{await pose.send({image:cam})}catch(e){}busy=false}requestAnimationFrame(track)}function res(r){if(!r.poseLandmarks)return;const l=r.poseLandmarks,n=l[0],ls=l[11],rs=l[12],lh=l[23],rh=l[24],la=l[27],ra=l[28],shoulderY=(ls.y+rs.y)/2,hipY=(lh.y+rh.y)/2,centerX=(ls.x+rs.x+lh.x+rh.x)/4,act=actions[idx%actions.length][0];let ok=false;if(act==='LEAN LEFT')ok=centerX<.43;if(act==='LEAN RIGHT')ok=centerX>.57;if(act==='DUCK')ok=n.y>shoulderY-.10;if(act==='JUMP')ok=hipY<.50&&la.y<.92&&ra.y<.92;if(act==='BALANCE')ok=Math.abs(ls.y-rs.y)<.04&&Math.abs(centerX-.5)<.08;if(ok){hold++;if(hold>8&&performance.now()-lastAction>900){score+=100;combo++;best=Math.max(best,combo);idx++;hold=0;lastAction=performance.now();upd('เยี่ยม! ท่าถูกต้อง +100');if(idx>=10)finish()}}else hold=Math.max(0,hold-1)}function finish(){ended=true;stream?.getTracks().forEach(t=>t.stop());document.body.innerHTML='<div style="min-height:100vh;background:#07131e;color:#fff;display:grid;place-items:center;font-family:system-ui;padding:20px;text-align:center"><div><div style="font-size:72px">🏆</div><h1>MOTION HERO</h1><h2>'+score+' คะแนน</h2><p>ผ่าน Lean • Jump • Duck • Balance sequence</p><p>Best Combo ×'+best+'</p><button onclick="location.reload()" style="max-width:360px">เล่นอีกครั้ง</button></div></div>'}startPose.onclick=start;upd();</script></body></html>
