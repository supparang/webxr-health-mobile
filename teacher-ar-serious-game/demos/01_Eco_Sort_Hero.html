<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Eco Sort Hero</title><style>body{margin:0;background:#07131e;color:#fff;font-family:system-ui;overflow:hidden}#stage{position:relative;width:100vw;height:100vh;max-width:920px;margin:auto;background:radial-gradient(circle at 50% 20%,#24536b,#07131e 72%);overflow:hidden}#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.73}#shade{position:absolute;inset:0;background:linear-gradient(#00101b66,#00101b10 48%,#00101bb5);z-index:1}#world{position:absolute;inset:0;z-index:3}.obj{position:absolute;width:70px;height:70px;border-radius:22px;background:#fffffff4;color:#10243a;display:grid;place-items:center;font-size:36px;box-shadow:0 9px 24px #0006;touch-action:none;user-select:none}.obj.grab{box-shadow:0 0 0 5px #fff,0 0 34px #fff9;transform:scale(1.1)}.zone{position:absolute;bottom:14px;height:98px;border:2px solid #ffffff88;border-radius:20px;background:#0b1e2dc7;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:900}.zone.hot{background:#ffffffe5;color:#10243a;box-shadow:0 0 30px #fff9;transform:translateY(-6px)}#hud{position:absolute;inset:0;z-index:8;padding:12px;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#ffffffe9;color:#10243a;padding:7px 10px;border-radius:999px;font-weight:900}#mission{position:absolute;top:62px;left:12px;right:12px;background:#07131edd;border:1px solid #ffffff55;border-radius:17px;padding:10px 13px}#bar{height:6px;background:#ffffff30;border-radius:99px;margin-top:8px;overflow:hidden}#fill{height:100%;width:0;background:#fff}#cursor{position:fixed;z-index:30;width:34px;height:34px;border:4px solid #fff;border-radius:50%;background:#10243ac7;transform:translate(-50%,-50%);display:none;pointer-events:none}#intro,#count{position:absolute;inset:0;z-index:25;background:#07131eef;display:grid;place-items:center;padding:20px}.panel{background:#fffffff5;color:#10243a;max-width:610px;width:min(94vw,610px);padding:24px;border-radius:25px;text-align:center}.hero{font-size:62px}button{border:0;border-radius:15px;min-height:56px;padding:12px;font-size:17px;font-weight:900;width:100%;margin-top:8px}.primary{background:#10243a;color:#fff}.secondary{background:#e7edf3;color:#10243a}#count{display:none;background:#07131e77;font-size:min(30vw,150px);font-weight:1000}#toast,#boss{position:absolute;z-index:19;left:50%;top:44%;transform:translate(-50%,-50%);font-size:28px;font-weight:1000;text-shadow:0 4px 15px #000;opacity:0}#boss{display:none;opacity:1;background:#fff;color:#10243a;padding:18px 25px;border-radius:20px;text-align:center}small{opacity:.72}</style><body><div id="stage"><video id="cam" autoplay playsinline muted></video><div id="shade"></div><div id="world"></div><div id="hud"><div class="top"><div class="stats"><span class="pill" id="score">⭐ 0</span><span class="pill" id="hearts">❤️❤️❤️</span><span class="pill" id="combo">COMBO ×0</span><span class="pill" id="best">BEST 0</span></div><span class="pill" id="progress">0/10</span></div><div id="mission"><b id="missionTitle">MISSION 1 • ฝึกแยกขยะ</b><div id="feedback">จีบเพื่อหยิบ → ลาก → ปล่อยลงถังที่ถูก</div><div id="bar"><div id="fill"></div></div></div></div><div id="toast"></div><div id="boss"></div><div id="count"></div><div id="intro"><div class="panel"><div class="hero">♻️</div><h1>Eco Sort Hero</h1><p>ช่วยเมืองก่อน Trash Storm! หยิบขยะแล้วส่งไปยังพื้นที่ที่ถูกต้อง</p><p><b>PINCH • DRAG • SORT</b></p><button id="hand" class="primary">✋ เล่นด้วยมือ</button><button id="touch" class="secondary">👆 Touch / Mouse สำรอง</button><small>Hand Mode ต้องใช้กล้องและอินเทอร์เน็ต • แนะนำเปิดผ่าน HTTPS</small></div></div></div><div id="cursor"></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script>const C={goal:10,duration:64,m2:18,m3:36,boss:'TRASH STORM',spawn:1900,speed:1.2,zones:[['recycle','♻️','รีไซเคิล'],['organic','🍃','อินทรีย์'],['hazard','⚠️','อันตราย']],items:[['🥫','recycle','กระป๋องโลหะ → รีไซเคิล'],['📄','recycle','กระดาษสะอาด → รีไซเคิล'],['🍌','organic','เปลือกกล้วย → อินทรีย์'],['🔋','hazard','ถ่านไฟฉาย → อันตราย']]};const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)],stage=$('#stage'),world=$('#world'),video=$('#cam'),cursor=$('#cursor');let s=0,l=3,c=0,bestC=0,ok=0,err=0,miss=0,mode='touch',stream,hands,busy=false,objs=[],drag=null,last=0,t0=0,bossOn=false,ended=false,mi=-1;const sr=()=>stage.getBoundingClientRect();function hud(msg){$('#score').textContent='⭐ '+s;$('#hearts').textContent='❤️'.repeat(l)+'♡'.repeat(3-l);$('#combo').textContent='COMBO ×'+c;$('#best').textContent='BEST '+bestC;if(msg)$('#feedback').textContent=msg;const done=ok+err+miss;$('#fill').style.width=Math.min(100,done/C.goal*100)+'%';$('#progress').textContent=Math.min(done,C.goal)+'/'+C.goal}function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,650)}function zones(){C.zones.forEach((z,i)=>{const e=document.createElement('div');e.className='zone';e.dataset.kind=z[0];e.innerHTML='<div style="font-size:27px">'+z[1]+'</div><div>'+z[2]+'</div>';e.style.left=(2+i*32)+'%';e.style.width='30%';world.appendChild(e)})}async function countdown(){zones();$('#count').style.display='grid';for(const x of ['3','2','1','GO!']){$('#count').textContent=x;await new Promise(r=>setTimeout(r,x==='GO!'?650:520))}$('#count').style.display='none';t0=performance.now();requestAnimationFrame(loop)}function startTouch(){mode='touch';$('#intro').remove();countdown()}async function startHand(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.55});hands.onResults(onHands);mode='hand';$('#intro').remove();track();countdown()}catch(e){alert('เปิด Hand Mode ไม่ได้ กรุณาใช้ HTTPS / Internet / Camera Permission หรือเลือก Touch Mode')}}async function track(){if(ended)return;if(mode==='hand'&&video.readyState>=2&&!busy){busy=true;try{await hands.send({image:video})}catch(e){}busy=false}requestAnimationFrame(track)}function onHands(r){if(!r.multiHandLandmarks?.length){cursor.style.display='none';return}const lm=r.multiHandLandmarks[0],p=lm[8],th=lm[4],R=sr(),x=R.left+(1-p.x)*R.width,y=R.top+p.y*R.height,pinch=Math.hypot(p.x-th.x,p.y-th.y)<.075;cursor.style.display='block';cursor.style.left=x+'px';cursor.style.top=y+'px';interact(x-R.left,y-R.top,pinch)}function spawn(){const d=C.items[Math.floor(Math.random()*C.items.length)],e=document.createElement('div');e.className='obj';e.textContent=d[0];e.style.left=(8+Math.random()*76)+'%';e.style.top='-78px';world.appendChild(e);const o={e,d,y:-78,speed:(bossOn?C.speed*1.42:C.speed)*(.88+Math.random()*.25),hit:false};objs.push(o);if(mode==='touch'){e.onpointerdown=ev=>{drag=o;e.classList.add('grab');e.setPointerCapture(ev.pointerId)};e.onpointermove=ev=>{if(drag===o){const R=sr();e.style.left=(ev.clientX-R.left-35)+'px';e.style.top=(ev.clientY-R.top-35)+'px';hot(ev.clientX,ev.clientY)}};e.onpointerup=()=>{drop(o);e.classList.remove('grab');clear();drag=null}}}function hot(x,y){$$('.zone').forEach(z=>{const r=z.getBoundingClientRect();z.classList.toggle('hot',x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)})}function clear(){$$('.zone').forEach(z=>z.classList.remove('hot'))}function good(o){s+=100;c++;bestC=Math.max(bestC,c);ok++;toast(c>=3?'🔥 COMBO ×'+c:'+100');hud(o.d[2])}function bad(msg){l--;c=0;err++;toast('ลองใหม่');hud(msg);if(l<=0)finish(false)}function drop(o){if(!o||o.hit)return;const r=o.e.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,z=$$('.zone').find(q=>{const a=q.getBoundingClientRect();return cx>=a.left&&cx<=a.right&&cy>=a.top&&cy<=a.bottom});if(!z){hud('ปล่อยวัตถุเหนือพื้นที่เป้าหมาย');snap(o);return}if(z.dataset.kind===o.d[1]){o.hit=true;good(o);setTimeout(()=>remove(o),150)}else{bad('ยังไม่ถูกหมวด');snap(o)}}function snap(o){o.e.style.left=(8+Math.random()*76)+'%';o.e.style.top='22%';o.y=stage.clientHeight*.22}function interact(x,y,pinch){const R=sr();if(pinch&&!drag){drag=objs.find(o=>{const r=o.e.getBoundingClientRect();return !o.hit&&x>=r.left-R.left&&x<=r.right-R.left&&y>=r.top-R.top&&y<=r.bottom-R.top})||null;if(drag)drag.e.classList.add('grab')}if(pinch&&drag){drag.e.style.left=(x-35)+'px';drag.e.style.top=(y-35)+'px';hot(R.left+x,R.top+y)}if(!pinch&&drag){drop(drag);drag.e.classList.remove('grab');clear();drag=null}}function remove(o){o.e.remove();objs=objs.filter(x=>x!==o)}function mission(sec){const idx=sec<C.m2?0:sec<C.m3?1:2;if(idx!==mi){mi=idx;$('#missionTitle').textContent=['MISSION 1 • ฝึกแยกขยะ','MISSION 2 • Mixed Waste','MISSION 3 • Speed Sort'][idx];toast('MISSION '+(idx+1))}}function loop(t){if(ended)return;const sec=(t-t0)/1000;mission(sec);if((ok+err+miss)>=C.goal&&!bossOn){bossOn=true;$('#boss').style.display='block';$('#boss').innerHTML='🚨 FINAL BOSS<br>'+C.boss;$('#missionTitle').textContent='FINAL BOSS — '+C.boss;setTimeout(()=>$('#boss').style.display='none',1700)}if(sec>C.duration)return finish(true);if(t-last>(bossOn?C.spawn*.68:C.spawn)){spawn();last=t}for(const o of [...objs]){if(o===drag)continue;o.y+=o.speed;o.e.style.top=o.y+'px';if(o.y>stage.clientHeight-120){miss++;hud('วัตถุผ่านไป — ลองชิ้นต่อไป');remove(o)}}requestAnimationFrame(loop)}function finish(win){ended=true;stream?.getTracks().forEach(t=>t.stop());const a=ok+err+miss,acc=a?Math.round(ok/a*100):0;document.body.innerHTML='<div style="min-height:100vh;background:#07131e;color:#fff;display:grid;place-items:center;font-family:system-ui;padding:20px;text-align:center"><div><div style="font-size:72px">'+(win?'🏆':'💪')+'</div><h1>'+(win?'ECO HERO':'ฝึกอีกครั้ง')+'</h1><h2>'+s+' คะแนน</h2><p>Accuracy '+acc+'% • Best Combo ×'+bestC+'</p><p>Correct '+ok+' • Miss/Error '+(err+miss)+'</p><button onclick="location.reload()" style="max-width:360px">เล่นอีกครั้ง</button></div></div>'}$('#hand').onclick=startHand;$('#touch').onclick=startTouch;hud();</script></body></html>
