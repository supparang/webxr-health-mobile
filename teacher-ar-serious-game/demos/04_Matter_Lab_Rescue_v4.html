<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Matter Lab Rescue v4</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#07131e;color:#fff}#stage{position:relative;width:100%;height:100%;max-width:920px;margin:auto;overflow:hidden;background:#07131e}#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.76}#shade{position:absolute;inset:0;background:linear-gradient(#00101b66,#00101b08 48%,#00101bb8);pointer-events:none}#world{position:absolute;inset:0;z-index:3}.obj{position:absolute;width:68px;height:68px;border-radius:21px;background:#fffffff3;color:#10243a;display:grid;place-items:center;font-size:35px;box-shadow:0 8px 22px #0006;user-select:none;touch-action:none}.obj.focus{box-shadow:0 0 0 5px #fff,0 0 34px #fff9;transform:scale(1.08)}.zone{position:absolute;bottom:14px;height:92px;border:2px solid #ffffff88;border-radius:20px;background:#0b1e2dd8;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:900}.zone.hot{background:#ffffffe8;color:#10243a;box-shadow:0 0 28px #fff9;transform:translateY(-5px)}#hud{position:absolute;inset:0;z-index:8;padding:12px;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#ffffffe9;color:#10243a;padding:7px 10px;border-radius:999px;font-weight:900}#mission{position:absolute;top:62px;left:12px;right:12px;background:#07131ee2;border:1px solid #ffffff55;border-radius:17px;padding:10px 13px}#bar{height:6px;background:#ffffff30;border-radius:99px;margin-top:8px;overflow:hidden}#fill{height:100%;width:0;background:#fff}#cursor{position:fixed;z-index:30;width:38px;height:38px;border:4px solid white;border-radius:50%;background:conic-gradient(#fff var(--p,0deg),#10243acc 0);transform:translate(-50%,-50%);display:none;pointer-events:none}#cursor:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#10243a}#intro,#count,#boss{position:absolute;inset:0;z-index:25;background:#07131eef;display:grid;place-items:center;padding:20px}.panel{background:#fffffff4;color:#10243a;max-width:610px;width:min(94vw,610px);padding:24px;border-radius:24px;text-align:center}.hero{font-size:62px}button{width:100%;min-height:56px;border:0;border-radius:15px;padding:12px;margin-top:8px;font-size:17px;font-weight:900}.primary{background:#10243a;color:white}.secondary{background:#e7edf3;color:#10243a}#count{display:none;background:#07131e77;font-size:min(30vw,150px);font-weight:1000}#boss{display:none;background:#07131e99;font-size:30px;font-weight:1000;text-align:center;pointer-events:none}#toast{position:absolute;z-index:20;left:50%;top:46%;transform:translate(-50%,-50%);font-size:26px;font-weight:1000;text-shadow:0 4px 14px #000;opacity:0}@media(max-width:600px){.obj{width:60px;height:60px;font-size:30px}.zone{height:82px}.pill{font-size:12px;padding:6px 8px}#mission{top:56px}}</style><body><div id="stage"><video id="cam" autoplay playsinline muted></video><div id="shade"></div><div id="world"></div><div id="hud"><div class="top"><div class="stats"><span class="pill" id="score">⭐ 0</span><span class="pill" id="hearts">❤️❤️❤️</span><span class="pill" id="combo">COMBO ×0</span></div><span class="pill" id="progress">0/8</span></div><div id="mission"><b id="mt">MISSION 1</b><div id="fb">ชี้ค้างบนวัตถุเพื่อหยิบ → พาไปเหนือเป้าหมาย → ค้างเพื่อปล่อย</div><div id="bar"><div id="fill"></div></div></div></div><div id="toast"></div><div id="boss"></div><div id="count"></div><div id="intro"><div class="panel"><div class="hero">🔬</div><h1>Matter Lab Rescue</h1><p>ช่วย Lab ส่งตัวอย่างกลับ SOLID / LIQUID / GAS ก่อนระบบ Overload</p><button id="hand" class="primary">✋ Hand Hover Mode</button><button id="touch" class="secondary">👆 Touch Mode</button><small>v4 ใช้ Hover-to-Grab / Hover-to-Drop ไม่ใช้ Pinch release</small></div></div></div><div id="cursor"></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script>const C={"zones":[{"kind":"solid","icon":"🧊","label":"SOLID"},{"kind":"liquid","icon":"💧","label":"LIQUID"},{"kind":"gas","icon":"💨","label":"GAS"}],"items":[{"icon":"🧊","kind":"solid","ok":"Ice → SOLID","miss":"🧊 Ice หลุดไป — SOLID"},{"icon":"🪨","kind":"solid","ok":"Rock → SOLID","miss":"🪨 Rock หลุดไป — SOLID"},{"icon":"💧","kind":"liquid","ok":"Water → LIQUID","miss":"💧 Water หลุดไป — LIQUID"},{"icon":"💨","kind":"gas","ok":"Steam → GAS","miss":"💨 Steam หลุดไป — GAS"}],"boss":"LAB OVERLOAD","badge":"MATTER SCIENTIST"},PRE=8,BGOAL=8,$=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)],stage=$('#stage'),world=$('#world'),cam=$('#cam'),cursor=$('#cursor');let s=0,l=3,c=0,ok=0,err=0,miss=0,bossOn=false,bok=0,objs=[],carry=null,last=0,mode='touch',stream,hands,busy=false,ended=false,hoverObj=null,hoverObjSince=0,hoverZone=null,hoverZoneSince=0,lastHandAt=0;const sr=()=>stage.getBoundingClientRect(),lane=()=>Math.random()<.5?6+Math.random()*23:69+Math.random()*23;function hud(msg){score.textContent='⭐ '+s;hearts.textContent='❤️'.repeat(l)+'♡'.repeat(3-l);combo.textContent='COMBO ×'+c;progress.textContent=(bossOn?'BOSS ':'')+(bossOn?bok:ok)+'/'+(bossOn?BGOAL:PRE);fill.style.width=Math.min(100,(bossOn?bok/BGOAL:ok/PRE)*100)+'%';if(msg)fb.textContent=msg}function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,600)}function setupZones(){C.zones.forEach((z,i)=>{const e=document.createElement('div');e.className='zone';e.dataset.kind=z.kind;e.innerHTML='<div style="font-size:26px">'+z.icon+'</div><div>'+z.label+'</div>';e.style.left=(2+i*32)+'%';e.style.width='30%';world.appendChild(e)})}function spawn(){const d=C.items[Math.floor(Math.random()*C.items.length)],e=document.createElement('div');e.className='obj';e.textContent=d.icon;e.style.left=lane()+'%';e.style.top='-70px';world.appendChild(e);const o={e,d,y:-70,speed:(bossOn?1.8:1.15)*(.9+Math.random()*.2),hit:false};objs.push(o);if(mode==='touch'){e.onpointerdown=ev=>{carry=o;e.classList.add('focus');e.setPointerCapture(ev.pointerId)};e.onpointermove=ev=>{if(carry===o)moveCarry(ev.clientX-sr().left,ev.clientY-sr().top)};e.onpointerup=()=>touchDrop()}}function moveCarry(x,y){if(!carry)return;carry.e.style.left=(x-34)+'px';carry.e.style.top=(y-34)+'px'}function resetHover(){hoverObj=null;hoverObjSince=0;hoverZone=null;hoverZoneSince=0;cursor.style.setProperty('--p','0deg');$$('.zone').forEach(z=>z.classList.remove('hot'));$$('.obj').forEach(o=>o.classList.remove('focus'))}function pickCarry(o){carry=o;o.e.classList.add('focus');resetHover();fb.textContent='หยิบแล้ว — พาไปค้างเหนือพื้นที่เป้าหมาย'}function releaseTo(z){if(!carry)return;const o=carry;carry=null;o.e.classList.remove('focus');resetHover();if(z.dataset.kind===o.d.kind){o.hit=true;s+=100;c++;ok++;if(bossOn)bok++;toast('+100');fb.textContent=o.d.ok;o.e.remove();objs=objs.filter(x=>x!==o);phase()}else{l--;c=0;err++;fb.textContent='ยังไม่ถูกสถานะ — '+o.d.ok;o.e.style.left=lane()+'%';o.e.style.top='23%';o.y=stage.clientHeight*.23;if(l<=0)finish(false)}hud()}function touchDrop(){if(!carry)return;const r=carry.e.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,z=$$('.zone').find(q=>{const a=q.getBoundingClientRect();return cx>=a.left&&cx<=a.right&&cy>=a.top&&cy<=a.bottom});if(z)releaseTo(z);else{carry.e.classList.remove('focus');carry.e.style.left=lane()+'%';carry.e.style.top='23%';carry.y=stage.clientHeight*.23;carry=null;fb.textContent='ปล่อยเหนือ Portal เป้าหมาย'}}function phase(){if(!bossOn&&ok>=PRE){bossOn=true;bok=0;mt.textContent='FINAL BOSS • '+C.boss;fb.textContent='ทำให้ถูก 8 ตัวอย่างเพื่อผ่าน Boss';boss.style.display='grid';boss.innerHTML='🚨 '+C.boss+'<br><small>BOSS 0/8</small>';setTimeout(()=>boss.style.display='none',1500)}else if(bossOn&&bok>=BGOAL)finish(true)}function hoverLogic(x,y){const R=sr(),now=performance.now();if(carry){moveCarry(x,y);const z=$$('.zone').find(q=>{const a=q.getBoundingClientRect();return R.left+x>=a.left&&R.left+x<=a.right&&R.top+y>=a.top&&R.top+y<=a.bottom});$$('.zone').forEach(q=>q.classList.toggle('hot',q===z));if(z!==hoverZone){hoverZone=z;hoverZoneSince=now;cursor.style.setProperty('--p','0deg')}else if(z){const ratio=Math.min(1,(now-hoverZoneSince)/650);cursor.style.setProperty('--p',(ratio*360)+'deg');if(ratio>=1)releaseTo(z)}return}const o=objs.find(o=>{const q=o.e.getBoundingClientRect();return !o.hit&&x>=q.left-R.left&&x<=q.right-R.left&&y>=q.top-R.top&&y<=q.bottom-R.top});if(o!==hoverObj){if(hoverObj)hoverObj.e.classList.remove('focus');hoverObj=o;hoverObjSince=now;cursor.style.setProperty('--p','0deg');if(o)o.e.classList.add('focus')}else if(o){const ratio=Math.min(1,(now-hoverObjSince)/500);cursor.style.setProperty('--p',(ratio*360)+'deg');if(ratio>=1)pickCarry(o)}}function onHands(r){if(!r.multiHandLandmarks?.length){cursor.style.display='none';if(performance.now()-lastHandAt>1000)resetHover();return}lastHandAt=performance.now();const p=r.multiHandLandmarks[0][8],R=sr(),x=R.left+(1-p.x)*R.width,y=R.top+p.y*R.height;cursor.style.display='block';cursor.style.left=x+'px';cursor.style.top=y+'px';hoverLogic(x-R.left,y-R.top)}async function track(){if(ended)return;if(mode==='hand'&&cam.readyState>=2&&!busy){busy=true;try{await hands.send({image:cam})}catch(e){}busy=false}requestAnimationFrame(track)}function loop(t){if(ended)return;if(t-last>(bossOn?850:1650)){spawn();last=t}for(const o of [...objs]){if(o===carry)continue;o.y+=o.speed;o.e.style.top=o.y+'px';if(o.y>stage.clientHeight-110){miss++;c=0;fb.textContent=o.d.miss||o.d.ok+' • หลุดไป';o.e.remove();objs=objs.filter(x=>x!==o)}}requestAnimationFrame(loop)}async function countdown(){setupZones();count.style.display='grid';for(const x of ['3','2','1','GO!']){count.textContent=x;await new Promise(r=>setTimeout(r,x==='GO!'?600:450))}count.style.display='none';requestAnimationFrame(loop)}function startTouch(){mode='touch';intro.remove();countdown()}async function startHand(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});cam.srcObject=stream;await cam.play();hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.55});hands.onResults(onHands);mode='hand';intro.remove();track();countdown()}catch(e){alert('เปิด Hand Mode ไม่ได้ กรุณาใช้ Touch Mode')}}function finish(win){ended=true;stream?.getTracks().forEach(t=>t.stop());const a=ok+err+miss,acc=a?Math.round(ok/a*100):0;document.body.innerHTML='<div style="min-height:100vh;background:#07131e;color:white;display:grid;place-items:center;font-family:system-ui;text-align:center"><div><div style="font-size:70px">'+(win?'🏆':'💪')+'</div><h1>'+(win?C.badge:'ลองใหม่')+'</h1><h2>'+s+' คะแนน</h2><p>Accuracy '+acc+'% • Correct '+ok+' • Error/Miss '+(err+miss)+'</p><button onclick="location.reload()">เล่นอีกครั้ง</button></div></div>'}hand.onclick=startHand;touch.onclick=startTouch;hud('เตรียมพร้อม');</script></body></html>
