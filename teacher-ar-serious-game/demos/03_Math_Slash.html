<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Math Slash</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#07131e;color:#fff}#stage{position:relative;width:100%;height:100%;max-width:920px;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 20%,#24536b,#07131e 72%)}#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.73}#shade{position:absolute;inset:0;background:linear-gradient(#00101b66,#00101b0b 48%,#00101bb8);z-index:1;pointer-events:none}#world{position:absolute;inset:0;z-index:3}.obj{position:absolute;width:70px;height:70px;border-radius:50%;background:#fffffff4;color:#10243a;display:grid;place-items:center;font-size:24px;font-weight:950;box-shadow:0 9px 24px #0006;touch-action:none;user-select:none;transition:.15s}#hud{position:absolute;inset:0;z-index:8;padding:12px;pointer-events:none}.topbar{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#ffffffe9;color:#10243a;padding:7px 10px;border-radius:999px;font-weight:900;box-shadow:0 3px 12px #0003;font-size:14px}#missionCard{position:absolute;top:62px;left:12px;right:12px;background:#07131ee2;border:1px solid #ffffff55;border-radius:17px;padding:10px 13px;backdrop-filter:blur(8px)}#missionTitle{font-size:16px;font-weight:950}#feedback{font-size:13px;margin-top:3px;opacity:.96}#progressTrack{height:6px;background:#ffffff30;border-radius:99px;margin-top:8px;overflow:hidden}#progressBar{height:100%;width:0;background:#fff;border-radius:99px;transition:.2s}#cursor{position:fixed;z-index:30;width:34px;height:34px;border:4px solid #fff;border-radius:50%;background:#10243ac7;transform:translate(-50%,-50%);display:none;pointer-events:none}#intro,#countdown,#result{position:absolute;inset:0;z-index:25;background:#07131eef;display:grid;place-items:center;padding:20px}.panel{background:#fffffff5;color:#10243a;max-width:610px;width:min(94vw,610px);padding:24px;border-radius:25px;text-align:center;box-shadow:0 16px 50px #0007}.hero{font-size:62px}button{border:0;border-radius:15px;min-height:56px;padding:12px;font-size:17px;font-weight:900;width:100%;margin-top:8px;cursor:pointer}.primary{background:#10243a;color:#fff}.secondary{background:#e7edf3;color:#10243a}#countdown{display:none;background:#07131e77;font-size:min(30vw,150px);font-weight:1000;text-shadow:0 8px 30px #000}#toast{position:absolute;z-index:18;left:50%;top:45%;transform:translate(-50%,-50%);font-size:28px;font-weight:1000;text-shadow:0 4px 15px #000;opacity:0;pointer-events:none}#bossBanner{display:none;position:absolute;z-index:19;left:50%;top:43%;transform:translate(-50%,-50%);background:#fff;color:#10243a;padding:18px 25px;border-radius:20px;font-size:24px;font-weight:1000;text-align:center;box-shadow:0 10px 35px #0008}small{opacity:.72}@media(max-width:600px){.obj{width:62px;height:62px;font-size:22px}.pill{font-size:12px;padding:6px 8px}#missionCard{top:56px}}</style><body><div id="stage"><video id="cam" autoplay playsinline muted></video><div id="shade"></div><div id="world"></div><div id="hud"><div class="topbar"><div class="stats"><span class="pill" id="score">⭐ 0</span><span class="pill" id="hearts">❤️❤️❤️</span><span class="pill" id="combo">COMBO ×0</span><span class="pill" id="best">BEST 0</span></div><span class="pill" id="progress">0/0</span></div><div id="missionCard"><div id="missionTitle">READY</div><div id="feedback">เตรียมพร้อม</div><div id="progressTrack"><div id="progressBar"></div></div></div></div><div id="toast"></div><div id="bossBanner"></div><div id="countdown"></div><div id="intro"><div class="panel"><div class="hero">⚡</div><h1>Math Slash</h1><p>โจทย์เปลี่ยนทุกครั้งที่ตีคำตอบถูก — เตรียมรับ Math Meteor Storm</p><p><b>HAND HIT • DYNAMIC PROBLEMS • SPEED</b></p><button id="startHand" class="primary">✋ เล่นด้วยมือ</button><button id="startTouch" class="secondary">👆 Touch / Mouse สำรอง</button><small>Hand Mode ต้องใช้กล้องและ Internet • แนะนำ HTTPS</small></div></div></div><div id="cursor"></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script>const PRE_GOAL=8,BOSS_GOAL=8,BOSS_NAME="MATH METEOR STORM",BOSS_HINT="ตอบโจทย์ให้ถูก 8 ข้อก่อน Meteor จะเต็มจอ",BADGE="MATH SLASHER",PROBLEMS=[["2 × 4",8,[6,10,12]],["3 × 5",15,[12,18,20]],["4 × 6",24,[20,28,32]],["6 × 7",42,[36,48,49]],["7 × 8",56,[54,48,64]],["8 × 9",72,[63,64,81]],["9 × 6",54,[45,56,63]],["7 × 9",63,[56,72,81]]];const $=q=>document.querySelector(q),stage=$('#stage'),world=$('#world'),cam=$('#cam'),cursor=$('#cursor');let score=0,lives=3,combo=0,best=0,correct=0,wrong=0,miss=0,stream=null,hands=null,busy=false,mode='touch',objs=[],lastSpawn=0,ended=false,boss=false,bossCorrect=0,qIndex=0,current=null;const SR=()=>stage.getBoundingClientRect(),laneX=()=>Math.random()<.5?(6+Math.random()*23):(69+Math.random()*23);function hud(msg,done=0,total=1){$('#score').textContent='⭐ '+score;$('#hearts').textContent='❤️'.repeat(lives)+'♡'.repeat(3-lives);$('#combo').textContent='COMBO ×'+combo;$('#best').textContent='BEST '+best;$('#progress').textContent=(boss?'BOSS ':'')+done+'/'+total;$('#progressBar').style.width=Math.min(100,done/total*100)+'%';if(msg)$('#feedback').textContent=msg}function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,650)}function newQ(){current=PROBLEMS[qIndex%PROBLEMS.length];qIndex++;$('#missionTitle').textContent=(boss?'FINAL BOSS • ':'MISSION • ')+current[0]+' = ?';hud('Hit เฉพาะ '+current[1],boss?bossCorrect:correct,boss?BOSS_GOAL:PRE_GOAL)}function good(){score+=100;combo++;best=Math.max(best,combo);correct++;if(boss)bossCorrect++;toast(combo>=3?'⚡ COMBO ×'+combo:'+100');hud(current[0]+' = '+current[1],boss?bossCorrect:correct,boss?BOSS_GOAL:PRE_GOAL);checkPhase()}function bad(v){lives--;combo=0;wrong++;toast('MISS');hud(v+' ยังไม่ใช่คำตอบของ '+current[0],boss?bossCorrect:correct,boss?BOSS_GOAL:PRE_GOAL);if(lives<=0)finish(false)}function checkPhase(){if(!boss&&correct>=PRE_GOAL){boss=true;bossCorrect=0;$('#bossBanner').style.display='block';$('#bossBanner').innerHTML='🚨 FINAL BOSS<br>'+BOSS_NAME;setTimeout(()=>$('#bossBanner').style.display='none',1700);newQ()}else if(boss&&bossCorrect>=BOSS_GOAL)finish(true)}function removeObj(o){o.e.remove();objs=objs.filter(x=>x!==o)}function spawn(){const vals=[current[1],...current[2]],v=vals[Math.floor(Math.random()*vals.length)],e=document.createElement('div');e.className='obj';e.textContent=v;e.style.left=laneX()+'%';e.style.top='-75px';world.appendChild(e);const o={e,v,y:-75,speed:(boss?3.8:2.8)*(.9+Math.random()*.2),hit:false};objs.push(o);if(mode==='touch')e.onpointerdown=()=>hit(o)}function hit(o){if(!o||o.hit)return;o.hit=true;if(o.v===current[1]){good();removeObj(o);newQ()}else{bad(o.v);removeObj(o)}}function interact(x,y){const R=SR();for(const o of objs){if(o.hit)continue;const r=o.e.getBoundingClientRect();if(x>=r.left-R.left&&x<=r.right-R.left&&y>=r.top-R.top&&y<=r.bottom-R.top){hit(o);break}}}async function count(){$('#countdown').style.display='grid';for(const x of ['3','2','1','GO!']){$('#countdown').textContent=x;await new Promise(r=>setTimeout(r,x==='GO!'?600:480))}$('#countdown').style.display='none';newQ();requestAnimationFrame(loop)}function loop(t){if(ended)return;if(t-lastSpawn>(boss?520:760)){spawn();lastSpawn=t}for(const o of [...objs]){o.y+=o.speed;o.e.style.top=o.y+'px';if(o.y>stage.clientHeight-110){if(o.v===current[1]){miss++;lives--;combo=0;hud('คำตอบ '+current[1]+' หลุดไป!',boss?bossCorrect:correct,boss?BOSS_GOAL:PRE_GOAL);if(lives<=0)return finish(false)}removeObj(o)}}requestAnimationFrame(loop)}function summary(win){ended=true;stream?.getTracks().forEach(t=>t.stop());const a=correct+wrong+miss,acc=a?Math.round(correct/a*100):0;document.body.innerHTML=`<div id="result"><div class="panel"><div class="hero">${win?'🏆':'💪'}</div><h1>${win?BADGE:'ฝึกอีกครั้ง'}</h1><h2>${score} คะแนน</h2><p>Accuracy ${acc}% • Best Combo ×${best}</p><p>Correct ${correct} • Miss/Error ${wrong+miss}</p><button class="primary" onclick="location.reload()">เล่นอีกครั้ง</button></div></div>`}function finish(win){if(!ended)summary(win)}function startTouch(){mode='touch';$('#intro').remove();count()}async function startHand(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});cam.srcObject=stream;await cam.play();hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.55});hands.onResults(r=>{if(!r.multiHandLandmarks?.length){cursor.style.display='none';return}const p=r.multiHandLandmarks[0][8],R=SR(),x=R.left+(1-p.x)*R.width,y=R.top+p.y*R.height;cursor.style.display='block';cursor.style.left=x+'px';cursor.style.top=y+'px';interact(x-R.left,y-R.top)});mode='hand';$('#intro').remove();track();count()}catch(e){alert('เปิด Hand Mode ไม่ได้ กรุณาใช้ HTTPS / Camera Permission หรือ Touch Mode')}}async function track(){if(ended)return;if(mode==='hand'&&cam.readyState>=2&&!busy){busy=true;try{await hands.send({image:cam})}catch(e){}busy=false}requestAnimationFrame(track)}$('#startHand').onclick=startHand;$('#startTouch').onclick=startTouch;hud('เตรียมพร้อม',0,PRE_GOAL);</script></body></html>
