name: Deploy English Week Firebase Production

on:
  push:
    branches:
      - main
    paths:
      - 'english/functions/english-week-teacher.js'
      - 'english/functions/english-week-roster-import.js'
      - 'english/functions/main.js'
      - 'english/functions/package.json'
      - 'english/functions/package-lock.json'
      - 'english/firebase.json'
      - 'english/.firebaserc'
      - 'english-week-firebase-spark/firestore.rules'
      - 'english-week-firebase-spark/firebase.json'
      - '.github/workflows/english-week-firebase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-week-firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENGLISHWEEK_95869 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing repository secret: FIREBASE_SERVICE_ACCOUNT_ENGLISHWEEK_95869"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install function dependencies
        working-directory: english/functions
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Validate English Week production syntax
        working-directory: english/functions
        run: |
          npm run lint
          node --check english-week-teacher.js
          node --check english-week-roster-import.js
          node --check main.js

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy English Week admin authorities
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy \
            --config english/firebase.json \
            --project englishweek-95869 \
            --only functions:english \
            --non-interactive

      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy \
            --config english-week-firebase-spark/firebase.json \
            --project englishweek-95869 \
            --only firestore:rules \
            --non-interactive

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Grant public invoker to English Week admin authorities
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project englishweek-95869
          for FN in englishWeekTeacher englishWeekRosterImport; do
            gcloud functions add-invoker-policy-binding "$FN" \
              --gen2 \
              --region=asia-southeast1 \
              --member=allUsers
          done

      - name: Print production endpoints
        run: |
          echo "Teacher: https://asia-southeast1-englishweek-95869.cloudfunctions.net/englishWeekTeacher"
          echo "Roster Import: https://asia-southeast1-englishweek-95869.cloudfunctions.net/englishWeekRosterImport"
          echo "Firestore project: englishweek-95869"
