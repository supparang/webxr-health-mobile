name: Deploy English Week Firebase Authority

on:
  push:
    branches:
      - main
    paths:
      - 'english/functions/english-week-authority.js'
      - 'english/functions/english-week-assessment-checkpoint.js'
      - 'english/functions/main.js'
      - 'english/functions/package.json'
      - 'english/functions/package-lock.json'
      - 'english/firebase.json'
      - '.github/workflows/english-week-firebase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-week-firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENGLISH_D4BFA }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing repository secret: FIREBASE_SERVICE_ACCOUNT_ENGLISH_D4BFA"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install function dependencies
        working-directory: english/functions
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Validate English Week function syntax
        working-directory: english/functions
        run: |
          npm run lint
          node --check english-week-assessment-checkpoint.js

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy authority and checkpoint functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy \
            --config english/firebase.json \
            --project english-d4bfa \
            --only functions:englishWeekAuthority,functions:englishWeekAssessmentCheckpoint \
            --non-interactive

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Grant public invoker to English Week functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project english-d4bfa

          gcloud functions add-invoker-policy-binding englishWeekAuthority \
            --gen2 \
            --region=asia-southeast1 \
            --member=allUsers

          gcloud functions add-invoker-policy-binding englishWeekAssessmentCheckpoint \
            --gen2 \
            --region=asia-southeast1 \
            --member=allUsers

      - name: Print production endpoints
        run: |
          echo "Authority: https://asia-southeast1-english-d4bfa.cloudfunctions.net/englishWeekAuthority"
          echo "Checkpoint: https://asia-southeast1-english-d4bfa.cloudfunctions.net/englishWeekAssessmentCheckpoint"
