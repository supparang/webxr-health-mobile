name: English Week Passport QA

on:
  push:
    paths:
      - 'english-week-passport/**'
      - 'english/functions/**'
      - 'english/firebase.json'
      - 'english/.firebaserc'
      - '.github/workflows/english-week-passport-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check rotation, games and Firebase authority
        run: |
          node --check english-week-passport/passport-rotation-v2.js
          node --check english-week-passport/firebase-authority-bridge.js
          node --check english-week-passport/firebase-authority-ui-patch.js
          node --check english-week-passport/passport-canonical-routes-v1.js
          node --check english-week-passport/passport-route-loader.js
          node --check english-week-passport/lexicon-lens-hunt.js
          node --check english-week-passport/lexicon-x-engine-v1.js
          node --check english-week-passport/lexicon-x-engine-v5.js
          node --check english-week-passport/lexicon-x-polish-v6.js
          node --check english-week-passport/lexicon-x-v7-core.js
          node --check english-week-passport/lexicon-x-v7-navigation.js
          node --check english-week-passport/lexicon-x-slow-confirm-loader-v62.js
          node --check english-week-passport/word-match-route.js
          node --check english-week-passport/category-rotation-v4.js
          node --check english-week-passport/category-forest-v5.js
          node --check english-week-passport/category-forest-v5-part1.js
          node --check english-week-passport/category-forest-v5-part2.js
          node --check english-week-passport/category-forest-v5-part3.js
          node --check english-week-passport/category-forest-v5-part4.js
          node --check english-week-passport/category-ar-route.js
          node --check english-week-passport/sentence-city-v3.js
          node --check english-week-passport/sentence-city-ar-v4-activation.js
          node --check english-week-passport/sentence-city-ar-v4.js
          node --check english-week-passport/sentence-hand-rotation-v2.js
          node --check english-week-passport/action-rotation-v5.js
          node --check english-week-passport/action-detective-loader.js
          node --check english/functions/main.js
          node --check english/functions/english-week-authority.js

      - name: Run passport rotation contract
        run: node english-week-passport/tests/passport-rotation-v2.node.cjs

      - name: Run Category Forest V5 seeded contract
        run: node english-week-passport/tests/category-forest-v5.node.cjs

      - name: Run Sentence City V3 gameplay contract
        run: node english-week-passport/tests/sentence-city-v3.node.cjs

      - name: Run Sentence City AR Hand Detect V4 contract
        run: node english-week-passport/tests/sentence-city-ar-v4.node.cjs

      - name: Run Firebase authority integration contract
        run: node english-week-passport/tests/firebase-authority-v1.node.cjs
