name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Apply Champion Arena mobile safeguards
        run: |
          python - <<'PY'
          from pathlib import Path

          # Preserve the earlier V2.2 mobile-layout compatibility route.
          game = Path('english-week-passport/english-champion-arena-v1.html')
          if game.exists():
              html = game.read_text(encoding='utf-8')
              css_link = '<link rel="stylesheet" href="./champion-command-camera-layout-v21.css?v=20260806-intro-camera-v22">'
              if 'champion-command-camera-layout-v21.css' not in html:
                  html = html.replace('</head>', f'{css_link}\n</head>')
              html = html.replace('Champion Command Arena • Final Boss V2', 'Champion Command Arena • Final Boss V2.2')
              html = html.replace('LEXICON X • 5 GATES + 1 BOSS • V2', 'LEXICON X • 5 GATES + 1 BOSS • V2.2')
              game.write_text(html, encoding='utf-8')

          # V3 final-flow safeguards and player-facing naming.
          game_v3 = Path('english-week-passport/english-champion-arena-v3.html')
          if game_v3.exists():
              html = game_v3.read_text(encoding='utf-8')
              old = "function stageEnergy(){if(state.stage<5)return Math.max(25,100-state.stage*15);return 25}"
              new = "function stageEnergy(){if(state.stage<5)return Math.max(25,100-state.stage*15);if(state.stage===5)return 25;return 0}"
              html = html.replace(old, new)
              html = html.replace('Champion Command Arena • 5 Gates + 1 Boss V3', 'LEXICON Champion Arena • 5 Gates + 1 Boss V3')
              html = html.replace('<b>Champion Command Arena</b>', '<b>LEXICON Champion Arena</b>')
              html = html.replace('<h1>Champion Command Arena</h1>', '<h1>LEXICON Champion Arena</h1>')
              html = html.replace('Enter Champion Arena', 'Enter LEXICON Arena')
              game_v3.write_text(html, encoding='utf-8')

          # Return from Conversation Quest to the renamed, cache-busted hub.
          conversation_js = Path('english-week-passport/conversation-quest-ar-v243.js')
          if conversation_js.exists():
              js = conversation_js.read_text(encoding='utf-8')
              js = js.replace('game-test-hub.html?v=20260806-cq-v243-final-reliability', 'game-test-hub.html?v=20260806-name-alignment')
              conversation_js.write_text(js, encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
