name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Apply Champion Command V2.2 mobile layouts
        run: |
          python - <<'PY'
          from pathlib import Path

          game = Path('english-week-passport/english-champion-arena-v1.html')
          html = game.read_text(encoding='utf-8')
          css_link = '<link rel="stylesheet" href="./champion-command-camera-layout-v21.css?v=20260806-intro-camera-v22">'
          if 'champion-command-camera-layout-v21.css' not in html:
              html = html.replace('</head>', f'{css_link}\n</head>')
          html = html.replace('Champion Command Arena • Final Boss V2', 'Champion Command Arena • Final Boss V2.2')
          html = html.replace('LEXICON X • 5 GATES + 1 BOSS • V2', 'LEXICON X • 5 GATES + 1 BOSS • V2.2')
          game.write_text(html, encoding='utf-8')

          hub = Path('english-week-passport/game-test-hub.html')
          if hub.exists():
              hub_html = hub.read_text(encoding='utf-8')
              hub_html = hub_html.replace('Champion Command Arena V2', 'Champion Command Arena V2.2')
              hub_html = hub_html.replace('V2 QA', 'V2.2 QA')
              hub_html = hub_html.replace('v=20260806-champion-command-v2', 'v=20260806-intro-camera-v22')
              hub.write_text(hub_html, encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
