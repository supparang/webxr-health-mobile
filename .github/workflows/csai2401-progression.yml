name: CSAI2401 Progression Regression

on:
  pull_request:
    paths:
      - 'csai2104/**'
      - '.github/workflows/csai2401-progression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate course content, progression, replay, and boss gates
        run: node --test csai2104/tests/*.test.cjs
