name: ACTIVA-AI CI

on:
  push:
    paths:
      - "ACTIVA-AI/**"
      - ".github/workflows/activa-ai-ci.yml"
  pull_request:
    paths:
      - "ACTIVA-AI/**"
      - ".github/workflows/activa-ai-ci.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: activa_ai
          POSTGRES_USER: activa
          POSTGRES_PASSWORD: ci-disposable-postgres-16
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U activa -d activa_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ACTIVA-AI

    env:
      DATABASE_URL: postgresql://activa:ci-disposable-postgres-16@127.0.0.1:5432/activa_ai?schema=public
      QR_SIGNING_SECRET: ci-secret-for-activa-ai-qr-signing-123456
      QR_TOKEN_TTL_SECONDS: "120"
      RESEARCH_HASH_SALT: ci-research-hash-salt-not-for-production
      RULE_VERSION: ACTIVA-RULES-CI
      ALLOW_SYNTHETIC_CI: "true"
      PORT: "3000"
      ALLOWED_ORIGINS: "https://pilot.example.test"
      ACTIVA_AUTH_MODE: "DEMO_HEADER"
      ACTIVA_DEPLOYMENT_TIER: "STAGING"
      ACTIVA_PRODUCTION_GO_ENABLED: "false"
      ACTIVA_TEST_DATABASE_ONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy migrations to fresh PostgreSQL and check repeatability
        run: |
          npm run prisma:deploy
          npm run prisma:deploy
          npm run prisma:status
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Verify empty database and first-admin provisioning
        run: node tests/bootstrap-database.mjs

      - name: Seed demo data
        run: node prisma/seed.js

      - name: JavaScript syntax checks
        run: |
          node --check runtime-config.js
          node --check app.js
          node --check demo-api.js
          node --check server/index.js
          node --check server/auth.js
          node --check server/db.js
          node --check server/deployment-config.js
          node --check server/evidence.js
          node --check server/qr.js
          node --check prisma/seed.js
          node --check tests/smoke.mjs
          node --check tests/demo-release-guard.mjs
          node --check tests/auth-readiness.mjs
          node --check scripts/verify-production.mjs
          node --check tests/production-verifier.mjs
          node --check scripts/verify-recovery-database.mjs
          node --check tests/recovery-verifier.mjs
          node --check scripts/validate-phase3-dataset.mjs
          node --check tests/phase3-dataset-readiness.mjs
          node --check tests/blind-review.mjs
          node --check blind-review.js

      - name: Authentication readiness guard
        run: |
          npm run test:auth
          npm run test:frontend-auth
          npm run test:deployment
          node tests/bootstrap-admin.mjs

      - name: Production monitor validation guard
        run: npm run test:production-monitor

      - name: Neon recovery verifier guard
        run: npm run test:recovery-verifier

      - name: Phase 3 dataset research-readiness guard
        run: npm run test:phase3-readiness

      - name: Build production container
        run: |
          docker build --target migrate -t activa-ai-migrate-ci .
          docker build --target runtime -t activa-ai-v1.0.15-ci .
          docker run --rm --network host -e DATABASE_URL activa-ai-migrate-ci

      - name: Verify production container with Google OIDC configured and GO disabled
        run: |
          # Disposable CI fixtures only; real staging secrets come from its secret store.
          docker run --detach --name activa-ai-pilot-ci --network host \
            -e DATABASE_URL -e PORT=3001 -e ACTIVA_AUTH_MODE=GOOGLE_OIDC \
            -e ACTIVA_DEPLOYMENT_TIER=STAGING \
            -e GOOGLE_CLIENT_ID=517090311491-u00q8g6aonuj2251ak7erqcose70gg2h.apps.googleusercontent.com \
            -e GOOGLE_ALLOWED_DOMAINS=chandra.ac.th \
            -e ALLOWED_ORIGINS=https://supparang.github.io \
            -e ACTIVA_PRODUCTION_GO_ENABLED=false \
            -e QR_SIGNING_SECRET=5e6c9d8a5e6c9d8a5e6c9d8a5e6c9d8a5e6c9d8a5e6c9d8a5e6c9d8a5e6c9d8a \
            -e RESEARCH_HASH_SALT=7a3f4b2c7a3f4b2c7a3f4b2c7a3f4b2c7a3f4b2c7a3f4b2c7a3f4b2c7a3f4b2c \
            activa-ai-v1.0.15-ci
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          node tests/pilot-http.mjs

      - name: Verify blind-review assets in production runtime
        run: |
          curl -fsS http://127.0.0.1:3001/blind-review | grep -q "Independent Ground Truth Review"
          curl -fsS http://127.0.0.1:3001/blind-review.js | grep -q "EXTERNAL BLIND REVIEW"

      - name: Start ACTIVA-AI server
        run: |
          node server/index.js > /tmp/activa-ai.log 2>&1 &
          echo $! > /tmp/activa-ai.pid

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/activa-ai.log
          exit 1

      - name: End-to-end research workflow smoke test
        run: node tests/smoke.mjs

      - name: External blind reviewer end-to-end test
        run: node tests/blind-review.mjs

      - name: Demo release guard regression test
        run: node tests/demo-release-guard.mjs

      - name: Setup Python for ML pipeline
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML test dependencies
        run: pip install -r ml/requirements.txt

      - name: Phase 3 sample-size planner tool check
        run: python ml/tests/check_phase3_sample_planner.py

      - name: Phase 3 final-test firewall check
        run: python ml/tests/check_phase3_final_test_firewall.py

      - name: Generate synthetic CI dataset
        run: python ml/tests/generate_synthetic_ci.py

      - name: ML pipeline software smoke test
        run: >-
          python ml/train_baselines.py
          --input ml/tests/synthetic_locked_dataset.json
          --output-dir ml/tests/out
          --bootstrap 30
          --model-version ACTIVA-CI-PY-001
          --data-provenance SYNTHETIC_CI_ONLY

      - name: Offline prediction bundle smoke test
        run: >-
          python ml/predict_records.py
          --input ml/tests/synthetic_locked_dataset.json
          --model ml/tests/out/activa_ai_model.joblib
          --manifest ml/tests/out/model_manifest.json
          --output ml/tests/out/prediction_bundle.json

      - name: Validate prediction bundle
        run: python ml/tests/check_prediction_bundle.py

      - name: Show server log on failure
        if: failure()
        run: |
          cat /tmp/activa-ai.log || true
          docker logs activa-ai-pilot-ci || true

      - name: Stop pilot test container
        if: always()
        run: docker rm -f activa-ai-pilot-ci || true
