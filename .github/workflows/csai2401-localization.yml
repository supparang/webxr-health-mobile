name: CSAI2401 Thai-first Production QA

on:
  pull_request:
    paths:
      - 'csai2104/**'
      - '.github/workflows/csai2401-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Thai-first screens and legacy progress compatibility
        run: node --test csai2104/tests/localization-live.test.cjs
