d #4e60ae;background:#18235e}.stat small{display:block;color:#adb8e9}.stat b{font-size:1.35rem}.sky{position:relative;border-radius:16px;border:1px solid #4659a4;background:#0e1748;overflow:hidden}.buildings{position:absolute;inset:auto 12px 12px;display:flex;align-items:flex-end;gap:7px;height:70px}.building{flex:1;height:var(--h);border:1px solid #4e62b1;background:repeating-linear-gradient(90deg,#263574 0 8px,#19275f 8px 14px);transition:.35s}.building.lit{background:repeating-linear-gradient(90deg,#ffd56a 0 8px,#5d467e 8px 14px);box-shadow:0 0 18px #ffd56a}.road{position:absolute;left:0;right:0;bottom:8px;border-top:4px solid #8092e7}.mission{display:grid;grid-template-rows:auto minmax(220px,38vh) auto auto auto;gap:12px;min-height:0}.prompt{display:grid;grid-template-columns:50px 1fr;align-items:center;gap:8px}.prompt .visual{font-size:2.2rem}.prompt h3{margin:0;text-align:center;font-size:clamp(1rem,2.4vw,1.35rem)}.camera{position:relative;min-height:220px;border:3px solid #5ae4ff;border-radius:18px;overflow:hidden;background:#05081b}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.status{position:absolute;left:12px;right:12px;bottom:10px;padding:12px;border-radius:14px;background:rgba(8,13,42,.88);text-align:center;font-weight:900}.status small{display:block;color:#ced6ff;margin-top:3px}.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:8;padding:12px 18px;border-radius:999px;background:#ffd35f;color:#1b1740;font-weight:1000;font-size:1.05rem;box-shadow:0 8px 28px #0008;opacity:0;transition:.18s}.toast.show{opacity:1}.board{display:grid;gap:12px}.label{text-align:center;font-size:.78rem;font-weight:950;color:#bdc7f3}.slots,.depot{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.slot,.word,.control{min-height:74px;min-width:150px;padding:14px 20px;border-radius:20px;font-size:1.08rem;font-weight:1000;border:3px solid #8294ed;background:#fff;color:#111630}.slot{background:#17225b;color:#fff;border-style:dashed}.slot.filled{background:#fff3ba;color:#211a38;border-style:solid}.word.selected{background:#ffd65e;transform:scale(1.06);box-shadow:0 0 24px #ffd65e}.word.used{opacity:.25}.focus{outline:8px solid rgba(255,217,82,.42);box-shadow:0 0 0 15px rgba(255,217,82,.18),0 0 28px #ffd952;transform:scale(1.07)}.control{width:100%;background:linear-gradient(135deg,#5de2ff,#9f84ff);border:0}.feedback{text-align:center;padding:12px;border-radius:14px;background:#1a286b;font-weight:900}.feedback.good{color:#7fffc8}.feedback.bad{color:#ff9ca8}#pointer{position:fixed;z-index:9999;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;border:5px solid #ffe156;background:#ffe15644;box-shadow:0 0 20px #ffe156;pointer-events:none}#pointer.pinch{scale:.7}#carry{position:fixed;z-index:9998;pointer-events:none;padding:12px 18px;border-radius:16px;background:#ffd65e;color:#171331;font-weight:1000;box-shadow:0 8px 24px #0008;display:none}.summary-sky{height:180px;position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(#172760,#34286b 55%,#10183d);border:1px solid #596ab6}.summary-sky:before{content:"✦  ·  ✧  ·  ✦  ·  ✧  ·  ✦";position:absolute;left:0;right:0;top:18px;color:#dbe5ff;letter-spacing:20px}.summary-buildings{position:absolute;left:18px;right:18px;bottom:18px;height:115px;display:flex;align-items:flex-end;gap:8px}.summary-building{flex:1;height:var(--h);border:1px solid #ffd76e;background:repeating-linear-gradient(90deg,#ffd76e 0 8px,#6b4e8b 8px 14px);box-shadow:0 0 16px #ffd76e88}.summary-grid,.analytics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.analytics-grid .stat{text-align:left}.banner{padding:12px;border-radius:999px;font-weight:1000}.banner.perfect{background:linear-gradient(90deg,#ffd760,#ffb24d);color:#251600}.banner.rescue{background:linear-gradient(90deg,#8ad8ff,#7ff0ca);color:#102238}@media(max-width:720px){.panel{padding:8px}.mission{grid-template-rows:auto minmax(240px,40vh) auto auto auto}.camera{min-height:240px}.slot,.word{min-width:132px;min-height:72px;padding:13px 15px}.game{grid-template-rows:auto auto 80px minmax(0,1fr)}}

<body>
<div class="app"><header class="top"><button id="back">←</button><div class="brand"><strong>Sentence City</strong><small>LEXICON X • GAME 3 • Final Polish V5.4</small></div><button id="sound">🔊</button></header><main id="screen" class="screen"></main></div><div id="pointer" hidden></div><div id="carry"></div>
<script type="module">
const MAIN_TASKS=[
{id:'s1',kind:'Fill the Gap',level:'A2',visual:'💧',prompt:'Students should ___ enough water during hot weather.',tokens:['drink','repair','borrow','paint'],answer:['drink']},
{id:'s2',kind:'Word Order',level:'A2',visual:'🔒',prompt:'Build the correct instruction.',tokens:['your password','Please','private','keep'],answer:['Please','keep','your password','private']},
{id:'s3',kind:'Repair',level:'A2',visual:'♻️',prompt:'Repair the sentence about plastic waste.',tokens:['We','should','reduce','plastic waste'],answer:['We','should','reduce','plastic waste']},
{id:'s4',kind:'Fill the Gap',level:'A2+',visual:'🚸',prompt:'Always ___ both sides before crossing the road.',tokens:['check','cook','collect','design'],answer:['check']},
{id:'s5',kind:'Word Order',level:'A2+',visual:'🏫',prompt:'Build the sentence about English Week.',tokens:['starts','English Week','on Monday'],answer:['English Week','starts','on Monday']},
{id:'s6',kind:'Context',level:'A2+',visual:'🧳',prompt:'Complete the travel instruction.',tokens:['Keep','your ticket','in a safe place'],answer:['Keep','your ticket','in a safe place']},
{id:'s7',kind:'Fill the Gap',level:'B1',visual:'📝',prompt:'You need to ___ the application form before Friday.',tokens:['submit','climb','mix','throw'],answer:['submit']},
{id:'s8',kind:'Word Order',level:'B1',visual:'🏛️',prompt:'Build the museum tour sentence.',tokens:['at 10 a.m.','the museum tour','will begin','The guide'],answer:['The guide','will begin','the museum tour','at 10 a.m.']},
{id:'s9',kind:'Repair',level:'B1+',visual:'📚',prompt:'Repair the vocabulary practice sentence.',tokens:['This app','helps students','practice','new vocabulary'],answer:['This app','helps students','practice','new vocabulary']},
{id:'s10',kind:'Context',level:'B1+',visual:'🎯',prompt:'Build a recommendation based on evidence.',tokens:['Based on the survey results','the school should','extend the activity','next year'],answer:['Based on the survey results','the school should','extend the activity','next year']}
];
const MP={module:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs',wasm:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm',model:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'};
const screen=document.getElementById('screen'),pointer=document.getElementById('pointer'),carry=document.getElementById('carry');
const S={phase:'main',tasks:MAIN_TASKS,index:0,score:0,combo:0,best:0,first:0,attempts:0,placed:[],selected:null,sound:true,stream:null,detector:null,lastVideo:-1,lastPinch:false,lastAction:0,raf:0,started:0,taskStarted:0,hover:null,hoverSince:0,missed:new Map(),rescued:0,pinchCount:0,dwellCount:0,targetMisses:0,handLosses:0,handVisible:false,decisions:[],pickCount:0,placeCount:0};
const shell=html=>screen.innerHTML=`<section class="panel">${html}</section>`;
function intro(){shell(`<div class="intro"><div class="mark">🏙️✋</div><h1>Sentence City</h1><h2>AR Skyline • Final Polish V5.4</h2><p>สร้างเมืองด้วยประโยค และช่วยซ่อมประโยคที่พลาดจนเชี่ยวชาญ</p><div class="notice"><strong>วิธีเล่น</strong><br>ชี้คำให้กรอบเหลืองขึ้น → จีบเบา ๆ หรือค้าง 0.8 วินาที → ชี้ช่อง → จีบเพื่อวาง</div><div class="actions"><button id="start" class="btn primary">Start AR Mission</button><button id="home" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('start').onclick=start;document.getElementById('home').onclick=goBack}
async function start(){const b=document.getElementById('start');b.disabled=true;b.textContent='กำลังเปิดกล้อง…';try{await openCamera();Object.assign(S,{phase:'main',tasks:MAIN_TASKS,index:0,score:0,combo:0,best:0,first:0,attempts:0,started:Date.now(),taskStarted:0,lastVideo:-1,lastPinch:false,selected:null,missed:new Map(),rescued:0,pinchCount:0,dwellCount:0,targetMisses:0,handLosses:0,handVisible:false,decisions:[],pickCount:0,placeCount:0});renderGame();showTask();loop()}catch(error){console.error(error);b.disabled=false;b.textContent='Retry AR Mission';document.querySelector('.notice').textContent=`เปิด AR ไม่สำเร็จ: ${String(error.message||error)}`}}
async function openCamera(){if(!navigator.mediaDevices?.getUserMedia)throw Error('CAMERA_NOT_SUPPORTED');S.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}}});const vision=await import(MP.module);const files=await vision.FilesetResolver.forVisionTasks(MP.wasm);const opt=delegate=>({baseOptions:{modelAssetPath:MP.model,delegate},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.38,minHandPresenceConfidence:.36,minTrackingConfidence:.36});try{S.detector=await vision.HandLandmarker.createFromOptions(files,opt('GPU'))}catch(error){console.warn('GPU unavailable; using CPU',error);S.detector=await vision.HandLandmarker.createFromOptions(files,opt('CPU'))}}
function renderGame(){shell(`<div class="game"><div class="head"><span id="mode" class="chip">AR EASY</span><strong>Skyline Builder Mission</strong><span class="chip">V5.4</span></div><div class="stats"><div class="stat"><small id="progressLabel">BUILDING</small><b id="progress">1 / 10</b></div><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>COMBO</small><b id="combo">×1</b></div></div><div class="sky"><div class="buildings">${[30,42,35,50,39,56,44,61,52,66].map((height,index)=>`<i class="building" data-b="${index}" style="--h:${height}px"></i>`).join('')}</div><div class="road"></div></div><section id="mission" class="mission"></section></div>`)}
function current(){return S.tasks[S.index]}
function showTask(){if(S.index>=S.tasks.length){if(S.phase==='main'&&S.missed.size)return beginRescue();return finish()}const task=current();S.placed=Array(task.answer.length).fill(null);S.selected=null;S.attempts=0;S.hover=null;S.taskStarted=performance.now();carry.style.display='none';document.getElementById('mission').innerHTML=`<div class="prompt"><span class="visual">${task.visual}</span><h3>${task.prompt}</h3></div><div class="camera"><video id="video" autoplay muted playsinline></video><div id="toast" class="toast"></div><div id="status" class="status">กำลังค้นหามือ…<small>เป้าหมายใหญ่และรองรับ Easy-Pinch</small></div></div><div class="board"><div class="label">SENTENCE BLUEPRINT</div><div id="slots" class="slots"></div><div class="label">WORD DEPOT</div><div id="depot" class="depot"></div><button id="check" class="control ar-target">Build Sentence</button></div><div id="feedback" class="feedback">${S.phase==='rescue'?'CITY REPAIR CREW':'ภารกิจ'} ${S.index+1}/${S.tasks.length} • ${task.kind} • CEFR ${task.level}</div>`;const video=document.getElementById('video');video.srcObject=S.stream;video.play().catch(()=>{});renderBoard();speak(task.prompt.replace('___','blank'));updateHud()}
function renderBoard(){const task=current(),slots=document.getElementById('slots'),depot=document.getElementById('depot');slots.innerHTML=S.placed.map((value,index)=>`<button class="slot ar-target${value?' filled':''}" data-slot="${index}">${value||'วางคำ'}</button>`).join('');const used=new Set(S.placed.filter(Boolean));depot.innerHTML=task.tokens.map((value,index)=>`<button class="word ar-target${used.has(value)?' used':''}${S.selected===value?' selected':''}" data-word="${index}">${value}</button>`).join('')}
function showToast(text){const el=document.getElementById('toast');if(!el)return;el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),900)}
function chirp(freq=650){try{const A=window.AudioContext||window.webkitAudioContext;const ctx=new A(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(.06,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.09);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.1)}catch(error){}}
function activate(el,source='pinch'){if(!el){S.targetMisses++;return}const task=current();if(el.dataset.word!=null){const word=task.tokens[Number(el.dataset.word)];if(S.placed.includes(word))return;S.selected=word;S.pickCount++;showToast(`หยิบแล้ว: ${word}`);feedback(`กำลังถือ “${word}” • ชี้ช่องแล้วจีบเพื่อวาง`);carry.textContent=word;carry.style.display='block';chirp(760);navigator.vibrate?.(35);renderBoard()}else if(el.dataset.slot!=null){const index=Number(el.dataset.slot);if(S.selected){const word=S.selected;S.placed[index]=word;S.selected=null;S.placeCount++;carry.style.display='none';showToast(`วางแล้ว: ${word}`);feedback('วางคำแล้ว • เลือกคำถัดไป');chirp(520);navigator.vibrate?.([25,25,25]);renderBoard()}else if(S.placed[index]){S.selected=S.placed[index];S.placed[index]=null;carry.textContent=S.selected;carry.style.display='block';feedback(`ยก “${S.selected}” ออกแล้ว • ชี้ช่องใหม่`);renderBoard()}}else if(el.id==='check')checkAnswer();if(source==='dwell')S.dwellCount++;else S.pinchCount++}
function checkAnswer(){const task=current();if(S.placed.some(value=>!value))return feedback('ยังวางคำไม่ครบทุกช่อง','bad');S.attempts++;const correct=normalize(S.placed)===normalize(task.answer);S.decisions.push(Math.round(performance.now()-S.taskStarted));if(!correct){S.combo=0;if(S.phase==='main')S.missed.set(task.id,task);feedback('โครงสร้างยังไม่ถูกต้อง • ลองยกและสลับบล็อก','bad');updateHud();return}if(S.phase==='main'&&S.attempts===1)S.first++;if(S.phase==='rescue')S.rescued++;S.combo++;S.best=Math.max(S.best,S.combo);S.score+=S.phase==='rescue'?80:150+(S.combo-1)*20;if(S.phase==='main')document.querySelector(`[data-b="${S.index}"]`)?.classList.add('lit');feedback('✓ Sentence complete! อาคารเปิดไฟแล้ว','good');speak(task.answer.join(' '));updateHud();setTimeout(()=>{S.index++;showTask()},950)}
function beginRescue(){S.phase='rescue';S.tasks=[...S.missed.values()];S.index=0;S.combo=0;const mode=document.getElementById('mode');mode.textContent='REPAIR';mode.className='chip rescue';document.getElementById('progressLabel').textContent='REPAIR';showTask()}
function normalize(values){return values.join(' ').replace(/[?.!,]/g,'').replace(/\s+/g,' ').trim().toLowerCase()}
function feedback(text,type=''){const el=document.getElementById('feedback');if(el){el.textContent=text;el.className=`feedback ${type}`}}
function updateHud(){const total=S.tasks.length;document.getElementById('progress').textContent=`${Math.min(S.index+1,total)} / ${total}`;document.getElementById('score').textContent=S.score;document.getElementById('combo').textContent=`×${Math.max(1,S.combo)}`}
function speak(text){if(!S.sound||!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.84;window.speechSynthesis.speak(u)}
function nearestTarget(x,y){const direct=document.elementFromPoint(x,y)?.closest('.ar-target:not(.used)');if(direct)return direct;let best=null,bestDistance=86;document.querySelectorAll('.ar-target:not(.used)').forEach(el=>{const r=el.getBoundingClientRect(),cx=Math.max(r.left,Math.min(x,r.right)),cy=Math.max(r.top,Math.min(y,r.bottom)),d=Math.hypot(x-cx,y-cy);if(d<bestDistance){bestDistance=d;best=el}});return best}
function loop(){const video=document.getElementById('video');if(video&&video.readyState>=2&&video.currentTime!==S.lastVideo){S.lastVideo=video.currentTime;const result=S.detector.detectForVideo(video,performance.now()),hand=result.landmarks?.[0];if(hand){if(!S.handVisible)S.handVisible=true;const tip=hand[8],thumb=hand[4],x=(1-tip.x)*innerWidth,y=tip.y*innerHeight;pointer.hidden=false;pointer.style.left=`${x-28}px`;pointer.style.top=`${y-28}px`;carry.style.left=`${x+28}px`;carry.style.top=`${y-10}px`;document.querySelectorAll('.focus').forEach(el=>el.classList.remove('focus'));const target=nearestTarget(x,y);target?.classList.add('focus');if(target!==S.hover){S.hover=target;S.hoverSince=performance.now()}const gap=Math.hypot(tip.x-thumb.x,tip.y-thumb.y),pinch=S.lastPinch?gap<.10:gap<.075;pointer.classList.toggle('pinch',pinch);const status=document.getElementById('status');if(status)status.innerHTML=S.selected?`กำลังถือ “${S.selected}”<small>ชี้ช่องแล้วจีบเพื่อวาง</small>`:target?`เล็งที่ “${target.textContent.trim()}”<small>จีบเบา ๆ หรือชี้ค้าง 0.8 วินาที</small>`:'ขยับนิ้วไปยังคำหรือช่อง<small>เขตจับขยายรอบเป้าหมายแล้ว</small>';const now=performance.now();if(pinch&&!S.lastPinch&&now-S.lastAction>420){S.lastAction=now;activate(target,'pinch')}else if(target&&now-S.hoverSince>800&&now-S.lastAction>900){S.lastAction=now;S.hoverSince=now;activate(target,'dwell')}S.lastPinch=pinch}else{if(S.handVisible){S.handVisible=false;S.handLosses++}pointer.hidden=true;S.lastPinch=false;S.hover=null;const status=document.getElementById('status');if(status)status.innerHTML='ยังไม่พบมือ<small>ยกมือให้เห็นนิ้วชี้และนิ้วโป้ง</small>'}}S.raf=requestAnimationFrame(loop)}
function stopCamera(){cancelAnimationFrame(S.raf);S.stream?.getTracks?.().forEach(track=>track.stop());try{S.detector?.close?.()}catch(error){}S.stream=null;S.detector=null;pointer.hidden=true;carry.style.display='none'}
function finish(){stopCamera();const firstAccuracy=Math.round(S.first/MAIN_TASKS.length*100),finalMastery=S.missed.size===S.rescued?100:Math.round((MAIN_TASKS.length-S.missed.size+S.rescued)/MAIN_TASKS.length*100),avgDecision=S.decisions.length?Math.round(S.decisions.reduce((a,b)=>a+b,0)/S.decisions.length):0,duration=Math.round((Date.now()-S.started)/1000),rescueTotal=S.missed.size;const banner=rescueTotal?`<div class="banner rescue">CITY REPAIR CREW • ${S.rescued}/${rescueTotal}</div>`:`<div class="banner perfect">PERFECT SKYLINE</div>`;shell(`<div class="summary"><div class="mark">🏙️✨</div><h1>Skyline Complete!</h1><h2>Sentence City • AR Final Polish</h2>${banner}<div class="summary-sky"><div class="summary-buildings">${[54,82,66,105,76,116,88,126,98,138].map(h=>`<i class="summary-building" style="--h:${h}px"></i>`).join('')}</div></div><div class="summary-grid"><div class="stat"><small>FIRST-TRY</small><b>${firstAccuracy}%</b></div><div class="stat"><small>FINAL MASTERY</small><b>${finalMastery}%</b></div><div class="stat"><small>SCORE</small><b>${S.score}</b></div><div class="stat"><small>BEST COMBO</small><b>×${Math.max(1,S.best)}</b></div></div><div class="learning"><strong>ผลการเรียนรู้</strong><br>สร้างถูกตั้งแต่ครั้งแรก ${S.first} จาก 10 ประโยค${rescueTotal?`<br>ซ่อมประโยคที่พลาดสำเร็จ ${S.rescued} จาก ${rescueTotal} ประโยค`:'<br>ไม่ต้องเรียกทีมซ่อม — ยอดเยี่ยมมาก!'}</div><div class="analytics-grid"><div class="stat"><small>PINCH / DWELL</small><b>${S.pinchCount} / ${S.dwellCount}</b></div><div class="stat"><small>PICK / PLACE</small><b>${S.pickCount} / ${S.placeCount}</b></div><div class="stat"><small>AVG. DECISION</small><b>${avgDecision} ms</b></div><div class="stat"><small>HAND LOSSES</small><b>${S.handLosses}</b></div><div class="stat"><small>TARGET MISSES</small><b>${S.targetMisses}</b></div><div class="stat"><small>TIME</small><b>${Math.floor(duration/60)}:${String(duration%60).padStart(2,'0')}</b></div></div><div class="notice">โหมดทดสอบ • ยังไม่ส่งผลเข้า Firebase</div><div class="actions"><button id="again" class="btn primary">Build Another Skyline</button><button id="done" class="btn secondary">Back to Test Hub</button></div></div>`);window.SENTENCE_CITY_LAST_RESULT={version:'V5.4',firstTryAccuracy,finalMastery,score:S.score,bestCombo:S.best,rescueTotal,rescued:S.rescued,pinchCount:S.pinchCount,dwellCount:S.dwellCount,pickCount:S.pickCount,placeCount:S.placeCount,targetMisses:S.targetMisses,handLosses:S.handLosses,avgDecisionMs:avgDecision,durationSec:duration};document.getElementById('again').onclick=intro;document.getElementById('done').onclick=goBack}
function goBack(){stopCamera();location.href='./game-test-hub.html?v=20260806-scv54'}
document.getElementById('back').onclick=goBack;document.getElementById('sound').onclick=()=>{S.sound=!S.sound;document.getElementById('sound').textContent=S.sound?'🔊':'🔇';if(!S.sound)window.speechSynthesis?.cancel?.()};window.addEventListener('pagehide',stopCamera);intro();
</script>
