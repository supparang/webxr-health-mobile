<!doctype html>
<html lang="th" data-lexicon-responsive="1" data-lexicon-stage="sentence_city">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d2a">
<title>Sentence City AR V6.2.5 Mobile Smoke + Auto Return</title>
<link rel="stylesheet" href="./lexicon-responsive-standard-v1.css?v=20260807-responsive-r1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d2a}
iframe{display:block;width:100%;height:100%;border:0;background:#070d2a}
</style>
</head>
<body>
<iframe id="game" allow="camera" title="Sentence City AR V6.2.5 Mobile Smoke + Auto Return"></iframe>
<script>
(function(){
  const frame=document.getElementById('game');
  const params=new URLSearchParams(location.search);
  params.set('v','20260808-scv625-mobile-smoke-auto-return');
  frame.src='./sentence-city-ar-v62-clean-bank.html?'+params.toString();

  let attempts=0;
  const timer=setInterval(()=>{
    attempts++;
    try{
      const doc=frame.contentDocument;
      if(!doc?.head||!doc.querySelector('.app')){
        if(attempts>240)clearInterval(timer);
        return;
      }

      doc.documentElement.dataset.lexiconResponsive='1';
      doc.documentElement.dataset.lexiconStage='sentence_city';
      if(!doc.getElementById('lexiconResponsiveR1')){
        const link=doc.createElement('link');
        link.id='lexiconResponsiveR1';
        link.rel='stylesheet';
        link.href='./lexicon-responsive-standard-v1.css?v=20260807-responsive-r1';
        doc.head.appendChild(link);
      }

      const inject=(id,src)=>{
        if(doc.getElementById(id))return;
        const script=doc.createElement('script');
        script.id=id;
        script.src=src;
        script.onerror=()=>console.error(id+' failed to load');
        doc.head.appendChild(script);
      };

      inject('scSingleSubmitGuard','./sentence-city-single-submit-guard-v1.js?v=20260808-sc-auto-return14');
      inject('scMobileGrid','./sentence-city-mobile-grid-v1.js?v=20260806-sc-mobile-grid-v1');
      inject('scTaskLabels','./sentence-city-task-labels-v1.js?v=20260806-sc-task-labels-v1');
      inject('scCleanLayoutV2','./sentence-city-clean-layout-v2.js?v=20260806-sc-clean-layout-v2');

      installSummaryDirectPatch(doc);
    }catch(error){
      console.error('Sentence City V6.2.5 enhancement failed',error);
      if(attempts>240)clearInterval(timer);
    }
  },180);

  function installSummaryDirectPatch(doc){
    if(!doc.getElementById('scSummaryDirectStyle')){
      const style=doc.createElement('style');
      style.id='scSummaryDirectStyle';
      style.textContent=`
.panel.sc-summary-panel-v622{overflow-y:auto!important;overscroll-behavior:contain!important;padding:6px 6px calc(18px + env(safe-area-inset-bottom))!important;scroll-padding-bottom:calc(18px + env(safe-area-inset-bottom))!important}
.summary.sc-summary-v622{min-height:0!important;justify-content:flex-start!important;gap:6px!important;padding:0 0 calc(12px + env(safe-area-inset-bottom))!important}
.summary.sc-summary-v622 .mark{font-size:1.7rem!important;line-height:1!important;margin:0!important}
.summary.sc-summary-v622 h1{font-size:clamp(1.35rem,6vw,1.75rem)!important;line-height:1.05!important;margin:0!important}
.summary.sc-summary-v622 h2{font-size:clamp(.68rem,3vw,.86rem)!important;line-height:1.12!important;margin:0!important}
.summary.sc-summary-v622 .banner{min-height:42px!important;padding:8px 10px!important;font-size:clamp(.72rem,3.3vw,.9rem)!important;line-height:1.12!important}
.summary.sc-summary-v622 .summary-sky{height:100px!important;min-height:100px!important;border-radius:14px!important}
.summary.sc-summary-v622 .summary-sky:before{top:8px!important;font-size:.7rem!important;letter-spacing:12px!important}
.summary.sc-summary-v622 .summary-buildings{height:68px!important;left:10px!important;right:10px!important;bottom:8px!important;gap:5px!important}
.summary.sc-summary-v622 .summary-grid{gap:5px!important}
.summary.sc-summary-v622 .summary-grid .stat{min-height:48px!important;padding:5px 7px!important;border-radius:10px!important}
.summary.sc-summary-v622 .summary-grid .stat small{font-size:.5rem!important;line-height:1!important}
.summary.sc-summary-v622 .summary-grid .stat b{font-size:.95rem!important;line-height:1.05!important}
.summary.sc-summary-v622 .learning{padding:7px 8px!important;border-radius:10px!important;font-size:.68rem!important;line-height:1.28!important}
.summary.sc-summary-v622 .actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important;width:100%!important;margin:0!important}
.summary.sc-summary-v622 .actions .btn{min-height:40px!important;height:auto!important;padding:7px 6px!important;border-radius:11px!important;font-size:.64rem!important;line-height:1.12!important}
.summary.sc-summary-v622 .sc-details-v622{width:100%!important;border:1px solid #5062ad!important;border-radius:11px!important;background:#101946!important;overflow:hidden!important}
.summary.sc-summary-v622 .sc-details-v622>summary{min-height:38px!important;display:flex!important;justify-content:center!important;align-items:center!important;padding:7px 9px!important;list-style:none!important;cursor:pointer!important;font-size:.68rem!important;font-weight:900!important;color:#edf1ff!important}
.summary.sc-summary-v622 .sc-details-v622>summary::-webkit-details-marker{display:none!important}
.summary.sc-summary-v622 .sc-details-v622>summary:after{content:'▾';margin-left:7px}
.summary.sc-summary-v622 .sc-details-v622[open]>summary:after{content:'▴'}
.summary.sc-summary-v622 .sc-details-body-v622{display:grid!important;gap:6px!important;padding:0 7px 8px!important}
.summary.sc-summary-v622 .analytics-grid{gap:5px!important}
.summary.sc-summary-v622 .analytics-grid .stat{padding:6px 7px!important;border-radius:9px!important}
.summary.sc-summary-v622 .analytics-grid .stat small{font-size:.48rem!important}
.summary.sc-summary-v622 .analytics-grid .stat b{font-size:.78rem!important}
.summary.sc-summary-v622 .notice{padding:7px!important;border-radius:9px!important;font-size:.6rem!important;line-height:1.2!important}
@media(min-width:721px){.panel.sc-summary-panel-v622{display:block!important;padding:8px 16px 16px!important}.summary.sc-summary-v622{width:min(100%,980px)!important;max-width:980px!important;margin:0 auto!important;padding:6px 0 14px!important;gap:7px!important}.summary.sc-summary-v622 .mark{font-size:2rem!important}.summary.sc-summary-v622 h1{font-size:1.8rem!important}.summary.sc-summary-v622 h2{font-size:.9rem!important}.summary.sc-summary-v622 .banner{border-radius:12px!important}.summary.sc-summary-v622 .summary-sky{width:100%!important;height:112px!important;min-height:112px!important}.summary.sc-summary-v622 .summary-buildings{height:78px!important}.summary.sc-summary-v622 .summary-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}.summary.sc-summary-v622 .summary-grid .stat{min-height:54px!important;padding:7px 10px!important}.summary.sc-summary-v622 .summary-grid .stat small{font-size:.56rem!important}.summary.sc-summary-v622 .summary-grid .stat b{font-size:1rem!important}.summary.sc-summary-v622 .learning{font-size:.72rem!important;padding:8px 10px!important}.summary.sc-summary-v622 .actions{gap:8px!important}.summary.sc-summary-v622 .actions .btn{min-height:44px!important;font-size:.72rem!important}.summary.sc-summary-v622 .sc-details-v622{margin-top:1px!important}}
@media(min-width:721px) and (max-height:650px){.panel.sc-summary-panel-v622{padding-top:4px!important}.summary.sc-summary-v622{width:min(100%,1040px)!important;max-width:1040px!important;gap:4px!important;padding-top:2px!important}.summary.sc-summary-v622 .mark{font-size:1.45rem!important}.summary.sc-summary-v622 h1{font-size:1.42rem!important}.summary.sc-summary-v622 h2{font-size:.72rem!important}.summary.sc-summary-v622 .banner{min-height:34px!important;padding:6px 9px!important}.summary.sc-summary-v622 .summary-sky{height:86px!important;min-height:86px!important}.summary.sc-summary-v622 .summary-buildings{height:58px!important}.summary.sc-summary-v622 .summary-grid .stat{min-height:44px!important;padding:5px 8px!important}.summary.sc-summary-v622 .learning{padding:5px 8px!important;font-size:.64rem!important}.summary.sc-summary-v622 .actions .btn{min-height:38px!important;padding:6px!important;font-size:.66rem!important}.summary.sc-summary-v622 .sc-details-v622>summary{min-height:34px!important}}
@media(max-width:390px),(max-height:760px) and (max-width:720px){.summary.sc-summary-v622{gap:4px!important}.summary.sc-summary-v622 .mark{display:none!important}.summary.sc-summary-v622 h1{font-size:1.25rem!important}.summary.sc-summary-v622 h2{font-size:.64rem!important}.summary.sc-summary-v622 .banner{min-height:36px!important;padding:6px 8px!important;font-size:.68rem!important}.summary.sc-summary-v622 .summary-sky{height:84px!important;min-height:84px!important}.summary.sc-summary-v622 .summary-buildings{height:56px!important}.summary.sc-summary-v622 .summary-grid .stat{min-height:43px!important}.summary.sc-summary-v622 .learning{font-size:.62rem!important;padding:6px 7px!important}.summary.sc-summary-v622 .actions .btn{min-height:36px!important;font-size:.6rem!important}}
`;
      doc.head.appendChild(style);
    }

    const summary=doc.querySelector('.summary');
    if(!summary||summary.dataset.directSummaryV622==='1')return;
    const analytics=summary.querySelector('.analytics-grid');
    const notice=summary.querySelector('.notice');
    const actions=summary.querySelector('.actions');
    const learning=summary.querySelector('.learning');
    if(!analytics||!actions)return;

    summary.dataset.directSummaryV622='1';
    summary.classList.add('sc-summary-v622');
    summary.closest('.panel')?.classList.add('sc-summary-panel-v622');
    if(learning)learning.insertAdjacentElement('afterend',actions);else summary.appendChild(actions);

    const details=doc.createElement('details');
    details.className='sc-details-v622';
    const toggle=doc.createElement('summary');
    toggle.textContent='ดูรายละเอียดการเล่น';
    const body=doc.createElement('div');
    body.className='sc-details-body-v622';
    body.appendChild(analytics);
    if(notice)body.appendChild(notice);
    details.append(toggle,body);
    summary.appendChild(details);

    details.addEventListener('toggle',()=>{
      toggle.textContent=details.open?'ซ่อนรายละเอียดการเล่น':'ดูรายละเอียดการเล่น';
      if(details.open)requestAnimationFrame(()=>details.scrollIntoView({behavior:'smooth',block:'nearest'}));
    });
    const panel=summary.closest('.panel');
    if(panel)panel.scrollTop=0;
  }
})();
</script>
</body>
</html>
