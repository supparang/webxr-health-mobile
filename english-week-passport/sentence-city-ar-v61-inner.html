<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d2a">
<title>Sentence City AR V6.1 Seeded Bank</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d2a;color:#fff;font-family:system-ui,sans-serif}
.boot{height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}
.boot small{display:block;margin-top:8px;color:#b9c3ee}
</style>
</head>
<body>
<div id="boot" class="boot"><div><strong>กำลังเตรียม Sentence City V6.1…</strong><small>Seeded Question Bank • 128 items</small></div></div>
<script>
(async function(){
  try{
    const response=await fetch('./sentence-city-ar-v59.html?v=20260806-scv61-v59base',{cache:'no-store'});
    if(!response.ok)throw new Error('V59_LOAD_FAILED_'+response.status);
    let source=await response.text();

    const bankBoot="const BANK_PARAMS=new URLSearchParams(location.search);\nlet PLAYER_ID=BANK_PARAMS.get('pid')||BANK_PARAMS.get('studentId')||BANK_PARAMS.get('student')||BANK_PARAMS.get('id')||BANK_PARAMS.get('sid')||'';\nif(!PLAYER_ID){\n  const storageKey='lexiconx_sentence_city_test_pid';\n  PLAYER_ID=localStorage.getItem(storageKey)||`test-${crypto?.randomUUID?.()||Date.now().toString(36)}`;\n  localStorage.setItem(storageKey,PLAYER_ID);\n}\nconst RUN_ID=BANK_PARAMS.get('run')||BANK_PARAMS.get('session')||BANK_PARAMS.get('attempt')||'1';\nconst MISSION=window.LexiconXSentenceBank.createMission({playerId:PLAYER_ID,run:RUN_ID,count:10});\nfunction tokenRandom(seed){\n  let value=seed>>>0;\n  return function(){\n    value=(value+0x6D2B79F5)>>>0;\n    let t=value;\n    t=Math.imul(t^(t>>>15),t|1);\n    t^=t+Math.imul(t^(t>>>7),t|61);\n    return ((t^(t>>>14))>>>0)/4294967296;\n  };\n}\nfor(const task of MISSION.tasks){\n  const random=tokenRandom(window.LexiconXSentenceBank.hash32(`${MISSION.meta.seed}|${task.id}|tokens`));\n  for(let i=task.tokens.length-1;i>0;i--){\n    const j=Math.floor(random()*(i+1));\n    [task.tokens[i],task.tokens[j]]=[task.tokens[j],task.tokens[i]];\n  }\n}\nconst MAIN_TASKS=MISSION.tasks;";
    const fitCss="<style id=\"v61SeededFit\">\n@media(max-width:720px){\n  .app{grid-template-rows:46px minmax(0,1fr)!important;padding:env(safe-area-inset-top) 4px max(8px,env(safe-area-inset-bottom))!important}\n  .top{grid-template-columns:40px 1fr 40px!important;gap:5px!important}\n  .top button{height:38px!important;border-radius:12px!important}\n  .brand strong{font-size:.96rem!important}.brand small{display:none!important}\n  .panel{padding:5px!important;border-radius:14px!important}\n  .game{height:100%!important;min-height:0!important;display:grid!important;grid-template-rows:25px 42px minmax(0,1fr)!important;gap:4px!important}\n  .head{min-height:25px!important}.head strong{font-size:.7rem!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.chip{padding:3px 6px!important;font-size:.52rem!important}\n  .stats{gap:4px!important}.stat{padding:4px 6px!important;border-radius:9px!important}.stat small{font-size:.5rem!important}.stat b{font-size:.9rem!important}\n  .sky{display:none!important}\n  .mission{height:100%!important;min-height:0!important;display:grid!important;grid-template-rows:auto minmax(138px,19dvh) minmax(0,1fr) 32px!important;gap:4px!important;overflow:hidden!important}\n  .prompt{grid-template-columns:24px 1fr!important;gap:2px!important;min-height:28px!important}\n  .prompt .visual{font-size:1.15rem!important}.prompt h3{font-size:.73rem!important;line-height:1.14!important;margin:0!important}\n  .camera{height:19dvh!important;min-height:138px!important;max-height:205px!important;border-width:2px!important;border-radius:11px!important}\n  .status{left:5px!important;right:5px!important;bottom:4px!important;padding:5px 7px!important;border-radius:8px!important;font-size:.65rem!important;line-height:1.15!important}\n  .status small{font-size:.55rem!important;margin-top:1px!important}\n  .board{min-height:0!important;overflow:hidden!important;display:grid!important;grid-template-rows:12px 44px 12px 50px 44px!important;gap:3px!important;padding:0!important}\n  .label{font-size:.49rem!important;line-height:12px!important;margin:0!important}\n  .slots{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;justify-content:flex-start!important;gap:5px!important;padding:0 3px!important;scrollbar-width:none!important}\n  .depot{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;justify-content:flex-start!important;gap:6px!important;padding:1px 3px!important;scrollbar-width:none!important;overscroll-behavior-x:contain!important}\n  .slots::-webkit-scrollbar,.depot::-webkit-scrollbar{display:none!important}\n  .slot,.word{flex:0 0 auto!important;min-width:82px!important;max-width:170px!important;min-height:42px!important;height:42px!important;padding:5px 8px!important;border-radius:12px!important;border-width:2px!important;font-size:.69rem!important;white-space:nowrap!important}\n  .word{height:48px!important;min-height:48px!important;min-width:96px!important}\n  .control{position:static!important;width:100%!important;min-height:42px!important;height:42px!important;padding:6px!important;border-radius:12px!important;font-size:.78rem!important;order:initial!important}\n  .feedback{height:32px!important;min-height:32px!important;padding:5px 7px!important;border-radius:9px!important;font-size:.61rem!important;line-height:22px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}\n  #pointer{width:46px!important;height:46px!important;border-width:4px!important}\n  #carry{font-size:.7rem!important;padding:7px 10px!important;max-width:145px!important}\n}\n@media(max-width:720px) and (max-height:760px){\n  .mission{grid-template-rows:auto minmax(122px,17dvh) minmax(0,1fr) 29px!important}\n  .camera{height:17dvh!important;min-height:122px!important;max-height:165px!important}\n  .board{grid-template-rows:10px 40px 10px 45px 40px!important;gap:2px!important}\n  .label{line-height:10px!important}\n  .slot{height:38px!important;min-height:38px!important}.word{height:43px!important;min-height:43px!important}\n  .control{height:38px!important;min-height:38px!important}.feedback{height:29px!important;min-height:29px!important;line-height:19px!important}\n}\n</style>";
    const bankScript='<script src="./sentence-city-bank-v1.js?v=20260806-sc-bank-v1-128"><\\/script>';
    const chainPatch=".replace(/const MAIN_TASKS=\\[[\\s\\S]*?\\];\\nconst MP=/,bankBoot+'\\nconst MP=')\n      .replace('Skyline Builder Mission','Skyline Builder • ${MISSION.meta.setId}')\n      .replace('Sentence City • AR Final Polish','Sentence City • ${MISSION.meta.setId}')\n      .replace(\"window.SENTENCE_CITY_LAST_RESULT={version:'V5.4',\",\"window.SENTENCE_CITY_LAST_RESULT={version:'V6.1',bankVersion:MISSION.meta.bankVersion,missionSetId:MISSION.meta.setId,playerSeed:MISSION.meta.seed,\")\n      .replace('</head>',bankScript+css+seededFitCss+'</head>');";

    source=source
      .replaceAll('V5.9','V6.1')
      .replaceAll('Ready-to-Play','Seeded Bank')
      .replace(
        "let html=await response.text();",
        "let html=await response.text();const bankBoot="+JSON.stringify(bankBoot)+";const bankScript="+JSON.stringify(bankScript)+";const seededFitCss="+JSON.stringify(fitCss)+";"
      )
      .replace(".replace('</head>',css+'</head>');",chainPatch);

    document.open();
    document.write(source);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('boot').innerHTML='<div><strong>เปิดเกมไม่สำเร็จ</strong><small>'+String(error.message||error)+'</small></div>';
  }
})();
</script>
</body>
</html>
