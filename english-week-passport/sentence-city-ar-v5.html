<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111a46">
<title>Sentence City • AR-only V5</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#f4f6ff;background:#080e2b;--cyan:#5ee7ff;--violet:#9a82ff;--panel:#151d54;--line:#4655a1}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0,#283779,#0a1135 58%,#05091e)}button{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:60px minmax(0,1fr);padding:max(env(safe-area-inset-top),4px) 10px max(env(safe-area-inset-bottom),8px)}.top{max-width:760px;width:100%;margin:auto;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}.top button{height:44px;border:1px solid var(--line);border-radius:14px;background:#121a4d;color:#fff}.brand{text-align:center}.brand strong{display:block;font-size:1.15rem}.brand small{color:#b7c2f1}.screen{max-width:760px;width:100%;height:100%;min-height:0;margin:auto}.panel{height:100%;overflow:auto;border:1px solid #38478f;border-radius:22px;background:linear-gradient(180deg,rgba(24,33,89,.97),rgba(8,14,45,.98));padding:16px}.intro{text-align:center;min-height:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;padding-top:14px}.mark{font-size:3rem}.series{display:inline-block;align-self:center;padding:5px 10px;border-radius:999px;background:#313b89;color:#dfe3ff;font-weight:900;font-size:.72rem}.intro h1{font-size:2.2rem;margin:.45rem 0 .1rem}.intro h2{font-size:1.2rem;margin:.1rem 0;color:#d6dcff}.intro p{color:#b8c2eb;line-height:1.55}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.feature{padding:12px 6px;border:1px solid var(--line);border-radius:15px;background:#19235f;font-size:.78rem}.feature b{display:block;font-size:1.45rem;margin-bottom:5px}.notice{padding:12px;border:1px solid var(--line);border-radius:15px;background:#111947;color:#dbe1ff;line-height:1.5}.actions{display:grid;gap:10px;margin-top:18px}.btn{border:0;border-radius:16px;min-height:54px;font-weight:950;font-size:1rem}.primary{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#11153e}.secondary{background:#1b2865;color:#fff;border:1px solid #4c5ca8}.game{display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:9px;min-height:100%}.gamehead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.chip{padding:6px 9px;border-radius:999px;background:#2c55b6;color:#eaf6ff;font-size:.7rem;font-weight:950}.gamehead strong{text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{border:1px solid var(--line);border-radius:14px;background:#17205b;padding:9px}.stat small{display:block;color:#aab5e9}.stat b{font-size:1.25rem}.skyline{height:82px;border:1px solid #3d4f9c;border-radius:15px;position:relative;overflow:hidden;background:linear-gradient(#10194d,#0b123b)}.buildings{position:absolute;inset:auto 8px 12px;display:flex;align-items:flex-end;gap:5px;height:58px}.building{flex:1;height:var(--h);border:1px solid #4c61b2;background:repeating-linear-gradient(90deg,#263579 0 7px,#17245f 7px 12px);transition:.4s}.building.lit{background:repeating-linear-gradient(90deg,#ffd768 0 7px,#614f7c 7px 12px);box-shadow:0 0 18px #ffd768}.road{position:absolute;bottom:7px;left:0;right:0;border-top:3px solid #7788dc}.mission{border:1px solid #4a5caa;border-radius:18px;background:#11194c;padding:11px;display:grid;gap:9px;min-height:0}.prompt{display:grid;grid-template-columns:42px 1fr;gap:9px;align-items:center}.prompt .visual{font-size:2rem}.prompt h3{margin:0;text-align:center;font-size:1.05rem}.camera{position:relative;height:170px;border:2px solid #50d9ff;border-radius:16px;overflow:hidden;background:#040819}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.camera .status{position:absolute;left:8px;right:8px;bottom:8px;padding:8px;border-radius:12px;background:rgba(5,9,30,.78);text-align:center;font-weight:800;font-size:.82rem}.camera .status small{display:block;color:#c1c9ef;margin-top:3px}.board{display:grid;gap:8px}.label{text-align:center;color:#aeb8e8;font-size:.7rem;font-weight:900;letter-spacing:.08em}.slots,.depot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.slot,.word,.control{border:2px solid #6475c7;border-radius:14px;min-height:48px;padding:9px 12px;font-weight:900}.slot{background:#141c51;color:#b8c1ef;min-width:96px}.slot.filled{background:#25337b;color:white}.word{background:#f3f5ff;color:#19204b}.word.used{opacity:.35}.control{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#10153d;width:100%;font-size:1rem}.focus{outline:4px solid #ffe56b;box-shadow:0 0 24px #ffe56b;transform:scale(1.04)}#pointer{position:fixed;z-index:9999;width:28px;height:28px;border-radius:50%;border:4px solid #ffe56b;background:rgba(255,229,107,.25);pointer-events:none;transform:translate3d(-100px,-100px,0);margin:-14px 0 0 -14px}#pointer.pinch{background:#ffcf3f;transform-origin:center}.feedback{text-align:center;min-height:38px;padding:8px;border-radius:12px;background:#182260;color:#dce2ff}.feedback.good{background:#124f45}.feedback.bad{background:#681f3b}.summary{text-align:center}.summary h1{font-size:2rem}.rank{font-size:4rem;font-weight:950;color:#75f1c5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid .stat{min-height:75px;display:grid;place-content:center}.retry{margin-top:10px;background:#8c294a;color:#fff}.errorbox{padding:12px;border-radius:14px;background:#6f203e;color:#fff;text-align:center}
@media(max-height:760px){.camera{height:135px}.panel{padding:10px}.mission{gap:6px}.slot,.word{min-height:42px;padding:7px 10px}.skyline{height:65px}}
</style>
</head>
<body>
<div class="app"><header class="top"><button id="back">←</button><div class="brand"><strong>Sentence City</strong><small>LEXICON X • GAME 3 • Clean AR-only V5</small></div><button id="sound">🔊</button></header><main id="screen" class="screen"></main></div><div id="pointer" hidden></div>
<script type="module">
const VERSION='2026-08-06-SENTENCE-CITY-CLEAN-AR-V5';
const TASKS=[
{id:'s1',kind:'Fill the Gap',level:'A2',visual:'💧',prompt:'Students should ___ enough water during hot weather.',tokens:['drink','repair','borrow','paint'],answer:['drink']},
{id:'s2',kind:'Word Order',level:'A2',visual:'🔒',prompt:'Build the correct instruction.',tokens:['your password','Please','private','keep'],answer:['Please','keep','your password','private']},
{id:'s3',kind:'Repair',level:'A2',visual:'♻️',prompt:'Repair the sentence about plastic waste.',tokens:['We','should','reduce','plastic waste'],answer:['We','should','reduce','plastic waste']},
{id:'s4',kind:'Fill the Gap',level:'A2',visual:'🚸',prompt:'Always ___ both sides before crossing the road.',tokens:['check','cook','collect','design'],answer:['check']},
{id:'s5',kind:'Word Order',level:'A2+',visual:'🏫',prompt:'Build the sentence about English Week.',tokens:['starts','English Week','on Monday'],answer:['English Week','starts','on Monday']},
{id:'s6',kind:'Context',level:'A2+',visual:'🧳',prompt:'Complete the travel instruction.',tokens:['Keep','your ticket','in a safe place'],answer:['Keep','your ticket','in a safe place']},
{id:'s7',kind:'Fill the Gap',level:'B1',visual:'📝',prompt:'You need to ___ the application form before Friday.',tokens:['submit','climb','mix','throw'],answer:['submit']},
{id:'s8',kind:'Word Order',level:'B1',visual:'🏛️',prompt:'Build the sentence about a museum tour.',tokens:['at 10 a.m.','the museum tour','will begin','The guide'],answer:['The guide','will begin','the museum tour','at 10 a.m.']},
{id:'s9',kind:'Repair',level:'B1+',visual:'📚',prompt:'Repair the sentence about vocabulary practice.',tokens:['This app','helps students','practice','new vocabulary'],answer:['This app','helps students','practice','new vocabulary']},
{id:'s10',kind:'Context',level:'B1+',visual:'🎯',prompt:'Build a recommendation based on evidence.',tokens:['Based on the survey results','the school should','extend the activity','next year'],answer:['Based on the survey results','the school should','extend the activity','next year']}
];
const screen=document.getElementById('screen'),pointer=document.getElementById('pointer');
const state={index:0,score:0,combo:0,best:0,first:0,attempts:0,placed:[],selected:null,sound:true,stream:null,detector:null,running:false,lastVideo:-1,lastPinch:false,lastAction:0,raf:0,started:0};
function shell(x){screen.innerHTML=`<section class="panel">${x}</section>`}
function intro(){shell(`<div class="intro"><div class="mark">🏙️✋</div><span class="series">LEXICON X CHALLENGE • GAME 3</span><h1>Sentence City</h1><h2>AR-only Skyline Builder V5</h2><p>ใช้มือชี้และจีบนิ้วเพื่อเลือกคำ วางคำ และสร้างอาคารครบ 10 ภารกิจ</p><div class="features"><div class="feature"><b>✋</b>Hand Control</div><div class="feature"><b>🏗️</b>Build Skyline</div><div class="feature"><b>🔊</b>Auto Speech</div></div><div class="notice"><strong>AR-only จริง</strong><br>ไม่มีระบบแตะสำรอง • หากกล้องไม่พร้อมให้แก้สิทธิ์แล้วกด Retry</div><div class="actions"><button id="start" class="btn primary">Start AR Skyline Mission</button><button id="home" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('start').addEventListener('click',startGame,{once:true});document.getElementById('home').onclick=()=>location.href='./game-test-hub.html?v=20260806-scv5'}
async function startGame(){const b=document.getElementById('start');b.disabled=true;b.textContent='กำลังเปิดกล้องและ Hand Detect…';try{await openCamera();state.index=0;state.score=0;state.combo=0;state.best=0;state.first=0;state.started=Date.now();renderGame();showTask();loop()}catch(e){console.error(e);b.disabled=false;b.textContent='Retry AR Skyline Mission';document.querySelector('.notice').innerHTML=`<div class="errorbox">เปิด AR ไม่สำเร็จ: ${String(e.message||e)}<br>ตรวจสิทธิ์กล้องและอินเทอร์เน็ตแล้วลองใหม่</div>`;b.addEventListener('click',startGame,{once:true})}}
async function openCamera(){if(!navigator.mediaDevices?.getUserMedia)throw Error('CAMERA_NOT_SUPPORTED');state.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:960},height:{ideal:720}});const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs');const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm');const opts=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.45,minHandPresenceConfidence:.42,minTrackingConfidence:.42});try{state.detector=await vision.HandLandmarker.createFromOptions(files,opts('GPU'))}catch(_){state.detector=await vision.HandLandmarker.createFromOptions(files,opts('CPU'))}}
function renderGame(){shell(`<div class="game"><div class="gamehead"><span class="chip">AR ONLY</span><strong>Skyline Builder Mission</strong><span class="chip">V5</span></div><div class="stats"><div class="stat"><small>BUILDING</small><b id="progress">1 / 10</b></div><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>COMBO</small><b id="combo">×1</b></div></div><div class="skyline"><div class="buildings">${[30,42,35,50,39,56,44,61,52,66].map((h,i)=>`<i class="building" data-b="${i}" style="--h:${h}px"></i>`).join('')}</div><div class="road"></div></div><section id="mission" class="mission"></section></div>`)}
function showTask(){if(state.index>=TASKS.length)return finish();const t=TASKS[state.index];state.placed=Array(t.answer.length).fill(null);state.selected=null;state.attempts=0;document.getElementById('mission').innerHTML=`<div class="prompt"><span class="visual">${t.visual}</span><h3>${t.prompt}</h3></div><div class="camera"><video id="video" autoplay muted playsinline></video><div id="status" class="status">กำลังค้นหามือ…<small>ชี้คำ → จีบเพื่อเลือก → ชี้ช่อง → จีบเพื่อวาง</small></div></div><div class="board"><div class="label">SENTENCE BLUEPRINT</div><div id="slots" class="slots"></div><div class="label">WORD DEPOT</div><div id="depot" class="depot"></div><button id="check" class="control">Build Sentence</button><div id="feedback" class="feedback">ภารกิจ ${state.index+1}/10 • ${t.kind} • CEFR ${t.level}</div></div>`;document.getElementById('video').srcObject=state.stream;renderBoard();speak(t.prompt.replace('___','blank'));updateHud()}
function renderBoard(){const t=TASKS[state.index],slots=document.getElementById('slots'),depot=document.getElementById('depot');slots.innerHTML=state.placed.map((x,i)=>`<button class="slot ar-target${x?' filled':''}" data-slot="${i}">${x||'วางคำ'}</button>`).join('');const used=new Set(state.placed.filter(Boolean));depot.innerHTML=t.tokens.map((x,i)=>`<button class="word ar-target${used.has(x)?' used':''}" data-word="${i}">${x}</button>`).join('');document.getElementById('check').classList.add('ar-target')}
function activate(el){if(!el)return;const t=TASKS[state.index];if(el.dataset.word!=null){const word=t.tokens[Number(el.dataset.word)];if(state.placed.includes(word))return;state.selected=word;feedback(`เลือก “${word}” แล้ว • ชี้ช่องและจีบเพื่อวาง`)}else if(el.dataset.slot!=null){const i=Number(el.dataset.slot);if(state.selected){state.placed[i]=state.selected;state.selected=null;renderBoard();feedback('วางคำแล้ว • เลือกคำถัดไป')}else if(state.placed[i]){state.selected=state.placed[i];state.placed[i]=null;renderBoard();feedback('ยกบล็อกออกแล้ว • ชี้ช่องใหม่เพื่อวาง')}}else if(el.id==='check'){checkAnswer()}}
function checkAnswer(){const t=TASKS[state.index];if(state.placed.some(x=>!x))return feedback('ยังวางคำไม่ครบทุกช่อง','bad');state.attempts++;const ok=norm(state.placed)===norm(t.answer);if(!ok){state.combo=0;feedback('โครงสร้างยังไม่ถูกต้อง • ลองยกและสลับบล็อก','bad');updateHud();return}if(state.attempts===1)state.first++;state.combo++;state.best=Math.max(state.best,state.combo);state.score+=150+(state.combo-1)*20;document.querySelector(`[data-b="${state.index}"]`)?.classList.add('lit');feedback('✓ Sentence complete! อาคารเปิดไฟแล้ว','good');speak(t.answer.join(' '));updateHud();setTimeout(()=>{state.index++;showTask()},950)}
function norm(a){return a.join(' ').replace(/[?.!,]/g,'').replace(/\s+/g,' ').trim().toLowerCase()}
function feedback(text,type=''){const f=document.getElementById('feedback');if(f){f.textContent=text;f.className=`feedback ${type}`}}
function updateHud(){document.getElementById('progress').textContent=`${Math.min(state.index+1,10)} / 10`;document.getElementById('score').textContent=state.score;document.getElementById('combo').textContent=`×${Math.max(1,state.combo)}`}
function speak(text){if(!state.sound||!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.84;speechSynthesis.speak(u)}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function loop(){state.running=true;const video=document.getElementById('video');if(video&&video.readyState>=2&&video.currentTime!==state.lastVideo){state.lastVideo=video.currentTime;const r=state.detector.detectForVideo(video,performance.now());const hand=r.landmarks?.[0];if(hand){const tip=hand[8],thumb=hand[4],x=(1-tip.x)*innerWidth,y=tip.y*innerHeight;pointer.hidden=false;pointer.style.transform=`translate3d(${x}px,${y}px,0)`;document.querySelectorAll('.focus').forEach(e=>e.classList.remove('focus'));const el=document.elementFromPoint(x,y)?.closest('.ar-target:not(.used)');el?.classList.add('focus');const gap=distance(tip,thumb),pinch=state.lastPinch?gap<.076:gap<.052;pointer.classList.toggle('pinch',pinch);document.getElementById('status').innerHTML=el?`เล็งที่ “${el.textContent.trim()}”<small>จีบนิ้วหนึ่งครั้งเพื่อเลือกหรือวาง</small>`:'ขยับนิ้วชี้ไปยังคำหรือช่อง<small>เมื่อกรอบเหลืองขึ้น ให้จีบนิ้ว</small>';if(pinch&&!state.lastPinch&&performance.now()-state.lastAction>430){state.lastAction=performance.now();activate(el);navigator.vibrate?.(25)}state.lastPinch=pinch}else{pointer.hidden=true;state.lastPinch=false;const s=document.getElementById('status');if(s)s.innerHTML='ยังไม่พบมือ<small>ยกมือให้เห็นนิ้วชี้และนิ้วโป้ง</small>'}}state.raf=requestAnimationFrame(loop)}
function finish(){stop();const first=Math.round(state.first/10*100),rank=first>=90?'S':first>=80?'A':first>=70?'B':'C';shell(`<div class="summary"><div class="rank">${rank}</div><h1>Skyline Complete!</h1><div class="grid"><div class="stat"><small>FIRST-TRY</small><b>${first}%</b></div><div class="stat"><small>SCORE</small><b>${state.score}</b></div><div class="stat"><small>BEST COMBO</small><b>×${state.best}</b></div><div class="stat"><small>AR MISSIONS</small><b>10/10</b></div></div><div class="actions"><button id="again" class="btn primary">Build Another Skyline</button><button id="done" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('again').onclick=()=>location.reload();document.getElementById('done').onclick=()=>location.href='./game-test-hub.html?v=20260806-scv5'}
function stop(){state.running=false;cancelAnimationFrame(state.raf);state.stream?.getTracks().forEach(t=>t.stop());state.detector?.close?.();pointer.hidden=true;speechSynthesis?.cancel?.()}
document.getElementById('back').onclick=()=>{stop();location.href='./game-test-hub.html?v=20260806-scv5'};document.getElementById('sound').onclick=()=>{state.sound=!state.sound;document.getElementById('sound').textContent=state.sound?'🔊':'🔇'};addEventListener('pagehide',stop,{once:true});intro();
</script>
</body>
</html>
