<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111a46">
<title>Sentence City • AR-only V5.2</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#f4f6ff;background:#080e2b;--cyan:#5ee7ff;--violet:#9a82ff;--panel:#151d54;--line:#4655a1;--gold:#ffd968}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0,#283779,#0a1135 58%,#05091e)}button{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:60px minmax(0,1fr);padding:max(env(safe-area-inset-top),4px) 10px max(env(safe-area-inset-bottom),8px)}.top{max-width:760px;width:100%;margin:auto;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}.top button{height:44px;border:1px solid var(--line);border-radius:14px;background:#121a4d;color:#fff}.brand{text-align:center}.brand strong{display:block;font-size:1.15rem}.brand small{color:#b7c2f1}.screen{max-width:760px;width:100%;height:100%;min-height:0;margin:auto}.panel{height:100%;overflow:auto;border:1px solid #38478f;border-radius:22px;background:linear-gradient(180deg,rgba(24,33,89,.97),rgba(8,14,45,.98));padding:14px}.intro{text-align:center}.mark{font-size:3rem}.series,.chip{display:inline-block;padding:5px 10px;border-radius:999px;background:#313b89;color:#dfe3ff;font-weight:900;font-size:.72rem}.intro h1{font-size:2.2rem;margin:.45rem 0 .1rem}.intro h2{margin:.1rem 0;color:#d6dcff}.intro p{color:#b8c2eb;line-height:1.55}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.feature{padding:12px 6px;border:1px solid var(--line);border-radius:15px;background:#19235f}.feature b{display:block;font-size:1.45rem;margin-bottom:5px}.notice{padding:12px;border:1px solid var(--line);border-radius:15px;background:#111947;color:#dbe1ff;line-height:1.5}.actions{display:grid;gap:10px;margin-top:18px}.btn{border:0;border-radius:16px;min-height:54px;font-weight:950;font-size:1rem}.primary{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#11153e}.secondary{background:#1b2865;color:#fff;border:1px solid #4c5ca8}.game{display:grid;grid-template-rows:auto auto 82px minmax(0,1fr);gap:9px;min-height:100%}.gamehead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.gamehead strong{text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{border:1px solid var(--line);border-radius:14px;background:#17205b;padding:9px}.stat small{display:block;color:#aab5e9}.stat b{font-size:1.25rem}.skyline{position:relative;border:1px solid #3d4f9c;border-radius:15px;background:linear-gradient(#10194d,#0b123b);overflow:hidden}.buildings{position:absolute;inset:auto 10px 12px;display:flex;align-items:flex-end;gap:5px;height:60px}.building{flex:1;height:var(--h);border:1px solid #4c61b2;background:repeating-linear-gradient(90deg,#263579 0 7px,#17245f 7px 12px);transition:.35s}.building.lit{background:repeating-linear-gradient(90deg,#ffd768 0 7px,#614f7c 7px 12px);box-shadow:0 0 18px #ffd768}.road{position:absolute;bottom:7px;left:0;right:0;border-top:3px solid #7788dc}.mission{border:1px solid #4a5caa;border-radius:18px;background:#11194c;padding:11px;display:grid;gap:9px}.prompt{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:8px}.visual{font-size:2rem}.prompt h3{margin:0;text-align:center;font-size:1.05rem}.camera{position:relative;height:170px;border:2px solid var(--cyan);border-radius:16px;overflow:hidden;background:#05091e}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.status{position:absolute;left:8px;right:8px;bottom:8px;padding:9px;border-radius:12px;background:rgba(5,9,30,.82);text-align:center;font-weight:900}.status small{display:block;font-weight:600;color:#cbd3ff;margin-top:3px}.pickup-toast{position:absolute;left:50%;top:14px;transform:translateX(-50%) scale(.9);z-index:5;min-width:190px;max-width:82%;padding:10px 14px;border-radius:14px;background:linear-gradient(135deg,#ffd968,#ffb84d);color:#332100;font-weight:950;text-align:center;opacity:0;pointer-events:none;transition:.18s}.pickup-toast.show{opacity:1;transform:translateX(-50%) scale(1)}.board{display:grid;gap:7px}.label{text-align:center;color:#aeb9ee;font-size:.72rem;font-weight:900;letter-spacing:.08em}.slots,.depot{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.slot,.word,.control{border:2px solid transparent;border-radius:13px;min-height:48px;padding:8px 13px;font-weight:900}.slot{background:#19235f;color:#fff;border-color:#6676c2}.word{background:#f3f4ff;color:#14183d}.word.used{opacity:.25}.word.selected{background:#ffd968;color:#342300;border-color:#fff1a8;box-shadow:0 0 18px rgba(255,217,104,.75);transform:translateY(-3px)}.slot.armed{border-color:#ffd968;box-shadow:0 0 16px rgba(255,217,104,.55)}.control{width:100%;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#11153e;font-size:1rem}.focus{outline:4px solid var(--gold)!important;outline-offset:3px;box-shadow:0 0 22px rgba(255,217,104,.8)}.feedback{padding:10px;border-radius:12px;background:#1b2865;text-align:center}.feedback.good{background:#145c4c}.feedback.bad{background:#702f48}.pointer{position:fixed;z-index:9999;width:28px;height:28px;border-radius:50%;border:4px solid var(--gold);background:rgba(255,217,104,.25);pointer-events:none;margin:-14px 0 0 -14px;box-shadow:0 0 18px var(--gold)}.pointer.pinch{transform:scale(.72);background:var(--gold)}.held-word{position:fixed;z-index:9998;pointer-events:none;padding:7px 11px;border-radius:12px;background:#ffd968;color:#332100;font-weight:950;box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translate(18px,-48px);display:none}.held-word.show{display:block}.summary{text-align:center}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.errorbox{color:#ffd4d4;font-weight:800}
</style>
</head>
<body>
<div class="app"><header class="top"><button id="back">←</button><div class="brand"><strong>Sentence City</strong><small>LEXICON X • GAME 3 • AR-only V5.2</small></div><button id="sound">🔊</button></header><main id="screen" class="screen"></main></div>
<div id="pointer" class="pointer" hidden></div><div id="heldWord" class="held-word"></div>
<script>
(()=>{'use strict';
const TASKS=[
{id:'s1',kind:'Fill the Gap',level:'A2',visual:'💧',prompt:'Students should ___ enough water during hot weather.',tokens:['drink','repair','borrow','paint'],answer:['drink']},
{id:'s2',kind:'Word Order',level:'A2',visual:'🔒',prompt:'Build the correct instruction.',tokens:['your password','Please','private','keep'],answer:['Please','keep','your password','private']},
{id:'s3',kind:'Repair',level:'A2',visual:'♻️',prompt:'Repair the sentence.',tokens:['We','should','reduce','plastic waste'],answer:['We','should','reduce','plastic waste']},
{id:'s4',kind:'Fill the Gap',level:'A2+',visual:'🚸',prompt:'Always ___ both sides before crossing the road.',tokens:['check','cook','collect','design'],answer:['check']},
{id:'s5',kind:'Word Order',level:'A2+',visual:'🏫',prompt:'Build the sentence about English Week.',tokens:['starts','English Week','on Monday'],answer:['English Week','starts','on Monday']},
{id:'s6',kind:'Context',level:'A2+',visual:'🧳',prompt:'Complete the travel instruction.',tokens:['Keep','your ticket','in a safe place'],answer:['Keep','your ticket','in a safe place']},
{id:'s7',kind:'Fill the Gap',level:'B1',visual:'📝',prompt:'You need to ___ the application form before Friday.',tokens:['submit','climb','mix','throw'],answer:['submit']},
{id:'s8',kind:'Word Order',level:'B1',visual:'🏛️',prompt:'Build the sentence about a museum tour.',tokens:['at 10 a.m.','the museum tour','will begin','The guide'],answer:['The guide','will begin','the museum tour','at 10 a.m.']},
{id:'s9',kind:'Repair',level:'B1+',visual:'📚',prompt:'Repair the sentence about vocabulary practice.',tokens:['This app','helps students','practice','new vocabulary'],answer:['This app','helps students','practice','new vocabulary']},
{id:'s10',kind:'Context',level:'B1+',visual:'🎯',prompt:'Build a recommendation based on evidence.',tokens:['Based on the survey results','the school should','extend the activity','next year'],answer:['Based on the survey results','the school should','extend the activity','next year']}
];
const MP={module:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs',wasm:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm',model:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'};
const screen=document.getElementById('screen'),pointer=document.getElementById('pointer'),heldWord=document.getElementById('heldWord');
const state={index:0,score:0,combo:0,best:0,first:0,attempts:0,placed:[],selected:null,sound:true,stream:null,detector:null,lastVideo:-1,lastPinch:false,lastAction:0,raf:0};
function shell(html){screen.innerHTML=`<section class="panel">${html}</section>`}
function intro(){shell(`<div class="intro"><div class="mark">🏙️✋</div><span class="series">LEXICON X CHALLENGE • GAME 3</span><h1>Sentence City</h1><h2>AR-only Skyline Builder V5.2</h2><p>คำที่หยิบสำเร็จจะลอยติดปลายนิ้ว พร้อมขึ้นข้อความ “หยิบแล้ว” อย่างชัดเจน</p><div class="features"><div class="feature"><b>✋</b>Pinch to Pick</div><div class="feature"><b>🏗️</b>Build Skyline</div><div class="feature"><b>🔊</b>Audio Feedback</div></div><div class="notice"><strong>วิธีเล่น</strong><br>ชี้คำจนกรอบเหลือง → จีบหนึ่งครั้งเพื่อหยิบ → คำจะติดตามนิ้ว → ชี้ช่องแล้วจีบเพื่อวาง</div><div class="actions"><button id="start" class="btn primary">Start AR Skyline Mission</button><button id="home" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('start').onclick=startGame;document.getElementById('home').onclick=goBack}
async function startGame(){const button=document.getElementById('start');button.disabled=true;button.textContent='กำลังเปิดกล้องและ Hand Detect…';try{await openCamera();Object.assign(state,{index:0,score:0,combo:0,best:0,first:0,attempts:0,lastVideo:-1,lastPinch:false,selected:null});renderGame();showTask();loop()}catch(error){console.error(error);button.disabled=false;button.textContent='Retry AR Skyline Mission';document.querySelector('.notice').innerHTML=`<div class="errorbox">เปิด AR ไม่สำเร็จ: ${String(error.message||error)}</div>`}}
async function openCamera(){if(!navigator.mediaDevices?.getUserMedia)throw new Error('CAMERA_NOT_SUPPORTED');state.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:960},height:{ideal:720}}});const vision=await import(MP.module);const fileset=await vision.FilesetResolver.forVisionTasks(MP.wasm);const options=delegate=>({baseOptions:{modelAssetPath:MP.model,delegate},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.45,minHandPresenceConfidence:.42,minTrackingConfidence:.42});try{state.detector=await vision.HandLandmarker.createFromOptions(fileset,options('GPU'))}catch(error){console.warn('GPU unavailable; using CPU',error);state.detector=await vision.HandLandmarker.createFromOptions(fileset,options('CPU'))}}
function renderGame(){shell(`<div class="game"><div class="gamehead"><span class="chip">AR ONLY</span><strong>Skyline Builder Mission</strong><span class="chip">V5.2</span></div><div class="stats"><div class="stat"><small>BUILDING</small><b id="progress">1 / 10</b></div><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>COMBO</small><b id="combo">×1</b></div></div><div class="skyline"><div class="buildings">${[30,42,35,50,39,56,44,61,52,66].map((height,index)=>`<i class="building" data-b="${index}" style="--h:${height}px"></i>`).join('')}</div><div class="road"></div></div><section id="mission" class="mission"></section></div>`)}
function showTask(){if(state.index>=TASKS.length)return finish();const task=TASKS[state.index];state.placed=Array(task.answer.length).fill(null);state.selected=null;state.attempts=0;heldWord.classList.remove('show');document.getElementById('mission').innerHTML=`<div class="prompt"><span class="visual">${task.visual}</span><h3>${task.prompt}</h3></div><div class="camera"><video id="video" autoplay muted playsinline></video><div id="pickupToast" class="pickup-toast"></div><div id="status" class="status">กำลังค้นหามือ…<small>ชี้คำ → จีบเพื่อเลือก → ชี้ช่อง → จีบเพื่อวาง</small></div></div><div class="board"><div class="label">SENTENCE BLUEPRINT</div><div id="slots" class="slots"></div><div class="label">WORD DEPOT</div><div id="depot" class="depot"></div><button id="check" class="control ar-target">Build Sentence</button><div id="feedback" class="feedback">ภารกิจ ${state.index+1}/10 • ${task.kind} • CEFR ${task.level}</div></div>`;const video=document.getElementById('video');video.srcObject=state.stream;video.play().catch(console.error);renderBoard();speak(task.prompt.replace('___','blank'));updateHud()}
function renderBoard(){const task=TASKS[state.index],slots=document.getElementById('slots'),depot=document.getElementById('depot');slots.innerHTML=state.placed.map((value,index)=>`<button class="slot ar-target${value?' filled':''}${state.selected?' armed':''}" data-slot="${index}">${value||'วางคำ'}</button>`).join('');const used=new Set(state.placed.filter(Boolean));depot.innerHTML=task.tokens.map((value,index)=>`<button class="word ar-target${used.has(value)?' used':''}${state.selected===value?' selected':''}" data-word="${index}">${value}</button>`).join('')}
function flash(message){const toast=document.getElementById('pickupToast');if(!toast)return;toast.textContent=message;toast.classList.add('show');clearTimeout(flash.timer);flash.timer=setTimeout(()=>toast.classList.remove('show'),900)}
function tone(freq=720){if(!state.sound)return;try{const ctx=tone.ctx||(tone.ctx=new(window.AudioContext||window.webkitAudioContext)());const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=freq;gain.gain.value=.035;osc.connect(gain);gain.connect(ctx.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.09);osc.stop(ctx.currentTime+.1)}catch(_){}}
function activate(element){if(!element)return;const task=TASKS[state.index];if(element.dataset.word!=null){const word=task.tokens[Number(element.dataset.word)];if(state.placed.includes(word))return;state.selected=word;heldWord.textContent=`📦 ${word}`;heldWord.classList.add('show');renderBoard();flash(`หยิบแล้ว: ${word}`);feedback(`กำลังถือ “${word}” • ชี้ช่องแล้วจีบเพื่อวาง`,'good');tone(820);navigator.vibrate?.([35,25,35])}else if(element.dataset.slot!=null){const index=Number(element.dataset.slot);if(state.selected){const word=state.selected;state.placed[index]=word;state.selected=null;heldWord.classList.remove('show');renderBoard();flash(`วางแล้ว: ${word}`);feedback(`วาง “${word}” แล้ว • เลือกคำถัดไป`,'good');tone(980);navigator.vibrate?.(45)}else if(state.placed[index]){state.selected=state.placed[index];state.placed[index]=null;heldWord.textContent=`📦 ${state.selected}`;heldWord.classList.add('show');renderBoard();flash(`ยกออกแล้ว: ${state.selected}`)}}else if(element.id==='check')checkAnswer()}
function checkAnswer(){const task=TASKS[state.index];if(state.placed.some(value=>!value))return feedback('ยังวางคำไม่ครบทุกช่อง','bad');state.attempts++;const correct=normalize(state.placed)===normalize(task.answer);if(!correct){state.combo=0;feedback('โครงสร้างยังไม่ถูกต้อง • ลองยกและสลับบล็อก','bad');tone(180);updateHud();return}if(state.attempts===1)state.first++;state.combo++;state.best=Math.max(state.best,state.combo);state.score+=150+(state.combo-1)*20;document.querySelector(`[data-b="${state.index}"]`)?.classList.add('lit');feedback('✓ Sentence complete! อาคารเปิดไฟแล้ว','good');flash('สร้างอาคารสำเร็จ! ✨');tone(1100);speak(task.answer.join(' '));updateHud();setTimeout(()=>{state.index++;showTask()},950)}
function normalize(values){return values.join(' ').replace(/[?.!,]/g,'').replace(/\s+/g,' ').trim().toLowerCase()}
function feedback(text,type=''){const element=document.getElementById('feedback');if(element){element.textContent=text;element.className=`feedback ${type}`}}
function updateHud(){document.getElementById('progress').textContent=`${Math.min(state.index+1,10)} / 10`;document.getElementById('score').textContent=state.score;document.getElementById('combo').textContent=`×${Math.max(1,state.combo)}`}
function speak(text){if(!state.sound||!window.speechSynthesis)return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-US';utterance.rate=.84;window.speechSynthesis.speak(utterance)}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function loop(){const video=document.getElementById('video');if(video&&video.readyState>=2&&video.currentTime!==state.lastVideo){state.lastVideo=video.currentTime;const result=state.detector.detectForVideo(video,performance.now());const hand=result.landmarks?.[0];if(hand){const tip=hand[8],thumb=hand[4],x=(1-tip.x)*innerWidth,y=tip.y*innerHeight;pointer.hidden=false;pointer.style.transform=`translate3d(${x}px,${y}px,0)`;if(state.selected){heldWord.style.left=`${x}px`;heldWord.style.top=`${y}px`}document.querySelectorAll('.focus').forEach(element=>element.classList.remove('focus'));const target=document.elementFromPoint(x,y)?.closest('.ar-target:not(.used)');target?.classList.add('focus');const gap=distance(tip,thumb),pinch=state.lastPinch?gap<.076:gap<.052;pointer.classList.toggle('pinch',pinch);const status=document.getElementById('status');if(status)status.innerHTML=state.selected?`กำลังถือ “${state.selected}”<small>ชี้ช่องแล้วจีบเพื่อวาง</small>`:target?`เล็งที่ “${target.textContent.trim()}”<small>จีบนิ้วหนึ่งครั้งเพื่อหยิบ</small>`:'ขยับนิ้วชี้ไปยังคำ<small>เมื่อกรอบเหลืองขึ้น ให้จีบนิ้ว</small>';if(pinch&&!state.lastPinch&&performance.now()-state.lastAction>430){state.lastAction=performance.now();activate(target)}state.lastPinch=pinch}else{pointer.hidden=true;state.lastPinch=false;const status=document.getElementById('status');if(status)status.innerHTML='ยังไม่พบมือ<small>ยกมือให้เห็นนิ้วชี้และนิ้วโป้ง</small>'}}state.raf=requestAnimationFrame(loop)}
function stopCamera(){cancelAnimationFrame(state.raf);state.stream?.getTracks?.().forEach(track=>track.stop());try{state.detector?.close?.()}catch(_){}state.stream=null;state.detector=null;pointer.hidden=true;heldWord.classList.remove('show')}
function finish(){stopCamera();const accuracy=Math.round(state.first/TASKS.length*100);shell(`<div class="summary"><div class="mark">🏙️✨</div><span class="series">LEXICON X CHALLENGE • GAME 3</span><h1>Skyline Complete!</h1><div class="summary-grid"><div class="stat"><small>FIRST-TRY</small><b>${accuracy}%</b></div><div class="stat"><small>SCORE</small><b>${state.score}</b></div><div class="stat"><small>BEST COMBO</small><b>×${Math.max(1,state.best)}</b></div><div class="stat"><small>AR MISSIONS</small><b>10/10</b></div></div><div class="notice">โหมดทดสอบ • ยังไม่ส่งผลเข้า Firebase</div><div class="actions"><button id="again" class="btn primary">Build Another Skyline</button><button id="done" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('again').onclick=intro;document.getElementById('done').onclick=goBack}
function goBack(){stopCamera();location.href='./game-test-hub.html?v=20260806-scv52'}
document.getElementById('back').onclick=goBack;document.getElementById('sound').onclick=()=>{state.sound=!state.sound;document.getElementById('sound').textContent=state.sound?'🔊':'🔇';if(!state.sound)window.speechSynthesis?.cancel?.()};window.addEventListener('pagehide',stopCamera);intro();
})();
</script>
</body>
</html>
