<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d2a">
<title>Sentence City AR V5.7 Responsive</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d2a;color:#fff;font-family:system-ui,sans-serif}.boot{height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}.boot strong{font-size:1.1rem}.boot small{display:block;margin-top:8px;color:#b9c3ee}
</style>
</head>
<body>
<div id="boot" class="boot"><div><strong>กำลังเตรียม Sentence City V5.7…</strong><small>Responsive Mobile Pass</small></div></div>
<script>
(async function(){
  try{
    const response=await fetch('./sentence-city-ar-v56.html?v=20260806-scv57-base',{cache:'no-store'});
    if(!response.ok)throw new Error('BASE_LOAD_FAILED_'+response.status);
    let html=await response.text();
    const css=`<style id="v57Responsive">
      :root{--safe-bottom:max(10px,env(safe-area-inset-bottom))}
      html,body{height:100%!important;min-height:100%!important;overflow:hidden!important}
      .app{height:100dvh!important;min-height:100dvh!important;max-height:100dvh!important;padding-top:env(safe-area-inset-top)!important;padding-bottom:var(--safe-bottom)!important}
      .screen,.panel{min-height:0!important}
      @media(max-width:720px){
        .app{grid-template-rows:52px minmax(0,1fr)!important;padding-left:5px!important;padding-right:5px!important}
        .top{grid-template-columns:44px 1fr 44px!important;gap:6px!important}
        .top button{height:42px!important;border-radius:13px!important}
        .brand strong{font-size:clamp(.98rem,4.5vw,1.15rem)!important;line-height:1.1!important}
        .brand small{font-size:clamp(.58rem,2.7vw,.72rem)!important;line-height:1.2!important}
        .panel{height:100%!important;padding:8px!important;border-radius:16px!important;overflow:hidden!important}
        .intro{height:100%!important;min-height:0!important;justify-content:flex-start!important;gap:clamp(7px,1.4dvh,12px)!important;overflow-y:auto!important;overscroll-behavior:contain!important;padding:clamp(6px,1.2dvh,12px) 4px calc(12px + env(safe-area-inset-bottom))!important}
        .intro .mark{font-size:clamp(2rem,7dvh,3.2rem)!important;line-height:1!important;margin:0!important}
        .intro h1{font-size:clamp(1.7rem,6.4vw,2.25rem)!important;line-height:1.05!important;margin:0!important}
        .intro h2{font-size:clamp(.95rem,4.2vw,1.22rem)!important;line-height:1.25!important;margin:0!important}
        .intro p{font-size:clamp(.78rem,3.4vw,.95rem)!important;line-height:1.35!important;margin:0!important}
        .intro .notice{padding:clamp(9px,1.5dvh,13px)!important;border-radius:14px!important;font-size:clamp(.76rem,3.35vw,.92rem)!important;line-height:1.45!important}
        .intro .actions{gap:7px!important;margin-top:auto!important;width:100%!important}
        .intro .btn{min-height:50px!important;font-size:clamp(.86rem,3.8vw,1rem)!important;border-radius:14px!important}
      }
      @media(max-width:720px) and (max-height:820px){
        .brand small{display:none!important}
        .intro{gap:7px!important;padding-top:4px!important}
        .intro .mark{font-size:2.1rem!important}
        .intro h1{font-size:1.65rem!important}
        .intro h2{font-size:.93rem!important}
        .intro p{font-size:.76rem!important;line-height:1.25!important}
        .intro .notice{padding:8px 10px!important;font-size:.74rem!important;line-height:1.35!important}
        .intro .btn{min-height:46px!important}
      }
      @media(max-width:720px) and (max-height:700px){
        .intro .mark{display:none!important}
        .intro p{display:none!important}
        .intro .notice{font-size:.7rem!important;padding:7px 9px!important}
        .intro .actions{margin-top:4px!important}
      }
      @media(max-width:390px){
        .top{grid-template-columns:40px 1fr 40px!important}
        .top button{height:39px!important}
        .brand strong{font-size:.96rem!important}
      }
    </style>`;
    html=html
      .replaceAll('Pace & Summary V5.6','Responsive V5.7')
      .replaceAll('V5.6','V5.7')
      .replaceAll("version:'V5.6'","version:'V5.7'")
      .replace('</head>',css+'</head>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('boot').innerHTML='<div><strong>เปิดเกมไม่สำเร็จ</strong><small>'+String(error.message||error)+'</small></div>';
  }
})();
</script>
</body>
</html>
