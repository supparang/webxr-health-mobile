    const replacement=`let previewRaf=0;

  document.getElementById('prepare').onclick=preparePreview;

}
async function preparePreview(){
  const button=document.getElementById('prepare');
  button.disabled=true;button.textContent='กำลังเปิดกล้องและ AI…';
  try{
    if(!S.stream||!S.detector)await openCamera();
    const video=document.getElementById('previewVideo');
    video.srcObject=S.stream;await video.play().catch(()=>{});
    document.getElementById('readyZone').classList.add('live');
    document.getElementById('readyIcon').style.display='none';
    document.getElementById('start').disabled=false;
    document.getElementById('start').textContent='Start AR Mission';
    button.textContent='กล้องพร้อมแล้ว';
    previewLoop();
  }catch(error){
    console.error(error);button.disabled=false;button.textContent='ลองเปิดกล้องอีกครั้ง';
    document.getElementById('readyTitle').textContent='เปิดกล้องไม่สำเร็จ';
    document.getElementById('readyHelp').textContent=String(error.message||error);
  }
}
function previewLoop(){
  const video=document.getElementById('previewVideo');
  if(!video||!S.detector)return;
  if(video.readyState>=2&&video.currentTime!==S.lastVideo){
    S.lastVideo=video.currentTime;
    const result=S.detector.detectForVideo(video,performance.now());
    const hand=result.landmarks?.[0];
    const zone=document.getElementById('readyZone');
    const startButton=document.getElementById('start');
    if(hand){
      zone?.classList.add('hand-ready');
      document.getElementById('readyTitle').textContent='พบมือแล้ว • พร้อมเล่น!';
      document.getElementById('readyHelp').textContent='ยกนิ้วชี้และนิ้วโป้งให้อยู่ในภาพ';
      startButton?.classList.add('start-ready');
      startButton.textContent='พร้อมแล้ว • Start AR Mission';
    }else{
      zone?.classList.remove('hand-ready');
      document.getElementById('readyTitle').textContent='กล้องพร้อม • กำลังค้นหามือ';
      document.getElementById('readyHelp').textContent='ยกมือขึ้นกลางภาพเพื่อทดสอบการตรวจจับ';
      startButton?.classList.remove('start-ready');
      startButton.textContent='Start AR Mission';
    }
  }
  previewRaf=requestAnimationFrame(previewLoop);
}
