<!doctype html>
<html lang="th" data-lexicon-responsive="1" data-lexicon-stage="word_match">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#081827">
<title>LexiMatch Navigator • Passport</title>
<link rel="stylesheet" href="./lexicon-responsive-standard-v1.css?v=20260807-responsive-r1">
<style>html,body{margin:0;width:100%;height:100%;background:#06121f;color:#e8f3fb;font-family:system-ui,sans-serif}.boot{height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}.boot small{display:block;margin-top:7px;color:#9fc4d8}</style>
</head>
<body>
<div id="boot" class="boot"><div><strong>กำลังเปิด LexiMatch Navigator…</strong><small>Passport identity • Firebase Direct flow V1.5 Responsive One-Screen</small></div></div>
<script>
(async function(){
  const boot=document.getElementById('boot');
  try{
    const response=await fetch('./lexicon-x-v74-test.html?v=20260808-leximatch-one-screen1',{cache:'no-store'});
    if(!response.ok)throw new Error('LEXIMATCH_SOURCE_'+response.status);
    let source=await response.text();
    source=source.replace(/<script>\s*\(function\(\)\{const key=window\.EW_CONFIG[\s\S]*?TEST-LEXIMATCH-[\s\S]*?<\/script>/i,'');
    source=source.replace(/Back\s+to\s+Test\s+Hub/gi,'Back to Passport');
    source=source.replace(/กลับ\s*Test\s*Hub/gi,'กลับ Passport');
    source=source.replaceAll('aria-label="กลับ Test Hub"','aria-label="กลับ Passport"');
    source=source.replace(/Mission\s+Accomplished\s*[—-]\s*Ready\s+to\s+Level\s+Up!?/gi,'Mission Complete — ตรวจผลเพื่อปลดล็อกด่านถัดไป');
    source=source.replaceAll('20260805-leximatch81','20260808-leximatch-one-screen1');
    const responsiveHead=`<link rel="stylesheet" href="./lexicon-responsive-standard-v1.css?v=20260807-responsive-r1"><style id="lexiIntroOneScreen">
html[data-lexicon-stage="word_match"] .intro{height:100%!important;min-height:0!important;overflow:hidden!important;display:flex!important;flex-direction:column!important;justify-content:center!important;padding:clamp(8px,1.6dvh,14px) clamp(12px,4vw,18px)!important;gap:0!important}
html[data-lexicon-stage="word_match"] .intro .xmark{font-size:clamp(2rem,7dvh,3rem)!important;line-height:1!important;margin:0!important}
html[data-lexicon-stage="word_match"] .intro .series{font-size:clamp(.52rem,1.35dvh,.64rem)!important;margin:clamp(2px,.5dvh,5px) auto 0!important;padding:3px 7px!important}
html[data-lexicon-stage="word_match"] .intro h1{font-size:clamp(1.45rem,4.8dvh,2rem)!important;line-height:1.08!important;margin:clamp(4px,.7dvh,7px) 0 0!important}
html[data-lexicon-stage="word_match"] .intro h2{font-size:clamp(1rem,3.2dvh,1.3rem)!important;line-height:1.12!important;margin:clamp(3px,.6dvh,6px) 0 0!important}
html[data-lexicon-stage="word_match"] .intro .lead{font-size:clamp(.78rem,2.2dvh,.98rem)!important;line-height:1.38!important;margin:clamp(6px,1.2dvh,11px) auto 0!important;max-width:34rem!important}
html[data-lexicon-stage="word_match"] .intro .notice{margin-top:clamp(7px,1.2dvh,11px)!important;padding:clamp(7px,1.2dvh,10px) 10px!important;border-radius:12px!important;line-height:1.22!important}
html[data-lexicon-stage="word_match"] .intro .notice strong{font-size:clamp(.86rem,2.2dvh,1rem)!important}
html[data-lexicon-stage="word_match"] .intro .notice small{font-size:clamp(.72rem,1.8dvh,.86rem)!important}
html[data-lexicon-stage="word_match"] .intro .actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:clamp(6px,1dvh,9px)!important;margin-top:clamp(8px,1.3dvh,12px)!important}
html[data-lexicon-stage="word_match"] .intro .actions .btn{min-height:44px!important;height:clamp(44px,6.2dvh,52px)!important;padding:7px 10px!important;border-radius:13px!important;font-size:clamp(.82rem,2.1dvh,.98rem)!important}
html[data-lexicon-stage="word_match"] .intro .actions #start{grid-column:1/-1!important}
html[data-lexicon-stage="word_match"] .intro .actions #home{grid-column:1/-1!important}
@media(max-width:430px) and (max-height:760px){
 html[data-lexicon-stage="word_match"] .intro{justify-content:flex-start!important;padding-top:5px!important}
 html[data-lexicon-stage="word_match"] .intro .xmark{font-size:1.8rem!important}
 html[data-lexicon-stage="word_match"] .intro h1{font-size:1.28rem!important;margin-top:3px!important}
 html[data-lexicon-stage="word_match"] .intro h2{font-size:.94rem!important;margin-top:2px!important}
 html[data-lexicon-stage="word_match"] .intro .lead{font-size:.72rem!important;line-height:1.28!important;margin-top:5px!important}
 html[data-lexicon-stage="word_match"] .intro .notice{margin-top:5px!important;padding:6px 8px!important}
 html[data-lexicon-stage="word_match"] .intro .actions{margin-top:6px!important;gap:5px!important}
 html[data-lexicon-stage="word_match"] .intro .actions .btn{height:44px!important;min-height:44px!important;padding:6px 8px!important;font-size:.82rem!important}
}
@media(max-width:360px){html[data-lexicon-stage="word_match"] .intro .actions{grid-template-columns:1fr!important}html[data-lexicon-stage="word_match"] .intro .actions #start,html[data-lexicon-stage="word_match"] .intro .actions #home{grid-column:auto!important}}
</style><script>document.documentElement.dataset.lexiconResponsive='1';document.documentElement.dataset.lexiconStage='word_match';<\/script>`;
    source=source.replace('</head>',responsiveHead+'</head>');
    const productionPatch=`<script>(function(){
      function patch(){
        document.querySelectorAll('button,a').forEach(function(el){
          var text=(el.textContent||'').trim();
          if(/Back\\s+to\\s+Test\\s+Hub/i.test(text)||/กลับ\\s*Test\\s*Hub/i.test(text)){
            el.textContent='Back to Passport';
            el.setAttribute('data-passport-return','1');
            el.setAttribute('aria-label','กลับ Passport');
          }
        });
        document.querySelectorAll('div,p,span,strong,h1,h2,h3').forEach(function(el){
          var text=(el.textContent||'').trim();
          if(/^Mission\\s+Accomplished\\s*[—-]\\s*Ready\\s+to\\s+Level\\s+Up!?$/i.test(text)){
            el.textContent='Mission Complete — ตรวจผลเพื่อปลดล็อกด่านถัดไป';
          }
        });
      }
      patch();
      new MutationObserver(patch).observe(document.documentElement,{childList:true,subtree:true});
    }());<\/script>`;
    source=source.replace('</body>',productionPatch+'</body>');
    if(source.includes('TEST-LEXIMATCH-'))throw new Error('QA_IDENTITY_PATCH_FAILED');
    document.open();document.write(source);document.close();
  }catch(error){
    console.error(error);boot.innerHTML='<div><strong>เปิด LexiMatch ไม่สำเร็จ</strong><small>'+String(error?.message||error)+'</small></div>';
  }
})();
</script>
</body>
</html>
