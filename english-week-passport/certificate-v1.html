lumns:1fr 1fr;gap:10px;margin-top:14px}.btn{min-height:50px;border-radius:15px;border:1px solid #d4cfbe;background:#fff;font:800 .95rem Inter,system-ui,sans-serif;color:#27334e}.btn.primary{background:#7a631d;color:#fff;border-color:#7a631d}.status{padding:20px;text-align:center;background:#fff;border-radius:18px;font-family:Inter,system-ui,sans-serif}@media(max-width:600px){body{padding:max(12px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.cert{padding:21px 14px 19px;border-radius:18px}.cert:before{inset:8px}.eyebrow{font-size:.68rem;letter-spacing:.13em}.cert h1{font-size:1.42rem;margin:7px 0 3px}.lead{margin:2px 0;line-height:1.25}.program{margin:9px auto 8px;padding:7px 7px;font-size:.69rem;line-height:1.32}.program strong{font-size:.77rem}.presented{margin-top:7px!important}.name{font-size:clamp(.96rem,4.45vw,1.35rem);margin:9px auto 6px;line-height:1.14;white-space:nowrap;word-break:keep-all;overflow-wrap:normal;hyphens:none;letter-spacing:-.018em;max-width:100%}.cert p{line-height:1.3;margin-top:6px;margin-bottom:6px;font-size:.88rem}.award{font-size:1.18rem;margin:8px 0}.meta{gap:6px 12px;margin-top:10px;font-size:.73rem}.id{font-size:clamp(.56rem,2.45vw,.69rem);margin-top:7px;white-space:nowrap;letter-spacing:-.035em}.coordinator{margin-top:11px;padding-top:8px;max-width:320px}.coordinator strong{font-size:.72rem}.coordinator span{font-size:.61rem;color:#9299a5}.actions{grid-template-columns:1fr;gap:8px;margin-top:10px}.btn{min-height:48px}}@media(max-width:390px){.name{font-size:clamp(.9rem,4.15vw,1.08rem);letter-spacing:-.025em}.id{font-size:.55rem;letter-spacing:-.05em}.cert{padding-left:11px;padding-right:11px}.program{font-size:.65rem}.program strong{font-size:.72rem}}@media print{body{padding:0;background:#fff}.wrap{width:100%}.actions{display:none}.cert{box-shadow:none;border-radius:0;min-height:95vh;display:flex;flex-direction:column;justify-content:center}.
