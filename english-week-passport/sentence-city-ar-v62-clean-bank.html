<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d2a">
<title>Sentence City AR V6.2 Clean Bank V2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d2a;color:#fff;font-family:system-ui,sans-serif}
.boot{height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}
.boot small{display:block;margin-top:8px;color:#b9c3ee}
</style>
</head>
<body>
<div id="boot" class="boot"><div><strong>กำลังเตรียม Sentence City V6.2…</strong><small>Clean Bank V2 • 40 curated tasks</small></div></div>
<script>
(async function(){
  const boot=document.getElementById('boot');
  try{
    const response=await fetch('./sentence-city-ar-v61-clean.html?v=20260812-scv62-npc-speech-gate-r5',{cache:'no-store'});
    if(!response.ok)throw new Error('V61_CLEAN_LOADER_FAILED_'+response.status);
    let source=await response.text();
    const replacements=[
      ['sentence-city-bank-v1.js?v=20260806-sc-bank-v1-128','sentence-city-bank-v2-clean.js?v=20260806-sc-clean-bank-v2-40'],
      ['globalThis.LexiconXSentenceBank','globalThis.LexiconXSentenceBankV2'],
      ['LexiconXSentenceBank.hash32','LexiconXSentenceBankV2.hash32'],
      ['Seeded Question Bank • 128 items','Clean Bank V2 • 40 curated tasks'],
      ['128 items','40 curated tasks'],['V6.1','V6.2'],['Seeded Bank','Clean Bank V2']
    ];
    for(const [from,to] of replacements)source=source.split(from).join(to);
    if(!source.includes('sentence-city-bank-v2-clean.js'))throw new Error('CLEAN_BANK_SCRIPT_PATCH_FAILED');
    if(!source.includes('LexiconXSentenceBankV2'))throw new Error('CLEAN_BANK_GLOBAL_PATCH_FAILED');
    const mobileGrid='<script id="scMobileGrid" src="./sentence-city-mobile-grid-v1.js?v=20260808-sc-mobile-uniform-grid-v5-fixed-submit-lane"></'+'script>';
    source=source.replace('</head>',mobileGrid+'</head>');

    /* R5: patch the ACTIVE V6.1 loader chain without making speech enhancement
       a boot-critical dependency. The prior R4 changed its own anchor before
       searching for it, which caused SC_NPC_SPEECH_GATE_R4_CHAIN_ANCHOR_NOT_FOUND. */
    const chainAnchors=[
      '.replace("firstTryAccuracy,finalMastery","firstTryAccuracy:firstAccuracy,finalMastery")',
      '.replace("firstTryAccuracy:firstAccuracy,finalMastery","firstTryAccuracy:firstAccuracy,finalMastery")'
    ];
    const voiceReplace='.replace("setTimeout(()=>{S.index++;showTask()},950)","showToast(S.phase===\'rescue\'?\'ซ่อมประโยคสำเร็จ!\':\'สร้างอาคารสำเร็จ!\');const __scVoiceStarted=Date.now();const __scText=task.answer.join(\' \');const __scMinVoiceMs=Math.min(12000,Math.max(3200,1100+__scText.length*125));let __scVoiceSeen=false,__scIdleSince=0,__scAdvanced=false;const __scAdvance=()=>{if(__scAdvanced)return;__scAdvanced=true;S.index++;showTask()};const __scWaitForVoice=()=>{const __scSynth=window.speechSynthesis;const __scNow=Date.now();const __scElapsed=__scNow-__scVoiceStarted;const __scActive=Boolean(S.sound&&__scSynth&&(__scSynth.speaking||__scSynth.pending));if(__scActive){__scVoiceSeen=true;__scIdleSince=0}else if(__scVoiceSeen){if(!__scIdleSince)__scIdleSince=__scNow;if(__scElapsed>=__scMinVoiceMs&&__scNow-__scIdleSince>=800){__scAdvance();return}}else if(__scElapsed>=__scMinVoiceMs){__scAdvance();return}if(__scElapsed>=18000){__scAdvance();return}setTimeout(__scWaitForVoice,100)};setTimeout(__scWaitForVoice,150)")';
    const chainAnchor=chainAnchors.find(anchor=>source.includes(anchor));
    if(chainAnchor){
      source=source.replace(chainAnchor,chainAnchor+'\n      '+voiceReplace);
    }else{
      console.warn('SC_NPC_SPEECH_GATE_R5_SOFT_FALLBACK: loader anchor not found; game will continue without boot failure');
    }

    source=source.replaceAll('Sentence City AR V6.2 Clean Bank V2','Sentence City AR V6.2.10 NPC Speech Gate R5').replaceAll('Clean Bank V2 • 40 curated tasks','Clean Bank V2 • NPC Speech Gate R5 • 40 curated tasks');
    document.open();document.write(source);document.close();
  }catch(error){console.error(error);boot.innerHTML='<div><strong>เปิดเกมไม่สำเร็จ</strong><small>'+String(error?.message||error)+'</small></div>'}
})();
</script>
</body>
</html>
