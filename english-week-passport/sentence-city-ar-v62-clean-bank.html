<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d2a">
<title>Sentence City AR V6.2 Clean Bank V2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d2a;color:#fff;font-family:system-ui,sans-serif}
.boot{height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}
.boot small{display:block;margin-top:8px;color:#b9c3ee}
</style>
</head>
<body>
<div id="boot" class="boot"><div><strong>กำลังเตรียม Sentence City V6.2…</strong><small>Clean Bank V2 • 40 curated tasks</small></div></div>
<script>
(async function(){
  const boot=document.getElementById('boot');
  try{
    const response=await fetch('./sentence-city-ar-v61-clean.html?v=20260812-scv62-npc-speech-gate-r6-global',{cache:'no-store'});
    if(!response.ok)throw new Error('V61_CLEAN_LOADER_FAILED_'+response.status);
    let source=await response.text();
    const replacements=[
      ['sentence-city-bank-v1.js?v=20260806-sc-bank-v1-128','sentence-city-bank-v2-clean.js?v=20260806-sc-clean-bank-v2-40'],
      ['globalThis.LexiconXSentenceBank','globalThis.LexiconXSentenceBankV2'],
      ['LexiconXSentenceBank.hash32','LexiconXSentenceBankV2.hash32'],
      ['Seeded Question Bank • 128 items','Clean Bank V2 • 40 curated tasks'],
      ['128 items','40 curated tasks'],['V6.1','V6.2'],['Seeded Bank','Clean Bank V2']
    ];
    for(const [from,to] of replacements)source=source.split(from).join(to);
    if(!source.includes('sentence-city-bank-v2-clean.js'))throw new Error('CLEAN_BANK_SCRIPT_PATCH_FAILED');
    if(!source.includes('LexiconXSentenceBankV2'))throw new Error('CLEAN_BANK_GLOBAL_PATCH_FAILED');
    const mobileGrid='<script id="scMobileGrid" src="./sentence-city-mobile-grid-v1.js?v=20260808-sc-mobile-uniform-grid-v5-fixed-submit-lane"></'+'script>';
    source=source.replace('</head>',mobileGrid+'</head>');

    /* R6 GLOBAL SPEECH GATE
       Every task transition must wait for Teacher/NPC speech to finish.
       Earlier R5 patched only one 950 ms transition pattern, so Word Order,
       sentence-building, rescue, or future branches could still advance early. */
    const speechGate=`
let __scSpeechMinUntil=0;
let __scAdvanceQueued=false;
(function __scInstallSpeechTracker(){
  try{
    const synth=window.speechSynthesis;
    if(!synth||synth.__sentenceCityGlobalGateR6)return;
    const nativeSpeak=synth.speak.bind(synth);
    synth.speak=function(utterance){
      const text=String(utterance?.text||'').trim();
      const words=text?text.split(/\\s+/).length:0;
      const rate=Math.max(.55,Number(utterance?.rate)||1);
      const estimate=Math.min(16000,Math.max(1800,850+(words*470/rate)+(text.length*25/rate)));
      __scSpeechMinUntil=Math.max(__scSpeechMinUntil,Date.now()+estimate);
      return nativeSpeak(utterance);
    };
    synth.__sentenceCityGlobalGateR6=true;
  }catch(error){console.warn('Sentence City speech tracker unavailable',error)}
})();
function __scQueueAdvance(){
  if(__scAdvanceQueued)return;
  __scAdvanceQueued=true;
  const started=Date.now();
  let idleSince=0;
  let speechSeen=false;
  const tick=()=>{
    const synth=window.speechSynthesis;
    const now=Date.now();
    const engineBusy=Boolean(S.sound&&synth&&(synth.speaking||synth.pending));
    if(engineBusy){speechSeen=true;idleSince=0}
    else if(now>=__scSpeechMinUntil){if(!idleSince)idleSince=now}
    else idleSince=0;
    const audibleDone=now>=__scSpeechMinUntil;
    const stableIdle=idleSince&&now-idleSince>=650;
    if(!engineBusy&&audibleDone&&stableIdle){
      __scAdvanceQueued=false;
      S.index++;
      showTask();
      return;
    }
    if(now-started>=20000){
      console.warn('Sentence City speech gate safety timeout',{speechSeen,audibleDone});
      __scAdvanceQueued=false;
      S.index++;
      showTask();
      return;
    }
    setTimeout(tick,80);
  };
  setTimeout(tick,100);
}
`;
    if(source.includes('function current(){')){
      source=source.replace('function current(){',speechGate+'\nfunction current(){');
    }else{
      throw new Error('SC_GLOBAL_SPEECH_GATE_ANCHOR_NOT_FOUND');
    }

    /* Route every normal task advance through the global speech gate.
       This intentionally covers all task types, not only one timeout literal. */
    source=source
      .replaceAll('S.index++;showTask()','__scQueueAdvance()')
      .replaceAll('S.index ++;showTask()','__scQueueAdvance()')
      .replaceAll('S.index++; showTask()','__scQueueAdvance()');

    /* Preserve visible success feedback. Any legacy fixed delay may remain,
       but when it fires it now calls __scQueueAdvance(), which waits for speech. */
    source=source.replace(
      "setTimeout(()=>{__scQueueAdvance()},950)",
      "showToast(S.phase==='rescue'?'ซ่อมประโยคสำเร็จ!':'สร้างอาคารสำเร็จ!');setTimeout(()=>{__scQueueAdvance()},120)"
    );

    source=source.replaceAll('Sentence City AR V6.2 Clean Bank V2','Sentence City AR V6.2.11 Global Speech Gate R6').replaceAll('Clean Bank V2 • 40 curated tasks','Clean Bank V2 • Global Speech Gate R6 • 40 curated tasks');
    document.open();document.write(source);document.close();
  }catch(error){console.error(error);boot.innerHTML='<div><strong>เปิดเกมไม่สำเร็จ</strong><small>'+String(error?.message||error)+'</small></div>'}
})();
</script>
</body>
</html>
