<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d2a">
<title>Sentence City AR V6.2 Clean Bank V2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d2a;color:#fff;font-family:system-ui,sans-serif}
.boot{height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}
.boot small{display:block;margin-top:8px;color:#b9c3ee}
</style>
</head>
<body>
<div id="boot" class="boot"><div><strong>กำลังเตรียม Sentence City V6.2…</strong><small>Clean Bank V2 • 40 curated tasks</small></div></div>
<script>
(async function(){
  const boot=document.getElementById('boot');
  try{
    const response=await fetch('./sentence-city-ar-v61-clean.html?v=20260811-scv62-npc-speech-gate-r2',{cache:'no-store'});
    if(!response.ok)throw new Error('V61_CLEAN_LOADER_FAILED_'+response.status);
    let source=await response.text();

    const replacements=[
      ['sentence-city-bank-v1.js?v=20260806-sc-bank-v1-128','sentence-city-bank-v2-clean.js?v=20260806-sc-clean-bank-v2-40'],
      ['globalThis.LexiconXSentenceBank','globalThis.LexiconXSentenceBankV2'],
      ['LexiconXSentenceBank.hash32','LexiconXSentenceBankV2.hash32'],
      ['Seeded Question Bank • 128 items','Clean Bank V2 • 40 curated tasks'],
      ['128 items','40 curated tasks'],
      ['V6.1','V6.2'],
      ['Seeded Bank','Clean Bank V2']
    ];
    for(const [from,to] of replacements)source=source.split(from).join(to);

    if(!source.includes('sentence-city-bank-v2-clean.js'))throw new Error('CLEAN_BANK_SCRIPT_PATCH_FAILED');
    if(!source.includes('LexiconXSentenceBankV2'))throw new Error('CLEAN_BANK_GLOBAL_PATCH_FAILED');

    const mobileGrid='<script id="scMobileGrid" src="./sentence-city-mobile-grid-v1.js?v=20260808-sc-mobile-uniform-grid-v5-fixed-submit-lane"></'+'script>';
    source=source.replace('</head>',mobileGrid+'</head>');

    /* Repair the legacy V5.4 shorthand before the nested loader writes the final game. */
    source=source.split('firstTryAccuracy,finalMastery').join('firstTryAccuracy:firstAccuracy,finalMastery');

    /*
     * Sentence City NPC Speech Gate R2
     * R1 could still advance too early on some mobile browsers because
     * speechSynthesis.speaking may remain false briefly while the utterance is
     * queued/starting. R2 therefore requires either:
     *   1) observed active speech followed by a stable idle window, or
     *   2) an estimated minimum utterance window when the browser never exposes
     *      a reliable active state.
     * This prevents showTask() from starting the next prompt while Teacher Maya
     * is still speaking the completed sentence.
     */
    const oldAdvancePatch = `.replace("setTimeout(()=>{S.index++;showTask()},950)","showToast(S.phase==='rescue'?'ซ่อมประโยคสำเร็จ!':'สร้างอาคารสำเร็จ!');setTimeout(()=>{S.index++;showTask()},2400)")`;
    const newAdvancePatch = `.replace("setTimeout(()=>{S.index++;showTask()},950)","showToast(S.phase==='rescue'?'ซ่อมประโยคสำเร็จ!':'สร้างอาคารสำเร็จ!');const __scVoiceStarted=Date.now();const __scText=task.answer.join(' ');const __scMinVoiceMs=Math.min(9000,Math.max(2200,__scText.length*95));let __scVoiceSeen=false,__scIdleSince=0;const __scAdvance=()=>{S.index++;showTask()};const __scWaitForVoice=()=>{const __scSynth=window.speechSynthesis;const __scNow=Date.now();const __scActive=Boolean(S.sound&&__scSynth&&(__scSynth.speaking||__scSynth.pending));if(__scActive){__scVoiceSeen=true;__scIdleSince=0}else if(__scVoiceSeen){if(!__scIdleSince)__scIdleSince=__scNow;if(__scNow-__scIdleSince>=420){__scAdvance();return}}else if(__scNow-__scVoiceStarted>=__scMinVoiceMs){__scAdvance();return}if(__scNow-__scVoiceStarted>=15000){__scAdvance();return}setTimeout(__scWaitForVoice,100)};setTimeout(__scWaitForVoice,120)")`;
    if(source.includes(oldAdvancePatch))source=source.replace(oldAdvancePatch,newAdvancePatch);
    else console.warn('SC_NPC_SPEECH_GATE_PATCH_POINT_NOT_FOUND');

    source=source
      .replaceAll('Sentence City AR V6.2 Clean Bank V2','Sentence City AR V6.2.7 NPC Speech Gate R2')
      .replaceAll('Clean Bank V2 • 40 curated tasks','Clean Bank V2 • NPC Speech Gate R2 • 40 curated tasks');

    document.open();
    document.write(source);
    document.close();
  }catch(error){
    console.error(error);
    boot.innerHTML='<div><strong>เปิดเกมไม่สำเร็จ</strong><small>'+String(error?.message||error)+'</small></div>';
  }
})();
</script>
</body>
</html>
