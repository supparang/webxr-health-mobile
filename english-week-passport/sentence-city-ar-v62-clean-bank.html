<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d2a">
<title>Sentence City AR V6.2 Clean Bank V2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d2a;color:#fff;font-family:system-ui,sans-serif}
.boot{height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}
.boot small{display:block;margin-top:8px;color:#b9c3ee}
</style>
</head>
<body>
<div id="boot" class="boot"><div><strong>กำลังเตรียม Sentence City V6.2…</strong><small>Clean Bank V2 • 40 curated tasks</small></div></div>
<script>
(async function(){
  const boot=document.getElementById('boot');
  try{
    const response=await fetch('./sentence-city-ar-v61-clean.html?v=20260811-scv62-npc-speech-gate-r1',{cache:'no-store'});
    if(!response.ok)throw new Error('V61_CLEAN_LOADER_FAILED_'+response.status);
    let source=await response.text();

    const replacements=[
      ['sentence-city-bank-v1.js?v=20260806-sc-bank-v1-128','sentence-city-bank-v2-clean.js?v=20260806-sc-clean-bank-v2-40'],
      ['globalThis.LexiconXSentenceBank','globalThis.LexiconXSentenceBankV2'],
      ['LexiconXSentenceBank.hash32','LexiconXSentenceBankV2.hash32'],
      ['Seeded Question Bank • 128 items','Clean Bank V2 • 40 curated tasks'],
      ['128 items','40 curated tasks'],
      ['V6.1','V6.2'],
      ['Seeded Bank','Clean Bank V2']
    ];
    for(const [from,to] of replacements)source=source.split(from).join(to);

    if(!source.includes('sentence-city-bank-v2-clean.js'))throw new Error('CLEAN_BANK_SCRIPT_PATCH_FAILED');
    if(!source.includes('LexiconXSentenceBankV2'))throw new Error('CLEAN_BANK_GLOBAL_PATCH_FAILED');

    const mobileGrid='<script id="scMobileGrid" src="./sentence-city-mobile-grid-v1.js?v=20260808-sc-mobile-uniform-grid-v5-fixed-submit-lane"></'+'script>';
    source=source.replace('</head>',mobileGrid+'</head>');

    /* Repair the legacy V5.4 shorthand before the nested loader writes the final game. */
    source=source.split('firstTryAccuracy,finalMastery').join('firstTryAccuracy:firstAccuracy,finalMastery');

    /*
     * Sentence City NPC Speech Gate R1
     * V5.9 used a fixed 2.4 s delay after speak(answer). Long sentences were
     * therefore cut off when showTask() started the next utterance and the
     * legacy speak() called speechSynthesis.cancel(). Replace the timer patch
     * in the V6.1 loader with an engine-state gate: advance only after the
     * current utterance is no longer speaking/pending. A bounded 12 s fallback
     * prevents a broken browser speech engine from trapping the learner.
     */
    const oldAdvancePatch = `.replace("setTimeout(()=>{S.index++;showTask()},950)","showToast(S.phase==='rescue'?'ซ่อมประโยคสำเร็จ!':'สร้างอาคารสำเร็จ!');setTimeout(()=>{S.index++;showTask()},2400)")`;
    const newAdvancePatch = `.replace("setTimeout(()=>{S.index++;showTask()},950)","showToast(S.phase==='rescue'?'ซ่อมประโยคสำเร็จ!':'สร้างอาคารสำเร็จ!');const __scVoiceStarted=Date.now();const __scAdvanceAfterVoice=()=>{const __scSynth=window.speechSynthesis;if(S.sound&&__scSynth&&(__scSynth.speaking||__scSynth.pending)&&Date.now()-__scVoiceStarted<12000){setTimeout(__scAdvanceAfterVoice,120);return}S.index++;showTask()};setTimeout(__scAdvanceAfterVoice,420)")`;
    if(source.includes(oldAdvancePatch))source=source.replace(oldAdvancePatch,newAdvancePatch);
    else console.warn('SC_NPC_SPEECH_GATE_PATCH_POINT_NOT_FOUND');

    source=source
      .replaceAll('Sentence City AR V6.2 Clean Bank V2','Sentence City AR V6.2.6 NPC Speech Gate')
      .replaceAll('Clean Bank V2 • 40 curated tasks','Clean Bank V2 • NPC Speech Gate • 40 curated tasks');

    document.open();
    document.write(source);
    document.close();
  }catch(error){
    console.error(error);
    boot.innerHTML='<div><strong>เปิดเกมไม่สำเร็จ</strong><small>'+String(error?.message||error)+'</small></div>';
  }
})();
</script>
</body>
</html>
