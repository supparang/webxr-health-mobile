<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#e8f3fb;background:#06121f;--top-h:68px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 0,#123b5d 0,#081827 42%,#040b12 100%);overscroll-behavior:none}body{position:fixed;inset:0}.app{height:100dvh;padding:max(env(safe-area-inset-top),4px) 8px max(env(safe-area-inset-bottom),4px);display:grid;grid-template-rows:var(--top-h) minmax(0,1fr);overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:760px;margin:auto;padding:5px 0}.brand{min-width:0;text-align:center}.brand strong{display:block;font-size:1.05rem;letter-spacing:.08em;white-space:nowrap}.brand small{color:#81d4fa;font-size:.65rem}.icon{width:44px;height:44px;flex:0 0 44px;border:1px solid #31546d;border-radius:14px;background:#0c2234;color:#fff;font-size:1.1rem;position:relative;z-index:50;pointer-events:auto;touch-action:manipulation}.screen{width:100%;height:100%;min-height:0;max-width:760px;margin:auto;overflow:hidden}.panel{height:100%;min-height:0;background:rgba(8,27,43,.88);border:1px solid rgba(104,196,242,.25);border-radius:20px;padding:10px;box-shadow:0 16px 44px rgba(0,0,0,.3);backdrop-filter:blur(10px);overflow:hidden}.intro{height:100%;overflow:auto;text-align:center;padding:24px 16px}.xmark{font-size:3.1rem;font-weight:950;letter-spacing:-.12em;color:#5ee7ff;text-shadow:0 0 24px rgba(94,231,255,.55)}h1{margin:.25rem 0;font-size:clamp(1.65rem,6vw,2.5rem)}.lead{color:#b9ccda;line-height:1.55}.btn{border:0;border-radius:15px;padding:14px 18px;font-weight:900;font-size:1rem;position:relative;z-index:20;pointer-events:auto;touch-action:manipulation}.primary{background:linear-gradient(135deg,#20c8ff,#6ef3cf);color:#062033;box-shadow:0 12px 28px rgba(32,200,255,.25)}.secondary{background:#102b40;color:#dff6ff;border:1px solid #31566f}.actions{display:grid;gap:9px;margin-top:16px}.hud{height:66px;display:grid;grid-template-columns:1.3fr .8fr .8fr;gap:6px;margin-bottom:7px}.stat{min-width:0;background:#0b2437;border:1px solid #244a63;border-radius:13px;padding:7px 9px;display:flex;flex-direction:column;justify-content:center}.stat small{display:block;color:#7fa9bf;font-size:.65rem;line-height:1}.stat strong{font-size:1rem;line-height:1.2;margin-top:4px}.instruction{height:48px;display:flex;align-items:center;justify-content:center;text-align:center;color:#d4f4ff;background:#0b2437;border-radius:13px;padding:5px 9px;margin:0 0 5px;font-size:.84rem;line-height:1.25;font-weight:800}.feedback{height:27px;display:flex;align-items:center;justify-content:center;text-align:center;color:#9ad7ed;margin:0 0 4px;font-size:.78rem}.grid{height:calc(100% - 157px);min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:6px;position:relative;touch-action:none;user-select:none;overflow:hidden}.card{min-width:0;min-height:0;width:100%;height:100%;aspect-ratio:auto;border:1px solid #2b536b;border-radius:13px;background:linear-gradient(145deg,#133146,#091d2d);color:#fff;position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .34s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s;padding:0;pointer-events:none}.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .34s cubic-bezier(.2,.8,.2,1)}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:5px;backface-visibility:hidden;overflow-wrap:anywhere}.back{font-weight:950;font-size:clamp(.67rem,2.8vw,.95rem);letter-spacing:.08em;color:#9eeeff;text-align:center}.back small{font-size:.53rem;color:#6f9fb8;margin-top:4px}.front{transform:rotateY(180deg);background:linear-gradient(145deg,#eaf9ff,#cdeffc);color:#092235;text-align:center;font-size:clamp(.65rem,2.7vw,.92rem);font-weight:900}.front small{font-size:.52rem;color:#35627a;margin-top:4px}.card.target{border-color:#ffe36e;box-shadow:0 0 0 3px rgba(255,227,110,.26),0 0 20px rgba(255,227,110,.28)}.card.target:not(.flipped):not(.matched)::before{content:"SELECTED";position:absolute;z-index:7;top:4px;left:50%;transform:translateX(-50%);padding:2px 6px;border-radius:999px;background:#ffe36e;color:#12293c;font-size:.48rem;font-weight:950;letter-spacing:.06em}.card.opening::after{content:"OPENING " attr(data-pct) "%";position:absolute;left:5px;right:5px;bottom:5px;padding:4px;border-radius:7px;background:linear-gradient(90deg,#5ee7ff var(--p),#18394d var(--p));font-size:.52rem;font-weight:950;z-index:8;color:#eafaff}.card.matched{border-color:#63f0b9;box-shadow:0 0 18px rgba(99,240,185,.26)}.summary{height:100%;overflow:auto;text-align:center}.rank{font-size:3.5rem;font-weight:950;color:#5ee7ff}.notice{background:#0b2437;border:1px solid #31546d;border-radius:13px;padding:10px;color:#bcd2df;margin-top:10px}.test-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;background:#173d53;color:#70e7ff;font-size:.58rem;font-weight:950;letter-spacing:.06em}
body:has(#grid){--top-h:48px}.app:has(#grid) .top{padding:1px 0}.app:has(#grid) .brand strong{font-size:.82rem}.app:has(#grid) .brand small{font-size:.52rem}.app:has(#grid) .icon{width:38px;height:38px;flex-basis:38px;border-radius:12px}.app:has(#grid) .panel{padding:7px;border-radius:16px}
@media(max-height:700px){:root{--top-h:44px}.hud{height:56px}.instruction{height:40px;font-size:.72rem}.feedback{height:22px}.grid{height:calc(100% - 128px);gap:4px}.card{border-radius:10px}.back{font-size:.68rem}.front{font-size:.66rem}}
</style>
</head>
<body><div class="app"><header class="top"><button id="back" class="icon" type="button" aria-label="กลับ Test Hub">←</button><div class="brand"><strong>LEXICON X</strong><small><span class="test-badge">STANDALONE TEST</span> • Full-Screen V2</small></div><button id="exit" class="icon" type="button" aria-label="กลับ Test Hub">⌂</button></header><main id="screen" class="screen"></main></div>
<script src="./config.js?v=20260803-rotation2"></script>
<script src="./passport-rotation-v2.js?v=20260803-rotation2"></script>
<script>
(function(){
  "use strict";
  const key=window.EW_CONFIG?.cacheKeys?.identity||"ew_identity";
  try{localStorage.setItem(key,JSON.stringify({playerId:"TEST-LEXICON",nickname:"Mobile QA",fullName:"Mobile QA"}));}catch(_){}
  const HUB="./game-test-hub.html?v=20260805-fullscreen2";
  let pointerAt=0;
  document.addEventListener("pointerup",event=>{
    const id=event.target?.closest?.("button")?.id||"";
    pointerAt=performance.now();
    if(["back","exit","home","done"].includes(id)){
      event.preventDefault();event.stopImmediatePropagation();location.href=HUB;
    }
  },true);
  document.addEventListener("click",event=>{
    const id=event.target?.closest?.("button")?.id||"";
    if(["back","exit","home","done"].includes(id)){
      event.preventDefault();event.stopImmediatePropagation();location.href=HUB;return;
    }
    if(performance.now()-pointerAt<650){event.preventDefault();event.stopImmediatePropagation();}
  },true);
  const clarify=()=>{
    const instruction=document.getElementById("instruction");
    if(instruction&&!/กำลังเปิด|MATCH|ตรงกัน|เปิดใบแรก/i.test(instruction.textContent||"")){
      instruction.textContent="ปัดบนกระดาน 1 ครั้ง = ย้าย 1 ใบ • หยุดที่กรอบเหลืองแล้วเปิดเอง";
    }
  };
  setInterval(clarify,700);
}());
</script>
<script src="./lexicon-x-engine-v6.js?v=20260805-fullscreen2"></script>
</body></html>
