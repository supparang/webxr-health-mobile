<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d2a">
<title>Sentence City AR V6.1.2 Submit Guard</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d2a}
iframe{display:block;width:100%;height:100%;border:0;background:#070d2a}
</style>
</head>
<body>
<iframe id="game" allow="camera" title="Sentence City AR V6.1.2 Submit Guard"></iframe>
<script>
(function(){
  const frame=document.getElementById('game');
  const params=new URLSearchParams(location.search);
  params.set('v','20260806-scv612-single-submit');
  frame.src='./sentence-city-ar-v611-repair-fix.html?'+params.toString();

  let attempts=0;
  const timer=setInterval(()=>{
    attempts++;
    try{
      const doc=frame.contentDocument;
      if(!doc?.head||!doc.querySelector('.app')){
        if(attempts>100)clearInterval(timer);
        return;
      }
      if(doc.getElementById('scSingleSubmitGuard')){
        clearInterval(timer);
        return;
      }
      const script=doc.createElement('script');
      script.id='scSingleSubmitGuard';
      script.src='./sentence-city-single-submit-guard-v1.js?v=20260806-sc-submit-guard-v1';
      script.onload=()=>clearInterval(timer);
      script.onerror=()=>console.error('Sentence City submit guard failed to load');
      doc.head.appendChild(script);
    }catch(error){
      console.error('Sentence City submit guard injection failed',error);
      if(attempts>100)clearInterval(timer);
    }
  },200);
})();
</script>
</body>
</html>
