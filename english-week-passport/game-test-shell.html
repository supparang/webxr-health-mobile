<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07121f">
<title>LEXICON X • Game Smoke Shell</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07121f;font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#eaf7ff;overflow:hidden}.top{height:52px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.12);background:#0b1d2f}.top button{height:40px;border:1px solid #31536d;border-radius:13px;background:#102b40;color:#fff;font-size:18px;font-weight:900}.title{text-align:center;min-width:0}.title b,.title small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title b{font-size:.95rem}.title small{font-size:.7rem;color:#9db8c9}.stage{height:calc(100dvh - 52px);display:grid;place-items:center;padding:10px;background:radial-gradient(circle at 50% 38%,#14324a 0,#07121f 62%)}.device{width:min(390px,100%);height:min(780px,100%);border:1px solid rgba(255,255,255,.18);border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 22px 70px rgba(0,0,0,.5)}iframe{display:block;width:100%;height:100%;border:0;background:#07121f}@media(max-width:720px){.top{display:none}.stage{height:100dvh;padding:0;display:block}.device{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<header class="top"><button id="back" type="button" aria-label="กลับ">←</button><div class="title"><b id="title">LEXICON X • Smoke Test</b><small>Mobile View • QA only • does not change Passport progression</small></div><button id="reload" type="button" aria-label="โหลดใหม่">↻</button></header>
<main class="stage"><div class="device"><iframe id="game" allow="camera; microphone; autoplay" title="LEXICON X Smoke Test Game"></iframe></div></main>
<script>
(()=>{'use strict';
const q=new URLSearchParams(location.search);const target=q.get('target')||'';const pid=q.get('pid')||'QA-FB-002';const title=q.get('title')||'LEXICON X • Smoke Test';const backUrl=q.get('back')||'./game-test-mode.html';document.getElementById('title').textContent=title;const frame=document.getElementById('game');
function load(){if(!target){frame.srcdoc='<p style="font-family:system-ui;padding:24px">Missing target</p>';return}const u=new URL(target,location.href);u.searchParams.set('qa','1');u.searchParams.set('gameTestMode','1');u.searchParams.set('isTestAttempt','true');u.searchParams.set('affectsProgression','false');u.searchParams.set('pid',pid);u.searchParams.set('playerId',pid);u.searchParams.set('view','mobile');u.searchParams.set('smoke','1');u.searchParams.set('v','20260808-ENGLISH-GAME-TEST-R2');u.searchParams.set('_',Date.now());frame.src=u.href}
document.getElementById('back').onclick=()=>location.href=backUrl;document.getElementById('reload').onclick=load;load();window.EW_GAME_TEST_SHELL={version:'2026-08-08-ENGLISH-GAME-TEST-SHELL-R1',pid,target};
})();
</script>
</body>
</html>
