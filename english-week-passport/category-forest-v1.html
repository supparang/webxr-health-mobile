<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071b18">
<title>Category Forest • ป่าจำแนกหมวดหมู่คำศัพท์</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#ecfff8;background:#04110f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;background:radial-gradient(circle at 50% 0,#174b3f 0,#071b18 42%,#030a09 100%)}body{position:fixed;inset:0}.app{height:100dvh;padding:max(env(safe-area-inset-top),4px) 8px max(env(safe-area-inset-bottom),4px);display:grid;grid-template-rows:54px minmax(0,1fr)}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:760px;width:100%;margin:auto}.brand{text-align:center;min-width:0}.brand strong{display:block;font-size:.96rem}.brand small{font-size:.61rem;color:#9fe8d2}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#16493d;color:#86ffd8;font-weight:950;letter-spacing:.05em}.icon{width:42px;height:42px;border:1px solid #2b6658;border-radius:13px;background:#0c2a24;color:#fff;font-size:1.05rem;touch-action:manipulation}.screen{width:100%;height:100%;min-height:0;max-width:760px;margin:auto;overflow:hidden}.panel{height:100%;min-height:0;background:rgba(7,28,24,.92);border:1px solid rgba(116,239,196,.25);border-radius:18px;padding:8px;overflow:hidden;box-shadow:0 16px 42px rgba(0,0,0,.3)}.intro,.summary{height:100%;overflow:auto;text-align:center;padding:18px 14px}.forest-mark{font-size:3.2rem}.series{display:inline-flex;padding:4px 8px;border-radius:999px;background:#16493d;color:#86ffd8;font-size:.64rem;font-weight:950;letter-spacing:.05em}h1{margin:.35rem 0;font-size:clamp(1.6rem,6vw,2.3rem)}h2{margin:.15rem 0;color:#d8fff1;font-size:clamp(1rem,4vw,1.3rem)}.lead{color:#b8d8ce;line-height:1.5}.notice,.rank-label{background:#0b3029;border:1px solid #2c685a;border-radius:13px;padding:10px;color:#d0e9e0;margin-top:10px}.actions{display:grid;gap:9px;margin-top:16px}.btn{border:0;border-radius:15px;padding:14px 18px;font-weight:950;font-size:1rem;min-height:50px;touch-action:manipulation}.primary{background:linear-gradient(135deg,#38d996,#8ef0cb);color:#063526}.secondary{background:#103b33;color:#e8fff6;border:1px solid #2e685b}.game-head{height:35px;display:flex;align-items:center;justify-content:center;position:relative}.game-head strong{font-size:.85rem}.sound-mini{position:absolute;right:0;width:36px;height:32px;border:1px solid #2c685a;border-radius:10px;background:#103b33;color:#fff}.hud{height:58px;display:grid;grid-template-columns:1.25fr .8fr .8fr;gap:6px;margin-bottom:5px}.stat{background:#0b3029;border:1px solid #2c685a;border-radius:12px;padding:7px 9px;display:flex;flex-direction:column;justify-content:center;min-width:0}.stat small{color:#8ebbad;font-size:.61rem}.stat strong{font-size:1rem;margin-top:3px}.instruction{height:42px;display:flex;align-items:center;justify-content:center;text-align:center;background:#0b3029;border-radius:12px;padding:5px 8px;margin:0 0 5px;font-size:.79rem;font-weight:850}.play{height:calc(100% - 145px);display:grid;grid-template-rows:minmax(0,1fr) 39%;gap:7px}.word-zone{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-radius:16px;background:radial-gradient(circle at 50% 50%,rgba(70,190,145,.14),rgba(6,22,19,.2));border:1px solid rgba(101,220,179,.16)}.word-card{width:min(78%,360px);min-height:130px;border:2px solid #72f0c4;border-radius:20px;background:linear-gradient(145deg,#e9fff7,#bff2df);color:#082f24;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 18px 36px rgba(0,0,0,.28),0 0 24px rgba(114,240,196,.2);touch-action:none;user-select:none;will-change:transform}.word-card strong{font-size:clamp(1.35rem,7vw,2rem);text-align:center;overflow-wrap:anywhere}.word-card small{font-weight:850;color:#2d6857}.word-card.dragging{box-shadow:0 22px 44px rgba(0,0,0,.38),0 0 34px rgba(134,255,216,.42)}.word-card.correct{animation:correctPop .55s ease}.word-card.wrong{animation:wrongShake .35s ease}.combo{position:absolute;top:8px;left:10px;color:#9fe8d2;font-weight:950}.combo.hot{color:#ffe77c;transform:scale(1.06)}.groves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;min-height:0}.grove{border:1px solid #2d695b;border-radius:15px;background:linear-gradient(180deg,#134b3e,#0a2b24);color:#effff9;padding:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;min-width:0;transition:transform .18s,border-color .18s,box-shadow .18s}.grove .tree{font-size:1.75rem}.grove strong{font-size:.72rem;line-height:1.15;overflow-wrap:anywhere}.grove small{font-size:.53rem;color:#9bc7b8}.grove.hover{transform:translateY(-5px) scale(1.03);border-color:#87ffd8;box-shadow:0 0 22px rgba(111,242,196,.28)}.float{position:fixed;z-index:80;font-weight:950;font-size:1.25rem;pointer-events:none;animation:floatUp .8s ease forwards}.float.good{color:#7dffca}.float.bad{color:#ff9b9b}.rank{font-size:3.5rem;font-weight:950;color:#7dffca}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}.summary-grid .stat{min-height:63px}.perfect{margin:8px auto;padding:10px;border-radius:13px;background:linear-gradient(135deg,#ffe66d,#ffbd59);color:#3b2700;font-weight:950}.analytics-note{font-size:.68rem;color:#8ebbad;margin-top:8px}@keyframes correctPop{50%{transform:scale(1.07);filter:brightness(1.1)}}@keyframes wrongShake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-3px)}}@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-80px)}}@media(max-height:700px){.app{grid-template-rows:46px minmax(0,1fr)}.game-head{height:28px}.hud{height:50px}.instruction{height:36px;font-size:.69rem}.play{height:calc(100% - 124px)}.word-card{min-height:100px}.grove .tree{font-size:1.35rem}.grove strong{font-size:.62rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app"><header class="top"><button id="back" class="icon" type="button">←</button><div class="brand"><strong>Category Forest</strong><small><span class="badge">LEXICON X • GAME 2</span> ป่าจำแนกหมวดหมู่คำศัพท์</small></div><button id="exit" class="icon" type="button">⌂</button></header><main id="screen" class="screen"></main></div>
<script>
(function(){"use strict";
const VERSION='2026-08-05-CATEGORY-FOREST-V1';
const screen=document.getElementById('screen');
const BANK={
  Academic:[['assignment','งานที่ได้รับมอบหมาย','A2'],['lecture','การบรรยาย','A2'],['curriculum','หลักสูตร','B1'],['scholarship','ทุนการศึกษา','B1'],['seminar','สัมมนา','B1']],
  Research:[['evidence','หลักฐาน','B1'],['survey','แบบสำรวจ','A2+'],['hypothesis','สมมติฐาน','B1+'],['analysis','การวิเคราะห์','B1'],['participant','ผู้เข้าร่วม','B1']],
  Communication:[['feedback','ข้อมูลป้อนกลับ','B1'],['presentation','การนำเสนอ','A2+'],['clarify','ชี้แจง','B1'],['negotiate','เจรจา','B1+'],['announce','ประกาศ','A2+']],
  Time:[['deadline','กำหนดส่ง','A2+'],['schedule','ตารางเวลา','A2'],['postpone','เลื่อนออกไป','B1'],['duration','ระยะเวลา','B1'],['punctual','ตรงต่อเวลา','B1+']],
  Technology:[['database','ฐานข้อมูล','A2+'],['device','อุปกรณ์','A2'],['software','ซอฟต์แวร์','A2'],['network','เครือข่าย','A2+'],['algorithm','ขั้นตอนวิธี','B1']],
  Workplace:[['colleague','เพื่อนร่วมงาน','A2+'],['responsibility','ความรับผิดชอบ','B1'],['supervisor','ผู้ควบคุมงาน','B1'],['collaboration','การทำงานร่วมกัน','B1+'],['professional','เป็นมืออาชีพ','B1']]
};
const TH={Academic:'วิชาการ',Research:'การวิจัย',Communication:'การสื่อสาร',Time:'เวลาและกำหนดการ',Technology:'เทคโนโลยี',Workplace:'การทำงาน'};
const ICON={Academic:'🎓',Research:'🔎',Communication:'💬',Time:'⏱️',Technology:'💻',Workplace:'🏢'};
const S={round:0,items:[],index:0,score:0,correct:0,wrong:0,combo:0,bestCombo:0,started:0,timer:0,sound:true,audio:null,drag:null,events:[]};
function shell(x){screen.innerHTML='<section class="panel">'+x+'</section>';}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function tone(f,d=.07,type='sine',g=.035,delay=0){if(!S.sound)return;try{if(!S.audio)S.audio=new (window.AudioContext||window.webkitAudioContext)();if(S.audio.state==='suspended')S.audio.resume();const o=S.audio.createOscillator(),x=S.audio.createGain(),t=S.audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);x.gain.setValueAtTime(g,t);x.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(x);x.connect(S.audio.destination);o.start(t);o.stop(t+d);}catch(_){}}
function h(p){try{navigator.vibrate?.(p)}catch(_){}}
function sfx(k){if(k==='move'){tone(350,.04,'triangle',.018);h(8)}else if(k==='good'){tone(760,.08,'triangle',.045);tone(1020,.1,'triangle',.035,.07);h([16,25,24])}else if(k==='bad'){tone(170,.12,'sawtooth',.018);h([15,25,15])}else if(k==='finish'){tone(620,.1,'triangle',.04);tone(840,.12,'triangle',.035,.1);tone(1080,.16,'triangle',.03,.22);h([20,30,40])}}
function goHub(){clearInterval(S.timer);location.href='./game-test-hub.html?v=20260805-category1';}
function intro(){shell(`<div class="intro"><div class="forest-mark">🌲</div><div class="series">LEXICON X CHALLENGE • GAME 2</div><h1>Category Forest</h1><h2>ป่าจำแนกหมวดหมู่คำศัพท์</h2><p class="lead">ลากการ์ดคำศัพท์ไปปล่อยที่ต้นไม้หมวดหมู่ให้ถูกต้อง • CEFR A2–B1+</p><div class="notice"><strong>รูปแบบควบคุม: Drag & Drop</strong><br><small>แต่ละรอบสุ่ม 3 หมวดและ 10 คำใหม่</small></div><div class="actions"><button id="start" class="btn primary">Start Mission</button><button id="how" class="btn secondary">How to Play</button><button id="sound" class="btn secondary">${S.sound?'🔊':'🔇'} Sound</button><button id="home" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('start').onclick=start;document.getElementById('home').onclick=goHub;document.getElementById('sound').onclick=()=>{S.sound=!S.sound;intro()};document.getElementById('how').onclick=()=>{document.querySelector('.notice').innerHTML='<strong>ลากการ์ดไปยังต้นไม้</strong><br><small>ปล่อยเมื่อกรอบต้นไม้เรืองแสง • ตอบถูกได้ Combo • ตอบผิดการ์ดจะกลับกลางจอ</small>';};}
function makeRound(){const cats=shuffle(Object.keys(BANK)).slice(0,3),items=[];cats.forEach(cat=>shuffle(BANK[cat]).slice(0,4).forEach(x=>items.push({word:x[0],thai:x[1],level:x[2],cat})));return{cats,items:shuffle(items).slice(0,10)};}
function start(){const r=makeRound();Object.assign(S,{round:S.round+1,items:r.items,cats:r.cats,index:0,score:0,correct:0,wrong:0,combo:0,bestCombo:0,started:Date.now(),events:[]});shell(`<div class="game-head"><strong>Category Forest</strong><button id="sound" class="sound-mini">${S.sound?'🔊':'🔇'}</button></div><div class="hud"><div class="stat"><small>PROGRESS</small><strong id="progress">0 / 10</strong></div><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>TIME</small><strong id="time">0:00</strong></div></div><div id="instruction" class="instruction">ลากคำศัพท์ไปยังต้นไม้หมวดหมู่</div><div class="play"><div class="word-zone"><div id="combo" class="combo">COMBO ×1</div><div id="wordCard" class="word-card"></div></div><div id="groves" class="groves">${S.cats.map(c=>`<div class="grove" data-cat="${c}"><div class="tree">${ICON[c]}</div><strong>${c}</strong><small>${TH[c]}</small></div>`).join('')}</div></div>`);document.getElementById('sound').onclick=()=>{S.sound=!S.sound;document.getElementById('sound').textContent=S.sound?'🔊':'🔇'};showWord();clearInterval(S.timer);S.timer=setInterval(hud,500);}
function hud(){const p=document.getElementById('progress');if(!p)return;const sec=Math.floor((Date.now()-S.started)/1000);p.textContent=S.correct+' / 10';document.getElementById('score').textContent=S.score;document.getElementById('time').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');const c=document.getElementById('combo');c.textContent='COMBO ×'+Math.max(1,S.combo);c.classList.toggle('hot',S.combo>=3);}
function showWord(){if(S.index>=S.items.length){finish();return;}const item=S.items[S.index],card=document.getElementById('wordCard');card.className='word-card';card.style.transform='translate3d(0,0,0)';card.innerHTML=`<strong>${item.word}</strong><small>${item.thai} • ${item.level}</small>`;bindDrag(card);document.getElementById('instruction').textContent='ลากคำศัพท์ไปปล่อยที่หมวดหมู่ที่ถูกต้อง';}
function bindDrag(card){let sx=0,sy=0,ox=0,oy=0;card.onpointerdown=e=>{e.preventDefault();card.setPointerCapture(e.pointerId);const r=card.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;S.drag={t:performance.now(),item:S.items[S.index]};card.classList.add('dragging');sfx('move');};card.onpointermove=e=>{if(!S.drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;card.style.transform=`translate3d(${dx}px,${dy}px,0) scale(1.03)`;document.querySelectorAll('.grove').forEach(g=>{const r=g.getBoundingClientRect();g.classList.toggle('hover',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);});};card.onpointerup=e=>{if(!S.drag)return;let target=null;document.querySelectorAll('.grove').forEach(g=>{const r=g.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)target=g;g.classList.remove('hover');});card.classList.remove('dragging');const drag=S.drag;S.drag=null;if(!target){card.style.transform='translate3d(0,0,0)';document.getElementById('instruction').textContent='ยังไม่ถึงต้นไม้ • ลากใหม่อีกครั้ง';return;}judge(target.dataset.cat,drag);};card.onpointercancel=()=>{S.drag=null;card.classList.remove('dragging');card.style.transform='translate3d(0,0,0)';document.querySelectorAll('.grove').forEach(g=>g.classList.remove('hover'));};}
function floatText(text,good,el){const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='float '+(good?'good':'bad');f.textContent=text;f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+r.height/2)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),850);}
function judge(cat,drag){const item=S.items[S.index],card=document.getElementById('wordCard'),good=cat===item.cat,rt=Math.round(performance.now()-drag.t);S.events.push({word:item.word,expected:item.cat,selected:cat,correct:good,reactionMs:rt,index:S.index});if(good){S.correct++;S.combo++;S.bestCombo=Math.max(S.bestCombo,S.combo);const gain=100+(S.combo-1)*20;S.score+=gain;card.classList.add('correct');floatText('+'+gain,true,card);document.getElementById('instruction').textContent=S.combo>=3?`🔥 COMBO ×${S.combo} • ถูกต้อง`:'✓ ถูกต้อง';sfx('good');S.index++;setTimeout(showWord,620);}else{S.wrong++;S.combo=0;S.score=Math.max(0,S.score-15);card.classList.add('wrong');floatText('-15',false,card);document.getElementById('instruction').textContent=`ยังไม่ใช่ ${TH[cat]} • ลองใหม่`;sfx('bad');setTimeout(()=>{card.classList.remove('wrong');card.style.transform='translate3d(0,0,0)'},420);}hud();}
function finish(){clearInterval(S.timer);const sec=Math.max(1,Math.floor((Date.now()-S.started)/1000)),total=S.correct+S.wrong,acc=Math.round(S.correct/Math.max(1,total)*100),perfect=S.wrong===0,bonus=perfect?300:0;S.score+=bonus;const rank=perfect&&sec<=65?'S+':acc>=90?'S':acc>=80?'A':acc>=70?'B':'C',label=rank==='S+'?'Perfect Category Master!':rank==='S'?'Excellent Classification!':rank==='A'?'Strong Semantic Skills!':rank==='B'?'Great Progress!':'Mission Complete — Keep Growing!';const avg=S.events.length?Math.round(S.events.reduce((a,b)=>a+b.reactionMs,0)/S.events.length):0;shell(`<div class="summary"><div class="series">LEXICON X CHALLENGE • GAME 2</div><div class="rank">${rank}</div><h1>Mission Complete</h1><h2>Category Forest</h2><p class="lead">ป่าจำแนกหมวดหมู่คำศัพท์</p>${perfect?'<div class="perfect">PERFECT FOREST • +300 BONUS</div>':''}<div class="rank-label">${label}</div><div class="summary-grid"><div class="stat"><small>ACCURACY</small><strong>${acc}%</strong></div><div class="stat"><small>SCORE</small><strong>${S.score}</strong></div><div class="stat"><small>BEST COMBO</small><strong>×${Math.max(1,S.bestCombo)}</strong></div><div class="stat"><small>TIME</small><strong>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</strong></div><div class="stat"><small>MISTAKES</small><strong>${S.wrong}</strong></div><div class="stat"><small>RANK</small><strong>${rank}</strong></div></div><div class="analytics-note">Research preview: Avg. decision time ${avg} ms • ${S.events.length} classified items</div><div class="actions"><button id="again" class="btn primary">Play Again</button><button id="done" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('again').onclick=start;document.getElementById('done').onclick=goHub;sfx('finish');}
document.getElementById('back').onclick=goHub;document.getElementById('exit').onclick=goHub;window.CATEGORY_FOREST={version:VERSION,state:S};intro();
}());
</script>
</body>
</html>
