<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101947"><title>Sentence City AR V5.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d2a;color:#f7f8ff;font-family:Inter,"Noto Sans Thai",system-ui,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:64px minmax(0,1fr);padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}.top{width:min(1080px,100%);margin:auto;display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:8px}.top button{height:48px;border:1px solid #5061ae;border-radius:15px;background:#17215c;color:#fff;font-size:1.2rem}.brand{text-align:center}.brand strong{display:block;font-size:1.18rem}.brand small{color:#b9c3ee}.screen{width:min(1080px,100%);height:100%;min-height:0;margin:auto}.panel{height:100%;overflow:auto;border:1px solid #44559e;border-radius:22px;background:linear-gradient(#17215b,#0b1238);padding:12px}.intro{text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:100%;gap:14px}.intro .mark{font-size:4rem}.intro h1{font-size:2.4rem;margin:0}.intro h2{margin:0;color:#dce3ff}.intro p{font-size:1.1rem;color:#c4cdef}.notice{padding:15px;border-radius:16px;border:1px solid #5667b7;background:#111a48;line-height:1.55}.actions{display:grid;gap:10px}.btn{min-height:60px;border:0;border-radius:18px;font-size:1.08rem;font-weight:900}.primary{background:linear-gradient(135deg,#5de2ff,#a184ff);color:#10163a}.secondary{background:#1c2865;color:#fff;border:1px solid #5869b7}.game{display:grid;grid-template-rows:auto auto 94px minmax(0,1fr);gap:10px;min-height:100%}.head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.chip{padding:6px 10px;border-radius:999px;background:#334db0;font-weight:900;font-size:.72rem}.head strong{text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px;border-radius:15px;border:1px solid #4e60ae;background:#18235e}.stat small{display:block;color:#adb8e9}.stat b{font-size:1.35rem}.sky{position:relative;border-radius:16px;border:1px solid #4659a4;background:#0e1748;overflow:hidden}.buildings{position:absolute;inset:auto 12px 12px;display:flex;align-items:flex-end;gap:7px;height:70px}.building{flex:1;height:var(--h);border:1px solid #4e62b1;background:repeating-linear-gradient(90deg,#263574 0 8px,#19275f 8px 14px)}.building.lit{background:repeating-linear-gradient(90deg,#ffd56a 0 8px,#5d467e 8px 14px);box-shadow:0 0 18px #ffd56a}.road{position:absolute;left:0;right:0;bottom:8px;border-top:4px solid #8092e7}.mission{display:grid;grid-template-rows:auto minmax(220px,38vh) auto auto auto;gap:12px;min-height:0}.prompt{display:grid;grid-template-columns:50px 1fr;align-items:center;gap:8px}.prompt .visual{font-size:2.2rem}.prompt h3{margin:0;text-align:center;font-size:clamp(1rem,2.4vw,1.35rem)}.camera{position:relative;min-height:220px;border:3px solid #5ae4ff;border-radius:18px;overflow:hidden;background:#05081b}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.status{position:absolute;left:12px;right:12px;bottom:10px;padding:12px;border-radius:14px;background:rgba(8,13,42,.88);text-align:center;font-weight:900}.status small{display:block;color:#ced6ff;margin-top:3px}.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:8;padding:12px 18px;border-radius:999px;background:#ffd35f;color:#1b1740;font-weight:1000;font-size:1.05rem;box-shadow:0 8px 28px #0008;opacity:0;transition:.18s}.toast.show{opacity:1}.board{display:grid;gap:12px}.label{text-align:center;font-size:.78rem;font-weight:950;color:#bdc7f3}.slots,.depot{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.slot,.word,.control{min-height:74px;min-width:150px;padding:14px 20px;border-radius:20px;font-size:1.08rem;font-weight:1000;border:3px solid #8294ed;background:#fff;color:#111630}.slot{background:#17225b;color:#fff;border-style:dashed}.slot.filled{background:#fff3ba;color:#211a38;border-style:solid}.word.selected{background:#ffd65e;transform:scale(1.06);box-shadow:0 0 24px #ffd65e}.word.used{opacity:.25}.focus{outline:8px solid rgba(255,217,82,.42);box-shadow:0 0 0 15px rgba(255,217,82,.18),0 0 28px #ffd952;transform:scale(1.07)}.control{width:100%;background:linear-gradient(135deg,#5de2ff,#9f84ff);border:0}.feedback{text-align:center;padding:12px;border-radius:14px;background:#1a286b;font-weight:900}.feedback.good{color:#7fffc8}.feedback.bad{color:#ff9ca8}#pointer{position:fixed;z-index:9999;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;border:5px solid #ffe156;background:#ffe15644;box-shadow:0 0 20px #ffe156;pointer-events:none}#pointer.pinch{transform:scale(.65)}#carry{position:fixed;z-index:9998;pointer-events:none;padding:12px 18px;border-radius:16px;background:#ffd65e;color:#171331;font-weight:1000;box-shadow:0 8px 24px #0008;display:none}.summary{text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:100%;gap:14px}.summary h1{font-size:2.2rem}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.summary-grid .stat{text-align:left}@media(max-width:720px){.panel{padding:8px}.mission{grid-template-rows:auto minmax(240px,40vh) auto auto auto}.camera{min-height:240px}.slot,.word{min-width:132px;min-height:72px;padding:13px 15px}.game{grid-template-rows:auto auto 80px minmax(0,1fr)}}
</style></head><body><div class="app"><header class="top"><button id="back">←</button><div class="brand"><strong>Sentence City</strong><small>LEXICON X • GAME 3 • AR Easy-Pinch V5.3</small></div><button id="sound">🔊</button></header><main id="screen" class="screen"></main></div><div id="pointer" hidden></div><div id="carry"></div>
<script type="module">
const TASKS=[
{id:'s1',kind:'Fill the Gap',level:'A2',visual:'💧',prompt:'Students should ___ enough water during hot weather.',tokens:['drink','repair','borrow','paint'],answer:['drink']},
{id:'s2',kind:'Word Order',level:'A2',visual:'🔒',prompt:'Build the correct instruction.',tokens:['your password','Please','private','keep'],answer:['Please','keep','your password','private']},
{id:'s3',kind:'Repair',level:'A2',visual:'♻️',prompt:'Repair the sentence about plastic waste.',tokens:['We','should','reduce','plastic waste'],answer:['We','should','reduce','plastic waste']},
{id:'s4',kind:'Fill the Gap',level:'A2+',visual:'🚸',prompt:'Always ___ both sides before crossing the road.',tokens:['check','cook','collect','design'],answer:['check']},
{id:'s5',kind:'Word Order',level:'A2+',visual:'🏫',prompt:'Build the sentence about English Week.',tokens:['starts','English Week','on Monday'],answer:['English Week','starts','on Monday']},
{id:'s6',kind:'Context',level:'A2+',visual:'🧳',prompt:'Complete the travel instruction.',tokens:['Keep','your ticket','in a safe place'],answer:['Keep','your ticket','in a safe place']},
{id:'s7',kind:'Fill the Gap',level:'B1',visual:'📝',prompt:'You need to ___ the application form before Friday.',tokens:['submit','climb','mix','throw'],answer:['submit']},
{id:'s8',kind:'Word Order',level:'B1',visual:'🏛️',prompt:'Build the museum tour sentence.',tokens:['at 10 a.m.','the museum tour','will begin','The guide'],answer:['The guide','will begin','the museum tour','at 10 a.m.']},
{id:'s9',kind:'Repair',level:'B1+',visual:'📚',prompt:'Repair the vocabulary practice sentence.',tokens:['This app','helps students','practice','new vocabulary'],answer:['This app','helps students','practice','new vocabulary']},
{id:'s10',kind:'Context',level:'B1+',visual:'🎯',prompt:'Build a recommendation based on evidence.',tokens:['Based on the survey results','the school should','extend the activity','next year'],answer:['Based on the survey results','the school should','extend the activity','next year']}
];
const MP={module:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs',wasm:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm',model:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'};
const screen=document.getElementById('screen'),pointer=document.getElementById('pointer'),carry=document.getElementById('carry');
const S={index:0,score:0,combo:0,best:0,first:0,attempts:0,placed:[],selected:null,sound:true,stream:null,detector:null,lastVideo:-1,lastPinch:false,lastAction:0,raf:0,started:0,hover:null,hoverSince:0};
const shell=x=>screen.innerHTML=`<section class="panel">${x}</section>`;
function intro(){shell(`<div class="intro"><div class="mark">🏙️✋</div><h1>Sentence City</h1><h2>AR Easy-Pinch Skyline V5.3</h2><p>พื้นที่กว้าง เป้าหมายใหญ่ และจับคำได้ง่ายขึ้น</p><div class="notice"><strong>วิธีเล่น</strong><br>ชี้คำให้กรอบเหลืองขึ้น → จีบเบา ๆ หรือค้างเหนือคำ 0.8 วินาที → ชี้ช่อง → จีบเพื่อวาง</div><div class="actions"><button id="start" class="btn primary">Start AR Mission</button><button id="home" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('start').onclick=start;document.getElementById('home').onclick=goBack}
async function start(){const b=document.getElementById('start');b.disabled=true;b.textContent='กำลังเปิดกล้อง…';try{await openCamera();Object.assign(S,{index:0,score:0,combo:0,best:0,first:0,attempts:0,started:Date.now(),lastVideo:-1,lastPinch:false,selected:null});renderGame();showTask();loop()}catch(e){console.error(e);b.disabled=false;b.textContent='Retry AR Mission';document.querySelector('.notice').innerHTML=`เปิด AR ไม่สำเร็จ: ${String(e.message||e)}`}}
async function openCamera(){if(!navigator.mediaDevices?.getUserMedia)throw Error('CAMERA_NOT_SUPPORTED');S.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}}});const vision=await import(MP.module);const files=await vision.FilesetResolver.forVisionTasks(MP.wasm);const opt=d=>({baseOptions:{modelAssetPath:MP.model,delegate:d},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.38,minHandPresenceConfidence:.36,minTrackingConfidence:.36});try{S.detector=await vision.HandLandmarker.createFromOptions(files,opt('GPU'))}catch(_){S.detector=await vision.HandLandmarker.createFromOptions(files,opt('CPU'))}}
function renderGame(){shell(`<div class="game"><div class="head"><span class="chip">AR EASY</span><strong>Skyline Builder Mission</strong><span class="chip">V5.3</span></div><div class="stats"><div class="stat"><small>BUILDING</small><b id="progress">1 / 10</b></div><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>COMBO</small><b id="combo">×1</b></div></div><div class="sky"><div class="buildings">${[30,42,35,50,39,56,44,61,52,66].map((h,i)=>`<i class="building" data-b="${i}" style="--h:${h}px"></i>`).join('')}</div><div class="road"></div></div><section id="mission" class="mission"></section></div>`)}
function showTask(){if(S.index>=TASKS.length)return finish();const t=TASKS[S.index];S.placed=Array(t.answer.length).fill(null);S.selected=null;S.attempts=0;S.hover=null;carry.style.display='none';document.getElementById('mission').innerHTML=`<div class="prompt"><span class="visual">${t.visual}</span><h3>${t.prompt}</h3></div><div class="camera"><video id="video" autoplay muted playsinline></video><div id="toast" class="toast"></div><div id="status" class="status">กำลังค้นหามือ…<small>เป้าหมายใหญ่ขึ้นและจีบเบา ๆ ได้</small></div></div><div class="board"><div class="label">SENTENCE BLUEPRINT</div><div id="slots" class="slots"></div><div class="label">WORD DEPOT</div><div id="depot" class="depot"></div><button id="check" class="control ar-target">Build Sentence</button></div><div id="feedback" class="feedback">ภารกิจ ${S.index+1}/10 • ${t.kind} • CEFR ${t.level}</div>`;const v=document.getElementById('video');v.srcObject=S.stream;v.play().catch(()=>{});renderBoard();speak(t.prompt.replace('___','blank'));updateHud()}
function renderBoard(){const t=TASKS[S.index],slots=document.getElementById('slots'),depot=document.getElementById('depot');slots.innerHTML=S.placed.map((x,i)=>`<button class="slot ar-target${x?' filled':''}" data-slot="${i}">${x||'วางคำ'}</button>`).join('');const used=new Set(S.placed.filter(Boolean));depot.innerHTML=t.tokens.map((x,i)=>`<button class="word ar-target${used.has(x)?' used':''}${S.selected===x?' selected':''}" data-word="${i}">${x}</button>`).join('')}
function toast(text){const el=document.getElementById('toast');if(!el)return;el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),750)}
function activate(el){if(!el)return;const t=TASKS[S.index];if(el.dataset.word!=null){const word=t.tokens[Number(el.dataset.word)];if(S.placed.includes(word))return;S.selected=word;renderBoard();carry.textContent=word;carry.style.display='block';toast(`หยิบแล้ว: ${word}`);feedback(`กำลังถือ “${word}” • ชี้ช่องแล้วจีบเพื่อวาง`);beep(680)}else if(el.dataset.slot!=null){const i=Number(el.dataset.slot);if(S.selected){const word=S.selected;S.placed[i]=word;S.selected=null;renderBoard();carry.style.display='none';toast(`วางแล้ว: ${word}`);feedback('วางคำแล้ว • เลือกคำถัดไป');beep(880)}else if(S.placed[i]){S.selected=S.placed[i];S.placed[i]=null;renderBoard();carry.textContent=S.selected;carry.style.display='block';toast(`ยกขึ้น: ${S.selected}`)}}else if(el.id==='check')checkAnswer()}
function checkAnswer(){const t=TASKS[S.index];if(S.placed.some(x=>!x))return feedback('ยังวางคำไม่ครบทุกช่อง','bad');S.attempts++;const ok=norm(S.placed)===norm(t.answer);if(!ok){S.combo=0;feedback('โครงสร้างยังไม่ถูกต้อง • ลองสลับบล็อก','bad');beep(220);updateHud();return}if(S.attempts===1)S.first++;S.combo++;S.best=Math.max(S.best,S.combo);S.score+=150+(S.combo-1)*20;document.querySelector(`[data-b="${S.index}"]`)?.classList.add('lit');feedback('✓ Sentence complete! อาคารเปิดไฟแล้ว','good');beep(980);speak(t.answer.join(' '));updateHud();setTimeout(()=>{S.index++;showTask()},900)}
const norm=a=>a.join(' ').replace(/[?.!,]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
function feedback(text,type=''){const e=document.getElementById('feedback');if(e){e.textContent=text;e.className=`feedback ${type}`}}
function updateHud(){document.getElementById('progress').textContent=`${Math.min(S.index+1,10)} / 10`;document.getElementById('score').textContent=S.score;document.getElementById('combo').textContent=`×${Math.max(1,S.combo)}`}
function speak(text){if(!S.sound||!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.84;speechSynthesis.speak(u)}
function beep(freq){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.05;o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.07)}catch(_){}navigator.vibrate?.(35)}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function expandedTarget(x,y){let el=document.elementFromPoint(x,y)?.closest('.ar-target:not(.used)');if(el)return el;const candidates=[...document.querySelectorAll('.ar-target:not(.used)')];let best=null,bestD=84;for(const c of candidates){const r=c.getBoundingClientRect(),cx=Math.max(r.left,Math.min(x,r.right)),cy=Math.max(r.top,Math.min(y,r.bottom)),d=Math.hypot(x-cx,y-cy);if(d<bestD){best=c;bestD=d}}return best}
function loop(){const v=document.getElementById('video');if(v&&v.readyState>=2&&v.currentTime!==S.lastVideo){S.lastVideo=v.currentTime;const r=S.detector.detectForVideo(v,performance.now()),hand=r.landmarks?.[0];if(hand){const tip=hand[8],thumb=hand[4],x=(1-tip.x)*innerWidth,y=tip.y*innerHeight;pointer.hidden=false;pointer.style.left=`${x}px`;pointer.style.top=`${y}px`;pointer.style.transform='translate(-50%,-50%)';if(S.selected){carry.style.left=`${x+28}px`;carry.style.top=`${y-22}px`}document.querySelectorAll('.focus').forEach(e=>e.classList.remove('focus'));const target=expandedTarget(x,y);target?.classList.add('focus');if(target!==S.hover){S.hover=target;S.hoverSince=performance.now()}const gap=dist(tip,thumb),pinch=S.lastPinch?gap<.105:gap<.075;pointer.classList.toggle('pinch',pinch);const status=document.getElementById('status');if(status)status.innerHTML=S.selected?`กำลังถือ “${S.selected}”<small>ชี้ช่องแล้วจีบเพื่อวาง</small>`:target?`เล็งที่ “${target.textContent.trim()}”<small>จีบเบา ๆ หรือค้าง 0.8 วินาที</small>`:'ขยับนิ้วไปใกล้คำหรือช่อง<small>มีเขตจับรอบเป้าหมายแล้ว</small>';const dwell=target&&performance.now()-S.hoverSince>800;if((pinch&&!S.lastPinch||dwell)&&performance.now()-S.lastAction>520){S.lastAction=performance.now();S.hoverSince=performance.now()+9999;activate(target)}S.lastPinch=pinch}else{pointer.hidden=true;S.lastPinch=false;S.hover=null;const st=document.getElementById('status');if(st)st.innerHTML='ยังไม่พบมือ<small>ยกมือให้เห็นนิ้วชี้และนิ้วโป้ง</small>'}}S.raf=requestAnimationFrame(loop)}
function stop(){cancelAnimationFrame(S.raf);S.stream?.getTracks?.().forEach(t=>t.stop());try{S.detector?.close?.()}catch(_){}S.stream=null;S.detector=null;pointer.hidden=true;carry.style.display='none'}
function finish(){stop();const acc=Math.round(S.first/10*100);shell(`<div class="summary"><div class="mark">🏙️✨</div><h1>Skyline Complete!</h1><div class="summary-grid"><div class="stat"><small>FIRST-TRY</small><b>${acc}%</b></div><div class="stat"><small>SCORE</small><b>${S.score}</b></div><div class="stat"><small>BEST COMBO</small><b>×${Math.max(1,S.best)}</b></div><div class="stat"><small>AR MISSIONS</small><b>10/10</b></div></div><div class="notice">โหมดทดสอบ • ยังไม่ส่งผลเข้า Firebase</div><div class="actions"><button id="again" class="btn primary">Build Another Skyline</button><button id="done" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('again').onclick=intro;document.getElementById('done').onclick=goBack}
function goBack(){stop();location.href='./game-test-hub.html?v=20260806-scv53'}
document.getElementById('back').onclick=goBack;document.getElementById('sound').onclick=()=>{S.sound=!S.sound;document.getElementById('sound').textContent=S.sound?'🔊':'🔇';if(!S.sound)speechSynthesis?.cancel()};window.addEventListener('pagehide',stop);intro();
</script></body></html>
