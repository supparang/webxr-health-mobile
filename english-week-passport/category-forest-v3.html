const TH={Academic:'วิชาการ',Research:'การวิจัย',Communication:'การสื่อสาร',Time:'เวลา',Technology:'เทคโนโลยี',Workplace:'การทำงาน'};const ICON={Academic:'🎓',Research:'🔎',Communication:'💬',Time:'⏱️',Technology:'💻',Workplace:'🏢'};

function tone(f,d=.07){if(!S.sound)return;try{S.audio=S.audio||new(window.AudioContext||window.webkitAudioContext)();if(S.audio.state==='suspended')S.audio.resume();const o=S.audio.createOscillator(),g=S.audio.createGain(),t=S.audio.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.03,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(S.audio.destination);o.start(t);o.stop(t+d)}catch(_){}}

function intro(){shell(`<div class="intro"><div class="forest-mark">🌲✨</div><div class="series">LEXICON X CHALLENGE • GAME 2</div><h1>Category Forest</h1><h2>ภารกิจประตูป่าจัดหมวดคำ</h2><p class="lead">ลากคำศัพท์ไปยังประตูหมวดหมู่ แล้วช่วยคำที่หลงป่ากลับบ้าน</p><div class="feature-row"><div class="feature"><b>👆</b>ลาก–ปล่อยจริง</div><div class="feature"><b>🔊</b>ฟังเสียงคำศัพท์</div><div class="feature"><b>🛟</b>Lost Words Rescue</div></div><div class="notice"><strong>วิธีเล่น</strong><br><small>ลากการ์ดลงไปยังประตู แล้วปล่อยเมื่อประตูเรืองแสง</small></div><div class="actions"><button id="start" class="btn primary">Start Portal Mission</button><button id="sound" class="btn secondary">${S.sound?'🔊':'🔇'} Sound</button><button id="home" class="btn secondary">Back to Test Hub</button></div></div>`);start.onclick=begin;sound.onclick=()=>{S.sound=!S.sound;intro()};home.onclick=hub}
function round(){S.cats=shuffle(Object.keys(BANK)).slice(0,3);let a=[];S.cats.forEach(c=>BANK[c].forEach((x,i)=>a.push({id:c+x[0],word:x[0],thai:x[1],level:x[2],hint:x[3],cat:c,attempts:0})));S.items=shuffle(a).slice(0,10)}

function item(){return S.items[S.index]}function say(){if(!item()||!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(item().word);u.lang='en-US';u.rate=.83;S.speechCount++;window.speechSynthesis.speak(u)}
function hud(){if(!progress)return;const total=S.phase==='main'?10:S.items.length,done=S.phase==='rescue'?S.index:S.correct,sec=Math.floor((Date.now()-S.started)/1000),pct=S.phase==='main'?S.correct*10:100;progress.textContent=S.index+' / '+total;pLabel.textContent=S.phase==='rescue'?'RESCUED':'TRAIL';score.textContent=S.score;time.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');combo.textContent='COMBO ×'+Math.max(1,S.combo);energyFill.style.width=pct+'%';energyLabel.textContent=pct+'%';scene.className='scene stage'+(pct>=100?3:pct>=70?2:pct>=40?1:0);document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('done',i<done));hero.style.left=(7+Math.min(done,total)*(82/total))+'%';mode.className='mode-chip '+(S.phase==='rescue'?'rescue':S.rush?'rush':'');mode.textContent=S.phase==='rescue'?'RESCUE':S.rush?'RUSH':'FOREST'}
function show(){if(S.index>=S.items.length){if(S.phase==='main'&&S.missed.size)return rescue();return finish()}S.locked=false;wordCard.innerHTML=`<strong>${item().word}</strong><small>${item().thai}</small><em>CEFR ${item().level} • DRAG TO PORTAL</em>`;instruction.textContent=S.phase==='rescue'?'ช่วยคำที่หลงป่า • ใช้คำใบ้':'แตะค้างแล้วลากคำศัพท์ไปยังประตู';hint.classList.remove('show');drag(wordCard);if(S.phase==='rescue')tip(item().hint);if(S.phase==='main'&&S.index===5&&!S.rush){S.rush=true;S.rushRemaining=3;instruction.textContent='⚡ FOREST RUSH • รับโบนัสความเร็ว'}hud()}
function drag(card){let sx,sy,ghost,lastX,lastY,dist=0;card.onpointerdown=e=>{if(S.locked)return;e.preventDefault();card.setPointerCapture(e.pointerId);sx=lastX=e.clientX;sy=lastY=e.clientY;S.drag={t:performance.now(),id:e.pointerId};ghost=document.createElement('div');ghost.className='drag-ghost';ghost.innerHTML=card.innerHTML;document.body.appendChild(ghost);wordWrap.classList.add('lifting');move(e)};card.onpointermove=e=>{if(!S.drag||S.drag.id!==e.pointerId)return;dist+=Math.hypot(e.clientX-lastX,e.clientY-lastY);lastX=e.clientX;lastY=e.clientY;move(e);highlight(e.clientX,e.clientY)};card.onpointerup=e=>{if(!S.drag)return;const p=at(e.clientX,e.clientY),d={t:S.drag.t,distance:Math.round(dist)};S.drag=null;ghost?.remove();wordWrap.classList.remove('lifting');document.querySelectorAll('.portal').forEach(x=>x.classList.remove('hover'));if(!p)return instruction.textContent='ลากจนประตูเรืองแสง แล้วจึงปล่อย';judge(p,d)};function move(e){if(ghost){ghost.style.left=(e.clientX-120)+'px';ghost.style.top=(e.clientY-55)+'px'}}}
function at(x,y){let f;document.querySelectorAll('.portal').forEach(p=>{const r=p.getBoundingClientRect(),d=15;if(x>=r.left-d&&x<=r.right+d&&y>=r.top-d&&y<=r.bottom+d)f=p});return f}function highlight(x,y){const f=at(x,y);document.querySelectorAll('.portal').forEach(p=>p.classList.toggle('hover',p===f))}function tip(t){hint.textContent='💡 '+t;hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),2600)}
function judge(p,d){if(S.locked)return;S.locked=true;const x=item(),cat=p.dataset.cat,good=cat===x.cat,first=!S.seen.has(x.id);S.seen.add(x.id);S.events.push({phase:S.phase,word:x.word,expected:x.cat,selected:cat,correct:good,firstTry:first,reactionMs:Math.round(performance.now()-d.t),dragPx:d.distance});if(good){if(S.phase==='main'){S.correct++;if(first)S.firstTryCorrect++}else S.rescueCorrect++;S.combo++;S.bestCombo=Math.max(S.bestCombo,S.combo);let gain=S.phase==='rescue'?70:100+(S.combo-1)*20;if(S.rush&&S.phase==='main'){gain+=50;S.rushBonus+=50;if(--S.rushRemaining<=0)S.rush=false}S.score+=gain;p.classList.add('correct-flash');instruction.textContent='✓ ถูกต้อง';tone(820);S.index++;hud();setTimeout(()=>{p.classList.remove('correct-flash');show()},480)}else{S.wrong++;S.combo=0;if(S.phase==='main')S.missed.set(x.id,{...x});S.score=Math.max(0,S.score-15);p.classList.add('wrong-flash');instruction.textContent='ยังไม่ใช่ '+TH[cat]+' • ดูคำใบ้';tip(x.hint);tone(170);hud();setTimeout(()=>{p.classList.remove('wrong-flash');S.locked=false},380)}}
function rescue(){S.phase='rescue';S.items=shuffle([...S.missed.values()]);S.rescueTotal=S.items.length;S.rescueCorrect=0;S.index=0;S.combo=0;S.rush=false;trail.innerHTML='<i class="step"></i>'.repeat(Math.max(1,S.items.length));show()}
function finish(){clearInterval(S.timer);window.speechSynthesis?.cancel?.();const sec=Math.floor((Date.now()-S.started)/1000),first=Math.round(S.firstTryCorrect/10*100),mastery=100,rank=first>=90?'S':first>=80?'A':first>=70?'B':'C',message=S.rescueTotal?`คุณจำแนกถูกตั้งแต่ครั้งแรก <strong>${S.firstTryCorrect} จาก 10 คำ</strong><br>ช่วยคำที่หลงป่าสำเร็จ <strong>${S.rescueCorrect} จาก ${S.rescueTotal} คำ</strong>`:`คุณจำแนกถูกตั้งแต่ครั้งแรก <strong>10 จาก 10 คำ</strong><br>ไม่มีคำศัพท์หลงป่า — ยอดเยี่ยมมาก!`;shell(`<div class="summary"><div class="series">LEXICON X CHALLENGE • GAME 2</div><div class="rank">${rank}</div><h1>Forest Cleared!</h1><h2>Category Forest • Portal Mission</h2>${S.rescueTotal?`<div class="rescue-banner">LOST WORDS RESCUE • ${S.rescueCorrect}/${S.rescueTotal}</div>`:'<div class="perfect">PERFECT FOREST</div>'}<div class="summary-grid"><div class="stat"><small>FIRST-TRY</small><strong>${first}%</strong></div><div class="stat"><small>FINAL MASTERY</small><strong>${mastery}%</strong></div><div class="stat"><small>SCORE</small><strong>${S.score}</strong></div><div class="stat"><small>BEST COMBO</small><strong>×${Math.max(1,S.bestCombo)}</strong></div><div class="stat"><small>RUSH BONUS</small><strong>+${S.rushBonus}</strong></div><div class="stat"><small>RANK</small><strong>${rank}</strong></div></div><div class="learning-card">${message}<br><span style="color:#9bc8ba">เวลา ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} • ฟังเสียง ${S.speechCount} ครั้ง</span></div><div class="summary-actions"><button id="again" class="btn primary">Play Another Forest</button><button id="done" class="btn secondary">Back to Test Hub</button></div></div>`);again.onclick=begin;done.onclick=hub;setTimeout(()=>again.scrollIntoView({block:'nearest'}),80)}
back.onclick=hub;exit.onclick=hub;window.CATEGORY_FOREST={version:VERSION,state:S};intro();
