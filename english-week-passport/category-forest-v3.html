<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071b18">
<title>Category Forest V3 • Direct Tap</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#ecfff8;background:#04110f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 0,#174b3f,#071b18 44%,#030a09);overscroll-behavior:none}body{position:fixed;inset:0}.app{height:100dvh;padding:max(env(safe-area-inset-top),4px) 8px max(env(safe-area-inset-bottom),4px);display:grid;grid-template-rows:54px minmax(0,1fr)}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:760px;width:100%;margin:auto}.brand{text-align:center}.brand strong{display:block}.brand small{font-size:.62rem;color:#9fe8d2}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#16493d;color:#86ffd8;font-weight:950}.icon{width:42px;height:42px;border:1px solid #2b6658;border-radius:13px;background:#0c2a24;color:#fff;font-size:1.05rem}.screen{width:100%;height:100%;min-height:0;max-width:760px;margin:auto}.panel{height:100%;background:rgba(7,28,24,.92);border:1px solid rgba(116,239,196,.25);border-radius:18px;padding:8px;overflow:hidden}.intro,.summary{height:100%;overflow:auto;text-align:center;padding:18px 14px}.series{display:inline-flex;padding:4px 8px;border-radius:999px;background:#16493d;color:#86ffd8;font-size:.64rem;font-weight:950}.lead{color:#b8d8ce;line-height:1.5}.notice,.rank-label{background:#0b3029;border:1px solid #2c685a;border-radius:13px;padding:10px;color:#d0e9e0;margin-top:10px}.actions{display:grid;gap:9px;margin-top:16px}.btn{border:0;border-radius:15px;padding:14px 18px;font-weight:950;font-size:1rem;min-height:50px}.primary{background:linear-gradient(135deg,#38d996,#8ef0cb);color:#063526}.secondary{background:#103b33;color:#e8fff6;border:1px solid #2e685b}.game-head{height:35px;display:flex;align-items:center;justify-content:center;position:relative}.sound-mini{position:absolute;right:0;width:38px;height:34px;border:1px solid #2c685a;border-radius:10px;background:#103b33;color:#fff}.hud{height:58px;display:grid;grid-template-columns:1.25fr .8fr .8fr;gap:6px;margin-bottom:5px}.stat{background:#0b3029;border:1px solid #2c685a;border-radius:12px;padding:7px 9px;display:flex;flex-direction:column;justify-content:center}.stat small{color:#8ebbad;font-size:.61rem}.stat strong{font-size:1rem;margin-top:3px}.instruction{height:42px;display:flex;align-items:center;justify-content:center;text-align:center;background:#0b3029;border-radius:12px;padding:5px 8px;margin:0 0 5px;font-size:.79rem;font-weight:850}.play{height:calc(100% - 145px);display:grid;grid-template-rows:minmax(0,1fr) 39%;gap:7px}.word-zone{display:flex;align-items:center;justify-content:center;position:relative;border-radius:16px;background:radial-gradient(circle,rgba(70,190,145,.14),rgba(6,22,19,.2));border:1px solid rgba(101,220,179,.16)}.word-card{width:min(78%,360px);min-height:130px;border:2px solid #72f0c4;border-radius:20px;background:linear-gradient(145deg,#e9fff7,#bff2df);color:#082f24;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 18px 36px rgba(0,0,0,.28);touch-action:manipulation}.word-card.selected{box-shadow:0 0 0 5px rgba(255,231,124,.4),0 18px 36px rgba(0,0,0,.32);transform:scale(1.025)}.word-card strong{font-size:clamp(1.35rem,7vw,2rem)}.word-card small{font-weight:850;color:#2d6857}.combo{position:absolute;top:8px;left:10px;color:#9fe8d2;font-weight:950}.groves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.grove{border:1px solid #2d695b;border-radius:15px;background:linear-gradient(180deg,#134b3e,#0a2b24);color:#effff9;padding:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;min-width:0;touch-action:manipulation}.grove:active{transform:scale(.96);border-color:#87ffd8}.grove .tree{font-size:1.75rem}.grove strong{font-size:.72rem}.grove small{font-size:.53rem;color:#9bc7b8}.rank{font-size:3.4rem;font-weight:950;color:#7dffca}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}.summary-grid .stat{min-height:63px}.flash-good{animation:good .35s}.flash-bad{animation:bad .35s}@keyframes good{50%{transform:scale(1.06)}}@keyframes bad{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}@media(max-height:700px){.app{grid-template-rows:46px minmax(0,1fr)}.game-head{height:28px}.hud{height:50px}.instruction{height:36px}.play{height:calc(100% - 124px)}.word-card{min-height:100px}.grove .tree{font-size:1.35rem}}
</style>
</head>
<body><div class="app"><header class="top"><button id="back" class="icon" type="button">←</button><div class="brand"><strong>Category Forest</strong><small><span class="badge">LEXICON X • GAME 2</span> Direct Tap V3</small></div><button id="exit" class="icon" type="button">⌂</button></header><main id="screen" class="screen"></main></div>
<script>
(()=>{"use strict";
const screen=document.getElementById('screen');
const BANK={Academic:[['assignment','งานที่ได้รับมอบหมาย','A2'],['lecture','การบรรยาย','A2'],['curriculum','หลักสูตร','B1'],['scholarship','ทุนการศึกษา','B1']],Research:[['evidence','หลักฐาน','B1'],['survey','แบบสำรวจ','A2+'],['hypothesis','สมมติฐาน','B1+'],['analysis','การวิเคราะห์','B1']],Communication:[['feedback','ข้อมูลป้อนกลับ','B1'],['presentation','การนำเสนอ','A2+'],['clarify','ชี้แจง','B1'],['negotiate','เจรจา','B1+']],Time:[['deadline','กำหนดส่ง','A2+'],['schedule','ตารางเวลา','A2'],['postpone','เลื่อนออกไป','B1'],['duration','ระยะเวลา','B1']],Technology:[['database','ฐานข้อมูล','A2+'],['device','อุปกรณ์','A2'],['software','ซอฟต์แวร์','A2'],['network','เครือข่าย','A2+']],Workplace:[['colleague','เพื่อนร่วมงาน','A2+'],['responsibility','ความรับผิดชอบ','B1'],['supervisor','ผู้ควบคุมงาน','B1'],['collaboration','การทำงานร่วมกัน','B1+']]};
const TH={Academic:'วิชาการ',Research:'การวิจัย',Communication:'การสื่อสาร',Time:'เวลา',Technology:'เทคโนโลยี',Workplace:'การทำงาน'},ICON={Academic:'🎓',Research:'🔎',Communication:'💬',Time:'⏱️',Technology:'💻',Workplace:'🏢'};
const S={items:[],cats:[],index:0,score:0,correct:0,wrong:0,combo:0,best:0,started:0,timer:0,sound:true,selected:false,locked:false,audio:null};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};
const shell=x=>screen.innerHTML='<section class="panel">'+x+'</section>';
function tone(f,d=.07){if(!S.sound)return;try{S.audio=S.audio||new(window.AudioContext||window.webkitAudioContext)();if(S.audio.state==='suspended')S.audio.resume();const o=S.audio.createOscillator(),g=S.audio.createGain(),t=S.audio.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(S.audio.destination);o.start(t);o.stop(t+d)}catch(_){}}
function hub(){clearInterval(S.timer);location.href='./game-test-hub.html?v=20260805-category3'}
function intro(){shell(`<div class="intro"><div style="font-size:3rem">🌲</div><div class="series">LEXICON X CHALLENGE • GAME 2</div><h1>Category Forest</h1><h2>ป่าจำแนกหมวดหมู่คำศัพท์</h2><p class="lead">แตะการ์ดคำศัพท์ แล้วแตะหมวดหมู่ที่ถูกต้อง</p><div class="notice"><strong>Direct Tap V3</strong><br><small>หนึ่งการแตะประมวลผลหนึ่งครั้ง ไม่มี event ซ้อน</small></div><div class="actions"><button id="startBtn" class="btn primary">Start Mission</button><button id="soundBtn" class="btn secondary">${S.sound?'🔊':'🔇'} Sound</button><button id="homeBtn" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('startBtn').onclick=start;document.getElementById('soundBtn').onclick=toggleSound;document.getElementById('homeBtn').onclick=hub}
function toggleSound(){S.sound=!S.sound;const b=document.getElementById('soundBtn')||document.getElementById('soundMini');if(b)b.textContent=S.sound?'🔊':'🔇'}
function round(){S.cats=shuffle(Object.keys(BANK)).slice(0,3);const all=[];S.cats.forEach(c=>shuffle(BANK[c]).slice(0,4).forEach(x=>all.push({word:x[0],thai:x[1],level:x[2],cat:c})));S.items=shuffle(all).slice(0,10)}
function start(){round();Object.assign(S,{index:0,score:0,correct:0,wrong:0,combo:0,best:0,started:Date.now(),selected:false,locked:false});shell(`<div class="game-head"><strong>Category Forest</strong><button id="soundMini" class="sound-mini">${S.sound?'🔊':'🔇'}</button></div><div class="hud"><div class="stat"><small>PROGRESS</small><strong id="progress">0 / 10</strong></div><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>TIME</small><strong id="time">0:00</strong></div></div><div id="instruction" class="instruction">แตะคำศัพท์ แล้วแตะหมวดหมู่</div><div class="play"><div class="word-zone"><div id="combo" class="combo">COMBO ×1</div><button id="wordCard" class="word-card" type="button"></button></div><div id="groves" class="groves">${S.cats.map(c=>`<button class="grove" data-cat="${c}" type="button"><div class="tree">${ICON[c]}</div><strong>${c}</strong><small>${TH[c]}</small></button>`).join('')}</div></div>`);document.getElementById('soundMini').onclick=toggleSound;document.getElementById('wordCard').onclick=selectCard;document.querySelectorAll('.grove').forEach(g=>g.onclick=()=>judge(g.dataset.cat));show();clearInterval(S.timer);S.timer=setInterval(hud,500)}
function selectCard(){if(S.locked)return;S.selected=true;const c=document.getElementById('wordCard');c.classList.add('selected');document.getElementById('instruction').textContent='เลือกแล้ว • แตะหมวดหมู่ด้านล่าง';tone(360)}
function hud(){const p=document.getElementById('progress');if(!p)return;const sec=Math.floor((Date.now()-S.started)/1000);p.textContent=S.correct+' / 10';document.getElementById('score').textContent=S.score;document.getElementById('time').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');document.getElementById('combo').textContent='COMBO ×'+Math.max(1,S.combo)}
function show(){if(S.index>=S.items.length){finish();return}const x=S.items[S.index],c=document.getElementById('wordCard');S.selected=false;S.locked=false;c.className='word-card';c.innerHTML=`<strong>${x.word}</strong><small>${x.thai} • ${x.level}</small>`;document.getElementById('instruction').textContent='แตะการ์ดเพื่อเลือก แล้วแตะหมวดหมู่'}
function judge(cat){if(S.locked)return;if(!S.selected){document.getElementById('instruction').textContent='กรุณาแตะการ์ดคำศัพท์ก่อน';tone(180);return}S.locked=true;const x=S.items[S.index],card=document.getElementById('wordCard'),good=cat===x.cat;if(good){S.correct++;S.combo++;S.best=Math.max(S.best,S.combo);S.score+=100+(S.combo-1)*20;card.classList.add('flash-good');document.getElementById('instruction').textContent='✓ ถูกต้อง • กำลังไปคำถัดไป';tone(820);S.index++;hud();setTimeout(show,350)}else{S.wrong++;S.combo=0;S.score=Math.max(0,S.score-15);card.classList.add('flash-bad');document.getElementById('instruction').textContent=`ยังไม่ใช่ ${TH[cat]} • เลือกใหม่`;tone(170);S.selected=false;hud();setTimeout(()=>{card.classList.remove('selected','flash-bad');S.locked=false},350)}}
function finish(){clearInterval(S.timer);const sec=Math.max(1,Math.floor((Date.now()-S.started)/1000)),acc=Math.round(S.correct/Math.max(1,S.correct+S.wrong)*100),rank=acc>=90?'S':acc>=80?'A':acc>=70?'B':'C';shell(`<div class="summary"><div class="series">LEXICON X CHALLENGE • GAME 2</div><div class="rank">${rank}</div><h1>Mission Complete</h1><h2>Category Forest</h2><div class="summary-grid"><div class="stat"><small>ACCURACY</small><strong>${acc}%</strong></div><div class="stat"><small>SCORE</small><strong>${S.score}</strong></div><div class="stat"><small>BEST COMBO</small><strong>×${Math.max(1,S.best)}</strong></div><div class="stat"><small>TIME</small><strong>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</strong></div><div class="stat"><small>MISTAKES</small><strong>${S.wrong}</strong></div><div class="stat"><small>RANK</small><strong>${rank}</strong></div></div><div class="actions"><button id="againBtn" class="btn primary">Play Again</button><button id="doneBtn" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('againBtn').onclick=start;document.getElementById('doneBtn').onclick=hub;tone(1000,.15)}
document.getElementById('back').onclick=hub;document.getElementById('exit').onclick=hub;intro();
})();
</script></body></html>
