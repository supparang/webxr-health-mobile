:relative;overflow:hidden;transition:transform .16s,border-color .16s,box-shadow .16s,filter .16s}.portal:before{content:"";position:absolute;inset:8px 18%;border:2px solid rgba(127,248,205,.25);border-radius:50% 50% 44% 44%;box-shadow:inset 0 0 16px rgba(125,255,211,.1)}.portal .tree{font-size:1.55rem;z-index:1;filter:drop-shadow(0 0 8px rgba(114,240,196,.25))}.portal strong{font-size:.69rem;line-height:1.1;overflow-wrap:anywhere;z-index:1}.portal small{font-size:.51rem;color:#a2cdbf;z-index:1}.portal span{font-size:.47rem;color:#6fae9a;z-index:1}.portal.hover{transform:translateY(-7px) scale(1.045);border-color:#ffe277;box-shadow:0 0 25px rgba(255,226,119,.3);filter:brightness(1.15)}.portal.correct-flash{animation:portalGood .55s ease}.portal.wrong-flash{animation:portalBad .4s ease}.hint{position:absolute;left:8px;right:8px;bottom:4px;z-index:20;background:rgba(4,19,16,.96);border:1px solid #f0c86a;border-radius:12px;padding:7px 10px;text-align:center;color:#ffe9aa;font-size:.69rem;font-weight:850;transform:translateY(120%);opacity:0;transition:.22s}.hint.show{transform:translateY(0);opacity:1}.float{position:fixed;z-index:1000;font-weight:950;font-size:1.2rem;pointer-events:none;animation:floatUp .8s ease forwards}.float.good{color:#7dffca}.float.bad{color:#ff9b9b}.rank{font-size:3.4rem;font-weight:950;color:#7dffca}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.summary-grid .stat{min-height:61px}.perfect{margin:8px auto;padding:10px;border-radius:13px;background:linear-gradient(135deg,#ffe66d,#ffbd59);color:#3b2700;font-weight:950}.analytics-note{font-size:.67rem;color:#91beaf;margin-top:8px;line-height:1.45}@keyframes cardFloat{50%{transform:translateY(-6px);box-shadow:0 23px 40px rgba(0,0,0,.3),0 0 34px rgba(114,240,196,.28)}}@keyframes correctPop{50%{transform:scale(1.08);filter:brightness(1.12)}}@keyframes wrongShake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-3px)}}@keyframes portalGood{50%{filter:brightness(1.7);box-shadow:0 0 35px rgba(119,255,199,.55)}}@keyframes portalBad{30%,70%{transform:translateX(-4px)}50%{transform:translateX(4px)}}@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-78px)}}@keyframes spark{to{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.1)}}@media(max-height:700px){.app{grid-template-rows:46px minmax(0,1fr)}.game-head{height:28px}.hud{height:48px}.mission{height:46px}.instruction{height:19px;font-size:.67rem}.play{height:calc(100% - 127px)}.word-card{min-height:96px;padding:11px}.portal .tree{font-size:1.25rem}.portal strong{font-size:.59rem}.hero{font-size:1.25rem}}@media(max-width:380px){.brand small{font-size:.53rem}.portal{padding:4px}.portal strong{font-size:.58rem}.portal small{font-size:.46rem}.feature{font-size:.59rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<div class="app"><header class="top"><button id="back" class="icon" type="button" aria-label="กลับ">←</button><div class="brand"><strong>Category Forest</strong><small><span class="badge">LEXICON X • GAME 2</span> Forest Portal Mission</small></div><button id="exit" class="icon" type="button" aria-label="หน้าเกมทดสอบ">⌂</button></header><main id="screen" class="screen"></main></div>
<script>
(function(){"use strict";
const VERSION='2026-08-05-CATEGORY-FOREST-PORTAL-V3';
const screen=document.getElementById('screen');
const BANK={
  Academic:[['assignment','งานที่ได้รับมอบหมาย','A2'],['lecture','การบรรยาย','A2'],['curriculum','หลักสูตร','B1'],['scholarship','ทุนการศึกษา','B1'],['seminar','สัมมนา','B1']],
  Research:[['evidence','หลักฐาน','B1'],['survey','แบบสำรวจ','A2+'],['hypothesis','สมมติฐาน','B1+'],['analysis','การวิเคราะห์','B1'],['participant','ผู้เข้าร่วม','B1']],
  Communication:[['feedback','ข้อมูลป้อนกลับ','B1'],['presentation','การนำเสนอ','A2+'],['clarify','ชี้แจง','B1'],['negotiate','เจรจา','B1+'],['announce','ประกาศ','A2+']],
  Time:[['deadline','กำหนดส่ง','A2+'],['schedule','ตารางเวลา','A2'],['postpone','เลื่อนออกไป','B1'],['duration','ระยะเวลา','B1'],['punctual','ตรงต่อเวลา','B1+']],
  Technology:[['database','ฐานข้อมูล','A2+'],['device','อุปกรณ์','A2'],['software','ซอฟต์แวร์','A2'],['network','เครือข่าย','A2+'],['algorithm','ขั้นตอนวิธี','B1']],
  Workplace:[['colleague','เพื่อนร่วมงาน','A2+'],['responsibility','ความรับผิดชอบ','B1'],['supervisor','ผู้ควบคุมงาน','B1'],['collaboration','การทำงานร่วมกัน','B1+'],['professional','เป็นมืออาชีพ','B1']]
};
const TH={Academic:'วิชาการ',Research:'การวิจัย',Communication:'การสื่อสาร',Time:'เวลาและกำหนดการ',Technology:'เทคโนโลยี',Workplace:'การทำงาน'};
const ICON={Academic:'🎓',Research:'🔎',Communication:'💬',Time:'⏱️',Technology:'💻',Workplace:'🏢'};
const S={round:0,items:[],cats:[],index:0,score:0,correct:0,wrong:0,combo:0,bestCombo:0,energy:0,started:0,timer:0,sound:true,audio:null,drag:null,events:[],rush:false,rushStartIndex:5,rushEndIndex:8,rushDeadline:0,rushBonus:0,lastSpark:0,hintTimer:0};
function shell(x){screen.innerHTML='<section class="panel">'+x+'</section>';}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function tone(f,d=.07,type='sine',g=.035,delay=0){if(!S.sound)return;try{if(!S.audio)S.audio=new (window.AudioContext||window.webkitAudioContext)();if(S.audio.state==='suspended')S.audio.resume();const o=S.audio.createOscillator(),x=S.audio.createGain(),t=S.audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);x.gain.setValueAtTime(g,t);x.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(x);x.connect(S.audio.destination);o.start(t);o.stop(t+d);}catch(_){}}
function h(p){try{navigator.vibrate?.(p)}catch(_){}}
function sfx(k){if(k==='lift'){tone(390,.04,'triangle',.018);h(8)}else if(k==='good'){tone(760,.08,'triangle',.045);tone(1020,.1,'triangle',.035,.07);h([16,25,24])}else if(k==='bad'){tone(170,.12,'sawtooth',.018);h([15,25,15])}else if(k==='rush'){tone(520,.08,'triangle',.035);tone(760,.1,'triangle',.035,.08);tone(980,.13,'triangle',.03,.18)}else if(k==='finish'){tone(620,.1,'triangle',.04);tone(840,.12,'triangle',.035,.1);tone(1080,.16,'triangle',.03,.22);h([20,30,40])}}
function goHub(){clearInterval(S.timer);location.href='./game-test-hub.html?v=20260805-category-portal-v3';}
function intro(){shell(`<div class="intro"><div class="forest-mark">🌲✨</div><div class="series">LEXICON X CHALLENGE • GAME 2</div><h1>Category Forest</h1><h2>ภารกิจประตูป่าจัดหมวดคำ</h2><p class="lead">ลากการ์ดคำศัพท์เรืองแสงไปยังประตูหมวดหมู่ที่ถูกต้อง แล้วพาผู้พิทักษ์เดินทางออกจากป่า</p><div class="feature-row"><div class="feature"><b>🫳</b>ลาก–ปล่อยจริง</div><div class="feature"><b>🔥</b>Combo & Energy</div><div class="feature"><b>⚡</b>Forest Rush</div></div><div class="notice"><strong>วิธีเล่น</strong><br><small>แตะค้างที่การ์ด ลากลงไปยังประตู แล้วปล่อยเมื่อประตูเรืองแสง • ตอบผิดจะมีคำใบ้และให้ลองใหม่</small></div><div class="actions"><button id="start" class="btn primary">Start Portal Mission</button><button id="sound" class="btn secondary">${S.sound?'🔊':'🔇'} Sound</button><button id="home" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('start').onclick=start;document.getElementById('home').onclick=goHub;document.getElementById('sound').onclick=()=>{S.sound=!S.sound;intro()};}
function makeRound(){const cats=shuffle(Object.keys(BANK)).slice(0,3),items=[];cats.forEach(cat=>shuffle(BANK[cat]).slice(0,4).forEach(x=>items.push({word:x[0],thai:x[1],level:x[2],cat})));return{cats,items:shuffle(items).slice(0,10)};}
function start(){const r=makeRound();Object.assign(S,{round:S.round+1,items:r.items,cats:r.cats,index:0,score:0,correct:0,wrong:0,combo:0,bestCombo:0,energy:0,started:Date.now(),events:[],rush:false,rushDeadline:0,rushBonus:0});shell(`<div class="game-head"><span id="rushChip" class="rush-chip">FOREST ENERGY</span><strong>Forest Portal Mission</strong><button id="soundMini" class="sound-mini">${S.sound?'🔊':'🔇'}</button></div><div class="hud"><div class="stat"><small>TRAIL</small><strong id="progress">0 / 10</strong></div><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>TIME</small><strong id="time">0:00</strong></div></div><div class="mission"><div id="instruction" class="instruction">ลากคำศัพท์ไปยังประตูหมวดหมู่</div><div class="energy"><div id="energyFill" class="energy-fill"></div><div id="energyLabel" class="energy-label">FOREST ENERGY 0%</div></div></div><div class="play"><div class="scene"><div class="moon"></div><div id="combo" class="combo">COMBO ×1</div><div id="rushClock" class="rush-clock"><i></i></div><div id="hero" class="hero">🧭</div><div id="trail" class="trail">${Array.from({length:10},(_,i)=>`<i class="step" data-step="${i}"></i>`).join('')}</div><div id="wordCard" class="word-card"></div><div id="hint" class="hint"></div></div><div id="portals" class="portals">${S.cats.map(c=>`<div class="portal" data-cat="${c}" role="button" aria-label="${c} ${TH[c]}"><div class="tree">${ICON[c]}</div><strong>${c}</strong><small>${TH[c]}</small><span>DROP PORTAL</span></div>`).join('')}</div></div>`);document.getElementById('soundMini').onclick=()=>{S.sound=!S.sound;document.getElementById('soundMini').textContent=S.sound?'🔊':'🔇'};showWord();clearInterval(S.timer);S.timer=setInterval(hud,100);}
function hud(){const p=document.getElementById('progress');if(!p)return;const sec=Math.floor((Date.now()-S.started)/1000);p.textContent=S.correct+' / 10';document.getElementById('score').textContent=S.score;document.getElementById('time').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');const c=document.getElementById('combo');c.textContent='COMBO ×'+Math.max(1,S.combo);c.classList.toggle('hot',S.combo>=3);document.getElementById('energyFill').style.width=Math.min(100,S.energy)+'%';document.getElementById('energyLabel').textContent='FOREST ENERGY '+Math.min(100,S.energy)+'%';const hero=document.getElementById('hero');hero.style.left=(7+S.correct*8.4)+'%';document.querySelectorAll('.step').forEach((el,i)=>el.classList.toggle('done',i<S.correct));const chip=document.getElementById('rushChip'),clock=document.getElementById('rushClock');chip.classList.toggle('on',S.rush);chip.textContent=S.rush?'⚡ FOREST RUSH':'FOREST ENERGY';clock.classList.toggle('on',S.rush);if(S.rush&&S.rushDeadline){const left=Math.max(0,S.rushDeadline-performance.now()),pct=Math.max(0,Math.min(100,left/8000*100));clock.querySelector('i').style.width=pct+'%';}}
function activateRush(){S.rush=true;S.rushDeadline=performance.now()+8000;document.getElementById('instruction').textContent='⚡ FOREST RUSH • รีบส่งคำเข้าประตูเพื่อรับโบนัส';sfx('rush');}
function showWord(){if(S.index>=S.items.length){finish();return;}if(S.index===S.rushStartIndex&&!S.rush)activateRush();if(S.index>=S.rushEndIndex)S.rush=false;if(S.rush)S.rushDeadline=performance.now()+8000;const item=S.items[S.index],card=document.getElementById('wordCard');card.className='word-card';card.innerHTML=`<strong>${item.word}</strong><small>${item.thai}</small><em>CEFR ${item.level} • DRAG TO PORTAL</em>`;bindDrag(card);if(!S.rush)document.getElementById('instruction').textContent='แตะค้างแล้วลากคำศัพท์ไปยังประตูที่ถูกต้อง';}
function bindDrag(card){let sx=0,sy=0,rect=null,ghost=null,totalDist=0,lastX=0,lastY=0;card.onpointerdown=e=>{e.preventDefault();if(S.drag)return;rect=card.getBoundingClientRect();sx=e.clientX;sy=e.clientY;lastX=sx;lastY=sy;totalDist=0;card.setPointerCapture?.(e.pointerId);ghost=card.cloneNode(true);ghost.removeAttribute('id');ghost.className='drag-ghost';ghost.style.width=rect.width+'px';ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';document.body.appendChild(ghost);card.classList.add('lifting');S.drag={t:performance.now(),item:S.items[S.index],pointerId:e.pointerId};sfx('lift');};card.onpointermove=e=>{if(!S.drag||!ghost)return;e.preventDefault();const dx=e.clientX-sx,dy=e.clientY-sy;ghost.style.left=(rect.left+dx)+'px';ghost.style.top=(rect.top+dy)+'px';const step=Math.hypot(e.clientX-lastX,e.clientY-lastY);totalDist+=step;lastX=e.clientX;lastY=e.clientY;highlightPortal(e.clientX,e.clientY);if(performance.now()-S.lastSpark>65){spark(e.clientX,e.clientY);S.lastSpark=performance.now();}};card.onpointerup=e=>{if(!S.drag)return;e.preventDefault();const target=findPortal(e.clientX,e.clientY),drag=S.drag;S.drag=null;card.classList.remove('lifting');ghost?.remove();clearPortalHover();if(!target){document.getElementById('instruction').textContent='ลากให้ถึงประตู แล้วปล่อยเมื่อกรอบเรืองแสง';sfx('bad');return;}judge(target.dataset.cat,drag,totalDist,target);};card.onpointercancel=()=>{S.drag=null;card.classList.remove('lifting');ghost?.remove();clearPortalHover();};}
function findPortal(x,y){const portals=[...document.querySelectorAll('.portal')];let exact=null;for(const p of portals){const r=p.getBoundingClientRect(),pad=18;if(x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad){exact=p;break;}}if(exact)return exact;const top=Math.min(...portals.map(p=>p.getBoundingClientRect().top));if(y<top-34)return null;let nearest=null,dist=Infinity;for(const p of portals){const r=p.getBoundingClientRect(),d=Math.abs(x-(r.left+r.width/2));if(d<dist){dist=d;nearest=p;}}return dist<window.innerWidth*.28?nearest:null;}
function highlightPortal(x,y){const found=findPortal(x,y);document.querySelectorAll('.portal').forEach(p=>p.classList.toggle('hover',p===found));}
function clearPortalHover(){document.querySelectorAll('.portal').forEach(p=>p.classList.remove('hover'));}
function spark(x,y){const s=document.createElement('i');s.className='spark';s.style.left=(x-3)+'px';s.style.top=(y-3)+'px';s.style.setProperty('--sx',((Math.random()-.5)*34)+'px');s.style.setProperty('--sy',(-18-Math.random()*24)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),600);}
function floatText(text,good,el){const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='float '+(good?'good':'bad');f.textContent=text;f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+r.height/2)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),850);}
function showHint(item){clearTimeout(S.hintTimer);const hint=document.getElementById('hint');hint.textContent=`คำใบ้: “${item.word}” อยู่ในหมวด ${item.cat} • ${TH[item.cat]}`;hint.classList.add('show');S.hintTimer=setTimeout(()=>hint.classList.remove('show'),2300);}
function judge(cat,drag,dragDistance,portal){const item=S.items[S.index],card=document.getElementById('wordCard'),good=cat===item.cat,rt=Math.round(performance.now()-drag.t),rushFast=S.rush&&performance.now()<=S.rushDeadline;S.events.push({word:item.word,expected:item.cat,selected:cat,correct:good,reactionMs:rt,dragDistancePx:Math.round(dragDistance),index:S.index,rush:S.rush,rushFast});if(good){S.correct++;S.combo++;S.bestCombo=Math.max(S.bestCombo,S.combo);let gain=100+(S.combo-1)*20;if(rushFast){gain+=50;S.rushBonus+=50;}S.score+=gain;S.energy=Math.min(100,S.energy+10+(S.combo>=3?5:0));card.classList.add('correct');portal.classList.add('correct-flash');floatText('+'+gain,true,portal);document.getElementById('instruction').textContent=rushFast?'⚡ RUSH BONUS +50 • ถูกต้อง':S.combo>=3?`🔥 COMBO ×${S.combo} • ถูกต้อง`:'✓ ถูกต้อง • ผู้พิทักษ์เดินหน้าต่อ';const hero=document.getElementById('hero');hero.classList.add('jump');setTimeout(()=>hero.classList.remove('jump'),280);sfx('good');S.index++;setTimeout(()=>{portal.classList.remove('correct-flash');showWord();},560);}else{S.wrong++;S.combo=0;S.score=Math.max(0,S.score-15);S.energy=Math.max(0,S.energy-6);card.classList.add('wrong');portal.classList.add('wrong-flash');floatText('-15',false,portal);document.getElementById('instruction').textContent=`ยังไม่ใช่ ${TH[cat]} • ดูคำใบ้แล้วลองใหม่`;showHint(item);sfx('bad');setTimeout(()=>{card.classList.remove('wrong');portal.classList.remove('wrong-flash');},430);}hud();}
function finish(){clearInterval(S.timer);S.rush=false;const sec=Math.max(1,Math.floor((Date.now()-S.started)/1000)),total=S.correct+S.wrong,acc=Math.round(S.correct/Math.max(1,total)*100),perfect=S.wrong===0,bonus=perfect?300:0;S.score+=bonus;S.energy=100;const rank=perfect&&sec<=70?'S+':acc>=90?'S':acc>=80?'A':acc>=70?'B':'C',label=rank==='S+'?'Perfect Portal Master!':rank==='S'?'Excellent Semantic Classification!':rank==='A'?'Strong Category Skills!':rank==='B'?'Great Progress!':'Mission Complete — Keep Exploring!';const avg=S.events.length?Math.round(S.events.reduce((a,b)=>a+b.reactionMs,0)/S.events.length):0,avgDrag=S.events.length?Math.round(S.events.reduce((a,b)=>a+b.dragDistancePx,0)/S.events.length):0;shell(`<div class="summary"><div class="series">LEXICON X CHALLENGE • GAME 2</div><div class="rank">${rank}</div><h1>Forest Cleared!</h1><h2>Category Forest • Portal Mission</h2>${perfect?'<div class="perfect">PERFECT FOREST • +300 BONUS</div>':''}<div class="rank-label">${label}</div><div class="summary-grid"><div class="stat"><small>ACCURACY</small><strong>${acc}%</strong></div><div class="stat"><small>SCORE</small><strong>${S.score}</strong></div><div class="stat"><small>BEST COMBO</small><strong>×${Math.max(1,S.bestCombo)}</strong></div><div class="stat"><small>TIME</small><strong>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</strong></div><div class="stat"><small>RUSH BONUS</small><strong>+${S.rushBonus}</strong></div><div class="stat"><small>RANK</small><strong>${rank}</strong></div></div><div class="analytics-note">Learning analytics preview: Avg. decision ${avg} ms • Avg. drag ${avgDrag} px • ${S.wrong} mistakes • ${S.events.length} attempts</div><div class="actions"><button id="again" class="btn primary">Play Another Forest</button><button id="done" class="btn secondary">Back to Test Hub</button></div></div>`);document.getElementById('again').onclick=start;document.getElementById('done').onclick=goHub;sfx('finish');}
document.getElementById('back').onclick=goHub;document.getElementById('exit').onclick=goHub;window.CATEGORY_FOREST={version:VERSION,state:S};intro();
}());
</script>
