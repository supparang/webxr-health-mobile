<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#e8f3fb;background:#06121f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#123b5d 0,#081827 42%,#040b12 100%);overflow-x:hidden}.app{min-height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:auto;padding:12px 0}.brand strong{display:block;font-size:1.2rem;letter-spacing:.08em}.brand small{color:#81d4fa}.icon{width:42px;height:42px;border:1px solid #31546d;border-radius:14px;background:#0c2234;color:#fff;font-size:1.1rem}.screen{max-width:760px;margin:auto}.panel{background:rgba(8,27,43,.86);border:1px solid rgba(104,196,242,.25);border-radius:24px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.32);backdrop-filter:blur(12px)}.intro{text-align:center;padding:34px 20px}.xmark{font-size:3.4rem;font-weight:950;letter-spacing:-.12em;color:#5ee7ff;text-shadow:0 0 24px rgba(94,231,255,.55)}h1{margin:.35rem 0;font-size:clamp(1.75rem,6vw,2.7rem)}.lead{color:#b9ccda;line-height:1.65}.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:900;font-size:1rem}.primary{background:linear-gradient(135deg,#20c8ff,#6ef3cf);color:#062033;box-shadow:0 12px 28px rgba(32,200,255,.25)}.secondary{background:#102b40;color:#dff6ff;border:1px solid #31566f}.actions{display:grid;gap:10px;margin-top:20px}.hud{display:grid;grid-template-columns:1.3fr .8fr .8fr;gap:8px;margin-bottom:12px}.stat{background:#0b2437;border:1px solid #244a63;border-radius:15px;padding:10px}.stat small{display:block;color:#7fa9bf;font-size:.72rem}.stat strong{font-size:1rem}.instruction{text-align:center;color:#bfeeff;background:#0b2437;border-radius:14px;padding:10px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}.card{aspect-ratio:.82;border:1px solid #2b536b;border-radius:17px;background:linear-gradient(145deg,#133146,#091d2d);color:#fff;position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .44s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s;padding:0;pointer-events:none}.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .44s cubic-bezier(.2,.8,.2,1)}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:10px;backface-visibility:hidden}.back{font-weight:950;font-size:1.15rem;letter-spacing:.12em;color:#9eeeff}.back small{font-size:.58rem;color:#5d91aa;margin-top:6px}.front{transform:rotateY(180deg);background:linear-gradient(145deg,#eaf9ff,#cdeffc);color:#092235;text-align:center;font-weight:900}.front small{font-size:.66rem;color:#35627a;margin-top:7px}.card.target{border-color:#ffe36e;box-shadow:0 0 0 3px rgba(255,227,110,.22),0 0 24px rgba(255,227,110,.2)}.card.opening::after{content:"OPEN " attr(data-pct) "%";position:absolute;left:8px;right:8px;bottom:8px;padding:5px;border-radius:8px;background:linear-gradient(90deg,#5ee7ff var(--p),#18394d var(--p));font-size:.62rem;font-weight:900;z-index:5}.card.matched{border-color:#63f0b9;box-shadow:0 0 20px rgba(99,240,185,.23)}.cursor{position:fixed;left:0;top:0;width:42px;height:42px;margin:-21px;pointer-events:none;z-index:30;border:2px solid #ffea80;border-radius:50%;box-shadow:0 0 20px rgba(255,234,128,.55);transition:opacity .2s}.cursor::before,.cursor::after{content:"";position:absolute;background:#ffea80}.cursor::before{width:18px;height:2px;left:10px;top:18px}.cursor::after{height:18px;width:2px;left:18px;top:10px}.cursor span{position:absolute;inset:5px;border-radius:50%;background:conic-gradient(#5ee7ff var(--deg,0deg),transparent 0)}.feedback{text-align:center;min-height:24px;color:#9ad7ed;margin-top:10px}.summary{text-align:center}.rank{font-size:4rem;font-weight:950;color:#5ee7ff}.notice{background:#0b2437;border:1px solid #31546d;border-radius:14px;padding:12px;color:#bcd2df;margin-top:12px}@media(max-width:430px){.app{padding-left:9px;padding-right:9px}.panel{padding:12px;border-radius:19px}.grid{gap:7px}.card{border-radius:14px}.hud{gap:5px}.stat{padding:8px}.front{font-size:.82rem}.back{font-size:.9rem}}
</style>
