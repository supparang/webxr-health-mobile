<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#241246">
<title>Conversation Quest AR V2.1 • Adaptive Speaking Gate</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100925;color:#fff;font-family:system-ui,sans-serif}.boot{height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}.boot small{display:block;margin-top:8px;color:#d6cff7}
</style>
</head>
<body>
<div id="boot" class="boot"><div><strong>กำลังเตรียม Conversation Quest AR V2.1…</strong><small>Adaptive Speaking Gate</small></div></div>
<script>
(async function(){
  const boot=document.getElementById('boot');
  try{
    const response=await fetch('./conversation-quest-ar-v2.html?v=20260806-cq-v21-base',{cache:'no-store'});
    if(!response.ok)throw new Error('V2_LOAD_FAILED_'+response.status);
    let source=await response.text();

    const dialogueOld=`const DIALOGUES=[
 {line:'Good morning! How are you today?',choices:['I’m fine, thank you.','Good night.','The library is blue.'],answer:0,reply:'Great! I’m glad to hear that.'},
 {line:'Can you help me prepare for English Week?',choices:['Yes, of course.','I helped yesterday tomorrow.','No, I am a sandwich.'],answer:0,reply:'Thank you. That is very helpful.'},
 {line:'Please take these name tags to the registration desk.',choices:['Sure. I’ll take them now.','The desk is eating lunch.','I took a bus next year.'],answer:0,reply:'Excellent. The visitors will need them.'},
 {line:'A visitor cannot find the activity room. What should you say?',choices:['I can show you the way.','You should disappear.','The room is a pencil.'],answer:0,reply:'That is a polite and useful response.'},
 {line:'Thank you for helping today!',choices:['You’re welcome.','I don’t know yesterday.','Please close the breakfast.'],answer:0,reply:'Wonderful work. You completed the conversation!'}
];`;
    const dialogueNew=`const DIALOGUES=[
 {line:'Good morning! How are you today?',choices:['I’m fine, thank you.','Good night.','The library is blue.'],answer:0,reply:'Great! I’m glad to hear that.',keywords:['fine','thank']},
 {line:'Can you help me prepare for English Week?',choices:['Yes, of course.','I helped yesterday tomorrow.','No, I am a sandwich.'],answer:0,reply:'Thank you. That is very helpful.',keywords:['yes','course']},
 {line:'Please take these name tags to the registration desk.',choices:['Sure. I’ll take them now.','The desk is eating lunch.','I took a bus next year.'],answer:0,reply:'Excellent. The visitors will need them.',keywords:['sure','take','now']},
 {line:'A visitor cannot find the activity room. What should you say?',choices:['I can show you the way.','You should disappear.','The room is a pencil.'],answer:0,reply:'That is a polite and useful response.',keywords:['show','way']},
 {line:'Thank you for helping today!',choices:['You’re welcome.','I don’t know yesterday.','Please close the breakfast.'],answer:0,reply:'Wonderful work. You completed the conversation!',keywords:['welcome']}
];`;
    if(!source.includes(dialogueOld))throw new Error('DIALOGUE_PATCH_POINT_NOT_FOUND');
    source=source.replace(dialogueOld,dialogueNew);

    const simOld=`function similarity(target,heard){const a=normalize(target).split(' ').filter(Boolean),b=normalize(heard).split(' ').filter(Boolean);if(!a.length)return 0;const used=new Set();let hits=0;for(const word of a){let found=-1;for(let i=0;i<b.length;i++){if(!used.has(i)&&b[i]===word){found=i;break}}if(found>=0){used.add(found);hits++}}const coverage=hits/a.length;const lengthPenalty=Math.min(1,b.length/Math.max(1,a.length));return Math.round((coverage*.85+lengthPenalty*.15)*100)}`;
    const simNew=simOld+`\nfunction keywordResult(heard){const words=new Set(normalize(heard).split(' ').filter(Boolean));const required=DIALOGUES[index]?.keywords||[];const matched=required.filter(word=>words.has(normalize(word)));return{required,matched,passed:required.length>0&&matched.length===required.length}}`;
    if(!source.includes(simOld))throw new Error('SIMILARITY_PATCH_POINT_NOT_FOUND');
    source=source.replace(simOld,simNew);

    const resultOld=`let bestText='',bestScore=0;recognition.onresult=e=>{for(let r=e.resultIndex;r<e.results.length;r++){for(let a=0;a<e.results[r].length;a++){const text=e.results[r][a].transcript,scoreNow=similarity(selectedText,text);if(scoreNow>bestScore){bestScore=scoreNow;bestText=text}}}$('heard').textContent=\`ได้ยิน: “\${bestText}” • ความใกล้เคียง \${bestScore}%\`;$('meter').style.width=bestScore+'%'}`;
    const resultNew=`let bestText='',bestScore=0,bestKeywords={required:[],matched:[],passed:false};recognition.onresult=e=>{for(let r=e.resultIndex;r<e.results.length;r++){for(let a=0;a<e.results[r].length;a++){const text=e.results[r][a].transcript,scoreNow=similarity(selectedText,text),keysNow=keywordResult(text);if(scoreNow>bestScore||keysNow.matched.length>bestKeywords.matched.length){bestScore=scoreNow;bestText=text;bestKeywords=keysNow}}}const keyText=bestKeywords.required.length?\` • คำสำคัญ \${bestKeywords.matched.length}/\${bestKeywords.required.length}\`:'';$('heard').textContent=\`ได้ยิน: “\${bestText}” • ความใกล้เคียง \${bestScore}%\${keyText}\`;$('meter').style.width=Math.max(bestScore,bestKeywords.passed?100:0)+'%'}`;
    if(!source.includes(resultOld))throw new Error('RESULT_PATCH_POINT_NOT_FOUND');
    source=source.replace(resultOld,resultNew);

    const endOld=`recognition.onend=()=>{resetMic();if(bestScore>=70){passSpeaking(bestScore,bestText)}else if(bestText){$('feedback').className='feedback bad';$('feedback').textContent=\`ยังไม่ผ่าน (\${bestScore}%) • ฟังตัวอย่างแล้วพูดใหม่\`;speak('Please try again. '+selectedText)}else{$('feedback').className='feedback bad';$('feedback').textContent='ยังไม่ได้ยินประโยค • กดไมค์แล้วพูดใหม่'}};`;
    const endNew=`recognition.onend=()=>{resetMic();const adaptivePass=bestScore>=60||bestKeywords.passed;if(adaptivePass){const reason=bestKeywords.passed&&bestScore<60?'จับคำสำคัญครบ':\`Speech Match \${bestScore}%\`;passSpeaking(Math.max(bestScore,bestKeywords.passed?60:bestScore),bestText);$('heard').textContent+=\` • ผ่าน: \${reason}\`}else if(bestText){const missing=(bestKeywords.required||[]).filter(word=>!bestKeywords.matched.includes(word));$('feedback').className='feedback bad';$('feedback').textContent=\`ยังไม่ผ่าน (\${bestScore}%) • ลองเน้นคำ: \${missing.join(', ')||'คำสำคัญ'}\`;speak('Please try again. '+selectedText)}else{$('feedback').className='feedback bad';$('feedback').textContent='ยังไม่ได้ยินประโยค • กดไมค์แล้วพูดใหม่'}};`;
    if(!source.includes(endOld))throw new Error('ONEND_PATCH_POINT_NOT_FOUND');
    source=source.replace(endOld,endNew);

    source=source
      .replaceAll('Mandatory Speaking V2','Adaptive Speaking V2.1')
      .replaceAll('Conversation Quest AR V2','Conversation Quest AR V2.1')
      .replace('แล้วพูดประโยคที่เลือกจึงจะผ่าน','แล้วพูดประโยคที่เลือก โดยตรวจจากความใกล้เคียงหรือคำสำคัญ');

    document.open();document.write(source);document.close();
  }catch(error){
    console.error(error);
    boot.innerHTML='<div><strong>เปิดเกมไม่สำเร็จ</strong><small>'+String(error?.message||error)+'</small></div>';
  }
})();
</script>
</body>
</html>
