<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d2a">
<title>Sentence City AR V5.5 One-Screen Layout</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d2a}iframe{display:block;width:100%;height:100%;border:0;background:#070d2a}
</style>
</head>
<body>
<iframe id="game" src="./sentence-city-ar-v54.html?v=20260806-scv55-one-screen-inner" allow="camera; microphone 'none'" title="Sentence City AR Final Polish"></iframe>
<script>
(function(){
  const frame=document.getElementById('game');
  const css=`
  @media(max-width:720px){
    html,body{overflow:hidden!important}
    .app{grid-template-rows:48px minmax(0,1fr)!important;padding:env(safe-area-inset-top) 4px max(env(safe-area-inset-bottom),4px)!important}
    .top{grid-template-columns:40px 1fr 40px!important;gap:5px!important}
    .top button{height:38px!important;border-radius:11px!important}
    .brand strong{font-size:.98rem!important}
    .brand small{display:none!important}
    .screen{width:100%!important;min-height:0!important}
    .panel{padding:5px!important;border-radius:13px!important;overflow:hidden!important}
    .game{grid-template-rows:28px 46px minmax(0,1fr)!important;gap:4px!important;height:100%!important;min-height:0!important}
    .head{min-height:28px!important}
    .head strong{font-size:.78rem!important}
    .chip{padding:3px 6px!important;font-size:.54rem!important}
    .stats{gap:4px!important}
    .stat{padding:4px 6px!important;border-radius:9px!important}
    .stat small{font-size:.53rem!important}
    .stat b{font-size:.94rem!important}
    .sky{display:none!important}

    .mission{display:grid!important;grid-template-rows:auto minmax(180px,30vh) auto auto!important;gap:5px!important;min-height:0!important;overflow:hidden!important}
    .prompt{grid-template-columns:28px 1fr!important;gap:3px!important;min-height:32px!important}
    .prompt .visual{font-size:1.35rem!important}
    .prompt h3{font-size:.79rem!important;line-height:1.18!important;margin:0!important}
    .camera{height:30vh!important;min-height:180px!important;max-height:245px!important;border-width:2px!important;border-radius:12px!important}
    .status{left:6px!important;right:6px!important;bottom:5px!important;padding:6px!important;border-radius:9px!important;font-size:.7rem!important}
    .status small{font-size:.59rem!important;margin-top:1px!important}
    .toast{top:6px!important;padding:7px 10px!important;font-size:.74rem!important}

    .board{display:grid!important;grid-template-rows:auto auto auto auto auto!important;gap:4px!important;min-height:0!important;overflow:visible!important;padding:0!important}
    .board>.label{margin:0!important;font-size:.53rem!important;line-height:1!important}
    .slots,.depot{display:flex!important;flex-wrap:wrap!important;justify-content:center!important;gap:5px!important;margin:0!important}
    .slot,.word{min-width:82px!important;min-height:44px!important;padding:5px 8px!important;border-radius:12px!important;border-width:2px!important;font-size:.7rem!important;line-height:1.1!important}
    .control{position:static!important;order:initial!important;width:100%!important;min-height:46px!important;padding:7px!important;border-radius:12px!important;font-size:.82rem!important;box-shadow:none!important;margin:1px 0 0!important}
    .feedback{padding:5px 7px!important;border-radius:9px!important;font-size:.64rem!important;line-height:1.1!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
    #pointer{width:46px!important;height:46px!important;border-width:4px!important}
    #carry{padding:7px 10px!important;border-radius:11px!important;font-size:.72rem!important;max-width:140px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
  }
  @media(max-width:390px), (max-height:760px){
    .app{grid-template-rows:44px minmax(0,1fr)!important}
    .top button{height:35px!important}
    .mission{grid-template-rows:auto minmax(155px,27vh) auto auto!important;gap:3px!important}
    .camera{height:27vh!important;min-height:155px!important;max-height:210px!important}
    .prompt{min-height:27px!important}
    .prompt h3{font-size:.72rem!important}
    .slot,.word{min-width:74px!important;min-height:39px!important;padding:4px 6px!important;font-size:.64rem!important}
    .control{min-height:42px!important;font-size:.76rem!important}
    .feedback{font-size:.58rem!important;padding:4px!important}
  }`;
  function inject(){
    try{
      const doc=frame.contentDocument;
      if(!doc||!doc.head)return;
      const old=doc.getElementById('v55MobileLayout');
      if(old)old.remove();
      const style=doc.createElement('style');
      style.id='v55OneScreenLayout';
      style.textContent=css;
      doc.head.appendChild(style);
    }catch(error){console.error('V5.5 one-screen layout injection failed',error)}
  }
  frame.addEventListener('load',inject);
})();
</script>
</body>
</html>
