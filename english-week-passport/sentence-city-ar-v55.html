<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d2a">
<title>Sentence City AR V5.5 Mobile Layout</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d2a}iframe{display:block;width:100%;height:100%;border:0;background:#070d2a}
</style>
</head>
<body>
<iframe id="game" src="./sentence-city-ar-v54.html?v=20260806-scv55-inner" allow="camera; microphone 'none'" title="Sentence City AR Final Polish"></iframe>
<script>
(function(){
  const frame=document.getElementById('game');
  const css=`
  @media(max-width:720px){
    html,body{overflow:hidden!important}
    .app{grid-template-rows:50px minmax(0,1fr)!important;padding:env(safe-area-inset-top) 4px env(safe-area-inset-bottom)!important}
    .top{grid-template-columns:42px 1fr 42px!important;gap:5px!important}
    .top button{height:40px!important;border-radius:12px!important}
    .brand strong{font-size:1rem!important}
    .brand small{font-size:.64rem!important;white-space:nowrap!important}
    .screen{width:100%!important}
    .panel{padding:6px!important;border-radius:14px!important;overflow:hidden!important}
    .game{grid-template-rows:30px 50px minmax(0,1fr)!important;gap:5px!important;height:100%!important;min-height:0!important}
    .head{min-height:30px!important}
    .head strong{font-size:.82rem!important}
    .chip{padding:4px 7px!important;font-size:.58rem!important}
    .stats{gap:5px!important}
    .stat{padding:5px 7px!important;border-radius:10px!important}
    .stat small{font-size:.57rem!important}
    .stat b{font-size:1rem!important}
    .sky{display:none!important}
    .mission{grid-template-rows:auto minmax(210px,43vh) minmax(0,1fr) auto!important;gap:6px!important;min-height:0!important;overflow:hidden!important}
    .prompt{grid-template-columns:32px 1fr!important;gap:4px!important;min-height:36px!important}
    .prompt .visual{font-size:1.55rem!important}
    .prompt h3{font-size:.86rem!important;line-height:1.25!important}
    .camera{min-height:210px!important;height:43vh!important;max-height:350px!important;border-width:2px!important;border-radius:13px!important}
    .status{left:7px!important;right:7px!important;bottom:6px!important;padding:8px!important;border-radius:10px!important;font-size:.78rem!important}
    .status small{font-size:.65rem!important}
    .toast{top:8px!important;padding:8px 12px!important;font-size:.8rem!important}
    .board{min-height:0!important;overflow-y:auto!important;overscroll-behavior:contain!important;gap:6px!important;padding:2px 2px 70px!important}
    .label{font-size:.58rem!important;margin-top:1px!important}
    .slots,.depot{gap:7px!important}
    .slot,.word{min-width:96px!important;min-height:54px!important;padding:8px 10px!important;border-radius:14px!important;border-width:2px!important;font-size:.82rem!important}
    .control{position:sticky!important;bottom:0!important;z-index:6!important;min-height:54px!important;padding:10px!important;border-radius:14px!important;font-size:.9rem!important;box-shadow:0 -8px 20px #0b1238cc!important}
    .feedback{padding:7px!important;border-radius:10px!important;font-size:.72rem!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
    #pointer{width:48px!important;height:48px!important;border-width:4px!important}
    #carry{padding:8px 11px!important;border-radius:12px!important;font-size:.78rem!important;max-width:150px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
  }
  @media(max-width:390px){
    .camera{height:40vh!important;min-height:200px!important}
    .slot,.word{min-width:88px!important;min-height:50px!important;padding:7px 8px!important;font-size:.76rem!important}
    .brand small{display:none!important}
  }`;
  function inject(){
    try{
      const doc=frame.contentDocument;
      if(!doc||!doc.head)return;
      if(doc.getElementById('v55MobileLayout'))return;
      const style=doc.createElement('style');
      style.id='v55MobileLayout';
      style.textContent=css;
      doc.head.appendChild(style);
      const observer=new MutationObserver(()=>{
        if(!doc.getElementById('v55MobileLayout'))doc.head.appendChild(style);
      });
      observer.observe(doc.documentElement,{childList:true,subtree:true});
    }catch(error){console.error('V5.5 layout injection failed',error)}
  }
  frame.addEventListener('load',inject);
})();
</script>
</body>
</html>
